<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's coming next — Studio OS</title>
<meta name="description" content="A calm look at what's scheduled and coming up next for your website.">
<link rel="stylesheet" href="/cms.css">
<style>
  header .sub{color:var(--soft);font-size:15.5px;margin:0;max-width:54ch}

  .group{margin-top:32px}
  .group.waiting{margin-top:36px;padding-top:26px;border-top:1px solid var(--line)}
  .glabel{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:0 0 13px}

  .item{display:flex;gap:15px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:11px}
  .ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px}
  .group.waiting .ic{background:var(--warn-soft)}
  .ib{flex:1;min-width:0}
  .it{font-size:15.5px;font-weight:600;margin:0;line-height:1.35;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .when{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .iwhy{margin:5px 0 0;font-size:14px;color:var(--soft);line-height:1.45}
  .iact{margin-top:11px}
  a.act{display:inline-block;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;transition:background .15s,border-color .15s}
  a.act:hover{background:var(--accent-soft);border-color:var(--accent)} a.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .center{text-align:center;padding:56px 20px}
  .center .mark{font-size:40px;display:block;margin-bottom:12px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px}
  .center .sub{color:var(--soft);font-size:15px;max-width:42ch;margin:0 auto}
  .foot{margin-top:32px;color:var(--faint);font-size:12.5px;text-align:center}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/today.html">← Back to Today</a>
    <h1>What’s coming next</h1>
    <p class="sub" id="sub">A calm look at what’s scheduled and coming up for your website. Only things that are genuinely expected — nothing guessed.</p>
  </header>
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
// CMS-UX-5 — Upcoming Changes, rendered.
// Consumes ONLY the existing read-only projection: GET /upcoming.
// A future schedule, not a task list — every item is genuinely expected.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN = SUPABASE_URL + "/functions/v1/presence";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLIENT = new URLSearchParams(location.search).get('client') || '';
let TOKEN = "";
sb.auth.onAuthStateChange(function(_e,s){ if(s&&s.access_token) TOKEN=s.access_token; });

const H = () => ({ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN, 'x-dds-scope-site':CLIENT });
async function apiGet(p){ const r = await fetch(FN+p, { headers:H() }); if(r.status===401) return Promise.reject(401); return r.ok ? r.json() : Promise.reject(r.status); }
function href(link){ if(!link) return null; if(!CLIENT) return link; const [b,h]=String(link).split('#'); return b + (b.includes('?')?'&':'?') + 'client=' + encodeURIComponent(CLIENT) + (h?'#'+h:''); }

function itemHtml(it){
  const link = href(it.action_href);
  const act = (it.action_label && link) ? `<div class="iact"><a class="act" href="${esc(link)}">${esc(it.action_label)}</a></div>` : '';
  const when = it.when ? `<span class="when">${esc(it.when)}</span>` : '';
  return `<div class="item">
    <span class="ic" aria-hidden="true">${esc(it.icon || '•')}</span>
    <div class="ib">
      <p class="it">${esc(it.title)} ${when}</p>
      ${it.why ? `<p class="iwhy">${esc(it.why)}</p>` : ''}
      ${act}
    </div>
  </div>`;
}
function groupHtml(g){
  return `<section class="group ${g.key==='waiting'?'waiting':''}">
    <p class="glabel">${esc(g.label)}</p>
    ${(g.items||[]).map(itemHtml).join('')}
  </section>`;
}

function render(u){
  if(!u || !u.groups || !u.groups.length){
    $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">☕</span>
      <h2>Nothing scheduled right now.</h2>
      <p class="sub">There’s nothing on the calendar for your website at the moment. When you schedule an update or something’s coming up, it’ll appear here.</p>
      <p style="margin-top:22px"><a class="link" href="${esc(href('/presence.html')||'/presence.html')}">Open your website →</a></p></div>`;
    return;
  }
  if(u.next_when){ $('sub').textContent = `Your next update is ${u.next_when}. Everything here is genuinely expected — nothing guessed.`; }
  $('main').innerHTML = u.groups.map(groupHtml).join('')
    + `<p class="foot">This is a look ahead — nothing here changes your website on its own. Anything you can act on links to where you can do it.</p>`;
}

function signedOut(){ $('sub').textContent=''; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2>Sign in to see what’s coming up.</h2><p class="sub">Your website’s schedule lives with your account — sign in to look ahead.</p><p style="margin-top:22px"><a class="link" href="/studio.html">Sign in →</a></p></div>`; }
function trouble(){ $('main').innerHTML = `<div class="center"><h2>We couldn’t load your schedule just now.</h2><p class="sub">Nothing’s wrong with your website — this is only this page. Please refresh in a moment.</p></div>`; }

(async function init(){
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    const res = await apiGet('/upcoming');
    render(res && res.data);
  }catch(e){ if(e === 401){ signedOut(); return; } trouble(); }
})();
</script>
</body>
</html>
