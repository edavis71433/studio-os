<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Record — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="One client record — the whole relationship from first enquiry through delivery, in one place.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically). Only the six activity-
     type accents are page-local — picked to survive BOTH themes. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* the six timeline type accents (icon ring + connector) */
    --act-message:var(--dds-p,#5b3fa0);--act-call:var(--dds-good,#33664b);--act-task:var(--dds-warn,#775d31);--act-system:var(--dds-faint,#746b8a);
    --act-email:#31708e;--act-note:#8a5a83;
  }
  @media (prefers-color-scheme:dark){:root{--act-email:#85b7cf;--act-note:#c9a3c2}}
  :root[data-theme="light"]{--act-email:#31708e;--act-note:#8a5a83}
  :root[data-theme="dark"]{--act-email:#85b7cf;--act-note:#c9a3c2}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--dds-w-app,1280px);margin:0 auto;padding:var(--dds-s7,32px) var(--dds-s5,20px) 90px}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:4px}
  a.back{display:inline-flex;align-items:center;gap:var(--dds-s1,4px);color:var(--soft);text-decoration:none;font-size:13.5px;font-weight:600}
  a.back:hover{color:var(--p)}

  /* ── record header (Lightning anatomy: object icon · name · status) ── */
  .rec-head{margin-top:var(--dds-s4,16px);display:flex;gap:var(--dds-s4,16px);align-items:flex-start}
  .obj-ic{width:44px;height:44px;border-radius:var(--dds-r-lg,10px);background:var(--p);color:#fff;display:grid;place-items:center;font-size:20px;flex:0 0 auto;box-shadow:var(--shadow)}
  .obj-ic.customer{background:var(--good)}
  .rec-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,4vw,32px);letter-spacing:-.01em;margin:0;line-height:1.2}
  .rec-sub{color:var(--soft);font-size:14px;margin-top:var(--dds-s1,4px);display:flex;flex-wrap:wrap;gap:6px var(--dds-s4,16px);align-items:center}
  .rec-sub a{color:var(--p);text-decoration:none} .rec-sub a:hover{text-decoration:underline}
  .statuschip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:var(--dds-s1,4px) 10px;background:var(--p-soft);color:var(--p);text-transform:capitalize}
  .statuschip.customer{background:var(--good-soft);color:var(--good)}

  /* ── highlights panel: label-over-value tiles ── */
  .hl-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);overflow:hidden;margin-top:var(--dds-s4,16px);box-shadow:var(--shadow)}
  .hl{background:var(--card);padding:10px var(--dds-s4,16px);min-width:0}
  .hl-k{font-size:12px;color:var(--faint);font-weight:500;display:flex;align-items:center;gap:6px}
  .hl-v{font-family:var(--sans);font-size:17.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
  .hl-v .word{text-transform:capitalize}
  .hl-edit{border:none;background:none;color:var(--faint);cursor:pointer;font-size:12px;padding:0 2px;border-radius:4px}
  .hl-edit:hover{color:var(--p)}
  .hl input{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:var(--dds-s1,4px) var(--dds-s2,8px);margin-top:var(--dds-s1,4px)}

  /* ── action bar: the record's verbs, always one click away ── */
  .actbar{display:flex;flex-wrap:wrap;gap:var(--dds-s2,8px);margin-top:var(--dds-s4,16px)}
  .actbar:empty{display:none}
  .abtn{font-family:inherit;font-size:13.5px;font-weight:500;border-radius:var(--dds-r,8px);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:var(--dds-s2,8px) var(--dds-s4,16px);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:var(--dds-t-fast,120ms) var(--dds-ease,ease-out);box-shadow:var(--shadow)}
  .abtn:hover{border-color:var(--p);color:var(--p)}
  .abtn.primary{background:var(--p);color:#fff;border-color:var(--p)} .abtn.primary:hover{background:var(--p-deep);color:#fff}
  /* billing rows: status chip + the row's own buttons */
  .brow{flex-wrap:wrap}
  .racts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .rbtn{font-family:inherit;font-size:12.5px;font-weight:500;border-radius:var(--dds-r,8px);border:1px solid var(--line);background:transparent;color:var(--ink);padding:var(--dds-s1,4px) var(--dds-s3,12px);cursor:pointer;text-transform:none;letter-spacing:0;display:inline-flex;align-items:center}
  .rbtn:hover{border-color:var(--p);color:var(--p)} .rbtn:disabled{opacity:.5;cursor:default}
  .link-btn{border:none;background:none;color:var(--p);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;padding:0;text-transform:none;letter-spacing:0;border-radius:0}
  .link-btn:hover{text-decoration:underline}
  .bform{background:var(--card);border:1px solid var(--p);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s4,16px) var(--dds-s4,16px);margin-bottom:var(--dds-s3,12px);box-shadow:var(--shadow)}
  .brow2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .brow2 label{display:flex;flex-direction:column;gap:var(--dds-s1,4px);font-size:12.5px;color:var(--faint);font-weight:600}
  .brow2 input,.brow2 select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:var(--dds-s2,8px) 10px;width:100%}
  .brow2 input:focus,.brow2 select:focus{outline:none;border-color:var(--p)}
  .bacts{display:flex;gap:var(--dds-s2,8px);justify-content:flex-end;margin-top:var(--dds-s3,12px)}
  /* sales item 77: Record a payment — opens under its invoice */
  .payform{margin:6px 0 4px;border-color:var(--p)}
  .payform .pf-h{font-weight:600;font-size:14px;margin:0 0 10px;color:var(--ink)}
  .pf-how{border:0;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  .pf-how legend{font-size:12.5px;color:var(--faint);font-weight:600;padding:0;margin-bottom:6px;float:left;width:100%}
  .pf-chip{position:relative;display:inline-flex}
  .pf-chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
  .pf-chip span{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;cursor:pointer;background:var(--bg);color:var(--ink)}
  .pf-chip input:checked+span{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  .pf-chip input:focus-visible+span{outline:2px solid var(--p);outline-offset:2px}
  .pf-rcpt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--ink);white-space:normal}
  .pf-rcpt input{width:18px;height:18px;accent-color:var(--p)}
  .pf-note-h{font-size:12.5px;margin:6px 0 0}
  .pf-private{display:block;margin-top:10px;font-size:13px}
  .pf-private input{display:block;width:100%;margin-top:4px}
  .pf-what{font-size:12.5px;margin:10px 0 0;white-space:normal}
  .btable tr.paying td{background:var(--p-soft)}
  @media (max-width:640px){.pf-chip span{min-height:44px}}

  /* ── Path (Lightning chevrons, dds skin) ── */
  .pathcard{margin-top:var(--dds-s4,16px);background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);padding:var(--dds-s3,12px) var(--dds-s4,16px)}
  .pathrow{display:flex;gap:var(--dds-s3,12px);align-items:center;flex-wrap:wrap}
  .path{display:flex;flex:1 1 340px;min-width:0}
  .path button.pstep{flex:1;min-width:0;border:none;font-family:inherit;font-size:12.5px;font-weight:500;padding:var(--dds-s2,8px) var(--dds-s4,16px);cursor:default;
    background:var(--bg);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
  .path button.pstep:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);border-radius:var(--dds-r,8px) 0 0 var(--dds-r,8px)}
  .path button.pstep:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,11px 50%);border-radius:0 var(--dds-r,8px) var(--dds-r,8px) 0}
  .path button.pstep.done{background:var(--good-soft);color:var(--good)}
  .path button.pstep.canback{cursor:pointer}
  .path button.pstep.canback:hover{filter:brightness(.96)}
  .path button.pstep.current{background:var(--p);color:#fff;cursor:pointer}
  .path button.pstep.current:hover{filter:brightness(1.06)}
  .path button.pstep.lost-terminal{background:var(--warn-soft);color:var(--warn)}
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) —
     same treatment as pipeline.html's Path, kept in sync by hand */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .path button.pstep.current{color:#171320}}
  :root[data-theme="dark"] .path button.pstep.current{color:#171320}
  .path-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .path-guide{margin-top:10px;font-size:13.5px;color:var(--soft)}
  .path-guide b{color:var(--ink);font-weight:600}
  /* sales item 124: what to do now, under the stage bar (the same block as pipeline.html's) */
  .stage-note{display:flex;gap:18px;align-items:flex-start;margin-top:12px;padding:18px 22px 18px 24px;border-radius:16px;background:var(--p-soft);border-left:5px solid var(--p);box-shadow:0 6px 18px -6px rgba(27,21,37,.08)}
  .stage-note .sn-ic{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#7a5bd6,var(--p))}
  .stage-note .sn-body{flex:1;min-width:0}
  .stage-note .sn-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .stage-note h3{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.25;margin:0;color:var(--ink)}
  .stage-note .sn-chip{font-size:12px;font-weight:600;color:var(--p);background:var(--card);border-radius:999px;padding:3px 10px}
  .stage-note .sn-fact{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--good-soft);color:var(--good);font-size:14px}
  .stage-note .sn-fact b{font-weight:600}
  .stage-note .sn-steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .stage-note .sn-steps li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45;color:var(--ink)}
  .stage-note .sn-ck{flex:0 0 auto;margin-top:1px;color:var(--p)}
  .stage-note .sn-foot{margin:10px 0 0;font-size:12.5px;color:var(--faint)}
  .stage-note .sn-edit{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--dds-line-strong,#d6d4e2);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:36px;cursor:pointer}
  .stage-note .sn-edit:hover{background:var(--card);border-color:var(--p)}
  .stage-note .sn-text{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:14.5px;line-height:1.6;padding:12px 14px;margin-top:10px;border:2px solid color-mix(in srgb,var(--p) 45%,transparent);border-radius:10px;background:var(--card);color:var(--ink);resize:vertical}
  .stage-note .sn-text:focus{outline:2px solid var(--p);outline-offset:1px}
  .stage-note .sn-help{font-size:12.5px;color:var(--soft);margin:8px 0 0}
  .stage-note .sn-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .stage-note .sn-reset{margin-left:auto;font:inherit;font-size:13px;font-weight:600;color:var(--p);background:none;border:none;padding:6px 0;cursor:pointer}
  @media (max-width:640px){.stage-note{flex-wrap:wrap;gap:12px;padding:16px}.stage-note .sn-ic{width:36px;height:36px}.stage-note .sn-edit{width:100%;min-height:44px}.stage-note .sn-reset{margin-left:0}}
  .path-confirm{margin-top:10px;display:flex;gap:var(--dds-s2,8px);align-items:center;font-size:13.5px;flex-wrap:wrap}
  .terminal-chip{font-size:12px;font-weight:700;border-radius:999px;padding:var(--dds-s1,4px) var(--dds-s3,12px)}
  .terminal-chip.won{background:var(--good-soft);color:var(--good)}
  .terminal-chip.lost{background:var(--warn-soft);color:var(--warn)}

  /* ── two-region body ── */
  .body{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--dds-s5,20px);margin-top:var(--dds-s5,20px);align-items:start}
  @media (max-width:1000px){.body{grid-template-columns:minmax(0,1fr)}.rail{order:-1}}

  .tabs{display:flex;gap:var(--dds-s1,4px);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{border:none;background:transparent;font-family:inherit;font-size:14.5px;font-weight:500;color:var(--soft);padding:var(--dds-s3,12px) var(--dds-s4,16px);cursor:pointer;border-bottom:2.5px solid transparent;border-radius:0;white-space:nowrap;transition:var(--dds-t-fast,120ms) var(--dds-ease,ease-out)}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{color:var(--p);border-bottom-color:var(--p)}
  #tabbody{margin-top:var(--dds-s5,20px)}

  /* related-list cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s4,16px) var(--dds-s5,20px);box-shadow:var(--shadow);margin-bottom:var(--dds-s4,16px)}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .card-h .t{font-weight:700;font-size:14.5px}
  .rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:var(--dds-s2,8px) 2px;border-top:1px solid var(--line);font-size:14px;min-width:0}
  .rrow:first-of-type{border-top:none}
  .rrow .rt{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .rrow .rt .s{color:var(--faint);font-size:12.5px;display:block}
  .schip{display:inline-flex;align-items:center;font-size:12px;font-weight:500;border-radius:999px;padding:2px var(--dds-s2,8px);background:var(--p-soft);color:var(--p);white-space:nowrap;text-transform:capitalize}
  .schip.good{background:var(--good-soft);color:var(--good)}
  .schip.warn{background:var(--warn-soft);color:var(--warn)}
  .schip.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  .schip.info{background:var(--dds-info-soft,#e8f1fb);color:var(--dds-info,#2a6fb5)}   /* Oct 2026: the Processing money state */
  .kv{display:grid;grid-template-columns:auto 1fr;gap:var(--dds-s2,8px) var(--dds-s4,16px);font-size:14.5px}
  .kv .k{color:var(--faint);font-weight:600}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .fact{background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:10px var(--dds-s3,12px)}
  .fact .k{font-size:12px;color:var(--faint);font-weight:500}
  .fact .v{font-family:var(--sans);font-size:18px;margin-top:2px;font-weight:600;font-variant-numeric:tabular-nums}
  .fact .v small{font-family:var(--sans);font-size:12px;color:var(--soft);font-weight:400}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:var(--dds-s1,4px) var(--dds-s3,12px)}
  .chip .d{width:7px;height:7px;border-radius:50%}
  .chip.healthy{background:var(--good-soft);color:var(--good)} .chip.healthy .d{background:var(--good)}
  .chip.attention{background:var(--warn-soft);color:var(--warn)} .chip.attention .d{background:var(--warn)}
  .chip.new,.chip.quiet{background:var(--p-soft);color:var(--p)} .chip.new .d,.chip.quiet .d{background:var(--p)}
  h2{font-size:12.5px;color:var(--faint);font-weight:500;margin:0 0 var(--dds-s3,12px);display:flex;align-items:center;justify-content:space-between}
  section{margin-top:var(--dds-s6,24px)} section:first-child{margin-top:0}

  /* ── the activity rail ── */
  .acard{padding:var(--dds-s4,16px) var(--dds-s4,16px)}
  .composer-tabs{display:flex;gap:var(--dds-s1,4px);border-bottom:1px solid var(--line);margin:0 -4px}
  .composer-tabs button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--soft);padding:var(--dds-s2,8px) 10px;cursor:pointer;border-bottom:2.5px solid transparent;border-radius:0;white-space:nowrap}
  .composer-tabs button.on{color:var(--p);border-bottom-color:var(--p)}
  .composer-pane{padding:var(--dds-s3,12px) 0 var(--dds-s1,4px)}
  .composer-pane textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:10px var(--dds-s3,12px);resize:vertical;min-height:64px}
  .composer-pane textarea:focus{outline:none;border-color:var(--p)}
  .composer-pane input[type=text],.composer-pane input[type=date]{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:var(--dds-s2,8px) 10px}
  .composer-row{display:flex;gap:var(--dds-s2,8px);align-items:center;margin-top:var(--dds-s2,8px);flex-wrap:wrap}
  .composer-row .spacer{flex:1}
  .kindchips{display:flex;gap:6px;flex-wrap:wrap}
  .kindchips button{font-size:12.5px;padding:6px var(--dds-s3,12px);border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer;font-weight:500}
  .kindchips button.on{background:var(--p-soft);color:var(--p);border-color:var(--p)}
  /* sales item 85: Follow up on [day], in the same step as the log */
  .fu-chip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer;font-weight:500}
  .fu-chip:hover{border-color:var(--p);color:var(--p)}
  @media (max-width:767px){.fu-chip,.fu-row input[type=date]{min-height:44px}}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--dds-r,8px);overflow:hidden}
  .seg button{border:none;border-radius:0;padding:6px var(--dds-s3,12px);font-size:12.5px;background:transparent;color:var(--soft);font-family:inherit;font-weight:500;cursor:pointer}
  .seg button.on{background:var(--p-soft);color:var(--p)}

  .fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--dds-s4,16px)}
  .fchips button{font-size:12px;font-weight:500;padding:var(--dds-s1,4px) var(--dds-s3,12px);border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer;font-family:inherit}

  /* ── Visual refresh (2026-10): the hub in the new look. These rules come last

// ── Oct 2026 benchmark (item 2): money in four states — ONE formula. A VERBATIM

function moneyState(i,todayYmd,pending){

// sales item 74: a person's email standing in words, from the record header's email_status
// ({reason, since}); '' when emails reach them. Invoices, receipts and documents still arrive after an unsubscribe.
function emailStatusWords(s){
  if(!s||!s.reason)return'';
  const t=s.since?new Date(s.since):null;
  const on=t&&!isNaN(t)?' on '+t.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
  if(s.reason==='opt_out')return 'Unsubscribed from emails'+on+'. Invoices, receipts and documents still reach them.';
  if(s.reason==='complaint')return 'Marked an email as spam'+on+', so no emails go to them.';
  return 'Emails to this address bounce'+(on?' (since'+on.slice(3)+')':'')+', so no emails go to them.';
}

// opens a small inline form on the Billing tab or focuses the composer in the
// rail. Deal-backed actions render only when the record has a deal. ──
function renderActions(){
  const host=$('actbar'); if(!host)return;
  const ids=idParams(); const d=(DEAL&&DEAL.deal)||null;
  const btns=[];
  // ONE LINK (benchmark 2026-10, item 5): with BOTH a proposal and an agreement
  // drafted on an open deal, the headline act is "Send proposal & agreement" —
  // one email, one page. The per-document sends sit under More.
  const both=!!(d&&sendBothDocs());
  if(ids.deal){
    if(both)btns.push({id:'act-send-both',label:'Send proposal & agreement',primary:true,on:()=>openBilling('both')});
    // One filled button per record (experience review #4): the Path's next step
    // wears it, so Send invoice is outlined unless the Path has nothing to offer
    // (no forward step — a won, lost or terminal deal).
    btns.push({id:'act-invoice',label:'Send invoice',primary:!both&&!pathHasAction(d),on:()=>openBilling('invoice')});

    const draftCon=d&&(DEAL.contracts||[]).find(k=>k.status==='draft');
    if(draftCon&&stage!=='won'&&stage!=='lost')btns.push({id:'act-agreement',label:'Send agreement',on:()=>openBilling('contract:'+draftCon.id)});
  }

  if(ids.deal||hasPerson()){btns.push({id:'act-log',label:'Log a call',on:()=>focusComposer('logcall')});btns.push({id:'act-task',label:'Add to-do',on:()=>focusComposer('task')});}
  if(canEmail())btns.push({id:'act-email',label:'Email',on:()=>focusComposer('email')});

  // item 80 (Figma 264:1136): with an address and no project to message them through, Email stands in
  // front and Message goes under More; a client with a project keeps Message there (item 41)
  const FRONT=['act-log',canEmail()&&!ids.project?'act-email':'act-message',both?'act-send-both':'act-invoice'];

// back: Escape hands focus to the More button when it was inside the menu (B21: the menu hid
// around the focused item and a keyboard user was left on nothing)
function closeMore(back){const m=$('act-menu');const b=$('act-more');if(m&&!m.hidden){const inside=m.contains(document.activeElement);m.hidden=true;if(b){b.setAttribute('aria-expanded','false');if(back===true&&inside)b.focus();}}}

// The pair the one "Send proposal & agreement" button sends: the newest draft
// proposal (not superseded) AND the newest draft agreement, on an open deal.
// Null when either is missing — then the per-document sends stand on their own.
function sendBothDocs(){
  const d=DEAL&&DEAL.deal; if(!d)return null;
  if(d.stage==='won'||d.stage==='lost'||d.converted_client_id)return null;
  const isSup=(p)=>Array.isArray(p.line_items)&&p.line_items.some(el=>el&&typeof el==='object'&&el.__meta__&&el.__meta__.superseded_by);
  const prop=(DEAL.proposals||[]).find(p=>p.status==='draft'&&!isSup(p));
  const con=(DEAL.contracts||[]).find(k=>k.status==='draft');
  return (prop&&con)?{prop,con}:null;
}

  // visual refresh: four icon tiles — money first (value · paid · outstanding),

  const mb=moneyBuckets(inv,recTodayYmd());
  const value=d.expected_value_cents||hl.value_cents; if(value)tiles.push({k:'Deal value',v:esc(fmtC(value)),ico:'value',tone:'',s:esc(d.stage?stageLabel(d.stage)+((STAGE_CHANCE[d.stage]!=null&&d.stage!=='won'&&d.stage!=='lost')?' · '+STAGE_CHANCE[d.stage]+'% chance':''):(d.title&&d.title!==((REC.header||{}).name||'')?d.title:''))});   // bold redesign: where it is and its chance (the title is the path's and the Deal tab's)
  // item 108 (J4): retainer payments are paid money too — counted, and named in the sub-line
  if(d.id){const last=paid.slice().sort((a,b)=>String(b.paid_at||'').localeCompare(String(a.paid_at||'')))[0]; const rp=retainerPaidNow();
    const lastSub=last?(last.title||'Payment')+(last.paid_at?' · '+atLabel(last.paid_at):''):'';
    const sub=rp.cents?(got?'Incl. '+fmtC(rp.cents)+' retainer':'Retainer')+(rp.last_at?' · '+atLabel(rp.last_at):''):lastSub;
    tiles.push({k:'Paid',v:esc(fmtC(got+rp.cents)),ico:'paid',tone:'good',s:sub?esc(sub):'Nothing yet'});}
  const owedSub=owed?[mb.upcoming.count?mb.upcoming.count+' upcoming':'',mb.overdue.count?mb.overdue.count+' overdue':'',mb.processing.count?fmtC(mb.processing.cents)+' processing':''].filter(Boolean).join(' · ')||'1 invoice':(mb.processing.count?fmtC(mb.processing.cents)+' processing':'All paid up');
  if(d.id||owed)tiles.push({k:'Outstanding',v:esc(fmtC(owed)),ico:'owed',tone:owed?'warn':(mb.processing.count?'info':''),s:esc(owedSub)});
  const ns=(d.id?liveNextStep(d):hl.next_step)||'';
  // Phase 3 (stage-aware): with no next step set, the tile suggests the stage's
  // own "do next" (a won deal says "open their project", never a blank dash)
  const suggested=(d.id&&!ns&&d.stage)?guideNow(d.stage).action:'';
  if(d.id||ns)tiles.push({k:'Next step',v:esc(ns||(suggested?'Suggested':'—')),ico:'next',tone:'info',edit:!!d.id,s:(ns&&d.next_step_at)?esc(dueLabel(d.next_step_at)):(ns?'':(suggested?esc(suggested):'Set one'))});   // inline-editable when a real deal field backs it
  // bold redesign: the fifth fact — when you last spoke (the deal's last contact). item 98 (B4): the
  // date comes BESIDE the deal in the deal read (as the Deal tab reads it), never inside the deal row,
  // so looking for it there said "Nothing logged yet" on every record
  const lastTalk=DEAL&&DEAL.last_contacted_at;
  if(d.id)tiles.push({k:'Last talked',v:lastTalk?esc(when(lastTalk)):'—',ico:'phone',tone:'',s:lastTalk?'':'Nothing logged yet'});
  if(!d.id&&p&&p.health)tiles.push({k:'Health',v:`<span class="word">${esc(p.health==='attention'?'Needs attention':p.health==='new'?'Getting set up':p.health)}</span>`,ico:'health',tone:p.health==='attention'?'warn':'good',s:''});
  if(!d.id&&p)tiles.push({k:'Website',v:esc(siteWord(p)),ico:'site',tone:'',s:''});
  if(!tiles.length){host.innerHTML='';return;}
  host.innerHTML=`<div class="hl-panel">${tiles.slice(0,5).map((t,i)=>`<div class="hl"><span class="ico ${t.tone||''}">${svg(t.ico)}</span><div class="hl-main"><div class="hl-k">${t.k}${t.edit?`<button class="hl-edit" data-hledit aria-label="Edit next step">✎</button>`:''}</div><div class="hl-v" data-hlv="${i}">${t.v}</div>${t.s?`<div class="hl-s">${t.s}</div>`:''}</div></div>`).join('')}</div>`;
  const eb=host.querySelector('[data-hledit]');

    tile.querySelector('[data-save]').addEventListener('click',save);

// ── Sales item 124: what to do now, under the stage bar ─────────────────────
// The studio's own note for the deal's stage (a starter note until it writes one), with
// the one line the deal itself knows above it: signed, declined, expired, a project under
// way. Edit note changes it for every deal at that stage (PUT /sales/stages { note }, a
// setting, so data-needs="configure"). Tapping the current stage hides it, as the tip
// strip did. Kept in step with pipeline.html's deal (stageNoteHtml there).
const SN_FLAG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg>';
const SN_CK='<svg class="sn-ck" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>';
function stageFact(stage,d,signed){
  const out=(stage!=='won'&&stage!=='lost')?proposalOutcome():null;
  if(out)return out.state==='declined'?{tip:'They declined your proposal.',action:'Revise it and send it again, or mark the deal not a fit.'}:{tip:'Your proposal expired before they answered.',action:'Revise it and send it again.'};
  if(stage==='contract'&&signed&&!d.converted_client_id)return{tip:'They’ve signed.',action:'Convert them to a customer to start the project.'};
  if(stage==='won'){
    const proj=(PROJ&&PROJ.project)||null, pct=Number(PROJ&&PROJ.progress&&PROJ.progress.pct)||0;
    if(proj&&proj.status==='complete')return{tip:'Their project is done.',action:'Check in with them, or ask for a review.'};
    if(proj&&pct>0)return{tip:`Their project is ${pct}% along.`,action:'Open their project to see what’s left.'};
  }
  return null;
}
function stageNoteHtml(stage,d,signed){
  const text=STAGE_NOTES&&STAGE_NOTES[stage], fact=stageFact(stage,d,signed);
  // what the deal itself knows (declined, expired, signed) shows even when the notes couldn't be read
  if(!text&&!fact)return'';
  const label=stageLabel(stage), mine=!!(STAGE_NOTES_CUSTOM&&STAGE_NOTES_CUSTOM[stage]);
  const body=!text?'':NOTE_EDIT
    ?`<label class="sr-only" for="snText">What to do now at ${esc(label)}, one step a line</label><textarea id="snText" class="sn-text" rows="${Math.min(9,Math.max(3,text.split('\n').length+1))}">${esc(text)}</textarea>
      <p class="sn-help">One step a line, up to eight. Everyone on your team sees this on every deal at ${esc(label)}.</p>
      <div class="sn-acts"><button type="button" class="primary" id="snSave">Save for every deal</button><button type="button" id="snCancel">Cancel</button>${mine?'<button type="button" class="sn-reset" id="snReset">Put back the starter note</button>':''}</div>`
    :`<ul class="sn-steps">${text.split('\n').map(l=>`<li>${SN_CK}<span>${esc(l)}</span></li>`).join('')}</ul>
      <p class="sn-foot">${mine?'Your studio’s note':'A starter note'} for every deal at ${esc(label)}. Tap ${esc(label)} on the bar to hide it.</p>`;
  return `<section class="stage-note" aria-labelledby="snHead"><span class="sn-ic">${SN_FLAG}</span><div class="sn-body"><div class="sn-head"><h3 id="snHead">What to do now</h3><span class="sn-chip">${esc(label)}</span></div>${fact?`<p class="sn-fact"><b>${esc(fact.tip)}</b> ${esc(fact.action)}</p>`:''}${body}</div>${NOTE_EDIT||!text?'':'<button type="button" class="sn-edit" id="snEdit" data-needs="configure">Edit note</button>'}</section>`;
}
async function saveStageNote(stage,text,btn){
  if(btn)btn.disabled=true;
  const r=await apiAg('/sales/stages','PUT',{note:{stage,text}});
  if(!r.ok){if(btn)btn.disabled=false;toast((r.body&&r.body.message)||'That note didn’t save — please try again.');return;}
  const dd=(r.body&&r.body.data)||{};
  if(dd.notes){STAGE_NOTES=dd.notes;STAGE_NOTES_CUSTOM=dd.notes_custom||{};}
  NOTE_EDIT=false;renderPath();
  toast(String(text||'').trim()?'Saved for every deal at '+stageLabel(stage)+'.':'The starter note is back.');
  const e=$('snEdit');if(e)e.focus();
}
function wireStageNote(stage){
  const ed=$('snEdit');if(ed)ed.addEventListener('click',()=>{NOTE_EDIT=true;renderPath();const t=$('snText');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}});
  const cancel=()=>{NOTE_EDIT=false;renderPath();const e=$('snEdit');if(e)e.focus();};
  const cn=$('snCancel');if(cn)cn.addEventListener('click',cancel);
  const sv=$('snSave');if(sv)sv.addEventListener('click',()=>saveStageNote(stage,$('snText').value,sv));
  const rs=$('snReset');if(rs)rs.addEventListener('click',()=>saveStageNote(stage,'',rs));
  const tx=$('snText');if(tx)tx.addEventListener('keydown',(e)=>{if(e.key==='Escape'){e.preventDefault();cancel();}else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();if(sv)sv.click();}});
}
// ── Path: the chevron stage bar (only when the record has a deal) ───────────
// Does the Path (renderPath) draw a filled action for this deal — Mark stage
// complete, or Convert to customer at contract+signed? When it does, it is the
// record's one filled button and the action bar's Send invoice steps back.
function pathHasAction(d){
  if(!d||!d.stage)return false;
  const stage=String(d.stage);
  if(stage==='won'||stage==='lost')return false;
  if(proposalOutcome())return true;   // item 107 (J3): "Revise the proposal" is the path's filled button
  const signed=(DEAL.contracts||[]).some(c=>c.status==='signed');
  if(stage==='contract'&&signed)return true;
  const fwd=(BOARD_NEXT[stage]||[])[0];
  return !!(fwd&&fwd!=='lost'&&PATH_STEPS.indexOf(fwd)>PATH_STEPS.indexOf(stage));
}
function renderPath(){
  const host=$('pathwrap'); if(!host)return;
  const d=DEAL&&DEAL.deal; if(!d||!d.stage){host.innerHTML='';return;}
  const stage=String(d.stage);
  const signed=(DEAL.contracts||[]).some(c=>c.status==='signed');
  const terminal=stage==='won'||stage==='lost';
  const curIdx=PATH_STEPS.indexOf(stage);
  // exactly TWO steps are interactive: the current stage (toggles the guidance
  // strip) and the ONE legal BOARD_NEXT back-target. Everything else renders
  // non-interactive — no pointer, no hover, out of the tab order.
  const steps=PATH_STEPS.map((s,i)=>{
    const done=stage==='won'||(curIdx>-1&&i<curIdx);
    const current=s===stage;
    const canBack=!terminal&&(BOARD_NEXT[stage]||[]).includes(s)&&done;
    const cls=(done?'done':current?'current':(stage==='lost'?'lost-terminal':''))+(canBack?' canback':'');
    const state=done?'complete':current?'current stage':'upcoming';
    const attrs=canBack?'':current?` aria-expanded="${GUIDE_OPEN?'true':'false'}"`:' tabindex="-1" aria-disabled="true"';
    const hint=canBack?'. Activate to move the deal back here.':current?'. Activate to show or hide the stage guidance.':'';
    return `<button class="pstep ${cls}" data-stage="${s}"${attrs} aria-label="${esc(stageLabel(s))} — ${state}${hint}">${esc(stageLabel(s))}</button>`;
  }).join('')
  // visual refresh: the bar is the whole relationship, not just the sale —
  // Won · Project · Growth follow the four sales stages (read-only markers;
  // the sales stages keep their interactivity rules above).
  +(function(){
    const won=stage==='won'; const proj=(PROJ&&PROJ.project)||null;
    const projDone=won&&proj&&proj.status==='complete';
    const projCur=won&&!projDone;
    const mk=(label,cls)=>`<span class="pstep ${cls}" aria-hidden="true">${label}</span>`;
    if(stage==='lost')return '';
    return mk('Won',won?'done':'')+mk('Project',projDone?'done':projCur?'current':'')+mk('Growth',projDone?'current':'');
  })();
  // the right-side action: forward = "Mark Stage as Complete" (BOARD_NEXT[stage][0]
  // when it's a forward move); at contract+signed it becomes Convert (won is
  // convert-only — the heavy machinery stays on pipeline.html, we don't rebuild it).
  const fwd=(BOARD_NEXT[stage]||[])[0];
  const fwdOk=fwd&&fwd!=='lost'&&PATH_STEPS.indexOf(fwd)>curIdx;
  let side='';
  const outcome=proposalOutcome();
  if(stage==='won')side='';   // the lifecycle bar already shows Won — no second badge
  else if(stage==='lost')side=`<span class="terminal-chip lost">Not a fit</span>`;
  // item 107 (J3): after a decline or an expiry, moving forward is the wrong advice — revising is the next step
  else if(outcome)side=`<a class="btnlink primary" href="${esc(agHref('pipeline.html','deal='+encodeURIComponent(d.id)))}">Revise the proposal →</a>`;
  else if(stage==='contract'&&signed)side=`<a class="btnlink primary" href="${esc(agHref('pipeline.html','deal='+encodeURIComponent(d.id)))}">Convert to customer →</a>`;
  else if(fwdOk)side=`<button class="primary" id="markComplete">Move to ${esc(stageLabel(fwd))} →</button>`;   // bold redesign: names the next stage (was "Mark stage complete")
  else side=`<span class="muted" style="font-size:13px">Get the agreement signed to convert</span>`;
  host.innerHTML=`<div class="pathcard">
    <div class="pathrow">
      <div class="path" role="group" aria-label="Deal stages">${steps}</div>
      <div class="path-side">${side}</div>
    </div>
    ${PENDING_BACK?`<div class="path-confirm">Move this deal back to <b>${esc(stageLabel(PENDING_BACK))}</b>?<button class="primary" id="backGo">Move back</button><button id="backNo">Cancel</button></div>`:''}
  </div>${GUIDE_OPEN?stageNoteHtml(stage,d,signed):''}`;
  // item 57: on a phone the strip scrolls sideways — open it on the current
  // stage, not on a cut-off "New lead" with the current one out of sight
  const pth=host.querySelector('.path'),curStep=host.querySelector('.path .pstep.current');
  if(pth&&curStep&&pth.scrollWidth>pth.clientWidth){const dx=curStep.getBoundingClientRect().left-pth.getBoundingClientRect().left;pth.scrollLeft=Math.max(0,pth.scrollLeft+dx-(pth.clientWidth-curStep.offsetWidth)/2);}
  const mc=$('markComplete');
  if(mc)mc.addEventListener('click',()=>moveStage(fwd,mc));
  host.querySelectorAll('.pstep.canback').forEach(b=>b.addEventListener('click',()=>{
    PENDING_BACK=b.getAttribute('data-stage'); renderPath();   // only the honest one-back move renders interactive
  }));
  const cur=host.querySelector('.pstep.current');
  if(cur)cur.addEventListener('click',()=>{GUIDE_OPEN=!GUIDE_OPEN;NOTE_EDIT=false;renderPath();});
  wireStageNote(stage);   // sales item 124
  const bg=$('backGo'); if(bg)bg.addEventListener('click',()=>{const to=PENDING_BACK;PENDING_BACK='';moveStage(to,bg);});
  const bn=$('backNo'); if(bn)bn.addEventListener('click',()=>{PENDING_BACK='';renderPath();});
}
async function moveStage(to,btn){
  if(!to||!DEAL||!DEAL.deal)return;
  if(btn)btn.disabled=true;
  const r=await apiAg('/sales/deals/'+encodeURIComponent(DEAL.deal.id)+'/stage','POST',{to});
  if(r.ok){
    DEAL.deal=r.body.data||DEAL.deal;
    PENDING_BACK='';   // any pending back-confirm strip is now against the OLD stage — drop it
    NOTE_EDIT=false;   // item 124: a half-written note was for the stage it left
    toast('Moved to '+stageLabel(to)+'.');
    renderHighlights();renderPath();renderSummaryCards();   // B12: the Deal card beside it kept the old stage and chance
    if(TAB==='deal')showTab(TAB,true);   // the Deal pane shows stage/next-step — keep it honest
    loadActivity();
  }
  else{toast((r.body&&r.body.message)||'Couldn’t move the stage.');if(btn)btn.disabled=false;renderPath();}
}

function setTabUrl(tab){ const q=QP(); q.set('tab',tab); history.replaceState(null,'', '/crm.html?'+q.toString()); }

    html+=`<div class="facts">`+facts.map(f=>`<div class="fact"><div class="k">${esc(f[0])}</div><div class="v">${esc(f[1])} <small>${esc(f[2])}</small></div></div>`).join('')+`</div></div></section>`;

// Edit the contact inline (PATCH /sales/contacts/:id — the existing path, kept).
// The owner's CUSTOM FIELDS edit here too: the Details tab has always DISPLAYED

// them left the only fillable path on contacts.html. Same PATCH, `custom` bag.
// `notes` stays off the form deliberately — that column doubles as the
// connect-on-signup machine marker (CONNECT_INTENT_TAG, routes/sales.ts).
function editContact(host){
  const c=(DETAIL&&DETAIL.c)||{}; const cid=DETAIL&&DETAIL.cid;
  const defs=(DETAIL&&DETAIL.cf)||[]; const cv=c.custom||{};
  const inp=(id,val,type,extra)=>`<input id="${id}" type="${type||'text'}" value="${esc(val==null?'':val)}"${extra||''} style="width:100%;box-sizing:border-box;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px">`;
  const lab=(id,label)=>`<label class="mut" for="${id}" style="font-size:12.5px;color:var(--faint);display:block;margin-top:10px">${label}</label>`;
  const field=(id,label,val,type)=>lab(id,label)+inp(id,val,type);
  const cfField=(f)=>{
    const id='eccf-'+f.key, v=cv[f.key];
    if(f.type==='select'){
      const opts=['<option value="">—</option>'].concat((f.choices||[]).map(o=>`<option value="${esc(o)}"${String(v==null?'':v)===String(o)?' selected':''}>${esc(o)}</option>`)).join('');
      return lab(id,esc(f.label||f.key))+`<select id="${id}" data-cf="${esc(f.key)}" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px">${opts}</select>`;
    }
    return lab(id,esc(f.label||f.key))+inp(id,v,f.type==='number'?'number':(f.type==='date'?'date':'text'),` data-cf="${esc(f.key)}"`);
  };
  host.innerHTML=`<section><h2>Edit contact</h2><div class="card">
    ${field('ec-name','Name',c.name)}${field('ec-company','Business name',c.company)}${field('ec-title','Job title',c.job_title)}${field('ec-email','Email',c.email,'email')}${field('ec-phone','Phone',c.phone,'tel')}${field('ec-phone2','Second phone',c.phone2,'tel')}
    ${lab('ec-address','Address')}${inp('ec-address',(c.address||{}).street,'text',' placeholder="Street" autocomplete="off"')}
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:8px">${inp('ec-city',(c.address||{}).city,'text',' placeholder="City" aria-label="City" autocomplete="off"')}${inp('ec-state',(c.address||{}).state,'text',' placeholder="State" aria-label="State" autocomplete="off"')}${inp('ec-zip',(c.address||{}).zip,'text',' placeholder="ZIP" aria-label="ZIP" autocomplete="off"')}</div>
    ${lab('ec-tags','Tags')}<div id="ec-tagbox"></div>
    ${lab('ec-found','How did they find you?')}<select id="ec-found" class="dds-pick">${['','Google','Referral','Word of mouth','Social','Repeat client','Website','Other'].map(o=>`<option value="${esc(o)}"${(c.found_via||'')===o?' selected':''}>${esc(o||'Not recorded')}</option>`).join('')}</select>
    ${defs.map(cfField).join('')}
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:14px"><button id="ec-cancel">Cancel</button><button class="primary" id="ec-save">Save</button></div></div></section>
    <section><div class="card"><p class="muted" style="margin:0 0 10px;font-size:13.5px">Removing a contact takes them off your contact list. Their deals, agreements, invoices and projects are never deleted with them.</p>
    <button id="ec-del" data-needs="delete" style="border-color:transparent;color:var(--bad)">Delete this contact</button></div></section>`;
  const ecTags=window.ddsListKit?window.ddsListKit.tagInput($('ec-tagbox'),Array.isArray(c.tags)?c.tags:[],{id:'ec-tags',label:'Tags'}):null;   // item 89
  $('ec-cancel').onclick=()=>loadDetails(host);
  $('ec-save').onclick=async()=>{
    const body={name:$('ec-name').value.trim(),company:$('ec-company').value.trim(),email:$('ec-email').value.trim(),phone:$('ec-phone').value.trim(),found_via:$('ec-found').value,   // item 69
      job_title:$('ec-title').value.trim(),phone2:$('ec-phone2').value.trim(),   // item 89
      address:{street:$('ec-address').value.trim(),city:$('ec-city').value.trim(),state:$('ec-state').value.trim(),zip:$('ec-zip').value.trim()},tags:ecTags?ecTags.get():undefined};
    if(defs.length){const custom={};host.querySelectorAll('[data-cf]').forEach(el=>{custom[el.getAttribute('data-cf')]=el.value;});body.custom=custom;}
    const btn=$('ec-save'); btn.disabled=true;
    const r=await apiAg('/sales/contacts/'+cid,'PATCH',body);
    // Every failure names itself — a 409 (two contacts, one address) is the one
    // an operator can act on, so it keeps the server's own wording.
    if(r.ok){CONTACT_CACHE=null;toast(r.body&&(r.body.warning==='custom_unavailable'||r.body.warning==='found_via_unavailable'||r.body.warning==='fields_unavailable')?((r.body.message)||'Saved.'):'Saved.');loadDetails(host);refreshWho();}
    else{toast((r.body&&r.body.message)||(r.status?('Couldn’t save — the server answered '+r.status+'.'):'Couldn’t save — we couldn’t reach the server.'));btn.disabled=false;}
  };
  // Two-step delete, same contract as contacts.html: the unconfirmed DELETE is a
  // dry run that writes nothing and returns what's attached; the confirm names it.
  $('ec-del').onclick=async()=>{
    const who=c.name||c.email||c.phone||'this contact';
    const btn=$('ec-del'); btn.disabled=true;
    const pre=await apiAg('/sales/contacts/'+cid,'DELETE');
    btn.disabled=false;
    if(pre.ok&&pre.body&&pre.body.data&&pre.body.data.already){toast(who+' was already removed.');location.href='/contacts.html';return;}
    if(pre.status!==409){toast((pre.body&&pre.body.message)||(pre.status?('We couldn’t check what’s attached to '+who+' — the server answered '+pre.status+'. Nothing was deleted.'):'We couldn’t reach the server. Nothing was deleted.'));return;}
    if(!confirm('Remove '+(pre.body.name||who)+'?\n\n'+(pre.body.message||'')))return;
    btn.disabled=true;
    const d=await apiAg('/sales/contacts/'+cid+'?confirm=1','DELETE');
    if(!d.ok){toast((d.body&&d.body.message)||((pre.body.name||who)+' was NOT removed — the server answered '+(d.status||'nothing')+'.'));btn.disabled=false;return;}
    const kept=(d.body&&d.body.data&&d.body.data.kept_items)||[];
    toast(kept.length?((pre.body.name||who)+' removed — their '+kept.join(', ')+' stayed.'):((pre.body.name||who)+' removed.'));
    setTimeout(()=>{location.href='/contacts.html';},900);
  };
}

// ── Deal tab: a related-list card — read-only rows + links into pipeline.html
// (the proposal/contract/invoice EDITORS live there; they do not get rebuilt). ──
function renderDealTab(host){
  if(!DEAL){host.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';return;}
  if(DEAL.error||!DEAL.deal){host.innerHTML='<p class="muted">Couldn’t load the deal just now.</p>';return;}
  const d=DEAL.deal||{}; const link=agHref('pipeline.html','deal='+encodeURIComponent(d.id||''));
  const propChip=(s)=>s==='accepted'?'good':s==='declined'?'bad':s==='sent'?'':'warn';
  const conChip=(s)=>s==='signed'?'good':s==='sent'?'':'warn';
  let html=`<section><div class="card"><div class="card-h"><span class="t">${esc(d.title||'Deal')}</span><a class="link" href="${esc(link)}">Open in pipeline →</a></div><div class="kv">`;
  const rows=[];
  if(d.expected_value_cents)rows.push(['Value',fmtC(d.expected_value_cents)]);
  if(d.stage)rows.push(['Stage',stageLabel(d.stage)]);
  if(d.expected_close)rows.push(['Expected close',dueLabel(d.expected_close)||d.expected_close]);   // B21: "Nov 30", as the Deal card says it — it showed 2026-11-30
  if(d.next_step)rows.push(['Next step',d.next_step+(d.next_step_at?' · '+dueLabel(d.next_step_at):'')]);
  if(DEAL.last_contacted_at)rows.push(['Last contacted',when(DEAL.last_contacted_at)]);
  html+=rows.map(r=>`<div class="k">${esc(r[0])}</div><div>${esc(r[1])}</div>`).join('')||'<div class="muted">No details yet.</div>';
  html+=`</div></div></section>`;
  // Stage-aware "what now": one honest line + the one button that matters.
  // A won deal points at billing and the project, never at an unsent draft.
  const inv=DEAL.invoices||[]; const open=invWaiting(inv); const paid=inv.filter(v=>invState(v)==='paid');
  const owed=open.reduce((a,b)=>a+(b.amount_cents||0),0);
  const signed=(DEAL.contracts||[]).some(c=>c.status==='signed');
  const ret=retainerPaidNow();   // item 108 (J4): retainer payments are paid money too
  const outcome=proposalOutcome();
  let now='';
  if(d.stage==='won'){
    const allPaid=paid.reduce((a,b)=>a+(b.amount_cents||0),0)+ret.cents;
    now=owed?`${fmtC(owed)} is awaiting payment across ${open.length} invoice${open.length===1?'':'s'}.`:(allPaid?`All ${fmtC(allPaid)} paid so far${ret.cents?`, ${fmtC(ret.cents)} of it from the retainer`:''}. Send the next invoice when a milestone lands.`:'Nothing invoiced yet.');
    now+=` <button class="link-btn" data-go="billing">Open Billing →</button>`;
  }else if(outcome){
    // item 107 (J3): a declined or expired proposal is not "with them"
    const p=outcome.p; const day=outcome.state==='declined'?(p.decided_at?' on '+atLabel(p.decided_at):''):(p.expires_at?' on '+atLabel(p.expires_at):'');
    now=(outcome.state==='declined'?`They declined your proposal${esc(day)}.`:`Your proposal expired${esc(day)} before they answered, so its link no longer opens.`)+` Revise it and send it again. <a class="link" href="${esc(link)}">Revise in pipeline →</a>`;
  }else if(d.stage==='contract'){
    now=signed?'Agreement signed. Request the deposit, then convert them to a customer.':'The agreement is out for signature.';
    now+=` <button class="link-btn" data-go="billing">Open Billing →</button>`;
  }else if(d.stage==='proposal'){ now='Your proposal is with them. <button class="link-btn" data-go="billing">See proposals →</button>'; }
  else if(d.stage==='lost'){ now='Marked not a fit. The record stays so you can pick it back up.'; }
  if(now)html+=`<section><h2>What now</h2><div class="card"><p style="font-size:14.5px;margin:0">${now}</p></div></section>`;
  const sum=(label,n,extra)=>`<div class="rrow"><span class="rt">${label}<span class="s">${extra}</span></span><button class="link-btn" data-go="billing">Billing →</button></div>`;
  // item 107 (J9): the total leaves voided invoices out, as the Money card does
  const live=inv.filter(v=>v.status==='open'||v.status==='paid');
  const ests=DEAL.estimates||[]; const recs=(DEAL.recurring||[]).filter(s=>s.status==='active'||s.status==='paused');
  html+=`<section><h2>Documents</h2><div class="card">`
    +(ests.length?sum('Estimates',0,ests.map(e=>esc(e.title||'Estimate')+' · '+esc(estWord(e)[0].toLowerCase())).join(' · ')):'')   // item 108 (J6)
    +sum('Proposals',0,(DEAL.proposals||[]).length?(DEAL.proposals||[]).map(p=>esc(p.title||'Proposal')+' · '+esc(propWord(p)[0].toLowerCase())).join(' · '):'None yet')
    +sum('Agreement',0,(DEAL.contracts||[]).length?(DEAL.contracts||[]).map(c=>esc(c.title||'Agreement')+' · '+esc(c.status||'draft')).join(' · '):'None yet')
    +sum('Invoices',0,inv.length?`${live.length} · ${fmtC(live.reduce((a,b)=>a+(b.amount_cents||0),0))} total${owed?' · '+fmtC(owed)+' open':''}${inv.length>live.length?' · '+(inv.length-live.length)+' voided':''}`:'None yet')
    +(recs.length?sum('Recurring invoice',0,recs.map(s=>esc(s.title||'Invoice')+' · '+esc(fmtC(s.amount_cents))+' '+esc(everyWord(s.every))+(s.status==='paused'?' · paused':'')).join(' · ')):'')
    +`</div></section>`;
  // Sales review item 26: a repeat customer's deals as a list when there is more than one.
  const relD=(REC&&Array.isArray(REC.related_deals))?REC.related_deals:[];
  if(relD.length>1){
    html+=`<section id="allDeals"><h2>All deals · ${relD.length}</h2><div class="card">`+relD.map(r=>{
      const cur=String(r.id)===String(d.id||'');
      const bits=[stageLabel(r.stage)]; if(r.value_cents)bits.push(fmtC(r.value_cents));
      return `<div class="rrow"><span class="rt">${esc(r.title||'Deal')}<span class="s">${esc(bits.join(' · '))}${cur?' · shown above':''}</span></span><a class="link" href="${esc(agHref('pipeline.html','deal='+encodeURIComponent(r.id)))}">Open →</a></div>`;
    }).join('')+`</div></section>`;
  }
  host.innerHTML=html;
  host.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>showTab(b.getAttribute('data-go'))));
}

// ── Billing tab: the money, with its actions, ON the record ──────────────────
// Proposals · Agreement · Invoices · Retainer. Every row carries the verb that
// goes with it (Send / Resend · Copy link · View / print · Void). New invoice,
// deposit and retainer open as small inline forms. The proposal and agreement
// EDITORS, payment-schedule builder and templates stay on pipeline.html (linked),
// so nothing there is rebuilt — the routes below are the same ones it calls.
function renderBillingTab(host){
  if(!DEAL){host.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';return;}
  if(DEAL.error||!DEAL.deal){host.innerHTML='<p class="muted">Couldn’t load billing just now.</p>';return;}
  const d=DEAL.deal||{}; const link=agHref('pipeline.html','deal='+encodeURIComponent(d.id||''));
  const c=DEAL.contact||REC.header||{}; const noEmail=!(c&&c.email);
  const propChip=(s)=>s==='accepted'?'good':s==='declined'?'bad':s==='sent'?'':'warn';
  const conChip=(s)=>s==='signed'?'good':s==='sent'?'':'warn';
  const inv=(DEAL.invoices||[]); const open=invWaiting(inv); const paid=inv.filter(v=>invState(v)==='paid');
  const owed=open.reduce((a,b)=>a+(b.amount_cents||0),0); const got=paid.reduce((a,b)=>a+(b.amount_cents||0),0);
  const act=(attrs,label,title)=>`<button type="button" class="rbtn" ${attrs}${title?` title="${esc(title)}"`:''}>${label}</button>`;
  let html='';
  // visual refresh: the money facts live in the header tiles now (value · paid ·
  // outstanding) — the tab opens straight on the invoices.
  if(noEmail)html+=`<p class="muted" style="margin:0 0 12px;font-size:13.5px">There’s no email on this client, so nothing can be emailed — links are copied for you to send. Add their email under Details.</p>`;
  // ONE LINK (benchmark 2026-10, item 5): both drafted → one filled "Send
  // proposal & agreement"; the per-document sends and Request deposit go under
  // More, and "+ Invoice" steps back to a quiet button (one filled per screen).
  const both=sendBothDocs();
  if(both)html+=`<section id="sendBoth"><div class="card"><p class="muted" style="margin:0 0 10px;font-size:13.5px">The proposal and the agreement are drafted. Send them together — one email, one link: they accept, sign, then pay the deposit on one page.</p>
    <span class="racts" style="display:inline-flex;gap:6px;align-items:center"><button type="button" class="rbtn primary" id="sendBothBtn" data-send-both="1" data-prop="${esc(both.prop.id)}" data-con="${esc(both.con.id)}">Send proposal &amp; agreement</button><span class="more"><button type="button" class="rbtn" id="sendMore" aria-haspopup="true" aria-expanded="false" aria-controls="sendMoreMenu">More ▾</button><div class="more-menu" id="sendMoreMenu" hidden><button type="button" class="abtn" data-send-prop="${esc(both.prop.id)}">Send the proposal only</button><button type="button" class="abtn" data-send-con="${esc(both.con.id)}">Send the agreement only</button><button type="button" class="abtn" data-bform="deposit">Request deposit</button></div></span></span></div></section>`;
  // invoices + the new-invoice / deposit forms
  html+=`<section><h2>Invoices <span class="sec-acts" style="display:flex;gap:6px">${both?'':'<button type="button" class="rbtn" data-bform="deposit">Request deposit</button>'}<a class="rbtn" href="${esc(link)}#schedule" style="text-decoration:none">Payment schedule</a><button type="button" class="rbtn${both?'':' primary'}" data-bform="invoice">+ Invoice</button></span></h2>
    <div id="bform"></div>`;
  // item 81: who the invoices are billed to, and the address they print — one line, Edit beside it
  if(inv.length||!noEmail){const bt=billedToLine();html+=`<p class="muted" id="billedTo" style="margin:0 0 10px;font-size:13px">${bt.text}${bt.can?` <button type="button" class="link-btn" data-edit-address>${bt.has?'Edit':'Add their address'}</button>`:''}</p>`;}
  html+=inv.length?`<div class="card tcard"><table class="btable"><thead><tr><th>Invoice</th><th>Status</th><th class="amt">Amount</th><th>Due</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>`+inv.map(v=>{
    // item 81: the studio's running number leads the name; a part payment names the invoice it paid toward
    const no=invNo(v.number), parent=v.payment_for?inv.find(x=>x.id===v.payment_for):null;
    const name=v.payment_for?esc('Part payment'+(parent&&invNo(parent.number)?' · '+invNo(parent.number):'')):(no?esc(no)+' · ':'')+esc(v.title||(v.purpose==='deposit'?'Deposit':'Invoice'));
    // Oct 2026 (item 2): the chip is the money state word — Paid · Processing ·
    // Upcoming · Overdue — in its one colour; sent-ness moves to the sub-line.
    const st=invState(v);
    let sub=esc(v.payment_for?(parent?parent.title||'':''):v.purpose==='deposit'?'Initial deposit':(v.description||v.purpose||''));
    let state, acts='', due='', dueCls='';
    // item 77: a payment recorded by hand says how it came in, and can be undone (it changes the books, so delete)
    if(st==='paid'){state=`<span class="schip good">Paid</span>`;due=v.paid_at?esc(atLabel(v.paid_at)):'';
      sub=(sub?sub+' · ':'')+esc(PAY_WORDS[v.paid_method]||'Paid online')+(v.paid_note?' · '+esc(v.paid_note):'')+(v.paid_private_note?' · <span title="Only you see this. It is not on their receipt.">Private: '+esc(v.paid_private_note)+'</span>':'');
      if(v.paid_method)acts+=act(`data-undo-pay="${esc(v.id)}" data-needs="delete"`,'Undo','Recorded by mistake? The invoice goes back to unpaid');}
    else if(!st){state=`<span class="schip" style="background:var(--bg);color:var(--faint)">Voided</span>`;}
    else if(st==='processing'){state=`<span class="schip info">Processing</span>`;sub=(sub?sub+' · ':'')+'Payment on its way';due=v.due_date?esc(dueLabel(v.due_date)):'';}   // the client paid — nothing to resend or void
    else{state=`<span class="schip ${MONEY_TONE[st]}">${MONEY_WORD[st]}</span>`;
      const parts=inv.filter(x=>x.payment_for===v.id&&x.status==='paid');   // item 77: part payments already came off it
      if(parts.length)sub=(sub?sub+' · ':'')+esc(fmtC(parts.reduce((a,b)=>a+(b.amount_cents||0),0)))+' paid so far';
      if(!v.stripe_url)sub=(sub?sub+' · ':'')+(parts.length?'Send it for a link for what’s left':'Not sent yet');
      due=v.due_date?esc(dueLabel(v.due_date)):'Due now'; dueCls=st==='overdue'?'due':'';
      acts+=act(`data-pay-inv="${esc(v.id)}"`,'Record payment','Paid by check, cash, bank transfer or Zelle? Mark it paid here');
      acts+=act(`data-send-inv="${esc(v.id)}"`,v.stripe_url?'Resend':'Send');
      if(v.stripe_url)acts+=act(`data-copy="${esc(v.stripe_url)}"`,'Copy link');
      acts+=act(`data-void-inv="${esc(v.id)}" data-needs="delete"`,'Void','Withdraw this invoice — the payment link stops working');}
    acts+=act(`data-pdf="invoices:${esc(v.id)}"`,'PDF','Download it as a PDF — the same copy the client gets');   // item 82
    return `<tr class="brow" data-inv-row="${esc(v.id)}"><td><span class="rt">${name}${sub?`<span class="s">${sub}</span>`:''}</span></td><td>${state}</td><td class="amt">${esc(fmtC(v.amount_cents))}</td><td class="${dueCls}">${due}</td><td class="racts"><span class="racts">${acts}</span></td></tr>`;
  }).join('')+`</tbody></table></div><div id="payhost"></div>`:`<div class="card"><p class="muted" style="font-size:13.5px">No invoices yet. Send one, or request a deposit.</p></div>`;
  html+=`</section>`;
  // item 108 (J6): estimates — a price before anything is agreed (drafted on the deal page;
  // sent, copied, turned into a proposal or billed from here, by the same routes)
  const ests=DEAL.estimates||[];
  if(Array.isArray(DEAL.estimates)&&ests.length){
    html+=`<section id="bEstimates"><h2>Estimates <a class="rbtn" href="${esc(link)}" style="text-decoration:none">+ Estimate (in pipeline)</a></h2><div class="card">`+ests.map(e=>{
      const [w,tone]=estWord(e); let acts='';
      if(e.status==='draft'&&!noEmail)acts+=act(`data-send-est="${esc(e.id)}"`,'Send to client','Emails the estimate with an Approve button');
      else if(e.status==='draft')acts+=act(`data-send-est="${esc(e.id)}"`,'Get the link');
      else if(e.status==='sent'&&!estExpired(e))acts+=act(`data-link-est="${esc(e.id)}"`,'Copy link');
      if(e.status!=='draft'&&!e.proposal_id&&!e.invoice_id)acts+=act(`data-est-prop="${esc(e.id)}"`,'Turn into a proposal','Drafts a proposal from these lines — nothing is sent')+act(`data-est-inv="${esc(e.id)}"`,'Bill it','Drafts an invoice for this total — press Send on it when you’re ready');
      acts+=act(`data-doc="estimates:${esc(e.id)}"`,'View');
      if(e.status==='draft')acts+=act(`data-del-est="${esc(e.id)}" data-needs="delete"`,'Delete','Remove this draft — it was never sent');
      const bits=[];
      if(e.status==='approved'&&e.decided_at)bits.push('Approved '+atLabel(e.decided_at));
      else if(e.status==='declined')bits.push('Not now'+(e.decided_at?' · '+atLabel(e.decided_at):''));
      else if(estExpired(e))bits.push('Expired '+atLabel(e.expires_at)+', so the link no longer opens');
      else if(e.status==='sent'&&e.expires_at)bits.push('Good until '+atLabel(e.expires_at));
      if(e.decided_note)bits.push('Their note: “'+e.decided_note+'”');
      if(e.proposal_id)bits.push('Turned into a proposal');else if(e.invoice_id)bits.push('Billed as an invoice');
      return `<div class="rrow brow"><span class="rt">${esc(e.title||'Estimate')}<span class="s">${esc([fmtC(e.total_cents!=null?e.total_cents:e.subtotal_cents)].concat(bits).join(' · '))}</span></span><span class="racts"><span class="schip ${tone}">${esc(w)}</span>${acts}</span></div>`;
    }).join('')+`</div></section>`;
  }
  // proposals
  html+=`<section><h2>Proposals <a class="rbtn" href="${esc(link)}" style="text-decoration:none">+ Proposal (in pipeline)</a></h2><div class="card">`;
  const props=DEAL.proposals||[];
  html+=props.length?props.map(p=>{
    let acts='';
    // Phase 3 (stage-aware): a won or lost deal never pushes an unsent draft
    const closed=d.stage==='won'||d.stage==='lost'||!!d.converted_client_id;
    // item 107 (J3): an expired proposal's link no longer opens — no Copy link; a declined or

// one send path per document kind — same routes pipeline.html uses
async function billingSend(path,okLabel,body){
  const r=await apiAg(path,'POST',body||{});

  const b=r.body||{}; const url=b.url||(b.data&&b.data.url)||'';
  if(url&&navigator.clipboard)navigator.clipboard.writeText(url).catch(()=>{});
  // item 107 (J5): sending an agreement can add the deposit request it promises — say so, as the deal page does
  const dep=b.deposit||(b.data&&b.data.deposit)||null;

}

// item 107 (J2): what the accepted proposal still has to bill — its total less every invoice
// already raised on the deal (open or paid, a deposit included; recurring ones are their own
// bill). Mirrors lib/invoice_billing.ts leftToBill, which the server bills from. Null: none accepted.
function leftOfProposal(){
  const acc=((DEAL&&DEAL.proposals)||[]).filter(p=>p.status==='accepted').sort((a,b)=>String(b.decided_at||'').localeCompare(String(a.decided_at||'')))[0];
  if(!acc)return null;
  const total=acc.total_cents!=null?Number(acc.total_cents)||0:Number(acc.subtotal_cents)||0;
  const billed=((DEAL&&DEAL.invoices)||[]).filter(v=>(v.status==='open'||v.status==='paid')&&!v.recurring_id).reduce((a,b)=>a+(Number(b.amount_cents)||0),0);

// item 81: the studio's running invoice number — "#0013"; '' before the number exists (APPLY-0167)
const invNo=(n)=>{const v=Math.trunc(Number(n));return v>0?'#'+String(v).padStart(4,'0'):'';};

// item 82: a document as its PDF, saved under its own name (the same copy the client gets)
async function downloadPdf(b){
  const [t,id]=b.getAttribute('data-pdf').split(':'); b.disabled=true;
  try{
    const r=await apiAg('/sales/'+t+'/'+id+'/document'); const u=r.ok&&r.body&&r.body.pdf_url;
    if(!u){toast('Couldn’t make the PDF just now.');return;}

    const blob=new Blob([await f.arrayBuffer()],{type:'application/pdf'});
    const v=t==='invoices'?((DEAL&&DEAL.invoices)||[]).find(x=>x.id===id):null;
    const name=v?((v.status==='paid'?'Receipt':v.purpose==='deposit'?'Deposit-request':'Invoice')+'-'+(invNo(v.number).slice(1)||'copy')+'.pdf'):(t==='contracts'?'Agreement':t==='estimates'?'Estimate':'Proposal')+'.pdf';
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},5000);
  }catch(_){toast('Couldn’t download the PDF just now.');}
  finally{b.disabled=false;}
}

async function sendMoney(body,host){
  const d=(DEAL&&DEAL.deal)||{}; const label=body.purpose==='deposit'?'Deposit request':'Invoice';
  const r=await apiAg('/sales/deals/'+d.id+'/invoice','POST',body);
  if(r.ok){
    const b=r.body||{}; const url=b.url||'';
    if(b.warning==='link_failed'){toast(b.message||'Invoice saved, but the payment link didn’t generate — tap Send again.');if(host)host.innerHTML='';reloadDeal();return;}
    if(url&&navigator.clipboard)navigator.clipboard.writeText(url).catch(()=>{});
    toast(b.double_tap?label+' already sent a moment ago'+(url?' — link copied':''):b.emailed?label+(b.reused?' re-sent':' sent')+' — emailed to the client':(url?label+' prepared — payment link copied, nothing was emailed':label+' sent'));
    if(host)host.innerHTML='';
    reloadDeal(); return;
  }
  // item 107 (J2): an open one exists — at a different amount (amount_mismatch), or the same one,
  // already sent (already_open). Nothing goes out until the operator picks: resend THAT invoice
  // (its own send route, which never makes a new one) or send another.
  const why=r.status===409&&r.body&&r.body.error;
  if((why==='amount_mismatch'||why==='already_open')&&host){
    const open=r.body.open_invoice||{}; const want=Number(r.body.amount_cents)||body.amount_cents||0;
    host.innerHTML=`<div class="bform" role="alert"><p style="font-size:13.5px;margin:0 0 10px">${esc(r.body.message||'An open invoice already exists on this deal.')} If you send another, both links stay payable until one is paid.</p><div class="bacts"><button type="button" id="bf-resend">Resend the ${esc(fmtC(open.amount_cents))} ${body.purpose==='deposit'?'deposit request':'invoice'}</button><button type="button" class="primary" id="bf-force">${why==='already_open'?'Send another':`Send another for ${esc(fmtC(want))}`}</button></div></div>`;
    // Both buttons guard the double-click (Pipeline's copy already did): a second
    // click while the first is on its way would bill the client twice.
    const arm=(bid,fn)=>{$(bid).addEventListener('click',()=>{$('bf-resend').disabled=true;$('bf-force').disabled=true;fn();});};
    arm('bf-resend',async()=>{const x=await billingSend('/sales/invoices/'+encodeURIComponent(open.id)+'/send',body.purpose==='deposit'?'Deposit request re-sent':'Invoice re-sent');if(x){host.innerHTML='';reloadDeal();}else{$('bf-resend').disabled=false;$('bf-force').disabled=false;}});
    arm('bf-force',()=>sendMoney({...body,...(want&&!body.amount_cents?{amount_cents:want}:{}),force:true},host));
    return;
  }
  toast((r.body&&r.body.message)||'That didn’t go through.');
  const go=$('bf-go'); if(go)go.disabled=false;
}

// ── THE activity timeline (the centerpiece) ──────────────────────────────────
// Data: GET /crm/activity. Deploy-order tolerance: if the route isn't there yet
// (404 / no items array — the function may not be redeployed), compose the same
// shape client-side from the OLD routes (/crm/messages + /crm/timeline). The
// fallback lacks deal system events — accepted; it never breaks the page.
// ACT_SEQ (SS6): a superseded activity load must never repaint the rail — only
// the newest request's outcome (server path OR fallback) is allowed to touch
// ACT and render.
let ACT_SEQ=0;
async function loadActivity(){
  const seq=++ACT_SEQ;
  const ids=idParams(); const q=[];
  if(ids.project)q.push('project='+encodeURIComponent(ids.project));
  if(REC.identity&&REC.identity.client_id)q.push('client_id='+encodeURIComponent(REC.identity.client_id));
  if(ids.deal)q.push('deal='+encodeURIComponent(ids.deal));
  if(ids.contact)q.push('contact='+encodeURIComponent(ids.contact));   // items 85 and 80: what was kept for the person themselves
  const scopedCustomer=!!(REC.sections&&REC.sections.overview);   // the scope header alone resolves the identity server-side
  if(!q.length&&!scopedCustomer){ACT={items:[],upcoming:[],reply_to:null,reply_support_to:null,failed:false};renderRail();return;}
  const early=ACT_EARLY; ACT_EARLY=null;   // item 45: the first load uses the read that started beside the record's
  const r=(early&&scopedCustomer&&(await early))||await api('/crm/activity?'+q.concat('today='+recTodayYmd()).join('&'));   // item 65: the band's overdue on the local day
  if(seq!==ACT_SEQ)return;
  const d=(r.ok&&r.body.data)||{};
  if(r.ok&&Array.isArray(d.items)){
    ACT={items:d.items,upcoming:Array.isArray(d.upcoming)?d.upcoming:[],reply_to:d.reply_to||null,reply_support_to:d.reply_support_to||null,failed:false};
    renderRail();return;
  }
  await loadActivityFallback(q,seq);
  if(seq!==ACT_SEQ)return;
  renderRail();
}
// thin adapter mirroring the server's crm/activity.ts mappers
function convItem(m){
  if(!m||!m.created_at)return null;
  const at=m.created_at, id='conv:'+m.kind+':'+(m.id||''), mine=m.from==='studio', body=m.body||null;
  if(m.kind==='message')return{id,kind:'message',type:'message',title:mine?'You sent a message':'The client sent a message',body,at,meta:null,href:null};
  if(m.kind==='support')return{id,kind:'support',type:'message',title:(mine?'You':'The client')+' opened a support request'+(m.subject?' — '+m.subject:''),body,at,meta:'Support'+(m.status?' · '+String(m.status).replace(/_/g,' '):''),href:null};
  if(m.kind==='support_reply')return{id,kind:'support_reply',type:'message',title:mine?'You replied':'The client replied',body,at,meta:'Support',href:null};
  if(m.kind==='enquiry')return{id,kind:'enquiry',type:'message',title:'The client reached out from your website',body,at,meta:'Website enquiry',href:null};
  if(m.kind==='booking')return{id,kind:'booking',type:'call',title:m.subject||'The client booked a call',body,at,meta:'Booking',href:null};
  if(m.kind==='broadcast')return{id,kind:'broadcast',type:'email',title:'You sent an update'+(m.subject?' — '+m.subject:''),body,at,meta:'Update',href:null};
  if(m.kind==='activity'){
    const map={call:['call','You logged a call','Logged call'],email:['email','You logged an email','Logged email'],meeting:['call','You logged a meeting','Meeting'],note:['note','You added a note','Note'],proposal_sent:['system','Proposal sent','Deal'],contract_sent:['system','Agreement sent','Deal'],invoice_sent:['system','Invoice sent','Deal']};
    const t=map[m.activity_kind]||['note','You logged an activity','Activity'];

  return null;
}
function siteItem(t){
  if(!t||!t.at)return null;
  if(t.kind==='note')return{id:'site:'+t.id,kind:'note',type:'note',title:t.title||'Note',body:t.detail||null,at:t.at,meta:t.audience==='internal'?'Internal note':'Shared note',href:null};

async function loadActivityFallback(q,seq){
  const ids=idParams(); const s=(REC&&REC.sections)||{};
  const [mr,tr,tk]=await Promise.all([
    api('/crm/messages?'+q.join('&')),
    s.overview?api('/crm/timeline'):Promise.resolve({ok:false,body:{}}),
    ids.deal?apiAg('/sales/deals/'+encodeURIComponent(ids.deal)+'/tasks'):Promise.resolve({ok:false,body:{}}),
  ]);
  if(seq!==undefined&&seq!==ACT_SEQ)return;   // superseded mid-flight — never mutate ACT
  if(!mr.ok&&!tr.ok){ACT={items:[],upcoming:[],reply_to:null,reply_support_to:null,failed:true};return;}
  const md=(mr.ok&&mr.body.data)||{};
  const items=[]; const push=(x)=>{if(x&&x.at)items.push(x);};
  for(const m of md.items||[])push(convItem(m));
  for(const t of (tr.ok&&tr.body.data&&tr.body.data.items)||[])push(siteItem(t));
  const tasks=(tk.ok&&Array.isArray(tk.body.data))?tk.body.data:[];
  for(const t of tasks)if(t.status==='done'&&(t.completed_at||t.created_at))push({id:'task:'+t.id,kind:'task',type:'task',title:'To-do completed — '+(t.title||'To-do'),body:null,at:t.completed_at||t.created_at,meta:'To-do',href:null});

  const dealHref=ids.deal?agHref('pipeline.html','deal='+encodeURIComponent(ids.deal)):null;
  for(const t of tasks)if(t.status==='open')upcoming.push({kind:'task',id:t.id,title:t.title||'To-do',due:t.due_date||null,overdue:!!(t.due_date&&String(t.due_date).slice(0,10)<today),dueToday:isToday(t.due_date),href:dealHref});

}

// snapshot the composer's in-progress drafts first and restore them after, so a
// half-typed message/log/task/note survives. (The active COMPOSER tab already

// refresh, so a sent draft never resurrects.
const COMPOSER_FIELDS=['msgBody','logBody','logDate','logFollow','taskTitle','taskDue','noteBody','emSubject','emBody'];

// record's (Activity → Details → back): both redraw the fields, and the snapshot below only covers

const DRAFTS={};

// ── C3 (SS6): insertSavedReplies(textareaId) — the shared saved-reply insert.
// ONE lazy cached fetch per page-load; a picker only renders when replies
// exist. Bodies live in a JS map keyed by id (projects.html's picker idiom —
// nothing goes into an attribute); insert APPENDS after what's typed and
// refocuses the textarea. apiAg on purpose: saved replies are the OPERATOR's
// toolkit (their own site's settings) — a customer-scoped record must not
// resolve them against the customer's site (the /sales/* doctrine above).
// Kept in sync by hand with inbox.html's copy. ──
// SCOPE DOCTRINE (SS6, flagged decision): inbox.html's copy diverges — its
// api() carries the drill-in scope, so a drilled-in operator THERE gets the
// CUSTOMER site's reply set ("replies live where the conversation lives"),
// while this page always uses the operator's own. Both are defensible; which
// one wins is Eric's call (punchlist). No behavior change until then. ──
let SR_FETCH=null;
function insertSavedReplies(taId){
  const ta=$(taId);if(!ta)return;
  if(!SR_FETCH)SR_FETCH=apiAg('/service/saved-replies').then(r=>(r.ok&&r.body.data&&r.body.data.replies)||[]).catch(()=>[]);
  SR_FETCH.then((replies)=>{
    const cur=$(taId);
    if(!replies.length||cur!==ta)return;   // nothing saved / the composer re-rendered under us
    if(ta.previousElementSibling&&ta.previousElementSibling.classList.contains('sr-pick'))return;
    const map={};replies.forEach(x=>{map[x.id]=x.body;});
    const sel=document.createElement('select');
    sel.className='sr-pick';sel.setAttribute('aria-label','Insert a saved reply');
    sel.style.cssText='display:block;margin-bottom:6px;max-width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px';
    sel.innerHTML='<option value="">Insert a saved reply…</option>'+replies.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');
    sel.onchange=()=>{const b=map[sel.value];if(b){const v=ta.value;ta.value=v?(v.replace(/\s*$/,'')+'\n\n'+b):b;DRAFTS[taId]=ta.value;ta.focus();}sel.value='';};
