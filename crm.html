<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="One client record — the whole relationship from first enquiry through delivery, in one place.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically). Only the six activity-
     type accents are page-local — picked to survive BOTH themes. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* the six timeline type accents (icon ring + connector) */
    --act-message:var(--dds-p,#5b3fa0);--act-call:var(--dds-good,#33664b);--act-task:var(--dds-warn,#775d31);--act-system:var(--dds-faint,#746b8a);
    --act-email:#31708e;--act-note:#8a5a83;
  }
  @media (prefers-color-scheme:dark){:root{--act-email:#85b7cf;--act-note:#c9a3c2}}
  :root[data-theme="light"]{--act-email:#31708e;--act-note:#8a5a83}
  :root[data-theme="dark"]{--act-email:#85b7cf;--act-note:#c9a3c2}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 20px 90px}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:4px}
  a.back{display:inline-flex;align-items:center;gap:5px;color:var(--soft);text-decoration:none;font-size:13.5px;font-weight:600}
  a.back:hover{color:var(--p)}

  /* ── record header (Lightning anatomy: object icon · name · status) ── */
  .rec-head{margin-top:14px;display:flex;gap:14px;align-items:flex-start}
  .obj-ic{width:44px;height:44px;border-radius:12px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:20px;flex:0 0 auto;box-shadow:var(--shadow)}
  .obj-ic.customer{background:var(--good)}
  .rec-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,4vw,32px);letter-spacing:-.01em;margin:0;line-height:1.2}
  .rec-sub{color:var(--soft);font-size:14px;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .rec-sub a{color:var(--p);text-decoration:none} .rec-sub a:hover{text-decoration:underline}
  .statuschip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--p-soft);color:var(--p)}
  .statuschip.customer{background:var(--good-soft);color:var(--good)}

  /* ── highlights panel: label-over-value tiles ── */
  .hl-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:16px;box-shadow:var(--shadow)}
  .hl{background:var(--card);padding:10px 14px;min-width:0}
  .hl-k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:6px}
  .hl-v{font-family:var(--serif);font-size:17.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hl-v .word{text-transform:capitalize}
  .hl-edit{border:none;background:none;color:var(--faint);cursor:pointer;font-size:12px;padding:0 2px;border-radius:4px}
  .hl-edit:hover{color:var(--p)}
  .hl input{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-top:3px}

  /* ── Path (Lightning chevrons, dds skin) ── */
  .pathcard{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
  .pathrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .path{display:flex;flex:1 1 340px;min-width:0}
  .path button.pstep{flex:1;min-width:0;border:none;font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 16px;cursor:default;
    background:var(--bg);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
  .path button.pstep:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);border-radius:8px 0 0 8px}
  .path button.pstep:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,11px 50%);border-radius:0 8px 8px 0}
  .path button.pstep.done{background:var(--good-soft);color:var(--good)}
  .path button.pstep.canback{cursor:pointer}
  .path button.pstep.canback:hover{filter:brightness(.96)}
  .path button.pstep.current{background:var(--p);color:#fff;cursor:pointer}
  .path button.pstep.current:hover{filter:brightness(1.06)}
  .path button.pstep.lost-terminal{background:var(--warn-soft);color:var(--warn)}
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) —
     same treatment as pipeline.html's Path, kept in sync by hand */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .path button.pstep.current{color:#171320}}
  :root[data-theme="dark"] .path button.pstep.current{color:#171320}
  .path-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .path-guide{margin-top:10px;font-size:13.5px;color:var(--soft)}
  .path-guide b{color:var(--ink);font-weight:600}
  .path-confirm{margin-top:10px;display:flex;gap:9px;align-items:center;font-size:13.5px;flex-wrap:wrap}
  .terminal-chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px}
  .terminal-chip.won{background:var(--good-soft);color:var(--good)}
  .terminal-chip.lost{background:var(--warn-soft);color:var(--warn)}

  /* ── two-region body ── */
  .body{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;margin-top:20px;align-items:start}
  @media (max-width:1000px){.body{grid-template-columns:minmax(0,1fr)}.rail{order:-1}}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{border:none;background:transparent;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--soft);padding:11px 15px;cursor:pointer;border-bottom:2.5px solid transparent;border-radius:0;white-space:nowrap;transition:.15s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{color:var(--p);border-bottom-color:var(--p)}
  #tabbody{margin-top:18px}

  /* related-list cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .card-h .t{font-weight:700;font-size:14.5px}
  .rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:14px;min-width:0}
  .rrow:first-of-type{border-top:none}
  .rrow .rt{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .rrow .rt .s{color:var(--faint);font-size:12.5px;display:block}
  a.rlink{color:inherit;text-decoration:none;display:block;min-width:0;flex:1}
  a.rlink:hover .rt{color:var(--p)}
  .schip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .schip.good{background:var(--good-soft);color:var(--good)}
  .schip.warn{background:var(--warn-soft);color:var(--warn)}
  .schip.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14.5px}
  .kv .k{color:var(--faint);font-weight:600}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .fact{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .fact .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .fact .v{font-family:var(--serif);font-size:18px;margin-top:2px}
  .fact .v small{font-family:var(--sans);font-size:12px;color:var(--soft);font-weight:400}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 11px}
  .chip .d{width:7px;height:7px;border-radius:50%}
  .chip.healthy{background:var(--good-soft);color:var(--good)} .chip.healthy .d{background:var(--good)}
  .chip.attention{background:var(--warn-soft);color:var(--warn)} .chip.attention .d{background:var(--warn)}
  .chip.new,.chip.quiet{background:var(--p-soft);color:var(--p)} .chip.new .d,.chip.quiet .d{background:var(--p)}
  h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
  section{margin-top:22px} section:first-child{margin-top:0}

  /* ── the activity rail ── */
  .acard{padding:14px 16px}
  .composer-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -4px}
  .composer-tabs button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--soft);padding:8px 10px;cursor:pointer;border-bottom:2.5px solid transparent;border-radius:0;white-space:nowrap}
  .composer-tabs button.on{color:var(--p);border-bottom-color:var(--p)}
  .composer-pane{padding:12px 0 4px}
  .composer-pane textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:64px}
  .composer-pane textarea:focus{outline:none;border-color:var(--p)}
  .composer-pane input[type=text],.composer-pane input[type=date]{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .composer-row{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .composer-row .spacer{flex:1}
  .kindchips{display:flex;gap:6px;flex-wrap:wrap}
  .kindchips button{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer;font-weight:600}
  .kindchips button.on{background:var(--p-soft);color:var(--p);border-color:var(--p)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{border:none;border-radius:0;padding:6px 12px;font-size:12.5px;background:transparent;color:var(--soft);font-family:inherit;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--p-soft);color:var(--p)}

  .fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .fchips button{font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer;font-family:inherit}
  .fchips button.on{background:var(--p-soft);border-color:var(--p);color:var(--p)}

  /* Upcoming & overdue band */
  .upband{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
  .upband .bt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:6px}
  .uprow{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px}
  .uprow .due{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}
  .uprow.overdue .due{color:var(--bad);font-weight:700}
  .uprow.overdue .ut{color:var(--bad)}
  .uprow input[type=checkbox]{margin-top:3px;accent-color:var(--p)}
  .uprow a{color:inherit;text-decoration:none}
  .uprow a:hover{color:var(--p)}

  /* the timeline: connector line + white-ring type icons + expandable rows */
  .tl-month{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:18px 0 4px;display:flex;align-items:center;gap:8px}
  .tl-month:after{content:"";flex:1;height:1px;background:var(--line)}
  .ti{position:relative;display:flex;gap:10px;padding:9px 0 9px 34px;align-items:flex-start}
  .ti:before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
  .ti:first-of-type:before{top:12px} .ti:last-of-type:before{bottom:auto;height:22px}
  .ti .ti-icon{position:absolute;left:1px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;box-shadow:0 0 0 3px var(--card)}
  .ti.t-message:before{background:color-mix(in srgb,var(--act-message) 35%,transparent)} .ti.t-message .ti-icon{background:var(--act-message)}
  .ti.t-email:before{background:color-mix(in srgb,var(--act-email) 35%,transparent)} .ti.t-email .ti-icon{background:var(--act-email)}
  .ti.t-call:before{background:color-mix(in srgb,var(--act-call) 35%,transparent)} .ti.t-call .ti-icon{background:var(--act-call)}
  .ti.t-task:before{background:color-mix(in srgb,var(--act-task) 35%,transparent)} .ti.t-task .ti-icon{background:var(--act-task)}
  .ti.t-note:before{background:color-mix(in srgb,var(--act-note) 35%,transparent)} .ti.t-note .ti-icon{background:var(--act-note)}
  .ti.t-system:before{background:color-mix(in srgb,var(--act-system) 30%,transparent)} .ti.t-system .ti-icon{background:var(--act-system)}
  .ti-main{flex:1;min-width:0}
  .ti-head{display:flex;align-items:baseline;gap:7px;width:100%;border:none;background:none;font-family:inherit;font-size:13.5px;color:var(--ink);text-align:left;padding:0;min-width:0}
  button.ti-head{cursor:pointer}
  .ti-title{font-weight:600;min-width:0}
  .ti-car{color:var(--faint);font-size:10px;flex:0 0 auto}
  .ti-meta{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 7px;background:var(--bg);border:1px solid var(--line);color:var(--faint);white-space:nowrap;flex:0 0 auto}
  .ti-body{font-size:13.5px;color:var(--soft);white-space:pre-wrap;margin-top:5px;border-left:2px solid var(--line);padding-left:10px}
  .ti-body .note-acts{margin-top:6px}
  .ti-body .note-acts button{font-size:11.5px;padding:3px 9px}
  .ti-when{font-size:11.5px;color:var(--faint);white-space:nowrap;flex:0 0 auto;padding-top:2px}
  .ti a.ti-link{color:var(--p);text-decoration:none;font-size:12px;font-weight:600}
  .ti a.ti-link:hover{text-decoration:underline}

  textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;resize:vertical;min-height:70px}
  textarea:focus{outline:none;border-color:var(--p)}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 15px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--p);color:var(--p)} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--p);color:#fff;border-color:var(--p)} button.primary:hover{background:var(--p-deep);color:#fff}
  a.link{color:var(--p);text-decoration:none;font-weight:600;font-size:14px} a.link:hover{text-decoration:underline}
  a.btnlink{display:inline-block;font-size:13.5px;font-weight:600;border-radius:999px;border:1px solid var(--p);color:var(--p);padding:7px 14px;text-decoration:none}
  a.btnlink:hover{background:var(--p-soft)}
  a.btnlink.primary{background:var(--p);color:#fff} a.btnlink.primary:hover{background:var(--p-deep)}
  .muted{color:var(--soft);font-size:14px}
  .center{text-align:center;padding:56px 20px}
  .center h2{display:block;font-family:var(--serif);font-weight:500;font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 8px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none !important}}
</style>

<body>
<div class="wrap">
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>Studio OS · One client record — the whole relationship in one place. It reflects real activity; it never sells or scores.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dds-hint" data-hint="crm-notes" hidden>Notes here stay private to you unless you mark one “shared” — then the client sees it too.</div>

<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
// ── The unified Client Record — the Lightning record page (dds skin) ─────────
// ONE relationship, one page. /crm/record resolves whatever key the URL carries
// (?client= / ?deal= / ?contact= / ?project=) into a canonical identity + which
// sections exist. Anatomy (Salesforce record page, dds tokens): record header +
// highlights tiles → Path chevrons (open deal) → two-region body: LEFT the
// Details/Deal/Delivery/Files related-list cards (NO iframes — the heavy money
// machinery stays on pipeline.html, framed by links), RIGHT the ONE activity
// timeline + a multi-action composer (Message · Log call · Task · Note). The
// server enforces audience + tenant scope; this page just presents what it's given.
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="";
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;});
const QP=()=>new URLSearchParams(location.search);
const scopeParam=()=>QP().get('client')||'';
const H=(scoped)=>{const h={'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN};if(scoped)h['x-dds-scope-site']=scopeParam();return h;};
// api() = scoped to the record's customer site (/crm/*, the reply routes).
// apiAg() = UNSCOPED on purpose: deal/contact/project rows live on the operator's
// own agency site, so /sales/* + /projects/* must resolve against that site (the
// same reason the old Deal/Delivery iframes ran unscoped — no ?client=, which
// would mis-scope them to the customer's own site where the deal doesn't exist).
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:H(true),body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
async function apiAg(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:H(false),body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
// Same doctrine for the outbound pipeline/projects links: the trailing `client=`
// is deliberate — it pins these links UNSCOPED so shell.js's scope-carry
// (carryScopeGlobally) doesn't rewrite them onto the customer's site.
const agHref=(page,params)=>'/'+page+'?'+params+'&client=';
// Server-fed hrefs (timeline items, Upcoming rows) are scope-agnostic on purpose;
// pin any pipeline/projects target the same way agHref does at RENDER time, so
// carryScopeGlobally can't rewrite it onto the customer's own site.
const pinHref=(h)=>{h=String(h||'');return (/^\/(pipeline|projects)\.html/.test(h)&&h.indexOf('client=')<0)?h+(h.indexOf('?')>=0?'&':'?')+'client=':h;};
function toast(m){if(window.ddsToast)return void ddsToast(m);const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function when(iso){if(!iso)return'';const d=Math.floor((Date.now()-Date.parse(iso))/86400000);if(d<=0)return'today';if(d===1)return'yesterday';if(d<7)return d+' days ago';if(d<14)return'last week';if(d<60)return Math.floor(d/7)+' weeks ago';return Math.floor(d/30)+' months ago';}
const fmtC=(c)=>'$'+Math.round((Number(c)||0)/100).toLocaleString();
const dueLabel=(iso)=>{if(!iso)return'';const t=new Date(String(iso).slice(0,10)+'T12:00:00Z');if(isNaN(t))return'';return t.toLocaleDateString('en-US',{month:'short',day:'numeric'});};

// ── stage maps — kept in sync with pipeline.html by hand (its STAGES /
// PIPELINE_GUIDANCE / BOARD_NEXT blocks, which mirror lib/pipeline_guidance.ts
// + lib/sales_lifecycle.ts). NOTE: pipeline.html:694 reads g.suggested_action
// while the map defines `action` — here the field is named `action` everywhere
// and BOTH the tip and the action render. ──
const STAGE_LABEL={lead:'New lead',qualified:'Qualified',proposal:'Proposal sent',contract:'Agreement out',won:'Won',lost:'Not a fit'};
const stageLabel=(s)=>STAGE_LABEL[s]||s;
const PIPELINE_GUIDANCE={
  lead:{tip:'A new enquiry — reach out while they’re still interested.',action:'Get in touch and learn what they need'},
  qualified:{tip:'They’re a fit. Show them what working together looks like.',action:'Send a proposal they can accept online'},
  proposal:{tip:'Your proposal is with them — a gentle nudge often seals it.',action:'Follow up, then send the agreement once they say yes'},
  contract:{tip:'Agreement’s out — once they sign, they can pay right away.',action:'Get it signed, then request the deposit'},
  won:{tip:'They’re your customer now. Time to do great work.',action:'Open their project and kick things off'},
  lost:{tip:'Not every deal fits — the door stays open for later.',action:'Keep the relationship warm; reopen if things change'},
};
const guidanceFor=(s)=>PIPELINE_GUIDANCE[s]||PIPELINE_GUIDANCE.lead;
// forward one · back one · →lost; never →won (convert-only — server re-checks)
const BOARD_NEXT={lead:['qualified','lost'],qualified:['proposal','lead','lost'],proposal:['contract','qualified','lost'],contract:['proposal','lost'],won:[],lost:['lead']};
const PATH_STEPS=['lead','qualified','proposal','contract'];   // won/lost are terminal outcomes, not steps

let REC=null, TAB='', PROFILE=null, DEAL=null, PROJ=null, DETAIL=null;
let ACT={items:[],upcoming:[],reply_to:null,reply_support_to:null,failed:false};
let FILTER='all', COMPOSER='message', LOGKIND='call', NEWAUD='internal', FOCUS_COMPOSER=false, PENDING_BACK='', GUIDE_OPEN=true;
const EXPANDED=new Set();
const TAB_LABEL={details:'Details',deal:'Deal',delivery:'Delivery',files:'Files'};
const TAB_ORDER=['details','deal','delivery','files'];
// old deep links keep working (inbox.html links ?tab=messages; older links carry overview)
const TAB_ALIAS={overview:'details',messages:'details',deal:'deal',delivery:'delivery',details:'details',files:'files'};

// Build the query for /crm/record from whatever the URL carries.
function recordQuery(){
  const q=QP(); const parts=[];
  for(const k of ['client','client_id','deal','contact','project']){const v=q.get(k); if(v)parts.push(k+'='+encodeURIComponent(v));}
  return parts.length?('?'+parts.join('&')):'';
}
function idParams(){ // the identity keys carried onto sub-requests / links
  const id=(REC&&REC.identity)||{}; return {client:id.customer_site_id||scopeParam()||'', deal:id.deal_id||'', project:id.project_id||'', contact:id.contact_id||''};
}
function availTabs(){
  const s=(REC&&REC.sections)||{}; const out=[];
  if(s.details||s.overview)out.push('details');
  if(s.deal)out.push('deal');
  if(s.delivery)out.push('delivery');
  if(s.deal||s.delivery)out.push('files');
  return out;
}

async function loadRecord(){
  const rq=recordQuery();
  if(!rq){ picker(); return; }
  const r=await api('/crm/record'+rq);
  if(r.status===403){ $('main').innerHTML=`<div class="center"><h2>This lives in your studio workspace.</h2><p class="muted">${esc((r.body&&r.body.message)||'Only your studio can open a client record.')}</p></div>`; return; }
  if(!r.ok){ trouble(); return; }
  REC=r.body.data||{};
  // Canonical addressing: a converted customer is addressed by their SITE so the
  // scope (x-dds-scope-site) is right for the profile + notes + activity. If we
  // arrived by ?deal=/?contact= but the canonical key is the customer site and it
  // isn't the current scope, reload once to the canonical URL (one hop, no loop).
  const canon=REC.canonical||{};
  if(canon.key==='client' && canon.value && QP().get('client')!==canon.value){
    const t=QP().get('tab')||REC.default_tab||''; const suffix=t?('&tab='+encodeURIComponent(t)):'';
    location.replace('/crm.html?client='+encodeURIComponent(canon.value)+suffix); return;
  }
  const want=QP().get('tab');
  if(want==='messages')FOCUS_COMPOSER=true;
  const avail=availTabs();
  const mapped=TAB_ALIAS[want]||TAB_ALIAS[REC.default_tab]||'';
  TAB=avail.includes(mapped)?mapped:(avail[0]||'');
  renderShell();
  if(TAB)showTab(TAB,true);
  loadPanels();
}

// ── the record shell: header + highlights + Path + two-region body ──────────
function renderShell(){
  const hd=REC.header||{}; const nm=hd.name||'Client'; const isCust=hd.status==='customer';
  const bits=[];
  if(hd.company)bits.push(esc(hd.company));
  if(hd.email)bits.push(`<a href="mailto:${esc(hd.email)}">${esc(hd.email)}</a>`);
  if(hd.phone)bits.push(`<a href="tel:${esc(hd.phone)}">${esc(hd.phone)}</a>`);
  const avail=availTabs();
  const tabsHtml=avail.map(t=>`<button data-tab="${t}"${t===TAB?' class="on"':''} role="tab" id="tab-${t}" aria-selected="${t===TAB?'true':'false'}" tabindex="${t===TAB?'0':'-1'}" aria-controls="tabbody">${TAB_LABEL[t]}</button>`).join('');
  // a customer-scoped record (sections.overview) resolves its identity from the
  // scope alone — the rail works there even with no explicit keys
  const showRail=!!(idParams().project||idParams().deal||(REC.identity&&REC.identity.client_id)||(REC.sections&&REC.sections.overview));
  $('main').innerHTML=`
    <a class="back" href="/customers.html">← Customers</a>
    <div class="rec-head">
      <div class="obj-ic ${isCust?'customer':''}" aria-hidden="true">${isCust?'🏢':'👤'}</div>
      <div style="min-width:0">
        <h1 id="pagehead" tabindex="-1">${esc(nm)}</h1>
        <div class="rec-sub"><span class="statuschip ${isCust?'customer':''}">${isCust?'Customer':'Prospect'}</span>${bits.length?' <span>'+bits.join(' · ')+'</span>':''}</div>
      </div>
    </div>
    <div id="hlpanel"></div>
    <div id="pathwrap"></div>
    <div class="body">
      <div class="col-main">
        ${avail.length?`<div class="tabs" role="tablist" aria-label="Record sections">${tabsHtml}</div><div id="tabbody" role="tabpanel" aria-labelledby="tab-${TAB||avail[0]}"><div class="spin" role="status" aria-label="Loading"></div></div>`:'<p class="muted">Nothing to show for this record yet.</p>'}
      </div>
      <aside class="rail" ${showRail?'':'hidden'}>
        <div class="card acard" id="acard"><div class="spin" role="status" aria-label="Loading activity"></div></div>
      </aside>
    </div>`;
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.getAttribute('data-tab'))));
  // E2: the record-section tablist honors the arrow-key contract — arrows move
  // focus AND selection, Home/End jump, roving tabindex (showTab keeps it).
  const tl=document.querySelector('.tabs[role=tablist]');
  if(tl)tl.addEventListener('keydown',(e)=>{
    const tabsEls=[...tl.querySelectorAll('[data-tab]')];const i=tabsEls.indexOf(document.activeElement);
    if(i<0)return;let j=-1;
    if(e.key==='ArrowRight')j=(i+1)%tabsEls.length;
    else if(e.key==='ArrowLeft')j=(i-1+tabsEls.length)%tabsEls.length;
    else if(e.key==='Home')j=0;
    else if(e.key==='End')j=tabsEls.length-1;
    if(j<0)return;e.preventDefault();
    const t=tabsEls[j];showTab(t.getAttribute('data-tab'));t.focus();
  });
  HL_EDIT=false;   // the shell rebuild destroyed any open editor — never leave the flag stale
  renderHighlights();
}

// panels that arrive after the record: profile (health), deal, project, activity.
// DEAL_READY = the in-flight deal fetch, exposed so the activity fallback can
// await it instead of racing the global (its Upcoming band reads DEAL).
let DEAL_READY=Promise.resolve();
async function loadPanels(){
  const ids=idParams(); const s=(REC&&REC.sections)||{};
  const jobs=[];
  if(s.overview)jobs.push(api('/crm/profile').then(r=>{if(r.ok)PROFILE=r.body.data||null;renderHighlights();if(TAB==='details')showTab(TAB,true);}));
  if(ids.deal){DEAL_READY=apiAg('/sales/deals/'+encodeURIComponent(ids.deal)).then(r=>{DEAL=r.ok?(r.body.data||null):{error:true};renderHighlights();renderPath();if(TAB==='deal'||TAB==='files')showTab(TAB,true);});jobs.push(DEAL_READY);}
  if(ids.project)jobs.push(apiAg('/projects/'+encodeURIComponent(ids.project)).then(r=>{PROJ=r.ok?(r.body.data||null):{error:true};if(TAB==='delivery'||TAB==='files')showTab(TAB,true);}));
  jobs.push(loadActivity());
  await Promise.allSettled(jobs);
}

// ── highlights panel: up to 6 label-over-value tiles, data-only ─────────────
let HL_EDIT=false;   // an OPEN next-step inline editor owns the panel — async re-renders skip it
function renderHighlights(){
  const host=$('hlpanel'); if(!host)return;
  if(HL_EDIT)return;   // don't destroy the open editor + typed text; the render after save/cancel catches up
  const hl=REC.highlights||{}; const d=(DEAL&&DEAL.deal)||{}; const p=(PROFILE&&PROFILE.profile)||null;
  const tiles=[];
  const value=d.expected_value_cents||hl.value_cents; if(value)tiles.push({k:'Deal value',v:esc(fmtC(value))});
  const stage=d.stage||hl.stage; if(stage)tiles.push({k:'Stage',v:`<span class="word">${esc(stageLabel(stage))}</span>`});
  if(hl.owed_cents)tiles.push({k:'Outstanding',v:esc(fmtC(hl.owed_cents))});
  const ns=(d.id?d.next_step:hl.next_step)||'';
  if(d.id||ns)tiles.push({k:'Next step',v:esc(ns||'—'),edit:!!d.id});   // inline-editable when a real deal field backs it
  if(p&&p.health)tiles.push({k:'Health',v:`<span class="word">${esc(p.health==='attention'?'Needs attention':p.health==='new'?'Getting set up':p.health)}</span>`});
  if(p)tiles.push({k:'Website',v:esc(p.live?'Live':(p.last_published_at?'Offline':'Not yet'))});
  if(!tiles.length){host.innerHTML='';return;}
  host.innerHTML=`<div class="hl-panel">${tiles.slice(0,6).map((t,i)=>`<div class="hl"><div class="hl-k">${t.k}${t.edit?`<button class="hl-edit" data-hledit aria-label="Edit next step">✎</button>`:''}</div><div class="hl-v" data-hlv="${i}">${t.v}</div></div>`).join('')}</div>`;
  const eb=host.querySelector('[data-hledit]');
  if(eb)eb.addEventListener('click',()=>{
    const tile=eb.closest('.hl'); const cur=(DEAL&&DEAL.deal&&DEAL.deal.next_step)||'';
    HL_EDIT=true;
    tile.innerHTML=`<div class="hl-k">Next step</div><input type="text" value="${esc(cur)}" aria-label="Next step" maxlength="200"><div style="display:flex;gap:6px;margin-top:6px"><button class="hl-edit" data-save style="font-weight:700">Save</button><button class="hl-edit" data-cancel>Cancel</button></div>`;
    const inp=tile.querySelector('input'); inp.focus();
    const close=()=>{HL_EDIT=false;renderHighlights();};
    tile.querySelector('[data-cancel]').addEventListener('click',close);
    const save=async()=>{const v=inp.value.trim();const r=await apiAg('/sales/deals/'+encodeURIComponent(DEAL.deal.id),'PATCH',{next_step:v});if(r.ok){DEAL.deal=r.body.data||DEAL.deal;toast('Saved.');}else toast((r.body&&r.body.message)||'Couldn’t save.');close();};
    tile.querySelector('[data-save]').addEventListener('click',save);
    inp.addEventListener('keydown',(e)=>{if(e.key==='Enter')save();if(e.key==='Escape')close();});
  });
}

// ── Path: the chevron stage bar (only when the record has a deal) ───────────
function renderPath(){
  const host=$('pathwrap'); if(!host)return;
  const d=DEAL&&DEAL.deal; if(!d||!d.stage){host.innerHTML='';return;}
  const stage=String(d.stage);
  const signed=(DEAL.contracts||[]).some(c=>c.status==='signed');
  const terminal=stage==='won'||stage==='lost';
  const curIdx=PATH_STEPS.indexOf(stage);
  // exactly TWO steps are interactive: the current stage (toggles the guidance
  // strip) and the ONE legal BOARD_NEXT back-target. Everything else renders
  // non-interactive — no pointer, no hover, out of the tab order.
  const steps=PATH_STEPS.map((s,i)=>{
    const done=stage==='won'||(curIdx>-1&&i<curIdx);
    const current=s===stage;
    const canBack=!terminal&&(BOARD_NEXT[stage]||[]).includes(s)&&done;
    const cls=(done?'done':current?'current':(stage==='lost'?'lost-terminal':''))+(canBack?' canback':'');
    const state=done?'complete':current?'current stage':'upcoming';
    const attrs=canBack?'':current?` aria-expanded="${GUIDE_OPEN?'true':'false'}"`:' tabindex="-1" aria-disabled="true"';
    const hint=canBack?'. Activate to move the deal back here.':current?'. Activate to show or hide the stage guidance.':'';
    return `<button class="pstep ${cls}" data-stage="${s}"${attrs} aria-label="${esc(stageLabel(s))} — ${state}${hint}">${done?'✓ ':''}${esc(stageLabel(s))}</button>`;
  }).join('');
  const g=guidanceFor(stage);
  // the right-side action: forward = "Mark Stage as Complete" (BOARD_NEXT[stage][0]
  // when it's a forward move); at contract+signed it becomes Convert (won is
  // convert-only — the heavy machinery stays on pipeline.html, we don't rebuild it).
  const fwd=(BOARD_NEXT[stage]||[])[0];
  const fwdOk=fwd&&fwd!=='lost'&&PATH_STEPS.indexOf(fwd)>curIdx;
  let side='';
  if(stage==='won')side=`<span class="terminal-chip won">Won ✓</span>`;
  else if(stage==='lost')side=`<span class="terminal-chip lost">Not a fit</span>`;
  else if(stage==='contract'&&signed)side=`<a class="btnlink primary" href="${esc(agHref('pipeline.html','deal='+encodeURIComponent(d.id)))}">Convert to customer →</a>`;
  else if(fwdOk)side=`<button class="primary" id="markComplete">Mark Stage as Complete</button>`;
  else side=`<span class="muted" style="font-size:13px">Get the agreement signed to convert</span>`;
  host.innerHTML=`<div class="pathcard">
    <div class="pathrow">
      <div class="path" role="group" aria-label="Deal stages">${steps}</div>
      <div class="path-side">${side}</div>
    </div>
    ${PENDING_BACK?`<div class="path-confirm">Move this deal back to <b>${esc(stageLabel(PENDING_BACK))}</b>?<button class="primary" id="backGo">Move back</button><button id="backNo">Cancel</button></div>`:''}
    ${GUIDE_OPEN?`<div class="path-guide"><b>Tip:</b> ${esc(g.tip)} · <b>Do next:</b> ${esc(g.action)}</div>`:''}
  </div>`;
  const mc=$('markComplete');
  if(mc)mc.addEventListener('click',()=>moveStage(fwd,mc));
  host.querySelectorAll('.pstep.canback').forEach(b=>b.addEventListener('click',()=>{
    PENDING_BACK=b.getAttribute('data-stage'); renderPath();   // only the honest one-back move renders interactive
  }));
  const cur=host.querySelector('.pstep.current');
  if(cur)cur.addEventListener('click',()=>{GUIDE_OPEN=!GUIDE_OPEN;renderPath();});
  const bg=$('backGo'); if(bg)bg.addEventListener('click',()=>{const to=PENDING_BACK;PENDING_BACK='';moveStage(to,bg);});
  const bn=$('backNo'); if(bn)bn.addEventListener('click',()=>{PENDING_BACK='';renderPath();});
}
async function moveStage(to,btn){
  if(!to||!DEAL||!DEAL.deal)return;
  if(btn)btn.disabled=true;
  const r=await apiAg('/sales/deals/'+encodeURIComponent(DEAL.deal.id)+'/stage','POST',{to});
  if(r.ok){
    DEAL.deal=r.body.data||DEAL.deal;
    PENDING_BACK='';   // any pending back-confirm strip is now against the OLD stage — drop it
    toast('Moved to '+stageLabel(to)+'.');
    renderHighlights();renderPath();
    if(TAB==='deal')showTab(TAB,true);   // the Deal pane shows stage/next-step — keep it honest
    loadActivity();
  }
  else{toast((r.body&&r.body.message)||'Couldn’t move the stage.');if(btn)btn.disabled=false;renderPath();}
}

function setTabUrl(tab){ const q=QP(); q.set('tab',tab); history.replaceState(null,'', '/crm.html?'+q.toString()); }

function showTab(tab,initial){
  TAB=tab;
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>{const on=b.getAttribute('data-tab')===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false');b.setAttribute('tabindex',on?'0':'-1');});
  if(!initial)setTabUrl(tab);
  const host=$('tabbody'); if(!host)return;
  host.setAttribute('aria-labelledby','tab-'+tab);
  if(tab==='details')return loadDetails(host);
  if(tab==='deal')return renderDealTab(host);
  if(tab==='delivery')return renderDeliveryTab(host);
  if(tab==='files')return renderFilesTab(host);
}

// ── Details tab: contact facts + custom fields + the relationship overview ──
// ONE contact fetch per contact id: the profile callback re-runs showTab('details')
// when PROFILE lands, and without the cache that duplicated the /sales/contacts/:id
// read and flashed the pane back to a spinner mid-paint.
let CONTACT_CACHE=null;   // {cid, promise}
async function loadDetails(host){
  const cid=(REC.identity&&REC.identity.contact_id)||'';
  let d=null;
  if(cid){
    if(!CONTACT_CACHE||CONTACT_CACHE.cid!==cid){
      CONTACT_CACHE={cid,promise:apiAg('/sales/contacts/'+encodeURIComponent(cid)).then(r=>r.ok?(r.body.data||{}):null)};
      host.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';   // spinner only when actually fetching
    }
    d=await CONTACT_CACHE.promise.catch(()=>null);
    if(d===null&&CONTACT_CACHE&&CONTACT_CACHE.cid===cid)CONTACT_CACHE=null;   // failed read → the next render retries
  }
  if(TAB!=='details')return;
  let html='';
  if(d){
    const c=d.contact||{}; const cf=d.custom_fields||[]; const cv=c.custom||{};
    DETAIL={cid,c};
    const rows=[['Name',c.name],['Company',c.company],['Email',c.email],['Phone',c.phone]].filter(x=>x[1]);
    html+=`<section><h2>Contact <button class="link" id="editContact" style="border:none;background:none;font-size:13px;color:var(--p);cursor:pointer;padding:0;text-transform:none;letter-spacing:0">Edit</button></h2><div class="card"><div class="kv">`+(rows.length?rows.map(x=>`<div class="k">${esc(x[0])}</div><div>${esc(x[1])}</div>`).join(''):'<div class="muted">No details yet — tap Edit to add them.</div>')+`</div></div></section>`;
    if(cf.length){
      html+=`<section><h2>Custom fields</h2><div class="card"><div class="kv">`+cf.map(f=>`<div class="k">${esc(f.label||f.key)}</div><div>${esc(cv[f.key]!=null&&cv[f.key]!==''?cv[f.key]:'—')}</div>`).join('')+`</div></div></section>`;
    }
    const deals=d.deals||[];
    if(deals.length){
      html+=`<section><h2>Deals</h2>`+deals.map(dl=>`<div class="card"><div style="font-weight:600">${esc(dl.title||'Deal')}</div><div class="muted">${esc(stageLabel(dl.stage||''))}${dl.last_contacted_at?' · last contacted '+esc(when(dl.last_contacted_at)):''}</div></div>`).join('')+`</section>`;
    }
  }else if(cid){
    html+=`<section><h2>Contact</h2><p class="muted">Couldn’t load contact details just now.</p></section>`;
  }
  // the relationship overview (health facts) folds in as a second card
  if(PROFILE){
    const p=PROFILE.profile||{}; const h=p.health;
    const facts=[
      ['Website', p.live?'Live':(p.last_published_at?'Offline':'Not yet'), p.last_published_at?('published '+when(p.last_published_at)):''],
      ['Approvals', String(p.pending_approvals||0), p.pending_approvals?'waiting':'all clear'],
      ['Connected', String(p.connected||0), p.connected_needing_attention?(p.connected_needing_attention+' need a look'):'healthy'],
      ['Moments', String(p.active_moments||0), 'worth a look'],
      ['Team', String(p.members||0), 'with access'],
    ];
    html+=`<section><h2>Relationship</h2><div class="card">`;
    if(h)html+=`<div style="margin-bottom:8px"><span class="chip ${esc(h)}"><span class="d"></span>${h==='attention'?'Needs attention':h==='new'?'Getting set up':h==='quiet'?'Quiet':'Healthy'}</span></div>`;
    if(PROFILE.summary)html+=`<p class="muted" style="margin:0 0 12px;font-size:14.5px">${esc(PROFILE.summary)}</p>`;
    html+=`<div class="facts">`+facts.map(f=>`<div class="fact"><div class="k">${esc(f[0])}</div><div class="v">${esc(f[1])} <small>${esc(f[2])}</small></div></div>`).join('')+`</div></div></section>`;
    if(p.pending_approvals>0){
      html+=`<section><div class="card"><p class="muted" style="margin-bottom:12px">${p.pending_approvals} ${p.pending_approvals===1?'change is':'changes are'} waiting for approval. Send a plain email with a one-tap approve link.</p><button class="primary" id="notifyapprove">Email the client to approve</button></div></section>`;
    }
  }
  if(!html)html='<p class="muted">No contact on file yet.</p>';
  host.innerHTML=html;
  const eb=$('editContact'); if(eb)eb.onclick=()=>editContact(host);
  const na=$('notifyapprove');if(na)na.addEventListener('click',async()=>{na.disabled=true;na.textContent='Sending…';const r=await api('/approve/send','POST');na.disabled=false;na.textContent='Email the client to approve';toast(r.ok?(r.body.data&&r.body.data.message||'Sent.'):(r.body.message||'Couldn’t send just now.'));});
}
// Edit the contact inline (PATCH /sales/contacts/:id — the existing path, kept).
function editContact(host){
  const c=(DETAIL&&DETAIL.c)||{}; const cid=DETAIL&&DETAIL.cid;

// ── THE activity timeline (the centerpiece) ──────────────────────────────────
// Data: GET /crm/activity. Deploy-order tolerance: if the route isn't there yet
// (404 / no items array — the function may not be redeployed), compose the same
// shape client-side from the OLD routes (/crm/messages + /crm/timeline). The
// fallback lacks deal system events — accepted; it never breaks the page.
// ACT_SEQ (SS6): a superseded activity load must never repaint the rail — only
// the newest request's outcome (server path OR fallback) is allowed to touch
// ACT and render.
let ACT_SEQ=0;
async function loadActivity(){
  const seq=++ACT_SEQ;
  const ids=idParams(); const q=[];
  if(ids.project)q.push('project='+encodeURIComponent(ids.project));
  if(REC.identity&&REC.identity.client_id)q.push('client_id='+encodeURIComponent(REC.identity.client_id));
  if(ids.deal)q.push('deal='+encodeURIComponent(ids.deal));
  const scopedCustomer=!!(REC.sections&&REC.sections.overview);   // the scope header alone resolves the identity server-side
  if(!q.length&&!scopedCustomer){ACT={items:[],upcoming:[],reply_to:null,reply_support_to:null,failed:false};renderRail();return;}
  const r=await api('/crm/activity?'+q.join('&'));
  if(seq!==ACT_SEQ)return;
  const d=(r.ok&&r.body.data)||{};
  if(r.ok&&Array.isArray(d.items)){
    ACT={items:d.items,upcoming:Array.isArray(d.upcoming)?d.upcoming:[],reply_to:d.reply_to||null,reply_support_to:d.reply_support_to||null,failed:false};
    renderRail();return;
  }
  await loadActivityFallback(q,seq);
  if(seq!==ACT_SEQ)return;
  renderRail();
}
// thin adapter mirroring the server's crm/activity.ts mappers
function convItem(m){
  if(!m||!m.created_at)return null;
  const at=m.created_at, id='conv:'+m.kind+':'+(m.id||''), mine=m.from==='studio', body=m.body||null;
  if(m.kind==='message')return{id,kind:'message',type:'message',title:mine?'You sent a message':'The client sent a message',body,at,meta:null,href:null};
  if(m.kind==='support')return{id,kind:'support',type:'message',title:(mine?'You':'The client')+' opened a support request'+(m.subject?' — '+m.subject:''),body,at,meta:'Support'+(m.status?' · '+String(m.status).replace(/_/g,' '):''),href:null};
  if(m.kind==='support_reply')return{id,kind:'support_reply',type:'message',title:mine?'You replied':'The client replied',body,at,meta:'Support',href:null};
  if(m.kind==='enquiry')return{id,kind:'enquiry',type:'message',title:'The client reached out from your website',body,at,meta:'Website enquiry',href:null};
  if(m.kind==='booking')return{id,kind:'booking',type:'call',title:m.subject||'The client booked a call',body,at,meta:'Booking',href:null};
  if(m.kind==='broadcast')return{id,kind:'broadcast',type:'email',title:'You sent a broadcast'+(m.subject?' — '+m.subject:''),body,at,meta:'Broadcast',href:null};
  if(m.kind==='activity'){
    const map={call:['call','You logged a call','Logged call'],email:['email','You logged an email','Logged email'],meeting:['call','You logged a meeting','Meeting'],note:['note','You added a note','Note'],proposal_sent:['system','Proposal sent','Deal'],contract_sent:['system','Agreement sent','Deal'],invoice_sent:['system','Invoice sent','Deal']};
    const t=map[m.activity_kind]||['note','You logged an activity','Activity'];
    return{id,kind:'activity',type:t[0],title:t[1],body,at,meta:t[2],href:null};
  }
  return null;
}
function siteItem(t){
  if(!t||!t.at)return null;
  if(t.kind==='note')return{id:'site:'+t.id,kind:'note',type:'note',title:t.title||'Note',body:t.detail||null,at:t.at,meta:t.audience==='internal'?'Internal note':'Shared note',href:null};
  const meta={publish:'Website',change:'Website',connected:'Connected',moment:'Moment',approval:'Approval',lead:'Enquiry'}[t.kind]||null;
  return{id:'site:'+t.id,kind:t.kind,type:'system',title:t.title||t.kind,body:t.detail||null,at:t.at,meta,href:null};
}
async function loadActivityFallback(q,seq){
  const ids=idParams(); const s=(REC&&REC.sections)||{};
  const [mr,tr,tk]=await Promise.all([
    api('/crm/messages?'+q.join('&')),
    s.overview?api('/crm/timeline'):Promise.resolve({ok:false,body:{}}),
    ids.deal?apiAg('/sales/deals/'+encodeURIComponent(ids.deal)+'/tasks'):Promise.resolve({ok:false,body:{}}),
  ]);
  if(seq!==undefined&&seq!==ACT_SEQ)return;   // superseded mid-flight — never mutate ACT
  if(!mr.ok&&!tr.ok){ACT={items:[],upcoming:[],reply_to:null,reply_support_to:null,failed:true};return;}
  const md=(mr.ok&&mr.body.data)||{};
  const items=[]; const push=(x)=>{if(x&&x.at)items.push(x);};
  for(const m of md.items||[])push(convItem(m));
  for(const t of (tr.ok&&tr.body.data&&tr.body.data.items)||[])push(siteItem(t));
  const tasks=(tk.ok&&Array.isArray(tk.body.data))?tk.body.data:[];
  for(const t of tasks)if(t.status==='done'&&(t.completed_at||t.created_at))push({id:'task:'+t.id,kind:'task',type:'task',title:'To-do completed — '+(t.title||'To-do'),body:null,at:t.completed_at||t.created_at,meta:'To-do',href:null});
  items.sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:0);
  // upcoming, composed from what the page already knows (open to-dos + the deal's
  // next step + unpaid invoices) — await the deal fetch so the band is deterministic
  // instead of racing loadPanels' parallel /sales/deals read
  await DEAL_READY.catch(()=>{});
  if(seq!==undefined&&seq!==ACT_SEQ)return;   // superseded while waiting on the deal read
  const today=new Date().toISOString().slice(0,10); const upcoming=[];
  const dealHref=ids.deal?agHref('pipeline.html','deal='+encodeURIComponent(ids.deal)):null;
  for(const t of tasks)if(t.status==='open')upcoming.push({kind:'task',id:t.id,title:t.title||'To-do',due:t.due_date||null,overdue:!!(t.due_date&&String(t.due_date).slice(0,10)<today),href:dealHref});
  const d=DEAL&&DEAL.deal;
  if(d&&d.next_step)upcoming.push({kind:'next_step',id:null,title:'Next step — '+d.next_step,due:d.next_step_at||null,overdue:!!(d.next_step_at&&String(d.next_step_at).slice(0,10)<today),href:dealHref});
  for(const iv of (DEAL&&DEAL.invoices)||[])if(iv.status==='open')upcoming.push({kind:'invoice',id:null,title:'Unpaid invoice'+(iv.title?' — '+iv.title:'')+(iv.amount_cents?' ('+fmtC(iv.amount_cents)+')':''),due:iv.due_date||null,overdue:!!(iv.due_date&&String(iv.due_date).slice(0,10)<today),href:dealHref});
  upcoming.sort((a,b)=>{if(!a.due&&!b.due)return 0;if(!a.due)return 1;if(!b.due)return -1;return a.due<b.due?-1:a.due>b.due?1:0;});
  ACT={items,upcoming,reply_to:md.reply_to||null,reply_support_to:md.reply_support_to||null,failed:false};
}

const FILTER_DEFS=[['all','All'],['message','Messages'],['call','Calls'],['task','Tasks'],['note','Notes'],['system','System']];
const filterMatch=(it)=>FILTER==='all'||(FILTER==='message'?(it.type==='message'||it.type==='email'):it.type===FILTER);
const TYPE_ICON={message:'💬',email:'✉',call:'📞',task:'✓',note:'✐',system:'⚙'};

// A rail refresh (Upcoming checkbox, Remove note, stage move…) rebuilds #acard —
// snapshot the composer's in-progress drafts first and restore them after, so a
// half-typed message/log/task/note survives. (The active COMPOSER tab already
// persists as module state.) Successful submits clear their field BEFORE the
// refresh, so a sent draft never resurrects.
const COMPOSER_FIELDS=['msgBody','logBody','logDate','taskTitle','taskDue','noteBody'];
function snapComposer(){
  const s={vals:{},focus:''};
  for(const id of COMPOSER_FIELDS){const el=$(id);if(el&&el.value)s.vals[id]=el.value;}
  const ae=document.activeElement; if(ae&&COMPOSER_FIELDS.includes(ae.id))s.focus=ae.id;
  return s;
}
function restoreComposer(s){
  if(!s)return;
  for(const id in s.vals){const el=$(id);if(el)el.value=s.vals[id];}
  if(s.focus){const el=$(s.focus);if(el)el.focus();}
}
// ── C3 (SS6): insertSavedReplies(textareaId) — the shared saved-reply insert.
// ONE lazy cached fetch per page-load; a picker only renders when replies
// exist. Bodies live in a JS map keyed by id (projects.html's picker idiom —
// nothing goes into an attribute); insert APPENDS after what's typed and
// refocuses the textarea. apiAg on purpose: saved replies are the OPERATOR's
// toolkit (their own site's settings) — a customer-scoped record must not
// resolve them against the customer's site (the /sales/* doctrine above).
// Kept in sync by hand with inbox.html's copy. ──
// SCOPE DOCTRINE (SS6, flagged decision): inbox.html's copy diverges — its
// api() carries the drill-in scope, so a drilled-in operator THERE gets the
// CUSTOMER site's reply set ("replies live where the conversation lives"),
// while this page always uses the operator's own. Both are defensible; which
// one wins is Eric's call (punchlist). No behavior change until then. ──
let SR_FETCH=null;
function insertSavedReplies(taId){
  const ta=$(taId);if(!ta)return;
  if(!SR_FETCH)SR_FETCH=apiAg('/service/saved-replies').then(r=>(r.ok&&r.body.data&&r.body.data.replies)||[]).catch(()=>[]);
  SR_FETCH.then((replies)=>{
    const cur=$(taId);
    if(!replies.length||cur!==ta)return;   // nothing saved / the composer re-rendered under us
    if(ta.previousElementSibling&&ta.previousElementSibling.classList.contains('sr-pick'))return;
    const map={};replies.forEach(x=>{map[x.id]=x.body;});
    const sel=document.createElement('select');
    sel.className='sr-pick';sel.setAttribute('aria-label','Insert a saved reply');
    sel.style.cssText='display:block;margin-bottom:6px;max-width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px';
    sel.innerHTML='<option value="">Insert a saved reply…</option>'+replies.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');
    sel.onchange=()=>{const b=map[sel.value];if(b){const v=ta.value;ta.value=v?(v.replace(/\s*$/,'')+'\n\n'+b):b;ta.focus();}sel.value='';};
    ta.parentNode.insertBefore(sel,ta);
  });
}
function renderRail(){
  const host=$('acard'); if(!host)return;
  if(ACT.failed){host.innerHTML='<p class="muted">Couldn’t load this record’s activity just now. <button id="actRetry" style="font-size:12.5px;padding:5px 12px">Try again</button></p>';const rt=$('actRetry');if(rt)rt.addEventListener('click',loadActivity);return;}
  const draft=snapComposer();

  renderComposer(); renderFilters(); renderUpcoming(); renderTimeline();
  restoreComposer(draft);
  if(FOCUS_COMPOSER){FOCUS_COMPOSER=false;host.scrollIntoView({block:'start'});const ta=$('msgBody');if(ta)ta.focus();}
}

// ── the composer: ONE publisher — Message · Log call · Task · Note ──────────

  return tabs;
}

  }else if(COMPOSER==='task'){
    html+=`<input type="text" id="taskTitle" placeholder="What needs doing?" aria-label="To-do title" maxlength="200" style="width:100%">
      <div class="composer-row"><label for="taskDue" style="font-size:12.5px;color:var(--faint)">Due</label><input type="date" id="taskDue" aria-label="Due date"><span class="spacer"></span><button class="primary" id="taskGo">Add to-do</button></div>`;
  }else if(COMPOSER==='note'){
    html+=`<textarea id="noteBody" placeholder="A note about this client… (internal by default)" aria-label="A note about this client"></textarea>
      <div class="composer-row"><span class="seg" role="group" aria-label="Who can see this note"><button data-aud="internal"${NEWAUD==='internal'?' class="on" aria-pressed="true"':' aria-pressed="false"'}>Internal</button><button data-aud="shared"${NEWAUD==='shared'?' class="on" aria-pressed="true"':' aria-pressed="false"'}>Shared with client</button></span><span class="spacer"></span><button class="primary" id="noteGo">Add note</button></div>
      <p class="muted" id="notehint" style="font-size:12.5px;margin-top:6px">${NEWAUD==='shared'?'The client will see this note.':'Internal notes stay with your studio.'}</p>`;
  }
  html+=`</div>`;
  host.innerHTML=html;
  host.querySelectorAll('[data-ct]').forEach(b=>b.addEventListener('click',()=>{COMPOSER=b.getAttribute('data-ct');renderComposer();}));
  // E2: the composer tablist honors the arrow-key contract — arrows move focus
  // AND selection (the re-render hands focus back to the moved-to tab);
  // Home/End jump. Roving tabindex is set in the markup above.
  const ctl=host.querySelector('.composer-tabs');
  if(ctl)ctl.addEventListener('keydown',(e)=>{
    const tabsEls=[...ctl.querySelectorAll('[data-ct]')];const i=tabsEls.indexOf(document.activeElement);
    if(i<0)return;let j=-1;
    if(e.key==='ArrowRight')j=(i+1)%tabsEls.length;
    else if(e.key==='ArrowLeft')j=(i-1+tabsEls.length)%tabsEls.length;
    else if(e.key==='Home')j=0;
    else if(e.key==='End')j=tabsEls.length-1;
    if(j<0)return;e.preventDefault();
    COMPOSER=tabsEls[j].getAttribute('data-ct');renderComposer();
    const nb=host.querySelector('[data-ct="'+COMPOSER+'"]');if(nb)nb.focus();
  });
  const f=$('msgForm'); if(f)f.onsubmit=sendMessage;
  if($('msgBody'))insertSavedReplies('msgBody');   // C3: the saved-reply picker, when any exist
  host.querySelectorAll('[data-lk]').forEach(b=>b.addEventListener('click',()=>{LOGKIND=b.getAttribute('data-lk');host.querySelectorAll('[data-lk]').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});}));
  const lg=$('logGo'); if(lg)lg.addEventListener('click',logActivity);
  const tg=$('taskGo'); if(tg)tg.addEventListener('click',addTask);
  host.querySelectorAll('[data-aud]').forEach(b=>b.addEventListener('click',()=>{NEWAUD=b.getAttribute('data-aud');host.querySelectorAll('[data-aud]').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});const hh=$('notehint');if(hh)hh.textContent=NEWAUD==='shared'?'The client will see this note.':'Internal notes stay with your studio.';}));
  const ng=$('noteGo'); if(ng)ng.addEventListener('click',addNote);
}
async function sendMessage(e){
  e.preventDefault();
  const ta=$('msgBody'); const body=(ta.value||'').trim(); if(!body)return;
  const replyPath=ACT.reply_to||ACT.reply_support_to;
  const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
  try{
    const rr=await api(replyPath,'POST',ACT.reply_to?{body,audience:'client'}:{body});
    if(rr.ok){ta.value='';toast('Sent.');await loadActivity();}
    else{toast((rr.body&&rr.body.message)||'Couldn’t send.');btn.disabled=false;}
  }catch(_){toast('Couldn’t send.');btn.disabled=false;}
}
async function logActivity(){
  const deal=idParams().deal; if(!deal)return;
  const body=($('logBody')&&$('logBody').value||'').trim();
  if(LOGKIND==='note'&&!body){toast('Write a short note.');return;}
  const btn=$('logGo'); btn.disabled=true;
  const r=await apiAg('/sales/deals/'+encodeURIComponent(deal)+'/activity','POST',{kind:LOGKIND,body,occurred_at:($('logDate')&&$('logDate').value)||undefined});
  if(r.ok){if($('logBody'))$('logBody').value='';if($('logDate'))$('logDate').value='';toast('Logged.');await loadActivity();}
  else{toast((r.body&&r.body.message)||'That didn’t save.');btn.disabled=false;}
}
async function addTask(){
  const deal=idParams().deal; if(!deal)return;
  const title=($('taskTitle')&&$('taskTitle').value||'').trim();
  if(!title){toast('Give the to-do a title.');return;}
  const btn=$('taskGo'); btn.disabled=true;
  const due=($('taskDue')&&$('taskDue').value)||'';
  const r=await apiAg('/sales/deals/'+encodeURIComponent(deal)+'/tasks','POST',due?{title,due_date:due}:{title});
  if(r.ok){if($('taskTitle'))$('taskTitle').value='';if($('taskDue'))$('taskDue').value='';toast('Added.');await loadActivity();}
  else{toast((r.body&&r.body.message)||'That didn’t save.');btn.disabled=false;}
}
async function addNote(){
  const body=($('noteBody')&&$('noteBody').value||'').trim();
  if(!body){toast('Write a little something first.');return;}
  const btn=$('noteGo'); btn.disabled=true;
  const r=await api('/crm/notes','POST',{audience:NEWAUD,body});
  if(r.ok){if($('noteBody'))$('noteBody').value='';toast(r.body.data&&r.body.data.message||'Saved.');await loadActivity();}
  else{toast((r.body&&r.body.message)||'That didn’t save.');btn.disabled=false;}
}

function renderFilters(){
  const host=$('fchips'); if(!host)return;
  host.innerHTML=FILTER_DEFS.map(f=>`<button data-f="${f[0]}"${FILTER===f[0]?' class="on" aria-pressed="true"':' aria-pressed="false"'}>${f[1]}</button>`).join('');
  host.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{FILTER=b.getAttribute('data-f');renderFilters();renderTimeline();}));
}

// ── Upcoming & Overdue band ──────────────────────────────────────────────────
function renderUpcoming(){
  const host=$('upband'); if(!host)return;
  const ups=ACT.upcoming||[];
  if(!ups.length){host.innerHTML='';return;}
  host.innerHTML=`<div class="upband"><div class="bt">Upcoming &amp; overdue</div>`+ups.map(u=>{
    const icon=u.kind==='invoice'?'🧾':u.kind==='next_step'?'→':'';
    const box=u.kind==='task'&&u.id?`<input type="checkbox" data-updone="${esc(u.id)}" aria-label="Mark done: ${esc(u.title)}">`:(icon?`<span aria-hidden="true">${icon}</span>`:'');
    const title=u.href?`<a href="${esc(pinHref(u.href))}">${esc(u.title)}</a>`:esc(u.title);
    return `<div class="uprow ${u.overdue?'overdue':''}">${box}<span class="ut" style="min-width:0">${title}</span><span class="due">${u.overdue?'overdue · ':''}${esc(dueLabel(u.due))}</span></div>`;
  }).join('')+`</div>`;
  host.querySelectorAll('[data-updone]').forEach(cb=>cb.addEventListener('change',async()=>{
    cb.disabled=true;
    const r=await apiAg('/sales/deal-tasks/'+cb.getAttribute('data-updone'),'PATCH',{status:'done'});
    if(r.ok){toast('Done.');await loadActivity();}
    else{toast('Couldn’t update that to-do.');cb.checked=false;cb.disabled=false;}
  }));
}

// ── the timeline itself: month groups, typed icons on a connector line ──────
// The Notes chip is a REAL notes view (GET /crm/notes: pinned-first, 100 notes,
// Pin/Unpin + Remove) — the merged timeline's note items only carry what the
// site-timeline caps let through. If that fetch fails (route not deployed yet,
// hiccup), it falls back to the merged filter. All other chips filter the merge.
function renderTimeline(){
  const host=$('timeline'); if(!host)return;
  if(FILTER==='note')return void renderNotesView(host);
  renderMergedTimeline(host);
}
async function renderNotesView(host){
  host.innerHTML='<div class="spin" role="status" aria-label="Loading notes"></div>';
  let r; try{r=await api('/crm/notes');}catch(_){r={ok:false,body:{}};}
  if(FILTER!=='note'||host!==$('timeline'))return;   // filter moved on / the rail re-rendered underneath us
  const notes=(r.ok&&r.body.data&&Array.isArray(r.body.data.notes))?r.body.data.notes:null;
  if(!notes)return renderMergedTimeline(host);       // best-effort: fall back to the merged filter
  if(!notes.length){host.innerHTML='<p class="muted" style="margin-top:16px;font-size:13.5px">No notes yet — add one from the composer.</p>';return;}
  host.innerHTML=notes.map(n=>{
    const aud=n.audience==='internal'?'Internal note':'Shared note';
    return `<div class="ti t-note"><span class="ti-icon" aria-hidden="true">${TYPE_ICON.note}</span><div class="ti-main">
      <div class="ti-head"><span class="ti-title">${n.pinned?'📌 Pinned note':'Note'}</span><span class="ti-meta">${aud}</span></div>
      <div class="ti-body">${esc(n.body||'')}<div class="note-acts"><button data-pin="${esc(n.id)}" data-on="${n.pinned?'':'1'}">${n.pinned?'Unpin':'Pin'}</button><button data-delnote="${esc(n.id)}">Remove</button></div></div>
    </div><span class="ti-when">${esc(when(n.created_at))}</span></div>`;
  }).join('');
  host.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;
    const pr=await api('/crm/notes/'+b.getAttribute('data-pin')+'/pin','POST',{pinned:b.getAttribute('data-on')==='1'});
    if(pr.ok)renderNotesView(host);   // re-fetch: pinned-first order is the server's
    else{toast('Couldn’t update that note.');b.disabled=false;}
  }));
  host.querySelectorAll('[data-delnote]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;
    const dr=await api('/crm/notes/'+b.getAttribute('data-delnote'),'DELETE');
    if(dr.ok){toast('Removed.');await loadActivity();}   // the merged All view changes too
    else{toast('Couldn’t remove that note.');b.disabled=false;}
  }));
}
function renderMergedTimeline(host){
  const items=(ACT.items||[]).filter(filterMatch);
  if(!items.length){host.innerHTML=`<p class="muted" style="margin-top:16px;font-size:13.5px">${(ACT.items||[]).length?'Nothing matches this filter.':'Nothing here yet — messages, calls, and system events will appear as they happen.'}</p>`;return;}
  let html=''; let curMonth='';
  for(const it of items){
    const mk=String(it.at).slice(0,7);
    if(mk!==curMonth){
      curMonth=mk;
      const dt=new Date(mk+'-15T12:00:00Z');
      html+=`<div class="tl-month">${isNaN(dt)?esc(mk):dt.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>`;
    }
    const type=TYPE_ICON[it.type]?it.type:'system';
    const open=EXPANDED.has(it.id);
    const meta=it.meta?`<span class="ti-meta">${esc(it.meta)}</span>`:'';
    const head=it.body
      ?`<button class="ti-head" data-x="${esc(it.id)}" aria-expanded="${open?'true':'false'}"><span class="ti-car" aria-hidden="true">${open?'▾':'▸'}</span><span class="ti-title">${esc(it.title)}</span>${meta}</button>`
      :`<div class="ti-head"><span class="ti-title">${esc(it.title)}</span>${meta}${it.href?` <a class="ti-link" href="${esc(pinHref(it.href))}">open →</a>`:''}</div>`;
    let bodyHtml='';
    if(it.body&&open){
      const noteId=(it.kind==='note'&&/note:([0-9a-f-]{36})$/i.test(it.id))?it.id.match(/note:([0-9a-f-]{36})$/i)[1]:'';
      bodyHtml=`<div class="ti-body">${esc(it.body)}${noteId?`<div class="note-acts"><button data-delnote="${esc(noteId)}">Remove note</button></div>`:''}${it.href?`<div style="margin-top:5px"><a class="ti-link" href="${esc(pinHref(it.href))}">open →</a></div>`:''}</div>`;
    }
    html+=`<div class="ti t-${type}"><span class="ti-icon" aria-hidden="true">${TYPE_ICON[type]}</span><div class="ti-main">${head}${bodyHtml}</div><span class="ti-when">${esc(when(it.at))}</span></div>`;
  }
  host.innerHTML=html;
  host.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.getAttribute('data-x');
    if(EXPANDED.has(id))EXPANDED.delete(id);else EXPANDED.add(id);
    renderTimeline();
  }));
  host.querySelectorAll('[data-delnote]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;
    const r=await api('/crm/notes/'+b.getAttribute('data-delnote'),'DELETE');
    if(r.ok){toast('Removed.');await loadActivity();}
    else{toast('Couldn’t remove that note.');b.disabled=false;}
  }));
}

function picker(){$('main').innerHTML=`<div class="center"><h2>Open a client to see their record.</h2><p class="muted" style="margin-bottom:18px">Pick a customer, contact, or deal — their whole relationship opens here.</p><p><a class="link" href="/customers.html">Go to Customers →</a></p></div>`;}
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to open a client record.</h2><p style="margin-top:20px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load this just now.</h2><p class="muted" style="margin-bottom:16px">It’s probably a brief hiccup.</p><button id="retry" class="primary">Try again</button></div>`;const rt=$('retry');if(rt)rt.addEventListener('click',loadRecord);}

(async function(){
  try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){signedOut();return;}await loadRecord();
  }catch(_){trouble();}
})();
</script>
