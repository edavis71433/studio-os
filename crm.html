<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="One client record — the whole relationship from first enquiry through delivery, in one place.">
<style>
  :root{
    --bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;
    --p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--warn-soft:#f3ead9;--bad:#a3423a;
    --shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--bad:#e39a92;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:26px 20px 90px}
  a.back{display:inline-flex;align-items:center;gap:5px;color:var(--soft);text-decoration:none;font-size:13.5px;font-weight:600}
  a.back:hover{color:var(--p)}
  .rec-head{margin-top:14px}
  .rec-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,5vw,33px);letter-spacing:-.01em;margin:0}
  .rec-sub{color:var(--soft);font-size:14.5px;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .rec-sub a{color:var(--p);text-decoration:none} .rec-sub a:hover{text-decoration:underline}
  .statuschip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--p-soft);color:var(--p)}
  .statuschip.customer{background:var(--good-soft);color:var(--good)}
  .hlstrip{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .hl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow);min-width:96px}
  .hl-k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .hl-v{font-family:var(--serif);font-size:17px;margin-top:2px}
  .tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{border:none;background:transparent;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--soft);padding:11px 15px;cursor:pointer;border-bottom:2.5px solid transparent;border-radius:0;white-space:nowrap;transition:.15s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{color:var(--p);border-bottom-color:var(--p)}
  #tabbody{margin-top:22px}
  .msg-thread{display:flex;flex-direction:column;gap:10px;max-width:720px}
  .brow{display:flex}
  .brow.me{justify-content:flex-end}
  .bubble{max-width:80%;border:1px solid var(--line);border-radius:14px;padding:10px 13px;box-shadow:var(--shadow)}
  .bubble.client{background:var(--card);border-bottom-left-radius:4px}
  .bubble.studio{background:var(--p-soft);border-color:transparent;border-bottom-right-radius:4px}
  .b-sub{font-weight:700;font-size:13px;margin-bottom:4px}
  .b-status{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 7px;margin-left:4px}
  .b-body{font-size:14.5px;white-space:pre-wrap;line-height:1.5}
  .b-when{font-size:11.5px;color:var(--faint);margin-top:5px}
  .msg-compose{margin-top:18px;max-width:720px}
  .msg-compose textarea{margin-top:5px}
  .embed-frame{width:100%;height:calc(100vh - 210px);min-height:540px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
  .rolebadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:5px 12px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 11px}
  .chip .d{width:7px;height:7px;border-radius:50%}
  .chip.healthy{background:var(--good-soft);color:var(--good)} .chip.healthy .d{background:var(--good)}
  .chip.attention{background:var(--warn-soft);color:var(--warn)} .chip.attention .d{background:var(--warn)}
  .chip.new,.chip.quiet{background:var(--p-soft);color:var(--p)} .chip.new .d,.chip.quiet .d{background:var(--p)}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .fact .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .fact .v{font-family:var(--serif);font-size:20px;margin-top:3px}
  .fact .v small{font-family:var(--sans);font-size:12.5px;color:var(--soft);font-weight:400}
  section{margin-top:28px}
  h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
  .note{display:flex;gap:12px;align-items:flex-start}
  .note .body{flex:1;font-size:14.5px;white-space:pre-wrap}
  .note .meta{font-size:12px;color:var(--faint);margin-top:5px}
  .note .aud{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
  .note .aud.internal{background:var(--p-soft);color:var(--p)} .note .aud.shared{background:var(--good-soft);color:var(--good)}
  .note .acts{display:flex;gap:8px}
  .note .acts button{font-size:12px;padding:5px 10px}
  .tl{position:relative;padding-left:20px}
  .tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .ev{position:relative;padding:0 0 16px 8px}
  .ev:before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--p);border:2px solid var(--bg)}
  .ev.publish:before{background:var(--good)} .ev.approval:before{background:var(--warn)} .ev.note:before{background:var(--p)} .ev.connected:before{background:#3f6f8a} .ev.moment:before{background:var(--p)}
  .ev .t{font-size:14.5px;font-weight:600}
  .ev .dt{font-size:13.5px;color:var(--soft);margin-top:1px}
  .ev .when{font-size:12px;color:var(--faint);margin-top:2px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14.5px}
  .kv .k{color:var(--faint);font-weight:600}
  textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;resize:vertical;min-height:70px}
  textarea:focus{outline:none;border-color:var(--p)}
  .noterow{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 15px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--p);color:var(--p)} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--p);color:#fff;border-color:var(--p)} button.primary:hover{background:var(--p-deep);color:#fff}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{border:none;border-radius:0;padding:8px 14px;font-size:13px}
  .seg button.on{background:var(--p-soft);color:var(--p)}
  a.link{color:var(--p);text-decoration:none;font-weight:600;font-size:14px} a.link:hover{text-decoration:underline}
  .muted{color:var(--soft);font-size:14px}
  .center{text-align:center;padding:56px 20px}
  .center h2{display:block;font-family:var(--serif);font-weight:500;font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 8px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>Studio OS · One client record — the whole relationship in one place. It reflects real activity; it never sells or scores.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dds-hint" data-hint="crm-notes" hidden>Notes here stay private to you unless you mark one “shared” — then the client sees it too.</div>

<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
// ── The unified Client Record ────────────────────────────────────────────────
// ONE relationship, one page. /crm/record resolves whatever key the URL carries
// (?client= / ?deal= / ?contact= / ?project=) into a canonical identity + which
// tabs exist. Overview + Details render inline (relationship health, contact
// facts); Deal + Delivery embed the existing, battle-tested pipeline/project
// panels (same-origin iframes, ?embed=1) so nothing is duplicated. The server
// enforces audience + tenant scope; this page just presents what it's given.
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="";
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;});
const QP=()=>new URLSearchParams(location.search);
const scopeParam=()=>QP().get('client')||'';
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':scopeParam()});
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
function toast(m){if(window.ddsToast)return void ddsToast(m);const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function when(iso){if(!iso)return'';const d=Math.floor((Date.now()-Date.parse(iso))/86400000);if(d<=0)return'today';if(d===1)return'yesterday';if(d<7)return d+' days ago';if(d<14)return'last week';if(d<60)return Math.floor(d/7)+' weeks ago';return Math.floor(d/30)+' months ago';}
const ICON={publish:'✓',change:'✎',connected:'⇄',moment:'✦',approval:'⏳',note:'✐'};

let REC=null, TAB='', STUDIO=true, NEWAUD='internal', MSG_REPLY_TO=null, MSG_REPLY_SUP=null;
const TAB_LABEL={overview:'Overview',messages:'Messages',deal:'Deal',delivery:'Delivery',details:'Details'};
const TAB_ORDER=['overview','messages','deal','delivery','details'];

// Build the query for /crm/record from whatever the URL carries.
function recordQuery(){
  const q=QP(); const parts=[];
  for(const k of ['client','client_id','deal','contact','project']){const v=q.get(k); if(v)parts.push(k+'='+encodeURIComponent(v));}
  return parts.length?('?'+parts.join('&')):'';
}
function idParams(){ // the identity keys to carry onto embed iframes / sub-links
  const id=(REC&&REC.identity)||{}; return {client:id.customer_site_id||scopeParam()||'', deal:id.deal_id||'', project:id.project_id||'', contact:id.contact_id||''};
}

async function loadRecord(){
  const rq=recordQuery();
  if(!rq){ picker(); return; }
  const r=await api('/crm/record'+rq);
  if(r.status===403){ $('main').innerHTML=`<div class="center"><h2>This lives in your studio workspace.</h2><p class="muted">${esc((r.body&&r.body.message)||'Only your studio can open a client record.')}</p></div>`; return; }
  if(!r.ok){ trouble(); return; }
  REC=r.body.data||{};
  // Canonical addressing: a converted customer is addressed by their SITE so the
  // scope (x-dds-scope-site) is right for Overview + every embed. If we arrived by
  // ?deal=/?contact= but the canonical key is the customer site and it isn't the
  // current scope, reload once to the canonical URL (one hop, no loop).
  const canon=REC.canonical||{};
  if(canon.key==='client' && canon.value && QP().get('client')!==canon.value){
    const t=QP().get('tab')||REC.default_tab||''; const suffix=t?('&tab='+encodeURIComponent(t)):'';
    location.replace('/crm.html?client='+encodeURIComponent(canon.value)+suffix); return;
  }
  const want=QP().get('tab');
  const avail=TAB_ORDER.filter(t=>REC.sections&&REC.sections[t]);
  TAB=(want&&avail.includes(want))?want:(avail.includes(REC.default_tab)?REC.default_tab:(avail[0]||''));
  renderShell(); showTab(TAB,true);
}

function renderShell(){
  const hd=REC.header||{}; const nm=hd.name||'Client'; const isCust=hd.status==='customer';
  const bits=[];
  if(hd.company)bits.push(esc(hd.company));
  if(hd.email)bits.push(`<a href="mailto:${esc(hd.email)}">${esc(hd.email)}</a>`);
  if(hd.phone)bits.push(`<a href="tel:${esc(hd.phone)}">${esc(hd.phone)}</a>`);
  const avail=TAB_ORDER.filter(t=>REC.sections&&REC.sections[t]);
  const tabsHtml=avail.map(t=>`<button data-tab="${t}"${t===TAB?' class="on"':''} role="tab" aria-selected="${t===TAB?'true':'false'}">${TAB_LABEL[t]}</button>`).join('');
  // highlights strip — the record's pinned key facts (Salesforce highlights panel).
  const hl=REC.highlights||{}; const fmtC=(c)=>'$'+Math.round((Number(c)||0)/100).toLocaleString(); const hb=[];
  if(hl.value_cents)hb.push(['Deal value',esc(fmtC(hl.value_cents))]);
  if(hl.stage)hb.push(['Stage',esc(String(hl.stage).replace('_',' '))]);
  if(hl.owed_cents)hb.push(['Outstanding',esc(fmtC(hl.owed_cents))]);
  if(hl.next_step)hb.push(['Next step',esc(String(hl.next_step))]);
  const hlStrip=hb.length?`<div class="hlstrip">${hb.map(b=>`<div class="hl"><div class="hl-k">${b[0]}</div><div class="hl-v">${b[1]}</div></div>`).join('')}</div>`:'';
  $('main').innerHTML=`
    <a class="back" href="/customers.html">← Customers</a>
    <div class="rec-head">
      <h1 id="pagehead" tabindex="-1">${esc(nm)}</h1>
      <div class="rec-sub"><span class="statuschip ${isCust?'customer':''}">${isCust?'Customer':'Prospect'}</span>${bits.length?' <span>'+bits.join(' · ')+'</span>':''}</div>
    </div>
    ${hlStrip}
    <div class="tabs" role="tablist">${tabsHtml}</div>
    <div id="tabbody"><div class="spin" role="status" aria-label="Loading"></div></div>`;
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.getAttribute('data-tab'))));
}

function setTabUrl(tab){ const q=QP(); q.set('tab',tab); history.replaceState(null,'', '/crm.html?'+q.toString()); }

function showTab(tab,initial){
  TAB=tab;
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>{const on=b.getAttribute('data-tab')===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false');});
  if(!initial)setTabUrl(tab);
  const host=$('tabbody'); if(!host)return; host.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';
  if(tab==='overview')return loadOverview(host);
  if(tab==='messages')return loadMessages(host);
  if(tab==='details')return loadDetails(host);
  // Deal + Delivery embeds run UNSCOPED on purpose: the deal/project rows live on
  // the operator's own agency site, so the embedded page must resolve against that
  // site (no ?client=, which would mis-scope it to the customer's own site where
  // the deal doesn't exist). Only the Overview tab needs the customer-site scope.
  const ids=idParams();
  if(tab==='deal'){ const src='/pipeline.html?deal='+encodeURIComponent(ids.deal)+'&embed=1'; host.innerHTML=`<iframe class="embed-frame" title="Deal" src="${esc(src)}"></iframe>`; return; }
  if(tab==='delivery'){ const src='/projects.html?project='+encodeURIComponent(ids.project)+'&embed=1'; host.innerHTML=`<iframe class="embed-frame" title="Delivery" src="${esc(src)}"></iframe>`; return; }
}

// ── Overview tab (the relationship view — reuses /crm/profile|timeline|notes) ──
async function loadOverview(host){
  const [p,tl,nt]=await Promise.all([api('/crm/profile'),api('/crm/timeline'),api('/crm/notes')]);
  if(!p.ok){host.innerHTML='<p class="muted">Couldn’t load the overview just now.</p>';return;}
  const d=p.body.data||{}; STUDIO=!!d.is_studio_view;
  renderOverview(host, d.profile||{}, d.summary||'', (nt.ok&&nt.body.data.notes)||[], (tl.ok&&tl.body.data.items)||[]);
}
function renderOverview(host, profile, summary, notes, items){
  const h=profile.health;
  const facts=[
    ['Website', profile.live?'Live':(profile.last_published_at?'Offline':'Not yet'), profile.last_published_at?('published '+when(profile.last_published_at)):''],
    ['Approvals', String(profile.pending_approvals||0), profile.pending_approvals?'waiting':'all clear'],
    ['Connected', String(profile.connected||0), profile.connected_needing_attention?(profile.connected_needing_attention+' need a look'):'healthy'],
    ['Moments', String(profile.active_moments||0), 'worth a look'],
    ['Team', String(profile.members||0), 'with access'],
  ];
  let html=`<div style="margin-bottom:6px"><span class="chip ${esc(h)}"><span class="d"></span>${h==='attention'?'Needs attention':h==='new'?'Getting set up':h==='quiet'?'Quiet':'Healthy'}</span></div>`;
  if(summary)html+=`<p class="muted" style="margin:0 2px 14px;font-size:15px">${esc(summary)}</p>`;
  html+=`<div class="facts">`+facts.map(f=>`<div class="fact"><div class="k">${esc(f[0])}</div><div class="v">${esc(f[1])} <small>${esc(f[2])}</small></div></div>`).join('')+`</div>`;
  if(STUDIO && profile.pending_approvals>0){
    html+=`<section><div class="card"><p class="muted" style="margin-bottom:12px">${profile.pending_approvals} ${profile.pending_approvals===1?'change is':'changes are'} waiting for approval. Send a plain email with a one-tap approve link.</p><button class="primary" id="notifyapprove">Email the client to approve</button></div></section>`;
  }
  html+=`<section><h2>Notes</h2><div class="card"><textarea id="nb" aria-label="${STUDIO?'A note about this client':'A note for your studio'}" placeholder="${STUDIO?'A note about this client… (internal by default)':'Leave a note for your studio…'}"></textarea><div class="noterow">`;
  if(STUDIO)html+=`<span class="seg" role="group" aria-label="Who can see this note"><button data-aud="internal" class="on" aria-pressed="true">Internal</button><button data-aud="shared" aria-pressed="false">Shared with client</button></span>`;
  html+=`<button class="primary" id="addnote">Add note</button><span class="muted" id="notehint">${STUDIO?'Internal notes stay with your studio.':'Your studio will see this.'}</span></div></div>`;
  if(!notes.length)html+=`<p class="muted" style="margin:2px 4px 0">No notes yet.</p>`;
  for(const n of notes){
    html+=`<div class="card note"><div class="body">${esc(n.body)}<div class="meta"><span class="aud ${esc(n.audience)}">${n.audience==='internal'?'Internal':'Shared'}</span> · ${esc(when(n.created_at))}</div></div>`;
    if(STUDIO)html+=`<div class="acts"><button data-pin="${esc(n.id)}">${n.pinned?'Unpin':'Pin'}</button><button data-del="${esc(n.id)}">Remove</button></div>`;
    html+=`</div>`;
  }
  html+=`</section>`;
  html+=`<section><h2>Activity</h2>`;
  if(!items.length)html+=`<p class="muted">Nothing yet — activity will appear here as it happens.</p>`;
  else{html+=`<div class="tl">`;for(const e of items){html+=`<div class="ev ${esc(e.kind)}"><div class="t">${ICON[e.kind]||'•'} ${esc(e.title)}</div>${e.detail?`<div class="dt">${esc(e.detail)}</div>`:''}<div class="when">${esc(when(e.at))}</div></div>`;}html+=`</div>`;}
  html+=`</section>`;
  host.innerHTML=html; wireOverview();
}
function wireOverview(){
  const add=$('addnote');if(add)add.addEventListener('click',addNote);
  document.querySelectorAll('[data-aud]').forEach(b=>b.addEventListener('click',()=>{NEWAUD=b.getAttribute('data-aud');document.querySelectorAll('[data-aud]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b?'true':'false');});const hh=$('notehint');if(hh)hh.textContent=NEWAUD==='shared'?'The client will see this note.':'Internal notes stay with your studio.';}));
  document.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click',()=>pin(b.getAttribute('data-pin'),b.textContent==='Pin')));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>del(b.getAttribute('data-del'))));
  const na=$('notifyapprove');if(na)na.addEventListener('click',async()=>{na.disabled=true;na.textContent='Sending…';const r=await api('/approve/send','POST');na.disabled=false;na.textContent='Email the client to approve';toast(r.ok?(r.body.data&&r.body.data.message||'Sent.'):(r.body.message||'Couldn’t send just now.'));});
}
async function addNote(){const t=$('nb');const body=(t&&t.value||'').trim();if(!body){toast('Write a little something first.');return;}const btn=$('addnote');btn.disabled=true;const r=await api('/crm/notes','POST',{audience:STUDIO?NEWAUD:'shared',body});btn.disabled=false;if(r.ok){toast(r.body.data&&r.body.data.message||'Saved.');loadOverview($('tabbody'));}else{toast(r.body.message||'That didn’t save.');}}
async function pin(id,on){const r=await api('/crm/notes/'+id+'/pin','POST',{pinned:on});if(r.ok)loadOverview($('tabbody'));else toast('Couldn’t update that note.');}
async function del(id){const r=await api('/crm/notes/'+id,'DELETE');if(r.ok){toast('Removed.');loadOverview($('tabbody'));}else toast('Couldn’t remove that note.');}

// ── Details tab (contact facts + custom fields — inline from /sales/contacts/:id) ──
let DETAIL=null;
async function loadDetails(host){
  const cid=(REC.identity&&REC.identity.contact_id)||''; if(!cid){host.innerHTML='<p class="muted">No contact on file yet.</p>';return;}
  const r=await api('/sales/contacts/'+cid);
  if(!r.ok){host.innerHTML='<p class="muted">Couldn’t load contact details just now.</p>';return;}
  const d=r.body.data||{}; const c=d.contact||{}; const cf=d.custom_fields||[]; const cv=c.custom||{};
  DETAIL={cid,c};
  const rows=[['Name',c.name],['Company',c.company],['Email',c.email],['Phone',c.phone]].filter(x=>x[1]);
  let html=`<section><h2>Contact <button class="link" id="editContact" style="border:none;background:none;font-size:13px;color:var(--p);cursor:pointer;padding:0;text-transform:none;letter-spacing:0">Edit</button></h2><div class="card"><div class="kv">`+(rows.length?rows.map(x=>`<div class="k">${esc(x[0])}</div><div>${esc(x[1])}</div>`).join(''):'<div class="muted">No details yet — tap Edit to add them.</div>')+`</div></div></section>`;
  if(cf.length){
    html+=`<section><h2>Details</h2><div class="card"><div class="kv">`+cf.map(f=>`<div class="k">${esc(f.label||f.key)}</div><div>${esc(cv[f.key]!=null&&cv[f.key]!==''?cv[f.key]:'—')}</div>`).join('')+`</div></div></section>`;
  }
  const deals=d.deals||[];
  if(deals.length){
    html+=`<section><h2>Deals</h2>`+deals.map(dl=>`<div class="card"><div style="font-weight:600">${esc(dl.title||'Deal')}</div><div class="muted">${esc(dl.stage||'')}${dl.last_contacted_at?' · last contacted '+esc(when(dl.last_contacted_at)):''}</div></div>`).join('')+`</section>`;
  }
  host.innerHTML=html;
  const eb=$('editContact'); if(eb)eb.onclick=()=>editContact(host);
}
// Edit the contact inline — restores the severed contact-editing path (PATCH /sales/contacts/:id).
function editContact(host){
  const c=(DETAIL&&DETAIL.c)||{}; const cid=DETAIL&&DETAIL.cid;
  const field=(id,label,val,type)=>`<label class="mut" for="${id}" style="font-size:12.5px;color:var(--faint);display:block;margin-top:10px">${label}</label><input id="${id}" type="${type||'text'}" value="${esc(val||'')}" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px">`;
  host.innerHTML=`<section><h2>Edit contact</h2><div class="card">
    ${field('ec-name','Name',c.name)}${field('ec-company','Company',c.company)}${field('ec-email','Email',c.email,'email')}${field('ec-phone','Phone',c.phone,'tel')}
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:14px"><button id="ec-cancel">Cancel</button><button class="primary" id="ec-save">Save</button></div></div></section>`;
  $('ec-cancel').onclick=()=>loadDetails(host);
  $('ec-save').onclick=async()=>{
    const body={name:$('ec-name').value.trim(),company:$('ec-company').value.trim(),email:$('ec-email').value.trim(),phone:$('ec-phone').value.trim()};
    const btn=$('ec-save'); btn.disabled=true;
    const r=await api('/sales/contacts/'+cid,'PATCH',body);
    if(r.ok){toast('Saved.');loadDetails(host);}else{toast((r.body&&r.body.message)||'Couldn’t save.');btn.disabled=false;}
  };
}

// ── Messages tab — ONE conversation with this client (Salesforce activity model) ──
// Every message + support ticket + reply, merged chronologically. One reply box that
// sends to the client (a project message). Support tickets show inline with status.
async function loadMessages(host){
  const ids=idParams(); const q=[]; if(ids.project)q.push('project='+encodeURIComponent(ids.project)); if(REC.identity&&REC.identity.client_id)q.push('client_id='+encodeURIComponent(REC.identity.client_id));
  const r=await api('/crm/messages'+(q.length?('?'+q.join('&')):''));
  if(!r.ok){host.innerHTML='<p class="muted">Couldn’t load this conversation just now.</p>';return;}
  const d=r.body.data||{}; const items=d.items||[]; MSG_REPLY_TO=d.reply_to||null; MSG_REPLY_SUP=d.reply_support_to||null;
  // channel tags — every communication kind is labeled (the Salesforce activity model)
  const ACT_TAG={call:['📞','Logged call'],email:['✉️','Logged email'],meeting:['🤝','Meeting'],note:['📝','Note'],proposal_sent:['📄','Proposal sent'],contract_sent:['✍️','Contract sent'],invoice_sent:['🧾','Invoice sent']};
  const headFor=(m)=>{
    if(m.kind==='support')return `<div class="b-sub">🎫 ${esc(m.subject||'Support request')}${m.status?` <span class="b-status">${esc(m.status)}</span>`:''}</div>`;
    if(m.kind==='enquiry')return `<div class="b-sub">🌐 ${esc(m.subject||'Website enquiry')}</div>`;
    if(m.kind==='booking')return `<div class="b-sub">📅 ${esc(m.subject||'Booking')}</div>`;
    if(m.kind==='broadcast')return `<div class="b-sub">📣 Email broadcast: ${esc(m.subject||'')}</div>`;
    if(m.kind==='activity'){const t=ACT_TAG[m.activity_kind]||['📝','Activity'];return `<div class="b-sub">${t[0]} ${esc(t[1])}</div>`;}
    return '';
  };
  let thread='';
  if(!items.length)thread='<p class="muted" style="padding:8px 2px">No messages yet. Say hello below.</p>';
  else thread=items.map(m=>{
    const mine=m.from==='studio';
    return `<div class="brow ${mine?'me':'them'}"><div class="bubble ${mine?'studio':'client'}">${headFor(m)}${m.body?`<div class="b-body">${esc(m.body)}</div>`:''}<div class="b-when">${mine?'You':'Client'} · ${esc(when(m.created_at))}</div></div></div>`;
  }).join('');
  const replyPath=MSG_REPLY_TO||MSG_REPLY_SUP;
  host.innerHTML=`<div class="msg-thread">${thread}</div>`+
    (replyPath?`<form id="msgForm" class="msg-compose"><label class="mut" for="msgBody" style="font-size:12.5px;color:var(--faint)">${MSG_REPLY_TO?'Reply to the client':'Reply to the client (their open support thread)'}</label><textarea id="msgBody" placeholder="Write a message…" aria-label="Reply to the client"></textarea><div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="primary" type="submit">Send</button></div></form>`
      :`<p class="muted" style="margin-top:14px">Replies open once this client has a project or an open support thread.</p>`);
  const f=$('msgForm'); if(f)f.onsubmit=async(e)=>{e.preventDefault();const ta=$('msgBody');const body=(ta.value||'').trim();if(!body)return;const btn=f.querySelector('button');btn.disabled=true;try{const rr=await api(replyPath,'POST',MSG_REPLY_TO?{body,audience:'client'}:{body});if(rr.ok){ta.value='';loadMessages($('tabbody'));}else{toast((rr.body&&rr.body.message)||'Couldn’t send.');btn.disabled=false;}}catch(_){toast('Couldn’t send.');btn.disabled=false;}};
}

function picker(){$('main').innerHTML=`<div class="center"><h2>Open a client to see their record.</h2><p class="muted" style="margin-bottom:18px">Pick a customer, contact, or deal — their whole relationship opens here.</p><p><a class="link" href="/customers.html">Go to Customers →</a></p></div>`;}
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to open a client record.</h2><p style="margin-top:20px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load this just now.</h2><p class="muted" style="margin-bottom:16px">It’s probably a brief hiccup.</p><button id="retry" class="primary">Try again</button></div>`;const rt=$('retry');if(rt)rt.addEventListener('click',loadRecord);}

// "Won stays put" + embedded-link forwarding: the Deal/Delivery iframes post back
// here (same-origin) to switch tabs — a convert reveals Delivery on the SAME record.
window.addEventListener('message',(e)=>{
  if(e.origin!==location.origin)return; const m=(e&&e.data)||{};
  if(m.type==='dds-deal-converted'||m.type==='dds-open-delivery'){
    const q=QP(); q.set('tab','delivery'); history.replaceState(null,'', '/crm.html?'+q.toString());
    loadRecord();
  }
});
(async function(){
  try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){signedOut();return;}await loadRecord();
  }catch(_){trouble();}
})();
</script>
