const COMPOSER_FIELDS=['msgBody','logBody','logDate','taskTitle','taskDue','noteBody'];
function snapComposer(){
  const s={vals:{},focus:''};
  for(const id of COMPOSER_FIELDS){const el=$(id);if(el&&el.value)s.vals[id]=el.value;}
  const ae=document.activeElement; if(ae&&COMPOSER_FIELDS.includes(ae.id))s.focus=ae.id;
  return s;
}
function restoreComposer(s){
  if(!s)return;
  for(const id in s.vals){const el=$(id);if(el)el.value=s.vals[id];}
  if(s.focus){const el=$(s.focus);if(el)el.focus();}
}
// ── C3 (SS6): insertSavedReplies(textareaId) — the shared saved-reply insert.
// ONE lazy cached fetch per page-load; a picker only renders when replies
// exist. Bodies live in a JS map keyed by id (projects.html's picker idiom —
// nothing goes into an attribute); insert APPENDS after what's typed and
// refocuses the textarea. apiAg on purpose: saved replies are the OPERATOR's
// toolkit (their own site's settings) — a customer-scoped record must not
// resolve them against the customer's site (the /sales/* doctrine above).
// Kept in sync by hand with inbox.html's copy. ──
// SCOPE DOCTRINE (SS6, flagged decision): inbox.html's copy diverges — its
// api() carries the drill-in scope, so a drilled-in operator THERE gets the
// CUSTOMER site's reply set ("replies live where the conversation lives"),
// while this page always uses the operator's own. Both are defensible; which
// one wins is Eric's call (punchlist). No behavior change until then. ──
let SR_FETCH=null;
function insertSavedReplies(taId){
  const ta=$(taId);if(!ta)return;
  if(!SR_FETCH)SR_FETCH=apiAg('/service/saved-replies').then(r=>(r.ok&&r.body.data&&r.body.data.replies)||[]).catch(()=>[]);
  SR_FETCH.then((replies)=>{
    const cur=$(taId);
    if(!replies.length||cur!==ta)return;   // nothing saved / the composer re-rendered under us
    if(ta.previousElementSibling&&ta.previousElementSibling.classList.contains('sr-pick'))return;
    const map={};replies.forEach(x=>{map[x.id]=x.body;});
    const sel=document.createElement('select');
    sel.className='sr-pick';sel.setAttribute('aria-label','Insert a saved reply');
    sel.style.cssText='display:block;margin-bottom:6px;max-width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px';
    sel.innerHTML='<option value="">Insert a saved reply…</option>'+replies.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');
    sel.onchange=()=>{const b=map[sel.value];if(b){const v=ta.value;ta.value=v?(v.replace(/\s*$/,'')+'\n\n'+b):b;ta.focus();}sel.value='';};
    ta.parentNode.insertBefore(sel,ta);
  });
}
function renderRail(){
  const host=$('acard'); if(!host)return;
  if(ACT.failed){host.innerHTML='<p class="muted">Couldn’t load this record’s activity just now. <button id="actRetry" style="font-size:12.5px;padding:5px 12px">Try again</button></p>';const rt=$('actRetry');if(rt)rt.addEventListener('click',loadActivity);return;}
  const draft=snapComposer();
  host.innerHTML=`<div id="composer"></div><div id="fchips" class="fchips" role="group" aria-label="Filter the timeline"></div><div id="upband"></div><div id="timeline"></div>`;
  renderComposer(); renderFilters(); renderUpcoming(); renderTimeline();
  restoreComposer(draft);
  if(FOCUS_COMPOSER){FOCUS_COMPOSER=false;host.scrollIntoView({block:'start'});const ta=$('msgBody');if(ta)ta.focus();}
}

// ── the composer: ONE publisher — Message · Log call · Task · Note ──────────
function composerTabs(){
  const s=(REC&&REC.sections)||{}; const hasDeal=!!idParams().deal;
  const tabs=[['message','Message']];
  if(hasDeal){tabs.push(['logcall','Log call']);tabs.push(['task','Task']);}   // deal-backed writes — hidden honestly when there's no deal
  if(s.overview)tabs.push(['note','Note']);   // notes live on the customer's site scope
  return tabs;
}
function renderComposer(){
  const host=$('composer'); if(!host)return;
  const tabs=composerTabs();
  if(!tabs.some(t=>t[0]===COMPOSER))COMPOSER=tabs[0][0];
  let html=`<div class="composer-tabs" role="tablist" aria-label="Compose">${tabs.map(t=>`<button role="tab" data-ct="${t[0]}" aria-selected="${COMPOSER===t[0]?'true':'false'}" tabindex="${COMPOSER===t[0]?'0':'-1'}"${COMPOSER===t[0]?' class="on"':''}>${t[1]}</button>`).join('')}</div><div class="composer-pane">`;
  if(COMPOSER==='message'){
    const replyPath=ACT.reply_to||ACT.reply_support_to;
    if(replyPath){
      html+=`<form id="msgForm"><label for="msgBody" style="font-size:12.5px;color:var(--faint)">${ACT.reply_to?'Reply to the client':'Reply to the client (their open support thread)'}</label><textarea id="msgBody" placeholder="Write a message…" aria-label="Reply to the client"></textarea><div class="composer-row"><span class="spacer"></span><button class="primary" type="submit">Send</button></div></form>`;
    }else{
      html+=`<p class="muted" style="font-size:13.5px">Replies open once this client has a project or an open support thread.</p>`;
    }
  }else if(COMPOSER==='logcall'){
    const kinds=[['call',si('phone')+' Call'],['email',si('mail')+' Email'],['meeting',si('users')+' Meeting'],['note',si('pencil')+' Note']];
    html+=`<div class="kindchips" role="group" aria-label="What are you logging?">${kinds.map(k=>`<button data-lk="${k[0]}"${LOGKIND===k[0]?' class="on" aria-pressed="true"':' aria-pressed="false"'}>${k[1]}</button>`).join('')}</div>
      <textarea id="logBody" style="margin-top:9px" placeholder="What happened? (optional for calls/emails/meetings)" aria-label="Activity notes"></textarea>
      <div class="composer-row"><label for="logDate" style="font-size:12.5px;color:var(--faint)">When</label><input type="date" id="logDate" max="${new Date().toISOString().slice(0,10)}" value="${new Date().toISOString().slice(0,10)}" aria-label="When it happened"><span class="spacer"></span><button class="primary" id="logGo">Log it</button></div>`;
  }else if(COMPOSER==='task'){
    html+=`<input type="text" id="taskTitle" placeholder="What needs doing?" aria-label="To-do title" maxlength="200" style="width:100%">
      <div class="composer-row"><label for="taskDue" style="font-size:12.5px;color:var(--faint)">Due</label><input type="date" id="taskDue" aria-label="Due date"><span class="spacer"></span><button class="primary" id="taskGo">Add to-do</button></div>`;
  }else if(COMPOSER==='note'){
    html+=`<textarea id="noteBody" placeholder="A note about this client… (internal by default)" aria-label="A note about this client"></textarea>
      <div class="composer-row"><span class="seg" role="group" aria-label="Who can see this note"><button data-aud="internal"${NEWAUD==='internal'?' class="on" aria-pressed="true"':' aria-pressed="false"'}>Internal</button><button data-aud="shared"${NEWAUD==='shared'?' class="on" aria-pressed="true"':' aria-pressed="false"'}>Shared with client</button></span><span class="spacer"></span><button class="primary" id="noteGo">Add note</button></div>
      <p class="muted" id="notehint" style="font-size:12.5px;margin-top:6px">${NEWAUD==='shared'?'The client will see this note.':'Internal notes stay with your studio.'}</p>`;
  }
  html+=`</div>`;
  host.innerHTML=html;
  host.querySelectorAll('[data-ct]').forEach(b=>b.addEventListener('click',()=>{COMPOSER=b.getAttribute('data-ct');renderComposer();}));
  // E2: the composer tablist honors the arrow-key contract — arrows move focus
  // AND selection (the re-render hands focus back to the moved-to tab);
  // Home/End jump. Roving tabindex is set in the markup above.
  const ctl=host.querySelector('.composer-tabs');
  if(ctl)ctl.addEventListener('keydown',(e)=>{
    const tabsEls=[...ctl.querySelectorAll('[data-ct]')];const i=tabsEls.indexOf(document.activeElement);
    if(i<0)return;let j=-1;
    if(e.key==='ArrowRight')j=(i+1)%tabsEls.length;
    else if(e.key==='ArrowLeft')j=(i-1+tabsEls.length)%tabsEls.length;
    else if(e.key==='Home')j=0;
    else if(e.key==='End')j=tabsEls.length-1;
    if(j<0)return;e.preventDefault();
    COMPOSER=tabsEls[j].getAttribute('data-ct');renderComposer();
    const nb=host.querySelector('[data-ct="'+COMPOSER+'"]');if(nb)nb.focus();
  });
  const f=$('msgForm'); if(f)f.onsubmit=sendMessage;
  if($('msgBody'))insertSavedReplies('msgBody');   // C3: the saved-reply picker, when any exist
  host.querySelectorAll('[data-lk]').forEach(b=>b.addEventListener('click',()=>{LOGKIND=b.getAttribute('data-lk');host.querySelectorAll('[data-lk]').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});}));
  const lg=$('logGo'); if(lg)lg.addEventListener('click',logActivity);
  const tg=$('taskGo'); if(tg)tg.addEventListener('click',addTask);
  host.querySelectorAll('[data-aud]').forEach(b=>b.addEventListener('click',()=>{NEWAUD=b.getAttribute('data-aud');host.querySelectorAll('[data-aud]').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});const hh=$('notehint');if(hh)hh.textContent=NEWAUD==='shared'?'The client will see this note.':'Internal notes stay with your studio.';}));
  const ng=$('noteGo'); if(ng)ng.addEventListener('click',addNote);
}
async function sendMessage(e){
  e.preventDefault();
  const ta=$('msgBody'); const body=(ta.value||'').trim(); if(!body)return;
  const replyPath=ACT.reply_to||ACT.reply_support_to;
  const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
  try{
    const rr=await api(replyPath,'POST',ACT.reply_to?{body,audience:'client'}:{body});
    if(rr.ok){ta.value='';toast('Sent.');await loadActivity();}
    else{toast((rr.body&&rr.body.message)||'Couldn’t send.');btn.disabled=false;}
  }catch(_){toast('Couldn’t send.');btn.disabled=false;}
}
async function logActivity(){
  const deal=idParams().deal; if(!deal)return;
  const body=($('logBody')&&$('logBody').value||'').trim();
  if(LOGKIND==='note'&&!body){toast('Write a short note.');return;}
  const btn=$('logGo'); btn.disabled=true;
  const r=await apiAg('/sales/deals/'+encodeURIComponent(deal)+'/activity','POST',{kind:LOGKIND,body,occurred_at:($('logDate')&&$('logDate').value)||undefined});
  if(r.ok){if($('logBody'))$('logBody').value='';if($('logDate'))$('logDate').value='';toast('Logged.');await loadActivity();}
  else{toast((r.body&&r.body.message)||'That didn’t save.');btn.disabled=false;}
}
async function addTask(){
  const deal=idParams().deal; if(!deal)return;
  const title=($('taskTitle')&&$('taskTitle').value||'').trim();
  if(!title){toast('Give the to-do a title.');return;}
  const btn=$('taskGo'); btn.disabled=true;
  const due=($('taskDue')&&$('taskDue').value)||'';
  const r=await apiAg('/sales/deals/'+encodeURIComponent(deal)+'/tasks','POST',due?{title,due_date:due}:{title});
  if(r.ok){if($('taskTitle'))$('taskTitle').value='';if($('taskDue'))$('taskDue').value='';toast('Added.');await loadActivity();}
  else{toast((r.body&&r.body.message)||'That didn’t save.');btn.disabled=false;}
}
async function addNote(){
  const body=($('noteBody')&&$('noteBody').value||'').trim();
  if(!body){toast('Write a little something first.');return;}
  const btn=$('noteGo'); btn.disabled=true;
  const r=await api('/crm/notes','POST',{audience:NEWAUD,body});
  if(r.ok){if($('noteBody'))$('noteBody').value='';toast(r.body.data&&r.body.data.message||'Saved.');await loadActivity();}
  else{toast((r.body&&r.body.message)||'That didn’t save.');btn.disabled=false;}
}

function renderFilters(){
  const host=$('fchips'); if(!host)return;
  host.innerHTML=FILTER_DEFS.map(f=>`<button data-f="${f[0]}"${FILTER===f[0]?' class="on" aria-pressed="true"':' aria-pressed="false"'}>${f[1]}</button>`).join('');
  host.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{FILTER=b.getAttribute('data-f');renderFilters();renderTimeline();}));
}

// ── Upcoming & Overdue band ──────────────────────────────────────────────────
function renderUpcoming(){
  const host=$('upband'); if(!host)return;
  const ups=ACT.upcoming||[];
  if(!ups.length){host.innerHTML='';return;}
  host.innerHTML=`<div class="upband"><div class="bt">Upcoming &amp; overdue</div>`+ups.map(u=>{
    const icon=u.kind==='invoice'?si('receipt'):u.kind==='next_step'?'→':'';
    const box=u.kind==='task'&&u.id?`<input type="checkbox" data-updone="${esc(u.id)}" aria-label="Mark done: ${esc(u.title)}">`:(icon?`<span aria-hidden="true">${icon}</span>`:'');
    const title=u.href?`<a href="${esc(pinHref(u.href))}">${esc(u.title)}</a>`:esc(u.title);
    return `<div class="uprow ${u.overdue?'overdue':''}">${box}<span class="ut" style="min-width:0">${title}</span><span class="due">${u.overdue?'overdue · ':''}${esc(dueLabel(u.due))}</span></div>`;
  }).join('')+`</div>`;
  host.querySelectorAll('[data-updone]').forEach(cb=>cb.addEventListener('change',async()=>{
    cb.disabled=true;
    const r=await apiAg('/sales/deal-tasks/'+cb.getAttribute('data-updone'),'PATCH',{status:'done'});
    if(r.ok){toast('Done.');await loadActivity();}
    else{toast('Couldn’t update that to-do.');cb.checked=false;cb.disabled=false;}
  }));
}

// ── the timeline itself: month groups, typed icons on a connector line ──────
// The Notes chip is a REAL notes view (GET /crm/notes: pinned-first, 100 notes,
// Pin/Unpin + Remove) — the merged timeline's note items only carry what the
// site-timeline caps let through. If that fetch fails (route not deployed yet,
// hiccup), it falls back to the merged filter. All other chips filter the merge.
function renderTimeline(){
  const host=$('timeline'); if(!host)return;
  if(FILTER==='note')return void renderNotesView(host);
  renderMergedTimeline(host);
}
async function renderNotesView(host){
  host.innerHTML='<div class="spin" role="status" aria-label="Loading notes"></div>';
  let r; try{r=await api('/crm/notes');}catch(_){r={ok:false,body:{}};}
  if(FILTER!=='note'||host!==$('timeline'))return;   // filter moved on / the rail re-rendered underneath us
  const notes=(r.ok&&r.body.data&&Array.isArray(r.body.data.notes))?r.body.data.notes:null;
  if(!notes)return renderMergedTimeline(host);       // best-effort: fall back to the merged filter
  if(!notes.length){host.innerHTML='<p class="muted" style="margin-top:16px;font-size:13.5px">No notes yet — add one from the composer.</p>';return;}
  host.innerHTML=notes.map(n=>{
    const aud=n.audience==='internal'?'Internal note':'Shared note';
    return `<div class="ti t-note"><span class="ti-icon" aria-hidden="true">${TYPE_ICON.note}</span><div class="ti-main">
      <div class="ti-head"><span class="ti-title">${n.pinned?si('pin')+' Pinned note':'Note'}</span><span class="ti-meta">${aud}</span></div>
      <div class="ti-body">${esc(n.body||'')}<div class="note-acts"><button data-pin="${esc(n.id)}" data-on="${n.pinned?'':'1'}">${n.pinned?'Unpin':'Pin'}</button><button data-delnote="${esc(n.id)}">Remove</button></div></div>
    </div><span class="ti-when">${esc(when(n.created_at))}</span></div>`;
  }).join('');
  host.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;
    const pr=await api('/crm/notes/'+b.getAttribute('data-pin')+'/pin','POST',{pinned:b.getAttribute('data-on')==='1'});
    if(pr.ok)renderNotesView(host);   // re-fetch: pinned-first order is the server's
    else{toast('Couldn’t update that note.');b.disabled=false;}
  }));
  host.querySelectorAll('[data-delnote]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;
    const dr=await api('/crm/notes/'+b.getAttribute('data-delnote'),'DELETE');
    if(dr.ok){toast('Removed.');await loadActivity();}   // the merged All view changes too
    else{toast('Couldn’t remove that note.');b.disabled=false;}
  }));
}
// Phase 3 (timeline filters): website system events — publish notices, "changes
// are waiting", connected-service pings — buried the human events (a payment, a
// signature, a call) under 15+ rows. On the default view they collapse into ONE
// quiet line; the System chip (or "Show") expands them. Deal events (money,
// stage moves) are human-relevant and stay inline.
const isSiteNoise=(it)=>it.type==='system'&&it.kind!=='deal_event';
const SYS_FOLD_AT=3;   // one or two publish rows read fine inline; it's the pile-up that buries things
let SYS_OPEN=false;
function renderMergedTimeline(host){
  const all=(ACT.items||[]).filter(filterMatch);
  const collapse=FILTER==='all'&&!SYS_OPEN&&all.filter(isSiteNoise).length>=SYS_FOLD_AT;
  const items=collapse?all.filter(it=>!isSiteNoise(it)):all;
  const hidden=collapse?all.length-items.length:0;
  if(!items.length&&!hidden){host.innerHTML=`<p class="muted" style="margin-top:16px;font-size:13.5px">${(ACT.items||[]).length?'Nothing matches this filter.':'Nothing here yet — messages, calls, and system events will appear as they happen.'}</p>`;return;}
  let html=''; let curMonth='';
  for(const it of items){
    const mk=String(it.at).slice(0,7);
    if(mk!==curMonth){
      curMonth=mk;
      const dt=new Date(mk+'-15T12:00:00Z');
      html+=`<div class="tl-month">${isNaN(dt)?esc(mk):dt.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>`;
    }
    const type=TYPE_ICON[it.type]?it.type:'system';
    const open=EXPANDED.has(it.id);
    const meta=it.meta?`<span class="ti-meta">${esc(it.meta)}</span>`:'';
    const head=it.body
      ?`<button class="ti-head" data-x="${esc(it.id)}" aria-expanded="${open?'true':'false'}"><span class="ti-car" aria-hidden="true">${open?'▾':'▸'}</span><span class="ti-title">${esc(it.title)}</span>${meta}</button>`
      :`<div class="ti-head"><span class="ti-title">${esc(it.title)}</span>${meta}${it.href?` <a class="ti-link" href="${esc(pinHref(it.href))}">open →</a>`:''}</div>`;
    let bodyHtml='';
    if(it.body&&open){
      const noteId=(it.kind==='note'&&/note:([0-9a-f-]{36})$/i.test(it.id))?it.id.match(/note:([0-9a-f-]{36})$/i)[1]:'';
      bodyHtml=`<div class="ti-body">${esc(it.body)}${noteId?`<div class="note-acts"><button data-delnote="${esc(noteId)}">Remove note</button></div>`:''}${it.href?`<div style="margin-top:5px"><a class="ti-link" href="${esc(pinHref(it.href))}">open →</a></div>`:''}</div>`;
    }
    html+=`<div class="ti t-${type}"><span class="ti-icon" aria-hidden="true">${TYPE_ICON[type]}</span><div class="ti-main">${head}${bodyHtml}</div><span class="ti-when">${esc(when(it.at))}</span></div>`;
  }
  if(hidden)html+=`<div class="ti t-system sys-fold"><span class="ti-icon" aria-hidden="true">${si('cog')}</span><div class="ti-main"><div class="ti-head"><span class="ti-title" style="font-weight:500;color:var(--faint)">${hidden===1?'1 website update':hidden+' website updates'}</span> <button type="button" class="link-btn" id="sysShow" style="font-size:12.5px">Show</button></div></div></div>`;
  host.innerHTML=html;
  const ss=$('sysShow'); if(ss)ss.addEventListener('click',()=>{SYS_OPEN=true;renderTimeline();});
  host.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.getAttribute('data-x');
    if(EXPANDED.has(id))EXPANDED.delete(id);else EXPANDED.add(id);
    renderTimeline();
  }));
  host.querySelectorAll('[data-delnote]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;
    const r=await api('/crm/notes/'+b.getAttribute('data-delnote'),'DELETE');
    if(r.ok){toast('Removed.');await loadActivity();}
    else{toast('Couldn’t remove that note.');b.disabled=false;}
  }));
}
