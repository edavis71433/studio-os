<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="One client record — the whole relationship from first enquiry through delivery, in one place.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically). Only the six activity-
     type accents are page-local — picked to survive BOTH themes. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* the six timeline type accents (icon ring + connector) */
    --act-message:var(--dds-p,#5b3fa0);--act-call:var(--dds-good,#33664b);--act-task:var(--dds-warn,#775d31);--act-system:var(--dds-faint,#746b8a);
    --act-email:#31708e;--act-note:#8a5a83;
  }
  @media (prefers-color-scheme:dark){:root{--act-email:#85b7cf;--act-note:#c9a3c2}}
  :root[data-theme="light"]{--act-email:#31708e;--act-note:#8a5a83}
  :root[data-theme="dark"]{--act-email:#85b7cf;--act-note:#c9a3c2}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--dds-w-app,1280px);margin:0 auto;padding:26px 20px 90px}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:4px}
  a.back{display:inline-flex;align-items:center;gap:5px;color:var(--soft);text-decoration:none;font-size:13.5px;font-weight:600}
  a.back:hover{color:var(--p)}

  /* ── record header (Lightning anatomy: object icon · name · status) ── */
  .rec-head{margin-top:14px;display:flex;gap:14px;align-items:flex-start}
  .obj-ic{width:44px;height:44px;border-radius:var(--dds-r-lg,10px);background:var(--p);color:#fff;display:grid;place-items:center;font-size:20px;flex:0 0 auto;box-shadow:var(--shadow)}
  .obj-ic.customer{background:var(--good)}
  .rec-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,4vw,32px);letter-spacing:-.01em;margin:0;line-height:1.2}
  .rec-sub{color:var(--soft);font-size:14px;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .rec-sub a{color:var(--p);text-decoration:none} .rec-sub a:hover{text-decoration:underline}
  .statuschip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--p-soft);color:var(--p);text-transform:capitalize}
  .statuschip.customer{background:var(--good-soft);color:var(--good)}

  /* ── highlights panel: label-over-value tiles ── */
  .hl-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);overflow:hidden;margin-top:16px;box-shadow:var(--shadow)}
  .hl{background:var(--card);padding:10px 14px;min-width:0}
  .hl-k{font-size:12px;color:var(--faint);font-weight:500;display:flex;align-items:center;gap:6px}
  .hl-v{font-family:var(--sans);font-size:17.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
  .hl-v .word{text-transform:capitalize}
  .hl-edit{border:none;background:none;color:var(--faint);cursor:pointer;font-size:12px;padding:0 2px;border-radius:4px}
  .hl-edit:hover{color:var(--p)}
  .hl input{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-top:3px}

  /* ── action bar: the record's verbs, always one click away ── */
  .actbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .actbar:empty{display:none}
  .abtn{font-family:inherit;font-size:13.5px;font-weight:500;border-radius:var(--dds-r,8px);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.15s;box-shadow:var(--shadow)}
  .abtn:hover{border-color:var(--p);color:var(--p)}
  .abtn.primary{background:var(--p);color:#fff;border-color:var(--p)} .abtn.primary:hover{background:var(--p-deep);color:#fff}
  /* billing rows: status chip + the row's own buttons */
  .brow{flex-wrap:wrap}
  .racts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .rbtn{font-family:inherit;font-size:12.5px;font-weight:500;border-radius:var(--dds-r,8px);border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 11px;cursor:pointer;text-transform:none;letter-spacing:0;display:inline-flex;align-items:center}
  .rbtn:hover{border-color:var(--p);color:var(--p)} .rbtn:disabled{opacity:.5;cursor:default}
  .link-btn{border:none;background:none;color:var(--p);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;padding:0;text-transform:none;letter-spacing:0;border-radius:0}
  .link-btn:hover{text-decoration:underline}
  .bform{background:var(--card);border:1px solid var(--p);border-radius:var(--dds-r-lg,10px);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .brow2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .brow2 label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--faint);font-weight:600}
  .brow2 input,.brow2 select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:8px 10px;width:100%}
  .brow2 input:focus,.brow2 select:focus{outline:none;border-color:var(--p)}
  .bacts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

  /* ── Path (Lightning chevrons, dds skin) ── */
  .pathcard{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);padding:12px 14px}
  .pathrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .path{display:flex;flex:1 1 340px;min-width:0}
  .path button.pstep{flex:1;min-width:0;border:none;font-family:inherit;font-size:12.5px;font-weight:500;padding:9px 16px;cursor:default;
    background:var(--bg);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
  .path button.pstep:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);border-radius:8px 0 0 8px}
  .path button.pstep:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,11px 50%);border-radius:0 8px 8px 0}
  .path button.pstep.done{background:var(--good-soft);color:var(--good)}
  .path button.pstep.canback{cursor:pointer}
  .path button.pstep.canback:hover{filter:brightness(.96)}
  .path button.pstep.current{background:var(--p);color:#fff;cursor:pointer}
  .path button.pstep.current:hover{filter:brightness(1.06)}
  .path button.pstep.lost-terminal{background:var(--warn-soft);color:var(--warn)}
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) —
     same treatment as pipeline.html's Path, kept in sync by hand */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .path button.pstep.current{color:#171320}}
  :root[data-theme="dark"] .path button.pstep.current{color:#171320}
  .path-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .path-guide{margin-top:10px;font-size:13.5px;color:var(--soft)}
  .path-guide b{color:var(--ink);font-weight:600}
  .path-confirm{margin-top:10px;display:flex;gap:9px;align-items:center;font-size:13.5px;flex-wrap:wrap}
  .terminal-chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px}
  .terminal-chip.won{background:var(--good-soft);color:var(--good)}
  .terminal-chip.lost{background:var(--warn-soft);color:var(--warn)}

  /* ── two-region body ── */
  .body{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;margin-top:20px;align-items:start}
  @media (max-width:1000px){.body{grid-template-columns:minmax(0,1fr)}.rail{order:-1}}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{border:none;background:transparent;font-family:inherit;font-size:14.5px;font-weight:500;color:var(--soft);padding:11px 15px;cursor:pointer;border-bottom:2.5px solid transparent;border-radius:0;white-space:nowrap;transition:.15s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{color:var(--p);border-bottom-color:var(--p)}
  #tabbody{margin-top:18px}

  /* related-list cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .card-h .t{font-weight:700;font-size:14.5px}
  .rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:14px;min-width:0}
  .rrow:first-of-type{border-top:none}
  .rrow .rt{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .rrow .rt .s{color:var(--faint);font-size:12.5px;display:block}
  a.rlink{color:inherit;text-decoration:none;display:block;min-width:0;flex:1}
  a.rlink:hover .rt{color:var(--p)}
  .schip{display:inline-flex;align-items:center;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;background:var(--p-soft);color:var(--p);white-space:nowrap;text-transform:capitalize}
  .schip.good{background:var(--good-soft);color:var(--good)}
  .schip.warn{background:var(--warn-soft);color:var(--warn)}
  .schip.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  .schip.info{background:var(--dds-info-soft,#e8f1fb);color:var(--dds-info,#2a6fb5)}   /* Oct 2026: the Processing money state */
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14.5px}
  .kv .k{color:var(--faint);font-weight:600}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .fact{background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:10px 12px}
  .fact .k{font-size:12px;color:var(--faint);font-weight:500}
  .fact .v{font-family:var(--sans);font-size:18px;margin-top:2px;font-weight:600;font-variant-numeric:tabular-nums}
  .fact .v small{font-family:var(--sans);font-size:12px;color:var(--soft);font-weight:400}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 11px}
  .chip .d{width:7px;height:7px;border-radius:50%}
  .chip.healthy{background:var(--good-soft);color:var(--good)} .chip.healthy .d{background:var(--good)}
  .chip.attention{background:var(--warn-soft);color:var(--warn)} .chip.attention .d{background:var(--warn)}
  .chip.new,.chip.quiet{background:var(--p-soft);color:var(--p)} .chip.new .d,.chip.quiet .d{background:var(--p)}
  h2{font-size:12.5px;color:var(--faint);font-weight:500;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
  section{margin-top:22px} section:first-child{margin-top:0}

  /* ── the activity rail ── */
  .acard{padding:14px 16px}
  .composer-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -4px}
  .composer-tabs button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--soft);padding:8px 10px;cursor:pointer;border-bottom:2.5px solid transparent;border-radius:0;white-space:nowrap}
  .composer-tabs button.on{color:var(--p);border-bottom-color:var(--p)}
  .composer-pane{padding:12px 0 4px}
  .composer-pane textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:10px 12px;resize:vertical;min-height:64px}
  .composer-pane textarea:focus{outline:none;border-color:var(--p)}
  .composer-pane input[type=text],.composer-pane input[type=date]{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:8px 10px}
  .composer-row{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .composer-row .spacer{flex:1}
  .kindchips{display:flex;gap:6px;flex-wrap:wrap}
  .kindchips button{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer;font-weight:500}
  .kindchips button.on{background:var(--p-soft);color:var(--p);border-color:var(--p)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--dds-r,8px);overflow:hidden}
  .seg button{border:none;border-radius:0;padding:6px 12px;font-size:12.5px;background:transparent;color:var(--soft);font-family:inherit;font-weight:500;cursor:pointer}
  .seg button.on{background:var(--p-soft);color:var(--p)}

  .fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .fchips button{font-size:12px;font-weight:500;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer;font-family:inherit}
  .fchips button.on{background:var(--p-soft);border-color:var(--p);color:var(--p)}

  /* Upcoming & overdue band */
  .upband{margin-top:14px;border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:10px 12px;background:var(--bg)}
  .upband .bt{font-size:12px;color:var(--faint);font-weight:500;margin-bottom:6px}
  .uprow{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px}
  .uprow .due{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}
  .uprow.overdue .due{color:var(--bad);font-weight:700}
  .uprow.overdue .ut{color:var(--bad)}
  .uprow input[type=checkbox]{margin-top:3px;accent-color:var(--p)}
  .uprow a{color:inherit;text-decoration:none}
  .uprow a:hover{color:var(--p)}

  /* the timeline: connector line + white-ring type icons + expandable rows */
  .tl-month{font-size:12px;color:var(--faint);font-weight:500;margin:18px 0 4px;display:flex;align-items:center;gap:8px}
  .tl-month:after{content:"";flex:1;height:1px;background:var(--line)}
  .ti{position:relative;display:flex;gap:10px;padding:9px 0 9px 34px;align-items:flex-start}
  .ti:before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
  .ti:first-of-type:before{top:12px} .ti:last-of-type:before{bottom:auto;height:22px}
  .si{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.18em;flex:0 0 auto}
  .ti .ti-icon{position:absolute;left:1px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;box-shadow:0 0 0 3px var(--card)}
  .ti.t-message:before{background:color-mix(in srgb,var(--act-message) 35%,transparent)} .ti.t-message .ti-icon{background:var(--act-message)}
  .ti.t-email:before{background:color-mix(in srgb,var(--act-email) 35%,transparent)} .ti.t-email .ti-icon{background:var(--act-email)}
  .ti.t-call:before{background:color-mix(in srgb,var(--act-call) 35%,transparent)} .ti.t-call .ti-icon{background:var(--act-call)}
  .ti.t-task:before{background:color-mix(in srgb,var(--act-task) 35%,transparent)} .ti.t-task .ti-icon{background:var(--act-task)}
  .ti.t-note:before{background:color-mix(in srgb,var(--act-note) 35%,transparent)} .ti.t-note .ti-icon{background:var(--act-note)}
  .ti.t-system:before{background:color-mix(in srgb,var(--act-system) 30%,transparent)} .ti.t-system .ti-icon{background:var(--act-system)}
  .ti-main{flex:1;min-width:0}
  .ti-head{display:flex;align-items:baseline;gap:7px;width:100%;border:none;background:none;font-family:inherit;font-size:13.5px;color:var(--ink);text-align:left;padding:0;min-width:0}
  button.ti-head{cursor:pointer}
  .ti-title{font-weight:600;min-width:0}
  .ti-car{color:var(--faint);font-size:10px;flex:0 0 auto}
  .ti-meta{font-size:12px;font-weight:500;border-radius:999px;padding:1px 7px;background:var(--bg);border:1px solid var(--line);color:var(--faint);white-space:nowrap;flex:0 0 auto}
  .ti-body{font-size:13.5px;color:var(--soft);white-space:pre-wrap;margin-top:5px;border-left:2px solid var(--line);padding-left:10px}
  .ti-body .note-acts{margin-top:6px}
  .ti-body .note-acts button{font-size:11.5px;padding:3px 9px}
  .ti-when{font-size:11.5px;color:var(--faint);white-space:nowrap;flex:0 0 auto;padding-top:2px}
  .ti a.ti-link{color:var(--p);text-decoration:none;font-size:12px;font-weight:600}
  .ti a.ti-link:hover{text-decoration:underline}

  textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:11px 12px;resize:vertical;min-height:70px}
  textarea:focus{outline:none;border-color:var(--p)}
  button{font-family:inherit;font-size:14px;font-weight:500;border-radius:var(--dds-r,8px);border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 15px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--p);color:var(--p)} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--p);color:#fff;border-color:var(--p)} button.primary:hover{background:var(--p-deep);color:#fff}
  a.link{color:var(--p);text-decoration:none;font-weight:500;font-size:14px} a.link:hover{text-decoration:underline}
  a.btnlink{display:inline-block;font-size:13.5px;font-weight:500;border-radius:var(--dds-r,8px);border:1px solid var(--p);color:var(--p);padding:7px 14px;text-decoration:none}
  a.btnlink:hover{background:var(--p-soft)}
  a.btnlink.primary{background:var(--p);color:#fff} a.btnlink.primary:hover{background:var(--p-deep)}
  .muted{color:var(--soft);font-size:14px}
  .center{text-align:center;padding:56px 20px}
  .center h2{display:block;font-family:var(--serif);font-weight:500;font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 8px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none !important}}

  /* ── Visual refresh (2026-10): the hub in the new look. These rules come last
     on purpose — they restate the pieces above in the refreshed idiom (initials
     avatar, icon stat tiles, the lifecycle bar, an invoice table, a details card
     in the rail, dot timeline) without touching the markup contracts the tests
     pin (#actbar ids, .pstep states, data-* hooks). ── */
  .rec-head{margin-top:10px;align-items:center}
  .obj-ic{width:40px;height:40px;border-radius:50%;background:var(--p-soft);color:var(--p);font-family:var(--sans);font-size:14px;font-weight:600;box-shadow:none;letter-spacing:.02em}
  .obj-ic.customer{background:var(--good-soft);color:var(--good)}
  .rec-head h1{font-size:28px}
  .rec-sub{font-size:13px;margin-top:3px;gap:6px 10px}
  .rec-sub .sep{color:var(--faint)}
  .statuschip{padding:2px 8px;line-height:18px}

// ── Oct 2026 benchmark (item 2): money in four states — ONE formula. A VERBATIM
// mirror of supabase/functions/presence/lib/money_state.ts (the Deno pin runs
// one case table against the module and every page's copy). The record runs

function moneyState(i,todayYmd,pending){
  if(!i)return'';

  if(s==='paid')return'paid';
  if(s==='void'||s==='canceled')return'';
  if(i.processing_since||(pending&&pending.indexOf(String(i.id))>=0))return'processing';
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(i.due_date||''));
  return(m&&todayYmd&&m[0]<String(todayYmd))?'overdue':'upcoming';
}
const MONEY_WORD={paid:'Paid',processing:'Processing',upcoming:'Upcoming',overdue:'Overdue'};
const MONEY_TONE={paid:'good',processing:'info',upcoming:'',overdue:'bad'};
function moneyBuckets(list,todayYmd,pending){
  const b={paid:{count:0,cents:0},processing:{count:0,cents:0},upcoming:{count:0,cents:0},overdue:{count:0,cents:0}};
  for(const i of(Array.isArray(list)?list:[])){const st=moneyState(i,todayYmd,pending);if(!st)continue;const c=typeof i.amount_cents==='number'?i.amount_cents:Math.round((Number(i.amount)||0)*100);b[st].count++;b[st].cents+=c;}

function recordQuery(){
  const q=QP(); const parts=[];
  for(const k of ['client','client_id','deal','contact','project']){const v=q.get(k); if(v)parts.push(k+'='+encodeURIComponent(v));}
  return parts.length?('?'+parts.join('&')):'';

async function loadRecord(){
  const rq=recordQuery();
  if(!rq){ picker(); return; }
  const r=await api('/crm/record'+rq);
  if(r.status===403){ $('main').innerHTML=`<div class="center"><h2>This lives in your studio workspace.</h2><p class="muted">${esc((r.body&&r.body.message)||'Only your studio can open a client record.')}</p></div>`; return; }

  REC=r.body.data||{};

  // scope (x-dds-scope-site) is right for the profile + notes + activity. If we
  // arrived by ?deal=/?contact= but the canonical key is the customer site and it
  // isn't the current scope, reload once to the canonical URL (one hop, no loop).
  const canon=REC.canonical||{};
  if(canon.key==='client' && canon.value && QP().get('client')!==canon.value){
    const t=QP().get('tab')||REC.default_tab||''; const suffix=t?('&tab='+encodeURIComponent(t)):'';
    location.replace('/crm.html?client='+encodeURIComponent(canon.value)+suffix); return;

  const mapped=TAB_ALIAS[want]||TAB_ALIAS[REC.default_tab]||'';
  TAB=avail.includes(mapped)?mapped:(avail[0]||'');

  if(TAB)showTab(TAB,true);

  const act=QP().get('act');
  if(act==='invoice'||act==='deposit')DEAL_READY.then(()=>{if(idParams().deal)openBilling(act);});
  else if(act==='message'||act==='note'||act==='task')setTimeout(()=>focusComposer(act),300);
}

      <aside class="rail" ${showRail?'':'hidden'}>
        <div id="dcard"></div>
        <div class="card acard" id="acard"><div class="spin" role="status" aria-label="Loading activity"></div></div>
      </aside>
    </div>`;
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.getAttribute('data-tab'))));
  // E2: the record-section tablist honors the arrow-key contract — arrows move
  // focus AND selection, Home/End jump, roving tabindex (showTab keeps it).
  const tl=document.querySelector('.tabs[role=tablist]');
  if(tl)tl.addEventListener('keydown',(e)=>{
    const tabsEls=[...tl.querySelectorAll('[data-tab]')];const i=tabsEls.indexOf(document.activeElement);
    if(i<0)return;let j=-1;
    if(e.key==='ArrowRight')j=(i+1)%tabsEls.length;
    else if(e.key==='ArrowLeft')j=(i-1+tabsEls.length)%tabsEls.length;
    else if(e.key==='Home')j=0;
    else if(e.key==='End')j=tabsEls.length-1;
    if(j<0)return;e.preventDefault();
    const t=tabsEls[j];showTab(t.getAttribute('data-tab'));t.focus();
  });
  HL_EDIT=false;   // the shell rebuild destroyed any open editor — never leave the flag stale
  renderHighlights();
  renderActions();
  renderDetailsCard();
}

// ── the action bar: every common thing you do for a client, one click from the
// record. Salesforce puts these at the top of every record (New Opportunity, Log
// a Call, Send Email); here they are the studio's verbs. Each button either
// opens a small inline form on the Billing tab or focuses the composer in the
// rail. Deal-backed actions render only when the record has a deal. ──
function renderActions(){
  const host=$('actbar'); if(!host)return;
  const ids=idParams(); const d=(DEAL&&DEAL.deal)||null;
  const btns=[];
  // ONE LINK (benchmark 2026-10, item 5): with BOTH a proposal and an agreement
  // drafted on an open deal, the headline act is "Send proposal & agreement" —
  // one email, one page. The per-document sends sit under More.
  const both=!!(d&&sendBothDocs());
  if(ids.deal){
    if(both)btns.push({id:'act-send-both',label:'Send proposal & agreement',primary:true,on:()=>openBilling('both')});
    btns.push({id:'act-invoice',label:'Send invoice',primary:!both,on:()=>openBilling('invoice')});
    btns.push({id:'act-deposit',label:'Request deposit',on:()=>openBilling('deposit')});
    const draft=d&&(DEAL.proposals||[]).find(p=>p.status==='draft');
    const stage=d&&d.stage;
    // stage-aware: a won deal never pushes an unsent proposal as the headline act
    if(draft&&stage!=='won'&&stage!=='lost')btns.push({id:'act-proposal',label:'Send proposal',on:()=>openBilling('proposal:'+draft.id)});
    const draftCon=d&&(DEAL.contracts||[]).find(k=>k.status==='draft');
    if(draftCon&&stage!=='won'&&stage!=='lost')btns.push({id:'act-agreement',label:'Send agreement',on:()=>openBilling('contract:'+draftCon.id)});
    btns.push({id:'act-log',label:'Log activity',on:()=>focusComposer('logcall')});
    btns.push({id:'act-task',label:'Add to-do',on:()=>focusComposer('task')});
  }
  btns.push({id:'act-message',label:'Message',on:()=>focusComposer('message')});
  if(REC.sections&&REC.sections.overview)btns.push({id:'act-note',label:'Note',on:()=>focusComposer('note')});
  if(ids.project)btns.push({id:'act-project',label:'Open project',href:agHref('projects.html','project='+encodeURIComponent(ids.project))});
  if(ids.deal)btns.push({id:'act-pipeline',label:'Deal in pipeline',href:agHref('pipeline.html','deal='+encodeURIComponent(ids.deal))});
  // visual refresh: one filled verb, three quiet ones, the rest under "More"
  // (every button keeps its id and handler — only where it sits changed)
  const render=(b)=>b.href
    ?`<a class="abtn" id="${b.id}" href="${esc(b.href)}">${esc(b.label)}</a>`
    :`<button type="button" class="abtn${b.primary?' primary':''}" id="${b.id}">${esc(b.label)}</button>`;
  const FRONT=[both?'act-send-both':'act-invoice','act-message','act-log','act-project'];
  const front=FRONT.map(id=>btns.find(b=>b.id===id)).filter(Boolean);

  btns.forEach(b=>{if(b.on){const el=$(b.id);if(el)el.addEventListener('click',()=>{closeMore();b.on();});}});
  const mb=$('act-more');
  if(mb)mb.addEventListener('click',(e)=>{e.stopPropagation();const m=$('act-menu');const open=m.hidden;m.hidden=!open;mb.setAttribute('aria-expanded',open?'true':'false');if(open){const f=m.querySelector('button,a');if(f)f.focus();}});
}
function closeMore(){const m=$('act-menu');const b=$('act-more');if(m&&!m.hidden){m.hidden=true;if(b)b.setAttribute('aria-expanded','false');}}
document.addEventListener('click',closeMore);

// The pair the one "Send proposal & agreement" button sends: the newest draft
// proposal (not superseded) AND the newest draft agreement, on an open deal.
// Null when either is missing — then the per-document sends stand on their own.
function sendBothDocs(){
  const d=DEAL&&DEAL.deal; if(!d)return null;
  if(d.stage==='won'||d.stage==='lost'||d.converted_client_id)return null;
  const isSup=(p)=>Array.isArray(p.line_items)&&p.line_items.some(el=>el&&typeof el==='object'&&el.__meta__&&el.__meta__.superseded_by);
  const prop=(DEAL.proposals||[]).find(p=>p.status==='draft'&&!isSup(p));
  const con=(DEAL.contracts||[]).find(k=>k.status==='draft');
  return (prop&&con)?{prop,con}:null;
}

let HL_EDIT=false;   // an OPEN next-step inline editor owns the panel — async re-renders skip it
function renderHighlights(){

  const owedSub=owed?[mb.upcoming.count?mb.upcoming.count+' upcoming':'',mb.overdue.count?mb.overdue.count+' overdue':'',mb.processing.count?fmtC(mb.processing.cents)+' processing':''].filter(Boolean).join(' · ')||'1 invoice':(mb.processing.count?fmtC(mb.processing.cents)+' processing':'All paid up');
  if(d.id||owed)tiles.push({k:'Outstanding',v:esc(fmtC(owed)),ico:'owed',tone:owed?'warn':(mb.processing.count?'info':''),s:esc(owedSub)});
  const ns=(d.id?d.next_step:hl.next_step)||'';
  // Phase 3 (stage-aware): with no next step set, the tile suggests the stage's
  // own "do next" (a won deal says "open their project", never a blank dash)
  const suggested=(d.id&&!ns&&d.stage)?guidanceFor(d.stage).action:'';
  if(d.id||ns)tiles.push({k:'Next step',v:esc(ns||(suggested?'Suggested':'—')),ico:'next',tone:'info',edit:!!d.id,s:d.next_step_at?esc(dueLabel(d.next_step_at)):(ns?'':(suggested?esc(suggested):'Set one'))});   // inline-editable when a real deal field backs it
  if(!d.id&&p&&p.health)tiles.push({k:'Health',v:`<span class="word">${esc(p.health==='attention'?'Needs attention':p.health==='new'?'Getting set up':p.health)}</span>`,ico:'health',tone:p.health==='attention'?'warn':'good',s:''});
  if(!d.id&&p)tiles.push({k:'Website',v:esc(p.live?'Live':(p.last_published_at?'Offline':'Not yet')),ico:'site',tone:'',s:''});
  if(!tiles.length){host.innerHTML='';return;}
  host.innerHTML=`<div class="hl-panel">${tiles.slice(0,4).map((t,i)=>`<div class="hl"><span class="ico ${t.tone||''}">${svg(t.ico)}</span><div class="hl-main"><div class="hl-k">${t.k}${t.edit?`<button class="hl-edit" data-hledit aria-label="Edit next step">✎</button>`:''}</div><div class="hl-v" data-hlv="${i}">${t.v}</div>${t.s?`<div class="hl-s">${t.s}</div>`:''}</div></div>`).join('')}</div>`;
  const eb=host.querySelector('[data-hledit]');

// ── Path: the chevron stage bar (only when the record has a deal) ───────────
function renderPath(){
  const host=$('pathwrap'); if(!host)return;
  const d=DEAL&&DEAL.deal; if(!d||!d.stage){host.innerHTML='';return;}
  const stage=String(d.stage);
  const signed=(DEAL.contracts||[]).some(c=>c.status==='signed');
  const terminal=stage==='won'||stage==='lost';
  const curIdx=PATH_STEPS.indexOf(stage);
  // exactly TWO steps are interactive: the current stage (toggles the guidance
  // strip) and the ONE legal BOARD_NEXT back-target. Everything else renders
  // non-interactive — no pointer, no hover, out of the tab order.
  const steps=PATH_STEPS.map((s,i)=>{
    const done=stage==='won'||(curIdx>-1&&i<curIdx);
    const current=s===stage;
    const canBack=!terminal&&(BOARD_NEXT[stage]||[]).includes(s)&&done;
    const cls=(done?'done':current?'current':(stage==='lost'?'lost-terminal':''))+(canBack?' canback':'');
    const state=done?'complete':current?'current stage':'upcoming';
    const attrs=canBack?'':current?` aria-expanded="${GUIDE_OPEN?'true':'false'}"`:' tabindex="-1" aria-disabled="true"';
    const hint=canBack?'. Activate to move the deal back here.':current?'. Activate to show or hide the stage guidance.':'';
    return `<button class="pstep ${cls}" data-stage="${s}"${attrs} aria-label="${esc(stageLabel(s))} — ${state}${hint}">${esc(stageLabel(s))}</button>`;
  }).join('')
  // visual refresh: the bar is the whole relationship, not just the sale —
  // Won · Project · Growth follow the four sales stages (read-only markers;
  // the sales stages keep their interactivity rules above).
  +(function(){
    const won=stage==='won'; const proj=(PROJ&&PROJ.project)||null;
    const projDone=won&&proj&&proj.status==='complete';
    const projCur=won&&!projDone;
    const mk=(label,cls)=>`<span class="pstep ${cls}" aria-hidden="true">${label}</span>`;
    if(stage==='lost')return '';
    return mk('Won',won?'done':'')+mk('Project',projDone?'done':projCur?'current':'')+mk('Growth',projDone?'current':'');
  })();
  const g=guidanceFor(stage);
  // the right-side action: forward = "Mark Stage as Complete" (BOARD_NEXT[stage][0]
  // when it's a forward move); at contract+signed it becomes Convert (won is
  // convert-only — the heavy machinery stays on pipeline.html, we don't rebuild it).
  const fwd=(BOARD_NEXT[stage]||[])[0];
  const fwdOk=fwd&&fwd!=='lost'&&PATH_STEPS.indexOf(fwd)>curIdx;
  let side='';
  if(stage==='won')side='';   // the lifecycle bar already shows Won — no second badge
  else if(stage==='lost')side=`<span class="terminal-chip lost">Not a fit</span>`;
  else if(stage==='contract'&&signed)side=`<a class="btnlink primary" href="${esc(agHref('pipeline.html','deal='+encodeURIComponent(d.id)))}">Convert to customer →</a>`;
  else if(fwdOk)side=`<button class="primary" id="markComplete">Mark stage complete</button>`;
  else side=`<span class="muted" style="font-size:13px">Get the agreement signed to convert</span>`;
  host.innerHTML=`<div class="pathcard">
    <div class="pathrow">
      <div class="path" role="group" aria-label="Deal stages">${steps}</div>
      <div class="path-side">${side}</div>
    </div>
    ${PENDING_BACK?`<div class="path-confirm">Move this deal back to <b>${esc(stageLabel(PENDING_BACK))}</b>?<button class="primary" id="backGo">Move back</button><button id="backNo">Cancel</button></div>`:''}
    ${GUIDE_OPEN?`<div class="path-guide"><b>Tip:</b> ${esc(g.tip)} · <b>Do next:</b> ${esc(g.action)}</div>`:''}
  </div>`;
  const mc=$('markComplete');
  if(mc)mc.addEventListener('click',()=>moveStage(fwd,mc));
  host.querySelectorAll('.pstep.canback').forEach(b=>b.addEventListener('click',()=>{
    PENDING_BACK=b.getAttribute('data-stage'); renderPath();   // only the honest one-back move renders interactive
  }));
  const cur=host.querySelector('.pstep.current');
  if(cur)cur.addEventListener('click',()=>{GUIDE_OPEN=!GUIDE_OPEN;renderPath();});
  const bg=$('backGo'); if(bg)bg.addEventListener('click',()=>{const to=PENDING_BACK;PENDING_BACK='';moveStage(to,bg);});
  const bn=$('backNo'); if(bn)bn.addEventListener('click',()=>{PENDING_BACK='';renderPath();});
}
async function moveStage(to,btn){
  if(!to||!DEAL||!DEAL.deal)return;
  if(btn)btn.disabled=true;
  const r=await apiAg('/sales/deals/'+encodeURIComponent(DEAL.deal.id)+'/stage','POST',{to});
  if(r.ok){
    DEAL.deal=r.body.data||DEAL.deal;
    PENDING_BACK='';   // any pending back-confirm strip is now against the OLD stage — drop it
    toast('Moved to '+stageLabel(to)+'.');
    renderHighlights();renderPath();
    if(TAB==='deal')showTab(TAB,true);   // the Deal pane shows stage/next-step — keep it honest
    loadActivity();
  }
  else{toast((r.body&&r.body.message)||'Couldn’t move the stage.');if(btn)btn.disabled=false;renderPath();}
}

function setTabUrl(tab){ const q=QP(); q.set('tab',tab); history.replaceState(null,'', '/crm.html?'+q.toString()); }

function showTab(tab,initial){
  TAB=tab;
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>{const on=b.getAttribute('data-tab')===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false');b.setAttribute('tabindex',on?'0':'-1');});
  if(!initial)setTabUrl(tab);
  const host=$('tabbody'); if(!host)return;
  host.setAttribute('aria-labelledby','tab-'+tab);
  if(tab==='details')return loadDetails(host);
  if(tab==='deal')return renderDealTab(host);
  if(tab==='billing')return renderBillingTab(host);
  if(tab==='delivery')return renderDeliveryTab(host);
  if(tab==='files')return renderFilesTab(host);
}

// ── Details tab: contact facts + custom fields + the relationship overview ──
// ONE contact fetch per contact id: the profile callback re-runs showTab('details')
// when PROFILE lands, and without the cache that duplicated the /sales/contacts/:id
// read and flashed the pane back to a spinner mid-paint.
let CONTACT_CACHE=null;   // {cid, promise}
async function loadDetails(host){
  const cid=(REC.identity&&REC.identity.contact_id)||'';
  let d=null;
  if(cid){
    if(!CONTACT_CACHE||CONTACT_CACHE.cid!==cid){
      CONTACT_CACHE={cid,promise:apiAg('/sales/contacts/'+encodeURIComponent(cid)).then(r=>r.ok?(r.body.data||{}):null)};
      host.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';   // spinner only when actually fetching
    }
    d=await CONTACT_CACHE.promise.catch(()=>null);
    if(d===null&&CONTACT_CACHE&&CONTACT_CACHE.cid===cid)CONTACT_CACHE=null;   // failed read → the next render retries
  }
  if(TAB!=='details')return;
  let html='';
  if(d){
    const c=d.contact||{}; const cf=d.custom_fields||[]; const cv=c.custom||{};
    DETAIL={cid,c,cf};
    const rows=[['Name',c.name],['Company',c.company],['Email',c.email],['Phone',c.phone]].filter(x=>x[1]);

// Edit the contact inline (PATCH /sales/contacts/:id — the existing path, kept).
// The owner's CUSTOM FIELDS edit here too: the Details tab has always DISPLAYED
// them (loadDetails renders d.custom_fields), so an Edit that couldn't touch
// them left the only fillable path on contacts.html. Same PATCH, `custom` bag.
// `notes` stays off the form deliberately — that column doubles as the
// connect-on-signup machine marker (CONNECT_INTENT_TAG, routes/sales.ts).
function editContact(host){
  const c=(DETAIL&&DETAIL.c)||{}; const cid=DETAIL&&DETAIL.cid;
  const defs=(DETAIL&&DETAIL.cf)||[]; const cv=c.custom||{};
  const inp=(id,val,type,extra)=>`<input id="${id}" type="${type||'text'}" value="${esc(val==null?'':val)}"${extra||''} style="width:100%;box-sizing:border-box;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px">`;
  const lab=(id,label)=>`<label class="mut" for="${id}" style="font-size:12.5px;color:var(--faint);display:block;margin-top:10px">${label}</label>`;
  const field=(id,label,val,type)=>lab(id,label)+inp(id,val,type);
  const cfField=(f)=>{
    const id='eccf-'+f.key, v=cv[f.key];
    if(f.type==='select'){
      const opts=['<option value="">—</option>'].concat((f.choices||[]).map(o=>`<option value="${esc(o)}"${String(v==null?'':v)===String(o)?' selected':''}>${esc(o)}</option>`)).join('');
      return lab(id,esc(f.label||f.key))+`<select id="${id}" data-cf="${esc(f.key)}" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px">${opts}</select>`;
    }
    return lab(id,esc(f.label||f.key))+inp(id,v,f.type==='number'?'number':(f.type==='date'?'date':'text'),` data-cf="${esc(f.key)}"`);
  };
  host.innerHTML=`<section><h2>Edit contact</h2><div class="card">
    ${field('ec-name','Name',c.name)}${field('ec-company','Company',c.company)}${field('ec-email','Email',c.email,'email')}${field('ec-phone','Phone',c.phone,'tel')}
    ${defs.map(cfField).join('')}
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:14px"><button id="ec-cancel">Cancel</button><button class="primary" id="ec-save">Save</button></div></div></section>
    <section><div class="card"><p class="muted" style="margin:0 0 10px;font-size:13.5px">Removing a contact takes them off your contact list. Their deals, agreements, invoices and projects are never deleted with them.</p>
    <button id="ec-del" style="border-color:transparent;color:var(--bad)">Delete this contact</button></div></section>`;
  $('ec-cancel').onclick=()=>loadDetails(host);
  $('ec-save').onclick=async()=>{
    const body={name:$('ec-name').value.trim(),company:$('ec-company').value.trim(),email:$('ec-email').value.trim(),phone:$('ec-phone').value.trim()};
    if(defs.length){const custom={};host.querySelectorAll('[data-cf]').forEach(el=>{custom[el.getAttribute('data-cf')]=el.value;});body.custom=custom;}
    const btn=$('ec-save'); btn.disabled=true;
    const r=await apiAg('/sales/contacts/'+cid,'PATCH',body);
    // Every failure names itself — a 409 (two contacts, one address) is the one
    // an operator can act on, so it keeps the server's own wording.
    if(r.ok){CONTACT_CACHE=null;toast(r.body&&r.body.warning==='custom_unavailable'?((r.body.message)||'Saved.'):'Saved.');loadDetails(host);}
    else{toast((r.body&&r.body.message)||(r.status?('Couldn’t save — the server answered '+r.status+'.'):'Couldn’t save — we couldn’t reach the server.'));btn.disabled=false;}
  };
  // Two-step delete, same contract as contacts.html: the unconfirmed DELETE is a
  // dry run that writes nothing and returns what's attached; the confirm names it.
  $('ec-del').onclick=async()=>{
    const who=c.name||c.email||c.phone||'this contact';
    const btn=$('ec-del'); btn.disabled=true;
    const pre=await apiAg('/sales/contacts/'+cid,'DELETE');
    btn.disabled=false;
    if(pre.ok&&pre.body&&pre.body.data&&pre.body.data.already){toast(who+' was already removed.');location.href='/contacts.html';return;}
    if(pre.status!==409){toast((pre.body&&pre.body.message)||(pre.status?('We couldn’t check what’s attached to '+who+' — the server answered '+pre.status+'. Nothing was deleted.'):'We couldn’t reach the server. Nothing was deleted.'));return;}
    if(!confirm('Remove '+(pre.body.name||who)+'?\n\n'+(pre.body.message||'')))return;
    btn.disabled=true;
    const d=await apiAg('/sales/contacts/'+cid+'?confirm=1','DELETE');
    if(!d.ok){toast((d.body&&d.body.message)||((pre.body.name||who)+' was NOT removed — the server answered '+(d.status||'nothing')+'.'));btn.disabled=false;return;}
    const kept=(d.body&&d.body.data&&d.body.data.kept_items)||[];
    toast(kept.length?((pre.body.name||who)+' removed — their '+kept.join(', ')+' stayed.'):((pre.body.name||who)+' removed.'));
    setTimeout(()=>{location.href='/contacts.html';},900);
  };
}

// ── Deal tab: a related-list card — read-only rows + links into pipeline.html

function renderDealTab(host){
  if(!DEAL){host.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';return;}
  if(DEAL.error||!DEAL.deal){host.innerHTML='<p class="muted">Couldn’t load the deal just now.</p>';return;}
  const d=DEAL.deal||{}; const link=agHref('pipeline.html','deal='+encodeURIComponent(d.id||''));
  const propChip=(s)=>s==='accepted'?'good':s==='declined'?'bad':s==='sent'?'':'warn';
  const conChip=(s)=>s==='signed'?'good':s==='sent'?'':'warn';
  let html=`<section><div class="card"><div class="card-h"><span class="t">${esc(d.title||'Deal')}</span><a class="link" href="${esc(link)}">Open in pipeline →</a></div><div class="kv">`;
  const rows=[];
  if(d.expected_value_cents)rows.push(['Value',fmtC(d.expected_value_cents)]);
  if(d.stage)rows.push(['Stage',stageLabel(d.stage)]);
  if(d.expected_close)rows.push(['Expected close',d.expected_close]);
  if(d.next_step)rows.push(['Next step',d.next_step+(d.next_step_at?' · '+dueLabel(d.next_step_at):'')]);
  if(DEAL.last_contacted_at)rows.push(['Last contacted',when(DEAL.last_contacted_at)]);
  html+=rows.map(r=>`<div class="k">${esc(r[0])}</div><div>${esc(r[1])}</div>`).join('')||'<div class="muted">No details yet.</div>';
  html+=`</div></div></section>`;
  // Stage-aware "what now": one honest line + the one button that matters.
  // A won deal points at billing and the project, never at an unsent draft.
  const inv=DEAL.invoices||[]; const open=invWaiting(inv); const paid=inv.filter(v=>invState(v)==='paid');
  const owed=open.reduce((a,b)=>a+(b.amount_cents||0),0);
  const signed=(DEAL.contracts||[]).some(c=>c.status==='signed');
  let now='';
  if(d.stage==='won'){
    now=owed?`${fmtC(owed)} is awaiting payment across ${open.length} invoice${open.length===1?'':'s'}.`:(paid.length?`All ${fmtC(paid.reduce((a,b)=>a+(b.amount_cents||0),0))} paid so far. Send the next invoice when a milestone lands.`:'Nothing invoiced yet.');
    now+=` <button class="link-btn" data-go="billing">Open Billing →</button>`;
  }else if(d.stage==='contract'){
    now=signed?'Agreement signed. Request the deposit, then convert them to a customer.':'The agreement is out for signature.';
    now+=` <button class="link-btn" data-go="billing">Open Billing →</button>`;
  }else if(d.stage==='proposal'){ now='Your proposal is with them. <button class="link-btn" data-go="billing">See proposals →</button>'; }
  else if(d.stage==='lost'){ now='Marked not a fit. The record stays so you can pick it back up.'; }
  if(now)html+=`<section><h2>What now</h2><div class="card"><p style="font-size:14.5px;margin:0">${now}</p></div></section>`;
  const sum=(label,n,extra)=>`<div class="rrow"><span class="rt">${label}<span class="s">${extra}</span></span><button class="link-btn" data-go="billing">Billing →</button></div>`;
  html+=`<section><h2>Documents</h2><div class="card">`
    +sum('Proposals',0,(DEAL.proposals||[]).length?(DEAL.proposals||[]).map(p=>esc(p.title||'Proposal')+' · '+esc(p.status||'draft')).join(' · '):'None yet')
    +sum('Agreement',0,(DEAL.contracts||[]).length?(DEAL.contracts||[]).map(c=>esc(c.title||'Agreement')+' · '+esc(c.status||'draft')).join(' · '):'None yet')
    +sum('Invoices',0,inv.length?`${inv.length} · ${fmtC(inv.reduce((a,b)=>a+(b.amount_cents||0),0))} total${owed?' · '+fmtC(owed)+' open':''}`:'None yet')
    +`</div></section>`;
  host.innerHTML=html;
  host.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>showTab(b.getAttribute('data-go'))));
}

// ── Billing tab: the money, with its actions, ON the record ──────────────────
// Proposals · Agreement · Invoices · Retainer. Every row carries the verb that
// goes with it (Send / Resend · Copy link · View / print · Void). New invoice,
// deposit and retainer open as small inline forms. The proposal and agreement
// EDITORS, payment-schedule builder and templates stay on pipeline.html (linked),
// so nothing there is rebuilt — the routes below are the same ones it calls.
function renderBillingTab(host){
  if(!DEAL){host.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';return;}
  if(DEAL.error||!DEAL.deal){host.innerHTML='<p class="muted">Couldn’t load billing just now.</p>';return;}
  const d=DEAL.deal||{}; const link=agHref('pipeline.html','deal='+encodeURIComponent(d.id||''));
  const c=DEAL.contact||REC.header||{}; const noEmail=!(c&&c.email);
  const propChip=(s)=>s==='accepted'?'good':s==='declined'?'bad':s==='sent'?'':'warn';
  const conChip=(s)=>s==='signed'?'good':s==='sent'?'':'warn';
  const inv=(DEAL.invoices||[]); const open=invWaiting(inv); const paid=inv.filter(v=>invState(v)==='paid');
  const owed=open.reduce((a,b)=>a+(b.amount_cents||0),0); const got=paid.reduce((a,b)=>a+(b.amount_cents||0),0);
  const act=(attrs,label,title)=>`<button type="button" class="rbtn" ${attrs}${title?` title="${esc(title)}"`:''}>${label}</button>`;
  let html='';
  // visual refresh: the money facts live in the header tiles now (value · paid ·
  // outstanding) — the tab opens straight on the invoices.
  if(noEmail)html+=`<p class="muted" style="margin:0 0 12px;font-size:13.5px">There’s no email on this client, so nothing can be emailed — links are copied for you to send. Add their email under Details.</p>`;
  // ONE LINK (benchmark 2026-10, item 5): both drafted → one filled "Send
  // proposal & agreement"; the per-document sends and Request deposit go under
  // More, and "+ Invoice" steps back to a quiet button (one filled per screen).
  const both=sendBothDocs();
  if(both)html+=`<section id="sendBoth"><div class="card"><p class="muted" style="margin:0 0 10px;font-size:13.5px">The proposal and the agreement are drafted. Send them together — one email, one link: they accept, sign, then pay the deposit on one page.</p>
    <span class="racts" style="display:inline-flex;gap:6px;align-items:center"><button type="button" class="rbtn primary" id="sendBothBtn" data-send-both="1" data-prop="${esc(both.prop.id)}" data-con="${esc(both.con.id)}">Send proposal &amp; agreement</button><span class="more"><button type="button" class="rbtn" id="sendMore" aria-haspopup="true" aria-expanded="false" aria-controls="sendMoreMenu">More ▾</button><div class="more-menu" id="sendMoreMenu" hidden><button type="button" class="abtn" data-send-prop="${esc(both.prop.id)}">Send the proposal only</button><button type="button" class="abtn" data-send-con="${esc(both.con.id)}">Send the agreement only</button><button type="button" class="abtn" data-bform="deposit">Request deposit</button></div></span></span></div></section>`;
  // invoices + the new-invoice / deposit forms
  html+=`<section><h2>Invoices <span class="sec-acts" style="display:flex;gap:6px">${both?'':'<button type="button" class="rbtn" data-bform="deposit">Request deposit</button>'}<a class="rbtn" href="${esc(link)}#schedule" style="text-decoration:none">Payment schedule</a><button type="button" class="rbtn${both?'':' primary'}" data-bform="invoice">+ Invoice</button></span></h2>
    <div id="bform"></div>`;
  html+=inv.length?`<div class="card tcard"><table class="btable"><thead><tr><th>Invoice</th><th>Status</th><th class="amt">Amount</th><th>Due</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>`+inv.map(v=>{
    const name=esc(v.title||(v.purpose==='deposit'?'Deposit':'Invoice'));
    // Oct 2026 (item 2): the chip is the money state word — Paid · Processing ·
    // Upcoming · Overdue — in its one colour; sent-ness moves to the sub-line.
    const st=invState(v);
    let sub=esc(v.purpose==='deposit'?'Initial deposit':(v.description||v.purpose||''));
    let state, acts='', due='', dueCls='';
    if(st==='paid'){state=`<span class="schip good">Paid</span>`;due=v.paid_at?esc(dueLabel(v.paid_at)):'';}
    else if(!st){state=`<span class="schip" style="background:var(--bg);color:var(--faint)">Voided</span>`;}
    else if(st==='processing'){state=`<span class="schip info">Processing</span>`;sub=(sub?sub+' · ':'')+'Payment on its way';due=v.due_date?esc(dueLabel(v.due_date)):'';}   // the client paid — nothing to resend or void
    else{state=`<span class="schip ${MONEY_TONE[st]}">${MONEY_WORD[st]}</span>`;
      if(!v.stripe_url)sub=(sub?sub+' · ':'')+'Not sent yet';
      due=v.due_date?esc(dueLabel(v.due_date)):'Due now'; dueCls=st==='overdue'?'due':'';
      acts+=act(`data-send-inv="${esc(v.id)}"`,v.stripe_url?'Resend':'Send');
      if(v.stripe_url)acts+=act(`data-copy="${esc(v.stripe_url)}"`,'Copy link');
      acts+=act(`data-void-inv="${esc(v.id)}"`,'Void','Withdraw this invoice — the payment link stops working');}
    acts+=act(`data-doc="invoices:${esc(v.id)}"`,'View','Open a branded, printable copy (save as PDF)');
    return `<tr class="brow"><td><span class="rt">${name}${sub?`<span class="s">${sub}</span>`:''}</span></td><td>${state}</td><td class="amt">${esc(fmtC(v.amount_cents))}</td><td class="${dueCls}">${due}</td><td class="racts"><span class="racts">${acts}</span></td></tr>`;
  }).join('')+`</tbody></table></div>`:`<div class="card"><p class="muted" style="font-size:13.5px">No invoices yet. Send one, or request a deposit.</p></div>`;
  html+=`</section>`;
  // proposals
  html+=`<section><h2>Proposals <a class="rbtn" href="${esc(link)}" style="text-decoration:none">+ Proposal (in pipeline)</a></h2><div class="card">`;
  const props=DEAL.proposals||[];
  html+=props.length?props.map(p=>{
    let acts='';
    // Phase 3 (stage-aware): a won or lost deal never pushes an unsent draft
    const closed=d.stage==='won'||d.stage==='lost'||!!d.converted_client_id;
    if(p.status==='draft'&&!closed&&!both)acts+=act(`data-send-prop="${esc(p.id)}"`,'Send to client','Emails the proposal with an accept link');
    else if(p.status==='sent')acts+=act(`data-send-prop="${esc(p.id)}" data-resend="1"`,'Copy link');
    acts+=act(`data-doc="proposals:${esc(p.id)}"`,'View / print');
    return `<div class="rrow brow"><span class="rt">${esc(p.title||'Proposal')}${p.version>1?' · v'+esc(p.version):''}<span class="s">${p.subtotal_cents?esc(fmtC(p.subtotal_cents)):''}</span></span><span class="racts"><span class="schip ${propChip(p.status)}">${esc(p.status||'draft')}</span>${acts}</span></div>`;
  }).join(''):`<p class="muted" style="font-size:13.5px">No proposals yet — draft one in the pipeline.</p>`;
  html+=`</div></section>`;
  // agreement
  html+=`<section><h2>Agreement <a class="rbtn" href="${esc(link)}" style="text-decoration:none">+ Agreement (in pipeline)</a></h2><div class="card">`;
  const cons=DEAL.contracts||[];
  html+=cons.length?cons.map(k=>{
    let acts='';
    if(k.status==='draft'&&!both)acts+=act(`data-send-con="${esc(k.id)}"`,'Send for signature');
    else if(k.status==='sent')acts+=act(`data-send-con="${esc(k.id)}" data-resend="1"`,'Copy signing link');
    acts+=act(`data-doc="contracts:${esc(k.id)}"`,k.status==='signed'?'View signed copy':'View / print');
    return `<div class="rrow brow"><span class="rt">${esc(k.title||'Agreement')}<span class="s">${k.signer_name?'Signed by '+esc(k.signer_name)+(k.signed_at?' on '+esc(dueLabel(k.signed_at)):''):(k.status==='sent'?'Out for signature':'Draft')}</span></span><span class="racts"><span class="schip ${conChip(k.status)}">${esc(k.status||'draft')}</span>${acts}</span></div>`;
  }).join(''):`<p class="muted" style="font-size:13.5px">No agreement yet.</p>`;
  html+=`</div></section>`;
  // retainer
  const r=d.retainer;
  html+=`<section><h2>Retainer</h2><div class="card">`;
  if(r&&r.status&&r.status!=='canceled'){
    const st=r.status==='active'?'<span class="schip good">Active</span>':r.status==='past_due'?'<span class="schip bad">Payment overdue</span>':'<span class="schip warn">Awaiting authorization</span>';
    html+=`<div class="rrow brow"><span class="rt"><strong>${esc(fmtC(r.amount_cents))}</strong> every ${r.interval==='year'?'year':'month'}</span><span class="racts">${st}${(r.status==='pending'&&r.checkout_url)?act(`data-copy="${esc(r.checkout_url)}"`,'Copy authorization link'):''}${act('data-ret-cancel="1"','Cancel retainer')}</span></div>`;
  }else{
    html+=`<p class="muted" style="font-size:13.5px;margin-bottom:10px">Bill this client the same amount every month or year. They authorize it once with Stripe; nothing is charged until they do.</p><button type="button" class="rbtn" data-bform="retainer">Set up a retainer</button><div id="rform"></div>`;
  }
  html+=`</div></section>`;
  host.innerHTML=html;
  wireBilling(host,d);
  if(BILLING_OPEN){const w=BILLING_OPEN;BILLING_OPEN='';
    if(w==='invoice'||w==='deposit')billingForm(w);
    else if(w==='retainer')billingForm('retainer');
    else if(w.indexOf('proposal:')===0){const b=host.querySelector(`[data-send-prop="${w.slice(9)}"]`);if(b){reveal(b);}}
    else if(w.indexOf('contract:')===0){const b=host.querySelector(`[data-send-con="${w.slice(9)}"]`);if(b){reveal(b);}}
    else if(w==='both'){const b=host.querySelector('#sendBothBtn');if(b){b.scrollIntoView({block:'center'});b.focus();}}
  }
  // a per-document send that lives under More: open the menu so the focus lands
  function reveal(b){const m=b.closest('.more-menu');if(m){m.hidden=false;const t=host.querySelector('#sendMore');if(t)t.setAttribute('aria-expanded','true');}b.scrollIntoView({block:'center'});b.focus();}
}
// one send path per document kind — same routes pipeline.html uses
async function billingSend(path,okLabel,body){
  const r=await apiAg(path,'POST',body||{});
  if(!r.ok){toast((r.body&&r.body.message)||'That didn’t go through.');return null;}
  const b=r.body||{}; const url=b.url||(b.data&&b.data.url)||'';
  if(url&&navigator.clipboard)navigator.clipboard.writeText(url).catch(()=>{});
  toast(b.emailed?okLabel+' — emailed to the client':(url?okLabel.replace('sent','prepared')+' — link copied, nothing was emailed':okLabel));
  return b;
}
async function reloadDeal(){
  const ids=idParams(); if(!ids.deal)return;
  const r=await apiAg('/sales/deals/'+encodeURIComponent(ids.deal)); DEAL=r.ok?(r.body.data||null):{error:true};
  renderHighlights();renderPath();renderActions();
  if(TAB==='billing'||TAB==='deal'||TAB==='files')showTab(TAB,true);
  loadActivity();
}

  const sm=host.querySelector('#sendMore'); if(sm){const menu=host.querySelector('#sendMoreMenu');

    const close=()=>{if(menu.hidden)return;menu.hidden=true;sm.setAttribute('aria-expanded','false');};

function billingForm(kind){

  $('bf-go').addEventListener('click',async()=>{
    const go=$('bf-go'); go.disabled=true;
    const amt=parseFloat(($('bf-amt').value||'').trim());

      else{toast((r.body&&r.body.message)||'Couldn’t set that up.');go.disabled=false;}
      return;
    }
    const dep=kind==='deposit';
    if(dep&&(!amt||amt<1)){toast('Enter a deposit amount.');go.disabled=false;return;}

    const due=$('bf-due').value; if(due)body.due_date=due;

}
async function sendMoney(body,host){
  const d=(DEAL&&DEAL.deal)||{}; const label=body.purpose==='deposit'?'Deposit request':'Invoice';
  const r=await apiAg('/sales/deals/'+d.id+'/invoice','POST',body);
  if(r.ok){
    const b=r.body||{}; const url=b.url||'';
    if(url&&navigator.clipboard)navigator.clipboard.writeText(url).catch(()=>{});
    toast(b.emailed?label+(b.reused?' re-sent':' sent')+' — emailed to the client':(url?label+' prepared — payment link copied, nothing was emailed':label+' sent'));
    if(host)host.innerHTML='';
    reloadDeal(); return;
  }
  if(r.status===409&&r.body&&r.body.error==='amount_mismatch'&&host){
    const open=r.body.open_invoice||{};
    host.innerHTML=`<div class="bform" role="alert"><p style="font-size:13.5px;margin:0 0 10px">${esc(r.body.message||'An open invoice already exists at a different amount.')} If you send another, both links stay payable until one is paid.</p><div class="bacts"><button type="button" id="bf-resend">Resend the ${esc(fmtC(open.amount_cents))} link</button><button type="button" class="primary" id="bf-force">Send another for the new amount</button></div></div>`;
    $('bf-resend').addEventListener('click',()=>sendMoney({purpose:body.purpose,amount_cents:Number(open.amount_cents)||undefined,title:open.title||undefined},host));
    $('bf-force').addEventListener('click',()=>sendMoney({...body,force:true},host));
    return;
  }
  toast((r.body&&r.body.message)||'That didn’t go through.');
  const go=$('bf-go'); if(go)go.disabled=false;
}

// ── THE activity timeline (the centerpiece) ──────────────────────────────────
// Data: GET /crm/activity. Deploy-order tolerance: if the route isn't there yet
// (404 / no items array — the function may not be redeployed), compose the same
// shape client-side from the OLD routes (/crm/messages + /crm/timeline). The
// fallback lacks deal system events — accepted; it never breaks the page.
// ACT_SEQ (SS6): a superseded activity load must never repaint the rail — only
// the newest request's outcome (server path OR fallback) is allowed to touch
// ACT and render.
let ACT_SEQ=0;
async function loadActivity(){
  const seq=++ACT_SEQ;
  const ids=idParams(); const q=[];
  if(ids.project)q.push('project='+encodeURIComponent(ids.project));
  if(REC.identity&&REC.identity.client_id)q.push('client_id='+encodeURIComponent(REC.identity.client_id));
  if(ids.deal)q.push('deal='+encodeURIComponent(ids.deal));
  const scopedCustomer=!!(REC.sections&&REC.sections.overview);   // the scope header alone resolves the identity server-side
  if(!q.length&&!scopedCustomer){ACT={items:[],upcoming:[],reply_to:null,reply_support_to:null,failed:false};renderRail();return;}
  const r=await api('/crm/activity?'+q.join('&'));
  if(seq!==ACT_SEQ)return;
  const d=(r.ok&&r.body.data)||{};
  if(r.ok&&Array.isArray(d.items)){
    ACT={items:d.items,upcoming:Array.isArray(d.upcoming)?d.upcoming:[],reply_to:d.reply_to||null,reply_support_to:d.reply_support_to||null,failed:false};
    renderRail();return;
  }
  await loadActivityFallback(q,seq);
  if(seq!==ACT_SEQ)return;
  renderRail();
}
// thin adapter mirroring the server's crm/activity.ts mappers
function convItem(m){
  if(!m||!m.created_at)return null;
  const at=m.created_at, id='conv:'+m.kind+':'+(m.id||''), mine=m.from==='studio', body=m.body||null;
  if(m.kind==='message')return{id,kind:'message',type:'message',title:mine?'You sent a message':'The client sent a message',body,at,meta:null,href:null};
  if(m.kind==='support')return{id,kind:'support',type:'message',title:(mine?'You':'The client')+' opened a support request'+(m.subject?' — '+m.subject:''),body,at,meta:'Support'+(m.status?' · '+String(m.status).replace(/_/g,' '):''),href:null};
  if(m.kind==='support_reply')return{id,kind:'support_reply',type:'message',title:mine?'You replied':'The client replied',body,at,meta:'Support',href:null};
  if(m.kind==='enquiry')return{id,kind:'enquiry',type:'message',title:'The client reached out from your website',body,at,meta:'Website enquiry',href:null};
  if(m.kind==='booking')return{id,kind:'booking',type:'call',title:m.subject||'The client booked a call',body,at,meta:'Booking',href:null};
  if(m.kind==='broadcast')return{id,kind:'broadcast',type:'email',title:'You sent a broadcast'+(m.subject?' — '+m.subject:''),body,at,meta:'Broadcast',href:null};
  if(m.kind==='activity'){
    const map={call:['call','You logged a call','Logged call'],email:['email','You logged an email','Logged email'],meeting:['call','You logged a meeting','Meeting'],note:['note','You added a note','Note'],proposal_sent:['system','Proposal sent','Deal'],contract_sent:['system','Agreement sent','Deal'],invoice_sent:['system','Invoice sent','Deal']};
    const t=map[m.activity_kind]||['note','You logged an activity','Activity'];
    return{id,kind:'activity',type:t[0],title:t[1],body,at,meta:t[2],href:null};
  }
  return null;
}
function siteItem(t){
  if(!t||!t.at)return null;
  if(t.kind==='note')return{id:'site:'+t.id,kind:'note',type:'note',title:t.title||'Note',body:t.detail||null,at:t.at,meta:t.audience==='internal'?'Internal note':'Shared note',href:null};
  const meta={publish:'Website',change:'Website',connected:'Connected',moment:'Moment',approval:'Approval',lead:'Enquiry'}[t.kind]||null;
  return{id:'site:'+t.id,kind:t.kind,type:'system',title:t.title||t.kind,body:t.detail||null,at:t.at,meta,href:null};
}
async function loadActivityFallback(q,seq){
  const ids=idParams(); const s=(REC&&REC.sections)||{};
  const [mr,tr,tk]=await Promise.all([
    api('/crm/messages?'+q.join('&')),
    s.overview?api('/crm/timeline'):Promise.resolve({ok:false,body:{}}),
    ids.deal?apiAg('/sales/deals/'+encodeURIComponent(ids.deal)+'/tasks'):Promise.resolve({ok:false,body:{}}),
  ]);
  if(seq!==undefined&&seq!==ACT_SEQ)return;   // superseded mid-flight — never mutate ACT
  if(!mr.ok&&!tr.ok){ACT={items:[],upcoming:[],reply_to:null,reply_support_to:null,failed:true};return;}
  const md=(mr.ok&&mr.body.data)||{};
  const items=[]; const push=(x)=>{if(x&&x.at)items.push(x);};
  for(const m of md.items||[])push(convItem(m));
  for(const t of (tr.ok&&tr.body.data&&tr.body.data.items)||[])push(siteItem(t));
  const tasks=(tk.ok&&Array.isArray(tk.body.data))?tk.body.data:[];
  for(const t of tasks)if(t.status==='done'&&(t.completed_at||t.created_at))push({id:'task:'+t.id,kind:'task',type:'task',title:'To-do completed — '+(t.title||'To-do'),body:null,at:t.completed_at||t.created_at,meta:'To-do',href:null});
  items.sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:0);
  // upcoming, composed from what the page already knows (open to-dos + the deal's
  // next step + unpaid invoices) — await the deal fetch so the band is deterministic
  // instead of racing loadPanels' parallel /sales/deals read
  await DEAL_READY.catch(()=>{});
  if(seq!==undefined&&seq!==ACT_SEQ)return;   // superseded while waiting on the deal read
  const today=new Date().toISOString().slice(0,10); const upcoming=[];
  const dealHref=ids.deal?agHref('pipeline.html','deal='+encodeURIComponent(ids.deal)):null;
  for(const t of tasks)if(t.status==='open')upcoming.push({kind:'task',id:t.id,title:t.title||'To-do',due:t.due_date||null,overdue:!!(t.due_date&&String(t.due_date).slice(0,10)<today),href:dealHref});
  const d=DEAL&&DEAL.deal;
  if(d&&d.next_step)upcoming.push({kind:'next_step',id:null,title:'Next step — '+d.next_step,due:d.next_step_at||null,overdue:!!(d.next_step_at&&String(d.next_step_at).slice(0,10)<today),href:dealHref});
  // item 2: only an invoice still WAITING on the client belongs here, and its
  // overdue flag is the one formula's word (a processing payment is on its way)
  for(const iv of invWaiting((DEAL&&DEAL.invoices)||[]))upcoming.push({kind:'invoice',id:null,title:'Unpaid invoice'+(iv.title?' — '+iv.title:'')+(iv.amount_cents?' ('+fmtC(iv.amount_cents)+')':''),due:iv.due_date||null,overdue:invState(iv)==='overdue',href:dealHref});
  upcoming.sort((a,b)=>{if(!a.due&&!b.due)return 0;if(!a.due)return 1;if(!b.due)return -1;return a.due<b.due?-1:a.due>b.due?1:0;});
  ACT={items,upcoming,reply_to:md.reply_to||null,reply_support_to:md.reply_support_to||null,failed:false};
}
