<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDS Function Test</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 0 auto; padding: 24px; background: #faf8fc; color: #1a1523; }
  h1 { font-size: 20px; }
  button { background: #5b3fa0; color: #fff; border: none; border-radius: 12px; padding: 16px 24px; font-size: 16px; font-weight: 600; width: 100%; margin: 10px 0; cursor: pointer; }
  .out { background: #fff; border: 2px solid #5b3fa0; border-radius: 12px; padding: 16px; margin-top: 16px; white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 13px; line-height: 1.5; min-height: 60px; }
  .status { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .ok { color: #1d7a45; }
  .bad { color: #a83440; }
  .label { font-size: 13px; color: #6b5f7e; margin-top: 18px; }
</style>
</head>
<body>
  <h1>Davis Digital Studio — Function Test</h1>
  <p>This calls your clever-api function and shows exactly what comes back. It does not hide errors.</p>

  <button onclick="testConcierge()">Test the Chatbot (concierge)</button>
  <button onclick="testKey()">Test the API Key</button>

  <div class="label">Result:</div>
  <div class="out" id="out">Tap a button above.</div>

<script>
var EDGE_FN = 'https://qksstlqzbhesadrrofgn.supabase.co/functions/v1/clever-api';

function showRaw(statusCode, bodyText) {
  var out = document.getElementById('out');
  var cls = (statusCode >= 200 && statusCode < 300) ? 'ok' : 'bad';
  out.innerHTML = '<div class="status ' + cls + '">HTTP ' + statusCode + '</div>' + escapeHtml(bodyText);
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function testConcierge() {
  document.getElementById('out').textContent = 'Calling...';
  fetch(EDGE_FN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'concierge', messages: [{ role: 'user', content: 'How much does a website cost?' }] })
  })
  .then(function(r){ return r.text().then(function(t){ showRaw(r.status, t); }); })
  .catch(function(e){ showRaw(0, 'Network error: ' + e); });
}

function testKey() {
  document.getElementById('out').textContent = 'Calling...';
  fetch(EDGE_FN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'keytest' })
  })
  .then(function(r){ return r.text().then(function(t){ showRaw(r.status, t); }); })
  .catch(function(e){ showRaw(0, 'Network error: ' + e); });
}
</script>
</body>
</html>
