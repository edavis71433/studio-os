<div style="background:#f4f2ef;padding:28px 14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden">
    <div style="height:6px;background:#5b3fa0;font-size:0;line-height:0">&nbsp;</div>
    <div style="padding:26px 30px 6px">
      <h1 style="font-family:Georgia,'Iowan Old Style',serif;font-weight:500;font-size:22px;color:#1b1525;margin:0 0 12px">Your sign-in link</h1>
      <p style="font-size:15px;line-height:1.6;color:#1b1525;margin:0 0 16px">Tap the button to sign in. The link works once, for a short time.</p>
      <p style="margin:0 0 20px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5b3fa0;color:#ffffff;padding:11px 22px;border-radius:999px;text-decoration:none;font-weight:600">Sign in</a></p>
      <p style="font-size:14px;line-height:1.6;color:#6b6478;margin:0 0 6px">Or type this code on the sign-in page:</p>
      <p style="font-family:'Courier New',Menlo,monospace;font-size:28px;font-weight:700;letter-spacing:6px;color:#3a2470;background:#efeafa;border-radius:12px;padding:14px 18px;text-align:center;margin:0 0 20px">{{ .Token }}</p>
      <p style="font-size:13px;line-height:1.55;color:#6b6478;margin:0 0 22px">Didn’t ask to sign in? You can ignore this email. No one can sign in without this link or code.</p>
    </div>
    <div style="padding:14px 30px;border-top:1px solid #eee9e0;font-size:12px;line-height:1.5;color:#938ba3">Davis Digital Studio LLC · Burbank, California</div>
  </div>
</div>
