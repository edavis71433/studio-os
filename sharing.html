<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharing & access — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);--serif:'Fraunces',"Iowan Old Style",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38}
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#171320}}
  :root[data-theme="dark"] button.pri{color:#171320}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:38px 20px 90px}
  a.back{font-size:13px;color:var(--soft);text-decoration:none}a.back:hover{color:var(--p)}
  h1{font-family:var(--serif);font-weight:500;font-size:30px;margin:14px 0 .1em}
  .sub{color:var(--soft);font-size:15px;margin:0 0 26px;max-width:54ch}
  h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:30px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px;box-shadow:var(--shadow)}
  .rowitem{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .rowitem:last-child{border-bottom:none}
  .rowitem .t{font-weight:600;font-size:14.5px} .rowitem .d{font-size:12.5px;color:var(--faint)}
  .rowitem .grow{flex:1;min-width:0}
  .invite{display:flex;gap:9px;flex-wrap:wrap;padding:14px 15px}
  .invite input{flex:1;min-width:180px;font-family:inherit;font-size:14px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 15px;cursor:pointer}
  button:hover{border-color:var(--p);color:var(--p)} button.pri{background:var(--p);color:#fff;border-color:var(--p)} button.pri:hover{background:var(--p-deep);color:#fff}
  .sw{position:relative;width:44px;height:25px;border-radius:999px;background:var(--line);cursor:pointer;flex:0 0 auto;border:none;transition:.15s}
  .sw[aria-checked="true"]{background:var(--p)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
  .sw[aria-checked="true"]::after{transform:translateX(19px)}
  .locked{opacity:.6} .pill{font-size:11px;font-weight:600;color:var(--soft);background:var(--line);border-radius:999px;padding:3px 9px}
  .center{text-align:center;padding:50px 20px}.center h2{font-family:var(--serif);font-weight:500;font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 8px}
  .muted{color:var(--soft);font-size:14px}a.link{color:var(--p);text-decoration:none;font-weight:600}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}
  @keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="/presence.html">← Workspace</a>
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
// Sharing & access (A7.2). The owner invites a client reviewer and chooses what
// the client sees. Consumes /portal/context + /portal/members + /portal/shares
// (owner/operator only, enforced server-side). Internal notes are private by
// default and only shared here on purpose.
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="";
sb.auth.onAuthStateChange((_e,s)=>{ if(s&&s.access_token) TOKEN=s.access_token; });
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN});
async function api(p,m,b){const r=await fetch(FN+p,{method:m||'GET',headers:H(),body:b?JSON.stringify(b):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
function toast(m){if(window.ddsToast)return void ddsToast(m);const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

// surfaces the owner can share with a client reviewer + their default posture
const SURFACES=[
  {k:'business_moments',t:'Today',d:'Your calm daily updates',def:true},
  {k:'reports',t:'Analytics',d:'Reviews & findings',def:true},
  {k:'media',t:'Photos',d:'Your photos & media',def:true},
  {k:'connected',t:'Connected data',d:'Your review/visitor numbers',def:true},
  {k:'drafts',t:'Drafts',d:'Work in progress',def:false},
  {k:'visual_assets',t:'Visual Studio assets',d:'AI-made images',def:false},
  {k:'files',t:'Documents',d:'Documents & deliverables',def:false},
  {k:'internal_notes',t:'Internal notes',d:'Private to your studio',def:false,internal:true},
];
let SHARES={};

function render(members){
  let html=`<h1>Sharing & access</h1><p class="sub">Invite a client to review, and choose exactly what they see. They can review and approve — never edit, publish, or connect. Internal notes stay private unless you share them.</p>`;
  // members
  html+=`<h2>People with access</h2><div class="card">
    <div class="invite"><input id="email" type="email" placeholder="client@theirbusiness.com" aria-label="Client email"><button class="pri" id="add">Invite as reviewer</button></div>`;
  if(members.length){for(const m of members){html+=`<div class="rowitem"><span class="grow"><span class="t">${esc(m.email)}</span><br><span class="d">${esc(m.role.replace('_',' '))} · ${esc(m.status)}</span></span>${m.role!=='business_owner'?`<button data-resend="${esc(m.email)}" data-role="${esc(m.role)}">Resend invite</button> <button data-revoke="${esc(m.id)}">Remove</button>`:''}</div>`;}}
  else html+=`<div class="rowitem"><span class="d">No one else yet — invite a client above to give them a review-only portal.</span></div>`;
  html+=`</div>`;
  // shares
  html+=`<h2>What clients see</h2><div class="card">`;
  for(const s of SURFACES){const on=(SHARES[s.k+':*']!=null)?SHARES[s.k+':*']:s.def;/* switch gets an accessible name below */
    html+=`<div class="rowitem${s.internal?' locked':''}"><span class="grow"><span class="t">${esc(s.t)}${s.internal?' <span class="pill">private by default</span>':''}</span><br><span class="d">${esc(s.d)}</span></span>
      <button class="sw" role="switch" aria-label="Share ${esc(s.t)} with clients" aria-checked="${on}" data-surface="${esc(s.k)}"></button></div>`;}
  html+=`</div>`;
  // (Developer Mode is fully built and appears under Settings when the account has
  //  that capability — no "coming soon" placeholder belongs here.)
  $('main').innerHTML=html;wire();
}
function wire(){
  const add=$('add');if(add)add.addEventListener('click',invite);
  document.querySelectorAll('[data-revoke]').forEach(b=>b.addEventListener('click',()=>revoke(b.getAttribute('data-revoke'))));
  document.querySelectorAll('[data-resend]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;const r=await api('/portal/members','POST',{email:b.getAttribute('data-resend'),role:b.getAttribute('data-role')||'client_reviewer'});toast((r.ok&&r.body.data&&r.body.data.message)||'Invite re-sent.');b.disabled=false;}));
  document.querySelectorAll('[data-surface]').forEach(b=>b.addEventListener('click',()=>toggle(b)));
}
async function invite(){const e=($('email').value||'').trim();if(!e){toast('Enter their email.');return;}
  const r=await api('/portal/members','POST',{email:e,role:'client_reviewer'});
  if(r.ok){toast((r.body&&r.body.data&&r.body.data.message)||'Invited.');return load();}toast((r.body&&r.body.message)||'That didn’t save.');}
async function revoke(id){if(!confirm('Remove their access?'))return;const r=await api('/portal/members/'+id+'/revoke','POST',{});if(r.ok){toast('Removed.');return load();}toast('That didn’t work.');}
async function toggle(btn){const surface=btn.getAttribute('data-surface');const next=btn.getAttribute('aria-checked')!=='true';
  btn.setAttribute('aria-checked',String(next));
  const r=await api('/portal/shares','POST',{surface,shared:next});
  if(r.ok){SHARES[surface+':*']=next;toast(next?'Shared with clients.':'Kept internal.');}
  else{btn.setAttribute('aria-checked',String(!next));toast('That didn’t save.');}
}
function notOwner(){$('main').innerHTML=`<div class="center"><h2>Only the account owner can manage sharing.</h2><p class="muted">Ask your studio if you need access changed.</p></div>`;}
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to manage sharing.</h2><p style="margin-top:18px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>Couldn’t load this just now.</h2><p class="muted">Please refresh.</p></div>`;}

async function load(){
  // PERF: reuse the shell's /portal/context (window.ddsContext) — fall back to our own read.
  // Only when UNSCOPED: this page's api() carries no x-dds-scope-site, so under a
  // drilled-in ?client= the shell's copy describes the CLIENT site, not ours.
  const useShared=window.ddsContext&&!new URLSearchParams(location.search).get('client');
  const ctx=await (useShared?window.ddsContext().then((d)=>({ok:true,body:{data:d}})):Promise.reject()).catch(()=>api('/portal/context'));if(!ctx.ok){trouble();return;}
  if(!(ctx.body.data&&ctx.body.data.sees_full_workspace)){notOwner();return;}
  const [mem,sh]=await Promise.all([api('/portal/members'),api('/portal/shares')]);
  if(mem.status===403){notOwner();return;}
  SHARES={};if(sh.ok&&sh.body.data&&sh.body.data.shares)for(const s of sh.body.data.shares)SHARES[s.surface+':'+(s.item_id||'*')]=s.shared;
  render((mem.ok&&mem.body.data)||[]);
}
(async function(){try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";if(!TOKEN){signedOut();return;}await load();}catch(_){trouble();}})();
</script>
</body>
</html>
