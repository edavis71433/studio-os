name: CI (Deno pure suite + typecheck)

# The automated regression gate for the edge functions and the deterministic
# render pipeline (Presence CMS Phase 1, M1). Runs the pure test sweep
# (no network, no live Supabase) and typechecks all three functions. The
# integration-tier suites that need live Supabase credentials are skipped here;
# they run against staging separately. The golden render suite is part of the
# sweep, so a renderer change that alters output fails CI until the golden
# baseline is intentionally updated and committed.
#
# There is no `paths:` filter, on purpose. A required check that a path filter
# skips never reports, so the pull request sits on "Expected" forever. The old
# filter also hid real dependencies: on Nov 6 2026, 77 of the 268 suites read
# files it left out, 57 of them served files such as pages, so a pull request
# changing only a page ran none of their pins.
#
# There is no skip list like the one `browser` has, either. This job takes under
# a minute, and the suites reach pages, migrations, docs and the repo root, so
# there is little to skip and a wrong skip would read as a pass.
# tests/workflows/ci_scope_test.mjs holds all this in place.
#
# To make this a REQUIRED gate: Settings → Branches → protect `main` and add
# "test" (this job) as a required status check.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.1"
      - name: Typecheck edge functions
        run: |
          deno check supabase/functions/presence/index.ts
          deno check supabase/functions/clever-api/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
      - name: Pure test sweep (+ golden render)
        run: bash scripts/ci-pure-tests.sh
      - name: Schema dump workflow (real steps, stub CLI, no secrets)
        run: deno run --allow-read --allow-write --allow-run --allow-env tests/workflows/schema_dump_test.mjs
      - name: E2E workflow's decision step (real step, real git, no network)
        run: deno run --allow-read --allow-write --allow-run --allow-env tests/workflows/e2e_scope_test.mjs
      - name: This workflow's own shape (nothing can skip or soften this check)
        run: deno run --allow-read tests/workflows/ci_scope_test.mjs
