name: E2E (Playwright)

# Browser end-to-end gate (Phase PW). Runs the hermetic Playwright suite —
# real page JS against stubbed Supabase + mocked API fixtures — across
# desktop / tablet / mobile. No secrets, no live backend, fully deterministic.
#
# There is no `paths:` filter, on purpose. A required check that a path filter
# skips never reports, so the pull request sits on "Expected" forever. Instead
# the `scope` job always starts and decides whether the suite needs to run, and
# the `browser` job always reports. When the suite doesn't need to run, `browser`
# still reports green in under a minute.
#
# The three devices run at the same time, split across eight machines (`devices`): the
# desktop in two parts and the phone and the tablet in three each (Playwright's own
# --shard), two workers on each machine. They run inside Playwright's own image,
# which has the browsers and their system libraries in it. Until Nov 8 2026 one machine
# ran all three on two workers and installed the browsers every time: a run took 44 to
# 60 minutes against a 60-minute cap, and on Nov 6 the browser install alone took 40
# minutes on a slow package mirror. Until Nov 22 2026 (builder item 419) each device had
# one machine: the phone took 46 to 69 minutes, and a release waited 52 to 75 for it.
# Four workers a machine was tried and measured slower on the phone's WebKit than two
# (playwright.config.ts says the numbers), so the parts carry the gain.
#
# On pull requests and on main, the tablet runs only what a tablet adds: the tests
# tagged @touch and @layout. The nightly run tests the tablet in full, with the desktop
# and the phone, and GitHub emails a failed nightly run like any failed scheduled one.
#
# To make this a REQUIRED gate: Settings → Branches → protect `main` and add
# "browser" as a required status check: the last job below, not a device. Leave
# "Require branches to be up to date" off, or every merge sends each open pull
# request back through the full suite. deploy.yml waits for this same check on the
# commit it deploys.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Builder item 419: every night at 3:23 am Pacific (11:23 UTC), main in full on all three
  # devices, the tablet's whole suite included.
  schedule:
    - cron: "23 11 * * *"

# A pull request pushed again stops its older run, so the machines go to the newest
# push. On Nov 11 2026 older pushes of the same branches kept running beside the new
# ones, and main's runs and their `browser` job waited behind them until deploys gave
# up. A push to main or a manual run gets a group of its own (its run id), so it is
# never cancelled or held: deploy.yml waits for the run on its exact commit.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      # Depth 2 gives the next step something to compare with: a pull request is
      # checked out as GitHub's trial merge, whose first parent is the base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      # Run unless every changed file is one the suite cannot reach. The test server
      # publishes the whole repo root and marketing.spec.ts runs build-public.sh, so
      # this names what to skip, not what to run: a new folder or file type gets tested
      # until someone shows it can't matter. A spec can still reach under a skipped path,
      # by importing a file or reading one; tests/workflows/e2e_scope_test.mjs fails when
      # one does, and the fix is a line like the first in this `case`.
      #
      # If this job fails, the devices are skipped, and GitHub counts a skipped job as
      # a pass. That's why the check to require is `browser` below, which always runs
      # and reads how this job ended.
      - name: Decide whether the browser suite needs to run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ "$EVENT" = push ] && git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; then
            base=$BEFORE
          else
            # A manual run, the nightly run, a new branch (BEFORE is all zeros), or a force push whose old commit is gone.
            base=
          fi
          changed=
          if [ -n "$base" ]; then
            # --no-renames lists both sides of a move: a page moved into docs/ has left the site.
            changed=$(git -c core.quotepath=off diff --name-only --no-renames "$base" HEAD) || changed=
          fi

          run=false
          while IFS= read -r file; do
            case "$file" in
              # member-roles.spec.ts imports this, so a change here changes what the specs expect.
              supabase/functions/presence/lib/site_roles.ts) run=true ;;
              # site-send.spec.ts drives the script this one puts on client sites.
              supabase/functions/presence/lib/site_send.ts) run=true ;;
              # ad-tags.spec.ts runs the cookie notice and its loader (list item 152).
              supabase/functions/presence/lib/ad_tags.ts) run=true ;;
              # button-presses.spec.ts runs the visit counter's own script (list item 157).
              supabase/functions/presence/lib/visits.ts) run=true ;;
              # builder-page-settings.spec.ts opens a sealed password page with this (builder items 48 and 120).
              supabase/functions/presence/lib/page_gate.ts) run=true ;;
              # builder-header-footer.spec.ts scrolls a page drawn with this (builder items 50 and 123).
              supabase/functions/presence/lib/site_header.ts) run=true ;;
              # builder-phone-bar.spec.ts opens a page drawn with this on a phone (builder item 122).
              supabase/functions/presence/lib/phone_bar.ts) run=true ;;
              # dev-html-clean.spec.ts hands this cleaner's result to a real browser (builder item 190).
              supabase/functions/presence/lib/dev_html.ts) run=true ;;
              # notes-159.spec.ts draws the shared draft's feedback panel with this (builder item 159).
              supabase/functions/presence/lib/feedback_panel.ts) run=true ;;
              # editor-comforts-158.spec.ts scrolls a page drawn with this (builder item 158).
              supabase/functions/presence/lib/site_motion.ts) run=true ;;
              # button-sets-217.spec.ts draws a page's buttons and boxes with this (builder item 217).
              supabase/functions/presence/lib/site_buttons.ts) run=true ;;
              # new-site-gallery-198.spec.ts imports the gallery's kinds and designs from this (builder item 198).
              supabase/functions/presence/lib/design_gallery.ts) run=true ;;
              # published-sites-nov-22.spec.ts presses the phone menu, the zoom view and the carousel drawn with these (builder items 288, 294, 298).
              supabase/functions/presence/lib/site_shell.ts) run=true ;;
              supabase/functions/presence/lib/site_block_scripts.ts) run=true ;;
              supabase/functions/presence/lib/site_nav.ts) run=true ;;
              docs/*|supabase/*|runbooks/*|sql/*|templates/*) ;;
              tests/isolation/*|tests/presence/*|tests/smoke/*|tests/workflows/*) ;;
              .github/workflows/ci.yml|.github/workflows/deploy.yml|.github/workflows/rollback.yml|.github/workflows/schema-dump.yml) ;;
              # Any other folder runs. Root-level .md and .sql don't, but one inside an asset
              # folder would reach dist/ and trip build-public.sh, which a spec runs.
              */*) run=true ;;
              *.md|*.sql) ;;
              # Everything else, including an empty list: nothing proves the suite can be skipped.
              *) run=true ;;
            esac
          done <<< "$changed"

          # A count, not the names: a line of stdout can be read as a workflow command.
          echo "Compared with ${base:-nothing}: $(printf '%s' "$changed" | grep -c '') changed files. Run the suite: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            verdict="The browser suite is running."
          else
            verdict="The browser suite did not run: no changed file can affect it. This green means skipped, not passed."
            echo "::notice title=Browser suite skipped::$verdict"
          fi
          {
            echo "$verdict"
            echo
            echo "Changed files, first 50:"
            echo '```'
            printf '%s\n' "${changed:-(nothing to compare)}" | head -n 50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Eight machines at once: each device split into parts by Playwright's --shard, which
  # gives each part an equal share of the tests in file order (measured on main's run of
  # Nov 22 2026, 15:32 UTC: the phone's three parts held 29 to 31 minutes of test time each,
  # the tablet's full suite 37 to 39, the desktop's two parts 27 and 32).
  devices:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: browser on ${{ matrix.project }} (${{ matrix.shard }} of ${{ matrix.shards }})
    runs-on: ubuntu-latest
    # One part takes about 10 to 15 minutes. A run that hits this cap is cancelled with
    # no test summary at all, so it stays well under the 80 minutes deploy.yml waits for
    # the check. Until item 419 one machine ran a whole device: the full tablet took up to
    # 67 minutes against a 75-minute cap.
    timeout-minutes: 40
    # Playwright's image for the exact version in package-lock.json: the browsers and
    # their system libraries are already in it, so nothing is downloaded or installed
    # per run. Move it with Playwright; tests/workflows/e2e_scope_test.mjs checks that
    # the two agree.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      # A failure on one machine doesn't stop the others, so each run names all of its own.
      fail-fast: false
      matrix:
        include:
          # The longest parts first: when GitHub's machines are busy, a matrix starts in this order.
          - { project: mobile, shard: 1, shards: 3 }
          - { project: mobile, shard: 2, shards: 3 }
          - { project: mobile, shard: 3, shards: 3 }
          - { project: desktop-chromium, shard: 1, shards: 2 }
          - { project: desktop-chromium, shard: 2, shards: 2 }
          - { project: tablet, shard: 1, shards: 3 }
          - { project: tablet, shard: 2, shards: 3 }
          - { project: tablet, shard: 3, shards: 3 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      # npm ci installs exactly what package-lock.json says. Plain `npm install`
      # took whatever npm called latest that minute, so Playwright's 1.65.0 release
      # broke every install for an hour on Nov 5 2026 (it reached npm in pieces).
      # To move Playwright: change @playwright/test and playwright-core together in
      # package.json, run `npm install`, commit the lockfile, change the image above
      # to the same version, and let this check prove it.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # On a pull request and on main the tablet runs only what a tablet adds, the tests
      # tagged @touch and @layout. Every other test already ran on the desktop and the
      # phone, and the iPad's touch quirks made most of the flaky failures. The nightly run
      # and a manual run test the tablet in full. deploy.yml waits for the run on the commit
      # it releases, so main's release waits for the touch and layout tests, not the rest.
      - name: Run the browser suite on this device
        env:
          PROJECT: ${{ matrix.project }}
          EVENT: ${{ github.event_name }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          if [ "$PROJECT" = tablet ] && { [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; }; then
            npx playwright test --project=tablet --grep "@touch|@layout" --shard="$SHARD"
          else
            npx playwright test --project="$PROJECT" --shard="$SHARD"
          fi
      # A test that fails and then passes on its retry leaves the run green, so its
      # name would sit in a log nobody opens. This puts it on the run's summary page.
      - name: Name the flaky and failed tests
        if: ${{ !cancelled() }}
        env:
          PART: ${{ matrix.project }}, part ${{ matrix.shard }} of ${{ matrix.shards }}
        run: node scripts/e2e-summary.mjs test-results/results.json "$PART" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: playwright-report/
          retention-days: 14

  # The check to require, and the one deploy.yml waits for. It always runs, so it
  # always reports, and it reads how the other jobs ended instead of trusting a skip:
  # it passes only when every part of every device passed, or when the decision found
  # nothing the suite can reach. GitHub reports a matrix job as one result: success only
  # when every machine in it succeeded.
  browser:
    needs: [scope, devices]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every device passed, or nothing needed testing
        id: verdict
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          DEVICES: ${{ needs.devices.result }}
        run: |
          if [ "$SCOPE" != success ]; then
            echo "::error title=Browser check::The decision didn't finish (it ended $SCOPE), so nothing was tested."
            exit 1
          fi
          if [ "$RUN" = false ]; then
            echo "No changed file can affect the browser suite, so it didn't run. This green means skipped, not passed."
            exit 0
          fi
          if [ "$RUN" != true ]; then
            echo "::error title=Browser check::The decision gave no answer, so nothing was tested."
            exit 1
          fi
          if [ "$DEVICES" != success ]; then
            echo "::error title=Browser check::At least one part of one device didn't pass (the devices ended $DEVICES). Each part's run names its failures."
            exit 1
          fi
          echo "Every part of the desktop, the tablet and the phone passed."
