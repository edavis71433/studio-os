name: E2E (Playwright)

# Browser end-to-end gate (Phase PW). Runs the hermetic Playwright suite —
# real page JS against stubbed Supabase + mocked API fixtures — across
# desktop / tablet / mobile. No secrets, no live backend, fully deterministic.
#
# To make this a REQUIRED gate: Settings → Branches → protect `main` and add
# "e2e / browser" as a required status check.

on:
  push:
    branches: [main, staging]
    paths:
      - "**/*.html"
      - "shell.js"
      - "shell.css"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "shell.js"
      - "shell.css"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    # About 3,500 tests on two workers took 27 to 41 minutes across Oct and Nov
    # 2026. A run that hits this cap is cancelled with no test summary at all.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # npm ci installs exactly what package-lock.json says. Plain `npm install`
      # took whatever npm called latest that minute, so Playwright's 1.65.0 release
      # broke every install for an hour on Nov 5 2026 (it reached npm in pieces).
      # To move Playwright: change @playwright/test and playwright-core together in
      # package.json, run `npm install`, commit the lockfile, let this check prove it.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser E2E
        run: npm run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
