name: Rollback Functions

# Manual, confirmation-gated rollback. The edge functions are STATELESS, so
# rolling back = redeploying a known-good git ref. Production requires a typed
# confirmation phrase. This never touches the database — MIGRATION rollback is
# intentionally manual (apply the target migration's `-- rollback:` inverse via
# the hold-back technique; see docs/presence/DEPLOYMENT-AND-OPERATIONS.md).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (commit SHA or tag, e.g. v1.0.0-rc1) to redeploy — the known-good version"
        required: true
      environment:
        description: "staging or production"
        required: true
        default: staging
      confirm:
        description: "Type rollback-production to roll back PRODUCTION (ignored for staging)"
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation gate (production only)
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ] && [ "${{ github.event.inputs.confirm }}" != "rollback-production" ]; then
            echo "Production rollback requires the confirmation phrase 'rollback-production'. Aborting."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Resolve target project
        id: target
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "ref=${{ secrets.SUPABASE_PROJECT_REF_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ secrets.SUPABASE_PROJECT_REF_STAGING }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy functions at the target ref (stateless rollback)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in clever-api stripe-webhook presence; do
            echo "== redeploying $fn @ ${{ github.event.inputs.ref }} =="
            npx --yes supabase functions deploy "$fn" --no-verify-jwt --project-ref ${{ steps.target.outputs.ref }}
          done

      - name: Smoke test the rolled-back deployment
        run: |
          base="https://${{ steps.target.outputs.ref }}.supabase.co/functions/v1"
          sleep 5
          curl -s --fail -X POST "$base/clever-api" -H "Content-Type: application/json" -d '{"type":"version"}' | grep -q '"build"' || { echo "clever-api smoke FAILED"; exit 1; }
          curl -s --fail "$base/presence/commerce/plans" | grep -q -i 'plan' || { echo "presence smoke FAILED"; exit 1; }
          echo "Rollback smoke passed. Note: database migrations were NOT rolled back (manual by design)."
