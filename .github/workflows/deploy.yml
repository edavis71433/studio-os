name: Deploy Edge Functions

# Staging: every push to the `staging` branch deploys both functions to the
# staging Supabase project.
# Production: manual only. Actions tab -> Run workflow -> type
# `deploy-production` into the confirmation box. Deploys from `main`.
#
# Config-only variance: identical commands, different project ref per
# environment (Build Brief section 2.8).

on:
  push:
    branches: [staging]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy-production to deploy main to PRODUCTION"
        required: true

jobs:
  # Pre-deploy quality gate (Ops audit HIGH-3): run the deterministic pure test
  # suites — including the 14 machine-enforced platform invariants — before any
  # deploy. The four integration-only suites (admin/pipeline/room/service) need
  # live staging credentials and are skipped here; every other suite runs its
  # pure tier with no env and must pass. A red gate blocks the deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Run pure test suites + platform invariants
        run: |
          fail=0
          for f in tests/presence/*_test.mjs; do
            b=$(basename "$f")
            case "$b" in
              admin_test.mjs|pipeline_test.mjs|room_test.mjs|service_test.mjs)
                echo "skip (integration-only, needs live env): $b"; continue;;
            esac
            echo "== $b =="
            deno run --allow-read --allow-env "$f" || { echo "FAILED: $b"; fail=1; }
          done
          if [ "$fail" -ne 0 ]; then echo "Pre-deploy test gate FAILED"; exit 1; fi
          echo "Pre-deploy test gate passed."
      - name: Type-check (deno check)
        run: deno check supabase/functions/presence/index.ts supabase/functions/tool-report/index.ts supabase/functions/unlock-report/index.ts supabase/functions/send-lead-alert/index.ts supabase/functions/site-review/index.ts
      - name: Verify migrations (fenced files intact; numbers unique)
        run: |
          for n in 0003 0004 0005; do
            ls supabase/migrations/${n}_*.sql >/dev/null 2>&1 || { echo "fenced migration $n missing — history integrity broken"; exit 1; }
          done
          dupes=$(ls supabase/migrations/[0-9]*.sql | sed -E 's#.*/([0-9]+)_.*#\1#' | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "duplicate migration numbers: $dupes"; exit 1; fi
          echo "migrations verified: fenced 0003-0005 present, numbers unique."

  deploy-staging:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — canonical clever-api file must exist
        run: test -f supabase/functions/clever-api/index.ts || { echo "clever-api/index.ts missing — see docs/runbooks/BYTE-CHECK.md item 1"; exit 1; }

      # verify_jwt=false mirrors production (v247 setting): the function's own
      # fail-closed gate is the auth layer; cron + public site call it bare.
      - name: Deploy clever-api (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy clever-api --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}

      - name: Deploy stripe-webhook (staging, no JWT verification)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy stripe-webhook --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}

      # Presence platform function (A2): the function does its own fail-closed
      # auth, so --no-verify-jwt matches production. The benign "sdk.ts" read WARN
      # does not fail the deploy; the smoke test below is the real gate.
      - name: Deploy presence (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy presence --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}

      # Free Tools (0136): public report read + unlock, and the internal lead
      # alert. Each does its own gating (send-lead-alert checks the service key),
      # so --no-verify-jwt matches the other public functions.
      - name: Deploy tool-report (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy tool-report --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}

      - name: Deploy unlock-report (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy unlock-report --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}

      - name: Deploy send-lead-alert (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy send-lead-alert --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}

      - name: Deploy site-review (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy site-review --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}

      - name: Smoke test — clever-api version handshake
        run: |
          sleep 5
          curl -s --fail -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF_STAGING }}.supabase.co/functions/v1/clever-api" \
            -H "Content-Type: application/json" \
            -d '{"type":"version"}' | tee /tmp/version.json
          grep -q '"build"' /tmp/version.json

      - name: Smoke test — presence catalog + gated route
        run: |
          base="https://${{ secrets.SUPABASE_PROJECT_REF_STAGING }}.supabase.co/functions/v1/presence"
          curl -s --fail "$base/commerce/plans" | grep -q -i 'plan' || { echo "presence /commerce/plans smoke FAILED"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/connections")
          [ "$code" = "401" ] || { echo "presence /connections expected 401 (gated), got $code"; exit 1; }
          echo "presence smoke passed (catalog 200, /connections 401 gated)."

      - name: Smoke test — Free Tools functions answer and gate
        run: |
          base="https://${{ secrets.SUPABASE_PROJECT_REF_STAGING }}.supabase.co/functions/v1"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/tool-report?id=00000000-0000-4000-8000-000000000000")
          [ "$code" = "404" ] || { echo "tool-report expected 404 for an unknown id, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$base/send-lead-alert" -H "Content-Type: application/json" -d '{}')
          [ "$code" = "401" ] || { echo "send-lead-alert expected 401 without the service key, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$base/site-review" -H "Content-Type: application/json" -d '{"url":"example.com"}')
          [ "$code" = "403" ] || { echo "site-review expected 403 without a Turnstile token, got $code"; exit 1; }
          echo "Free Tools smoke passed (tool-report 404 on unknown id, send-lead-alert 401 gated, site-review 403 without Turnstile)."

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation gate
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-production" ]; then
            echo "Confirmation phrase not provided. Aborting."; exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production deploys only from main. Aborting."; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Guard — canonical clever-api file must exist
        run: test -f supabase/functions/clever-api/index.ts || { echo "clever-api/index.ts missing — see docs/runbooks/BYTE-CHECK.md item 1"; exit 1; }

      - name: Deploy clever-api (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy clever-api --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy stripe-webhook (PRODUCTION, no JWT verification)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy stripe-webhook --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy presence (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy presence --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      # Free Tools (0136): public report read + unlock, and the internal lead
      # alert. Each does its own gating (send-lead-alert checks the service key),
      # so --no-verify-jwt matches the other public functions.
      - name: Deploy tool-report (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy tool-report --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy unlock-report (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy unlock-report --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy send-lead-alert (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy send-lead-alert --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy site-review (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy site-review --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Smoke test — clever-api version handshake
        run: |
          sleep 5
          curl -s --fail -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF_PROD }}.supabase.co/functions/v1/clever-api" \
            -H "Content-Type: application/json" \
            -d '{"type":"version"}' | tee /tmp/version.json
          grep -q '"build"' /tmp/version.json

      - name: Smoke test — presence catalog + gated route
        run: |
          base="https://${{ secrets.SUPABASE_PROJECT_REF_PROD }}.supabase.co/functions/v1/presence"
          curl -s --fail "$base/commerce/plans" | grep -q -i 'plan' || { echo "presence /commerce/plans smoke FAILED"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/connections")
          [ "$code" = "401" ] || { echo "presence /connections expected 401 (gated), got $code"; exit 1; }
          echo "presence smoke passed (catalog 200, /connections 401 gated)."

      - name: Smoke test — Free Tools functions answer and gate
        run: |
          base="https://${{ secrets.SUPABASE_PROJECT_REF_PROD }}.supabase.co/functions/v1"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/tool-report?id=00000000-0000-4000-8000-000000000000")
          [ "$code" = "404" ] || { echo "tool-report expected 404 for an unknown id, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$base/send-lead-alert" -H "Content-Type: application/json" -d '{}')
          [ "$code" = "401" ] || { echo "send-lead-alert expected 401 without the service key, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$base/site-review" -H "Content-Type: application/json" -d '{"url":"example.com"}')
          [ "$code" = "403" ] || { echo "site-review expected 403 without a Turnstile token, got $code"; exit 1; }
          echo "Free Tools smoke passed (tool-report 404 on unknown id, send-lead-alert 401 gated, site-review 403 without Turnstile)."
