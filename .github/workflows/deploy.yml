name: Deploy Edge Functions

# Production only (item 112, Nov 9 2026: the staging jobs went; the repository
# has never had a staging project, so they could never run). Manual only. Actions tab -> Run workflow -> type
# `deploy-production` into the confirmation box. Deploys from `main`, and only a
# commit that passed the same checks as every pull request (ci.yml, run again here)
# and the browser check (e2e.yml's `browser`, which this waits for).
#
# Config-only variance: identical commands, different project ref per
# environment (Build Brief section 2.8).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy-production to deploy main to PRODUCTION"
        required: true

env:
  # Pinned, not latest: CLI 3.0.0 (2026-11-02) refuses to deploy without a
  # confirmation a CI run can't give (HostedMutationConsentRequiredError).
  # 2.122.0 was the latest when production last deployed. Upgrade on purpose,
  # in deploy.yml, rollback.yml and schema-dump.yml.
  SUPABASE_CLI_VERSION: "2.122.0"

# One at a time (Nov 9 2026). Two dispatches used to run side by side, and the older one
# could land last: sessions agreed an order by message three times, and two once ran on the
# same commit. A production deploy or rollback now waits for the one before it. GitHub keeps
# one waiting run per group, so a newer dispatch replaces a waiting one; every run ships the
# commit main was at when it was dispatched, so the newer carries the older's code. A run
# cancelled while it waited was replaced: don't rerun it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The pre-deploy gate is ci.yml itself: the same typecheck of every function, the
  # same test sweep and the same Deno as every pull request, so the two can't drift.
  # Until Nov 8 2026 this was a second copy with its own test loop (which hid which
  # check failed), a typecheck that left out two functions, and whichever Deno 2 was
  # newest that day. A red gate blocks the deploy.
  test:
    uses: ./.github/workflows/ci.yml

  # Production only: wait for the browser check (e2e.yml's `browser` job) on the exact
  # commit being deployed, and stop unless it passed. On Nov 8 2026 production was
  # deployed four times from commits whose browser check was cancelled or still
  # running. A green that skipped the suite, because nothing it can reach changed, counts.
  # Not named `browser`: GitHub matches a required check by name alone.
  browser-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The browser check takes about 20 minutes; this leaves room for one that starts late.
    timeout-minutes: 90
    permissions:
      checks: read
    steps:
      - name: Wait for the browser check on this commit
        id: browser-gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          poll="${POLL_SECONDS:-30}"
          start_by=$(( $(date +%s) + ${START_MINUTES:-15} * 60 ))
          give_up=$(( $(date +%s) + ${WAIT_MINUTES:-80} * 60 ))
          while :; do
            # The newest `browser` check from GitHub Actions on this commit, as "status conclusion".
            # That job starts only once every device has finished, about 25 minutes in, so until
            # then a device job ("browser on mobile" and the others) shows the check is under way:
            # "devices". Empty when neither has started yet.
            state=$(gh api "repos/$REPO/commits/$SHA/check-runs?filter=latest&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | ([.[] | select(.name == "browser")] | sort_by(.started_at) | last) as $v | if $v != null then "\($v.status) \($v.conclusion // "")" elif any(.[]; .name | startswith("browser on ")) then "devices" else empty end') || state=unreadable
            case "$state" in
              "completed success")
                echo "The browser check passed on this commit."
                exit 0 ;;
              completed*)
                echo "::error title=Browser check::The browser check on this commit ended ${state#completed }, so nothing was deployed. Fix it or re-run it, then run the deploy again."
                exit 1 ;;
              devices)
                echo "The browser check is running on its devices; waiting for it." ;;
              "")
                if [ "$(date +%s)" -ge "$start_by" ]; then
                  echo "::error title=Browser check::No browser check started on this commit, so nothing was deployed. Production goes out only from a commit that passed it."
                  exit 1
                fi
                echo "The browser check hasn't started on this commit yet." ;;
              unreadable)
                echo "Couldn't read the checks just now; trying again." ;;
              *)
                echo "The browser check is ${state% *}; waiting for it." ;;
            esac
            if [ "$(date +%s)" -ge "$give_up" ]; then
              echo "::error title=Browser check::The browser check hadn't passed after ${WAIT_MINUTES:-80} minutes, so nothing was deployed. Run the deploy again once it has."
              exit 1
            fi
            sleep "$poll"
          done

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, browser-gate]
    runs-on: ubuntu-latest
    steps:
      # The typed phrase and the branch arrive as data, never pasted into the script.
      - name: Confirmation gate
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM" != "deploy-production" ]; then
            echo "Confirmation phrase not provided. Aborting."; exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Production deploys only from main. Aborting."; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Guard — canonical clever-api file must exist
        run: test -f supabase/functions/clever-api/index.ts || { echo "clever-api/index.ts missing — see docs/runbooks/BYTE-CHECK.md item 1"; exit 1; }

      - name: Deploy clever-api (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy clever-api --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy stripe-webhook (PRODUCTION, no JWT verification)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy stripe-webhook --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy presence (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy presence --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      # Free Tools (0136): public report read + unlock, and the internal lead
      # alert. Each does its own gating (send-lead-alert checks the service key),
      # so --no-verify-jwt matches the other public functions.
      - name: Deploy tool-report (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy tool-report --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy unlock-report (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy unlock-report --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy send-lead-alert (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy send-lead-alert --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy site-review (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy site-review --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Deploy ai-visibility (PRODUCTION)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" functions deploy ai-visibility --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Smoke test — clever-api version handshake
        run: |
          sleep 5
          curl -s --fail -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF_PROD }}.supabase.co/functions/v1/clever-api" \
            -H "Content-Type: application/json" \
            -d '{"type":"version"}' | tee /tmp/version.json
          grep -q '"build"' /tmp/version.json

      - name: Smoke test — presence catalog + gated route
        run: |
          base="https://${{ secrets.SUPABASE_PROJECT_REF_PROD }}.supabase.co/functions/v1/presence"
          curl -s --fail "$base/commerce/plans" | grep -q -i 'plan' || { echo "presence /commerce/plans smoke FAILED"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/connections")
          [ "$code" = "401" ] || { echo "presence /connections expected 401 (gated), got $code"; exit 1; }
          # /system loads its route file on first use (lib/lazy.ts), so this also proves the bundle carries those files
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/system/health")
          [ "$code" = "403" ] || { echo "presence /system/health expected 403 (no secret), got $code"; exit 1; }
          echo "presence smoke passed (catalog 200, /connections 401 gated, /system/health 403 without the secret)."

      - name: Smoke test — Free Tools functions answer and gate
        run: |
          base="https://${{ secrets.SUPABASE_PROJECT_REF_PROD }}.supabase.co/functions/v1"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/tool-report?id=00000000-0000-4000-8000-000000000000")
          [ "$code" = "404" ] || { echo "tool-report expected 404 for an unknown id, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$base/send-lead-alert" -H "Content-Type: application/json" -d '{}')
          [ "$code" = "401" ] || { echo "send-lead-alert expected 401 without the service key, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$base/site-review" -H "Content-Type: application/json" -d '{"url":"example.com"}')
          [ "$code" = "403" ] || { echo "site-review expected 403 without a Turnstile token, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$base/ai-visibility" -H "Content-Type: application/json" -d '{"business_name":"Smoke Test","city":"Burbank"}')
          [ "$code" = "403" ] || { echo "ai-visibility expected 403 without a Turnstile token, got $code"; exit 1; }
          echo "Free Tools smoke passed (tool-report 404, send-lead-alert 401, site-review and ai-visibility 403 without Turnstile)."

      # The static site deploys from Netlify on every push, on its own clock.
      # Rule of thumb when a page needs a new function field: ship the function
      # (this workflow) first, the page second. This step checks the pages a
      # visitor actually loads are up and still carry what the scan needs.
      - name: Smoke test — Free Tools pages on the static host
        run: |
          curl -s --fail https://tools.davisdigitalstudio.com/site-review | grep -q 'challenges.cloudflare.com/turnstile' || { echo "site-review page smoke FAILED (no Turnstile script)"; exit 1; }
          curl -s --fail https://tools.davisdigitalstudio.com/ai-visibility | grep -q 'id="srForm"' || { echo "ai-visibility page smoke FAILED (no form)"; exit 1; }
          curl -s --fail https://tools.davisdigitalstudio.com/report/00000000-0000-4000-8000-000000000000 | grep -q 'id="trReport"' || { echo "report page smoke FAILED"; exit 1; }
          echo "Free Tools pages smoke passed (site-review, ai-visibility, report shell)."
