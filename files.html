<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Files — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Every file for your business — photos, brand, documents, downloads — in one calm place.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically) — same aliasing pattern
     as customers.html / crm.html / inbox.html. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--danger:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 90px}
  /* minmax(0,1fr): the wide table must scroll INSIDE .tscroll, never blow the
     column (and the .lhead row) open past the viewport */
  .layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px}
  @media (max-width:720px){.layout{grid-template-columns:minmax(0,1fr);gap:16px}}

  /* collections rail */
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:64px;align-self:start}
  @media (max-width:720px){.rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch}}
  .col{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--soft);text-decoration:none;font-size:14.5px;font-weight:500;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:none;text-align:left;width:100%;font-family:inherit}
  .col:hover{background:var(--p-soft);color:var(--ink)}
  .col.on{background:var(--p-soft);color:var(--p);border-color:var(--line);font-weight:600}
  .col .ic{width:17px;height:17px;flex:none;opacity:.85}
  .col .n{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .col.on .n{color:var(--p)}

  /* toolbar */
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:14.5px;font-family:inherit}
  .search input:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  .search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--faint)}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--p)}
  .btn.primary{background:var(--p);color:#fff;border-color:var(--p)}
  .btn.primary:hover{filter:brightness(1.06)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* ── list-view header (SLDS list-view anatomy, dds skin) — the same .lhead/
        .lrow1/.obj-ic/.lbtn/.lmeta treatment as customers.html / leads.html ── */
  .lhead{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 10px;margin-bottom:14px}
  .lrow1{display:flex;align-items:center;gap:10px}
  .obj-ic{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .lhead h1{font-family:var(--serif);font-weight:500;font-size:20px;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:8px;padding:5px 8px;cursor:pointer}
  .lbtn:hover{color:var(--p);background:var(--p-soft)}
  .lmeta{margin-top:6px;font-size:12px;color:var(--faint)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
  .seg button{border:none;border-radius:0;padding:6px 12px;font-size:12.5px;background:transparent;color:var(--soft);font-family:inherit;font-weight:600;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--p-soft);color:var(--p)}
  .notice{font-size:12.5px;color:var(--faint);margin:-6px 0 12px}

  /* ── the table view (customers.html .tscroll anatomy): sortable columns; the
        table scrolls in its OWN container — the page never overflows sideways ── */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .tscroll table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  .tscroll thead th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
  .tscroll thead th .thb{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:none;padding:11px 14px;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:5px}
  .tscroll thead th .thb:hover{color:var(--p)}
  .tscroll thead th .arrow{font-size:10px;color:var(--p)}
  .tscroll tbody tr{cursor:pointer}
  .tscroll tbody tr:hover{background:var(--p-soft)}
  .tscroll tbody tr:focus-visible{outline:2px solid var(--p);outline-offset:-2px}
  .tscroll tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tscroll tbody tr:last-child td{border-bottom:none}
  .tscroll td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .tscroll th.ck,.tscroll td.ck{width:34px;padding:11px 6px 11px 12px}
  .ncell{display:flex;align-items:center;gap:10px;min-width:0}
  .ncell .nm2{font-weight:600}
  .mthumb{width:34px;height:26px;border-radius:6px;background:var(--p-soft) center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);flex:0 0 auto}
  .mthumb svg{width:15px;height:15px;opacity:.7}
  .tscroll .use{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .fromclient{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--good-soft);color:var(--good);border-radius:999px;padding:2px 7px;margin-left:6px;white-space:nowrap;display:inline-block}

  /* health nudge */
  .nudge{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 15px;font-size:13.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center;border:1px solid transparent}
  .nudge b{font-weight:700}
  .nudge button{margin-left:auto;background:none;border:none;color:var(--warn);font-weight:700;cursor:pointer;font-size:13px;font-family:inherit;text-decoration:underline}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;font-family:inherit;color:inherit;position:relative;transition:border-color .12s}
  .tile:hover{border-color:var(--p)}
  .tile .thumb{aspect-ratio:4/3;background:var(--p-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--faint)}
  .tile .thumb svg{width:34px;height:34px;opacity:.6}
  .tile .meta{padding:10px 12px 12px}
  .tile .nm{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .use{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .dot.live{background:var(--good)} .dot.used{background:var(--p)} .dot.un{background:var(--faint)}
  .star{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.86);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--warn)}
  /* overlay chips follow the EFFECTIVE theme (data-theme wins over the OS scheme) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .star{background:rgba(31,26,43,.82)}}
  :root[data-theme="dark"] .star{background:rgba(31,26,43,.82)}
  .star svg{width:15px;height:15px}
  .badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--good-soft);color:var(--good)}
  .badge.doc{background:var(--p-soft);color:var(--p)}
  .badge.pend{background:var(--warn-soft);color:var(--warn)}
  .sbadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin:4px 0}
  .sbadge.live{background:var(--good-soft);color:var(--good)} .sbadge.pending{background:var(--warn-soft);color:var(--warn)} .sbadge.approved{background:var(--p-soft);color:var(--p)} .sbadge.draft,.sbadge.archived{background:var(--line);color:var(--soft)}
  .amuted{font-size:12.5px;color:var(--faint);margin-top:4px}

  /* multi-select */
  .tile.sel{border-color:var(--p);box-shadow:0 0 0 2px var(--p) inset,var(--shadow)}
  .check{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.9);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--p);z-index:2}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .check{background:rgba(31,26,43,.86)}}
  :root[data-theme="dark"] .check{background:rgba(31,26,43,.86)}
  .tile.sel .check{background:var(--p);border-color:var(--p);color:#fff}
  .check svg{width:15px;height:15px}
  .bulkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--p-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
  .bulkbar .cnt{font-weight:700;color:var(--p);font-size:14px}
  .bulkbar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .bulkbar .btn{padding:7px 12px;font-size:13px}
  /* social sizes */
  .social{margin:14px 0}
  .social .hl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:8px}
  .social .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .social figure{margin:0;text-align:center}
  .social .box{background:var(--p-soft);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
  .social .box img{width:100%;height:100%;object-fit:cover;display:block}
  .social figcaption{font-size:10.5px;color:var(--faint);line-height:1.25}
  .social .ogbtn{margin-top:10px;width:100%}
  /* G31: branded cards */
  .social .cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .social .cardgrid figure{margin:0;text-align:center}
  .social .cardbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--p-soft)}
  .social .cardbox svg{display:block}
  .social .cardgrid figcaption{font-size:10.5px;color:var(--faint);line-height:1.25;margin:4px 0}
  .social .cdl{width:100%;padding:6px 8px;font-size:12px;justify-content:center}
  .empty{text-align:center;padding:60px 20px;color:var(--soft)}
  .empty h2{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--ink);margin-bottom:8px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
  @keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin,.panel{animation:none}}

  /* detail slide-over */
  .scrim{position:fixed;inset:0;background:rgba(27,21,37,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:41;overflow-y:auto;padding:20px 22px 60px}
  @media (max-width:760px){.panel{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}}  /* keep the last controls clear of the shell's bottom bar */
  .panel.on{transform:translateX(0)}
  .panel .x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:22px;color:var(--soft);cursor:pointer;line-height:1}
  .pv{border-radius:12px;overflow:hidden;background:var(--p-soft);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;margin:14px 0 16px}
  .pv img{width:100%;height:100%;object-fit:contain}
  .pv svg{width:48px;height:48px;color:var(--faint)}
  .field{margin:14px 0}
  .field label{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:5px}
  .field input,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:14px;font-family:inherit}
  .field textarea{resize:vertical;min-height:52px}
  .field input:focus,.field textarea:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  .where{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:14px 0}
  .where .hl{font-size:14px;font-weight:600;margin-bottom:8px}
  .where ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .where li{font-size:13.5px;color:var(--soft);display:flex;align-items:center;gap:8px}
  .where li .dot{width:7px;height:7px}
  .where li a.ulink{color:var(--soft);text-decoration:none} .where li a.ulink:hover{color:var(--p);text-decoration:underline}
  .vrow{background:var(--warn-soft);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--warn);margin:12px 0;display:flex;align-items:center;gap:8px}
  .vrow button{margin-left:auto}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .acts .btn{padding:8px 12px;font-size:13px}
  .btn.warn{color:var(--danger);border-color:transparent;background:none;padding-left:4px}
  .btn.warn:hover{text-decoration:underline;border-color:transparent}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:12px;background:var(--p-soft);color:var(--p);padding:3px 9px;border-radius:999px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:50}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .drop{border:2px dashed var(--p);border-radius:14px;background:var(--p-soft);color:var(--p);text-align:center;padding:22px;margin-bottom:16px;font-weight:600;display:none}
  .drop.on{display:block}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>

  <div id="root"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>Studio OS · Files — your business library, safely organized.</footer>
</div>

// collections: label, icon, and the server filter it maps to (all reuse /assets)
const COLS=[
  {key:'all',label:'All files',ic:'all',f:{}},
  {key:'fav',label:'Favorites',ic:'star',f:{},favs:true},
  {key:'photos',label:'Photos',ic:'photo',f:{},kind:'image'},

const TCOLS=[
  ['name','Name',(a)=>String(a.name||'').toLowerCase()],

// ── rail counts: named collections come from /assets/collections; kind/favorite/
//    brand and the archive remainder derive from the last UNFILTERED, unsearched
//    /assets read (the All-files view is exactly that read). undefined = unknown
//    → that rail row renders count-less rather than guessing. ──
let RAILN={};
function deriveRailCounts(rows,total){
  RAILN.all=rows.length;
  RAILN.fav=rows.filter(r=>r.favorite).length;
  RAILN.photos=rows.filter(r=>r.kind==='image').length;
  RAILN.documents=rows.filter(r=>r.kind==='document').length;
  RAILN.brand=rows.filter(r=>r.brand).length;
  // /assets `total` counts every non-deleted row INCLUDING archived; the list
  // excludes archived — the difference is the Archive count. Exact only while
  // the library fits the read limit; beyond that stay honest and omit it.
  RAILN.archive=(typeof total==='number'&&rows.length<300&&total>=rows.length)?(total-rows.length):undefined;
}
function railN(key){
  // counts render ONLY once a collections read has SUCCEEDED (countsOk) — unknown
  // never paints as 0, and a good read shows real counts even on the trouble
  // screen (load() absorbs collections there for exactly this)
  if(key==='templates')return S.countsOk?(S.counts.Templates||0):undefined;
  if(key==='downloads')return S.countsOk?(S.counts.Downloads||0):undefined;
  if(key==='stock')return undefined;   // a browse surface, not a collection
  return RAILN[key];
}

      return b; };
    const cancel=mk('Cancel',false); const ok=mk(okLabel||'OK',true);

async function loadContext(){
  // PERF: reuse the shell's /portal/context (window.ddsContext) — fall back to our own read.
  const c=await (window.ddsContext?window.ddsContext().then((d)=>({ok:true,body:{data:d}})):Promise.reject()).catch(()=>api('/portal/context'));
  if(c.ok&&c.body.data){
    S.caps=c.body.data.capabilities||[];
    // A watch-plan (monitor) site observes — uploads are off, so never show an
    // Add button whose every use the server would refuse.
    S.canEdit=S.caps.includes('edit')&&c.body.data.edition!=='monitor';
  }
}
function qstr(){
  const c=COLS.find(x=>x.key===S.col)||COLS[0];
  const p=new URLSearchParams();
  Object.entries(c.f).forEach(([k,v])=>p.set(k,v));
  if(S.q.trim())p.set('q',S.q.trim());
  p.set('limit','300');
  return p.toString();
}
// soft=true (the ↻ refresh): any failure keeps the current list and toasts —
// leads.html's soft-fail contract; the in-place trouble state is for hard loads.
async function load(soft){
  // FD-T10: stock has its own surface. Entering it BUMPS the generation too, so an
  // in-flight roster read can never paint over stock; a leftover 'loading' state is
  // an orphan (its request was invalidated by that bump) — re-fetch, don't hang.
  if(S.col==='stock'){ REQ_SEQ++; if(S.stockState==null||S.stockState==='loading') return loadStock(); return renderStock(); }
  const gen=++REQ_SEQ;
  let a,col,h;
  try{[a,col,h]=await Promise.all([api('/assets?'+qstr()),api('/assets/collections'),api('/assets/health')]);}
  catch(_){a={ok:false,status:0,body:{}};col={ok:false};h={ok:false};}
  if(gen!==REQ_SEQ)return;   // a newer request started — this response is stale, never paint it
  if(!a.ok){
    if(soft&&S.loadedOnce){toast('Couldn’t refresh just now.');return;}
    // absorb a successful collections read even here — the trouble surface's
    // rail shows real counts when it can, count-less when it can't
    if(col&&col.ok){S.countsOk=true;S.counts=buildCounts(col.body.data||[]);}
    renderTrouble(a);return;
  }
  const full=(a.body.data&&a.body.data.assets)||[];
  let rows=full;
  const c=COLS.find(x=>x.key===S.col);
  if(c&&c.kind)rows=rows.filter(r=>r.kind===c.kind);
  if(c&&c.favs)rows=rows.filter(r=>r.favorite);
  S.policy=(a.body.data&&a.body.data.policy)||'immediate';
  if(S.col==='all'&&!S.q.trim())deriveRailCounts(full,a.body.data&&a.body.data.total);
  S.assets=rows;
  // any read that changes the row set prunes selections that are no longer
  // visible — bulk actions only ever act on rows the user can SEE, and the
  // bulkbar count always equals the visible checked rows
  {const keep=new Set(rows.map(r=>r.id));S.selected=new Set([...S.selected].filter(id=>keep.has(id)));}
  S.health=(h.ok&&h.body.data&&h.body.data.findings)||[];   // health is a nudge — its failure just means no nudge
  S.countsOk=!!col.ok;   // collections failure degrades the rail count-less, with a notice — never fake zeros
  S.counts=buildCounts((col.ok&&col.body.data)||[]);
  S.loadedOnce=true;LOADED_AT=Date.now();
  render();
}
// FAILED read = an honest couldn't-load with Try-again wired to load() in place —
// never an empty state. The rail stays. 403 keeps its own distinct message.
function renderTrouble(a){
  const inner=a.status===403
    ?`<div class="empty"><h2>${/plan|includ/i.test((a.body&&a.body.message)||"")?"Not part of your plan yet.":"Files live in your full workspace."}</h2><p>${esc((a.body&&a.body.message)||"")||"Your client view shows what you’ve chosen to share."}</p></div>`
    :`<div class="empty"><h2>We couldn’t load your files just now.</h2><p>A brief hiccup — it usually passes.</p><p style="margin-top:16px"><button class="btn primary" id="retry">Try again</button></p></div>`;
  $('root').innerHTML=`<div class="layout"><nav class="rail" id="rail" aria-label="Collections">${railHtml()}</nav><div>
    <header class="lhead"><div class="lrow1"><span class="obj-ic" aria-hidden="true">🗂</span><h1 id="pagehead" tabindex="-1">Files</h1><button class="lbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">↻</button></div>
    <div class="lmeta">Couldn’t load just now</div></header>${inner}</div></div>`;
  document.querySelectorAll('#rail .col').forEach(b=>b.addEventListener('click',()=>{S.col=b.dataset.col;S.q='';S.selected.clear();load();}));
  const rt=$('retry');if(rt)rt.addEventListener('click',()=>load());
  const rf=$('refreshBtn');if(rf)rf.addEventListener('click',()=>load());
}
function buildCounts(collections){
  const m={};collections.forEach(c=>{m[c.name]=c.count;});return m;
}

async function loadStock(){
  const gen=++REQ_SEQ;   // the SAME stale-response discipline as load() (C5)
  S.stockState='loading'; renderStock();
  const r=await api('/stock/search?q='+encodeURIComponent(S.stockQ||'')+'&page=1');
  if(gen!==REQ_SEQ||S.col!=='stock')return;   // a newer read started, or the user left stock — never paint over what they moved on to
  if(r.status===503){S.stockState='unavailable';return renderStock();}
  if(r.ok&&r.body.data){S.stockResults=r.body.data.images||[];S.stockProvider=r.body.data.provider||'';S.stockLicense=(r.body.data.license&&r.body.data.license.name)||'';}
  else{S.stockResults=[];}
  S.stockState='ok'; renderStock();
}
async function addStock(id,alt,credit,btn){

  if(r.ok){toast('Added to your Files');if(btn){btn.textContent='Added ✓';}}
  else if(r.status===503){toast('Stock library isn’t enabled yet');if(btn){btn.disabled=false;btn.textContent='Add to my files';}}

}

// A10's studio-side sibling (projects.html): a client upload is marked by the

function isClientUpload(a){
  if(!a)return false;

// One bulk move applied to the current selection, via POST /assets/bulk. Reuses the
// same tag/collection/status logic server-side; here we just gather the input.
async function onBulk(action){
  if(action==='all'){ const all=S.selected.size>=S.assets.length; S.selected=all?new Set():new Set(S.assets.map(a=>a.id)); return render(); }
  const ids=[...S.selected]; if(!ids.length){toast('Select some files first');return;}
  if(action==='download')return bulkDownload(ids);
  const body={action,ids};
  if(action==='tag'){ const tag=await askPrompt('Add a tag','This tag is added to '+ids.length+' file'+(ids.length===1?'':'s')+'.','Add tag','e.g. summer, hero'); if(!tag)return; body.tag=tag; }
  else if(action==='collection'){ const collection=await askPrompt('Move to a collection','Move '+ids.length+' file'+(ids.length===1?'':'s')+' into a collection.','Move','e.g. Brand, Contracts'); if(!collection)return; body.collection=collection; }
  else if(action==='archive'){ if(!(await askConfirm('Archive '+ids.length+' file'+(ids.length===1?'':'s')+'?','Archived files leave your library view but aren’t deleted — you can restore them from Archive.','Archive')))return; }
  const r=await api('/assets/bulk','POST',body);
  if(!r.ok){toast((r.body&&r.body.message)||'Could not apply that');return;}
  const d=r.body.data||{}; const done=d.applied||0; const miss=(d.missing||[]).length;
  const verb=action==='tag'?'Tagged':action==='collection'?'Moved':action==='archive'?'Archived':'Approved';
  toast(done?`${verb} ${done} file${done===1?'':'s'}${miss?` · ${miss} skipped`:''}`:'Nothing changed');

// Bulk Download: one signed URL per file, saved via anchor clicks. Non-destructive,
// so the selection stays. The toast tells the truth about partial failure.
async function bulkDownload(ids){
  let ok=0,fail=0;
  for(const id of ids){
    let r; try{r=await api('/assets/'+id+'/download');}catch(_){r={ok:false};}
    const url=r&&r.ok&&r.body.data&&r.body.data.url;
    if(url){const a=document.createElement('a');a.href=url;a.download='';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();ok++;}
    else fail++;
  }
  toast(fail?(ok?`Downloaded ${ok} · ${fail} failed`:'Downloads failed — try again in a moment'):`Downloaded ${ok} file${ok===1?'':'s'}`);
}

function cardSlug(){const a=S.current&&S.current.asset;return String((a&&a.name)||'card').toLowerCase().replace(/\.[a-z0-9]{2,5}$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'card';}
async function downloadCard(i,btn){
  const c=(S.cards||[])[i]; if(!c)return;

  if(btn){btn.disabled=true;btn.textContent='Preparing…';}
  let svg=c.svg;
  try{svg=await inlineCardImages(c.svg);}catch(_){/* export continues with linked images */}
  try{
    const blob=await cardToPng(svg,c.w,c.h);
    saveBlob(blob,name+'.png');
  }catch(_){

// The card references the photo/logo by signed URL; an SVG rasterized via <img>
// can't load external resources, so inline them as data: URIs before export.
async function inlineCardImages(svg){
  const hrefs=[...new Set(svg.match(/href="https:[^"]*"/g)||[])];
  for(const h of hrefs){
    const url=h.slice(6,-1).replace(/&amp;/g,'&');
    const resp=await fetch(url); if(!resp.ok)throw new Error('image fetch failed');
    const b=await resp.blob();
    const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error('read failed'));fr.readAsDataURL(b);});
    svg=svg.split(h).join('href="'+data+'"');
  }
  return svg;
}
function cardToPng(svg,w,h){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    const img=new Image();
    img.onload=()=>{
      try{
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;   // natural size
        const ctx=cv.getContext('2d'); if(!ctx)throw new Error('no 2d context');
        ctx.drawImage(img,0,0,w,h);
        cv.toBlob((b)=>{URL.revokeObjectURL(url);b?resolve(b):reject(new Error('toBlob blocked'));},'image/png');
      }catch(e){URL.revokeObjectURL(url);reject(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('svg load failed'));};
    img.src=url;
  });
}

// ── G32: background removal — one tap proposes a transparent-background copy.
// The result is an approval-gated draft (the same review step as every AI image):
// Keep stores it as a NEW file beside the original; Discard throws it away. The
// original photo is never touched either way.
async function removeBg(id,btn){
  if(btn){btn.disabled=true;btn.textContent='Removing background…';}
  const r=await api('/assets/'+id+'/remove-background','POST');
  if(btn){btn.disabled=false;btn.textContent='Remove background';}
  if(!S.current||S.current.asset.id!==id)return;   // panel changed while working
  if(!r.ok){
    toast((r.body&&r.body.message)||(r.status===503?'Background removal isn’t switched on yet':'That didn’t come through — your photo is untouched'));
    return;
  }
  const plan=(r.body.data&&r.body.data.plan)||{};
  const vars=plan.variations||[];const v=vars[vars.length-1];
  const slot=$('rbg-slot');
  if(!v||!slot){toast('That didn’t come through — your photo is untouched');return;}
  slot.innerHTML=`<div class="where" style="margin:14px 0">
    <div class="hl">Background removed — a draft to review</div>
    <div style="border-radius:10px;overflow:hidden;background:repeating-conic-gradient(var(--line) 0% 25%,var(--card) 0% 50%) 0 0/18px 18px;margin:8px 0">
      ${v.preview_url?`<img src="${esc(v.preview_url)}" alt="Preview with the background removed" style="width:100%;display:block">`:'<div style="padding:20px;font-size:13px;color:var(--faint)">Preview unavailable — you can still keep or discard it.</div>'}
    </div>
    <div style="font-size:12.5px;color:var(--faint);margin-bottom:8px">Keeping it saves a new file beside the original — the original photo is never changed.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" onclick="rbgDecide('${esc(plan.id)}','${esc(v.id)}','approve')">Keep it</button>
      <button class="btn" onclick="rbgDecide('${esc(plan.id)}','${esc(v.id)}','abandon')">Discard</button>
    </div></div>`;
  slot.scrollIntoView({block:'nearest'});
}
async function rbgDecide(planId,variationId,decision){
  const a=S.current&&S.current.asset;
  const body=decision==='approve'
    ?{decision,variation_id:variationId,alt_text:(((a&&(a.alt_text||a.name))||'Photo').slice(0,180))+' (background removed)'}
    :{decision};
  const r=await api('/visual/plans/'+planId+'/decide','POST',body);
  if(!r.ok){toast((r.body&&r.body.message)||'That didn’t go through — nothing changed');return;}
  const slot=$('rbg-slot');if(slot)slot.innerHTML='';
  if(decision==='approve'){toast('Saved as a new file beside the original');closeDetail();load();}
  else toast('Discarded — nothing was saved');
}
async function setShareImage(id,isOg){
  if(isOg){toast('Already your share image');return;}
  const r=await api('/settings','PUT',{og_media_id:id});
  if(r.ok){toast('Set as your share image — publish to apply');const slot=$('social-slot');if(slot){const b=slot.querySelector('.ogbtn');if(b){b.textContent='✓ This is your share image';b.setAttribute('onclick',`setShareImage('${id}',true)`);}}}
  else toast((r.body&&r.body.message)||'Could not set share image');
}
async function saveDetail(){
  const a=S.current.asset;
  const body={name:$('f-name').value,collection:$('f-col').value,caption:$('f-cap').value,tags:$('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean)};
  const alt=$('f-alt');if(alt)body.alt_text=alt.value;
  const r=await api('/assets/'+a.id,'PATCH',body);
  if(r.ok){toast('Saved');closeDetail();load();}else toast((r.body&&r.body.message)||'Could not save');
}
async function toggleFav(id){
  const a=S.assets.find(x=>x.id===id);const next=!(a&&a.favorite);
  const r=await api('/assets/'+id,'PATCH',{favorite:next});
  if(r.ok){if(a)a.favorite=next;render();}
}
async function setAssetStatus(id,action){
  const r=await api('/assets/'+id+'/status','POST',{action});
  if(r.ok){toast(action==='archive'?'Archived':'Restored');closeDetail();load();}else toast((r.body&&r.body.message)||'Not allowed');
}
async function duplicate(id){const r=await api('/assets/'+id+'/duplicate','POST');if(r.ok){toast('Duplicated');closeDetail();load();}else toast('Could not duplicate');}
async function download(id){const r=await api('/assets/'+id+'/download');if(r.ok&&r.body.data&&r.body.data.url)window.open(r.body.data.url,'_blank','noopener');else toast('Could not prepare download');}
async function rollback(id){if(!(await askConfirm('Restore the previous version?','This puts the earlier file back everywhere it was used.','Restore')))return;const r=await api('/assets/'+id+'/rollback','POST');if(r.ok){toast('Previous version restored'+(r.body.data.requires_publish?' — publish to go live':''));closeDetail();load();}else toast((r.body&&r.body.message)||'Nothing to undo');}
function when(iso){if(!iso)return'';const d=Math.floor((Date.now()-Date.parse(iso))/86400000);if(d<=0)return'today';if(d===1)return'yesterday';if(d<7)return d+' days ago';if(d<60){const w=Math.floor(d/7);return w+(w===1?' week':' weeks')+' ago';}const mo=Math.floor(d/30);return mo+(mo===1?' month':' months')+' ago';}
async function decideFile(id,action){
  if(action==='reject'&&!(await askConfirm('Ask for changes?','This keeps the current version live and sets the proposed replacement aside.','Ask for changes')))return;
  const r=await api('/assets/'+id+'/status','POST',{action});
  if(r.ok){toast(action==='approve'?('Approved'+(r.body.data&&r.body.data.requires_publish?' — publish to go live':'')):'Sent back for changes');closeDetail();load();}
  else toast((r.body&&r.body.message)||'Could not do that');
}
async function del(id,inUse){
  if(inUse){toast('This file is in use — remove it from the page or archive it first.');return;}
  if(!(await askConfirm('Delete this file permanently?','This cannot be undone.','Delete')))return;
  const r=await api('/assets/'+id,'DELETE');
  if(r.ok){toast('Deleted');closeDetail();load();}else toast((r.body&&r.body.message)||'Could not delete');
}

/* ── upload (images + PDF), reuses /media/upload-url ── */
async function dimsOf(file){
  if(!file.type.startsWith('image/'))return{};
  try{const bmp=await createImageBitmap(file);const d={width:bmp.width,height:bmp.height};bmp.close&&bmp.close();return d;}catch(_){return{};}
}
async function uploadFiles(files){
  // Count what actually landed — the summary toast tells the truth ("Uploaded N ·
  // M failed"), instead of the old unconditional "Uploaded" over any failures.
  let ok=0,fail=0,firstErr='';
  for(const file of files){
    const isDoc=file.type==='application/pdf';
    let name=(file.name||'file').replace(/\.[a-z0-9]+$/i,'');
    // Never gate the upload on a modal or drop the file — default the alt text to the
    // filename (as documents already do); you can refine it in the detail panel after.
    let alt=name.trim().length>=3?name:'Photo';
    const dims=await dimsOf(file);
    let up; try{up=await api('/media/upload-url','POST',{mime:file.type,bytes:file.size,alt_text:isDoc?name:alt,width:dims.width,height:dims.height});}catch(_){up={ok:false,body:{}};}
    if(!up.ok){fail++;firstErr=firstErr||(up.body&&up.body.message)||'';continue;}
    let put; try{put=await fetch(up.body.data.upload_url,{method:'PUT',headers:{'Content-Type':file.type},body:file});}catch(_){put={ok:false};}
    if(!put.ok){fail++;continue;}
    // Give EVERY upload a durable name, not just PDFs. This used to be `if(isDoc)`
    // — the reason a studio's photos all read "Photo" while its documents read
    // fine: only the PDF branch ever wrote metadata.title, so an image's only
    // name was its alt text (and 'Photo' when the filename was too short to use).
    // Writing the title here decouples NAME from DESCRIPTION for good: refining a
    // photo's alt text in the detail panel can never rename the file again.
    if(name.trim())await api('/assets/'+up.body.data.media_id,'PATCH',{name}).catch(()=>{});
    ok++;
  }
  toast(fail
    ?(ok?`Uploaded ${ok} · ${fail} failed`:(firstErr||'Uploads failed — nothing was added'))
    :`Uploaded ${ok} file${ok===1?'':'s'}`);
  if(ok)load();
}
$('picker').onchange=(e)=>{const f=[...e.target.files];e.target.value='';if(f.length)uploadFiles(f);};
$('replacer').onchange=async(e)=>{
  const file=e.target.files[0];e.target.value='';if(!file||!S.current)return;
  const old=S.current.asset;
  const _extra=(S.current.usage&&S.current.usage.length)?` This updates it in ${S.current.usage.length} place(s) on your site.`:'';
  if(!(await askConfirm('Replace this file?',`Replace “${old.name}” with ${file.name}.`+_extra,'Replace')))return;
  const isDoc=file.type==='application/pdf';const dims=await dimsOf(file);
  const alt=isDoc?old.name:(old.alt_text||old.name);
  const up=await api('/media/upload-url','POST',{mime:file.type,bytes:file.size,alt_text:alt,width:dims.width,height:dims.height});
  if(!up.ok){toast((up.body&&up.body.message)||'Upload could not start');return;}
  const put=await fetch(up.body.data.upload_url,{method:'PUT',headers:{'Content-Type':file.type},body:file});
  if(!put.ok){toast('Upload failed');return;}
  const r=await api('/assets/'+old.id+'/replace','POST',{with:up.body.data.media_id});
  if(r.ok){toast(r.body.data&&r.body.data.pending?'Sent for approval — it goes live once approved':('Replaced'+(r.body.data.requires_publish?' — publish to go live':'')));closeDetail();load();}else toast((r.body&&r.body.message)||'Replace failed');
};
// drag & drop
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,(e)=>{if(!S.canEdit)return;e.preventDefault();const d=$('drop');if(d)d.classList.add('on');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,(e)=>{if(e.relatedTarget&&ev==='dragleave')return;const d=$('drop');if(d&&(ev==='drop'||e.clientX<=0))d.classList.remove('on');}));
document.addEventListener('drop',(e)=>{if(!S.canEdit)return;e.preventDefault();const d=$('drop');if(d)d.classList.remove('on');const f=[...(e.dataTransfer.files||[])].filter(x=>/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(x.type));if(f.length)uploadFiles(f);});
$('scrim').onclick=closeDetail;
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeDetail();});
// deep link: /files.html?focus=<id> (from ⌘K)
function focusParam(){return new URLSearchParams(location.search).get('focus')||'';}

function signedOut(){$('root').innerHTML=`<div class="empty"><h2>Sign in to see your files.</h2><p style="margin-top:14px"><a class="btn primary" href="/studio.html" style="text-decoration:none">Sign in →</a></p></div>`;}
(async function(){
  try{
    const {data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){signedOut();return;}
    await loadContext();await load();
    const fid=focusParam();if(fid)openDetail(fid);
  }catch(_){renderTrouble({ok:false,status:0,body:{}});}   // honest trouble + Try-again, never a dead end
})();
</script>
