<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Files — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Every file for your business — photos, brand, documents, downloads — in one calm place.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically) — same aliasing pattern
     as customers.html / crm.html / inbox.html. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);--on-p:var(--dds-on-p,#fff);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--danger:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  /* the reset above also took the browser's margin:auto off a modal <dialog>, so
     every question on this page (askConfirm, askPrompt, folders, repeats) opened in
     the top-left corner — put the centring back, with the slide-over's own dim */
  dialog{margin:auto} dialog::backdrop{background:rgba(27,21,37,.42)}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--dds-w-data,1600px);margin:0 auto;padding:var(--dds-s7,32px) var(--dds-s5,20px) 90px}
  /* minmax(0,1fr): the wide table must scroll INSIDE .tscroll, never blow the
     column (and the .lhead row) open past the viewport */
  /* bold redesign (Figma "11 · Files"): no second column. The kinds of file sit in
     one row beside the search, and folders and clients become a strip of cards
     under it. The hooks stay what they were: [data-col] · [data-folder] ·
     [data-client] · .n counts · aria-current on the one that's on. */
  .layout{display:block}
  .filters{display:flex;flex-direction:column;gap:12px;margin-bottom:var(--dds-s4,16px)}
  .filters .bar{margin-bottom:0}
  .filters .bar .search{flex:0 1 300px}
  .kinds{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .ktrack{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .col{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:500;color:var(--soft);background:transparent;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .col:hover{color:var(--ink)}
  .col .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .ktrack .col.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(23,21,34,.1),0 1px 1px rgba(23,21,34,.04)}
  .col.on .n{color:var(--p)}
  .fchip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;color:var(--soft);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .fchip:hover{border-color:var(--p);color:var(--ink)}
  .fchip.on,.fchip[aria-pressed="true"],.fchip[aria-expanded="true"]{background:var(--p-soft);color:var(--p);border-color:transparent}
  .fchip .ic{width:15px;height:15px;flex:none;opacity:.85}
  .fchip .n{font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
  .morerow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .morerow[hidden]{display:none}
  .grow{flex:1 1 auto}
  /* folders, then clients: a strip of cards that scrolls sideways when it runs out of room */
  .rail{display:flex;gap:12px;align-items:center;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .railsec{display:flex;gap:10px;align-items:center;flex:0 0 auto}
  .railhead{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap;padding:0 2px}
  .fcard{display:inline-flex;align-items:center;gap:10px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,14px);padding:7px 14px 7px 7px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(23,21,34,.04);text-align:left}
  .fcard:hover{border-color:var(--p)}
  .fcard[aria-current="true"]{border-color:var(--p);background:var(--p-soft)}
  .fcard .fi{width:32px;height:32px;border-radius:10px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;flex:none}
  .fcard[aria-current="true"] .fi{background:var(--card)}
  .fcard .fi svg{width:17px;height:17px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--dds-grad-brand,var(--p));color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;font-style:normal;flex:none;letter-spacing:.02em}
  .fcard .ft{display:flex;flex-direction:column;line-height:1.25}
  .fcard .ft b{font-size:13.5px;font-weight:600}
  .fcard .ft small{font-size:12px;color:var(--faint)}
  .fcard.all{padding:7px 14px;min-height:46px}
  .railmore{font:inherit;font-size:12.5px;font-weight:600;color:var(--p);background:transparent;border:1.5px dashed var(--dds-line-strong,var(--line));border-radius:var(--dds-r-lg,14px);padding:12px 16px;cursor:pointer;white-space:nowrap}
  .railmore:hover{background:var(--p-soft);border-color:var(--p)}
  @media (max-width:720px){
    .filters .bar .search{flex:1 1 100%}
    .kinds{flex-wrap:nowrap;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
    .kinds::-webkit-scrollbar{display:none}
  }
  @media (pointer:coarse){.col,.fchip,.fcard,.railmore{min-height:44px}}

  /* toolbar */
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:var(--dds-s4,16px)}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%;padding:10px var(--dds-s3,12px) 10px 36px;border:1px solid var(--line);border-radius:var(--dds-r,8px);background:var(--card);color:var(--ink);font-size:14.5px;font-family:inherit}
  .search input:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  .search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--faint)}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--dds-r,8px);padding:10px var(--dds-s4,16px);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:var(--dds-s2,8px)}
  .btn:hover{border-color:var(--p)}
  .btn.primary{background:var(--p);color:var(--on-p);border-color:var(--p)}
  .btn.primary:hover{filter:brightness(1.06)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* ── list-view header (SLDS list-view anatomy, dds skin) — the same .lhead/
        .lrow1/.obj-ic/.lbtn/.lmeta treatment as customers.html / leads.html ── */
  .lhead{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);padding:var(--dds-s3,12px) var(--dds-s4,16px) 10px;margin-bottom:var(--dds-s4,16px)}
  .lrow1{display:flex;align-items:center;gap:10px}
  .obj-ic{width:34px;height:34px;border-radius:var(--dds-r,8px);background:var(--p);color:var(--on-p);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .lhead h1{font-family:var(--sans);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;flex:1 1 auto;min-width:max-content}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:var(--dds-r,8px);padding:var(--dds-s1,4px) var(--dds-s2,8px);cursor:pointer}
  .lbtn:hover{color:var(--p);background:var(--p-soft)}
  /* Oct 2026 nav cut: Visual Studio left the menu — "Make an image" lives here, on Files */
  a.lmake{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--p);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:var(--dds-s1,4px) var(--dds-s3,12px);white-space:nowrap}
  a.lmake:hover{background:var(--p-soft);border-color:var(--p)}
  /* narrow rows (phones, and tablets beside the sidebar): the row wraps and the pill takes the second line, so the h1 keeps its width */
  @media (max-width:900px){.lrow1{flex-wrap:wrap} a.lmake{order:9;margin-left:auto}}
  .lmeta{margin-top:6px;font-size:12px;color:var(--faint)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--dds-r,8px);overflow:hidden;flex:0 0 auto}
  .seg button{border:none;border-radius:0;padding:6px var(--dds-s3,12px);font-size:12.5px;background:transparent;color:var(--soft);font-family:inherit;font-weight:500;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--p-soft);color:var(--p)}
  .notice{font-size:12.5px;color:var(--faint);margin:-6px 0 var(--dds-s3,12px)}

  /* ── the table view (customers.html .tscroll anatomy): sortable columns; the
        table scrolls in its OWN container — the page never overflows sideways ── */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow)}
  .tscroll table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  /* Name and Client both hold free text, so both are bounded and ellipsised
     rather than allowed to wrap or to push Where-used off the edge — the full
     value stays available as a title. The name is what the owner scans for, so
     it gets the wider budget. */
  .tscroll td.cli,.tscroll th.cli{white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
  .tscroll .ncell{max-width:230px}
  .tscroll .ncell .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* the Client column adds a seventh column; buy its width back from the gutters
     rather than from Where-used, which would otherwise fall off the right edge */
  .tscroll table.wide tbody td{padding-left:10px;padding-right:10px}
  .tscroll table.wide thead th .thb{padding-left:10px;padding-right:10px}
  .tscroll thead th{text-align:left;font-size:12px;color:var(--faint);font-weight:500;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
  .tscroll thead th .thb{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:none;padding:var(--dds-s3,12px) var(--dds-s4,16px);width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:var(--dds-s1,4px)}
  .tscroll thead th .thb:hover{color:var(--p)}
  .tscroll thead th .arrow{font-size:10px;color:var(--p)}
  .tscroll tbody tr{cursor:pointer}
  .tscroll tbody tr:hover{background:var(--p-soft)}
  .tscroll tbody tr:focus-visible{outline:2px solid var(--p);outline-offset:-2px}
  .tscroll tbody td{padding:var(--dds-s3,12px) var(--dds-s4,16px);border-bottom:1px solid var(--line);vertical-align:middle}
  .tscroll tbody tr:last-child td{border-bottom:none}
  .tscroll td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .tscroll th.ck,.tscroll td.ck{width:34px;padding:var(--dds-s3,12px) 6px var(--dds-s3,12px) var(--dds-s3,12px)}
  .ncell{display:flex;align-items:center;gap:10px;min-width:0}
  .ncell .nm2{font-weight:600}
  .mthumb{width:34px;height:26px;border-radius:var(--dds-r-sm,6px);background:var(--p-soft) center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);flex:0 0 auto}
  .mthumb svg{width:15px;height:15px;opacity:.7}
  .tscroll .use{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:var(--dds-s1,4px);white-space:nowrap}
  .fromclient{font-size:12px;font-weight:500;background:var(--good-soft);color:var(--good);border-radius:999px;padding:2px var(--dds-s2,8px);margin-left:6px;white-space:nowrap;display:inline-block}

  /* health nudge */
  .nudge{background:var(--warn-soft);color:var(--warn);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s3,12px) var(--dds-s4,16px);font-size:13.5px;margin-bottom:var(--dds-s4,16px);display:flex;gap:10px;align-items:center;border:1px solid transparent}
  .nudge b{font-weight:700}
  .nudge button{margin-left:auto;background:none;border:none;color:var(--warn);font-weight:500;cursor:pointer;font-size:13px;font-family:inherit;text-decoration:underline}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--dds-s4,16px)}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;font-family:inherit;color:inherit;position:relative;transition:border-color var(--dds-t-fast,120ms) var(--dds-ease,ease-out)}
  .tile:hover{border-color:var(--p)}
  .tile .thumb{aspect-ratio:4/3;background:var(--p-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--faint)}
  .tile .thumb svg{width:34px;height:34px;opacity:.6}
  .tile .meta{padding:10px var(--dds-s3,12px) var(--dds-s3,12px)}
  .tile .nm{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .use{font-size:11.5px;color:var(--faint);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .pill.good{background:var(--good-soft);color:var(--good)}
  .pill.brand{background:var(--p-soft);color:var(--p)}
  .tile .who{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--soft);min-width:0}
  .tile .who .av{width:22px;height:22px;font-size:9.5px}
  .tile .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .dot.live{background:var(--good)} .dot.used{background:var(--p)} .dot.un{background:var(--faint)}
  .star{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.86);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--warn)}
  /* overlay chips follow the EFFECTIVE theme (data-theme wins over the OS scheme) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .star{background:rgba(31,26,43,.82)}}
  :root[data-theme="dark"] .star{background:rgba(31,26,43,.82)}
  .star svg{width:15px;height:15px}
  .badge{position:absolute;top:8px;left:8px;font-size:12px;font-weight:500;padding:2px var(--dds-s2,8px);border-radius:999px;background:var(--good-soft);color:var(--good);text-transform:capitalize}
  .badge.doc{background:var(--p-soft);color:var(--p)}
  .badge.pend{background:var(--warn-soft);color:var(--warn)}
  /* Oct 2026 review: client-private files — the 🔒 chip on a row/tile, and the
     "Private to this client" switch in the detail panel (the mock's .switch). */
  .lock{display:inline-flex;align-items:center;gap:var(--dds-s1,4px);font-size:11.5px;font-weight:500;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px var(--dds-s2,8px);margin-left:6px;white-space:nowrap;vertical-align:middle}
  .tile .badge.lock{margin-left:0;background:var(--warn-soft);color:var(--warn)}
  .switch{display:inline-flex;align-items:center;gap:var(--dds-s2,8px);font-size:13.5px;cursor:pointer;font-weight:500;position:relative}
  .switch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
  .switch i{width:34px;height:20px;border-radius:999px;background:var(--p);position:relative;display:inline-block;transition:var(--dds-t-fast,120ms) var(--dds-ease,ease-out);flex:0 0 auto}
  .switch i:after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff}
  .switch.off i{background:var(--dds-line-strong,#d2d2db)} .switch.off i:after{right:auto;left:2px}
  .switch input:focus-visible+i{outline:2px solid var(--p);outline-offset:2px}
  .switch input:disabled+i{opacity:.5}
  .privfield{margin-top:var(--dds-s3,12px)}
  .sbadge{display:inline-block;font-size:12px;font-weight:500;padding:var(--dds-s1,4px) var(--dds-s2,8px);border-radius:999px;margin:var(--dds-s1,4px) 0;text-transform:capitalize}
  .sbadge.live{background:var(--good-soft);color:var(--good)} .sbadge.pending{background:var(--warn-soft);color:var(--warn)} .sbadge.approved{background:var(--p-soft);color:var(--p)} .sbadge.draft,.sbadge.archived{background:var(--line);color:var(--soft)}
  .sdash{color:var(--faint)}
  .amuted{font-size:12.5px;color:var(--faint);margin-top:var(--dds-s1,4px)}

  /* multi-select */
  .tile.sel{border-color:var(--p);box-shadow:0 0 0 2px var(--p) inset,var(--shadow)}
  .check{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:var(--dds-r,8px);background:rgba(255,255,255,.9);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--p);z-index:2}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .check{background:rgba(31,26,43,.86)}}
  :root[data-theme="dark"] .check{background:rgba(31,26,43,.86)}
  .tile.sel .check{background:var(--p);border-color:var(--p);color:var(--on-p)}
  .check svg{width:15px;height:15px}
  .bulkbar{display:flex;flex-wrap:wrap;gap:var(--dds-s2,8px);align-items:center;background:var(--p-soft);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:10px var(--dds-s4,16px);margin-bottom:var(--dds-s4,16px)}
  .bulkbar .cnt{font-weight:700;color:var(--p);font-size:14px}
  .bulkbar .sp{margin-left:auto;display:flex;gap:var(--dds-s2,8px);flex-wrap:wrap}
  .bulkbar .btn{padding:var(--dds-s2,8px) var(--dds-s3,12px);font-size:13px}
  /* social sizes */
  .social{margin:var(--dds-s4,16px) 0}
  .social .hl{font-size:12px;color:var(--faint);font-weight:500;margin-bottom:var(--dds-s2,8px)}
  .social .row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--dds-s2,8px)}
  .social figure{margin:0;text-align:center}
  .social .box{background:var(--p-soft);border:1px solid var(--line);border-radius:var(--dds-r,8px);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:var(--dds-s1,4px)}
  .social .box img{width:100%;height:100%;object-fit:cover;display:block}
  .social figcaption{font-size:10.5px;color:var(--faint);line-height:1.25}
  .social .ogbtn{margin-top:10px;width:100%}
  /* G31: branded cards */
  .social .cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .social .cardgrid figure{margin:0;text-align:center}
  .social .cardbox{border:1px solid var(--line);border-radius:var(--dds-r,8px);overflow:hidden;background:var(--p-soft)}
  .social .cardbox svg{display:block}
  .social .cardgrid figcaption{font-size:10.5px;color:var(--faint);line-height:1.25;margin:var(--dds-s1,4px) 0}
  .social .cdl{width:100%;padding:6px var(--dds-s2,8px);font-size:12px;justify-content:center}
  .empty{text-align:center;padding:60px var(--dds-s5,20px);color:var(--soft)}
  .empty h2{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--ink);margin-bottom:var(--dds-s2,8px)}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
  @keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin,.panel{animation:none}}

  /* detail slide-over */
  .scrim{position:fixed;inset:0;background:rgba(27,21,37,.42);opacity:0;pointer-events:none;transition:opacity var(--dds-t-base,200ms) var(--dds-ease,ease-out);z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}

function bytes(n){if(!n)return'';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(0)+' KB';return(n/1048576).toFixed(1)+' MB';}
// the meter's sizes run to gigabytes, and a whole number reads "1 GB", not "1.0 GB"
function bigBytes(n){
  n=Number(n)||0;
  const u=n>=1073741824?[n/1073741824,'GB']:n>=1048576?[n/1048576,'MB']:[Math.max(n,0)/1024,'KB'];
  const v=u[0]>=100||Number.isInteger(u[0])?Math.round(u[0]):Number(u[0].toFixed(1));

function qstr(){
  const c=COLS.find(x=>x.key===S.col)||COLS[0];
  const p=new URLSearchParams();
  Object.entries(c.f).forEach(([k,v])=>p.set(k,v));
  if(S.col==='folder'&&S.folder)p.set('collection',S.folder);   // item 56: a folder is a server filter, like Templates
  if(S.q.trim())p.set('q',S.q.trim());
  p.set('limit','300');

}
// The filters that run over the page the server returned. Kind and Favorites
// already worked this way; the client dimension joins them — it COMPOSES with a
// collection rather than replacing it, so "Photos ∧ Rivera Builders" is a view.
//   Scale: the list read is capped (limit=300 here, the server clamps to 500),
//   so filtering here is exactly as honest as the kind/favourite filters that
//   ship today. Past ~15 clients this graduates to a SERVER-side filter through
//   the existing .f/qstr() mechanism — a COLS entry already carries query params
//   — with no rework of this UI.
function applyFilters(){
  let rows=S.full;
  const c=COLS.find(x=>x.key===S.col);
  if(c&&c.kind)rows=rows.filter(r=>r.kind===c.kind);
  if(c&&c.favs)rows=rows.filter(r=>r.favorite);
  // Oct 2026 review (0131): a client-private file shows in the Client-private
  // collection and under its own client's filter — never in a shared view
  if(c&&c.priv)rows=rows.filter(r=>r.client_private);
  else if(!S.client)rows=rows.filter(r=>!r.client_private);
  if(S.client==='studio')rows=rows.filter(r=>!r.client_id);
  else if(S.client)rows=rows.filter(r=>String(r.client_id||'')===S.client);
  if(S.use)rows=rows.filter(r=>r.in_use);   // bold redesign: a lens like the client's, over the list in hand
  S.assets=rows;
  // any change to the row set prunes selections that are no longer visible —
  // bulk actions only ever act on rows the user can SEE, and the bulkbar count
  // always equals the visible checked rows
  const keep=new Set(rows.map(r=>r.id));S.selected=new Set([...S.selected].filter(id=>keep.has(id)));
}
// soft=true (the ↻ refresh): any failure keeps the current list and toasts —
// leads.html's soft-fail contract; the in-place trouble state is for hard loads.
async function load(soft){
  // FD-T10: stock has its own surface. Entering it BUMPS the generation too, so an
  // in-flight roster read can never paint over stock; a leftover 'loading' state is
  // an orphan (its request was invalidated by that bump) — re-fetch, don't hang.
  if(S.col==='stock'){ REQ_SEQ++; if(S.stockState==null||S.stockState==='loading') return loadStock(); return renderStock(); }
  const gen=++REQ_SEQ;
  let a,col,h;
  try{[a,col,h]=await Promise.all([api('/assets?'+qstr()),api('/assets/collections'),api('/assets/health')]);}
  catch(_){a={ok:false,status:0,body:{}};col={ok:false};h={ok:false};}
  if(gen!==REQ_SEQ)return;   // a newer request started — this response is stale, never paint it
  if(!a.ok){
    if(soft&&S.loadedOnce){toast('Couldn’t refresh just now.');return;}
    // absorb a successful collections read even here — the trouble surface's
    // rail shows real counts when it can, count-less when it can't
    if(col&&col.ok){S.countsOk=true;S.counts=buildCounts(col.body.data||[]);}
    renderTrouble(a);return;
  }
  const full=(a.body.data&&a.body.data.assets)||[];
  S.full=full;
  S.policy=(a.body.data&&a.body.data.policy)||'immediate';
  S.storage=(a.body.data&&a.body.data.storage)||null;   // absent on a server from before the meter: no meter, never a guess
  if(S.col==='all'&&!S.q.trim()){deriveRailCounts(full,a.body.data&&a.body.data.total);deriveClientRail(full);}
  applyFilters();
  S.health=(h.ok&&h.body.data&&h.body.data.findings)||[];   // health is a nudge — its failure just means no nudge
  S.countsOk=!!col.ok;   // collections failure degrades the rail count-less, with a notice — never fake zeros
  S.counts=buildCounts((col.ok&&col.body.data)||[]);
  if(S.countsOk)S.newFolders=S.newFolders.filter(n=>!(S.counts[n]>0));   // a folder made here is real once a file is in it
  S.loadedOnce=true;LOADED_AT=Date.now();
  render();
}
// FAILED read = an honest couldn't-load with Try-again wired to load() in place —
// never an empty state. The rail stays. 403 keeps its own distinct message.
function renderTrouble(a){
  const inner=a.status===403
    ?`<div class="empty"><h2>${/plan|includ/i.test((a.body&&a.body.message)||"")?"Not part of your plan yet.":"Files live in your full workspace."}</h2><p>${esc((a.body&&a.body.message)||"")||"Your client view shows what you’ve chosen to share."}</p></div>`
    :`<div class="empty"><h2>We couldn’t load your files just now.</h2><p>A brief hiccup — it usually passes.</p><p style="margin-top:16px"><button class="btn primary" id="retry">Try again</button></p></div>`;
  $('root').innerHTML=`<div class="layout"><div>
    <header class="lhead"><div class="lrow1"><span class="obj-ic" aria-hidden="true">🗂</span><h1 id="pagehead" tabindex="-1">Files</h1><button class="lbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">↻</button></div>
    <div class="lmeta">Couldn’t load just now</div></header>${filtersHtml('','')}${inner}</div></div>`;

  const rt=$('retry');if(rt)rt.addEventListener('click',()=>load());

function wireRail(){

    `<figcaption style="font-size:11px;color:var(--faint);padding:4px 2px 6px">${esc(im.credit||'')}</figcaption>`+
    `<button class="btn" data-stock-add="${esc(im.id)}" data-alt="${esc(im.alt)}" data-credit="${esc(im.credit||'')}" style="width:100%">Add to my files</button></figure>`;
}
function renderStock(){
  const grid = S.stockState==='unavailable'
    ? `<div class="empty" style="grid-column:1/-1"><h2>The stock library isn’t turned on yet.</h2><p>Your studio can enable it. Once on, browse professional royalty-free photos and add them straight to your Files — hosted on your own site.</p></div>`
    : S.stockState==='loading' ? `<div class="empty" style="grid-column:1/-1"><h2>Searching…</h2></div>`
    : S.stockState==='error' ? `<div class="empty" style="grid-column:1/-1" role="status"><h2>${esc(S.stockError)}</h2></div>`
    : (S.stockResults||[]).length ? S.stockResults.map(stockTile).join('')
    : `<div class="empty" style="grid-column:1/-1"><h2>${S.stockQ?'No photos match that search.':'Find a professional photo.'}</h2><p>Try “office”, “coffee”, “construction”, “salon”…</p></div>`;
  const note = S.stockLicense ? `Royalty-free from ${esc(S.stockProvider)} · ${esc(S.stockLicense)} · added to your Files and hosted on your own site.` : 'Professional royalty-free photos, added straight to your Files.';
  $('root').innerHTML=`<div class="layout"><div>
    <header class="lhead"><div class="lrow1"><span class="obj-ic" aria-hidden="true">🗂</span><h1 id="pagehead" tabindex="-1">Files</h1><button class="lbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">↻</button></div>
    <div class="lmeta">Stock Library — professional royalty-free photos</div></header>
    ${filtersHtml(`<div class="search">${svg(IC.search)}<input id="sq" type="search" aria-label="Search stock photos" placeholder="Search stock photos — try “office”" value="${esc(S.stockQ||'')}" autocomplete="off"></div>`,'')}
    <p style="margin:2px 0 12px;color:var(--faint);font-size:12.5px">${note}</p>
    <div class="grid">${grid}</div></div></div>`;
  wireRail();
  const srf=$('refreshBtn'); if(srf)srf.addEventListener('click',()=>{loadStock().then(()=>{const nr=$('refreshBtn');if(nr)nr.focus();}).catch(()=>toast('Couldn’t refresh just now.'));});
  // no sq.focus() here — auto-stealing focus on every render broke keyboard flow
  // through the rail (the render is reached from rail clicks, not just typing)
  const sq=$('sq'); if(sq){ sq.addEventListener('keydown',e=>{if(e.key==='Enter'){S.stockQ=sq.value.trim();loadStock();}}); }
  document.querySelectorAll('[data-stock-add]').forEach(b=>b.addEventListener('click',()=>addStock(b.dataset.stockAdd,b.dataset.alt,b.dataset.credit,b)));
}
async function loadStock(){
  const gen=++REQ_SEQ;   // the SAME stale-response discipline as load() (C5)
  S.stockState='loading'; renderStock();
  const r=await api('/stock/search?q='+encodeURIComponent(S.stockQ||'')+'&page=1');
  if(gen!==REQ_SEQ||S.col!=='stock')return;   // a newer read started, or the user left stock — never paint over what they moved on to
  if(r.status===503){S.stockState='unavailable';return renderStock();}
  // the server says why a search failed (Nov 9 2026: a refused Pexels key read as "No photos match")
  if(!r.ok){S.stockResults=[];S.stockError=(r.body&&r.body.message)||'The stock library couldn’t search just now. Try again in a little while.';S.stockState='error';return renderStock();}
  if(r.ok&&r.body.data){S.stockResults=r.body.data.images||[];S.stockProvider=r.body.data.provider||'';S.stockLicense=(r.body.data.license&&r.body.data.license.name)||'';}
  else{S.stockResults=[];}
  S.stockState='ok'; renderStock();
}
async function addStock(id,alt,credit,btn){
  if(btn){btn.disabled=true;btn.textContent='Adding…';}
  const r=await api('/stock/import','POST',{stock_id:id,alt_text:alt,credit:credit});
  if(r.ok){toast('Added to your Files');if(btn){btn.textContent='Added ✓';}}
  else if(r.status===503){toast('Stock library isn’t enabled yet');if(btn){btn.disabled=false;btn.textContent='Add to my files';}}
  else{toast((r.body&&r.body.message)||'Could not add that photo');if(btn){btn.disabled=false;btn.textContent='Add to my files';}}
}
// ── the sort and the columns must agree ─────────────────────────────────────
// Both sortable columns can VANISH: Status when the plan has no approval step and
// nothing is archived, Client when no file belongs to a client. Sorting by a column
// that is no longer on screen used to revert to Added incidentally — each caller
// re-did the same `||` fallback, and the header lost its arrow while .lmeta quietly
// said "Sorted by Added", which is honest but unexplained. Do it ONCE, explicitly,
// and write the revert back into SORT so the order, the .lmeta line and the header
// arrow are three views of one fact.
const ADDED_SORT={key:'added',dir:-1};   // the default: newest first
function normalizeSort(){
  if(tcols().some(c=>c[0]===SORT.key))return;
  SORT={...ADDED_SORT};   // the hidden column's sort really did revert — say so everywhere
}
function activeSortCol(){ return tcols().find(x=>x[0]===SORT.key)||TCOLS.find(x=>x[0]==='added'); }
function sortRows(rows){
  const col=activeSortCol();
  const r=[...rows];
  r.sort((a,b)=>{const av=col[2](a),bv=col[2](b);return av<bv?-SORT.dir:av>bv?SORT.dir:0;});
  return r;
}
function lheadHtml(shown){
  const sortCol=activeSortCol();
  return `<header class="lhead">
    <div class="lrow1">
      <span class="obj-ic" aria-hidden="true">🗂</span>
      <h1 id="pagehead" tabindex="-1">Files</h1>
      <div class="seg" role="group" aria-label="Display as"><button id="dispTable" aria-pressed="${DISPLAY==='table'?'true':'false'}">Table</button><button id="dispGrid" aria-pressed="${DISPLAY==='grid'?'true':'false'}">Grid</button></div>
      <a class="lmake" id="makeImage" href="/visual-studio.html" title="Make an image with Visual Studio">Make an image</a>
      <button class="lbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">↻</button>
      ${S.canEdit&&DISPLAY==='grid'&&S.assets.length?`<button class="btn" id="selbtn">${S.selectMode?'Done':'Select'}</button>`:''}
      ${S.canEdit?`<button class="btn primary" id="add">＋ Add files</button>`:''}
    </div>
    <div class="lmeta">${shown} file${shown===1?'':'s'}${(()=>{const n=(S.full||[]).filter(r=>r.client_private).length;return n?` · ${n} private to a client`:'';})()} · ${esc(updatedLabel())}${DISPLAY==='table'?` · Sorted by ${esc(sortCol[1])} — ${SORT.dir>0?'ascending':'descending'}`:''}</div>
    ${storageHtml()}
  </header>`;
}
// ── items 56 + 115: how much space is used ───────────────────────────────────
// The server counts what the upload door refuses on: every live file (archived
// and private ones still take space), against the smaller of the template's
// file cap and the site's storage. Two limits, so the bar follows the nearer one.
// Archiving frees nothing — the sentence says delete, because that's what does.
function storageHtml(){
  const st=S.storage;if(!st||!(st.max_bytes>0))return'';
  const pctB=Math.min(100,st.used_bytes/st.max_bytes*100);
  const pctF=st.max_files>0?Math.min(100,st.files/st.max_files*100):0;
  const pct=Math.max(pctB,pctF);
  const said=`${bigBytes(st.used_bytes)} of ${bigBytes(st.max_bytes)} used · ${st.files} of ${st.max_files} files`;
  const warn=st.level==='full'?'Full — delete files you no longer need before adding more.'
    :st.level==='low'?'Nearly full — deleting files you no longer need frees space; archiving doesn’t.':'';
  return `<div class="store ${esc(st.level||'ok')}" id="storage"><div class="storebar" role="meter" aria-label="Storage used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" aria-valuetext="${esc(said)}"><i style="width:${pct.toFixed(1)}%"></i></div><span>${esc(said)}</span>${warn?`<b>${esc(warn)}</b>`:''}</div>`;
}
function render(){
  normalizeSort();   // a column that vanished takes its sort with it — before anything reads SORT
  const rows=sortRows(S.assets);
  const nudge=renderNudge();
  const notice=S.countsOk?'':`<div class="notice">Collection counts aren’t available just now — your files are all here.</div>`;
  const inFolder=S.col==='folder'&&S.folder;
  const bodyHtml=rows.length
    ?(DISPLAY==='table'?tableHtml(rows):`<div class="grid">${rows.map(tile).join('')}</div>`)
    :inFolder&&!S.q
      ?`<div class="empty"><h2>This folder is empty.</h2><p>${S.canEdit?'Add files here, or tick files in All files and choose Move to folder. A new folder keeps once a file is in it.':'Files your studio puts in this folder will appear here.'}</p></div>`
      :`<div class="empty"><h2>${S.q?'No files match that search.':'Nothing here yet.'}</h2><p>${S.canEdit?'Drag files in, or use Add files above.':'Files your studio adds will appear here.'}</p></div>`;
  // item 56: the open folder names itself, with its two moves
  const fbar=inFolder?`<div class="fbar">${svg(IC.folder)}<span>Folder <b>${esc(folderLabel(S.folder))}</b>${S.canEdit?' · new files go in here':''}</span>${S.canEdit?`<button class="btn" id="fRename">Rename</button><button class="btn" id="fRemove">Remove folder</button>`:''}</div>`:'';
  // Any re-render must never destroy a focused search input's value or caret
  // (contacts.html's contract) — capture before the innerHTML swap, restore after.
  const act=document.activeElement;const wasQ=!!(act&&act.id==='q');
  const qv=wasQ?act.value:null;const qp=wasQ?act.selectionStart:0;
  $('root').innerHTML=`
    <div class="layout">
      <div>
        ${lheadHtml(rows.length)}
        ${notice}
        ${filtersHtml(`<div class="search">${svg(IC.search)}<input id="q" type="search" aria-label="${inFolder?'Search this folder':'Search files'}" placeholder="${inFolder?'Search this folder':'Search files — try “logo”'}" value="${esc(S.q)}" autocomplete="off"></div>`,'')}
        ${fbar}
        <div class="drop" id="drop">Drop to upload</div>
        ${bulkBar()}
        ${nudge}
        ${bodyHtml}
      </div>
    </div>`;
  wire();
  if(wasQ){const nq=$('q');if(nq){if(qv!=null)nq.value=qv;nq.focus();try{nq.setSelectionRange(qp,qp);}catch(_){/* */}}}
}
// A10's studio-side sibling (projects.html): a client upload is marked by the
// server-stamped note 'Uploaded by the client.' (client_delivery.ts) — PREFIX
// match so a studio-written note doesn't false-positive — plus a future-proof
// explicit `client_upload` boolean; assets carry theirs in metadata.
function isClientUpload(a){
  if(!a)return false;
  if(a.client_upload===true)return true;
  return String(a.note||(a.metadata&&a.metadata.note)||'').startsWith('Uploaded by the client');
}
// ── STATUS: only claim what can be true ──────────────────────────────────────
// asset_status is `not null default 'approved'` (0063) and NO upload path sets
// it, so every file arrives "Approved" with nobody having approved anything. And
// under the 'immediate' policy — what a solo studio runs on — there is no
// approval step at all; bulkBar() already hides the Approve button for exactly
// this reason. So the chip is suppressed there. Two states survive the
// suppression for opposite reasons: 'archived' is a real move the owner made, and
// 'live'/'pending' are withheld not for want of truth — 'live' is what the Where
// used column already says, and 'pending' cannot occur under this policy.
function stateShown(st){ return S.policy!=='immediate' || st==='archived'; }
function tableHtml(rows){
  const allSel=rows.length&&rows.every(a=>S.selected.has(a.id));
  const ckTh=S.canEdit?`<th scope="col" class="ck"><input type="checkbox" id="ckAll" aria-label="Select all files"${allSel?' checked':''}></th>`:'';
  const ths=ckTh+tcols().map(([k,label])=>{
    const on=SORT.key===k;
    return `<th scope="col"${k==='client'?' class="cli"':''}${on?` aria-sort="${SORT.dir>0?'ascending':'descending'}"`:''}><button type="button" class="thb" data-sort="${k}">${esc(label)}${on?`<span class="arrow" aria-hidden="true">${SORT.dir>0?'▲':'▼'}</span>`:''}</button></th>`;
  }).join('');
  const trs=rows.map(a=>{
    const ic=svg(a.kind==='document'?IC.doc:IC.photo);
    // data-thumb/data-ic: wireThumbs falls the cell back to the icon if the
    // thumbnail can't load — a CSS background has no onerror of its own
    const t=a.thumb?` data-thumb="${esc(a.thumb)}" data-ic="${esc(ic)}" style="background-image:url('${esc(a.thumb)}')"`:'';
    const inner=a.thumb?'':ic;
    const st=a.state||'approved';
    const stateLbl={live:'Live',pending:'Pending',approved:'Approved',draft:'Draft',archived:'Archived'}[st]||st;
    const ckTd=S.canEdit?`<td class="ck"><input type="checkbox" data-pick="${esc(a.id)}" aria-label="Select ${esc(a.name)}"${S.selected.has(a.id)?' checked':''}></td>`:'';
    return `<tr data-open="${esc(a.id)}" tabindex="0" aria-label="Open ${esc(a.name)}">
      ${ckTd}
      <td><span class="ncell"><span class="mthumb"${t}>${inner}</span><span class="nm2" title="${esc(a.name)}">${esc(a.name)}</span>${a.client_private?`<span class="lock" title="Private to this client — not in the shared library or the site picker">🔒 Private${a.client_name?' to '+esc(a.client_name):''}</span>`:''}</span></td>
      ${RAILC.length?(()=>{const cl=clientLabel(a);return `<td class="cli" title="${esc(cl)}">${esc(cl)}</td>`;})():''}
      <td>${a.kind==='document'?'PDF':'Photo'}</td>
      <td class="num">${bytes(a.bytes)||'—'}</td>
      <td class="num">${esc(when(a.created_at))||'—'}${isClientUpload(a)?'<span class="fromclient">by client</span>':''}</td>
      <td><span class="use"><span class="dot ${a.in_use?'used':'un'}"></span>${a.in_use?'On your site':'Not on your site'}</span></td>
      ${showStateCol()?`<td>${stateShown(st)?`<span class="sbadge ${esc(st)}">${esc(stateLbl)}</span>`:`<span class="sdash" title="Your plan has no approval step — files are available the moment they land.">—</span>`}</td>`:''}
    </tr>`;
  }).join('');
  return `<div class="tscroll"><table${RAILC.length?' class="wide"':''} aria-label="Files"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}
// The bulk-action bar — one move applied to the current selection. Approve appears
// only where an approval step actually applies (never as empty friction).
function bulkBar(){
  // grid: shown while Select mode is on (the tiles' flow, unchanged);
  // table: the checkbox column feeds it — it appears once anything is selected
  const n=S.selected.size;
  if(!S.selectMode&&!(DISPLAY==='table'&&S.canEdit&&n))return'';
  const approve=S.policy!=='immediate'?`<button class="btn" data-bulk="approve">Approve</button>`:'';
  return `<div class="bulkbar">
    <span class="cnt">${n} selected</span>
    <button class="btn" data-bulk="all">${n&&n>=S.assets.length?'Clear all':'Select all'}</button>
    <span class="sp">
      <button class="btn" data-bulk="tag"${n?'':' disabled'}>Add tag</button>
      <button class="btn" data-bulk="collection"${n?'':' disabled'}>Move to folder…</button>
      ${approve?approve.replace('data-bulk="approve"',`data-bulk="approve"${n?'':' disabled'}`):''}
      <button class="btn" data-bulk="download"${n?'':' disabled'}>Download</button>
      <button class="btn" data-bulk="archive"${n?'':' disabled'}>Archive</button>
    </span>
  </div>`;
}
function renderNudge(){
  if(!S.health.length||S.col==='archive')return'';
  const by={};S.health.forEach(f=>{by[f.kind]=(by[f.kind]||0)+1;});
  const parts=[];
  if(by.missing_alt)parts.push(`<b>${by.missing_alt}</b> need a description`);
  if(by.unused)parts.push(`<b>${by.unused}</b> aren’t on your site`);   // the finding measures the WEBSITE graph only — say so (a client's project file is not "unused")
  if(by.oversized)parts.push(`<b>${by.oversized}</b> large`);
  if(by.duplicate)parts.push(`<b>${by.duplicate}</b> look duplicated`);
  if(!parts.length)return'';
  return `<div class="nudge">A few files could use attention: ${parts.join(' · ')}.<button id="tidy">Review</button></div>`;
}
function tile(a){
  const ic=svg(a.kind==='document'?IC.doc:IC.photo);
  const t=a.thumb?`data-thumb="${esc(a.thumb)}" data-ic="${esc(ic)}" style="background-image:url('${esc(a.thumb)}')"`:'';
  const inner=a.thumb?'':ic;
  // bold redesign: a pill when it's on the site, the plain words when not (they say what was measured)
  const who=a.client_id?`<div class="who"><i class="av" aria-hidden="true">${esc(initialsOf(clientLabel(a)))}</i><span>${esc(clientLabel(a))}</span></div>`:'';
  const meta=`<div class="meta"><div class="nm" title="${esc(a.name)}">${esc(a.name)}</div><div class="use">${a.in_use?'<span class="pill good">On your site</span>':'Not on your site'}${a.brand?'<span class="pill brand">Brand</span>':''}</div>${who}</div>`;
  // the Pending badge obeys the SAME honesty rule as the table's Status column
  // (stateShown) — otherwise Grid and Table would contradict each other about
  // the same file the moment a 'pending' row existed
  const badge=a.client_private?`<span class="badge lock" title="Private to this client">🔒 Private</span>`:(a.state==='pending'&&stateShown('pending'))?`<span class="badge pend">Pending</span>`:a.kind==='document'?`<span class="badge doc">PDF</span>`:'';
  const sel=S.selectMode&&S.selected.has(a.id);
  if(S.selectMode){
    return `<div class="tile ${sel?'sel':''}" data-pick="${a.id}" role="button" tabindex="0" aria-pressed="${sel?'true':'false'}" aria-label="${sel?'Deselect':'Select'} ${esc(a.name)}">
      <div class="check">${sel?svg(IC.check):''}</div>
      <div class="thumb" ${t}>${inner}</div>${badge}
      ${meta}
    </div>`;
  }
  const star=S.canEdit?`<button class="star" data-fav="${a.id}" title="Favorite">${svg(a.favorite?IC.star:IC.starO)}</button>`:'';
  return `<div class="tile" data-open="${a.id}" role="button" tabindex="0" aria-label="Open ${esc(a.name)}">
    <div class="thumb" ${t}>${inner}</div>${badge}${star}
    ${meta}
  </div>`;
}
function wire(){
  wireRail();
  wireThumbs($('root'));   // a thumbnail that can't load falls back to its icon, never a blank cell
  // grid tiles open on click/Enter/Space; table rows do too, but never from a
  // click on the row's own controls (checkbox / future buttons)
  document.querySelectorAll('.tile[data-open]').forEach(b=>{b.onclick=()=>openDetail(b.dataset.open);b.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(b.dataset.open);}};});
  document.querySelectorAll('tr[data-open]').forEach(tr=>{
    tr.onclick=(e)=>{if(e.target.closest('input,button,a'))return;openDetail(tr.dataset.open);};
    tr.onkeydown=(e)=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('input,button,a')){e.preventDefault();openDetail(tr.dataset.open);}};
  });
  document.querySelectorAll('.tile[data-pick]').forEach(b=>{const pick=()=>togglePick(b.dataset.pick);b.onclick=pick;b.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}};});
  document.querySelectorAll('input[data-pick]').forEach(b=>{b.onchange=()=>togglePick(b.dataset.pick);});
  const ckAll=$('ckAll');if(ckAll)ckAll.onchange=()=>{
    const rows=sortRows(S.assets);
    const all=rows.length&&rows.every(a=>S.selected.has(a.id));
    S.selected=all?new Set():new Set(rows.map(a=>a.id));
    render();const nb=$('ckAll');if(nb)nb.focus();
  };
  document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();toggleFav(b.dataset.fav);});
  document.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=()=>onBulk(b.dataset.bulk));
  const selb=$('selbtn');if(selb)selb.onclick=()=>{S.selectMode=!S.selectMode;S.selected.clear();render();const nb=$('selbtn');if(nb)nb.focus();};
  // search stays a SERVER ?q= query (debounced); the re-render preserves the
  // input + caret (render()'s contract) and REQ_SEQ drops stale responses
  const q=$('q');if(q){let t;q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{S.q=q.value;load();},280);};}
  // ↻ refresh: soft — a failure toasts and keeps the list (leads.html contract);
  // these re-renders also restore focus to their control (the rosters' pattern)
  const rf=$('refreshBtn');if(rf)rf.onclick=()=>load(true).then(()=>{const nr=$('refreshBtn');if(nr)nr.focus();}).catch(()=>toast('Couldn’t refresh just now.'));
  const dt=$('dispTable');if(dt)dt.onclick=()=>{if(DISPLAY!=='table'){setDisplay('table');const nb=$('dispTable');if(nb)nb.focus();}};
  const dg=$('dispGrid');if(dg)dg.onclick=()=>{if(DISPLAY!=='grid'){setDisplay('grid');const nb=$('dispGrid');if(nb)nb.focus();}};
  // sortable column headers — click toggles asc/desc (aria-sort on the <th>);
  // Size/Added read largest/newest-first on their first click
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{
    const k=b.getAttribute('data-sort');
    if(SORT.key===k)SORT.dir=-SORT.dir; else SORT={key:k,dir:(k==='added'||k==='bytes')?-1:1};
    render();
    const nb=document.querySelector('[data-sort="'+k+'"]');if(nb)nb.focus();
  });
  const add=$('add');if(add)add.onclick=()=>$('picker').click();
  const fr=$('fRename');if(fr)fr.onclick=()=>renameFolder();
  const fx=$('fRemove');if(fx)fx.onclick=()=>removeFolder();
  const tidy=$('tidy');if(tidy)tidy.onclick=()=>{S.q='';S.col='all';SORT={key:'added',dir:-1};load();};
}
function togglePick(id){ if(S.selected.has(id))S.selected.delete(id); else S.selected.add(id); render();
  const nb=document.querySelector('[data-pick="'+id+'"]'); if(nb)nb.focus(); }   // focus survives the re-render
// One bulk move applied to the current selection, via POST /assets/bulk. Reuses the
// same tag/collection/status logic server-side; here we just gather the input.
async function onBulk(action){
  if(action==='all'){ const all=S.selected.size>=S.assets.length; S.selected=all?new Set():new Set(S.assets.map(a=>a.id)); return render(); }
  const ids=[...S.selected]; if(!ids.length){toast('Select some files first');return;}
  if(action==='download')return bulkDownload(ids);
  const body={action,ids};
  if(action==='tag'){ const tag=await askPrompt('Add a tag','This tag is added to '+ids.length+' file'+(ids.length===1?'':'s')+'.','Add tag','e.g. summer, hero'); if(!tag)return; body.tag=tag; }
  else if(action==='collection'){
    // item 56: one tap on a folder you have, a new name, or out of folders altogether
    const inOne=ids.some(id=>{const a=S.assets.find(x=>x.id===id);return a&&a.collection;});
    const pick=await askFolder('Move to a folder','Move '+ids.length+' file'+(ids.length===1?'':'s')+' into a folder.',{canClear:inOne});
    if(!pick)return;
    if(pick.clear)body.clear=true; else body.collection=pick.name;
  }

// Bulk Download: one signed URL per file, saved via anchor clicks. Non-destructive,
// so the selection stays. The toast tells the truth about partial failure.
async function bulkDownload(ids){
  let ok=0,fail=0;
  for(const id of ids){
    let r; try{r=await api('/assets/'+id+'/download');}catch(_){r={ok:false};}
    const url=r&&r.ok&&r.body.data&&r.body.data.url;
    if(url){const a=document.createElement('a');a.href=url;a.download='';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();ok++;}

/* ── honest previews ─────────────────────────────────────────────────────────
   Every preview here rides a short-lived signed URL for a PRIVATE object, and a
   signed URL can fail to resolve for reasons that have nothing to do with the
   file: a transform the store won't perform, a source past the transformer's
   limits, a token that has aged out. When it does, the browser draws its own
   broken-image glyph next to the alt text — which is how "the photos in Files
   are broken" looked to Eric, over files that were perfectly intact.
   So: a preview img declares a FALLBACK (the same object, untransformed) and a
   SENTENCE. It tries the fallback once, and if that fails too it replaces itself
   with the sentence. A broken-image glyph is never a state this page can reach.
   Wired in JS, not an inline onerror, so a URL can't break out of an attribute —
   and re-checked immediately, because an <img> that has ALREADY failed by the
   time we get here (cached failure, data: URL, offline) never fires onerror. */
const PV_FAIL='Preview unavailable — the file itself is fine. Use Download to open it.';
function wirePreviews(root){
  (root||document).querySelectorAll('img[data-pv]').forEach(im=>{
    if(im.dataset.pvWired)return;im.dataset.pvWired='1';
    const fail=()=>{
      const fb=im.getAttribute('data-fallback');
      if(fb&&im.src!==fb){im.removeAttribute('data-fallback');im.src=fb;return;}   // one try at the original
      const host=im.closest('[data-pvhost]')||im.parentElement;
      if(host)host.innerHTML=`<span class="pvfail">${esc(im.getAttribute('data-fail')||PV_FAIL)}</span>`;
    };
    im.onerror=fail;
    if(im.complete&&!im.naturalWidth)fail();   // already failed before we got here
  });
}
/* The roster's tiles paint their thumbnail as a CSS background — no <img>, so no
   onerror, and a thumbnail that 404s left a silent empty box. Probe the same URL
   (the browser serves the second request from cache) and, if it can't load, drop
   back to the placeholder icon a file with no thumbnail already shows. A 34px
   cell has no room for a sentence; the icon IS the honest state here. */
function wireThumbs(root){
  (root||document).querySelectorAll('[data-thumb]').forEach(el=>{
    if(el.dataset.thWired)return;el.dataset.thWired='1';
    const u=el.getAttribute('data-thumb');if(!u)return;
    const probe=new Image();
    probe.onerror=()=>{el.style.backgroundImage='';el.innerHTML=el.getAttribute('data-ic')||'';};
    probe.src=u;
  });
}

// The card references the photo/logo by signed URL; an SVG rasterized via <img>
// can't load external resources, so inline them as data: URIs before export.
async function inlineCardImages(svg){

// ── items 39 + 117: the photo editor ─────────────────────────────────────────
// image-editor.js crops, rotates, flips, adjusts and filters the photo in the
// browser, and takes out a plain background. It loads on first use only. Saving
// makes a NEW file beside the original, never a replace: a replaced file is
// soft-deleted, and media_gc removes it for good after 7 days. The copy keeps the
// original's folder, tags, caption and description, and names where it came from.
// "Remove background" opens the same editor on its Background tab, with the
// removal already on. It used to ask an AI image model (POST
// /assets/:id/remove-background, G32), which redraws the whole photo and was never
// switched on in production; the route is still on the server.
// Where the server has a cut-out key (d.cutout_available), the editor also offers
// "Cut out the subject" for a busy background, through cutoutOf below.
// Bump ?v= whenever image-editor.js changes: browsers keep a .js file for a day.
let EDITOR=null;
function loadEditor(){
  if(window.DDSImageEditor)return Promise.resolve(window.DDSImageEditor);
  if(!EDITOR)EDITOR=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src='/image-editor.js?v=2';
    s.onload=()=>window.DDSImageEditor?res(window.DDSImageEditor):rej(new Error('missing'));
    s.onerror=()=>rej(new Error('load'));
    document.head.appendChild(s);
  }).catch((e)=>{EDITOR=null;throw e;});   // a failed load can be tried again
  return EDITOR;
}
async function editPhoto(tab){
  let d=S.current;if(!d||!d.asset||d.asset.kind!=='image')return;
  const a=d.asset;
  // the signed links last an hour (thumb_fallback) and ten minutes (download_url):
  // a panel left open longer reads the file again for fresh ones
  if(Date.now()-(S.currentAt||0)>50*60000){
    const r=await api('/assets/'+a.id).catch(()=>({ok:false}));
    if(!S.current||S.current.asset.id!==a.id)return;
    if(r.ok&&r.body&&r.body.data){d=S.current=r.body.data;S.currentAt=Date.now();}
  }
  // the ORIGINAL's own bytes: thumb is a small re-encode, so it's never the source
  const src=d.thumb_fallback||d.download_url;
  if(!src){toast('Couldn’t open this photo for editing — try again in a moment.');return;}
  let ed;try{ed=await loadEditor();}catch(_){toast('The photo editor didn’t load. Check your connection and try again.');return;}
  if(!S.current||S.current.asset.id!==a.id)return;   // the panel moved on while it loaded
  const res=await ed.open({src,fallbackSrc:d.download_url,name:a.name,mime:a.mime,startTab:tab,removeBackground:tab==='background',cutout:d.cutout_available?()=>cutoutOf(a.id):null,onSave:(out)=>saveEdited(a,out)});
  if(!res||!res.saved||!res.value)return;
  toast(res.value.patched?'Saved as a new file. The original is unchanged.':'Saved as a new file. Its name and folder didn’t copy over, so set them here.');
  await load(true);
  const back=detailOpener;openDetail(res.value.id);detailOpener=back;   // closing the copy's panel returns to the list, not to the old panel's button
}
// "Cut out the subject": the server asks Replicate (lib/cutout.ts) and answers the
// PNG itself, or 202 with a job to ask after while a quiet model starts up, which
// takes a minute or two. Resolves the Blob, or {error} for the editor to say.
const CUTOUT_POLL_MS=2500,CUTOUT_POLLS=72;   // three minutes at most
async function cutoutOf(id){
  const call=(path,method)=>fetch(FN+path,{method,headers:H()});
  const fail='The cut-out didn’t come through, so nothing changed. Try again in a moment.';
  let r;try{r=await call('/assets/'+id+'/cutout','POST');}catch(_){return{error:'The cut-out couldn’t start. Check your connection and try again.'};}
  for(let i=0;;i++){
    if(r.status===200&&/^image\/png\b/.test(r.headers.get('content-type')||''))return await r.blob();
    const b=await r.json().catch(()=>({}));
    const job=r.status===202&&b.data&&b.data.job;
    if(!job)return{error:(b&&b.message)||fail};
    if(i>=CUTOUT_POLLS)return{error:'The cut-out service is taking too long just now, so nothing changed. Try again in a few minutes.'};
    await new Promise((res)=>setTimeout(res,CUTOUT_POLL_MS));
    try{r=await call('/assets/cutout/'+encodeURIComponent(job),'GET');}catch(_){return{error:fail};}
  }
}
const editedName=(n)=>{n=String(n||'Photo').trim()||'Photo';return /\(edited\)$/i.test(n)?n:(n+' (edited)').slice(0,200);};
// Through the SAME door as any upload (its size and file limits, the content
// hash), then the original's organisation. Returns {error} to keep the editor open.
async function saveEdited(a,out){
  const alt=String(a.alt_text||'').trim().length>=3?a.alt_text:(String(a.name||'').trim().length>=3?a.name:'Photo');
  let up;try{up=await api('/media/upload-url','POST',{mime:out.mime,bytes:out.blob.size,alt_text:alt,width:out.width,height:out.height,content_hash:(await fileHash(out.blob))||undefined});}catch(_){up={ok:false,body:{}};}
  if(!up.ok)return{error:(up.body&&up.body.message)||'The upload couldn’t start, so nothing was saved. Try again.'};
  let put;try{put=await fetch(up.body.data.upload_url,{method:'PUT',headers:{'Content-Type':out.mime},body:out.blob});}catch(_){put={ok:false};}
  if(!put.ok)return{error:'The upload didn’t finish, so nothing was saved. Try again.'};
  const id=up.body.data.media_id,meta=a.metadata||{};
  // a client-private photo's copy is private too, and first, before anything names it
  if(a.client_private)await api('/assets/'+id,'PATCH',{client_private:true}).catch(()=>{});
  const body={name:editedName(a.name),metadata:{edited_from:a.id,edited_from_name:String(a.name||'').slice(0,200),edited_at:new Date().toISOString(),edits:out.edits}};
  if(a.collection)body.collection=a.collection;
  if((a.tags||[]).length)body.tags=a.tags;
  if(meta.caption)body.caption=meta.caption;
  if(a.brand)body.brand=true;
  const r=await api('/assets/'+id,'PATCH',body).catch(()=>({ok:false}));
  return{id,patched:!!(r&&r.ok)};
}

async function rollback(id){if(!(await askConfirm('Restore the previous version?','This puts the earlier file back everywhere it was used.','Restore')))return;const r=await api('/assets/'+id+'/rollback','POST');if(r.ok){toast('Previous version restored'+(r.body.data.requires_publish?' — publish to go live':''));closeDetail();load();}else toast((r.body&&r.body.message)||'Nothing to undo');}
function when(iso){if(!iso)return'';const d=Math.floor((Date.now()-Date.parse(iso))/86400000);if(d<=0)return'today';if(d===1)return'yesterday';if(d<7)return d+' days ago';if(d<60){const w=Math.floor(d/7);return w+(w===1?' week':' weeks')+' ago';}const mo=Math.floor(d/30);return mo+(mo===1?' month':' months')+' ago';}
async function decideFile(id,action){

  else toast((r.body&&r.body.message)||'Could not do that');

/* ── upload (images + PDF), reuses /media/upload-url ── */
async function dimsOf(file){
  if(!file.type.startsWith('image/'))return{};
  try{const bmp=await createImageBitmap(file);const d={width:bmp.width,height:bmp.height};bmp.close&&bmp.close();return d;}catch(_){return{};}
}
// ── item 115: a photo already in Files is named before it's stored twice ─────
// The page holds the bytes, so it works out each file's SHA-256 here; the server
// (GET /assets/match) answers from that, or, for files stored before anything
// kept a hash, from the exact size and pixels. A server from before this answers
// 404, and every file simply uploads as it always did.
async function fileHash(file){
  try{
    if(!(window.crypto&&crypto.subtle))return'';
    const d=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());
    return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(_){return'';}
}
async function repeatOf(file,dims,hash){
  const p=new URLSearchParams();
  if(hash)p.set('hash',hash);
  p.set('bytes',String(file.size));
  if(dims.width&&dims.height){p.set('width',String(dims.width));p.set('height',String(dims.height));}
  let r;try{r=await api('/assets/match?'+p.toString());}catch(_){return null;}
  const m=r&&r.ok&&r.body&&r.body.data&&r.body.data.match;
  return m&&m.id?m:null;
}
// One question for the whole batch. Skipping is the default (Escape too), so
// nothing is stored twice by accident. Resolves 'skip', 'keep', or {open:id}.
function askRepeats(list){
  return new Promise((resolve)=>{
    const one=list.length===1;
    const dlg=document.createElement('dialog');dlg.id='repeatDlg';
    dlg.style.cssText='border:none;border-radius:14px;padding:0;max-width:440px;width:92%;box-shadow:0 20px 60px rgba(30,19,56,.28);background:var(--card,#fff);color:var(--ink,#1b1525)';
    const box=document.createElement('div');box.style.cssText='padding:20px';
    const h=document.createElement('div');h.style.cssText='font-weight:600;margin-bottom:6px';
    h.textContent=one?'This is already in Files':`${list.length} of these are already in Files`;box.appendChild(h);
    const ul=document.createElement('ul');ul.className='rlist';
    list.forEach(({file,match})=>{
      const li=document.createElement('li');
      const th=document.createElement('span');th.className='rthumb';
      if(match.thumb)th.style.backgroundImage='url("'+String(match.thumb).replace(/["\\]/g,'')+'")';
      const t=document.createElement('span');
      const where=match.archived?' (in Archive)':match.folder?` (in the folder “${folderLabel(match.folder)}”)`:'';
      t.textContent=`“${file.name}” ${match.exact?'is the same file as':'looks the same as'} “${match.name}”${where}.`;
      li.appendChild(th);li.appendChild(t);ul.appendChild(li);
    });
    box.appendChild(ul);
    const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px';
    const mk=(label,primary)=>{const b=document.createElement('button');b.type='button';b.textContent=label;
      b.style.cssText=primary?'font:inherit;font-size:13px;font-weight:600;border:1px solid var(--p,#5b3fa0);background:var(--p,#5b3fa0);color:var(--on-p,#fff);border-radius:999px;padding:8px 16px;cursor:pointer':'font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line,#ddd);background:transparent;color:var(--ink,#1b1525);border-radius:999px;padding:8px 15px;cursor:pointer';
      return b;};
    let done=false;const finish=(v)=>{if(done)return;done=true;try{dlg.close();}catch(e){}dlg.remove();resolve(v);};
    const keep=mk('Upload anyway',false);keep.addEventListener('click',()=>finish('keep'));row.appendChild(keep);
    if(one){const op=mk('Open the one in Files',false);op.addEventListener('click',()=>finish({open:list[0].match.id}));row.appendChild(op);}
    const skip=mk(one?'Skip it':'Skip them',true);skip.addEventListener('click',()=>finish('skip'));row.appendChild(skip);
    box.appendChild(row);dlg.appendChild(box);document.body.appendChild(dlg);
    dlg.addEventListener('cancel',(e)=>{e.preventDefault();finish('skip');});
    dlg.showModal();setTimeout(()=>skip.focus(),20);
  });
}
async function uploadFiles(files){
  // Count what actually landed — the summary toast tells the truth ("Uploaded N ·
  // M failed"), instead of the old unconditional "Uploaded" over any failures.
  let ok=0,fail=0,firstErr='',skipped=0,openAfter='';
  const target=S.col==='folder'?S.folder:'';   // item 56: a file added inside a folder lands in it
  // item 115: look every file up first, so ONE question covers the batch
  const prep=[];
  for(const file of files){const dims=await dimsOf(file);const hash=await fileHash(file);prep.push({file,dims,hash,match:await repeatOf(file,dims,hash)});}
  let todo=prep;
  const reps=prep.filter(x=>x.match);
  if(reps.length){
    const ans=await askRepeats(reps);
    if(ans!=='keep'){todo=prep.filter(x=>!x.match);skipped=reps.length;if(ans&&ans.open)openAfter=ans.open;}
  }
  for(const {file,dims,hash} of todo){
    const isDoc=file.type==='application/pdf';
    let name=(file.name||'file').replace(/\.[a-z0-9]+$/i,'');
    // Never gate the upload on a modal or drop the file — default the alt text to the
    // filename (as documents already do); you can refine it in the detail panel after.
    let alt=name.trim().length>=3?name:'Photo';
    let up; try{up=await api('/media/upload-url','POST',{mime:file.type,bytes:file.size,alt_text:isDoc?name:alt,width:dims.width,height:dims.height,content_hash:hash||undefined});}catch(_){up={ok:false,body:{}};}
    if(!up.ok){fail++;firstErr=firstErr||(up.body&&up.body.message)||'';continue;}
    let put; try{put=await fetch(up.body.data.upload_url,{method:'PUT',headers:{'Content-Type':file.type},body:file});}catch(_){put={ok:false};}
    if(!put.ok){fail++;continue;}
    // Give EVERY upload a durable name, not just PDFs. This used to be `if(isDoc)`
    // — the reason a studio's photos all read "Photo" while its documents read
    // fine: only the PDF branch ever wrote metadata.title, so an image's only
    // name was its alt text (and 'Photo' when the filename was too short to use).
    // Writing the title here decouples NAME from DESCRIPTION for good: refining a
    // photo's alt text in the detail panel can never rename the file again.
    if(name.trim()||target)await api('/assets/'+up.body.data.media_id,'PATCH',{name,...(target?{collection:target}:{})}).catch(()=>{});
    ok++;
  }
  const skipNote=skipped?` · skipped ${skipped} already in Files`:'';
  toast(fail
    ?(ok?`Uploaded ${ok} · ${fail} failed${skipNote}`:(firstErr||'Uploads failed — nothing was added'))
    :ok?`Uploaded ${ok} file${ok===1?'':'s'}${skipNote}`
    :skipped?`Nothing new — ${skipped===1?'that file is':'those files are'} already in Files`:`Uploaded ${ok} files`);
  if(ok)await load();
  if(openAfter)openDetail(openAfter);
}
$('picker').onchange=(e)=>{const f=[...e.target.files];e.target.value='';if(f.length)uploadFiles(f);};
$('replacer').onchange=async(e)=>{
  const file=e.target.files[0];e.target.value='';if(!file||!S.current)return;

};
