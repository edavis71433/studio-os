<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What needs you — Studio OS</title>
<meta name="description" content="A calm look at what — if anything — needs your attention today.">
<style>
  :root{
    --bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;
    --accent:#5b3fa0;--accent-soft:#efeafa;--good:#3f7a5a;--good-soft:#e7f1ea;
    --warn:#8a6d3b;--warn-soft:#f3ead9;--shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.05);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--accent:#b79ceb;--accent-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;--accent:#5b3fa0;--accent-soft:#efeafa;--good:#3f7a5a;--good-soft:#e7f1ea;--warn:#8a6d3b;--warn-soft:#f3ead9}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--accent:#b79ceb;--accent-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:44px 22px 96px}
  a.back{font-size:13px;color:var(--soft);text-decoration:none} a.back:hover{color:var(--accent)}
  header h1{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.14;margin:.4em 0 .15em}
  header .sub{color:var(--soft);font-size:15.5px;margin:0;max-width:52ch}

  .group{margin-top:34px}
  .glabel{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:0 0 12px}

  .card{display:flex;gap:15px;background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:17px 19px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden}
  /* a calm tone rail — a hue, not an alarm */
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.55}
  .group.needs_attention .card::before{background:var(--accent)}
  .group.coming_soon .card::before{background:var(--faint)}
  .group.completed .card::before{background:var(--good)}
  .ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px}
  .group.completed .ic{background:var(--good-soft)}
  .cbody{flex:1;min-width:0}
  .ctitle{font-size:15.5px;font-weight:600;margin:0;line-height:1.35;color:var(--ink);text-wrap:pretty}
  .cwhy{margin:4px 0 0;font-size:14px;color:var(--soft);line-height:1.45}
  .cact{margin-top:12px}
  a.act{display:inline-block;font-size:14px;font-weight:600;color:#fff;background:var(--accent);border:1px solid var(--accent);
    border-radius:999px;padding:7px 16px;text-decoration:none;transition:filter .15s}
  a.act:hover{filter:brightness(1.06)} a.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .group.coming_soon a.act,.group.completed a.act{background:transparent;color:var(--accent)}
  .group.coming_soon a.act:hover,.group.completed a.act:hover{background:var(--accent-soft);filter:none}

  .center{text-align:center;padding:56px 20px}
  .center .mark{font-size:40px;display:block;margin-bottom:12px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:25px;margin:0 0 8px;color:var(--good)}
  .center .sub{color:var(--soft);font-size:15px;max-width:42ch;margin:0 auto}
  .center .links{margin-top:24px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  a.link{color:var(--accent);text-decoration:none;font-weight:600} a.link:hover{text-decoration:underline}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/today.html">← Back to Today</a>
    <h1 id="h1">What needs you</h1>
    <p class="sub" id="sub">A calm look at what — if anything — needs your attention today. Each thing tells you what happened, why it matters, and the one step to take.</p>
  </header>
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// CMS-UX-3 — the Website Attention Center, rendered.
// Consumes ONLY the existing read-only projection: GET /attention.
// It answers one question — "what needs my attention today?" — with calm cards.
// The server already returns presentation-safe fields; no jargon reaches here.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN = SUPABASE_URL + "/functions/v1/presence";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLIENT = new URLSearchParams(location.search).get('client') || '';
let TOKEN = "";
sb.auth.onAuthStateChange(function(_e,s){ if(s&&s.access_token) TOKEN=s.access_token; });

const H = () => ({ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN, 'x-dds-scope-site':CLIENT });
async function apiGet(p){ const r = await fetch(FN+p, { headers:H() }); if(r.status===401) return Promise.reject(401); return r.ok ? r.json() : Promise.reject(r.status); }

function href(link){
  if(!link) return null;
  if(!CLIENT) return link;
  const [b, h] = String(link).split('#');
  return b + (b.includes('?') ? '&' : '?') + 'client=' + encodeURIComponent(CLIENT) + (h ? '#'+h : '');
}

function cardHtml(c){
  const link = href(c.action_href);
  const act = (c.action_label && link) ? `<div class="cact"><a class="act" href="${esc(link)}">${esc(c.action_label)}</a></div>` : '';
  return `<article class="card">
    <span class="ic" aria-hidden="true">${esc(c.icon || '•')}</span>
    <div class="cbody">
      <p class="ctitle">${esc(c.title)}</p>
      ${c.why ? `<p class="cwhy">${esc(c.why)}</p>` : ''}
      ${act}
    </div>
  </article>`;
}

function allClear(){
  $('h1').textContent = 'You’re all caught up';
  $('sub').textContent = '';
  $('main').innerHTML = `<div class="center">
    <span class="mark" aria-hidden="true">🌿</span>
    <h2>Everything looks good.</h2>
    <p class="sub">Nothing needs you right now. If something ever deserves a look, it’ll show up here first — calmly, and only then.</p>
    <div class="links">
      <a class="link" href="${esc(href('/presence.html')||'/presence.html')}">Open your website</a>
      <span style="color:var(--soft)">·</span>
      <a class="link" href="${esc(href('/timeline.html')||'/timeline.html')}">Your website story</a>
    </div>
  </div>`;
}

function render(a){
  if(!a || !a.groups || !a.groups.length || a.status !== 'needs_attention'){
    // still show "Coming soon"/"Completed" if present, but lead with the all-clear feel
    const nonNeeds = (a && a.groups || []).filter((g) => g.key !== 'needs_attention');
    if(!nonNeeds.length){ allClear(); return; }
    $('h1').textContent = 'You’re all caught up';
    $('sub').textContent = 'Nothing needs you right now — here’s what’s coming up and what’s already done.';
    $('main').innerHTML = nonNeeds.map(groupHtml).join('');
    return;
  }
  $('sub').textContent = a.headline + ' Each one tells you what happened, why it matters, and the single step to take.';
  $('main').innerHTML = a.groups.map(groupHtml).join('');
}
function groupHtml(g){
  return `<section class="group ${esc(g.key)}">
    <p class="glabel">${esc(g.label)}</p>
    ${(g.cards||[]).map(cardHtml).join('')}
  </section>`;
}

function signedOut(){ $('sub').textContent=''; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2 style="color:var(--ink)">Sign in to see what needs you.</h2><p class="sub">Your website lives with your account — sign in to see anything waiting on you.</p><p style="margin-top:22px"><a class="link" href="/portal.html">Sign in →</a></p></div>`; }
function trouble(){ $('main').innerHTML = `<div class="center"><h2 style="color:var(--ink)">We couldn’t check just now.</h2><p class="sub">Nothing’s wrong with your website — this is only this page. Please refresh in a moment.</p></div>`; }

(async function init(){
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    const res = await apiGet('/attention');
    render(res && res.data);
  }catch(e){ if(e === 401){ signedOut(); return; } trouble(); }
})();
</script>
</body>
</html>
