<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your customer projects — tasks, milestones, files, messages, and approvals in one place.">
<!-- P2-D: Service Delivery on the ONE shared shell. Studio manages; a client sees only what's shared. -->
<link rel="stylesheet" href="/shell.css">
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--warn-soft:#f4ecdd;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d8b878;--warn-soft:#2a2338}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--line:#eee9e0;--p:#5b3fa0}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--line:#2a2338;--p:#b79ceb}
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#171320}}
  :root[data-theme="dark"] .btn:not(.ghost){color:#171320}
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 80px}
  h1{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:4px}
  .sub{color:var(--soft);font-size:14px;margin-bottom:20px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
  .chip.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  .btn{font:inherit;font-size:13.5px;font-weight:600;border:none;border-radius:9px;padding:8px 14px;background:var(--p);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.sm{font-size:12.5px;padding:6px 10px}
  .btn:disabled{opacity:.5;pointer-events:none}
  .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .card:hover{border-color:var(--p)}
  .card .t{font-weight:600}
  .card .m{color:var(--soft);font-size:13px;margin-top:2px}
  .pill{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .pill.complete{background:var(--good-soft);color:var(--good)}
  .pill.on_hold,.pill.archived{background:var(--warn-soft);color:var(--warn)}
  .prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
  .prog>i{display:block;height:100%;background:var(--p)}
  /* FIX D: the detail is a full-page in-page view (not a modal). It sits in the
     normal document flow inside its own .wrap, so the page scrolls naturally. */
  #detailInner{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow,0 1px 2px rgba(27,21,37,.05));overflow:hidden}
  .dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:start}
  .dbody{padding:18px 20px}
  .backbar{padding:14px 16px 0}
  .backbar .btn{padding:8px 14px}
  .sec{margin-top:18px}.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item .t{font-size:14px}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--soft);margin-left:6px}
  .tag.client{background:var(--p-soft);color:var(--p)}
  .tag.action{background:var(--warn-soft);color:var(--warn)}
  .tag.overdue{background:#f6dede;color:#9a3b3b}
  .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
  .stat{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
  .stat b{font-variant-numeric:tabular-nums;font-size:20px;font-family:var(--serif);font-weight:500}
  .stat span{display:block;font-size:12px;color:var(--soft)}
  form.mini{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  input,textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  textarea{min-height:70px;resize:vertical}
  label{font-size:12.5px;color:var(--soft);display:block;margin:2px 0 3px}
  .chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)}.chk input{width:auto}
  .mut{color:var(--soft);font-size:13px}
  a{color:var(--p)}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}

  /* ─────────────────────────────────────────────────────────────────────────
     DETAIL VIEW REDESIGN — "everything is so small" fix.
     The full-screen project view gets real breathing room: a wider page, a
     larger type scale, and each section as a roomy card. On wide screens the
     overview (progress + status) sits in a sticky side column while the working
     sections (milestones, tasks, files, approvals, surveys, support, messages)
     flow in the main column. It collapses to one comfortable column on mobile.
     Everything below is SCOPED to #detailInner so the projects list is untouched.
     ───────────────────────────────────────────────────────────────────────── */
  #detailWrap{max-width:1120px}
  #detailInner .backbar{padding:18px 22px 0}
  #detailInner .dhead{padding:20px 24px 22px}
  #detailInner #dtitle{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2}
  #detailInner .dhead .mut{font-size:14px;margin-top:6px}
  #detailInner .dbody{padding:22px 24px 28px}
  /* two-column on wide screens; single column (side first) on smaller ones */
  .dgrid{display:grid;gap:20px;align-items:start}
  @media(min-width:900px){.dgrid:not(.nosplit){grid-template-columns:310px minmax(0,1fr)}}
  .dside{display:flex;flex-direction:column;gap:16px;min-width:0}
  @media(min-width:900px){.dside{position:sticky;top:14px}}
  .dmain{display:flex;flex-direction:column;gap:16px;min-width:0}
  /* every section is now a card that breathes */
  #detailInner .sec{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  #detailInner .sec h3{font-family:var(--serif);font-weight:500;font-size:18px;text-transform:none;letter-spacing:normal;color:var(--ink);margin:0 0 12px;gap:10px}
  #detailInner .sec h3 .btn{font-size:12.5px}
  /* overview card: the at-a-glance numbers, enlarged */
  #detailInner .ov{background:var(--p-soft);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  #detailInner .ov .stat{gap:18px 22px;margin:0}
  #detailInner .ov .stat b{font-size:28px}
  #detailInner .ov .stat span{font-size:12.5px;margin-top:2px}
  #detailInner .ov .prog{height:10px;margin-top:14px}
  /* roomier rows + wrapping so long words never force a sideways scroll */
  #detailInner .item{padding:11px 0;gap:12px}
  #detailInner .item .t{font-size:15px;line-height:1.45;overflow-wrap:anywhere}
  #detailInner .sec .mut{font-size:14px}
  #detailInner .steps{gap:8px;margin:0}
  #detailInner .sec .btn.sm{font-size:13px;padding:7px 12px}
  /* Messages — the studio's main line to the client — reads a touch warmer */
  #detailInner .sec.msgs{border-color:var(--p);box-shadow:0 1px 3px rgba(91,63,160,.08)}
  #detailInner .sec.msgs form.mini textarea{min-height:90px}
  #detailInner .sec.msgs form.mini{background:var(--card)}
  #detailInner .sec form.mini{margin-top:12px}
  #detailInner .sec form.mini .btn:not(.ghost){padding:9px 18px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap" id="listWrap">
  <h1>Projects</h1>
  <div class="sub" id="sub">The work you do for your customers — tasks, files, and approvals in one place.</div>
  <div class="bar" id="filters" role="tablist" aria-label="Filter by status"></div>
  <div class="bar"><button class="btn" id="newProject" hidden>+ New project</button><span class="spacer"></span></div>
  <!-- FIX 5: project-less client requests are studio-wide (they belong to no single
       project) — surface them here so they're never silently dropped. -->
  <div id="clientMsgs"></div>
  <div id="list" aria-live="polite"></div>
</div>

<!-- FIX D: the project detail opens as a FULL-SCREEN in-page view (same tab), not a
     cramped modal overlay — matching the "editing opens full-screen" preference. -->
<div class="wrap" id="detailWrap" hidden><div id="detailInner"></div></div>

<dialog id="newDlg" aria-label="New project">
  <form id="newForm" class="dbody" style="max-height:none">
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:12px">New project</div>
    <label for="np-name">Project name</label>
    <input id="np-name" required maxlength="200" placeholder="e.g. Acme website build" autocomplete="off">
    <label for="np-desc" style="margin-top:10px">Description <span class="mut">(optional)</span></label>
    <textarea id="np-desc" maxlength="5000" placeholder="What's the scope?"></textarea>
    <label for="np-target" style="margin-top:10px">Target date <span class="mut">(optional)</span></label>
    <input id="np-target" type="date">
    <label for="np-customer" style="margin-top:10px">For an existing customer <span class="mut">(optional — they'll see this project in their workspace)</span></label>
    <select id="np-customer"><option value="">Just my studio (internal)</option></select>
    <label for="np-template" style="margin-top:10px">Start from</label>
    <select id="np-template"><option value="">Empty project</option><option value="website">Website build — a ready-made checklist</option></select>
    <div class="row2" style="justify-content:flex-end;margin-top:14px">
      <button type="button" class="btn ghost" id="np-cancel">Cancel</button>
      <button type="submit" class="btn">Create project</button>
    </div>
  </form>
</dialog>

<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scope=()=>new URLSearchParams(location.search).get('client')||'';
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':scope()});
// valid next stages mirror lib/service_delivery.ts (project + task ladders)
const P_NEXT={active:['on_hold','complete','archived'],on_hold:['active','complete','archived'],complete:['active','archived'],archived:['active']};
const T_NEXT={todo:['in_progress','blocked','done'],in_progress:['todo','blocked','done'],blocked:['todo','in_progress'],done:['todo','in_progress']};
const STATUSES=['active','on_hold','complete','archived'];
let TOKEN="",FILTER="",STUDIO=true;
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;}); // keep token fresh (auto-refresh)
const toast=(m,bad)=>{ if(window.ddsToast) window.ddsToast(m,bad?'err':'ok'); };
// Server errors that read like a sentence still show; raw technical junk doesn't.
const nice=(e)=>{const m=e&&e.message?String(e.message):'';return /^[A-Z]/.test(m)&&m.length<160&&!/[{}<>]|_|\bsql\b|\bpostgres/i.test(m)?m:'Something went wrong on our side — please try again.';};

async function api(path,method,body){
  const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});
  let b={}; try{b=await r.json();}catch(_){}
  if(!r.ok){const e=new Error((b&&b.message)||'That didn’t go through.');e.status=r.status;e.body=b;throw e;}
  return b;
}

function renderFilters(){
  const opts=[['','All'],...STATUSES.map(s=>[s,s[0].toUpperCase()+s.slice(1).replace('_',' ')])];
  $('filters').innerHTML=opts.map(([v,l])=>`<button role="tab" aria-selected="${v===FILTER?'true':'false'}" class="chip${v===FILTER?' on':''}" data-status="${v}">${esc(l)}</button>`).join('');
  $('filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{FILTER=b.dataset.status;renderFilters();load();});
}

async function load(){
  if(window.ddsSkeleton) window.ddsSkeleton($('list'),4);
  try{
    const res=await api('/projects'+(FILTER?('?status='+FILTER):''));
    STUDIO=res.is_studio_view!==false; $('newProject').hidden=!STUDIO;
    const items=res.data||[];
    if(!items.length){ if(window.ddsEmpty) window.ddsEmpty($('list'),{icon:'📁',title:'No projects yet',body:STUDIO?'Create a project to start managing a customer’s work — tasks, files, and approvals live here.':'Your projects will appear here.',actionLabel:STUDIO?'New project':'',onAction:STUDIO?openNew:null}); else $('list').innerHTML='<p class="mut">No projects yet.</p>'; return; }
    $('list').innerHTML=items.map(p=>`<div class="card" data-id="${p.id}" tabindex="0" role="button"><div><div class="t">${esc(p.name||'Untitled project')}</div><div class="m">${p.target_date?('Target '+esc(p.target_date)):'No target date'}${p.client_visible===false?' · internal':''}</div></div><span class="pill ${esc(p.status)}">${esc((p.status||'').replace('_',' '))}</span></div>`).join('');
    $('list').querySelectorAll('.card').forEach(c=>{const open=()=>openProject(c.dataset.id);c.onclick=open;c.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});
  }catch(e){ if(window.ddsError) window.ddsError($('list'),nice(e),load); else $('list').innerHTML='<p class="mut">'+esc(nice(e))+'</p>'; }
}

async function loadCustomerOptions(){
  const sel=$('np-customer'); if(!sel||sel.dataset.loaded)return;
  try{ const r=await api('/sales/deals'); const deals=(r.data||[]).filter(d=>d.converted_client_id);
    // de-dupe by customer (a customer may have several deals); newest title wins
    const seen={}; deals.forEach(d=>{ if(!seen[d.converted_client_id]) seen[d.converted_client_id]=d.title||'Customer'; });
    const opts=Object.keys(seen).map(cid=>`<option value="${esc(cid)}">${esc(seen[cid])}</option>`).join('');
    sel.innerHTML='<option value="">Just my studio (internal)</option>'+opts; sel.dataset.loaded='1';
  }catch(_){/* picker is optional — a manual internal project still works */}
}
function openNew(){ $('np-name').value='';$('np-desc').value='';$('np-target').value='';if($('np-customer'))$('np-customer').value='';if($('np-template'))$('np-template').value=''; $('newDlg').showModal(); loadCustomerOptions(); setTimeout(()=>$('np-name').focus(),20); }
$('newProject').onclick=openNew;
$('np-cancel').onclick=()=>$('newDlg').close();
$('newForm').onsubmit=async(e)=>{
  e.preventDefault();
  const name=$('np-name').value.trim(); if(!name){toast('A project needs a name.',true);return;}
  const btn=e.submitter; if(btn)btn.disabled=true;
  const body={name,description:$('np-desc').value.trim(),target_date:$('np-target').value||undefined};
  const cust=$('np-customer')&&$('np-customer').value; if(cust)body.customer_client_id=cust;
  const tmpl=$('np-template')&&$('np-template').value; if(tmpl)body.template=tmpl;
  try{ const r=await api('/projects','POST',body); $('newDlg').close(); toast(r.templated?'Project created with a starter checklist':'Project created'); await load(); openProject(r.data.id); }
  catch(err){ toast(nice(err),true); } finally{ if(btn)btn.disabled=false; }
};

function miniForm(host, fields, onSubmit){
  host.innerHTML='';
  const f=document.createElement('form'); f.className='mini'; const inputs={};
  fields.forEach(fl=>{
    if(fl.type==='checkbox'){ const w=document.createElement('label'); w.className='chk'; const el=document.createElement('input'); el.type='checkbox'; el.id='mf-'+fl.name; w.appendChild(el); w.appendChild(document.createTextNode(' '+fl.label)); f.appendChild(w); inputs[fl.name]=el; return; }
    const lab=document.createElement('label'); lab.textContent=fl.label; lab.htmlFor='mf-'+fl.name; f.appendChild(lab);
    const el=document.createElement(fl.type==='textarea'?'textarea':(fl.type==='select'?'select':'input')); el.id='mf-'+fl.name;
    if(fl.type==='select'){ (fl.options||[]).forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;el.appendChild(op);}); }
    else { if(fl.type&&fl.type!=='textarea') el.type=fl.type; if(fl.placeholder)el.placeholder=fl.placeholder; }
    f.appendChild(el); inputs[fl.name]=el;
  });
  const row=document.createElement('div'); row.className='row2'; row.style.justifyContent='flex-end';
  const cancel=document.createElement('button'); cancel.type='button'; cancel.className='btn ghost sm'; cancel.textContent='Cancel';
  const save=document.createElement('button'); save.type='submit'; save.className='btn sm'; save.textContent='Save';
  row.appendChild(cancel); row.appendChild(save); f.appendChild(row); host.appendChild(f);
  cancel.onclick=()=>host.innerHTML='';
  f.onsubmit=async(e)=>{e.preventDefault();save.disabled=true;try{const v={};for(const[k,el]of Object.entries(inputs))v[k]=el.type==='checkbox'?el.checked:el.value.trim();await onSubmit(v);}catch(err){toast(nice(err),true);save.disabled=false;}};
  setTimeout(()=>{const first=f.querySelector('input,textarea,select'); if(first)first.focus();},20);
}

// FIX D: show/hide the full-screen detail view (in-page, same tab) — the list and
// the detail are two panels of the ONE page; only one is visible at a time.
function showDetail(){ const l=$('listWrap'),d=$('detailWrap'); if(l)l.hidden=true; if(d)d.hidden=false; window.scrollTo(0,0); }
function hideDetail(){ const l=$('listWrap'),d=$('detailWrap'); if(d)d.hidden=true; if(l)l.hidden=false; }
function closeProjectDetail(){ hideDetail(); history.replaceState(null,'','projects.html'+(scope()?'?client='+scope():'')); const c=document.querySelector('#list .card'); if(c)c.focus(); }
async function openProject(id){
  history.replaceState(null,'','?project='+id+(scope()?'&client='+scope():''));
  // a11y: in-view actions re-open the same project to refresh. Remember whether the
  // detail was already showing so we can restore keyboard focus after the re-render.
  const wasOpen=!$('detailWrap').hidden;
  $('detailInner').innerHTML='<div class="dbody"><div class="dds-skeleton" style="height:16px;width:60%"></div></div>'; showDetail();
  try{
    const [{data},rep]=await Promise.all([api('/projects/'+id),api('/projects/'+id+'/report').catch(()=>null)]);
    const p=data.project; STUDIO=data.is_studio_view!==false;
    const rp=rep&&rep.data&&rep.data.summary;
    const nextP=(P_NEXT[p.status]||[]);
    const statusBtns=STUDIO?nextP.map(s=>`<button class="btn ghost sm" data-pstatus="${s}">${esc(s.replace('_',' '))}</button>`).join(''):'';
    const ms=(data.milestones||[]).map(m=>`<div class="item"><div class="t">${esc(m.title)}${m.client_visible?'':'<span class="tag">internal</span>'}</div><div class="row2">${m.status==='complete'?'<span class="pill complete">done</span>':(STUDIO?`<button class="btn ghost sm" data-mdone="${m.id}">Mark complete</button>`:'<span class="mut">open</span>')}</div></div>`).join('')||'<div class="mut">No milestones yet.</div>';
    const ts=(data.tasks||[]).map(t=>{const d=t.derived||{};return `<div class="item"><div class="t">${esc(t.title)}${t.client_visible?'<span class="tag client">shared</span>':''}${t.client_action_required?'<span class="tag action">your action</span>':''}${d.overdue?'<span class="tag overdue">overdue</span>':''}</div><div class="row2"><span class="mut">${esc(t.status.replace('_',' '))}</span>${STUDIO?(T_NEXT[t.status]||[]).map(s=>`<button class="btn ghost sm" data-task="${t.id}" data-to="${s}">${esc(s.replace('_',' '))}</button>`).join(''):''}</div></div>`;}).join('')||'<div class="mut">No tasks yet.</div>';
    const dl=(data.deliverables||[]).map(x=>`<div class="item"><div class="t">${esc(x.title)}${x.status==='shared'?'<span class="tag client">shared</span>':'<span class="tag">draft</span>'}</div><button class="btn ghost sm" data-dl="${x.id}">Download</button></div>`).join('')||'<div class="mut">No files yet.</div>';

// The owner can now READ the request + the client's messages and REPLY — the
// backend was always there; only the UI (mark-resolved only) was missing.
// Host-aware: the same conversation UI serves both the project's Support list
// (host=#supList) and a customer's General messages (host=#genList). `back`
// returns to whichever list opened it. Handlers are looked up WITHIN the host so
// two open conversations (one per list) never collide on a shared id.
async function openStudioSupport(rid,pid,opts){
  opts=opts||{}; const host=opts.host||$('supList'); const back=opts.back||(()=>loadSupport(pid,rid)); if(!host)return;
  try{
    const [r,srRes]=await Promise.all([api('/support/'+rid),api('/service/saved-replies').catch(()=>null)]); const d=r.data||{}; const rq=d.request||{}; const msgs=d.messages||[];
    const resolved=rq.status==='resolved'||rq.status==='closed';
    const isStudio=(k)=>k==='staff'||k==='operator'||k==='system';
    const thread=[]; if(rq.body)thread.push({author_kind:rq.requester_kind||'client',body:rq.body,created_at:rq.created_at}); thread.push(...msgs);
    const rowsHtml=thread.map(m=>`<div class="item"><div><div class="t">${esc(m.body)}</div><div class="mut">${isStudio(m.author_kind)?'You':'Client'}${m.created_at?' · '+esc(when(m.created_at)):''}</div></div></div>`).join('')||'<div class="mut">No messages yet.</div>';
    // Saved replies (service edge #4): the bodies live in a JS map keyed by id so
    // nothing goes into an attribute; the <select> only carries escaped titles.
    const replies=((srRes&&srRes.data&&srRes.data.replies)||[]); const replyMap={}; replies.forEach(x=>{replyMap[x.id]=x.body;});
    const pickerHtml=replies.length?`<select id="sr-canned-${rid}" aria-label="Insert a saved reply" style="margin-bottom:6px"><option value="">Insert a saved reply…</option>${replies.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select>`:'';
    host.innerHTML=`<div class="item"><div class="t">${esc(rq.subject||'Support request')} <span class="tag">${esc(rq.status||'open')}</span></div><button class="btn ghost sm" data-supback>← All requests</button></div>${rowsHtml}${resolved?'<div class="mut">This request is resolved.</div>':`<form class="mini" data-supreply><label for="sr-body-${rid}">Reply to the client</label>${pickerHtml}<textarea id="sr-body-${rid}" data-dds-draft="1" placeholder="Write a reply…"></textarea><div class="row2" style="justify-content:flex-end"><button class="btn sm" type="submit">Send reply</button>${(rq.status!=='resolved'&&rq.status!=='closed')?'<button class="btn ghost sm" type="button" data-supres>Resolve</button>':''}</div></form>`}`;
    host.querySelector('[data-supback]').onclick=()=>back();
    const sta=$('sr-body-'+rid); if(sta&&window.ddsDraftRestore)window.ddsDraftRestore(sta); // a half-written reply survives an accidental close/refresh
    const cn=$('sr-canned-'+rid); if(cn)cn.onchange=()=>{const b=replyMap[cn.value]; if(b&&sta){const cur=sta.value; sta.value=cur?(cur.replace(/\s*$/,'')+'\n\n'+b):b; sta.focus();} cn.value='';};
    const rf=host.querySelector('[data-supreply]'); if(rf)rf.onsubmit=async(e)=>{e.preventDefault();const body=sta.value.trim();if(!body)return;try{await api('/support/'+rid+'/messages','POST',{body});if(window.ddsDraftClear)window.ddsDraftClear(sta);openStudioSupport(rid,pid,opts);}catch(err){toast(nice(err),true);}};
    const rb=host.querySelector('[data-supres]'); if(rb)rb.onclick=async()=>{try{await api('/support/'+rid,'PATCH',{status:'resolved'});toast('Resolved');back();}catch(e){toast(nice(e),true);}};
  }catch(e){ toast('Couldn’t open that request.',true); }
}

    renderFilters(); await load(); loadClientMessages();
    const params=new URLSearchParams(location.search);
    const deep=params.get('project'); if(deep) openProject(deep);
    const sup=params.get('support'); if(sup) openStudioSupportFull(sup);
  }catch(_){ $('list').innerHTML='<p class="mut">We couldn’t load your projects just now.</p>'; }
})();
</script>
</body>
</html>
