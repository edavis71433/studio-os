<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your customer projects — tasks, milestones, files, messages, and approvals in one place.">
<!-- P2-D: Service Delivery on the ONE shared shell. Studio manages; a client sees only what's shared.
     Redesign slice 9: the roster is a Salesforce-style LIST VIEW (shared .lhead anatomy) and the
     project detail is a Lightning RECORD PAGE (breadcrumb → highlights → milestones-as-Path →
     two-column body). Zero new backend — every existing capability survives the reorganization. -->
<link rel="stylesheet" href="/fonts/brand.css">
<link rel="stylesheet" href="/shell.css">
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('dds-embed');</script>
<style>
html.dds-embed .dds-nav,html.dds-embed .dds-search,html.dds-embed #dds-mbar,html.dds-embed .dds-drawer,html.dds-embed #dds-offline{display:none!important}
html.dds-embed{--dds-shell-h:0px}
html.dds-embed body{padding-top:0!important;background:transparent}
html.dds-embed #listWrap{display:none!important}
html.dds-embed .crumbs{display:none!important}
html.dds-embed #detailWrap{padding-top:0}
</style>
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically) — same aliasing pattern
     as crm.html / customers.html / inbox.html. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#171320}:root:not([data-theme="light"]) .pstep.current{color:#171320}}
  :root[data-theme="dark"] .btn:not(.ghost){color:#171320}
  :root[data-theme="dark"] .pstep.current{color:#171320}
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1020px;margin:0 auto;padding:26px 20px 90px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}

  /* ── list-view header (SLDS list-view anatomy, dds skin) — kept in sync with
        customers.html / contacts.html / leads.html / inbox.html by hand
        (.lhead/.lrow1/.obj-ic/.lbtn/.lmeta + the Table ⇄ Cards seg) ── */
  .lhead{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 10px;margin-bottom:14px}
  .lrow1{display:flex;align-items:center;gap:6px}
  .obj-ic{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .lhead h1{font-family:var(--serif);font-weight:500;font-size:20px;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:8px;padding:5px 8px;cursor:pointer}
  .lbtn:hover{color:var(--p);background:var(--p-soft)}
  .lmeta{margin-top:6px;font-size:12px;color:var(--faint)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
  .seg button{border:none;border-radius:0;padding:6px 12px;font-size:12.5px;background:transparent;color:var(--soft);font-family:inherit;font-weight:600;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--p-soft);color:var(--p)}

  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer;font-family:inherit}
  .chip.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  .btn{font:inherit;font-size:13.5px;font-weight:600;border:none;border-radius:9px;padding:8px 14px;background:var(--p);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--p);color:var(--p)}
  .btn.sm{font-size:12.5px;padding:6px 10px}
  .btn:disabled{opacity:.5;pointer-events:none}
  .spacer{flex:1}

  /* ── the roster TABLE: sortable columns; scrolls in its OWN container ── */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  thead th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
  thead th .thb{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:none;padding:11px 14px;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:5px}
  thead th .thb:hover{color:var(--p)}
  thead th .arrow{font-size:10px;color:var(--p)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--p-soft)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  td .n{font-weight:600}
  /* the row's REAL control: the project name is a button (accessible name +
     native Enter/Space); the whole-row click stays as pointer convenience */
  td .rowlink{font:inherit;font-weight:600;color:var(--ink);background:none;border:none;padding:0;cursor:pointer;text-align:left}
  td .rowlink:hover{color:var(--p);text-decoration:underline}
  td.num{font-variant-numeric:tabular-nums}
  td .mutcell{color:var(--faint)}
  .pcell{min-width:130px}
  .pcell .pnum{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums}
  .prog{height:7px;border-radius:999px;background:var(--line);overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--p)}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge.wait{color:var(--warn);background:var(--warn-soft)}

  /* ── the card view (the original roster look, kept for small screens) ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:var(--shadow)}
  .card:hover{border-color:var(--p)}
  .card .t{font-weight:600}
  .card .m{color:var(--soft);font-size:13px;margin-top:2px}
  .card .cprog{margin-top:8px;max-width:220px}
  .pill{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .pill.complete{background:var(--good-soft);color:var(--good)}
  .pill.on_hold,.pill.archived{background:var(--warn-soft);color:var(--warn)}

  /* ── the RECORD PAGE (Lightning anatomy, dds skin — crm.html's patterns) ── */
  #detailWrap{max-width:1200px;margin:0 auto;padding:20px 20px 90px}
  .crumbs{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--soft);margin-bottom:12px;flex-wrap:wrap}
  .crumbs .crumb{font:inherit;border:none;background:none;color:var(--p);font-weight:600;cursor:pointer;padding:2px 4px;border-radius:6px}
  .crumbs .crumb:hover{background:var(--p-soft)}
  .crumbs [aria-current="page"]{color:var(--ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .rhead .obj-ic{width:44px;height:44px;border-radius:12px;font-size:20px;box-shadow:var(--shadow)}
  .rhead-t{min-width:0;flex:1}
  .rhead h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,4vw,32px);letter-spacing:-.01em;margin:0;line-height:1.2;overflow-wrap:anywhere}
  .rec-sub{color:var(--soft);font-size:14px;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
  .rhead-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  /* Status ▾ dropdown — the slice-2 popup contract (aria-expanded · Escape
     returns focus · outside click via the ONE document-level delegated closer) */
  .statusdd{position:relative}
  #statusMenu{position:absolute;top:calc(100% + 4px);right:0;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30}
  #statusMenu [role=menuitem]{display:block;width:100%;text-align:left;font:inherit;font-size:14px;border:none;background:none;color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
  #statusMenu [role=menuitem]:hover{background:var(--p-soft)}
  /* .rcar, not .car — shell.js's injected nav uses .car for its own caret and
     this page must never restyle the shell's markup */
  .rcar{font-size:10px;color:var(--faint)}

  /* highlights panel: label-over-value tiles */
  .hl-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:16px;box-shadow:var(--shadow)}
  .hl{background:var(--card);padding:10px 14px;min-width:0}
  .hl-k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .hl-v{font-family:var(--serif);font-size:17.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── the Path = milestones in order (Lightning chevrons, dds skin) ── */
  .pathcard{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
  .pathrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  ol.path{display:flex;flex:1 1 340px;min-width:0;list-style:none;padding:0;margin:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pstep{flex:1;min-width:72px;font-size:12.5px;font-weight:600;padding:9px 16px;text-align:center;
    background:var(--bg);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
  .pstep:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);border-radius:8px 0 0 8px}
  .pstep:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,11px 50%);border-radius:0 8px 8px 0}
  .pstep:only-child{clip-path:none;border-radius:8px}
  .pstep.done{background:var(--good-soft);color:var(--good)}
  .pstep.current{background:var(--p);color:#fff}
  .path-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .terminal-chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px}
  .terminal-chip.won{background:var(--good-soft);color:var(--good)}

  /* ── two-column body: related-list cards ── */
  .dbody{margin-top:18px}
  .dgrid{display:grid;gap:16px;align-items:start}
  @media(min-width:900px){.dgrid{grid-template-columns:minmax(0,1fr) 330px}}
  .dmain{display:flex;flex-direction:column;gap:14px;min-width:0}
  .dside{display:flex;flex-direction:column;gap:14px;min-width:0}
  /* .rsec, not .sec — shell.js's injected top-bar nav wraps every section in
     its OWN div.sec wrapper (shell.js nav markup); an unscoped .sec here
     would restyle the flat slice-7 bar into boxed buttons. Page classes must
     never collide with shell markup. */
  .rsec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .rsec h3{font-size:14.5px;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .rsec h3 .n{color:var(--faint);font-weight:600;font-size:12.5px;margin-left:2px}
  /* Messages keeps its intentional accent emphasis (the pre-slice styling) */
  #detailInner .rsec.msgs{border-color:var(--p);box-shadow:0 1px 3px rgba(91,63,160,.08)}
  #detailInner .rsec.msgs form.mini textarea{min-height:90px}
  #detailInner .rsec.msgs form.mini{background:var(--card)}
  .subhead{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:14px 0 4px}
  .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
  .item:last-child{border-bottom:none}
  .item .t{font-size:14px;line-height:1.45;overflow-wrap:anywhere;min-width:0}
  .item .t.donetext{color:var(--faint);text-decoration:line-through}
  .item .s{color:var(--faint);font-size:12.5px;display:block}
  .item input[type=checkbox]{accent-color:var(--p);width:16px;height:16px;flex:0 0 auto;margin:0}
  .titem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
  .titem:last-child{border-bottom:none}
  .titem .tmain{flex:1;min-width:0}
  .titem input[type=checkbox]{accent-color:var(--p);width:16px;height:16px;flex:0 0 auto;margin-top:3px}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--soft);margin-left:6px;white-space:nowrap}
  .tag.client{background:var(--p-soft);color:var(--p)}
  .tag.action{background:var(--warn-soft);color:var(--warn)}
  .tag.overdue{background:var(--warn-soft);color:var(--bad)}
  .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .empty{color:var(--soft);font-size:13.5px;padding:6px 0}
  .linkbtn{font:inherit;font-size:inherit;border:none;background:none;color:var(--p);font-weight:600;cursor:pointer;padding:0;text-decoration:none}
  .linkbtn:hover{text-decoration:underline}

  form.mini{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  input,textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  textarea{min-height:70px;resize:vertical}
  label{font-size:12.5px;color:var(--soft);display:block;margin:2px 0 3px}
  .chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)}.chk input{width:auto}
  .mut{color:var(--soft);font-size:13px}
  a{color:var(--p)}
  dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);max-width:480px;width:calc(100% - 40px);padding:18px 20px}
  dialog::backdrop{background:rgba(27,21,37,.4)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="/vendor/supabase-js-2.45.4.js"></script>
<script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap" id="listWrap">
  <header id="lhead"></header>
  <div class="bar" id="filters" role="tablist" aria-label="Filter by status"></div>
  <div class="bar"><button class="btn" id="newProject" hidden>+ New project</button><span class="spacer"></span></div>
  <!-- Cross-client client messages now live in the Inbox (grouped by client). This
       page is the projects list view + the project record page; a customer's own
       general messages live INSIDE their record page (loadClientGeneral). -->
  <div id="list" aria-live="polite"></div>
</div>

<!-- The project record opens as a FULL-SCREEN in-page view (same tab), not a
     cramped modal overlay — the list and the record are two panels of ONE page. -->
<div class="wrap" id="detailWrap" hidden><div id="detailInner"></div></div>

<dialog id="newDlg" aria-label="New project">
  <form id="newForm" style="max-height:none">
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:12px">New project</div>
    <label for="np-name">Project name</label>
    <input id="np-name" required maxlength="200" placeholder="e.g. Acme website build" autocomplete="off">
    <label for="np-desc" style="margin-top:10px">Description <span class="mut">(optional)</span></label>
    <textarea id="np-desc" maxlength="5000" placeholder="What's the scope?"></textarea>
    <label for="np-target" style="margin-top:10px">Target date <span class="mut">(optional)</span></label>
    <input id="np-target" type="date">
    <label for="np-customer" style="margin-top:10px">For an existing customer <span class="mut">(optional — they'll see this project in their workspace)</span></label>
    <select id="np-customer"><option value="">Just my studio (internal)</option></select>
    <label for="np-template" style="margin-top:10px">Start from</label>
    <select id="np-template"><option value="">Empty project</option><option value="website">Website build — a ready-made checklist</option></select>
    <div class="row2" style="justify-content:flex-end;margin-top:14px">
      <button type="button" class="btn ghost" id="np-cancel">Cancel</button>
      <button type="submit" class="btn">Create project</button>
    </div>
  </form>
</dialog>

<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scope=()=>new URLSearchParams(location.search).get('client')||'';
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':scope()});
// valid next stages mirror lib/service_delivery.ts (project + task ladders)
const P_NEXT={active:['on_hold','complete','archived'],on_hold:['active','complete','archived'],complete:['active','archived'],archived:['active']};
const T_NEXT={todo:['in_progress','blocked','done'],in_progress:['todo','blocked','done'],blocked:['todo','in_progress'],done:['todo','in_progress']};
const STATUSES=['active','on_hold','complete','archived'];
let TOKEN="",FILTER="",STUDIO=true;
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;}); // keep token fresh (auto-refresh)
const toast=(m,bad)=>{ if(window.ddsToast) window.ddsToast(m,bad?'err':'ok'); };
// Server errors that read like a sentence still show; raw technical junk doesn't.
const nice=(e)=>{const m=e&&e.message?String(e.message):'';return /^[A-Z]/.test(m)&&m.length<160&&!/[{}<>]|_|\bsql\b|\bpostgres/i.test(m)?m:'Something went wrong on our side — please try again.';};
const statusLabel=(s)=>String(s||'').replace('_',' ');

async function api(path,method,body){
  const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});
  let b={}; try{b=await r.json();}catch(_){}
  if(!r.ok){const e=new Error((b&&b.message)||'That didn’t go through.');e.status=r.status;e.body=b;throw e;}
  return b;
}

// ── roster state: items · per-project report cache · customer-name map ───────
let ITEMS=[],LOADED_AT=0;
const REPORTS={};          // project id → report summary (progress/approvals), fetched lazily
let CUSTMAP=null;          // client_id → customer name (studio only), fetched once
let CUSTTRIED=false;
const updatedLabel=()=>{const m=Math.floor((Date.now()-LOADED_AT)/60000);return m<1?'Updated just now':'Updated '+m+' min ago';};

// Table ⇄ Cards display choice, persisted; small screens default to Cards
// (customers.html's list-view mobile pattern, kept in sync by hand).
const DISPLAY_KEY='dds-display:projects';
let DISPLAY=(function(){try{const v=localStorage.getItem(DISPLAY_KEY);if(v==='table'||v==='cards')return v;}catch(_){/* storage may be denied */}
  return (window.matchMedia&&window.matchMedia('(max-width:759px)').matches)?'cards':'table';})();
function setDisplay(v){DISPLAY=v;try{localStorage.setItem(DISPLAY_KEY,v);}catch(_){/* */}renderRoster();}

// sortable columns — Progress/Open approvals sort on the lazily-fetched report
// numbers. A null key = unknown/undated: shown as "—", sorted LAST in BOTH
// directions by sortedRows (no fake numbers, no sentinel values).
const COLS=[
  ['name','Project',(p)=>String(p.name||'').toLowerCase()],
  ['customer','Customer',(p)=>customerName(p).toLowerCase()],
  ['status','Status',(p)=>String(p.status||'active')],
  ['progress','Progress',(p)=>{const r=REPORTS[p.id];return r&&r.progress?Number(r.progress.pct||0):null;}],
  ['target_date','Target',(p)=>p.target_date?String(p.target_date):null],
  ['approvals','Open approvals',(p)=>{const r=REPORTS[p.id];return r?Number(r.pending_approvals||0):null;}],
];
let SORT={key:'name',dir:1};

function customerName(p){
  if(!p.client_id)return 'Internal';
  if(CUSTMAP&&CUSTMAP[p.client_id])return CUSTMAP[p.client_id];
  return '—';
}

// ONE delegated closer for this page's popups (attached ONCE — re-renders would
// pile up per-render document listeners): a click outside .statusdd closes the
// record page's Status ▾ menu — the slice-2 popup contract, kept in sync by hand.
document.addEventListener('click',(e)=>{
  const sm=$('statusMenu'),sbtn=$('statusBtn');
  if(sm&&sbtn&&!sm.hidden&&!e.target.closest('.statusdd')){sm.hidden=true;sbtn.setAttribute('aria-expanded','false');}
});

function renderFilters(){
  const opts=[['','All'],...STATUSES.map(s=>[s,s[0].toUpperCase()+s.slice(1).replace('_',' ')])];
  $('filters').innerHTML=opts.map(([v,l])=>`<button role="tab" aria-selected="${v===FILTER?'true':'false'}" class="chip${v===FILTER?' on':''}" data-status="${v}">${esc(l)}</button>`).join('');
  $('filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{FILTER=b.dataset.status;renderFilters();load();});
}

// ── the shared list-view header (.lhead anatomy: 📁 icon · H1 · refresh · meta) ──
function headerHtml(){
  const n=ITEMS.length;
  const active=ITEMS.filter(p=>p.status==='active').length;
  const sortCol=COLS.find(x=>x[0]===SORT.key)||COLS[0];
  const mid=FILTER?` · ${esc(statusLabel(FILTER))}`:` · ${active} active`;
  return `<div class="lhead">
    <div class="lrow1">
      <span class="obj-ic" aria-hidden="true">📁</span>
      <h1 id="pagehead" tabindex="-1">Projects</h1>
      <div class="seg" role="group" aria-label="Display as">
        <button id="dispTable" aria-pressed="${DISPLAY==='table'?'true':'false'}">Table</button>
        <button id="dispCards" aria-pressed="${DISPLAY==='cards'?'true':'false'}">Cards</button>
      </div>
      <button class="lbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">↻</button>
    </div>
    <div class="lmeta">${n} project${n===1?'':'s'}${mid} · ${esc(updatedLabel())}${DISPLAY==='table'?` · Sorted by ${esc(sortCol[1])} — ${SORT.dir>0?'ascending':'descending'}`:''}</div>
  </div>`;
}

function sortedRows(){
  const list=ITEMS.slice();
  const col=COLS.find(x=>x[0]===SORT.key)||COLS[0];
  // unknown/undated (null) partitions to the END regardless of direction —
  // "—" rows never lead the list just because the direction flipped
  list.sort((a,b)=>{
    const av=col[2](a),bv=col[2](b);
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    return av<bv?-SORT.dir:av>bv?SORT.dir:0;
  });
  return list;
}

function progressCell(p){
  const r=REPORTS[p.id];
  if(!(r&&r.progress))return '<span class="mutcell">—</span>';
  const pct=Number(r.progress.pct||0);
  return `<div class="pcell"><div class="prog" role="img" aria-label="${pct}% complete"><i style="width:${pct}%"></i></div><span class="pnum">${Number(r.progress.done||0)}/${Number(r.progress.total||0)} tasks</span></div>`;
}
function approvalsCell(p){
  const r=REPORTS[p.id];
  if(!r)return '<span class="mutcell">—</span>';
  const n=Number(r.pending_approvals||0);
  return n?`<span class="badge wait">${n} waiting</span>`:'<span class="mutcell">0</span>';
}

function tableHtml(list){
  const ths=COLS.map(([k,label])=>{
    const on=SORT.key===k;
    return `<th scope="col"${on?` aria-sort="${SORT.dir>0?'ascending':'descending'}"`:''}><button type="button" class="thb" data-sort="${k}">${esc(label)}${on?`<span class="arrow" aria-hidden="true">${SORT.dir>0?'▲':'▼'}</span>`:''}</button></th>`;
  }).join('');
  const trs=list.map(p=>{
    const st=String(p.status||'active');
    const cust=customerName(p);
    return `<tr data-id="${esc(p.id)}">
      <td><button type="button" class="rowlink" data-open="${esc(p.id)}">${esc(p.name||'Untitled project')}</button>${p.client_visible===false?'<span class="tag">internal</span>':''}</td>
      <td>${cust==='Internal'?'<span class="mutcell">Internal</span>':(cust==='—'?'<span class="mutcell">—</span>':esc(cust))}</td>
      <td><span class="pill ${esc(st)}">${esc(statusLabel(st))}</span></td>
      <td>${progressCell(p)}</td>
      <td class="num">${p.target_date?esc(p.target_date):'<span class="mutcell">—</span>'}</td>
      <td class="num">${approvalsCell(p)}</td>
    </tr>`;
  }).join('');
  return `<div class="tscroll"><table aria-label="Projects"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

function cardsHtml(list){
  return list.map(p=>{
    const r=REPORTS[p.id];
    const cust=customerName(p);
    const prog=(r&&r.progress&&r.progress.total>0)?`<div class="cprog"><div class="prog"><i style="width:${Number(r.progress.pct||0)}%"></i></div><span class="pnum mut" style="font-size:11.5px">${Number(r.progress.done||0)}/${Number(r.progress.total||0)} tasks</span></div>`:'';
    return `<div class="card" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="Open ${esc(p.name||'Untitled project')}"><div style="min-width:0"><div class="t">${esc(p.name||'Untitled project')}</div><div class="m">${cust!=='—'&&cust!=='Internal'?esc(cust)+' · ':''}${p.target_date?('Target '+esc(p.target_date)):'No target date'}${p.client_visible===false?' · internal':''}</div>${prog}</div><span class="pill ${esc(p.status)}">${esc(statusLabel(p.status))}</span></div>`;
  }).join('');
}

function renderRoster(){
  $('lhead').innerHTML=headerHtml();
  const list=sortedRows();
  if(!list.length){
    if(window.ddsEmpty) window.ddsEmpty($('list'),{icon:'📁',title:FILTER?'Nothing in this view':'No projects yet',body:STUDIO?(FILTER?'No '+statusLabel(FILTER)+' projects right now — try “All”.':'Create a project to start managing a customer’s work — tasks, files, and approvals live here.'):'Your projects will appear here.',actionLabel:(STUDIO&&!FILTER)?'New project':'',onAction:(STUDIO&&!FILTER)?openNew:null});
    else $('list').innerHTML='<p class="mut">No projects yet.</p>';
  }else{
    $('list').innerHTML=DISPLAY==='table'?tableHtml(list):cardsHtml(list);
  }
  wireRoster();
}

// a11y: the async enrichment re-renders replace the roster DOM wholesale, which
// would drop keyboard focus to <body>. Capture the focused control's identity
// (control id · sort key · row data-id) and restore focus to its equivalent
// after the render; if it no longer exists, do nothing — never steal focus.
function renderRosterKeepFocus(){
  const ae=document.activeElement;let sel='';
  if(ae&&ae!==document.body&&$('listWrap')&&$('listWrap').contains(ae)){
    if(ae.id)sel='#'+ae.id;
    else if(ae.dataset&&ae.dataset.sort)sel='[data-sort="'+ae.dataset.sort+'"]';
    else{const row=ae.closest('[data-id]');if(row)sel='[data-id="'+row.dataset.id+'"]'+(ae.classList.contains('rowlink')?' .rowlink':'');}
  }
  renderRoster();
  if(sel){const el=$('listWrap').querySelector(sel);if(el)el.focus();}
}

function wireRoster(){
  // refresh (soft: a failed refresh toasts and keeps the list) + focus-return
  const rf=$('refreshBtn'); if(rf)rf.addEventListener('click',()=>load(true).then(()=>{const nr=$('refreshBtn');if(nr)nr.focus();}).catch(()=>toast('Couldn’t refresh just now.',true)));
  const dt=$('dispTable'); if(dt)dt.addEventListener('click',()=>{if(DISPLAY!=='table'){setDisplay('table');const nb=$('dispTable');if(nb)nb.focus();}});
  const dc=$('dispCards'); if(dc)dc.addEventListener('click',()=>{if(DISPLAY!=='cards'){setDisplay('cards');const nb=$('dispCards');if(nb)nb.focus();}});
  // sortable column headers — click toggles asc/desc (aria-sort on the <th>)
  $('list').querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    const k=b.getAttribute('data-sort');
    if(SORT.key===k)SORT.dir=-SORT.dir; else SORT={key:k,dir:1};
    renderRoster();
    const nb=$('list').querySelector('[data-sort="'+k+'"]'); if(nb)nb.focus();
  }));
  // the table row's REAL control: the project-name button (native Enter/Space)
  $('list').querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',(e)=>{e.stopPropagation();openProject(b.dataset.open);}));
  // whole-row/card click stays as pointer convenience; cards (role=button) also
  // keep Enter AND Space, like the other rosters
  $('list').querySelectorAll('[data-id]').forEach(el=>{
    const open=(e)=>{if(e.target.closest('button'))return;openProject(el.dataset.id);};
    el.addEventListener('click',open);
    el.addEventListener('keydown',(e)=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();openProject(el.dataset.id);}});
  });
}

async function load(soft){
  if(!soft&&window.ddsSkeleton) window.ddsSkeleton($('list'),4);
  try{
    const res=await api('/projects'+(FILTER?('?status='+FILTER):''));
    STUDIO=res.is_studio_view!==false; $('newProject').hidden=!STUDIO;
    ITEMS=res.data||[]; LOADED_AT=Date.now();
    renderRoster();
    // enrichment (existing routes only): customer names once + per-project report
    // summaries for Progress / Open approvals — cells fill in as they arrive.
    // These re-renders are async: keep the user's keyboard focus where it was.
    ensureCustomers().then((changed)=>{if(changed)renderRosterKeepFocus();});
    ensureReports().then((changed)=>{if(changed)renderRosterKeepFocus();});
  }catch(e){
    if(soft)throw e;
    if(window.ddsError) window.ddsError($('list'),nice(e),load); else $('list').innerHTML='<p class="mut">'+esc(nice(e))+'</p>';
  }
}

// customer names come from the existing /studio/customers roster route (studio
// only) — one cached fetch; a failure degrades to "—", never an error state.
async function ensureCustomers(){
  if(!STUDIO||CUSTMAP||CUSTTRIED)return false;
  CUSTTRIED=true;
  try{
    const r=await api('/studio/customers');
    const map={}; (r.data||[]).forEach(c=>{if(c.client_id&&c.name)map[c.client_id]=c.name;});
    CUSTMAP=map; return true;
  }catch(_){return false;}
}
// per-project report summaries (the existing /projects/:id/report route) for the
// Progress + Open approvals columns — parallel, cached, best-effort.
async function ensureReports(){
  const ids=ITEMS.map(p=>p.id).filter(id=>id&&!REPORTS[id]).slice(0,60);
  if(!ids.length)return false;
  let changed=false;
  await Promise.allSettled(ids.map(id=>api('/projects/'+id+'/report').then(r=>{const s=r&&r.data&&r.data.summary;if(s){REPORTS[id]=s;changed=true;}}).catch(()=>{})));
  return changed;
}

async function loadCustomerOptions(){
  const sel=$('np-customer'); if(!sel||sel.dataset.loaded)return;
  try{ const r=await api('/sales/deals'); const deals=(r.data||[]).filter(d=>d.converted_client_id);
    // de-dupe by customer (a customer may have several deals); newest title wins
    const seen={}; deals.forEach(d=>{ if(!seen[d.converted_client_id]) seen[d.converted_client_id]=d.title||'Customer'; });
    const opts=Object.keys(seen).map(cid=>`<option value="${esc(cid)}">${esc(seen[cid])}</option>`).join('');
    sel.innerHTML='<option value="">Just my studio (internal)</option>'+opts; sel.dataset.loaded='1';
  }catch(_){/* picker is optional — a manual internal project still works */}
}
function openNew(){ $('np-name').value='';$('np-desc').value='';$('np-target').value='';if($('np-customer'))$('np-customer').value='';if($('np-template'))$('np-template').value=''; $('newDlg').showModal(); loadCustomerOptions(); setTimeout(()=>$('np-name').focus(),20); }
$('newProject').onclick=openNew;
$('np-cancel').onclick=()=>$('newDlg').close();
$('newForm').onsubmit=async(e)=>{
  e.preventDefault();
  const name=$('np-name').value.trim(); if(!name){toast('A project needs a name.',true);return;}
  const btn=e.submitter; if(btn)btn.disabled=true;
  const body={name,description:$('np-desc').value.trim(),target_date:$('np-target').value||undefined};
  const cust=$('np-customer')&&$('np-customer').value; if(cust)body.customer_client_id=cust;
  const tmpl=$('np-template')&&$('np-template').value; if(tmpl)body.template=tmpl;
  try{ const r=await api('/projects','POST',body); $('newDlg').close(); toast(r.templated?'Project created with a starter checklist':'Project created'); await load(); openProject(r.data.id); }
  catch(err){ toast(nice(err),true); } finally{ if(btn)btn.disabled=false; }
};

function miniForm(host, fields, onSubmit){
  host.innerHTML='';
  const f=document.createElement('form'); f.className='mini'; const inputs={};
  fields.forEach(fl=>{
    if(fl.type==='checkbox'){ const w=document.createElement('label'); w.className='chk'; const el=document.createElement('input'); el.type='checkbox'; el.id='mf-'+fl.name; w.appendChild(el); w.appendChild(document.createTextNode(' '+fl.label)); f.appendChild(w); inputs[fl.name]=el; return; }
    const lab=document.createElement('label'); lab.textContent=fl.label; lab.htmlFor='mf-'+fl.name; f.appendChild(lab);
    const el=document.createElement(fl.type==='textarea'?'textarea':(fl.type==='select'?'select':'input')); el.id='mf-'+fl.name;
    if(fl.type==='select'){ (fl.options||[]).forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;el.appendChild(op);}); }
    else { if(fl.type&&fl.type!=='textarea') el.type=fl.type; if(fl.placeholder)el.placeholder=fl.placeholder; }
    f.appendChild(el); inputs[fl.name]=el;
  });
  const row=document.createElement('div'); row.className='row2'; row.style.justifyContent='flex-end';
  const cancel=document.createElement('button'); cancel.type='button'; cancel.className='btn ghost sm'; cancel.textContent='Cancel';
  const save=document.createElement('button'); save.type='submit'; save.className='btn sm'; save.textContent='Save';
  row.appendChild(cancel); row.appendChild(save); f.appendChild(row); host.appendChild(f);
  cancel.onclick=()=>host.innerHTML='';
  f.onsubmit=async(e)=>{e.preventDefault();save.disabled=true;try{const v={};for(const[k,el]of Object.entries(inputs))v[k]=el.type==='checkbox'?el.checked:el.value.trim();await onSubmit(v);}catch(err){toast(nice(err),true);save.disabled=false;}};
  setTimeout(()=>{const first=f.querySelector('input,textarea,select'); if(first)first.focus();},20);
}

// ── the Path = the project's milestones in order (chevron bar) ───────────────
// Rendered ONLY when the project has milestones; completed steps ✓ tinted, the
// single current step highlighted (aria-current="step"), future steps muted.
// Steps are presentational (an <ol>) — the ONE action is the studio-side
// "Mark Milestone Complete" button, wired to the existing milestone PATCH.
function pathHtml(milestones){
  if(!milestones.length)return '';   // no Path when the project has no milestones
  const curIdx=milestones.findIndex(m=>m.status!=='complete');
  const steps=milestones.map((m,i)=>{
    const done=m.status==='complete';
    const current=i===curIdx;
    const cls=done?'done':(current?'current':'todo');
    const state=done?'complete':(current?'current milestone':'upcoming');
    return `<li class="pstep ${cls}"${current?' aria-current="step"':''} title="${esc(m.title)} — ${state}">${done?'✓ ':''}${esc(m.title)}</li>`;
  }).join('');
  let side='';
  if(curIdx===-1)side='<span class="terminal-chip won">All milestones complete ✓</span>';
  else if(STUDIO)side=`<button class="btn sm" id="msComplete" data-ms="${esc(milestones[curIdx].id)}">Mark Milestone Complete</button>`;
  return `<div class="pathcard"><div class="pathrow"><ol class="path" aria-label="Milestones">${steps}</ol><div class="path-side">${side}</div></div></div>`;
}

async function openProject(id){
  history.replaceState(null,'','?project='+id+(scope()?'&client='+scope():''));
  // a11y: in-view actions re-open the same project to refresh. Remember whether the
  // record was already showing so we can restore keyboard focus after the re-render.
  const wasOpen=!$('detailWrap').hidden;
  $('detailInner').innerHTML='<div class="rsec"><div class="dds-skeleton" style="height:16px;width:60%"></div></div>'; showDetail();
  try{
    const [{data},rep]=await Promise.all([api('/projects/'+id),api('/projects/'+id+'/report').catch(()=>null)]);
    const p=data.project; STUDIO=data.is_studio_view!==false;
    const rp=rep&&rep.data&&rep.data.summary; if(rp)REPORTS[id]=rp;
    if(STUDIO)await ensureCustomers();   // the Customer highlight tile (cached after the first record)
    const cust=customerName(p);
    const nextP=(P_NEXT[p.status]||[]);

    // ── record header: breadcrumb · 📁 · serif title · status chip · actions ──
    const statusDd=(STUDIO&&nextP.length)?`<div class="statusdd">
        <button class="btn ghost sm" id="statusBtn" aria-haspopup="menu" aria-expanded="false">Status <span class="rcar" aria-hidden="true">▾</span></button>
        <div id="statusMenu" role="menu" aria-label="Change status" hidden>${nextP.map(s=>`<button role="menuitem" data-pstatus="${s}">Mark ${esc(statusLabel(s))}</button>`).join('')}</div>
      </div>`:'';
    const acts=STUDIO?`<div class="rhead-acts">${statusDd}<button class="btn ghost sm" id="renameProj">Rename</button><button class="btn ghost sm" id="quickTask">+ Task</button></div>`:'';

    // ── highlights: Customer · Target date · Progress · Waiting on client · Files
    //    (+ the old overview's remaining stats: open client actions when any
    //    exist, CSAT when the report carries ratings — omitted honestly otherwise) ──
    const hl=[
      ['Customer',esc(cust)],
      ['Target date',p.target_date?esc(p.target_date):'—'],
      ['Progress',rp&&rp.progress?`${Number(rp.progress.pct||0)}% <span style="font-family:var(--sans);font-size:12px;color:var(--soft)">· ${Number(rp.progress.done||0)}/${Number(rp.progress.total||0)} tasks</span>`:'—'],
      ['Waiting on client',rp?String(Number(rp.pending_approvals||0))+(Number(rp.pending_approvals||0)===1?' approval':' approvals'):'—'],
      ['Files',rp?String(Number(rp.shared_files||0))+' shared':'—'],
    ];
    if(rp&&Number(rp.open_client_actions||0)>0)hl.push(['Client actions',String(Number(rp.open_client_actions))+' open']);
    if(rp&&rp.csat&&Number(rp.csat.count||0)>0)hl.push(['CSAT',`${esc(String(rp.csat.average))}★ <span style="font-family:var(--sans);font-size:12px;color:var(--soft)">(${Number(rp.csat.count)})</span>`]);
    const hlHtml=`<div class="hl-panel">${hl.map(t=>`<div class="hl"><div class="hl-k">${t[0]}</div><div class="hl-v">${t[1]}</div></div>`).join('')}</div>`;

    // ── related lists ──
    const ms=(data.milestones||[]).map(m=>`<div class="item"><div class="t">${esc(m.title)}${m.client_visible?'':'<span class="tag">internal</span>'}${m.due_date?`<span class="s">due ${esc(m.due_date)}</span>`:''}</div><div class="row2" style="margin-top:0">${m.status==='complete'?'<span class="pill complete">done</span>':(STUDIO?`<button class="btn ghost sm" data-mdone="${m.id}">Mark complete</button>`:'<span class="mut">open</span>')}</div></div>`).join('')||'<div class="empty">No milestones yet — map the journey with + Add.</div>';
    const ts=(data.tasks||[]).map(t=>{
      const d=t.derived||{}; const done=t.status==='done';
      const canBox=done||(T_NEXT[t.status]||[]).includes('done');
      const box=STUDIO?`<input type="checkbox" data-tdone="${t.id}"${done?' checked':''}${canBox?'':' disabled'} aria-label="${canBox?(done?'Reopen':'Mark done')+': '+esc(t.title):esc(t.title)+' is blocked — move it to to-do or in progress first'}">`:'';
      const others=STUDIO?(T_NEXT[t.status]||[]).filter(s=>s!=='done'&&!(done&&s==='todo')).map(s=>`<button class="btn ghost sm" data-task="${t.id}" data-to="${s}">${esc(statusLabel(s))}</button>`).join(''):'';

    }).join('')||'<div class="empty">No tasks yet — add the first one.</div>';
    const dl=(data.deliverables||[]).map(x=>`<div class="item"><div class="t">${esc(x.title)}${x.status==='shared'?'<span class="tag client">shared</span>':'<span class="tag">draft</span>'}</div><button class="btn ghost sm" data-dl="${x.id}">Download</button></div>`).join('')||'<div class="empty">No files yet — share the first deliverable.</div>';
    const ap=(data.approvals||[]).map(a=>`<div class="item"><div class="t">${esc(a.title)} <span class="tag">${esc(a.status)}</span></div>${(!STUDIO&&a.status==='pending')?`<div class="row2" style="margin-top:0"><button class="btn sm" data-approve="${a.id}" data-hash="${esc(a.content_hash)}" data-dec="approved">Approve</button><button class="btn ghost sm" data-approve="${a.id}" data-hash="${esc(a.content_hash)}" data-dec="changes_requested">Changes</button></div>`:''}</div>`).join('')||'<div class="empty">Nothing waiting on an approval — request one when work is ready to review.</div>';

    $('detailInner').innerHTML=`
      <nav class="crumbs" aria-label="Breadcrumb"><button class="crumb" id="closeDetail">Projects</button><span aria-hidden="true">›</span><span aria-current="page">${esc(p.name)}</span></nav>
      <div class="rhead">
        <div class="obj-ic" aria-hidden="true">📁</div>
        <div class="rhead-t">
          <h1 id="dtitle" tabindex="-1">${esc(p.name)}</h1>
          <div class="rec-sub"><span class="pill ${esc(p.status)}">${esc(statusLabel(p.status))}</span>${p.client_visible===false?'<span class="tag">internal</span>':''}</div>
        </div>
        ${acts}
      </div>
      ${hlHtml}
      ${pathHtml(data.milestones||[])}

// The owner can READ the request + the client's messages and REPLY — host-aware:
// the same conversation UI serves both the project's Support list (host=#supList)
// and a customer's General messages (host=#genList). `back` returns to whichever
// list opened it. Handlers are looked up WITHIN the host so two open
// conversations (one per list) never collide on a shared id.
async function openStudioSupport(rid,pid,opts){
  opts=opts||{}; const host=opts.host||$('supList'); const back=opts.back||(()=>loadSupport(pid,rid)); if(!host)return;
  try{
    const [r,srRes]=await Promise.all([api('/support/'+rid),api('/service/saved-replies').catch(()=>null)]); const d=r.data||{}; const rq=d.request||{}; const msgs=d.messages||[];
    const resolved=rq.status==='resolved'||rq.status==='closed';
    const isStudio=(k)=>k==='staff'||k==='operator'||k==='system';
    const thread=[]; if(rq.body)thread.push({author_kind:rq.requester_kind||'client',body:rq.body,created_at:rq.created_at}); thread.push(...msgs);
    const rowsHtml=thread.map(m=>`<div class="item"><div><div class="t">${esc(m.body)}</div><div class="mut">${isStudio(m.author_kind)?'You':'Client'}${m.created_at?' · '+esc(when(m.created_at)):''}</div></div></div>`).join('')||'<div class="empty">No messages yet.</div>';
    // Saved replies (service edge #4): the bodies live in a JS map keyed by id so
    // nothing goes into an attribute; the <select> only carries escaped titles.
    const replies=((srRes&&srRes.data&&srRes.data.replies)||[]); const replyMap={}; replies.forEach(x=>{replyMap[x.id]=x.body;});
    const pickerHtml=replies.length?`<select id="sr-canned-${rid}" aria-label="Insert a saved reply" style="margin-bottom:6px"><option value="">Insert a saved reply…</option>${replies.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select>`:'';
    host.innerHTML=`<div class="item"><div class="t">${esc(rq.subject||'Support request')} <span class="tag">${esc(rq.status||'open')}</span></div><button class="btn ghost sm" data-supback>← All requests</button></div>${rowsHtml}${resolved?'<div class="empty">This request is resolved.</div>':`<form class="mini" data-supreply><label for="sr-body-${rid}">Reply to the client</label>${pickerHtml}<textarea id="sr-body-${rid}" data-dds-draft="1" placeholder="Write a reply…"></textarea><div class="row2" style="justify-content:flex-end"><button class="btn sm" type="submit">Send reply</button>${(rq.status!=='resolved'&&rq.status!=='closed')?'<button class="btn ghost sm" type="button" data-supres>Resolve</button>':''}</div></form>`}`;
    host.querySelector('[data-supback]').onclick=()=>back();
    const sta=$('sr-body-'+rid); if(sta&&window.ddsDraftRestore)window.ddsDraftRestore(sta); // a half-written reply survives an accidental close/refresh
    const cn=$('sr-canned-'+rid); if(cn)cn.onchange=()=>{const b=replyMap[cn.value]; if(b&&sta){const cur=sta.value; sta.value=cur?(cur.replace(/\s*$/,'')+'\n\n'+b):b; sta.focus();} cn.value='';};
    const rf=host.querySelector('[data-supreply]'); if(rf)rf.onsubmit=async(e)=>{e.preventDefault();const body=sta.value.trim();if(!body)return;try{await api('/support/'+rid+'/messages','POST',{body});if(window.ddsDraftClear)window.ddsDraftClear(sta);openStudioSupport(rid,pid,opts);}catch(err){toast(nice(err),true);}};
    const rb=host.querySelector('[data-supres]'); if(rb)rb.onclick=async()=>{try{await api('/support/'+rid,'PATCH',{status:'resolved'});toast('Resolved');back();}catch(e){toast(nice(e),true);}};
  }catch(e){ toast('Couldn’t open that request.',true); }
}

  }catch(_){ $('list').innerHTML='<p class="mut">We couldn’t load your projects just now.</p>'; }
})();
</script>
