<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website enquiries — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Messages people sent through your website — in one place.">
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--warn-soft:#f3ead9;--shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:34px 20px 90px}
  .rolebadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:5px 12px}
  header h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,5vw,32px);margin:14px 0 .1em;letter-spacing:-.01em}
  header .sub{color:var(--soft);font-size:15px;margin:0}
  .filters{display:flex;gap:8px;margin:22px 0 6px}
  .filters button{font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;padding:6px 13px;cursor:pointer}
  .filters button.on{background:var(--p-soft);color:var(--p);border-color:var(--p-soft)}
  .lead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
  .lead.new{border-left:3px solid var(--p)}
  .lead .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .lead .who{font-weight:600;font-size:15.5px}
  .lead .kindtag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--p);background:var(--p-soft);border-radius:999px;padding:2px 8px;font-weight:600}
  .lead .when{font-size:12.5px;color:var(--faint)}
  .lead .contact{font-size:13.5px;color:var(--soft);margin-top:2px}
  .lead .contact a{color:var(--p);text-decoration:none}
  .lead .msg{margin-top:10px;font-size:14.5px;white-space:pre-wrap}
  .lead .acts{display:flex;gap:8px;margin-top:14px}
  .lead .acts button{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
  .lead .acts button:hover{border-color:var(--p);color:var(--p)}
  .lead .acts a.reply{background:var(--p);color:#fff;border:1px solid var(--p);border-radius:999px;padding:6px 14px;text-decoration:none;font-size:12.5px;font-weight:600}
  .muted{color:var(--soft);font-size:14.5px}
  .center{text-align:center;padding:56px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px}
  a.link{color:var(--p);text-decoration:none;font-weight:600}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>Studio OS · Enquiries — everyone who reached out through your website, in one calm place.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- PT-5: one-time contextual tip -->
<div class="dds-hint" data-hint="leads-reply" hidden>Replying to someone here marks their message as handled — no extra step.</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="",ALL=[],FILTER='open';
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;}); // keep token fresh (auto-refresh)
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':(new URLSearchParams(location.search).get('client')||'')});
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
function toast(m){if(window.ddsToast)return void ddsToast(m);const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function when(iso){const d=Math.floor((Date.now()-Date.parse(iso))/86400000);if(d<=0)return'today';if(d===1)return'yesterday';if(d<7)return d+' days ago';if(d<60)return Math.floor(d/7)+' weeks ago';return Math.floor(d/30)+' months ago';}
const KIND={quote:'Quote request',booking:'Booking request',contact:'Message'};

function render(){
  const unread=ALL.filter(l=>l.status==='new').length;
  const rows=ALL.filter(l=>FILTER==='open'?l.status!=='archived':FILTER==='new'?l.status==='new':true);
  let h=`<div class="rolebadge">● Website enquiries</div>
    <header><h1>Website enquiries</h1><p class="sub">${unread?unread+' new · ':''}Everyone who reached out through your website.</p></header>
    <div class="filters">
      <button data-f="open" class="${FILTER==='open'?'on':''}">Open</button>
      <button data-f="new" class="${FILTER==='new'?'on':''}">New${unread?' ('+unread+')':''}</button>
      <button data-f="all" class="${FILTER==='all'?'on':''}">All</button>
    </div>`;
  if(!rows.length){h+=`<div class="center"><h2>Nothing yet.</h2><p class="muted">When someone fills in your website's contact form, it lands here — and in Customers.</p><p style="margin-top:16px"><a class="link" href="/crm.html">Open Customers →</a></p></div>`;}
  else for(const l of rows){
    const who=esc(l.name||l.email||l.phone||'Someone');
    h+=`<div class="lead ${l.status==='new'?'new':''}">
      <div class="top"><span class="who">${who}</span><span class="when">${esc(when(l.created_at))}</span></div>
      <div class="top"><span class="kindtag">${esc(KIND[l.form_kind]||'Message')}</span></div>
      <div class="contact">${l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`:''}${l.email&&l.phone?' · ':''}${l.phone?`<a href="tel:${esc(l.phone.replace(/[^0-9+]/g,''))}">${esc(l.phone)}</a>`:''}</div>
      ${l.message?`<div class="msg">${esc(l.message)}</div>`:''}
      <div class="acts">
        ${l.email?`<a class="reply" href="${replyHref(l)}" data-reply="${esc(l.id)}">Reply</a>`:(l.phone?`<a class="reply" href="tel:${esc(l.phone.replace(/[^0-9+]/g,''))}" data-reply="${esc(l.id)}">Call</a>`:'')}
        ${l.converted?`<a class="reply" href="/pipeline.html?deal=${esc(l.deal_id||'')}${(()=>{const c=new URLSearchParams(location.search).get('client');return c?'&client='+encodeURIComponent(c):'';})()}" title="This website enquiry is in your pipeline">✓ In pipeline — view deal</a>`:`<button data-deal="${esc(l.id)}" title="Start a deal in your pipeline from this website enquiry">→ Deal</button>`}
        ${l.status==='new'?`<button data-read="${esc(l.id)}">Mark read</button>`:''}
        ${l.converted?'':`<button data-arch="${esc(l.id)}">Archive</button>`}
      </div></div>`;
  }
  $('main').innerHTML=h;wire();
}
// Prefill the reply so responding to a customer is one tap, not a blank email.
function replyHref(l){
  const kind=l.form_kind==='quote'?'quote request':l.form_kind==='booking'?'booking request':'message';
  const subject=`Re: your ${kind}`;
  const hi=l.name?`Hi ${l.name.split(' ')[0]},`:'Hi,';
  const quoted=l.message?`\n\n> ${l.message.replace(/\n/g,'\n> ')}`:'';
  const body=`${hi}\n\nThanks for reaching out.${quoted}\n\n`;
  return `mailto:${encodeURIComponent(l.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function wire(){
  document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{FILTER=b.getAttribute('data-f');render();}));
  document.querySelectorAll('[data-read]').forEach(b=>b.addEventListener('click',()=>setStatus(b.getAttribute('data-read'),'read')));
  document.querySelectorAll('[data-arch]').forEach(b=>b.addEventListener('click',()=>setStatus(b.getAttribute('data-arch'),'archived')));
  // replying to a lead auto-marks it read — no manual bookkeeping
  document.querySelectorAll('[data-reply]').forEach(b=>b.addEventListener('click',()=>{const id=b.getAttribute('data-reply');const l=ALL.find(x=>x.id===id);if(l&&l.status==='new')setStatus(id,'read',true);}));
  document.querySelectorAll('[data-deal]').forEach(b=>b.addEventListener('click',()=>createDeal(b.getAttribute('data-deal'))));
  const rt=$('retry');if(rt)rt.addEventListener('click',load);
}
async function setStatus(id,status,silent){const r=await api('/forms/inbox/'+id,'POST',{status});if(r.ok){const l=ALL.find(x=>x.id===id);if(l)l.status=status;if(!silent){toast(status==='archived'?'Archived.':'Marked read.');render();}}else if(!silent)toast('That didn’t update.');}
// P2-C (Seam 3): promote a captured inquiry into a pipeline deal — no re-typing.
// Reuses the existing form submission as the deal's source (source_submission_id).
async function createDeal(id){
  const l=ALL.find(x=>x.id===id); if(!l)return;
  const title=(l.name||l.email||'New inquiry')+((l.form_kind&&l.form_kind!=='contact')?(' — '+l.form_kind):'');
  try{
    let contactId=null;
    if(l.email){const c=await api('/sales/contacts','POST',{name:l.name||'',email:l.email,phone:l.phone||''});if(c.ok)contactId=c.body&&c.body.data&&c.body.data.id;}
    const d=await api('/sales/deals','POST',{title,contact_id:contactId,source:'website_form',source_submission_id:id});
    if(!d.ok){toast(d.status===403?'Pipeline is part of Business OS.':((d.body&&d.body.message)||'Couldn’t start that deal.'));return;}
    const dealId=d.body&&d.body.data&&d.body.data.id;
    // reflect converted state locally (idempotent: server returns the existing deal on a repeat)
    l.converted=true; l.deal_id=dealId; if(l.status==='new')l.status='read';
    toast(d.body&&d.body.already_converted?'This enquiry is already in your pipeline.':'Added to your pipeline.'); render();
    const sc=new URLSearchParams(location.search).get('client')||'';
    if(dealId&&!(d.body&&d.body.already_converted))setTimeout(()=>{location.href='/pipeline.html?deal='+dealId+(sc?'&client='+sc:'');},800);
  }catch(_){toast('Couldn’t start that deal.');}
}
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to see your enquiries.</h2><p style="margin-top:18px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load your enquiries just now.</h2><p class="muted" style="margin-bottom:16px">It’s probably a brief hiccup.</p><button id="retry" style="font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--p);background:var(--p);color:#fff;padding:9px 18px;cursor:pointer">Try again</button></div>`;const rt=$('retry');if(rt)rt.addEventListener('click',load);}
async function load(){const r=await api('/forms/inbox');if(r.status===403){$('main').innerHTML=`<div class="center"><h2>Enquiries live in your studio workspace.</h2></div>`;return;}if(!r.ok){trouble();return;}ALL=(r.body.data&&r.body.data.submissions)||[];render();}
(async function(){try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";if(!TOKEN){signedOut();return;}await load();}catch(_){trouble();}})();
</script>
</body>
</html>
