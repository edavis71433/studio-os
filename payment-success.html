<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment received | Davis Digital Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root { --p:#5b3fa0; --ink:#1a1523; --muted:#7a6d8e; --cream:#faf8f4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border:1px solid rgba(91,63,160,0.12); border-radius:20px; padding:48px 40px; max-width:480px; text-align:center; }
  .mark { width:56px; height:56px; border-radius:16px; background:#3f7d5b; color:#fff; font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 22px; }
  h1 { font-family:'Fraunces',serif; font-weight:400; font-size:28px; margin-bottom:12px; }
  p { font-size:14.5px; line-height:1.65; color:var(--muted); margin-bottom:10px; }
  a.btn { display:inline-block; margin-top:18px; background:var(--p); color:#fff; text-decoration:none; padding:12px 26px; border-radius:100px; font-size:14px; font-weight:600; }
  a.plain { display:inline-block; margin-top:12px; color:var(--muted); font-size:13px; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✓</div>
    <h1>Payment received. Thank you.</h1>
    <p>Your payment went through securely via Stripe, and a receipt is on its way to your email.</p>
    <p>On my side, everything updates automatically — your invoice is already marked paid, and your project keeps moving.</p>
    <a class="btn" href="https://davisdigitalstudio.com/portal">Back to your portal →</a>
    <a class="plain" href="https://davisdigitalstudio.com">davisdigitalstudio.com</a>
  </div>
</body>
</html>
