<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business insights — Studio OS</title>
<meta name="description" content="A few calm observations about how your business and website are doing.">
<link rel="stylesheet" href="/cms.css">
<style>
  header .sub{color:var(--soft);font-size:15.5px;margin:0;max-width:54ch}

  .group{margin-top:32px}
  .glabel{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:0 0 13px;display:flex;gap:9px;align-items:center}
  .glabel .gi{font-size:15px}

  .obs{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:12px}
  .ob-lead{font-size:16px;font-weight:600;margin:0;line-height:1.4;color:var(--ink);font-family:var(--serif);font-weight:500}
  .ob-detail{margin:4px 0 0;font-size:14px;color:var(--soft)}
  .ob-meta{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
  .ob-row{display:flex;gap:9px;font-size:13.5px;line-height:1.45}
  .ob-row .lab{flex:none;font-weight:700;color:var(--faint);min-width:110px;font-size:12px;letter-spacing:.02em;text-transform:uppercase;padding-top:1px}
  .ob-row .val{color:var(--ink)}
  a.act{display:inline-block;margin-top:6px;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;transition:background .15s,border-color .15s}
  a.act:hover{background:var(--accent-soft);border-color:var(--accent)} a.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .center{text-align:center;padding:56px 20px}
  .center .mark{font-size:40px;display:block;margin-bottom:12px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px}
  .center .sub{color:var(--soft);font-size:15px;max-width:44ch;margin:0 auto}
  .foot{margin-top:32px;color:var(--faint);font-size:12.5px;text-align:center}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/today.html">← Back to Today</a>
    <h1>Business insights</h1>
    <p class="sub" id="sub">A few calm observations about how your business and website are doing — in plain words, only what we can actually see.</p>
  </header>
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
// CMS-UX-7 — Business Insights, rendered.
// Consumes ONLY the existing read-only projection: GET /business-insights.
// Every line is the platform's own evidence-backed observation — no charts,
// no fabricated numbers.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN = SUPABASE_URL + "/functions/v1/presence";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLIENT = new URLSearchParams(location.search).get('client') || '';
let TOKEN = "";
sb.auth.onAuthStateChange(function(_e,s){ if(s&&s.access_token) TOKEN=s.access_token; });

const H = () => ({ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN, 'x-dds-scope-site':CLIENT });
async function apiGet(p){ const r = await fetch(FN+p, { headers:H() }); if(r.status===401) return Promise.reject(401); return r.ok ? r.json() : Promise.reject(r.status); }
function href(link){ if(!link) return null; if(!CLIENT) return link; const [b,h]=String(link).split('#'); return b + (b.includes('?')?'&':'?') + 'client=' + encodeURIComponent(CLIENT) + (h?'#'+h:''); }

function obsHtml(o){
  const link = href(o.action_href);
  const act = (o.action_label && link) ? `<a class="act" href="${esc(link)}">${esc(o.action_label)}</a>` : '';
  return `<article class="obs">
    <p class="ob-lead">${esc(o.observation)}</p>
    ${o.detail ? `<p class="ob-detail">${esc(o.detail)}</p>` : ''}
    <div class="ob-meta">
      <div class="ob-row"><span class="lab">Why it matters</span><span class="val">${esc(o.why)}</span></div>
      <div class="ob-row"><span class="lab">Anything to do?</span><span class="val">${esc(o.should_i)}</span></div>
      ${act}
    </div>
  </article>`;
}
function groupHtml(g){
  return `<section class="group">
    <p class="glabel"><span class="gi" aria-hidden="true">${esc(((g.observations||[])[0]||{}).icon||'')}</span>${esc(g.label)}</p>
    ${(g.observations||[]).map(obsHtml).join('')}
  </section>`;
}

function render(b){
  const groups = (b && b.groups) || [];
  if(!groups.length){
    $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🌤️</span>
      <h2>Nothing to report just yet.</h2>
      <p class="sub">Once your website is published and starts getting visits and enquiries, calm observations about how it’s doing will appear here — only ever things we can actually measure.</p>
      <p style="margin-top:22px"><a class="link" href="${esc(href('/presence.html')||'/presence.html')}">Open your website →</a></p></div>`;
    return;
  }
  $('sub').textContent = 'A few calm observations about how your business is doing — only what we can actually see, no guesswork.';
  $('main').innerHTML = groups.map(groupHtml).join('')
    + `<p class="foot">These are observations, not advice — only things the platform can actually measure. Nothing here is estimated.</p>`;
}

function signedOut(){ $('sub').textContent=''; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2>Sign in to see your insights.</h2><p class="sub">Your business insights live with your account — sign in to see them.</p><p style="margin-top:22px"><a class="link" href="/studio.html">Sign in →</a></p></div>`; }
function trouble(){ $('main').innerHTML = `<div class="center"><h2>We couldn’t load your insights just now.</h2><p class="sub">Nothing’s wrong with your website — this is only this page. Please refresh in a moment.</p></div>`; }

(async function init(){
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    const res = await apiGet('/business-insights');
    render(res && res.data);
  }catch(e){ if(e === 401){ signedOut(); return; } trouble(); }
})();
</script>
</body>
</html>
