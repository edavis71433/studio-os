<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your website story — Studio OS</title>
<meta name="description" content="A calm, chronological look at what's been happening with your website.">
<style>
  :root{
    --bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;
    --accent:#5b3fa0;--accent-soft:#efeafa;--good:#3f7a5a;--good-soft:#e7f1ea;
    --warn:#8a6d3b;--warn-soft:#f3ead9;--shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.05);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--accent:#b79ceb;--accent-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;--accent:#5b3fa0;--accent-soft:#efeafa;--good:#3f7a5a;--good-soft:#e7f1ea;--warn:#8a6d3b;--warn-soft:#f3ead9}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--accent:#b79ceb;--accent-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:44px 22px 96px}
  a.back{font-size:13px;color:var(--soft);text-decoration:none} a.back:hover{color:var(--accent)}
  header h1{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.14;margin:.4em 0 .15em}
  header .sub{color:var(--soft);font-size:15.5px;margin:0;max-width:54ch}

  /* a date group */
  .group{margin-top:34px}
  .group.upcoming .glabel{color:var(--accent)}
  .glabel{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:0 0 4px}

  /* the timeline itself: a soft rail with icon nodes */
  ol.rail{list-style:none;margin:14px 0 0;padding:0;position:relative}
  ol.rail::before{content:"";position:absolute;left:19px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .group.upcoming ol.rail::before{background:repeating-linear-gradient(var(--line) 0 5px,transparent 5px 10px)}
  li.event{position:relative;display:flex;gap:16px;padding:0 0 20px}
  li.event:last-child{padding-bottom:2px}
  .node{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow);z-index:1}
  .body{flex:1;min-width:0;padding-top:2px}

  /* CMS-UX-2.1 — the milestone treatment: a warm, celebratory card. Calm, not loud. */
  li.event.is-milestone{padding-bottom:22px}
  li.event.is-milestone .node{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 0 0 5px var(--accent-soft),var(--shadow)}
  li.event.is-milestone .body{background:linear-gradient(180deg,var(--accent-soft),transparent);
    border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-top:-4px}
  li.event.is-milestone .etitle{font-family:var(--serif);font-weight:500;font-size:18px}
  li.event.is-milestone .mtag{display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:3px}
  .etitle{font-size:15.5px;font-weight:600;margin:0;line-height:1.35;color:var(--ink);text-wrap:pretty}
  .edesc{margin:3px 0 0;font-size:14px;color:var(--soft);line-height:1.45}
  .meta{margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
  .cat{color:var(--soft);font-weight:600}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);flex:none}
  a.go{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600;margin-left:auto;white-space:nowrap}
  a.go:hover{text-decoration:underline} a.go:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .center{text-align:center;padding:52px 20px}
  .center .mark{font-size:34px;display:block;margin-bottom:10px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px}
  .center .sub{color:var(--soft);font-size:15px;max-width:44ch;margin:0 auto}
  a.link{color:var(--accent);text-decoration:none;font-weight:600} a.link:hover{text-decoration:underline}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  .foot{margin-top:34px;color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  @media (max-width:520px){ .node{width:34px;height:34px;font-size:15px} ol.rail::before{left:16px} li.event{gap:13px} }
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/today.html">← Back to Today</a>
    <h1>Your website story</h1>
    <p class="sub" id="sub">A calm look back at everything that’s happened with your website — in plain words, newest first.</p>
  </header>
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// CMS-UX-2 — the Website Timeline, rendered.
// Consumes ONLY the existing read-only projection: GET /website-timeline.
// It shows a story, never a log: calm titles, relative time, a soft rail.
// No database words, no ids, no internal event names ever reach the screen —
// the server already returns presentation-safe fields.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN = SUPABASE_URL + "/functions/v1/presence";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLIENT = new URLSearchParams(location.search).get('client') || '';
let TOKEN = "";
sb.auth.onAuthStateChange(function(_e,s){ if(s&&s.access_token) TOKEN=s.access_token; });

const H = () => ({ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN, 'x-dds-scope-site':CLIENT });
async function apiGet(p){ const r = await fetch(FN+p, { headers:H() }); if(r.status===401) return Promise.reject(401); return r.ok ? r.json() : Promise.reject(r.status); }

// keep the agency drill-in scope on any hop into another page
function href(link){
  if(!link) return null;
  if(!CLIENT) return link;
  const [base, hash] = String(link).split('#');
  return base + (base.includes('?') ? '&' : '?') + 'client=' + encodeURIComponent(CLIENT) + (hash ? '#'+hash : '');
}

function eventRow(e){
  const link = href(e.href);
  const go = link ? `<a class="go" href="${esc(link)}">${esc(e.related_page ? 'Open '+e.related_page : 'View')}</a>` : '';
  const bits = [];
  if(!e.milestone && e.category) bits.push(`<span class="cat">${esc(e.category)}</span>`);
  if(e.actor) bits.push(`<span>${esc(e.actor)}</span>`);
  if(e.when) bits.push(`<span>${esc(e.when)}</span>`);
  const meta = bits.join('<span class="dot"></span>');
  // milestones get a second, celebratory treatment — same rail, warmer card
  const tag = e.milestone ? `<span class="mtag">Milestone</span>` : '';
  return `<li class="event${e.milestone ? ' is-milestone' : ''}">
    <span class="node" aria-hidden="true">${esc(e.icon || '•')}</span>
    <div class="body">
      ${tag}
      <p class="etitle">${esc(e.title)}</p>
      ${e.description ? `<p class="edesc">${esc(e.description)}</p>` : ''}
      <div class="meta">${meta}${go}</div>
    </div>
  </li>`;
}

function render(t){
  const groups = (t && t.groups) || [];
  if(!groups.length){
    $('main').innerHTML = `<div class="center">
      <span class="mark" aria-hidden="true">🌱</span>
      <h2>Your story starts soon.</h2>
      <p class="sub">Once you publish, edit a page, or hear from a visitor, it’ll all show up here — calmly, newest first. Nothing to set up.</p>
      <p style="margin-top:22px"><a class="link" href="${esc(href('/presence.html')||'/presence.html')}">Open your website →</a></p>
    </div>`;
    return;
  }
  if(t.last_activity_when){
    $('sub').textContent = `Last updated ${t.last_activity_when}. Everything that’s happened with your website, newest first.`;
  }
  let html = '';
  for(const g of groups){
    html += `<section class="group ${g.key==='upcoming'?'upcoming':''}">
      <p class="glabel">${esc(g.label)}</p>
      <ol class="rail">${(g.events||[]).map(eventRow).join('')}</ol>
    </section>`;
  }
  html += `<p class="foot">This is a look back — it never changes anything. Editing happens in your website, and nothing goes live until you publish.</p>`;
  $('main').innerHTML = html;
}

function signedOut(){ $('sub').textContent=''; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2>Sign in to see your website story.</h2><p class="sub">Your website’s history lives with your account — sign in to look back over it.</p><p style="margin-top:22px"><a class="link" href="/portal.html">Sign in →</a></p></div>`; }
function trouble(){ $('main').innerHTML = `<div class="center"><h2>We couldn’t load your story just now.</h2><p class="sub">Nothing’s wrong with your website — this is only this page. Please refresh in a moment.</p></div>`; }

(async function init(){
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    const res = await apiGet('/website-timeline');
    render(res && res.data);
  }catch(e){ if(e === 401){ signedOut(); return; } trouble(); }
})();
</script>
</body>
</html>
