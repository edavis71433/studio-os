<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<meta name="description" content="Page not found.">
<link rel="stylesheet" href="/fonts/brand.css">
<!-- Builder item 349: the one public frame (the studio's band, a card, its contact line).
     This page answers every missing address on the app, so every link in it is absolute. -->
<link rel="stylesheet" href="/public-frame.css">
<script src="/public-frame.js" defer></script>
</head>
<body data-page="404">
<header class="pf-band" data-pf-band><div class="pf-in"><div class="pf-studio" id="pf-studio" data-pf-studio aria-live="polite"></div></div></header>
<main class="pf-wrap" id="main-content" tabindex="-1"><div class="pf-card pf-center" data-pf-card>
  <h1>That page isn’t here.</h1>
  <p class="pf-lead">The link may be out of date, or the address has a typo in it.</p>
  <p>Check the link you were sent and try it again. If it came in an email, the newest email has the right one.</p>
  <button type="button" class="pf-btn" id="back" hidden>Go back</button>
  <a class="pf-btn pf-ghost" id="signin" href="/portal.html">Client sign in</a>
</div></main>
<footer class="pf-foot" data-pf-foot></footer>
<script>
  (function () {
    var back = document.getElementById('back');
    if (history.length > 1) { back.hidden = false; back.addEventListener('click', function () { history.back(); }); }
    // the sign-in door keeps the studio when the address named one
    var id = '';
    try { id = String(new URLSearchParams(location.search).get('studio') || ''); } catch (e) {}
    if (/^[0-9a-f-]{36}$/.test(id)) document.getElementById('signin').href = '/portal.html?studio=' + id;
  })();
</script>
</body>
</html>
