<!-- ═══════════════════════════════════════════════════════════════════════
  To-dos (sales item 85, Nov 2026; drawn in Figma, section 261:442).
  Every open to-do in one list: the ones on deals, the ones for a person or a
  customer with no deal, your own, each deal's next step and the studio's own
  project steps (GET /sales/tasks: Home's My tasks, all of it, plus what was done
  in the last 30 days). Grouped Overdue · Today · This week · Later · No date by
  the local day. Add one for anyone (POST /sales/tasks). Done uses the route that
  owns each kind, as Home's card does, and every Done has an Undo.
═════════════════════════════════════════════════════════════════════════ -->
<style>
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);
    --bad:var(--dds-bad,#a3423a);--bad-soft:var(--dds-bad-soft,#fbeaea);--warn:var(--dds-warn,#7a5417);--warn-soft:var(--dds-warn-soft,#fdf1dc);
    --good:var(--dds-good,#2f6b48);--good-soft:var(--dds-good-soft,#e5f2ea);--tag:var(--dds-tag,#f1eff5);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bad-soft:#3d2224;--warn-soft:#3a2f1a;--good-soft:#1d3327;--tag:#2a2536}}
  :root[data-theme="dark"]{--bad-soft:#3d2224;--warn-soft:#3a2f1a;--good-soft:#1d3327;--tag:#2a2536}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:var(--dds-s6,24px) var(--dds-s5,20px) 90px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .head .grow{flex:1 1 320px;min-width:0}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1.2}
  .lede{color:var(--soft);font-size:15px;margin:4px 0 0}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--dds-line-strong,#d6d4e2);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .pill:hover{background:var(--p-soft)}
  .forpick{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--dds-line-strong,#d6d4e2);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;max-width:260px}
  /* the counts, as chips: each shows its part of the list */
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .stat{font:inherit;display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px;min-height:40px;cursor:pointer;box-shadow:var(--shadow)}
  .stat b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .stat span{font-size:14px;font-weight:500}
  .stat.over{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
  .stat.today b{color:var(--warn)}
  .stat.done b{color:var(--faint)}
  .stat[aria-pressed="true"]{background:var(--dds-grad-btn,var(--p));border-color:transparent;color:var(--dds-on-p,#fff)}
  .stat[aria-pressed="true"] b{color:inherit}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat[aria-pressed="true"],:root:not([data-theme="light"]) .addgo{color:#171320}}
  :root[data-theme="dark"] .stat[aria-pressed="true"],:root[data-theme="dark"] .addgo{color:#171320}
  /* sales item 37: Mine / Everyone, with a second person on the team; each to-do's owner in Everyone */
  .owntog{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--p) 12%,var(--card))}
  .owntog button{font:inherit;font-size:14px;font-weight:600;border:none;border-radius:999px;padding:7px 14px;min-height:34px;background:none;color:var(--soft);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .owntog button[aria-pressed="true"]{background:var(--p);color:var(--dds-on-p,#fff)}
  .owntog .n{font-size:12.5px;font-weight:700;opacity:.8}
  .ownc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--soft);background:var(--tag);border-radius:999px;padding:2px 10px 2px 3px;white-space:nowrap}
  .ownc::before{content:attr(data-ini);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;background:#2f7d74}
  .ownc.me::before{background:var(--p)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .owntog button[aria-pressed="true"]{color:#171320}}
  :root[data-theme="dark"] .owntog button[aria-pressed="true"]{color:#171320}
  /* add one, for anyone */
  .add{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:16px}
  .add input[type=text]{flex:1 1 260px;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
  .add input[type=date],.add select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--dds-line-strong,#d6d4e2);border-radius:999px;padding:8px 14px;min-height:44px;max-width:240px}
  .add input:focus,.add select:focus{outline:2px solid var(--p);outline-offset:1px}
  .addgo{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:999px;padding:10px 22px;min-height:44px;cursor:pointer;background:var(--dds-grad-btn,var(--p));color:var(--dds-on-p,#fff);box-shadow:0 6px 16px -8px var(--p)}
  .addgo[disabled]{opacity:.6;cursor:default}
  /* the list */
  .list{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .ghead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
  .ghead.over{color:var(--bad)}.ghead.today{color:var(--warn)}.ghead.done{color:var(--good)}
  .glink{font:inherit;font-size:13.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--p);background:none;border:0;cursor:pointer;padding:6px 0;min-height:32px}
  .trow{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--line);min-height:52px}
  .tick{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:2px solid var(--dds-line-strong,#cfcbd9);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0;color:#fff}
  .tick:hover{border-color:var(--p)}
  .tick[disabled]{cursor:not-allowed;opacity:.5}
  .tick.on{background:var(--good);border-color:var(--good)}
  .tick svg{width:14px;height:14px}
  .tmain{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ttl{font-weight:600;font-size:15px}
  .trow.isdone .ttl{color:var(--soft);font-weight:500;text-decoration:line-through;text-decoration-color:var(--faint)}
  .who{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--p);background:var(--p-soft);border-radius:999px;padding:3px 10px;text-decoration:none;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who:hover{text-decoration:underline}
  .who svg{width:14px;height:14px;flex:0 0 auto}
  .kind{font-size:12.5px;font-weight:600;color:var(--soft);background:var(--tag);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .due{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--tag);color:var(--soft);flex:0 0 auto}
  .due.over{background:var(--bad-soft);color:var(--bad)}.due.today{background:var(--warn-soft);color:var(--warn)}
  .donewhen{font-size:13px;color:var(--faint);white-space:nowrap}
  .undo{font:inherit;font-size:13.5px;font-weight:600;color:var(--p);background:none;border:0;cursor:pointer;padding:6px 4px;min-height:32px}
  .partial{margin:0 0 12px;font-size:14px;color:var(--bad)}
  .empty{text-align:center;padding:40px 20px;color:var(--soft)}
  .empty h2{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .center{text-align:center;padding:48px 12px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:8px}
  .muted{color:var(--soft);font-size:14.5px}
  .link{color:var(--p);font-weight:600}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;margin:60px auto;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (max-width:767px){
    .wrap{padding:16px 16px 100px}
    h1{font-size:26px}
    .tools{width:100%}.forpick{flex:1 1 auto;max-width:none;min-height:44px}.pill{min-height:44px}
    .owntog{flex:1 1 100%}.owntog button{flex:1 1 0;justify-content:center;min-height:44px}
    .stats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:12px -16px;padding:2px 16px 8px}
    .stats::-webkit-scrollbar{display:none}
    .stat{flex:0 0 auto;min-height:44px}
    .add input[type=text]{flex-basis:100%}
    .add input[type=date]{flex:0 1 150px;min-width:0;max-width:none}   /* the day and who it's for share a row, as drawn */
    .add select{flex:1 1 120px;min-width:0;max-width:none}
    .addgo{margin-left:auto}
    .trow{align-items:flex-start;padding:12px 16px}
    .ghead{padding:14px 16px 4px}
    .tmain{flex-direction:column;align-items:flex-start;gap:6px}
    .tmain .chips{display:flex;flex-wrap:wrap;gap:6px}
    .tick{width:28px;height:28px;margin-top:-2px}
    .tick::before{content:'';position:absolute;inset:-8px}   /* a 44px target around the ring */
    .tick{position:relative}
  }
  @media (min-width:768px){.tmain .chips{display:contents}}
</style>

<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="",DATA=null,SHOW='open',WHO='',OPENED=new Set(),PICK=null,DRAFT={title:'',due:'',for:'',owner:''};
// ── Sales item 37: Mine and Everyone ──────────────────────────────────────────
// With a second person on the team (/agency/members: the people who have signed in),
// To-dos opens on Mine: your to-dos and the next steps of your deals. Everyone shows
// the team's, each with its owner. A to-do or deal with no owner is the business
// owner's; a project step on this list is always yours or nobody's. The choice is
// remembered on this device. With one person, nothing changes.
let TEAM=null,MINE=true;
try{MINE=localStorage.getItem('dds-todos-mine')!=='0';}catch(_){/* storage may be denied */}
const teamOn=()=>!!(TEAM&&TEAM.people.length>1);
const ownerOfItem=(t)=>t&&t.owner?String(t.owner):(TEAM?TEAM.owner:'');
const mineItem=(t)=>!teamOn()||t.kind==='project_task'||ownerOfItem(t)===TEAM.me;
const iniOf=(s)=>{const w=String(s||'').trim().split(/[\s._-]+/).filter(Boolean);return w.length?(w[0][0]+(w[1]?w[1][0]:'')).toUpperCase():'?';};
let TEAM_P=null;
const teamOnce=()=>TEAM_P||(TEAM_P=loadTeam().catch(()=>{TEAM=null;}));
async function loadTeam(){
  const [me,mem]=await Promise.all([api('/agency/me'),api('/agency/members')]);
  const list=mem.ok&&mem.body&&Array.isArray(mem.body.data)?mem.body.data:[];
  const myId=(me.ok&&me.body&&me.body.data&&me.body.data.member_id)||'';
  const myRow=list.find(m=>m.id===myId),meUid=myRow&&myRow.user_id?String(myRow.user_id):'';
  if(!meUid){TEAM=null;return;}
  const nameOf=(m)=>{const l=String(m.email||'').split('@')[0]||'Teammate';return l.charAt(0).toUpperCase()+l.slice(1);};
  const people=list.filter(m=>m&&(m.status||'active')==='active'&&m.user_id).map(m=>({uid:String(m.user_id),label:String(m.user_id)===meUid?'You':nameOf(m),ini:iniOf(nameOf(m)),me:String(m.user_id)===meUid}));
  const own=list.find(m=>m.role==='owner'&&m.user_id&&(m.status||'active')==='active');
  TEAM={me:meUid,owner:own?String(own.user_id):meUid,people};
}
function ownChip(t){
  if(!teamOn()||MINE||t.kind==='project_task')return'';
  const p=TEAM.people.find(x=>x.uid===ownerOfItem(t));if(!p)return'';
  return `<span class="ownc${p.me?' me':''}" data-ini="${esc(p.ini)}" title="Owner: ${esc(p.label)}">${p.me?'Yours':esc(p.label)}</span>`;
}
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;});
const scope=()=>new URLSearchParams(location.search).get('client')||'';
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':scope()});
async function api(path,method,body){let r;try{r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});}catch(_){return{ok:false,status:0,body:{}};}return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
function toast(m,bad,action){if(window.ddsToast)return void ddsToast(m,bad?'err':'ok',action);}
const ICON={person:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5A5 5 0 0 1 21.5 20"/>',deal:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="9.5" y="4" width="5" height="10" rx="1"/><rect x="16" y="4" width="5" height="13" rx="1"/>',project:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',check:'<path d="M5 12l5 5 9-10"/>',print:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>'};
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICON[k]}</svg>`;
// the local day, and how far a day is from it
function ymd(ms){const d=ms==null?new Date():new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const dayDiff=(a,b)=>Math.round((Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10))-Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10)))/86400000);
const niceDay=(s,long)=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-US',long?{weekday:'short',month:'short',day:'numeric'}:{month:'short',day:'numeric'}):'';};
function groupOf(t,today){if(!t.due)return'nodate';const d=dayDiff(t.due,today);return d<0?'over':d===0?'today':d<=6?'week':'later';}
function dueChip(t,today){
  if(!t.due)return'';const d=dayDiff(t.due,today);
  if(d<0)return`<span class="due over">${d===-1?'Yesterday':(-d)+' days late'}</span>`;
  if(d===0)return'<span class="due today">Today</span>';
  if(d===1)return'<span class="due">Tomorrow</span>';
  return`<span class="due">${esc(niceDay(t.due,d<=6))}</span>`;
}
const KIND_TAG={next_step:'Next step',project_task:'Project step'};
const forIcon=(t)=>t.kind==='project_task'?'project':t.for==='deal'||t.kind==='next_step'?'deal':'person';
const whoChip=(t)=>t.for==='me'?'':`<a class="who" href="${esc(t.href)}" data-noscope="1">${svg(forIcon(t))}<span>${esc(t.context)}</span></a>`;
const keyOf=(t)=>t.kind+':'+t.id;
const GROUPS=[['over','Overdue'],['today','Today'],['week','This week'],['later','Later'],['nodate','No date']];
const SHOW_AT=5;   // a group shows its first five; the rest wait behind "Show N more"
function whoKey(t){return t.for==='me'?'me':(t.kind==='project_task'?'project':t.for||'deal')+':'+t.parent_id;}
function visible(){let items=(DATA&&DATA.items)||[];if(MINE&&teamOn())items=items.filter(mineItem);return WHO?items.filter(t=>whoKey(t)===WHO):items;}
function render(focusSel){
  const today=ymd(),items=visible(),whoName=WHO&&WHO!=='me'?((DATA.items||[]).find(t=>whoKey(t)===WHO)||{}).context:'';
  const done=(DATA.done||[]).filter(t=>(!MINE||mineItem(t))&&(!WHO||(WHO==='me'?t.for==='me':t.context===whoName)));
  const by={};for(const [g] of GROUPS)by[g]=[];for(const t of items)by[groupOf(t,today)].push(t);
  const counts={open:items.length,over:by.over.length,today:by.today.length,week:by.week.length,later:by.later.length+by.nodate.length,done:done.length};
  // who the list can be narrowed to: everyone it names
  const whos=[...new Map(((DATA&&DATA.items)||[]).filter(t=>t.for!=='me').map(t=>[whoKey(t),t.context])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  const all=(DATA&&DATA.items)||[];
  const tog=teamOn()?`<div class="owntog" role="group" aria-label="Whose to-dos"><button type="button" data-own="mine" aria-pressed="${MINE?'true':'false'}">Mine <span class="n">${all.filter(mineItem).length}</span></button><button type="button" data-own="all" aria-pressed="${MINE?'false':'true'}">Everyone <span class="n">${all.length}</span></button></div>`:'';
  let h=`<div class="head"><div class="grow"><h1>To-dos</h1><p class="lede">${teamOn()?'Everything you have to do, for anyone. Mine shows yours; Everyone, the team’s.':'Everything you have to do, for anyone: a person, a customer or a deal. Home’s My tasks shows the next few.'}</p></div>
    <div class="tools">${tog}<label class="sr-only" for="forFilter">Show the to-dos for</label><select id="forFilter" class="forpick"><option value="">For: Everyone</option>${((DATA.items||[]).some(t=>t.for==='me')?'<option value="me"'+(WHO==='me'?' selected':'')+'>For: Just me</option>':'')}${whos.map(([k,n])=>`<option value="${esc(k)}"${WHO===k?' selected':''}>For: ${esc(n)}</option>`).join('')}</select>
    <button type="button" class="pill" id="printBtn">${svg('print')} Print</button></div></div>`;
  h+=`<div class="stats" role="group" aria-label="Show">`+[['open','All open',''],['over','Overdue','over'],['today','Today','today'],['week','This week',''],['later','Later',''],['done','Done · last 30 days','done']].map(([k,l,c])=>`<button type="button" class="stat ${c}" data-show="${k}" aria-pressed="${SHOW===k?'true':'false'}"><b>${counts[k]}</b><span>${l}</span></button>`).join('')+`</div>`;
  h+=addHtml();
  if(DATA.partial)h+=`<p class="partial" role="status">Some of your to-dos couldn’t be checked just now, so this may not be everything. Refresh to try again.</p>`;
  h+=`<div class="list" id="tlist">`;
  if(SHOW==='done'){
    h+=`<div class="ghead done">Done · last ${esc(DATA.done_days||30)} days · ${done.length}</div>`+(done.length?done.map(t=>`<div class="trow isdone" data-done-row="${esc(t.id)}"><span class="tick on" aria-hidden="true">${svg('check')}</span><div class="tmain"><span class="ttl">${esc(t.title)}</span><span class="chips">${whoChip(t)}</span></div><span class="donewhen">Done ${esc(niceDay(ymd(Date.parse(t.completed_at))))}</span><button type="button" class="undo" data-reopen="${esc(t.id)}" aria-label="Undo: ${esc(t.title)} isn’t done">Undo</button></div>`).join(''):`<div class="empty"><p>Nothing done in the last ${esc(DATA.done_days||30)} days yet.</p></div>`);
  }else{
    const groups=GROUPS.filter(([g])=>SHOW==='open'||(SHOW==='later'?(g==='later'||g==='nodate'):g===SHOW));
    let any=false;
    for(const [g,label] of groups){
      const list=by[g];if(!list.length)continue;any=true;
      const shut=g==='later'&&SHOW==='open'&&!OPENED.has(g);   // Later waits behind Show on the whole list
      const cut=OPENED.has(g)?list:list.slice(0,SHOW_AT);
      h+=`<div class="ghead ${g==='over'?'over':g==='today'?'today':''}"><span>${label} · ${list.length}</span>${shut?`<button type="button" class="glink" data-open="${g}" aria-expanded="false">Show ▾</button>`:''}</div>`;
      if(shut)continue;
      h+=cut.map(t=>rowHtml(t,today,g)).join('');
      if(cut.length<list.length)h+=`<div class="trow"><button type="button" class="glink" data-open="${g}">Show ${list.length-cut.length} more ${label.toLowerCase()}</button></div>`;
    }
    if(!any)h+=`<div class="empty"><h2>${SHOW==='open'?'Nothing on your list':'Nothing here'}</h2><p>${SHOW==='open'?'Add a to-do above, for yourself or anyone you work with.':'Nothing in this part of your list right now.'}</p></div>`;
  }
  h+=`</div>`;
  $('main').innerHTML=h;
  wire();
  if(focusSel){const n=document.querySelector(focusSel);if(n)n.focus();}
}
function rowHtml(t,today,g){
  const tag=KIND_TAG[t.kind]?`<span class="kind">${KIND_TAG[t.kind]}</span>`:'';
  const block=t.blocked?'<span class="kind">Blocked</span>':'';
  return `<div class="trow" data-row="${esc(keyOf(t))}" data-group="${g}"><button type="button" class="tick" data-done="${esc(keyOf(t))}" aria-label="Done: ${esc(t.title)}"${t.blocked?' disabled title="Unblock it on the project first"':''}></button><div class="tmain"><span class="ttl">${esc(t.title)}</span><span class="chips">${whoChip(t)}${tag}${block}${ownChip(t)}</span></div>${dueChip(t,today)}</div>`;
}
function addHtml(){
  return `<form class="add" id="addForm" aria-label="Add a to-do"><label class="sr-only" for="addTitle">What needs doing?</label><input type="text" id="addTitle" maxlength="200" autocomplete="off" placeholder="+ What needs doing?" value="${esc(DRAFT.title)}">
    <label class="sr-only" for="addDue">Due date (optional)</label><input type="date" id="addDue" value="${esc(DRAFT.due)}">
    <label class="sr-only" for="addFor">Who it’s for</label><select id="addFor">${forOptions()}</select>
    ${teamOn()?`<label class="sr-only" for="addOwner">Whose to-do it is</label><select id="addOwner">${TEAM.people.map(p=>`<option value="${esc(p.uid)}"${(DRAFT.owner||TEAM.me)===p.uid?' selected':''}>${p.me?'Yours':esc(p.label)}</option>`).join('')}</select>`:''}
    <button type="submit" class="addgo" id="addGo">Add to-do</button></form>`;
}
function forOptions(){
  const o=(v,l)=>`<option value="${esc(v)}"${DRAFT.for===v?' selected':''}>${esc(l)}</option>`;
  let h=o('','For anyone');
  if(PICK){
    if(PICK.people.length)h+=`<optgroup label="People">${PICK.people.map(c=>o('contact:'+c.id,c.name)).join('')}</optgroup>`;
    if(PICK.customers.length)h+=`<optgroup label="Customers">${PICK.customers.map(c=>o('client:'+c.id,c.name)).join('')}</optgroup>`;
    if(PICK.deals.length)h+=`<optgroup label="Open deals">${PICK.deals.map(d=>o('deal:'+d.id,d.title)).join('')}</optgroup>`;
  }
  return h;
}
// the people, customers and open deals a new to-do can be for (read once, on first use)
let PICK_P=null;
function loadPick(){
  if(PICK_P)return PICK_P;
  PICK_P=Promise.all([api('/sales/contacts?limit=100&sort=name'),api('/studio/customers'),api('/sales/deals?limit=100')]).then(([c,k,d])=>{
    const rows=(r)=>r.ok&&r.body&&Array.isArray(r.body.data)?r.body.data:[];
    PICK={people:rows(c).filter(x=>x&&x.id).map(x=>({id:x.id,name:x.name||x.email||'Someone'})),
      customers:rows(k).filter(x=>x&&x.client_id).map(x=>({id:x.client_id,name:x.name||x.email||'A customer'})),
      deals:rows(d).filter(x=>x&&x.id&&['lead','qualified','proposal','contract'].includes(x.stage)&&!x.converted_client_id).map(x=>({id:x.id,title:x.title||'A deal'}))};
    const sel=$('addFor');if(sel&&document.activeElement!==sel){sel.innerHTML=forOptions();}
  }).catch(()=>{PICK_P=null;});
  return PICK_P;
}
function wire(){
  document.querySelectorAll('[data-show]').forEach(b=>b.addEventListener('click',()=>{SHOW=b.getAttribute('data-show');render('[data-show="'+SHOW+'"]');}));
  // Show (a group's rest, or Later): the group opens, and focus lands on the first row it showed
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const g=b.getAttribute('data-open');const before=document.querySelectorAll('[data-group="'+g+'"]').length;OPENED.add(g);render();const rows=document.querySelectorAll('[data-group="'+g+'"] [data-done]');const n=rows[Math.min(before,rows.length-1)];if(n)n.focus();}));
  document.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>done(b)));
  document.querySelectorAll('[data-reopen]').forEach(b=>b.addEventListener('click',()=>reopen(b)));
  const ff=$('forFilter');if(ff)ff.addEventListener('change',()=>{WHO=ff.value;render('#forFilter');});
  const pb=$('printBtn');if(pb)pb.addEventListener('click',printTodos);
  const f=$('addForm');if(f)f.addEventListener('submit',add);
  const ti=$('addTitle');if(ti){ti.addEventListener('input',()=>{DRAFT.title=ti.value;});ti.addEventListener('focus',loadPick,{once:true});}
  const du=$('addDue');if(du)du.addEventListener('change',()=>{DRAFT.due=du.value;});
  document.querySelectorAll('[data-own]').forEach(b=>b.addEventListener('click',()=>{MINE=b.getAttribute('data-own')==='mine';try{localStorage.setItem('dds-todos-mine',MINE?'1':'0');}catch(_){/* */}render('[data-own="'+(MINE?'mine':'all')+'"]');}));
  const ow=$('addOwner');if(ow)ow.addEventListener('change',()=>{DRAFT.owner=ow.value;});
  const fo=$('addFor');if(fo){fo.addEventListener('change',()=>{DRAFT.for=fo.value;});fo.addEventListener('focus',loadPick);fo.addEventListener('pointerdown',loadPick);}
}
// Done: the route that owns each kind (Home's card does the same), then Undo
function doneReq(t,back){
  if(t.kind==='next_step')return['PATCH','/sales/deals/'+encodeURIComponent(t.id),back?{next_step:t.title,next_step_at:t.due||null}:{next_step:'',next_step_at:''}];
  if(t.kind==='deal_task')return['PATCH','/sales/deal-tasks/'+encodeURIComponent(t.id),{status:back?'open':'done'}];
  return['PATCH','/projects/'+encodeURIComponent(t.parent_id)+'/tasks/'+encodeURIComponent(t.id),{status:back?'todo':'done'}];
}
async function done(btn){
  const key=btn.getAttribute('data-done');const t=(DATA.items||[]).find(x=>keyOf(x)===key);if(!t)return;
  btn.disabled=true;btn.classList.add('on');btn.innerHTML=svg('check');
  const [m,path,body]=doneReq(t,false);
  const r=await api(path,m,body);
  if(!r.ok){btn.disabled=false;btn.classList.remove('on');btn.innerHTML='';toast((r.body&&r.body.message)||'That didn’t save. Try again in a moment.',true);return;}
  const rows=[...document.querySelectorAll('[data-row]')];const at=rows.findIndex(x=>x.getAttribute('data-row')===key);
  DATA.items=DATA.items.filter(x=>x!==t);
  if(t.kind==='deal_task')DATA.done=[{id:t.id,title:t.title,context:t.context,href:t.href,for:t.for,completed_at:new Date().toISOString(),due:t.due}].concat(DATA.done||[]);
  render();
  const next=[...document.querySelectorAll('[data-done]')][Math.max(0,Math.min(at,document.querySelectorAll('[data-done]').length-1))];
  if(next)next.focus();else{const s=document.querySelector('[data-show="'+SHOW+'"]');if(s)s.focus();}
  toast('Done: '+t.title,false,{label:'Undo',onClick:async()=>{
    const [m2,p2,b2]=doneReq(t,true);const u=await api(p2,m2,b2);
    if(!u.ok){toast('That couldn’t be undone just now.',true);return;}
    toast('Back on your list.');await load();
  }});
}
async function reopen(btn){
  const id=btn.getAttribute('data-reopen');btn.disabled=true;
  const r=await api('/sales/deal-tasks/'+encodeURIComponent(id),'PATCH',{status:'open'});
  if(!r.ok){btn.disabled=false;toast('That couldn’t be undone just now.',true);return;}
  toast('Back on your list.');await load();render('[data-show="done"]');
}
async function add(e){
  e.preventDefault();
  const title=($('addTitle').value||'').trim();if(!title){toast('Say what needs doing first.',true);$('addTitle').focus();return;}
  const due=$('addDue').value||'';const fv=$('addFor').value||'';
  const body={title,...(due?{due_date:due}:{})};
  if(fv.startsWith('contact:'))body.contact_id=fv.slice(8);else if(fv.startsWith('client:'))body.client_id=fv.slice(7);else if(fv.startsWith('deal:'))body.deal_id=fv.slice(5);
  const ow=$('addOwner');if(ow&&ow.value&&TEAM&&ow.value!==TEAM.me)body.assigned_to=ow.value;   // item 37: yours unless you pick a teammate
  const go=$('addGo');go.disabled=true;
  const r=await api('/sales/tasks','POST',body);
  if(!r.ok){go.disabled=false;toast((r.body&&r.body.message)||'That to-do didn’t save. Try again in a moment.',true);return;}
  DRAFT={title:'',due:'',for:DRAFT.for,owner:DRAFT.owner};
  const forMate=body.assigned_to&&TEAM&&TEAM.people.find(x=>x.uid===body.assigned_to);
  toast(forMate?'Added for '+forMate.label+': '+title:'Added: '+title);
  await load();
  const ti=$('addTitle');if(ti)ti.focus();
}
function printTodos(){
  const k=window.ddsListKit;if(!k||!k.printList)return;
  const today=ymd(),items=visible();
  k.printList({title:'To-dos',sub:[items.length+' open','printed '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})].join(' · '),
    cols:[{label:'To-do'},{label:'For'},{label:'Due'}],
    rows:items.map(t=>[t.title,t.for==='me'?'You':t.context,t.due?(dayDiff(t.due,today)<0?'Overdue, ':'')+niceDay(t.due):''])});
}
async function load(){
  if(scope()){$('main').innerHTML=`<div class="center"><h2>To-dos live at the studio level.</h2><p class="muted">You’re looking at one client. Your to-dos are your studio’s, for every client.</p><p style="margin-top:16px"><a class="link" data-noscope href="/todos.html">Leave this client and open To-dos →</a></p></div>`;return;}
  const [r]=await Promise.all([api('/sales/tasks'),teamOnce()]);
  if(r.status===401){signedOut();return;}
  // pages go live before the server's update: an older server has no /sales/tasks yet
  if(r.status===404&&!(r.body&&r.body.data)){$('main').innerHTML=`<div class="center"><h2>To-dos is on its way.</h2><p class="muted">This page arrives with an update that’s being rolled out. Each deal’s to-dos are on Pipeline meanwhile.</p><p style="margin-top:16px"><a class="link" href="/pipeline.html">Open Pipeline →</a></p></div>`;return;}
  if(!r.ok||!r.body||!r.body.data){trouble();return;}
  DATA=r.body.data;render();
  loadPick();   // who a new to-do can be for, read behind the page
}
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to see your to-dos.</h2><p style="margin-top:18px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load your to-dos just now.</h2><p class="muted" style="margin-bottom:16px">A brief hiccup. Try again.</p><button id="retry" class="addgo">Try again</button></div>`;const rt=$('retry');if(rt)rt.addEventListener('click',load);}
(async function(){try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";if(!TOKEN){signedOut();return;}await load();}catch(_){trouble();}})();
</script>
</body>
