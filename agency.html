<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agency — Presence</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;
    --p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#3f7a5a;--good-soft:#e7f1ea;--warn:#8a6d3b;--warn-soft:#f3ead9;
    --shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:36px 20px 90px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-size:22px;font-weight:500}
  .brand small{display:block;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.03em}
  .rolebadge{font-size:12px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:5px 12px}
  .acting{margin-top:18px;padding:12px 16px;background:var(--p-soft);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .acting b{color:var(--p)} .acting .who{font-weight:600}
  h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:22px 0 3px}
  .sub{color:var(--soft);font-size:14.5px;margin:0 0 22px}
  .search{width:100%;font-family:inherit;font-size:14.5px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);margin-bottom:16px}
  .search:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  .client{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:.15s;width:100%;text-align:left;font-family:inherit}
  .client:hover{border-color:var(--p)}
  .client .av{width:38px;height:38px;border-radius:10px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
  .client .n{font-weight:600;font-size:15px} .client .m{font-size:12.5px;color:var(--faint);font-family:var(--mono)}
  .client .badge{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .badge.wait{color:var(--warn);background:var(--warn-soft)} .badge.ok{color:var(--good);background:var(--good-soft)}
  .detail .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:12px}
  .stat{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
  .stat div .n{font-family:var(--mono);font-size:22px;font-weight:600} .stat div .l{font-size:12px;color:var(--soft)}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 15px;cursor:pointer}
  button:hover{border-color:var(--p);color:var(--p)}
  a.link{color:var(--p);text-decoration:none;font-weight:600}a.link:hover{text-decoration:underline}
  .center{text-align:center;padding:52px 20px}.center h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px}
  .muted{color:var(--soft);font-size:14px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap"><div id="main"><div class="spin" role="status" aria-label="Loading"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// Agency dashboard (A7.2): portfolio + client switcher + acting-as banner.
// Consumes the existing /agency/me + /agency/portfolio (role x scope enforced
// server-side). "Acting for" focuses one client within this agency surface — it
// never impersonates the client's own login (isolation preserved).
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="",ME=null,CLIENTS=[],ACTING=null;
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN});
async function api(path){const r=await fetch(FN+path,{headers:H()});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
const initial=(s)=>String(s||'?').trim().charAt(0).toUpperCase();

function renderList(filter){
  const q=(filter||'').toLowerCase();
  const list=CLIENTS.filter(c=>!q||String(c.name||'').toLowerCase().includes(q));
  let html=`<div class="top"><div class="brand">${esc(ME.agency||'Your agency')}<small>Agency workspace · Presence</small></div><span class="rolebadge">● ${esc(ME.role||'member')}</span></div>`;
  html+=`<h1>Your clients</h1><p class="sub">${CLIENTS.length} ${CLIENTS.length===1?'business':'businesses'} in your portfolio. Pick one to focus on.</p>`;
  html+=`<input class="search" id="search" placeholder="Search clients…" value="${esc(filter||'')}">`;
  if(!list.length){html+=`<div class="center"><p class="muted">${CLIENTS.length?'No clients match that.':'No clients yet — add businesses from your studio tools.'}</p></div>`;}
  for(const c of list){
    const waiting=Number(c.plans_waiting||0);
    html+=`<button class="client" data-open="${esc(c.site_id)}"><span class="av">${esc(initial(c.name))}</span>
      <span><span class="n">${esc(c.name||'(unnamed)')}</span><br><span class="m">${esc(c.edition||'presence')} · ${esc(c.status||'')}</span></span>
      <span class="badge ${waiting?'wait':'ok'}">${waiting?waiting+' waiting':'all clear'}</span></button>`;
  }
  $('main').innerHTML=html;
  const s=$('search'); if(s) s.addEventListener('input',()=>renderList(s.value));
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openClient(b.getAttribute('data-open'))));
}
function openClient(siteId){
  ACTING=CLIENTS.find(c=>c.site_id===siteId)||null; if(!ACTING) return;
  try{localStorage.setItem('dds-acting-as',JSON.stringify({site_id:ACTING.site_id,name:ACTING.name}));}catch(_){}
  const c=ACTING,waiting=Number(c.plans_waiting||0);
  let html=`<div class="acting"><span>Acting for <span class="who">${esc(c.name)}</span></span><button id="back">← All clients</button></div>`;
  html+=`<h1>${esc(c.name||'(unnamed)')}</h1><p class="sub">${esc(c.edition||'presence')} · ${esc(c.status||'')}</p>`;
  html+=`<div class="detail"><div class="card"><div class="stat">
    <div><div class="n">${waiting}</div><div class="l">awaiting approval</div></div>
    <div><div class="n">${esc(c.moments_count!=null?c.moments_count:'—')}</div><div class="l">open moments</div></div>
    <div><div class="n">${c.archived?'Archived':'Active'}</div><div class="l">status</div></div>
  </div></div>`;
  html+=`<div class="card"><p class="muted">Deeper work for this client — reviewing, publishing, connecting — happens in your studio workspace with your agency permissions. This dashboard keeps your whole portfolio in one calm place.</p>
    <p style="margin-top:12px"><a class="link" href="/crm.html">Open relationship →</a> &nbsp; <a class="link" href="/dds-studio-manage-9k2p.html">Open studio tools →</a></p></div></div>`;
  $('main').innerHTML=html;
  $('back').addEventListener('click',()=>{ACTING=null;try{localStorage.removeItem('dds-acting-as');}catch(_){}renderList('');});
}
function notAgency(){$('main').innerHTML=`<div class="center"><h2>This isn’t an agency account.</h2><p class="muted">Agency tools are for studios managing multiple businesses.</p><p style="margin-top:20px"><a class="link" href="/presence.html">Open your workspace →</a></p></div>`;}
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to your agency workspace.</h2><p style="margin-top:20px"><a class="link" href="/portal.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load your portfolio just now.</h2><p class="muted">Please refresh in a moment.</p></div>`;}

(async function(){
  try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){signedOut();return;}
    const me=await api('/agency/me');
    if(me.status===401||me.status===403||!me.ok){notAgency();return;}
    ME=me.body.data||{};
    const pf=await api('/agency/portfolio');
    CLIENTS=(pf.ok&&Array.isArray(pf.body.data))?pf.body.data:[];
    renderList('');
  }catch(_){trouble();}
})();
</script>
</body>
</html>
