<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;
    --p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--warn-soft:#f3ead9;
    --shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:36px 20px 90px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-size:22px;font-weight:500}
  .brand small{display:block;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.03em}
  .rolebadge{font-size:12px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:5px 12px}
  .acting{margin-top:18px;padding:12px 16px;background:var(--p-soft);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .acting b{color:var(--p)} .acting .who{font-weight:600}
  h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:22px 0 3px}
  .sub{color:var(--soft);font-size:14.5px;margin:0 0 22px}
  .search{width:100%;font-family:inherit;font-size:14.5px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);margin-bottom:16px}
  .search:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  .client{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:.15s;width:100%;text-align:left;font-family:inherit}
  .client:hover{border-color:var(--p)}
  .client .av{width:38px;height:38px;border-radius:10px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
  .client .n{font-weight:600;font-size:15px} .client .m{font-size:12.5px;color:var(--faint);font-family:var(--mono)}
  .client .badge{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .badge.wait{color:var(--warn);background:var(--warn-soft)} .badge.ok{color:var(--good);background:var(--good-soft)}
  .detail .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:12px}
  .stat{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
  .stat div .n{font-family:var(--mono);font-size:22px;font-weight:600} .stat div .l{font-size:12px;color:var(--soft)}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 15px;cursor:pointer}
  button:hover{border-color:var(--p);color:var(--p)}
  a.link{color:var(--p);text-decoration:none;font-weight:600}a.link:hover{text-decoration:underline}
  .center{text-align:center;padding:52px 20px}.center h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px}
  .muted{color:var(--soft);font-size:14px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap"><div id="main"><div class="spin" role="status" aria-label="Loading"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
// Agency dashboard (A7.2): portfolio + client switcher + acting-as banner.
// Consumes the existing /agency/me + /agency/portfolio (role x scope enforced
// server-side). "Acting for" focuses one client within this agency surface — it
// never impersonates the client's own login (isolation preserved).
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="",ME=null,CLIENTS=[],ACTING=null;
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN});
async function api(path){const r=await fetch(FN+path,{headers:H()});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
async function apiSend(method,path,payload){const r=await fetch(FN+path,{method,headers:H(),body:payload?JSON.stringify(payload):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
const initial=(s)=>String(s||'?').trim().charAt(0).toUpperCase();

function renderList(filter){
  const q=(filter||'').toLowerCase();
  const list=CLIENTS.filter(c=>!q||String(c.name||'').toLowerCase().includes(q));
  let html=`<div class="top"><div class="brand">${esc(ME.agency||'Your agency')}<small>Studio</small></div><span class="rolebadge">● ${esc(ME.role||'member')}</span></div>`;
  html+=`<h1>Your clients</h1><p class="sub">${CLIENTS.length} ${CLIENTS.length===1?'business':'businesses'} in your portfolio. Pick one to focus on.</p>`;
  html+=`<input class="search" id="search" placeholder="Search clients…" value="${esc(filter||'')}">`;
  if(!list.length){html+=`<div class="center"><p class="muted">${CLIENTS.length?'No clients match that.':'No clients yet — add businesses from your studio tools.'}</p></div>`;}
  for(const c of list){
    // Section 3 — the at-a-glance status: everything asking for someone, from data the platform already computes.
    const att=Number(c.attention||0);
    const bits=[];
    const lw=Number(c.leads_waiting||0); if(lw) bits.push(`${lw} lead${lw===1?'':'s'} waiting`);
    const de=c.domain_expires_at?Math.floor((Date.parse(c.domain_expires_at)-Date.now())/86400000):null;
    if(de!==null&&de<=30) bits.push(`domain ${de<0?'expired':(de===0?'expires today':'expires in '+de+'d')}${c.domain_registrar?' · '+c.domain_registrar:''}`);
    const si=Number(c.search_issues||0); if(si) bits.push(`${si} search issue${si===1?'':'s'}`);
    if(c.billing_issue) bits.push('billing needs a look');
    const statusLine=bits.length?`<br><span class="m" style="color:var(--warn);font-family:var(--sans)">${esc(bits.join(' · '))}</span>`:'';
    html+=`<button class="client" data-open="${esc(c.site_id)}"><span class="av">${esc(initial(c.name))}</span>
      <span><span class="n">${esc(c.name||'(unnamed)')}</span><br><span class="m">${esc(c.edition||'presence')} · ${esc(c.status||'')}</span>${statusLine}</span>
      <span class="badge ${att?'wait':'ok'}">${att?att+' waiting':'all clear'}</span></button>`;
  }
  // ── Phase CP-1: starter kits — save one client's setup, start the next from it ──
  html+=`<div class="detail" style="margin-top:18px"><div class="card"><div class="stat" style="margin-bottom:6px">Starter kits</div>
    <p class="muted" style="margin-bottom:10px">Save a client's setup (services, FAQs, voice, colors, industry — never their name, reviews, or photos) and start the next client from it. Applying only fills what's empty; it never overwrites work.</p>
    <div id="kitList" class="muted">Loading…</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center">
      <select id="kitFromSite" class="search" style="margin:0;flex:1;min-width:150px"><option value="">Save a kit from…</option>${CLIENTS.map(c=>`<option value="${esc(c.site_id)}">${esc(c.name||'(unnamed)')}</option>`).join('')}</select>
      <input id="kitName" class="search" style="margin:0;flex:1;min-width:130px" placeholder="Kit name (e.g. Contractor Starter)">
      <button class="client" id="kitSave" style="width:auto;margin:0;padding:10px 16px;justify-content:center">Save kit</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">
      <select id="kitPick" class="search" style="margin:0;flex:1;min-width:150px"><option value="">Apply a kit…</option></select>
      <select id="kitToSite" class="search" style="margin:0;flex:1;min-width:150px"><option value="">…to client</option>${CLIENTS.map(c=>`<option value="${esc(c.site_id)}">${esc(c.name||'(unnamed)')}</option>`).join('')}</select>
      <button class="client" id="kitApply" style="width:auto;margin:0;padding:10px 16px;justify-content:center">Apply</button>
    </div></div></div>`;
  $('main').innerHTML=html;
  const s=$('search'); if(s) s.addEventListener('input',()=>renderList(s.value));
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openClient(b.getAttribute('data-open'))));
  loadKits();
}
let KITS=[];
async function loadKits(){
  const host=$('kitList'); if(!host) return;
  try{
    const r=await api('/agency/kits'); KITS=(r.body&&r.body.data)||[];
    host.innerHTML=KITS.length?KITS.map(k=>`<span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;margin:0 6px 6px 0;font-size:13px">${esc(k.name)} <button data-delkit="${esc(k.id)}" title="Delete kit" style="border:none;background:none;cursor:pointer;color:var(--faint);font-size:13px">✕</button></span>`).join(''):'No kits yet — save your best-configured client as the first one.';
    const pick=$('kitPick'); if(pick){pick.innerHTML='<option value="">Apply a kit…</option>'+KITS.map(k=>`<option value="${esc(k.id)}">${esc(k.name)}</option>`).join('');}
    document.querySelectorAll('[data-delkit]').forEach(b=>b.addEventListener('click',async()=>{if(!b.dataset.armed){b.dataset.armed='1';b.textContent='?';setTimeout(()=>{delete b.dataset.armed;b.textContent='✕';},2500);return;}await apiSend('DELETE','/agency/kits/'+b.getAttribute('data-delkit'));loadKits();}));
    const save=$('kitSave'); if(save)save.addEventListener('click',async()=>{
      const sid=$('kitFromSite').value,nm=$('kitName').value.trim();
      if(!sid||!nm){alert('Pick a client and name the kit.');return;}
      const r2=await apiSend('POST','/agency/kits',{site_id:sid,name:nm});
      if(r2.ok){$('kitName').value='';loadKits();}else alert((r2.body&&r2.body.message)||'That didn’t save.');
    });
    const ap=$('kitApply'); if(ap)ap.addEventListener('click',async()=>{
      const kid=$('kitPick').value,sid=$('kitToSite').value;
      if(!kid||!sid){alert('Pick a kit and a client.');return;}
      const r3=await apiSend('POST','/agency/kits/'+kid+'/apply',{site_id:sid});
      if(r3.ok){const a=(r3.body.data&&r3.body.data.applied)||{};const sk=(r3.body.data&&r3.body.data.skipped)||[];alert('Applied: '+(a.offerings||0)+' services, '+(a.faqs||0)+' FAQs'+(a.voice?', voice':'')+(a.colors?', colors':'')+(a.industry?', industry':'')+(sk.length?'\nSkipped (already set): '+sk.join('; '):''));}
      else alert((r3.body&&r3.body.message)||'That didn’t apply.');
    });
  }catch(_){host.textContent='Kits wouldn’t load just now.';}
}
// SC-1: opening a client drills the WHOLE shell into that client's scope. The
// scope rides the URL (?client=<id>) — per-tab, shareable, refresh-safe — and the
// server re-validates it on every request (fail-closed). No app switch, one shell.
function openClient(siteId){
  const c = CLIENTS.find(x=>x.site_id===siteId); if(!c) return;
  location.href = '/today.html?client=' + encodeURIComponent(siteId);
}
function notAgency(){$('main').innerHTML=`<div class="center"><h2>This isn’t an agency account.</h2><p class="muted">Agency tools are for studios managing multiple businesses.</p><p style="margin-top:20px"><a class="link" href="/presence.html">Open your workspace →</a></p></div>`;}
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to your agency workspace.</h2><p style="margin-top:20px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load your portfolio just now.</h2><p class="muted">Please refresh in a moment.</p></div>`;}

(async function(){
  try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){signedOut();return;}
    const me=await api('/agency/me');
    if(me.status===401){signedOut();return;}   // stale session ≠ "not an agency" — send them to the door
    if(me.status===403){notAgency();return;}
    if(!me.ok){trouble();return;}
    ME=me.body.data||{};
    const pf=await api('/agency/portfolio');
    CLIENTS=(pf.ok&&Array.isArray(pf.body.data))?pf.body.data:[];
    renderList('');
    mountQueues();   // "what needs me today" — the cross-client morning cockpit
  }catch(_){trouble();}
})();

// ── Work queues: the backend has aggregated cross-client queues since L5.7 —
//    this is their first UI. One calm panel; each row jumps into that client. ──
async function mountQueues(){
  try{
    const r=await api('/agency/queues');
    if(!r.ok||!r.body.data)return;
    const queues=(r.body.data.queues||[]).filter(q=>q.items&&q.items.length);
    if(!queues.length)return;
    const host=document.createElement('section');
    host.style.cssText='max-width:980px;margin:8px auto 22px;padding:0 20px';
    host.innerHTML='<h2 style="font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft,#6b6478);font-weight:600;margin:0 0 10px">What needs you today</h2>'+
      queues.map(q=>`<div style="background:var(--card,#fff);border:1px solid var(--line,#eee9e0);border-radius:14px;padding:14px 16px;margin-bottom:10px">
        <p style="font-weight:600;font-size:14px;margin:0 0 6px">${esc(q.title)} <span style="color:var(--soft,#6b6478);font-weight:400">· ${q.items.length}</span></p>
        ${q.items.slice(0,5).map(it=>`<a href="/today.html?client=${encodeURIComponent(it.site_id)}" style="display:block;padding:6px 0;color:inherit;text-decoration:none;font-size:13.5px"><strong>${esc(it.name)}</strong> — ${esc(it.why)} <span style="color:var(--p,#5b3fa0)">→</span></a>`).join('')}
        ${q.items.length>5?`<p style="color:var(--soft,#6b6478);font-size:12.5px;margin:6px 0 0">+ ${q.items.length-5} more</p>`:''}
      </div>`).join('');
    // OUTSIDE #main — the client-search re-render rewrites #main.innerHTML on
    // every keystroke and would silently wipe this panel.
    const list=document.getElementById('main');
    if(list&&list.parentNode)list.parentNode.insertBefore(host,list);
    else document.body.appendChild(host);
  }catch(_){/* the portfolio list is the fallback */}
}
</script>
</body>
</html>
