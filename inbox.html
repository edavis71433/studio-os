<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inbox — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Everything that needs you — messages, approvals, and updates — in one place.">
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--warn-soft:#f3ead9;--shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:34px 20px 90px}
  header h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,5vw,32px);margin:6px 0 .1em;letter-spacing:-.01em}
  header .sub{color:var(--soft);font-size:15px;margin:0}
  h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:30px 0 12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px;display:block;text-decoration:none;color:inherit}
  .item:hover{border-color:var(--p)}
  .item.approve{border-left:3px solid var(--p)} .item.lead{border-left:3px solid var(--good)} .item.notice{border-left:3px solid var(--warn)}
  .item .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .item .who{font-weight:600;font-size:15.5px}
  .item .tag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--p);background:var(--p-soft)}
  .item .when{margin-left:auto;font-size:12.5px;color:var(--faint)}
  .item .body{margin-top:8px;font-size:14.5px;color:var(--soft)}
  .item .go{margin-top:12px;color:var(--p);font-weight:600;font-size:13.5px}
  .item.convo{padding:14px 18px}
  .convo-row{display:flex;align-items:center;gap:13px}
  .convo .avatar{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--p,#5b3fa0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.02em}
  .convo-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .convo-main .top{display:flex;align-items:center;gap:10px}
  .convo-main .body{margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmbadge{flex:0 0 auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--faint,#948bad);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .cmbadge.reply{background:var(--warn,#d8b878);color:#3a2f12}
  .item.convo.needsreply{border-left:3px solid var(--warn,#d8b878)}
  h2 .cmcount{display:inline-flex;align-items:center;justify-content:center;min-width:23px;height:23px;padding:0 7px;margin-left:8px;border-radius:999px;background:var(--p,#5b3fa0);color:#fff;font-size:13px;font-weight:700;vertical-align:middle}
  .cmbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--soft)}
  .cmbar select{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px}
  .cmhead{font-family:var(--serif);font-weight:500;font-size:16px;color:var(--ink);margin:16px 0 8px;text-transform:none;letter-spacing:0}
  .center{text-align:center;padding:56px 20px}.center h2{font-family:var(--serif);font-weight:500;font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 8px}
  .allclear{background:var(--good-soft);border-color:transparent;color:var(--good);text-align:center;padding:22px}
  .muted{color:var(--soft);font-size:14.5px}
  a.link{color:var(--p);text-decoration:none;font-weight:600}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
  /* Support toolkit + editors (saved replies, customer FAQ) */
  .item.tool{border-left:3px solid var(--p)}
  .toolbtn{margin-top:12px;font:inherit;font-size:13.5px;font-weight:600;color:#fff;background:var(--p);border:none;border-radius:9px;padding:9px 14px;cursor:pointer}
  .toolbtn:hover{filter:brightness(1.06)}
  .sheet-back{position:fixed;inset:0;background:rgba(20,15,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:1000}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:560px;padding:22px;margin:auto}
  .sheet-head{display:flex;align-items:center;gap:10px}
  .sheet-head h3{font-family:var(--serif);font-weight:500;font-size:21px;margin:0}
  .sheet .x{margin-left:auto;background:none;border:none;font-size:24px;line-height:1;color:var(--soft);cursor:pointer;padding:2px 6px;border-radius:7px}
  .sheet .x:hover{color:var(--ink)}
  .sheet-intro{color:var(--soft);font-size:14px;margin:8px 0 16px}
  .sheet-list{display:flex;flex-direction:column;gap:14px}
  .erow{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
  .erow .mv{display:flex;flex-direction:column;gap:4px}
  .erow .mv button{width:30px;height:26px;border:1px solid var(--line);background:var(--card);border-radius:7px;cursor:pointer;color:var(--ink);font-size:13px}
  .erow .mv button:disabled{opacity:.35;cursor:default}
  .erow .ef{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  .fl{display:flex;flex-direction:column;gap:4px}
  .fl>span{font-size:12px;font-weight:600;color:var(--faint)}
  .fl input,.fl textarea,#sheet-extra input{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;resize:vertical}
  .fl input:focus,.fl textarea:focus,#sheet-extra input:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  .erow .del{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:8px;color:var(--soft);font-size:12.5px;padding:6px 10px;cursor:pointer}
  .erow .del:hover{color:#a4342b;border-color:#a4342b}
  #sheet-extra:not(:empty){margin-bottom:14px}
  .addbtn{margin-top:14px;background:var(--p-soft);color:var(--p);border:1px dashed var(--p);border-radius:10px;padding:10px;width:100%;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
  .sheet-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .sheet-foot .ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
  .sheet-foot .save{background:var(--p);color:#fff;border:none;border-radius:9px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
  .sheet-foot .save:disabled{opacity:.6;cursor:default}
  .empty{padding:10px 2px}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>Studio OS · Inbox — everything that needs you, in one calm place.</footer>
</div>
<div id="sheet-host"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="";
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;}); // keep token fresh (auto-refresh)
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':(new URLSearchParams(location.search).get('client')||'')},body:body?JSON.stringify(body):undefined});return r.ok?{ok:true,body:await r.json().catch(()=>({}))}:{ok:false,status:r.status};}
function when(iso){if(!iso)return'';const d=Math.floor((Date.now()-Date.parse(iso))/86400000);if(d<=0)return'today';if(d===1)return'yesterday';if(d<7)return d+' days ago';if(d<60)return Math.floor(d/7)+' weeks ago';return Math.floor(d/30)+' months ago';}
const KIND={quote:'Quote request',booking:'Booking request',contact:'Message'};
// SC-1: keep the agency drill-in scope on every internal link so a scoped operator
// stays inside the client they opened.
function scoped(href){const c=new URLSearchParams(location.search).get('client');if(!c||!href||href.charAt(0)!=='/')return href;const h=href.split('#');return h[0]+(h[0].indexOf('?')>=0?'&':'?')+'client='+encodeURIComponent(c)+(h[1]?'#'+h[1]:'');}

// map a derived notification's source to a real Studio page (deep link resolves)
function notifLink(n){const h=String(n.href||'');const m=h.match(/^\/projects\/([0-9a-f-]{36})/);if(m){const anc=h.split('#')[1];return '/projects.html?project='+m[1]+(anc?'#'+anc:'');}if(h&&h.charAt(0)==='/')return h;return '/today.html';}
function render(feed,leads,notifs){
  const approvals=(feed.pending_approvals||[]);
  // The feed now carries a synthetic 'website_enquiry' aggregate row so the BELL can
  // surface new leads; the Inbox already lists each lead in its own "New enquiries"
  // section (from /forms/inbox), so drop the aggregate here to avoid a double listing.
  const notices=(feed.notices||[]).filter(n=>n.kind!=='website_enquiry');
  const moments=(feed.moments||[]);
  const newLeads=(leads||[]).filter(l=>l.status==='new');
  // FIX 5: client support requests + client project messages, surfaced first-class
  // (not the dim, auto-read "Project activity" line). Each links to where you reply.
  const clientMsgs=(feed.client_messages||[]);
  // Project activity is the studio's OWN worklog (milestones, files, approvals) —
  // NOT client messages. Support requests and client messages belong to the grouped
  // "Messages" section above (one row per client), never a flat cross-client list.
  // Keep recently-read activity VISIBLE (dimmed) — glancing at the Inbox must
  // never make unhandled items vanish; they just stop counting as new.
  const activity=(notifs||[]).filter(n=>n.kind!=='support_message'&&n.kind!=='message').slice(0,12);
  const unreadCount=activity.filter(n=>!n.read).length;
  const total=approvals.length+clientMsgs.length+notices.length+moments.length+newLeads.length+unreadCount;
  let h=`<header><h1>Inbox</h1><p class="sub">${total?'Everything that needs you, in one place.':'You’re all caught up.'}</p></header>`;
  if(!total&&!activity.length){h+=`<div class="allclear" style="margin-top:24px">✓ Nothing needs you right now — the platform is watching the rest.</div><p style="text-align:center;margin-top:14px"><a class="link" href="${esc(scoped('/today.html'))}">See how the business is doing →</a></p>`;h+=toolkit();$('main').innerHTML=h;return;}
  if(!total&&activity.length){h+=`<div class="allclear" style="margin-top:24px">✓ Nothing new — recent activity is below.</div>`;}

  // Messages from your clients — ONE conversation per client (not a flat list of
  // every message). Each row shows who's waiting + their most recent message + how
  // many, and opens THAT client's thread where you reply. This is the "who has
  // messages" summary Eric asked for; the thread itself lives in their profile.
  if(clientMsgs.length){
    const groups=new Map(); // client_id → {name, items, href}
    for(const c of clientMsgs){const key=c.client_id||'';const nm=c.client||'Other clients';
      if(!groups.has(key))groups.set(key,{name:nm,items:[],href:''});const g=groups.get(key);g.items.push(c);if(c.href&&!g.href)g.href=c.href;}
    const glist=[...groups.entries()];
    // reply-needed clients first, then most-recently-active
    const needs=(g)=>g.items.some(c=>c.needs_reply||c.type==='support')?1:0;
    const lastAt=(g)=>g.items.reduce((m,c)=>String(c.created_at||'')>m?String(c.created_at||''):m,'');
    glist.sort((a,b)=>needs(b[1])-needs(a[1])||lastAt(b[1]).localeCompare(lastAt(a[1])));
    const waiting=glist.filter(([k,g])=>needs(g)).length;
    h+=`<h2>Messages <span class="cmcount">${glist.length}</span></h2>`;
    h+=`<p class="mut" style="margin:-6px 0 12px">${waiting?`${waiting} ${waiting===1?'conversation needs':'conversations need'} a reply.`:'You’re caught up on replies — recent conversations below.'}</p>`;
    for(const [k,g] of glist){
      const latest=g.items.slice().sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))[0]||{};
      const isSup=latest.type==='support';
      const reply=needs(g);
      const preview=isSup?('Support: '+esc(latest.subject||'a request')):(latest.needs_reply?'Sent you a message':'You replied — waiting on them');
      const n=g.items.length;
      const href=scoped(g.href||'/projects.html');
      const initials=esc((g.name||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase()||'?');
      h+=`<a class="item convo${reply?' needsreply':''}" href="${esc(href)}"><div class="convo-row"><span class="avatar" aria-hidden="true">${initials}</span><span class="convo-main"><span class="top"><span class="who">${esc(g.name)}</span>${latest.created_at?`<span class="when">${esc(when(latest.created_at))}</span>`:''}</span><span class="body">${preview}</span></span>${reply?`<span class="cmbadge reply">Reply</span>`:(n>1?`<span class="cmbadge">${n}</span>`:'')}</div><div class="go">Open conversation →</div></a>`;
    }
  }

  if(approvals.length){h+=`<h2>Needs your OK</h2>`;
    for(const p of approvals){
      // Infra + connected approvals can be decided RIGHT HERE (mirrors the one-tap
      // approve spine). File approvals still open the file where you review the swap.
      const inline=p.decide_path&&p.kind!=='file';
      if(inline){
        const bs='font:inherit;font-weight:600;border-radius:999px;padding:7px 15px;cursor:pointer;border:1px solid var(--line)';
        h+=`<div class="item approve"><div class="top"><span class="tag">Approval</span></div><div class="who" style="margin-top:8px">${esc(p.title||'A change is ready')}</div>${p.summary?`<div class="body">${esc(p.summary)}</div>`:''}<div class="go" style="display:flex;gap:8px;margin-top:10px"><button data-fapprove="${esc(p.decide_path)}" style="${bs};background:var(--p,#5b3fa0);color:#fff;border-color:var(--p,#5b3fa0)">Approve</button><button data-fdecline="${esc(p.decide_path)}" style="${bs};background:transparent;color:var(--ink)">Not yet</button></div></div>`;
      } else {
        const href=scoped(p.href?p.href:p.kind==='connected'?'/connections.html':'/presence.html#foundations');
        h+=`<a class="item approve" href="${href}"><div class="top"><span class="tag">Approval</span></div><div class="who" style="margin-top:8px">${esc(p.title||'A change is ready')}</div>${p.summary?`<div class="body">${esc(p.summary)}</div>`:''}<div class="go">Review &amp; approve →</div></a>`;
      }
    }}

  if(newLeads.length){h+=`<h2>New enquiries</h2>`;
    for(const l of newLeads){const who=esc(l.name||l.email||'Someone');
      h+=`<a class="item lead" href="${scoped('/leads.html')}"><div class="top"><span class="who">${who}</span><span class="tag" style="color:var(--good);background:var(--good-soft)">${esc(KIND[l.form_kind]||'Message')}</span><span class="when">${esc(when(l.created_at))}</span></div>${l.message?`<div class="body">${esc(l.message)}</div>`:''}<div class="go">Open enquiry →</div></a>`;}}

  if(activity.length){h+=`<h2>Project activity</h2>`;
    for(const n of activity){h+=`<a class="item" href="${scoped(notifLink(n))}"><div class="top"><span class="who"${n.read?' style="font-weight:400;color:var(--soft)"':''}>${n.read?'✓ ':''}${esc(n.label||'Activity')}</span>${n.created_at?`<span class="when">${esc(when(n.created_at))}</span>`:''}</div><div class="go">Open →</div></a>`;}}

  const worth=[...notices,...moments];
  if(worth.length){h+=`<h2>Worth a look</h2>`;
    for(const n of notices){h+=`<a class="item notice" href="${esc(scoped(n.href||'/today.html'))}"><div class="who">${esc(n.headline||'Something needs a look')}</div>${n.body?`<div class="body">${esc(n.body)}</div>`:''}<div class="go">Take care of it →</div></a>`;}
    for(const m of moments){h+=`<a class="item" href="${esc(scoped('/today.html'))}"><div class="who">${esc(m.headline||'A moment')}</div>${m.summary?`<div class="body">${esc(m.summary)}</div>`:''}<div class="go">Open Today →</div></a>`;}}

  h+=toolkit();
  $('main').innerHTML=h;
  // inline approve/decide — the operator acts without leaving the Inbox (the one-tap
  // approve spine; same decide_path the client uses). Reloads to reflect the result.
  const decideInbox=async(path,decision,btn)=>{btn.disabled=true;try{const r=await api(path,'POST',{decision});if(r.ok){if(window.ddsToast)ddsToast(decision==='approve'?'Approved.':'Set aside — nothing changed.');location.reload();return;}}catch(_){}if(window.ddsToast)ddsToast('That didn’t go through — try again.');btn.disabled=false;};
  document.querySelectorAll('[data-fapprove]').forEach(b=>b.addEventListener('click',()=>decideInbox(b.getAttribute('data-fapprove'),'approve',b)));
  document.querySelectorAll('[data-fdecline]').forEach(b=>b.addEventListener('click',()=>decideInbox(b.getAttribute('data-fdecline'),'abandon',b)));
}
// ── Support toolkit: two owner-managed tools that live right here in the Inbox.
//   • Saved replies — canned answers you reuse when replying to enquiries.
//   • Customer FAQ  — common Q&A your clients can read anytime in their portal.
// Both save only when you press Save; nothing sends or publishes on its own.
function toolkit(){return `<h2>Your support toolkit</h2>`+
  `<div class="item tool"><div class="who">Saved replies</div><div class="body">Write your best answers once, then drop them into a reply in one click — no retyping.</div><button class="toolbtn" type="button" onclick="openSaved()">Manage saved replies</button></div>`+
  `<div class="item tool"><div class="who">Customer FAQ</div><div class="body">Common questions and answers your clients can read anytime in their portal, so they ask you less.</div><button class="toolbtn" type="button" onclick="openFaq()">Edit your FAQ</button></div>`;}
const toast=(m,k)=>{if(window.ddsToast)window.ddsToast(m,k);};

// ── Editor sheet (shared shell for both tools) ──────────────────────────────
function sheetKey(e){if(e.key==='Escape')closeSheet();}
function closeSheet(){const host=$('sheet-host');if(host){host.innerHTML='';host.onclick=null;}document.removeEventListener('keydown',sheetKey);}
function mountSheet(html){const host=$('sheet-host');host.innerHTML=html;document.addEventListener('keydown',sheetKey);
  host.onclick=function(e){if(e.target.classList.contains('sheet-back')||e.target.closest('[data-x]'))closeSheet();};
  const x=host.querySelector('.x');if(x)x.focus();}
function sheetShell(title,intro,addLabel){return `<div class="sheet-back"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">`+
  `<div class="sheet-head"><h3 id="sh-t">${esc(title)}</h3><button type="button" class="x" data-x aria-label="Close">×</button></div>`+
  `<p class="sheet-intro">${esc(intro)}</p><div id="sheet-extra"></div><div id="sheet-list" class="sheet-list"></div>`+
  `<button type="button" id="sheet-add" class="addbtn">+ ${esc(addLabel)}</button>`+
  `<div class="sheet-foot"><button type="button" class="ghost" data-x>Cancel</button><button type="button" id="sheet-save" class="save">Save changes</button></div>`+
  `</div></div>`;}
// Shared up/down/remove handling. readFn snapshots the typed values into state
// BEFORE any structural change, so nothing you've typed is lost on reorder.
function listClick(e,readFn,arrGet,drawFn){
  const row=e.target.closest('[data-row]');if(!row)return;
  const rows=[...$('sheet-list').querySelectorAll('[data-row]')];const i=rows.indexOf(row);
  if(e.target.closest('[data-del]')){readFn();const a=arrGet();a.splice(i,1);drawFn();}
  else if(e.target.closest('[data-mv=up]')&&i>0){readFn();const a=arrGet();[a[i-1],a[i]]=[a[i],a[i-1]];drawFn();}
  else if(e.target.closest('[data-mv=down]')){readFn();const a=arrGet();if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];drawFn();}}
}
function mvCells(i,n){return `<div class="mv"><button type="button" data-mv="up" ${i===0?'disabled':''} aria-label="Move up">↑</button><button type="button" data-mv="down" ${i===n-1?'disabled':''} aria-label="Move down">↓</button></div>`;}
function focusNewRow(){const rows=$('sheet-list').querySelectorAll('[data-row]');const last=rows[rows.length-1];if(last){const f=last.querySelector('input,textarea');if(f)f.focus();}}

// ── Saved replies ───────────────────────────────────────────────────────────
let SR=[];
async function openSaved(){
  mountSheet(sheetShell('Saved replies','These are canned answers you can reuse when you reply to an enquiry. Nothing sends automatically — you choose when to use them.','Add a saved reply'));
  $('sheet-list').innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';
  const r=await api('/service/saved-replies');
  SR=(r.ok&&r.body.data&&r.body.data.replies)||[];
  drawSaved();
  $('sheet-list').onclick=(e)=>listClick(e,readSaved,()=>SR,drawSaved);
  $('sheet-add').onclick=()=>{readSaved();SR.push({id:'',title:'',body:''});drawSaved();focusNewRow();};
  $('sheet-save').onclick=saveSaved;
}
function srRow(r,i){return `<div class="erow" data-row data-id="${esc(r.id||'')}">${mvCells(i,SR.length)}`+
  `<div class="ef"><label class="fl"><span>Title</span><input type="text" data-f="title" maxlength="80" value="${esc(r.title)}" placeholder="e.g. Our opening hours"></label>`+
  `<label class="fl"><span>Message</span><textarea data-f="body" maxlength="4000" rows="3" placeholder="Write the reply you send most often…">${esc(r.body)}</textarea></label></div>`+
  `<button type="button" class="del" data-del aria-label="Remove this reply">Remove</button></div>`;}
function drawSaved(){const b=$('sheet-list');b.innerHTML=SR.length?SR.map((r,i)=>srRow(r,i)).join(''):'<p class="muted empty">No saved replies yet. Add your first one below.</p>';}
function readSaved(){SR=[...$('sheet-list').querySelectorAll('[data-row]')].map(row=>({id:row.getAttribute('data-id')||'',title:row.querySelector('[data-f=title]').value,body:row.querySelector('[data-f=body]').value}));}
async function saveSaved(){
  readSaved();
  const cleaned=SR.filter(r=>r.title.trim()||r.body.trim());
  for(const r of cleaned){if(!r.title.trim()){toast('Each saved reply needs a short title.','err');return;}if(!r.body.trim()){toast('“'+(r.title.trim()||'A reply')+'” needs some text.','err');return;}}
  const btn=$('sheet-save');btn.disabled=true;btn.textContent='Saving…';
  const r=await api('/service/saved-replies','PUT',{replies:cleaned});
  btn.disabled=false;btn.textContent='Save changes';
  if(r.ok){toast('Saved replies updated.');closeSheet();}
  else if(r.status===422)toast('Please check your replies and try again.','err');
  else if(r.status===503)toast('Saved replies aren’t switched on for this site yet.','err');
  else toast('Couldn’t save just now — try again in a moment.','err');
}

// ── Customer FAQ ────────────────────────────────────────────────────────────
let FQ={intro:'',items:[]};
async function openFaq(){
  mountSheet(sheetShell('Customer FAQ','Answer the questions your clients ask most. They’ll see these in their portal — you decide what goes here. Nothing publishes until you press Save.','Add a question'));
  $('sheet-extra').innerHTML='<label class="fl"><span>Intro (optional)</span><input type="text" id="faq-intro" maxlength="500" placeholder="A friendly line above your questions…"></label>';
  $('sheet-list').innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';
  const r=await api('/service/faq');
  const d=(r.ok&&r.body.data)||{items:[]};
  FQ={intro:d.intro||'',items:(d.items||[]).map(x=>({q:x.q||'',a:x.a||''}))};
  $('faq-intro').value=FQ.intro;
  drawFaq();
  $('sheet-list').onclick=(e)=>listClick(e,readFaq,()=>FQ.items,drawFaq);
  $('sheet-add').onclick=()=>{readFaq();FQ.items.push({q:'',a:''});drawFaq();focusNewRow();};
  $('sheet-save').onclick=saveFaq;
}
function faqRow(it,i){return `<div class="erow" data-row>${mvCells(i,FQ.items.length)}`+
  `<div class="ef"><label class="fl"><span>Question</span><input type="text" data-f="q" maxlength="200" value="${esc(it.q)}" placeholder="e.g. How do I request a change?"></label>`+
  `<label class="fl"><span>Answer</span><textarea data-f="a" maxlength="4000" rows="3" placeholder="Write a clear, friendly answer…">${esc(it.a)}</textarea></label></div>`+
  `<button type="button" class="del" data-del aria-label="Remove this question">Remove</button></div>`;}
function drawFaq(){const b=$('sheet-list');b.innerHTML=FQ.items.length?FQ.items.map((it,i)=>faqRow(it,i)).join(''):'<p class="muted empty">No questions yet. Add your first one below.</p>';}
function readFaq(){const intro=$('faq-intro');FQ.intro=intro?intro.value:FQ.intro;FQ.items=[...$('sheet-list').querySelectorAll('[data-row]')].map(row=>({q:row.querySelector('[data-f=q]').value,a:row.querySelector('[data-f=a]').value}));}
async function saveFaq(){
  readFaq();
  const partial=FQ.items.some(x=>(x.q.trim()&&!x.a.trim())||(!x.q.trim()&&x.a.trim()));
  if(partial){toast('Each question needs both a question and an answer.','err');return;}
  const items=FQ.items.filter(x=>x.q.trim()&&x.a.trim());
  const btn=$('sheet-save');btn.disabled=true;btn.textContent='Saving…';
  const r=await api('/service/faq','PUT',{intro:FQ.intro.trim(),items});
  btn.disabled=false;btn.textContent='Save changes';
  if(r.ok){toast('Your FAQ is saved.');closeSheet();}
  else if(r.status===422)toast('Please check your questions and try again.','err');
  else if(r.status===503)toast('The FAQ isn’t switched on for this site yet.','err');
  else toast('Couldn’t save just now — try again in a moment.','err');
}
function signedOut(){$('main').innerHTML=`<div class="center"><h1>Sign in to see your inbox.</h1><p style="margin-top:18px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h1>We couldn’t load your inbox just now.</h1><p class="muted">A brief hiccup — refresh in a moment.</p></div>`;}
async function load(){
  const [feed,leads,notifs]=await Promise.all([api('/portal/feed'),api('/forms/inbox'),api('/notifications?limit=25').catch(()=>({ok:false}))]);
  if(!feed.ok&&!leads.ok){trouble();return;}
  const f=(feed.ok&&feed.body.data)||{};
  const l=(leads.ok&&leads.body.data&&leads.body.data.submissions)||[];
  render(f,l,(notifs.ok&&notifs.body.data)||[]);
  api('/notifications/read','POST',{}).catch(()=>{});   // opening the Inbox marks activity seen (clears the bell)
}
(async function(){try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";if(!TOKEN){signedOut();return;}await load();}catch(_){trouble();}})();
</script>
