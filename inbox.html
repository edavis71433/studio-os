<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inbox — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Everything that needs you — messages, approvals, and updates — in one place.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically). Same aliasing pattern
     as crm.html; only the timeline type accents are page-local. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* the timeline type accents — kept in sync with crm.html by hand */
    --act-message:var(--dds-p,#5b3fa0);--act-call:var(--dds-good,#33664b);--act-task:var(--dds-warn,#775d31);--act-system:var(--dds-faint,#746b8a);
    --act-email:#31708e;--act-note:#8a5a83;
  }
  @media (prefers-color-scheme:dark){:root{--act-email:#85b7cf;--act-note:#c9a3c2}}
  :root[data-theme="light"]{--act-email:#31708e;--act-note:#8a5a83}
  :root[data-theme="dark"]{--act-email:#85b7cf;--act-note:#c9a3c2}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--p);outline-offset:1px;border-radius:4px}
  a.link{color:var(--p);text-decoration:none;font-weight:500} a.link:hover{text-decoration:underline}
  @media (max-width:760.98px){#leadMailto{display:inline-flex;align-items:center;min-height:44px}}   /* phone tap target (experience review #43) */
  .muted{color:var(--soft);font-size:14px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none !important}}

  /* ── the console: split view ≥760px (list pane · edge toggle · reading pane) ── */
  .console{display:flex;align-items:stretch;height:calc(100vh - var(--dds-shell-h,54px));overflow:hidden}
  .lpane{width:24rem;max-width:80vw;flex:0 0 auto;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line)}
  .console.collapsed .lpane{display:none}
  .edge{flex:0 0 auto;width:16px;border:none;border-right:1px solid var(--line);background:var(--card);color:var(--faint);cursor:pointer;padding:0;font-size:9px;border-radius:0}
  .edge:hover{color:var(--p);background:var(--p-soft)}
  .rpane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

  /* ── list-pane header (SLDS list-view header anatomy, dds skin) ── */
  .lhead{border-bottom:1px solid var(--line);padding:10px 12px 8px;flex:0 0 auto}
  .lrow1{display:flex;align-items:center;gap:6px}
  .si{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.18em;flex:0 0 auto}
  .obj-ic{width:30px;height:30px;border-radius:var(--dds-r,8px);background:var(--p);color:#fff;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
  .viewdd{position:relative;min-width:0;flex:1}
  #viewBtn{font:inherit;font-weight:500;font-size:15.5px;color:var(--ink);background:none;border:none;border-radius:8px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;max-width:100%}
  #viewBtn:hover{background:var(--p-soft)}
  #viewBtn .car{font-size:10px;color:var(--faint)}
  #viewMenu{position:absolute;top:calc(100% + 4px);left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);padding:6px;z-index:30}
  #viewMenu [role=option]{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;font-size:14px;border:none;background:none;color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
  #viewMenu [role=option]:hover{background:var(--p-soft)}
  #viewMenu [role=option][aria-selected="true"]{color:var(--p);font-weight:700}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:8px;padding:5px 8px;cursor:pointer}
  .lbtn:hover{color:var(--p);background:var(--p-soft)}
  /* Oct 2026 nav cut: Broadcasts left the menu — "Send an update" lives here, on the Inbox */
  a.lsend{font-size:12.5px;font-weight:600;color:var(--p);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
  a.lsend:hover{background:var(--p-soft);border-color:var(--p)}
  @media (max-width:420px){a.lsend{display:none}}
  .ovf{position:relative}
  #ovfMenu{position:absolute;top:calc(100% + 4px);right:0;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);padding:6px;z-index:30}
  #ovfMenu button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;border:none;background:none;color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
  #ovfMenu button:hover{background:var(--p-soft)}
  .lmeta{margin-top:4px;font-size:12px;color:var(--faint)}
  .lnotice{margin-top:6px;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 9px}
  /* ── C2 search under the list-pane header — the rosters' .search anatomy ── */
  .lhead .search{width:100%;margin-top:8px;font-family:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;outline:none}
  .lhead .search:focus{border-color:var(--p)}
  /* ── the client · project lenses (Eric: "messages still cant be filtered by
     project/contact unless i go through their profile"). Native <select>s on
     purpose: ONE tap opens the system picker on his phone, and they wrap onto
     their own line under the search when the pane is narrow. An active lens is
     lit like pipeline.html's chosen stage chip, so a narrowed list never looks
     like an empty one. ── */
  .lfilters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .lfilters select{flex:1 1 45%;min-width:0;font-size:13px;padding:6px 9px;border-radius:999px;background:var(--bg)}
  .lfilters select[data-on="1"]{border-color:var(--p);color:var(--p);font-weight:700;background:var(--p-soft)}
  .lclear{margin-top:12px}
  /* ── the Enquiries view's triage toolbar (Oct 2026 audit, change 5: the old
     Enquiries page folded in here). Open · New · All are an honest role=group
     with aria-pressed; kind + sort are native selects; New enquiry logs a
     phone or walk-in enquiry. ── */
  .efilt{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .efilt button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border-radius:999px;padding:4px 11px;color:var(--soft)}
  .efilt button.on{background:var(--p-soft);color:var(--p);border-color:transparent}
  .efilt .n{font-size:11px;font-weight:600;background:var(--card);color:var(--soft);border-radius:999px;padding:0 6px;min-width:18px;text-align:center;line-height:17px}
  .efilt button.on .n{background:var(--p);color:#fff}
  .ebar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .ebar select{flex:1 1 30%;min-width:0;font-size:13px;padding:6px 9px;border-radius:999px;background:var(--bg)}
  .ebar select[data-on="1"]{border-color:var(--p);color:var(--p);font-weight:700;background:var(--p-soft)}
  .ebar #newEnq{flex:0 0 auto;font-size:12.5px;border-radius:999px;padding:6px 12px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* ── two-line rows (SLDS split-view listbox idiom) ── */
  #rows{flex:1;overflow-y:auto;list-style:none;margin:0;padding:0}
  .row{position:relative;display:flex;align-items:center;gap:9px;padding:11px 12px 11px 20px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:var(--bg)}
  .row[aria-selected="true"]{background:var(--p-soft);box-shadow:inset 3px 0 0 var(--p)}
  #rows.kbd .row.kfocus{outline:2px solid var(--p);outline-offset:-2px}
  .unread-dot{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--p);text-decoration:none;border:none}
  .avatar{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.02em}
  .row.sysrow .avatar{background:var(--bg);color:var(--faint);border:1px solid var(--line);font-size:15px}
  .rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .rtop{display:flex;align-items:baseline;gap:8px}
  .rname{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.unread .rname{font-weight:800}
  .rwhen{margin-left:auto;flex:0 0 auto;font-size:11.5px;color:var(--faint)}
  .rprev{display:flex;align-items:center;gap:7px;min-width:0}
  .rprev .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--soft)}
  .rchip{flex:0 0 auto;font-size:12px;font-weight:500;border-radius:999px;padding:1px 7px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .rchip.support{background:var(--warn-soft);color:var(--warn)}
  .rchip.lead{background:var(--good-soft);color:var(--good)}
  .cmbadge{flex:0 0 auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--faint);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .row.sysrow{opacity:.72}
  .row.sysrow.isread .rname{font-weight:400;color:var(--soft)}
  .lempty{padding:28px 18px;text-align:center;color:var(--soft);font-size:14px}

  /* ── reading pane ── */
  .phead{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
  .phead .avatar{width:40px;height:40px;font-size:14px}
  .pname{font-family:var(--sans);font-weight:600;font-size:19px;line-height:1.2}
  .psub{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft);margin-top:2px;flex-wrap:wrap}
  .pchip{display:inline-flex;align-items:center;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;background:var(--good-soft);color:var(--good)}
  .pchip.plain{background:var(--p-soft);color:var(--p)}
  .pback{display:none;font:inherit;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;flex:0 0 auto}
  /* Oct 2026 review: a support request's triage lives in the pane header —
     Resolve · Close · Make it a task — beside the honest status select. */
  .phead .pacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
  .phead .pacts button{padding:5px 11px;font-size:12.5px}
  .pchip.open,.pchip.in_progress{background:var(--warn-soft);color:var(--warn)}
  .pchip.resolved,.pchip.closed{background:var(--line);color:var(--soft)}
  @media (max-width:760px){.phead .pacts{margin-left:0;flex-basis:100%}}
  .pbody{flex:1;overflow-y:auto;padding:16px 18px}
  .pcomposer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--card);padding:12px 18px}
  .pcomposer textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:10px 12px;resize:vertical;min-height:58px}
  .pcomposer textarea:focus{outline:none;border-color:var(--p)}
  .crow{display:flex;gap:8px;align-items:center;margin-top:8px}
  .crow .spacer{flex:1}
  button{font-family:inherit;font-size:13.5px;font-weight:500;border-radius:var(--dds-r,8px);border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--p);color:var(--p)} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--p);color:#fff;border-color:var(--p)} button.primary:hover{background:var(--p-deep);color:#fff}
  a.btnlink,button.btnlink{display:inline-block;font-family:inherit;font-size:13px;font-weight:500;border-radius:var(--dds-r,8px);border:1px solid var(--p);background:transparent;color:var(--p);padding:6px 13px;text-decoration:none;cursor:pointer}
  a.btnlink:hover,button.btnlink:hover{background:var(--p-soft)}
  a.btnlink.primary,button.btnlink.primary{background:var(--p);color:#fff}
  .lreply{margin-top:12px;padding:10px 12px;border-left:3px solid var(--p);background:var(--p-soft);border-radius:0 var(--dds-r,8px) var(--dds-r,8px) 0}
  .lreply .body{margin-top:4px;white-space:pre-wrap}
  select{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:6px 9px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card .who{font-weight:600;font-size:15.5px}
  .card .body{margin-top:8px;font-size:14.5px;color:var(--soft);white-space:pre-wrap}
  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
  /* Phase 4 (triage): Spam is a quiet text button at the row's far end */
  .acts button.quiet{border-color:transparent;color:var(--faint);margin-left:auto}
  .acts button.quiet:hover{color:var(--ink);background:var(--bg)}
  .pchip.stchip.not_a_fit,.pchip.stchip.archived{background:var(--bg);color:var(--faint);border:1px solid var(--line)}
  /* ── dialogs: Make customer (Phase 2) and Log an enquiry ── */
  /* margin:auto puts the modal back in the middle (the page's *{margin:0} reset pins it top-left) */
  dialog{margin:auto;border:none;border-radius:var(--dds-r-lg,10px);padding:0;max-width:460px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:var(--dds-shadow-pop,0 20px 60px rgba(0,0,0,.25))}
  dialog::backdrop{background:rgba(21,20,26,.4)}
  #convForm,#newForm{padding:18px 20px}
  #convForm h3,#newForm h3{margin:0 0 4px;font-size:16px;font-weight:600}
  #convForm label,#newForm label{display:block;font-size:12.5px;color:var(--soft);margin:12px 0 4px}
  #convForm label.check,#newForm label.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13.5px;margin-top:14px}
  #convForm input[type=text],#convForm input[type=email],#newForm input[type=text],#newForm input[type=email],#newForm input[type=tel],#newForm textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:8px 10px}
  #newForm textarea{min-height:76px;resize:vertical}
  #convForm input:focus,#newForm input:focus,#newForm textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-soft)}
  #convForm .small,#newForm .small{font-size:12.5px;margin-top:10px}
  #convForm .row2,#newForm .row2{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #convForm button.primary,:root:not([data-theme="light"]) #newForm button.primary,:root:not([data-theme="light"]) #newEnq{color:#171320}}
  :root[data-theme="dark"] #convForm button.primary,:root[data-theme="dark"] #newForm button.primary,:root[data-theme="dark"] #newEnq{color:#171320}
  .center{text-align:center;padding:56px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px}
  .allclear{background:var(--good-soft);border:1px solid transparent;border-radius:var(--dds-r-lg,10px);color:var(--good);text-align:center;padding:22px;margin:0 auto;max-width:420px}
  .allart{font-size:40px;line-height:1;margin-bottom:10px}

  /* support thread bubbles (a back-and-forth is genuinely a chat here) */
  .bub{max-width:82%;border:1px solid var(--line);background:var(--card);border-radius:var(--dds-r-lg,10px);padding:9px 13px;font-size:14px;margin:7px 0;white-space:pre-wrap}
  .bub.studio{margin-left:auto;background:var(--p-soft);border-color:transparent}
  .bub .bwhen{display:block;font-size:11px;color:var(--faint);margin-top:4px}

  /* ── the timeline — kept in sync with crm.html by hand (.tl-month/.ti blocks) ── */
  .tl-month{font-size:12px;color:var(--faint);font-weight:500;margin:18px 0 4px;display:flex;align-items:center;gap:8px}
  .tl-month:after{content:"";flex:1;height:1px;background:var(--line)}
  .ti{position:relative;display:flex;gap:10px;padding:9px 0 9px 34px;align-items:flex-start}
  .ti:before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
  .ti:first-of-type:before{top:12px} .ti:last-of-type:before{bottom:auto;height:22px}
  .ti .ti-icon{position:absolute;left:1px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;box-shadow:0 0 0 3px var(--bg)}
  .ti.t-message:before{background:color-mix(in srgb,var(--act-message) 35%,transparent)} .ti.t-message .ti-icon{background:var(--act-message)}
  .ti.t-email:before{background:color-mix(in srgb,var(--act-email) 35%,transparent)} .ti.t-email .ti-icon{background:var(--act-email)}
  .ti.t-call:before{background:color-mix(in srgb,var(--act-call) 35%,transparent)} .ti.t-call .ti-icon{background:var(--act-call)}
  .ti.t-task:before{background:color-mix(in srgb,var(--act-task) 35%,transparent)} .ti.t-task .ti-icon{background:var(--act-task)}
  .ti.t-note:before{background:color-mix(in srgb,var(--act-note) 35%,transparent)} .ti.t-note .ti-icon{background:var(--act-note)}
  .ti.t-system:before{background:color-mix(in srgb,var(--act-system) 30%,transparent)} .ti.t-system .ti-icon{background:var(--act-system)}
  .ti-main{flex:1;min-width:0}
  .ti-head{display:flex;align-items:baseline;gap:7px;width:100%;border:none;background:none;font-family:inherit;font-size:13.5px;color:var(--ink);text-align:left;padding:0;min-width:0}
  button.ti-head{cursor:pointer;border-radius:0}
  .ti-title{font-weight:600;min-width:0}
  .ti-car{color:var(--faint);font-size:10px;flex:0 0 auto}
  .ti-meta{font-size:12px;font-weight:500;border-radius:999px;padding:1px 7px;background:var(--bg);border:1px solid var(--line);color:var(--faint);white-space:nowrap;flex:0 0 auto}
  .ti-body{font-size:13.5px;color:var(--soft);white-space:pre-wrap;margin-top:5px;border-left:2px solid var(--line);padding-left:10px}
  .ti-when{font-size:11.5px;color:var(--faint);white-space:nowrap;flex:0 0 auto;padding-top:2px}

  /* ── <760px: stacked — list first; picking a row pushes the pane in (D5) ── */
  @media (max-width:759px){
    .console{display:block;height:auto;min-height:calc(100vh - var(--dds-shell-h,54px));overflow:visible}
    .lpane{width:100%;max-width:none;border-right:none}
    #rows{overflow:visible}
    .edge{display:none}
    .rpane{display:none}
    .console.pane-open .lpane{display:none}
    .console.pane-open .rpane{display:flex;height:calc(100vh - var(--dds-shell-h,54px) - 72px)}
    .pback{display:inline-flex}
  }

  /* Support toolkit editor sheets (Saved replies, Customer FAQ) — unchanged */
  .sheet-back{position:fixed;inset:0;background:rgba(20,15,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:1000}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);width:100%;max-width:560px;padding:22px;margin:auto}
  .sheet-head{display:flex;align-items:center;gap:10px}
  .sheet-head h3{font-family:var(--serif);font-weight:500;font-size:21px;margin:0}

// SC-1: keep the agency drill-in scope on every internal link so a scoped operator

// ── state ─────────────────────────────────────────────────────────────────────
let FEED={},LEADS=[],NOTIFS=[],ITEMS=[],SYSROWS=[],TOTAL=0;

// A view can be deep-linked by hash (#ok, #website, #enquiries…): the retired

let VIEW=['messages','ok','enquiries','website','support'].indexOf(HASH_LINK.view)>=0?HASH_LINK.view:'everything',SEL='',ACTIVE=-1,COLLAPSED=false,Q='';
// the Enquiries view's own narrowing (the old Enquiries page's controls):

// ── the client · project lenses (D-filter) ───────────────────────────────────
// Eric: "messages still cant be filtered by project/contact unless i go through

// the rows THIS feed already handed us, so a lens can never surface a thread the
// Inbox wasn't already entitled to list, and #181 is untouched: a client's
// messages remain ONE grouped row whose body is still their record thread — we
// only narrow WHICH rows the list shows. The client id itself comes from 0115's

const QP=()=>new URLSearchParams(location.search);

// DELIBERATELY NOT `client=` — that param is the agency drill-in SCOPE that
// shell.js's carryScopeGlobally propagates; it is read here and written back

function inboxUrl(){

// SS6 shared ~150ms debounce — kept in sync by hand with contacts.html/customers.html

const VIEWS=[['everything','Everything'],['messages','Messages'],['ok','Needs your OK'],['enquiries','Enquiries'],['website','Website'],['support','Support & requests']];
const VIEW_LABEL=Object.fromEntries(VIEWS);

const inboxCount=()=>ITEMS.filter(x=>!x.queue).length+SYSROWS.length;

// ── build the conversation items from the ONE feed (+ enquiry fallback) ──────
// Messages from your clients — feed.client_messages, grouped ONE row per client
// (#181 heritage): the row's thread_key carries the per-thread unread state.
function buildItems(feed,leads,notifs){
  const items=[];
  const clientMsgs=(feed.client_messages||[]);
  // project NAME → id, harvested from the rows that carry both. Deploy-order
  // tolerance (both directions): a pre-lens function build stamps no project_id
  // on SUPPORT rows, but it does stamp the project NAME — so a support thread
  // still joins the right project lens instead of silently dropping out of it.
  const pidByName={};
  for(const c of clientMsgs){const pid=String(c.project_id||''),nm=String(c.project||'');if(pid&&nm&&!pidByName[nm])pidByName[nm]=pid;}
  const pidOf=(c)=>String(c.project_id||'')||(c.project?(pidByName[String(c.project)]||''):'');
  const groups=new Map();   // thread key → {name, rows}
  for(const c of clientMsgs.filter(x=>x.type==='message')){
    // NEVER drop a row: a pre-slice-2 function emits unbridged rows with neither
    // client_id nor thread_key (the old page grouped them as "Other clients").
    // Fallback chain client_id → thread_key → project_id → one misc bucket; every
    // key stays inside the /threads/read allowlist charset. Misc rows keep the
    // heuristic unread + their old href fallback (paneMessage → g.href/projects).
    const key=c.client_id?('client:'+c.client_id):(c.thread_key||('client:'+(c.project_id||'misc')));
    if(!groups.has(key))groups.set(key,{name:c.client||'Other clients',rows:[]});
    groups.get(key).rows.push(c);
  }

    const latest=g.rows.slice().sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))[0]||{};
    const needs=g.rows.some(r=>r.needs_reply);

    // builds degrade to the needs-reply heuristic (deploy-order tolerance)
    const unread=g.rows.some(r=>r.unread!=null?!!r.unread:!!r.needs_reply);

    // client even when that client has two projects — so the row must answer to
    // EITHER project's lens rather than only the newest one's.
    const projects=[],seenP=new Set();

      unread,needs,count:g.rows.reduce((n,r)=>n+(Number(r.count)||1),0),

    const pid=pidOf(c);

      name:c.client||'Support request',when:String(c.created_at||''),preview:c.subject||'A support request',
      chip:'Support'+(c.status?' · '+capFirst(String(c.status).replace(/_/g,' ')):''),chipCls:'support',status:String(c.status||'open'),
      unread:c.unread!=null?!!c.unread:true,needs:true,client_id:String(c.client_id||''),
      project_id:pid,projects:pid?[{id:pid,name:String(c.project||'')}]:[],href:String(c.href||'')});
  }
  for(const p of (feed.pending_approvals||[])){
    items.push({kind:'approval',id:'ok:'+p.id,name:p.title||'A change is ready',when:'',
      preview:p.summary||'Waiting for your OK',chip:'Needs your OK',chipCls:'',unread:true,needs:true,approval:p});
  }
  // enquiries: the feed's per-lead rows (slice 2 — the server serves status=new
  // only). An older function build without feed.enquiries degrades to the page's
  // own /forms/inbox read, counting NON-ARCHIVED (C7: the same arithmetic as
  // the Enquiries view's Open — one queue, one count; heuristic dots for 'new' only).
  // A feed row and a queue row for the same enquiry SHARE one lead object, so a
  // mark made from either view (read, replied, in pipeline) shows in both.

  const enq=(Array.isArray(feed.enquiries)?feed.enquiries:(leads||[]).filter(l=>l.status!=='archived'&&l.status!=='not_a_fit')).map(shared);
  // Phase 4 (triage): one row per PERSON. The same visitor submitting four forms
  // showed as four rows ("Eddie ×4"); they group under the newest, with a count.
  const byPerson=new Map();
  for(const l of enq){
    const key=String(l.email||'').trim().toLowerCase()||('id:'+l.id);
    const cur=byPerson.get(key);
    if(!cur){byPerson.set(key,{lead:l,count:1});continue;}
    cur.count++;
    if(String(l.created_at||'')>String(cur.lead.created_at||''))cur.lead=l;   // the newest fronts the row
  }
  for(const {lead:l,count} of byPerson.values()){
    items.push({kind:'lead',id:'lead:'+l.id,lead_id:String(l.id||''),thread_key:l.thread_key||('lead:'+l.id),
      name:(l.name||l.email||'Someone')+(count>1?` · ${count} messages`:''),when:String(l.created_at||''),preview:l.message||'A new enquiry from your website',
      chip:KIND[l.form_kind]||'Message',chipCls:'lead',unread:l.unread!=null?!!l.unread:String(l.status||'new')==='new',needs:true,lead:l});
  }
  // the Enquiries queue (the old Enquiries page): EVERY enquiry, one row each,
  // whatever its status — the view's chips decide which ones show
  for(const l of (leads||[])){
    items.push({kind:'lead',queue:true,id:'enq:'+l.id,lead_id:String(l.id||''),thread_key:l.thread_key||('lead:'+l.id),
      name:l.name||l.email||l.phone||'Someone',when:String(l.created_at||''),preview:l.message||'A new enquiry from your website',
      chip:KIND[l.form_kind]||'Message',chipCls:'lead',unread:l.unread!=null?!!l.unread:String(l.status||'new')==='new',needs:true,lead:l});

  items.sort((a,b)=>{if(!a.when&&!b.when)return 0;if(!a.when)return -1;if(!b.when)return 1;return b.when.localeCompare(a.when);});

// The old sections 5–6 (Project activity + Worth a look) fold into `Everything`

function buildSystem(feed,notifs){

  // avoid a double listing.

  const moments=(feed.moments||[]);

  // have first-class rows above, so they're filtered out here (as before).
  const activity=(Array.isArray(notifs)?notifs:[]).filter(n=>n.kind!=='support_message'&&n.kind!=='message').slice(0,12);

  // rows in view. It is only ever used to MATCH — never to name a lens option

  // exactly the dead affordance we're avoiding).
  activity.forEach((n,i)=>rows.push({sys:true,id:'sys:act:'+i,icon:si('cog'),label:n.label||'Activity',tag:'Project activity',when:String(n.created_at||''),read:!!n.read,project_id:String(n.project_id||''),href:scoped(notifLink(n))}));
  for(const n of notices)rows.push({sys:true,notice:true,id:'sys:not:'+n.id,icon:si('eye'),label:n.headline||'Something needs a look',tag:'Worth a look',when:'',read:false,href:scoped(n.href||'/today.html')});
  // moments render ACTIVE (undimmed, no ✓) — the feed only carries the still-open
  // ones, and the old page listed them as live items; they stay counted in TOTAL.
  for(const m of moments)rows.push({sys:true,id:'sys:mom:'+m.id,icon:si('sparkles'),label:m.headline||'A moment',tag:'Worth a look',when:String(m.created_at||''),read:false,href:scoped('/today.html')});
  return rows;
}

// a narrower list: the roving index resets, and a selection the list no longer

// ── the client · project lenses ───────────────────────────────────────────────
// Options are built ONLY from the rows already loaded — no extra read, no roster
// of clients this operator can't already see here. A lens that could return
// nothing is never offered: no client rows → no client select; no NAMED project
// on any row → no project select at all (the alternative, a dropdown that is
// always empty, is the defect we were told not to ship).
function lensOptions(){
  const cl=new Map(),pr=new Map();
  for(const it of ITEMS){
    if(it.client_id&&it.name)cl.set(String(it.client_id),String(it.name));
    for(const p of (it.projects||[]))if(p.id&&p.name&&!pr.has(String(p.id)))pr.set(String(p.id),String(p.name));
  }
  const byName=(a,b)=>a.name.localeCompare(b.name);
  const out={clients:[...cl].map(([id,name])=>({id,name})).sort(byName),projects:[...pr].map(([id,name])=>({id,name})).sort(byName)};
  // A linked/bookmarked lens whose thread has since resolved leaves an id with
  // no row behind it. Keep the filter ON (the empty state has to explain the
  // narrowing that is really in force) but say plainly that it matches nothing.
  if(FCLIENT&&!cl.has(FCLIENT))out.clients.unshift({id:FCLIENT,name:'Not in this inbox',unknown:true});
  if(FPROJECT&&!pr.has(FPROJECT))out.projects.unshift({id:FPROJECT,name:'Not in this inbox',unknown:true});
  return out;
}
function renderLenses(){
  const host=$('lfilters');if(!host)return;
  const o=lensOptions();
  const sel=(id,label,all,list,cur)=>`<select id="${id}" aria-label="${esc(label)}" data-on="${cur?'1':'0'}"><option value="">${esc(all)}</option>`+
    list.map(x=>`<option value="${esc(x.id)}"${x.id===cur?' selected':''}>${esc(x.name)}</option>`).join('')+`</select>`;
  let h='';
  if(o.clients.length)h+=sel('fClient','Filter by client','All clients',o.clients,FCLIENT);
  if(o.projects.length)h+=sel('fProject','Filter by project','All projects',o.projects,FPROJECT);
  host.innerHTML=h;host.hidden=!h;
  const fc=$('fClient');if(fc)fc.addEventListener('change',()=>applyLens('client',fc.value));
  const fp=$('fProject');if(fp)fp.addEventListener('change',()=>applyLens('project',fp.value));
}
// Changing a lens repaints the LIST only — the <select> nodes are left standing
// so focus (and the phone's just-dismissed picker) survives, the same contract
// C2's search input holds.
function applyLens(which,val){
  if(which==='client')FCLIENT=val;else FPROJECT=val;
  history.replaceState(null,'',inboxUrl());   // pipeline.html's listUrl idiom: the narrowed view is linkable
  ACTIVE=-1;
  if(SEL&&!visibleRows().some(r=>r.id===SEL))SEL='';   // never strand the pane on a row the list no longer shows
  const fc=$('fClient'),fp=$('fProject');
  if(fc){fc.value=FCLIENT;fc.setAttribute('data-on',FCLIENT?'1':'0');}
  if(fp){fp.value=FPROJECT;fp.setAttribute('data-on',FPROJECT?'1':'0');}
  renderList();renderPane();
}
function clearLenses(){
  Q='';FCLIENT='';FPROJECT='';
  history.replaceState(null,'',inboxUrl());
  const qi=$('q');if(qi)qi.value='';
  ACTIVE=-1;renderLenses();renderList();renderPane();
  if(qi)qi.focus();
}
// ONE delegated handler for every "clear" the empty states offer (list pane and
// reading pane) — they are re-rendered constantly; per-render listeners pile up.
document.addEventListener('click',(e)=>{if(e.target&&e.target.closest&&e.target.closest('[data-clear]')){e.preventDefault();clearLenses();}});
// back/forward must never leave the chrome disagreeing with the URL
window.addEventListener('popstate',()=>{
  readFiltersFromUrl();ACTIVE=-1;
  if(SEL&&!visibleRows().some(r=>r.id===SEL))SEL='';
  renderLenses();renderList();renderPane();
});
// C2: the search filters EVERYTHING the list shows — conversations (name ·
// preview · chip) and system rows (label · tag) alike.
function rowMatch(r){
  const q=Q.trim().toLowerCase();if(!q)return true;
  // an enquiry also answers to its email and phone (the old Enquiries search)
  const l=r.lead||{};
  const hay=r.sys?((r.label||'')+' '+(r.tag||'')):((r.name||'')+' '+(r.preview||'')+' '+rowChip(r)+' '+(l.email||'')+' '+(l.phone||''));
  return hay.toLowerCase().includes(q);
}
// the Enquiries view's status chip + kind filter (other views: no-op)
function enqMatch(r){
  if(VIEW!=='enquiries'||r.kind!=='lead')return true;
  const l=r.lead||{},st=String(l.status||'new');
  if(EFILTER==='open'&&(st==='archived'||st==='not_a_fit'))return false;
  if(EFILTER==='new'&&st!=='new')return false;
  return KIND_F==='all'||(l.form_kind||'contact')===KIND_F;
}
// Phase 4 (triage): where an enquiry went, in plain words. `new` and `read`
// show nothing (the dot says "new"); in the pipeline shows the deal link.
const STATUS_LABEL={replied:'Replied',not_a_fit:'Not a fit',archived:'Not a fit'};
// a queue row's chip says the kind AND where it went, so All reads at a glance
function rowChip(r){
  if(!(r.queue&&r.lead))return r.chip||'';
  const st=r.lead.converted?'In pipeline':STATUS_LABEL[r.lead.status];
  return (KIND[r.lead.form_kind]||'Message')+(st?' · '+st:'');
}
// The lenses narrow by IDENTITY, not by text — a client row answers to its own
// client_id (0115's durable link, resolved server-side), a conversation to every
// project it actually spans. A row with no such link (an approval, a website
// enquiry, an unattributed conversation, a notice) simply isn't part of that
// client's or project's world, so a live lens leaves it out; the empty state
// below says which lens did it.
const itemClients=(r)=>(r.sys||!r.client_id)?[]:[String(r.client_id)];
const itemProjects=(r)=>r.sys?(r.project_id?[String(r.project_id)]:[]):((r.projects||[]).map(p=>String(p.id)).filter(Boolean));
function lensMatch(r){
  if(FCLIENT&&itemClients(r).indexOf(FCLIENT)<0)return false;
  if(FPROJECT&&itemProjects(r).indexOf(FPROJECT)<0)return false;
  return true;
}
// the Website view = what your site needs: approvals, its enquiries, and the site's own notices
function visibleRows(){
  const v=[...ITEMS.filter(viewMatch),...(VIEW==='everything'?SYSROWS:VIEW==='website'?SYSROWS.filter(r=>r.notice):[])].filter(lensMatch).filter(rowMatch).filter(enqMatch);
  // the Enquiries view can flip to oldest first (ITEMS are newest first)
  return (VIEW==='enquiries'&&SORT==='oldest')?v.sort((a,b)=>String(a.when).localeCompare(String(b.when))):v;
}
// Every narrowing that is actually in force, in plain words. The VIEW is left
// out on purpose — it has its own visible control and its own older copy.
function activeLens(){
  const o=lensOptions(),bits=[];
  if(Q.trim())bits.push('“'+esc(Q.trim())+'”');
  if(FCLIENT)bits.push('client “'+esc(lensLabel(o.clients,FCLIENT))+'”');
  if(FPROJECT)bits.push('project “'+esc(lensLabel(o.projects,FPROJECT))+'”');
  return bits;
}
const lensLabel=(list,id)=>{const f=list.filter(x=>x.id===id)[0];return f?f.name:'Not in this inbox';};
const joinBits=(b)=>b.length<3?b.join(' and '):(b.slice(0,-1).join(', ')+' and '+b[b.length-1]);
const clearLabel=(n)=>'Clear '+(n===1?'this filter':'these filters');
function paintActive(){
  const rows=$('rows');const vis=visibleRows();
  rows.querySelectorAll('.row').forEach((el,i)=>el.classList.toggle('kfocus',i===ACTIVE));
  if(ACTIVE>=0&&vis[ACTIVE]){rows.setAttribute('aria-activedescendant','row-'+cssId(vis[ACTIVE].id));const el=rows.querySelector('.row.kfocus');if(el)el.scrollIntoView({block:'nearest'});}
}
const cssId=(s)=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_');
function activateRow(it){if(it.sys){location.href=it.href||'/today.html';return;}openItem(it.id);}

// ── the list pane rows (two-line, unread dot, channel chip) ──────────────────
function renderList(){
  const rows=$('rows');if(!rows)return;
  const vis=visibleRows();
  const convs=vis.filter(r=>!r.sys);   // the meta counts what the list SHOWS (search included)
  const need=convs.filter(i=>i.unread||i.needs).length;
  if(VIEW==='enquiries'){
    // C7: "N enquiries · M new" — what the queue SHOWS (chip, kind and search
    // included) with the "M new" qualifier; the chips carry the totals.
    const newN=convs.filter(i=>i.lead&&String(i.lead.status||'new')==='new').length;
    $('lmeta').textContent=`${convs.length} enquir${convs.length===1?'y':'ies'} · ${newN} new · Sorted by ${SORT==='oldest'?'oldest':'newest'}`;
    paintEnqCounts();
  }else{
    $('lmeta').textContent=`${convs.length} conversation${convs.length===1?'':'s'} · ${need} need${need===1?'s':''} you · Sorted by newest`;
  }
  // partial-failure honesty: one of the two reads failed (loadData renders the
  // surviving half) — say so instead of presenting a quietly complete inbox
  const ln=$('lnotice');
  if(ln){
    const miss=FEED_FAILED?'messages and approvals':LEADS_FAILED?'website enquiries':'';
    if(miss){ln.textContent=`Part of your inbox couldn’t load just now — ${miss} may be missing. Refresh to try again.`;ln.hidden=false;}
    else ln.hidden=true;
  }
  // An empty list must name what emptied it and hand back a one-press way out —
  // this codebase's recurring defect is the empty state that won't say why.
  if(!vis.length){
    const bits=activeLens();
    // the Enquiries view's own narrowing names itself (the old page's copy)
    if(VIEW==='enquiries'&&!FCLIENT&&!FPROJECT){
      const msg=(Q.trim()||KIND_F!=='all')?`No enquiries match${Q.trim()?` “${esc(Q.trim())}”`:' that filter'}.`
        :EFILTER==='new'?'No new enquiries — you’re caught up.'
        :'Nothing yet. When someone fills in your website’s contact form, it lands here — and in Customers.';
      rows.innerHTML=`<li class="lempty" role="presentation">${msg}${bits.length?`<div class="lclear"><button type="button" data-clear>${clearLabel(bits.length)}</button></div>`:''}</li>`;
      renderPane();return;
    }
    rows.innerHTML=`<li class="lempty" role="presentation">${bits.length
      ?`Nothing here matches ${joinBits(bits)}.<div class="lclear"><button type="button" data-clear>${clearLabel(bits.length)}</button></div>`
      :VIEW==='everything'&&!TOTAL?((FEED_FAILED||LEADS_FAILED)?'Nothing we could load just now.':'✓ You’re all caught up.'):'Nothing here — this view is all clear.'}</li>`;
    renderPane();return;
  }
  let h='';
  for(const it of vis){
    if(it.sys){
      h+=`<li class="row sysrow${it.read?' isread':''}" role="option" id="row-${cssId(it.id)}" data-id="${esc(it.id)}" aria-selected="false">
        <span class="avatar" aria-hidden="true">${it.icon}</span>
        <span class="rmain"><span class="rtop"><span class="rname">${it.read?'✓ ':''}${esc(it.label)}</span>${it.when?`<span class="rwhen">${esc(when(it.when))}</span>`:''}</span>
        <span class="rprev"><span class="rchip">${esc(it.tag)}</span><span class="txt">Opens in its own page →</span></span></span></li>`;
      continue;
    }
    h+=`<li class="row${it.unread?' unread':''}" role="option" id="row-${cssId(it.id)}" data-id="${esc(it.id)}" aria-selected="${SEL===it.id?'true':'false'}">
      ${it.unread?'<span class="unread-dot" role="img" aria-label="Unread"></span>':''}
      <span class="avatar" aria-hidden="true">${it.kind==='approval'?'✓':initialsOf(it.name)}</span>
      <span class="rmain">
        <span class="rtop"><span class="rname">${esc(it.name)}</span>${it.when?`<span class="rwhen">${esc(when(it.when))}</span>`:''}</span>
        <span class="rprev"><span class="rchip ${it.chipCls}">${esc(rowChip(it))}</span><span class="txt">${esc(it.preview)}</span>${it.count>1?`<span class="cmbadge">${it.count}</span>`:''}</span>
      </span></li>`;
  }
  rows.innerHTML=h;
  rows.querySelectorAll('.row').forEach((el,i)=>el.addEventListener('click',()=>{ACTIVE=i;rows.classList.remove('kbd');const it=vis[i];activateRow(it);}));
}

// ── opening a row: select it, clear ITS dot (optimistic + POST /threads/read) ─
function openItem(id){
  const it=ITEMS.find(x=>x.id===id);if(!it)return;
  SEL=id;
  it.unread=false;   // the dot clears the moment the conversation opens (optimistic)
  // …and on its twin: an enquiry's feed row and queue row are one thread
  if(it.thread_key)ITEMS.forEach(x=>{if(x.thread_key===it.thread_key)x.unread=false;});
  if(it.thread_key)api('/threads/read','POST',{thread_key:it.thread_key}).catch(()=>{});

  renderPane();
  const c=$('console');if(c)c.classList.add('pane-open');   // <760px: push the pane in

}
// a11y: opening a conversation must MOVE focus — on mobile the list is hidden and
// focus would drop to <body> with nothing announced. Mobile (<760px) → the back
// button; desktop → the pane heading (tabindex=-1: focusable, not in tab order).
// The pane head renders synchronously, so this runs before the body loads.
function focusPane(){
  const back=$('paneBack');
  if(window.matchMedia('(max-width:759px)').matches&&back){back.focus();return;}
  const h=document.querySelector('#rpane .pname');
  if(h){h.setAttribute('tabindex','-1');h.focus();}
}
// closing back returns focus to the listbox — the roving ACTIVE row stays intact
function closePane(){SEL='';const c=$('console');if(c)c.classList.remove('pane-open');renderList();renderPane();const r=$('rows');if(r)r.focus();}

// ── the reading pane ──────────────────────────────────────────────────────────
function renderPane(){
  const host=$('rpane');if(!host)return;

  if(!it){
    // ONE chokepoint: no selection → never strand `pane-open` (on mobile the list
    // is display:none and there's no back button). Covers every SEL-clearing flow

    const c=$('console');if(c)c.classList.remove('pane-open');

// ── A client-message row → compact record header + the client's activity

//    Data: GET /crm/activity — with slice 1's deploy-order fallback idiom
//    (route not there yet → compose the same shape from /crm/messages). ──
let PANE_SEQ=0;   // a stale async pane render must never paint over a newer one
// refresh() rebuilds the pane and would destroy an in-progress reply — snapshot
// the composer drafts + focus before the rebuild and restore after the async
// pane render lands (slice-1's snapComposer pattern, crm.html). The draft is
// keyed to the SELECTED item so it can never leak into another conversation;
// successful sends clear their field BEFORE re-rendering, so nothing resurrects.
const COMPOSER_FIELDS=['msgBody','supBody','leadBody'];
let DRAFT=null;   // {sel, vals, focus} — set by refresh(), consumed once by the pane loaders
// ── C3 (SS6): insertSavedReplies(textareaId) — the shared saved-reply insert.
// ONE lazy cached fetch of /service/saved-replies per page-load; a picker only
// renders when replies exist (no dead chrome for studios without any). Bodies
// live in a JS map keyed by id (projects.html's picker idiom — nothing goes
// into an attribute); insert APPENDS after what's typed and refocuses the
// textarea. Kept in sync by hand with crm.html's copy. ──
// SCOPE DOCTRINE (SS6, flagged decision): this page's api() carries the
// drill-in ?client= scope, so a drilled-in operator's picker AND the ⋯
// Saved-replies manager both resolve to the CUSTOMER site's reply set —
// "replies live where the conversation lives". crm.html's picker holds the
// opposite doctrine (apiAg: always the OPERATOR's own replies, even on a
// customer-scoped record). Both are defensible; which one wins is Eric's
// call (punchlist). Do not "align" either side without that decision. ──
let SR_FETCH=null;
function insertSavedReplies(taId){
  const ta=$(taId);if(!ta)return;

  SR_FETCH.then((replies)=>{
    const cur=$(taId);
    if(!replies.length||cur!==ta)return;   // nothing saved / the pane re-rendered under us
    if(ta.previousElementSibling&&ta.previousElementSibling.classList.contains('sr-pick'))return;

  const qs=[];

// thin adapter mirroring the server's crm/activity.ts mappers — kept in sync
// with crm.html by hand (its convItem; only the channels this pane renders)
function convItem(m){
  if(!m||!m.created_at)return null;
  const at=m.created_at,id='conv:'+m.kind+':'+(m.id||''),mine=m.from==='studio',body=m.body||null;
  if(m.kind==='message')return{id,kind:'message',type:'message',title:mine?'You sent a message':'The client sent a message',body,at,meta:null};
  if(m.kind==='support')return{id,kind:'support',type:'message',title:(mine?'You':'The client')+' opened a support request'+(m.subject?' — '+m.subject:''),body,at,meta:'Support'+(m.status?' · '+String(m.status).replace(/_/g,' '):'')};
  if(m.kind==='support_reply')return{id,kind:'support_reply',type:'message',title:mine?'You replied':'The client replied',body,at,meta:'Support'};
  if(m.kind==='enquiry')return{id,kind:'enquiry',type:'message',title:'The client reached out from your website',body,at,meta:'Website enquiry'};
  if(m.kind==='booking')return{id,kind:'booking',type:'call',title:m.subject||'The client booked a call',body,at,meta:'Booking'};
  if(m.kind==='broadcast')return{id,kind:'broadcast',type:'email',title:'You sent a broadcast'+(m.subject?' — '+m.subject:''),body,at,meta:'Broadcast'};
  if(m.kind==='activity'){

// the timeline renderer — kept in sync with crm.html by hand (its

const TYPE_ICON={message:si('message'),email:si('mail'),call:si('phone'),task:si('check'),note:si('pencil'),system:si('cog')};
const EXPANDED=new Set();
function renderTL(host,items){

const SUPPORT_LABEL={open:'Open',in_progress:'In progress',resolved:'Resolved',closed:'Closed'};
// Oct 2026 review: ONE path for every status change — the select, the header's

// not.in.(resolved,closed) for the feed), so the next refresh agrees with us.
async function setSupportStatus(host,it,to,ctl){
  if(!to||to===it.status)return false;
  if(ctl)ctl.disabled=true;
  const pr=await api('/support/'+encodeURIComponent(it.support_id),'PATCH',{status:to});
  if(pr.ok){
    toast(to==='resolved'?'Resolved — nice work.':to==='closed'?'Closed.':'Status updated.');

    if(to==='resolved'||to==='closed'){ITEMS=ITEMS.filter(x=>x.id!==it.id);SEL='';renderList();renderPane();renderConsole();bumpBell();return true;}
    renderList();paneSupport(host,it);return true;

function leadGreeting(l){return (l.name?`Hi ${String(l.name).split(' ')[0]},`:'Hi,')+'\n\nThanks for reaching out. ';}
function paneLead(host,it){
  const l=it.lead||{};

// ONE path for every enquiry mark. The lead object is shared by the enquiry's
// feed row and its queue row, so the new status shows in every view at once;
// rows that can no longer show it drop out (Everything lists only what's still
// waiting; spam leaves everywhere), and the pane lets go of a row the list no
// longer shows. Focus never drops to <body>: it stays in the pane when the row
// stays, else returns to the list.
function leadMarked(it,status){
  const id=it.lead_id;
  if(status!=='spam'&&it.lead)it.lead.status=status;
  const leaves=(x)=>status==='spam'||(!x.queue&&(status==='archived'||status==='not_a_fit'));
  ITEMS=ITEMS.filter(x=>!(x.kind==='lead'&&x.lead_id===id&&leaves(x)));
  ITEMS.forEach(x=>{if(x.kind==='lead'&&x.lead_id===id&&status!=='new')x.unread=false;});
  TOTAL=inboxCount();
  if(SEL&&!visibleRows().some(r=>r.id===SEL))SEL='';
  renderList();renderPane();
  if(!SEL){const r=$('rows');if(r)r.focus();return;}
  const h=document.querySelector('#rpane .pname');
  const f=(status==='read'||status==='not_a_fit')&&$('leadNotFit')||h;
  if(f){if(f===h)h.setAttribute('tabindex','-1');f.focus();}
}
// The Today nudge ("A quote request is waiting for a reply") and the Inbox's
// own "Worth a look" row for it are the feed's lead_followup notice. The server
// retires it on its next pass; until then this clears it locally and leaves a
// 24-hour marker today.html reads, so neither page keeps asking for a reply
// that went out (experience review #45).
function clearLeadNudge(leadId){
  const id=String(leadId||'');if(!id)return;
  const mine=(n)=>!!n&&n.kind==='lead_followup'&&(String(n.period||'')==='lead:'+id||String(n.href||'').indexOf('lead:'+id)>=0);
  if((FEED.notices||[]).some(mine)){FEED.notices=FEED.notices.filter(n=>!mine(n));SYSROWS=buildSystem(FEED,NOTIFS);TOTAL=inboxCount();renderList();}   // the list only — the pane keeps the reply it just showed
  try{const k='dds-replied-leads';const m=JSON.parse(localStorage.getItem(k)||'{}')||{};m[id]=Date.now();localStorage.setItem(k,JSON.stringify(m));}catch(_){}
  bumpBell();
}
async function setLeadStatus(it,status,btn){

  toast(status==='not_a_fit'?'Marked not a fit — it’s off your list.':status==='replied'?'Marked replied.':'Marked read.');

}

// Prefill the reply so responding is one tap
function leadReplyHref(l){
  const kind=l.form_kind==='quote'?'quote request':l.form_kind==='booking'?'booking request':'message';
  const hi=l.name?`Hi ${l.name.split(' ')[0]},`:'Hi,';

// P2-C (Seam 3): promote a captured enquiry into a pipeline deal — no re-typing
// (source_submission_id carries the enquiry; the server copies its text).
// Navigates to the new Record.
async function createDeal(it,btn){
  const l=it.lead||{},id=it.lead_id;btn.disabled=true;
  const title=(l.name||l.email||'New enquiry')+((l.form_kind&&l.form_kind!=='contact')?(' — '+l.form_kind):'');

    if(l.email){const c=await api('/sales/contacts','POST',{name:l.name||'',email:l.email,phone:l.phone||''});if(c.ok)contactId=c.body&&c.body.data&&c.body.data.id;}
    const d=await api('/sales/deals','POST',{title,contact_id:contactId,source:'website_form',source_submission_id:id});
    if(!d.ok){toast(d.status===403?'The pipeline is part of your plan’s business tools — an upgrade adds it.':((d.body&&d.body.message)||'Couldn’t start that deal.'));btn.disabled=false;return;}
    const dealId=d.body&&d.body.data&&d.body.data.id;

    // (idempotent: the server returns the existing deal on a repeat)
    l.converted=true;l.deal_id=dealId;

  }catch(_){toast('Couldn’t start that deal.');btn.disabled=false;}
}

// ── data load / refresh ───────────────────────────────────────────────────────
// REQ_SEQ (SS6, from the old Enquiries page): a superseded load never paints —
// two quick refreshes whose first response lands last keep the newest rows.
let REQ_SEQ=0;
async function loadData(){
  const seq=++REQ_SEQ;
  const [feed,leads,notifs]=await Promise.all([api('/portal/feed'),api('/forms/inbox'),api('/notifications?limit=25').catch(()=>({ok:false,body:{}}))]);
  if(seq!==REQ_SEQ)return 'stale';
  if(!feed.ok&&!leads.ok)return false;
  // exactly one of feed/leads failing still renders the surviving half — but
  // WITH a notice (renderList), never as a quietly complete inbox
  FEED_FAILED=!feed.ok;LEADS_FAILED=!leads.ok;
  FEED=(feed.ok&&feed.body.data)||{};
  LEADS=(leads.ok&&leads.body.data&&leads.body.data.submissions)||[];
  NOTIFS=(notifs.ok&&Array.isArray(notifs.body.data))?notifs.body.data:[];
  ITEMS=buildItems(FEED,LEADS,NOTIFS);
  SYSROWS=buildSystem(FEED,NOTIFS);
  // the meta line's honesty: TOTAL counts what the Everything view actually
  // RENDERS (conversation items + system rows) — never raw feed rows, which
  // group and fold differently (one row per client; moments stay counted).
  TOTAL=inboxCount();
  return true;
}
async function refresh(){
  let ok=false;
  try{ok=await loadData();}catch(_){ok=false;}   // a network-level reject must still fire the toast
  if(ok==='stale')return;   // a newer refresh owns the page
  if(!ok){toast('Couldn’t refresh just now.');return;}
  DRAFT=snapComposer();   // an in-progress reply survives the pane rebuild (restored by the pane loaders)
  if(SEL&&!ITEMS.some(x=>x.id===SEL))SEL='';
  renderLenses();   // a resolved thread can retire a lens option — repaint them off the fresh feed
  renderList();renderPane();
}

// Shared up/down/remove handling. readFn snapshots the typed values into state
// BEFORE any structural change, so nothing you've typed is lost on reorder.
function listClick(e,readFn,arrGet,drawFn){
  const row=e.target.closest('[data-row]');if(!row)return;
  const rows=[...$('sheet-list').querySelectorAll('[data-row]')];const i=rows.indexOf(row);
  if(e.target.closest('[data-del]')){readFn();const a=arrGet();a.splice(i,1);drawFn();}
  else if(e.target.closest('[data-mv=up]')&&i>0){readFn();const a=arrGet();[a[i-1],a[i]]=[a[i],a[i-1]];drawFn();}
  else if(e.target.closest('[data-mv=down]')){readFn();const a=arrGet();if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];drawFn();}}
}

async function saveFaq(){
  readFaq();
  const partial=FQ.items.some(x=>(x.q.trim()&&!x.a.trim())||(!x.q.trim()&&x.a.trim()));
  if(partial){toast('Each question needs both a question and an answer.','err');return;}
  const items=FQ.items.filter(x=>x.q.trim()&&x.a.trim());
  const btn=$('sheet-save');btn.disabled=true;btn.textContent='Saving…';
  const r=await api('/service/faq','PUT',{intro:FQ.intro.trim(),items});
  btn.disabled=false;btn.textContent='Save changes';
  if(r.ok){toast('Your FAQ is saved.');closeSheet();}
  else if(r.status===422)toast('Please check your questions and try again.','err');
  else if(r.status===503)toast('The FAQ isn’t switched on for this site yet.','err');
  else toast('Couldn’t save just now — try again in a moment.','err');
}

// ── boot ──────────────────────────────────────────────────────────────────────
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to see your inbox.</h2><p style="margin-top:18px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load your inbox just now.</h2><p class="muted">A brief hiccup — try again in a moment.</p><p><button type="button" class="btnlink primary" id="retryLoad">Try again</button></p></div>`;const b=$('retryLoad');if(b)b.addEventListener('click',()=>{b.disabled=true;load();});}
const capFirst=(s)=>{s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);};
async function load(){
  readFiltersFromUrl();   // a linked ?client_id=/?project= view lands already narrowed
  const ok=await loadData();
  if(ok==='stale')return;
  if(!ok){trouble();return;}
  renderConsole();renderList();renderPane();
  openLinkedRow();
  api('/notifications/read','POST',{}).catch(()=>{});   // opening the Inbox marks activity seen (clears the bell)
}
// the deep-linked row (?sel=lead:<id>, or a row id): opened exactly as a click
// would — selected, its dot cleared, the pane in (and slid in on phones). A row
// the view shows is preferred; one it does not is still opened, never invented.
function openLinkedRow(){
  const want=HASH_LINK.sel;if(!want)return;
  const m=/^lead:(.+)$/.exec(want);
  const byLead=(r)=>r.kind==='lead'&&r.lead_id===m[1];
  const it=m?(visibleRows().find(byLead)||ITEMS.find(byLead)):ITEMS.find(r=>r.id===want);
  if(!it)return;
  openItem(it.id);
  const row=document.getElementById('row-'+cssId(it.id));if(row&&row.scrollIntoView)row.scrollIntoView({block:'nearest'});
}
(async function(){try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";if(!TOKEN){signedOut();return;}await load();}catch(_){trouble();}})();
