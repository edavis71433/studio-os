<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inbox — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Everything that needs you — messages, approvals, and updates — in one place.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically). Same aliasing pattern
     as crm.html; only the timeline type accents are page-local. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* the timeline type accents — kept in sync with crm.html by hand */
    --act-message:var(--dds-p,#5b3fa0);--act-call:var(--dds-good,#33664b);--act-task:var(--dds-warn,#775d31);--act-system:var(--dds-faint,#746b8a);
    --act-email:#31708e;--act-note:#8a5a83;
  }
  @media (prefers-color-scheme:dark){:root{--act-email:#85b7cf;--act-note:#c9a3c2}}
  :root[data-theme="light"]{--act-email:#31708e;--act-note:#8a5a83}
  :root[data-theme="dark"]{--act-email:#85b7cf;--act-note:#c9a3c2}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--p);outline-offset:1px;border-radius:4px}
  a.link{color:var(--p);text-decoration:none;font-weight:600} a.link:hover{text-decoration:underline}
  .muted{color:var(--soft);font-size:14px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none !important}}

  /* ── the console: split view ≥760px (list pane · edge toggle · reading pane) ── */
  .console{display:flex;align-items:stretch;height:calc(100vh - var(--dds-shell-h,54px));overflow:hidden}
  .lpane{width:24rem;max-width:80vw;flex:0 0 auto;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line)}
  .console.collapsed .lpane{display:none}
  .edge{flex:0 0 auto;width:16px;border:none;border-right:1px solid var(--line);background:var(--card);color:var(--faint);cursor:pointer;padding:0;font-size:9px;border-radius:0}
  .edge:hover{color:var(--p);background:var(--p-soft)}
  .rpane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

  /* ── list-pane header (SLDS list-view header anatomy, dds skin) ── */
  .lhead{border-bottom:1px solid var(--line);padding:10px 12px 8px;flex:0 0 auto}
  .lrow1{display:flex;align-items:center;gap:6px}
  .obj-ic{width:30px;height:30px;border-radius:9px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
  .viewdd{position:relative;min-width:0;flex:1}
  #viewBtn{font:inherit;font-weight:700;font-size:15.5px;color:var(--ink);background:none;border:none;border-radius:8px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;max-width:100%}
  #viewBtn:hover{background:var(--p-soft)}
  #viewBtn .car{font-size:10px;color:var(--faint)}
  #viewMenu{position:absolute;top:calc(100% + 4px);left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30}
  #viewMenu [role=option]{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;font-size:14px;border:none;background:none;color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
  #viewMenu [role=option]:hover{background:var(--p-soft)}
  #viewMenu [role=option][aria-selected="true"]{color:var(--p);font-weight:700}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:8px;padding:5px 8px;cursor:pointer}
  .lbtn:hover{color:var(--p);background:var(--p-soft)}
  .ovf{position:relative}
  #ovfMenu{position:absolute;top:calc(100% + 4px);right:0;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30}
  #ovfMenu button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;border:none;background:none;color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
  #ovfMenu button:hover{background:var(--p-soft)}
  .lmeta{margin-top:4px;font-size:12px;color:var(--faint)}
  .lnotice{margin-top:6px;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 9px}
  /* ── C2 search under the list-pane header — the rosters' .search anatomy ── */
  .lhead .search{width:100%;margin-top:8px;font-family:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;outline:none}
  .lhead .search:focus{border-color:var(--p)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* ── two-line rows (SLDS split-view listbox idiom) ── */
  #rows{flex:1;overflow-y:auto;list-style:none;margin:0;padding:0}
  .row{position:relative;display:flex;align-items:center;gap:9px;padding:11px 12px 11px 20px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:var(--bg)}
  .row[aria-selected="true"]{background:var(--p-soft);box-shadow:inset 3px 0 0 var(--p)}
  #rows.kbd .row.kfocus{outline:2px solid var(--p);outline-offset:-2px}
  .unread-dot{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--p);text-decoration:none;border:none}
  .avatar{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.02em}
  .row.sysrow .avatar{background:var(--bg);color:var(--faint);border:1px solid var(--line);font-size:15px}
  .rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .rtop{display:flex;align-items:baseline;gap:8px}
  .rname{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.unread .rname{font-weight:800}
  .rwhen{margin-left:auto;flex:0 0 auto;font-size:11.5px;color:var(--faint)}
  .rprev{display:flex;align-items:center;gap:7px;min-width:0}
  .rprev .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--soft)}
  .rchip{flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 7px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .rchip.support{background:var(--warn-soft);color:var(--warn)}
  .rchip.lead{background:var(--good-soft);color:var(--good)}
  .cmbadge{flex:0 0 auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--faint);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .row.sysrow{opacity:.72}
  .row.sysrow.isread .rname{font-weight:400;color:var(--soft)}
  .lempty{padding:28px 18px;text-align:center;color:var(--soft);font-size:14px}

  /* ── reading pane ── */
  .phead{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
  .phead .avatar{width:40px;height:40px;font-size:14px}
  .pname{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.2}
  .psub{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft);margin-top:2px;flex-wrap:wrap}
  .pchip{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--good-soft);color:var(--good)}
  .pchip.plain{background:var(--p-soft);color:var(--p)}
  .pback{display:none;font:inherit;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;flex:0 0 auto}
  .pbody{flex:1;overflow-y:auto;padding:16px 18px}
  .pcomposer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--card);padding:12px 18px}
  .pcomposer textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:58px}
  .pcomposer textarea:focus{outline:none;border-color:var(--p)}
  .crow{display:flex;gap:8px;align-items:center;margin-top:8px}
  .crow .spacer{flex:1}
  button{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--p);color:var(--p)} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--p);color:#fff;border-color:var(--p)} button.primary:hover{background:var(--p-deep);color:#fff}
  a.btnlink{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;border:1px solid var(--p);color:var(--p);padding:6px 13px;text-decoration:none}
  a.btnlink:hover{background:var(--p-soft)}
  a.btnlink.primary{background:var(--p);color:#fff}
  select{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card .who{font-weight:600;font-size:15.5px}
  .card .body{margin-top:8px;font-size:14.5px;color:var(--soft);white-space:pre-wrap}
  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .center{text-align:center;padding:56px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px}
  .allclear{background:var(--good-soft);border:1px solid transparent;border-radius:14px;color:var(--good);text-align:center;padding:22px;margin:0 auto;max-width:420px}
  .allart{font-size:40px;line-height:1;margin-bottom:10px}

  /* support thread bubbles (a back-and-forth is genuinely a chat here) */
  .bub{max-width:82%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 13px;font-size:14px;margin:7px 0;white-space:pre-wrap}
  .bub.studio{margin-left:auto;background:var(--p-soft);border-color:transparent}
  .bub .bwhen{display:block;font-size:11px;color:var(--faint);margin-top:4px}

  /* ── the timeline — kept in sync with crm.html by hand (.tl-month/.ti blocks) ── */
  .tl-month{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:18px 0 4px;display:flex;align-items:center;gap:8px}
  .tl-month:after{content:"";flex:1;height:1px;background:var(--line)}
  .ti{position:relative;display:flex;gap:10px;padding:9px 0 9px 34px;align-items:flex-start}
  .ti:before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
  .ti:first-of-type:before{top:12px} .ti:last-of-type:before{bottom:auto;height:22px}
  .ti .ti-icon{position:absolute;left:1px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;box-shadow:0 0 0 3px var(--bg)}
  .ti.t-message:before{background:color-mix(in srgb,var(--act-message) 35%,transparent)} .ti.t-message .ti-icon{background:var(--act-message)}
  .ti.t-email:before{background:color-mix(in srgb,var(--act-email) 35%,transparent)} .ti.t-email .ti-icon{background:var(--act-email)}
  .ti.t-call:before{background:color-mix(in srgb,var(--act-call) 35%,transparent)} .ti.t-call .ti-icon{background:var(--act-call)}
  .ti.t-task:before{background:color-mix(in srgb,var(--act-task) 35%,transparent)} .ti.t-task .ti-icon{background:var(--act-task)}
  .ti.t-note:before{background:color-mix(in srgb,var(--act-note) 35%,transparent)} .ti.t-note .ti-icon{background:var(--act-note)}
  .ti.t-system:before{background:color-mix(in srgb,var(--act-system) 30%,transparent)} .ti.t-system .ti-icon{background:var(--act-system)}
  .ti-main{flex:1;min-width:0}
  .ti-head{display:flex;align-items:baseline;gap:7px;width:100%;border:none;background:none;font-family:inherit;font-size:13.5px;color:var(--ink);text-align:left;padding:0;min-width:0}
  button.ti-head{cursor:pointer;border-radius:0}
  .ti-title{font-weight:600;min-width:0}
  .ti-car{color:var(--faint);font-size:10px;flex:0 0 auto}
  .ti-meta{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 7px;background:var(--bg);border:1px solid var(--line);color:var(--faint);white-space:nowrap;flex:0 0 auto}
  .ti-body{font-size:13.5px;color:var(--soft);white-space:pre-wrap;margin-top:5px;border-left:2px solid var(--line);padding-left:10px}
  .ti-when{font-size:11.5px;color:var(--faint);white-space:nowrap;flex:0 0 auto;padding-top:2px}

  /* ── <760px: stacked — list first; picking a row pushes the pane in (D5) ── */
  @media (max-width:759px){
    .console{display:block;height:auto;min-height:calc(100vh - var(--dds-shell-h,54px));overflow:visible}
    .lpane{width:100%;max-width:none;border-right:none}
    #rows{overflow:visible}
    .edge{display:none}
    .rpane{display:none}
    .console.pane-open .lpane{display:none}
    .console.pane-open .rpane{display:flex;height:calc(100vh - var(--dds-shell-h,54px) - 72px)}
    .pback{display:inline-flex}
  }

  /* Support toolkit editor sheets (Saved replies, Customer FAQ) — unchanged */
  .sheet-back{position:fixed;inset:0;background:rgba(20,15,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:1000}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:560px;padding:22px;margin:auto}
  .sheet-head{display:flex;align-items:center;gap:10px}
  .sheet-head h3{font-family:var(--serif);font-weight:500;font-size:21px;margin:0}
  .sheet .x{margin-left:auto;background:none;border:none;font-size:24px;line-height:1;color:var(--soft);cursor:pointer;padding:2px 6px;border-radius:7px}
  .sheet .x:hover{color:var(--ink)}
  .sheet-intro{color:var(--soft);font-size:14px;margin:8px 0 16px}
  .sheet-list{display:flex;flex-direction:column;gap:14px}
  .erow{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
  .erow .mv{display:flex;flex-direction:column;gap:4px}
  .erow .mv button{width:30px;height:26px;border:1px solid var(--line);background:var(--card);border-radius:7px;cursor:pointer;color:var(--ink);font-size:13px;padding:0}
  .erow .mv button:disabled{opacity:.35;cursor:default}
  .erow .ef{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  .fl{display:flex;flex-direction:column;gap:4px}
  .fl>span{font-size:12px;font-weight:600;color:var(--faint)}
  .fl input,.fl textarea,#sheet-extra input{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;resize:vertical}
  .fl input:focus,.fl textarea:focus,#sheet-extra input:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  .erow .del{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:8px;color:var(--soft);font-size:12.5px;padding:6px 10px;cursor:pointer}
  .erow .del:hover{color:#a4342b;border-color:#a4342b}
  #sheet-extra:not(:empty){margin-bottom:14px}
  .addbtn{margin-top:14px;background:var(--p-soft);color:var(--p);border:1px dashed var(--p);border-radius:10px;padding:10px;width:100%;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
  .sheet-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .sheet-foot .ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
  .sheet-foot .save{background:var(--p);color:#fff;border:none;border-radius:9px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
  .sheet-foot .save:disabled{opacity:.6;cursor:default}
  .empty{padding:10px 2px}
</style>

<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
// ── The studio Inbox — a split-view console (Salesforce Split View anatomy,  ──
// dds skin; redesign slice 2). LEFT: one list pane of every conversation that
// concerns the studio — client messages (grouped one row per client), support
// threads, website enquiries, approvals — two-line rows with REAL per-thread
// unread dots (presence_thread_reads via /portal/feed; opening a row clears its
// dot with POST /threads/read). Fixed views (D3): Everything · Messages · Needs
// your OK · Enquiries · Support. RIGHT: the reading pane renders the selected
// conversation IN PLACE — the client's activity timeline + a Message composer
// (same anatomy as the record page), the approval card with inline Approve/Not
// yet, the enquiry card with Reply/→Deal/Mark read/Archive, or the support
// thread with a status control + reply. <760px the panes stack (D5): list
// first, picking a row pushes the pane in with a back button.
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="";
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;}); // keep token fresh (auto-refresh)
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':(new URLSearchParams(location.search).get('client')||'')},body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
function when(iso){if(!iso)return'';const d=Math.floor((Date.now()-Date.parse(iso))/86400000);if(d<=0)return'today';if(d===1)return'yesterday';if(d<7)return d+' days ago';if(d<60){const w=Math.floor(d/7);return w+(w===1?' week':' weeks')+' ago';}const mo=Math.floor(d/30);return mo+(mo===1?' month':' months')+' ago';}
const KIND={quote:'Quote request',booking:'Booking request',contact:'Message'};
const toast=(m,k)=>{if(window.ddsToast)window.ddsToast(m,k);};
const initialsOf=(name)=>esc((name||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase()||'?');
// SC-1: keep the agency drill-in scope on every internal link so a scoped operator
// stays inside the client they opened.
function scoped(href){const c=new URLSearchParams(location.search).get('client');if(!c||!href||href.charAt(0)!=='/')return href;const h=href.split('#');return h[0]+(h[0].indexOf('?')>=0?'&':'?')+'client='+encodeURIComponent(c)+(h[1]?'#'+h[1]:'');}
// map a derived notification's source to a real Studio page (deep link resolves)
function notifLink(n){const h=String(n.href||'');const m=h.match(/^\/projects\/([0-9a-f-]{36})/);if(m){const anc=h.split('#')[1];return '/projects.html?project='+m[1]+(anc?'#'+anc:'');}if(h&&h.charAt(0)==='/')return h;return '/today.html';}

// ── state ─────────────────────────────────────────────────────────────────────
let FEED={},LEADS=[],NOTIFS=[],ITEMS=[],SYSROWS=[],TOTAL=0;
let FEED_FAILED=false,LEADS_FAILED=false;   // exactly-one-failed → the honest partial notice (both → the boot error)
let VIEW='everything',SEL='',ACTIVE=-1,COLLAPSED=false,Q='';
// SS6 shared ~150ms debounce — kept in sync by hand with leads.html/contacts.html/customers.html
const debounce=(fn,ms)=>{let t;return function(){clearTimeout(t);t=setTimeout(fn,ms||150);};};
// one delegated closer for both header menus (attached ONCE — renderConsole may
// rebuild the header many times; per-render document listeners would pile up)
document.addEventListener('click',(e)=>{

  if(vm&&vb&&!vm.hidden&&!e.target.closest('.viewdd')){vm.hidden=true;vb.setAttribute('aria-expanded','false');}

});
const VIEWS=[['everything','Everything'],['messages','Messages'],['ok','Needs your OK'],['enquiries','Enquiries'],['support','Support & requests']];
const VIEW_LABEL=Object.fromEntries(VIEWS);
const viewMatch=(it)=>VIEW==='everything'||(VIEW==='messages'&&it.kind==='message')||(VIEW==='ok'&&it.kind==='approval')||(VIEW==='enquiries'&&it.kind==='lead')||(VIEW==='support'&&it.kind==='support');

// ── build the conversation items from the ONE feed (+ enquiry fallback) ──────
// Messages from your clients — feed.client_messages, grouped ONE row per client
// (#181 heritage): the row's thread_key carries the per-thread unread state.
function buildItems(feed,leads,notifs){
  const items=[];
  const clientMsgs=(feed.client_messages||[]);
  const groups=new Map();   // thread key → {name, rows}
  for(const c of clientMsgs.filter(x=>x.type==='message')){
    // NEVER drop a row: a pre-slice-2 function emits unbridged rows with neither
    // client_id nor thread_key (the old page grouped them as "Other clients").
    // Fallback chain client_id → thread_key → project_id → one misc bucket; every
    // key stays inside the /threads/read allowlist charset. Misc rows keep the
    // heuristic unread + their old href fallback (paneMessage → g.href/projects).
    const key=c.client_id?('client:'+c.client_id):(c.thread_key||('client:'+(c.project_id||'misc')));
    if(!groups.has(key))groups.set(key,{name:c.client||'Other clients',rows:[]});
    groups.get(key).rows.push(c);
  }
  for(const [key,g] of groups){
    const latest=g.rows.slice().sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))[0]||{};
    const needs=g.rows.some(r=>r.needs_reply);
    // real per-thread unread when the feed carries it (slice 2); older function
    // builds degrade to the needs-reply heuristic (deploy-order tolerance)
    const unread=g.rows.some(r=>r.unread!=null?!!r.unread:!!r.needs_reply);
    items.push({kind:'message',id:'msg:'+key,thread_key:key,name:g.name,when:String(latest.created_at||''),
      preview:needs?'Sent you a message':'You replied — waiting on them',chip:'Message',chipCls:'',
      unread,needs,count:g.rows.reduce((n,r)=>n+(Number(r.count)||1),0),
      client_id:String(latest.client_id||''),project_id:String(latest.project_id||''),href:String(latest.href||'')});
  }
  for(const c of clientMsgs.filter(x=>x.type==='support')){
    items.push({kind:'support',id:'sup:'+c.id,support_id:String(c.id||''),thread_key:c.thread_key||('support:'+c.id),
      name:c.client||'Support request',when:String(c.created_at||''),preview:c.subject||'A support request',
      chip:'Support'+(c.status?' · '+String(c.status).replace(/_/g,' '):''),chipCls:'support',status:String(c.status||'open'),
      unread:c.unread!=null?!!c.unread:true,needs:true,client_id:String(c.client_id||''),href:String(c.href||'')});
  }
  for(const p of (feed.pending_approvals||[])){
    items.push({kind:'approval',id:'ok:'+p.id,name:p.title||'A change is ready',when:'',
      preview:p.summary||'Waiting for your OK',chip:'Needs your OK',chipCls:'',unread:true,needs:true,approval:p});
  }
  // enquiries: the feed's per-lead rows (slice 2 — the server serves status=new
  // only). An older function build without feed.enquiries degrades to the page's
  // own /forms/inbox read, counting NON-ARCHIVED (C7: the same arithmetic as
  // leads.html's Open — one queue, one count; heuristic dots for 'new' only).
  const enq=Array.isArray(feed.enquiries)?feed.enquiries:(leads||[]).filter(l=>l.status!=='archived');
  for(const l of enq){
    items.push({kind:'lead',id:'lead:'+l.id,lead_id:String(l.id||''),thread_key:l.thread_key||('lead:'+l.id),
      name:l.name||l.email||'Someone',when:String(l.created_at||''),preview:l.message||'A new enquiry from your website',
      chip:KIND[l.form_kind]||'Message',chipCls:'lead',unread:l.unread!=null?!!l.unread:String(l.status||'new')==='new',needs:true,lead:l});
  }
  // sorted by newest first; undated items (approvals) stay on top — they're waiting
  items.sort((a,b)=>{if(!a.when&&!b.when)return 0;if(!a.when)return -1;if(!b.when)return 1;return b.when.localeCompare(a.when);});
  return items;
}
// The old sections 5–6 (Project activity + Worth a look) fold into `Everything`
// as dimmed, read-only system rows — clicking deep-links exactly as before.
function buildSystem(feed,notifs){
  const rows=[];
  // The feed carries a synthetic 'website_enquiry' aggregate row for the BELL;
  // the Inbox lists each lead as its own row, so drop the aggregate here to
  // avoid a double listing.
  const notices=(feed.notices||[]).filter(n=>n.kind!=='website_enquiry');
  const moments=(feed.moments||[]);
  // Project activity = the studio's OWN worklog; support/client messages already
  // have first-class rows above, so they're filtered out here (as before).
  const activity=(Array.isArray(notifs)?notifs:[]).filter(n=>n.kind!=='support_message'&&n.kind!=='message').slice(0,12);
  activity.forEach((n,i)=>rows.push({sys:true,id:'sys:act:'+i,icon:'⚙',label:n.label||'Activity',tag:'Project activity',when:String(n.created_at||''),read:!!n.read,href:scoped(notifLink(n))}));
  for(const n of notices)rows.push({sys:true,id:'sys:not:'+n.id,icon:'👀',label:n.headline||'Something needs a look',tag:'Worth a look',when:'',read:false,href:scoped(n.href||'/today.html')});
  // moments render ACTIVE (undimmed, no ✓) — the feed only carries the still-open
  // ones, and the old page listed them as live items; they stay counted in TOTAL.
  for(const m of moments)rows.push({sys:true,id:'sys:mom:'+m.id,icon:'✨',label:m.headline||'A moment',tag:'Worth a look',when:String(m.created_at||''),read:false,href:scoped('/today.html')});
  return rows;
}

// ── the console shell ─────────────────────────────────────────────────────────
function renderConsole(){
  $('main').innerHTML=`
  <h1 class="sr-only">Inbox</h1>
  <div class="console${COLLAPSED?' collapsed':''}" id="console">
    <aside class="lpane" aria-label="Conversation list">
      <div class="lhead">

            <button id="viewBtn" aria-haspopup="listbox" aria-expanded="false">${esc(VIEW_LABEL[VIEW])} <span class="car" aria-hidden="true">▾</span></button>
            <div id="viewMenu" role="listbox" aria-label="Inbox views" hidden></div>
          </div>
          <button class="lbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">↻</button>
          <div class="ovf">

    <section class="rpane" id="rpane" aria-label="Conversation"></section>
  </div>`;
  // view dropdown
  const vb=$('viewBtn'),vm=$('viewMenu');
  vm.innerHTML=VIEWS.map(v=>`<button type="button" role="option" data-view="${v[0]}" aria-selected="${VIEW===v[0]?'true':'false'}">${v[1]}${VIEW===v[0]?' <span aria-hidden="true">✓</span>':''}</button>`).join('');
  const closeMenu=(m,b)=>{m.hidden=true;b.setAttribute('aria-expanded','false');};
  // the minimal popup keyboard contract both header menus owe their aria-haspopup:
  // opening moves focus to the first option; ArrowUp/Down move within; Escape
  // closes + returns focus to the trigger; Enter activates natively (<button>s).
  const wireMenuKeys=(m,b)=>m.addEventListener('keydown',(e)=>{
    const opts=[...m.querySelectorAll('button')];if(!opts.length)return;
    const i=opts.indexOf(document.activeElement);
    if(e.key==='Escape'){e.preventDefault();closeMenu(m,b);b.focus();}
    else if(e.key==='ArrowDown'){e.preventDefault();opts[Math.min(i+1,opts.length-1)].focus();}
    else if(e.key==='ArrowUp'){e.preventDefault();opts[Math.max(i-1,0)].focus();}
  });
  const toggleMenu=(m,b)=>{const open=m.hidden;m.hidden=!open;b.setAttribute('aria-expanded',open?'true':'false');if(open){const f=m.querySelector('button');if(f)f.focus();}};
  vb.addEventListener('click',()=>toggleMenu(vm,vb));
  wireMenuKeys(vm,vb);
  vm.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{VIEW=b.getAttribute('data-view');closeMenu(vm,vb);renderConsole();renderList();renderPane();const nb=$('viewBtn');if(nb)nb.focus();}));
  // overflow (Saved replies · Customer FAQ — the old toolkit, now one menu)
  const ob=$('ovfBtn'),om=$('ovfMenu');
  ob.addEventListener('click',()=>toggleMenu(om,ob));
  wireMenuKeys(om,ob);
  $('ovfSaved').addEventListener('click',()=>{closeMenu(om,ob);openSaved();});
  $('ovfFaq').addEventListener('click',()=>{closeMenu(om,ob);openFaq();});
  $('refreshBtn').addEventListener('click',()=>refresh());
  // C2 search — debounced, list-only re-render: the input node is never rebuilt
  // while typing (renderConsole only re-runs on a view change), so caret + focus
  // survive; the roving keyboard index resets so it can't point past the filter.
  const q=$('q');if(q)q.addEventListener('input',debounce(()=>{Q=q.value;ACTIVE=-1;renderList();}));
  // the collapse toggle (SLDS: "Open Split View" / "Close Split View")
  $('edgeBtn').addEventListener('click',()=>{COLLAPSED=!COLLAPSED;const c=$('console');c.classList.toggle('collapsed',COLLAPSED);const b=$('edgeBtn');b.setAttribute('aria-expanded',COLLAPSED?'false':'true');b.setAttribute('aria-label',COLLAPSED?'Open Split View':'Close Split View');b.querySelector('span').textContent=COLLAPSED?'▶':'◀';});
  // keyboard: arrows move the focused row, Enter opens it
  const rows=$('rows');
  rows.addEventListener('keydown',(e)=>{
    const vis=visibleRows();if(!vis.length)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();rows.classList.add('kbd');ACTIVE=e.key==='ArrowDown'?Math.min(ACTIVE+1,vis.length-1):Math.max(ACTIVE-1,0);paintActive();}
    else if(e.key==='Enter'&&ACTIVE>=0&&vis[ACTIVE]){e.preventDefault();activateRow(vis[ACTIVE]);}
  });
}
// C2: the search filters EVERYTHING the list shows — conversations (name ·
// preview · chip) and system rows (label · tag) alike.
function rowMatch(r){
  const q=Q.trim().toLowerCase();if(!q)return true;
  const hay=r.sys?((r.label||'')+' '+(r.tag||'')):((r.name||'')+' '+(r.preview||'')+' '+(r.chip||''));
  return hay.toLowerCase().includes(q);
}
function visibleRows(){return [...ITEMS.filter(viewMatch),...(VIEW==='everything'?SYSROWS:[])].filter(rowMatch);}
function paintActive(){
  const rows=$('rows');const vis=visibleRows();
  rows.querySelectorAll('.row').forEach((el,i)=>el.classList.toggle('kfocus',i===ACTIVE));
  if(ACTIVE>=0&&vis[ACTIVE]){rows.setAttribute('aria-activedescendant','row-'+cssId(vis[ACTIVE].id));const el=rows.querySelector('.row.kfocus');if(el)el.scrollIntoView({block:'nearest'});}
}
const cssId=(s)=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_');
function activateRow(it){if(it.sys){location.href=it.href||'/today.html';return;}openItem(it.id);}

// ── the list pane rows (two-line, unread dot, channel chip) ──────────────────
function renderList(){
  const rows=$('rows');if(!rows)return;
  const vis=visibleRows();
  const convs=vis.filter(r=>!r.sys);   // the meta counts what the list SHOWS (search included)
  const need=convs.filter(i=>i.unread||i.needs).length;
  if(VIEW==='enquiries'){
    // C7: the Enquiries count speaks leads.html's vocabulary — non-archived
    // total with the "M new" qualifier (one queue, one arithmetic).
    const newN=convs.filter(i=>i.lead&&String(i.lead.status||'new')==='new').length;
    $('lmeta').textContent=`${convs.length} enquir${convs.length===1?'y':'ies'} · ${newN} new · Sorted by newest`;
  }else{
    $('lmeta').textContent=`${convs.length} conversation${convs.length===1?'':'s'} · ${need} need${need===1?'s':''} you · Sorted by newest`;
  }
  // partial-failure honesty: one of the two reads failed (loadData renders the
  // surviving half) — say so instead of presenting a quietly complete inbox
  const ln=$('lnotice');
  if(ln){
    const miss=FEED_FAILED?'messages and approvals':LEADS_FAILED?'website enquiries':'';
    if(miss){ln.textContent=`Part of your inbox couldn’t load just now — ${miss} may be missing. Refresh to try again.`;ln.hidden=false;}
    else ln.hidden=true;
  }
  if(!vis.length){rows.innerHTML=`<li class="lempty" role="presentation">${Q.trim()?`Nothing here matches “${esc(Q)}”.`:VIEW==='everything'&&!TOTAL?((FEED_FAILED||LEADS_FAILED)?'Nothing we could load just now.':'✓ You’re all caught up.'):'Nothing here — this view is all clear.'}</li>`;renderPane();return;}
  let h='';
  for(const it of vis){
    if(it.sys){
      h+=`<li class="row sysrow${it.read?' isread':''}" role="option" id="row-${cssId(it.id)}" data-id="${esc(it.id)}" aria-selected="false">
        <span class="avatar" aria-hidden="true">${it.icon}</span>
        <span class="rmain"><span class="rtop"><span class="rname">${it.read?'✓ ':''}${esc(it.label)}</span>${it.when?`<span class="rwhen">${esc(when(it.when))}</span>`:''}</span>
        <span class="rprev"><span class="rchip">${esc(it.tag)}</span><span class="txt">Opens in its own page →</span></span></span></li>`;
      continue;
    }
    h+=`<li class="row${it.unread?' unread':''}" role="option" id="row-${cssId(it.id)}" data-id="${esc(it.id)}" aria-selected="${SEL===it.id?'true':'false'}">
      ${it.unread?'<span class="unread-dot" role="img" aria-label="Unread"></span>':''}
      <span class="avatar" aria-hidden="true">${it.kind==='approval'?'✓':initialsOf(it.name)}</span>
      <span class="rmain">
        <span class="rtop"><span class="rname">${esc(it.name)}</span>${it.when?`<span class="rwhen">${esc(when(it.when))}</span>`:''}</span>
        <span class="rprev"><span class="rchip ${it.chipCls}">${esc(it.chip)}</span><span class="txt">${esc(it.preview)}</span>${it.count>1?`<span class="cmbadge">${it.count}</span>`:''}</span>
      </span></li>`;
  }
  rows.innerHTML=h;
  rows.querySelectorAll('.row').forEach((el,i)=>el.addEventListener('click',()=>{ACTIVE=i;rows.classList.remove('kbd');const it=vis[i];activateRow(it);}));
}

// ── opening a row: select it, clear ITS dot (optimistic + POST /threads/read) ─
function openItem(id){
  const it=ITEMS.find(x=>x.id===id);if(!it)return;
  SEL=id;
  it.unread=false;   // the dot clears the moment the conversation opens (optimistic)
  if(it.thread_key)api('/threads/read','POST',{thread_key:it.thread_key}).catch(()=>{});
  renderList();
  renderPane();
  const c=$('console');if(c)c.classList.add('pane-open');   // <760px: push the pane in
  focusPane();
}
// a11y: opening a conversation must MOVE focus — on mobile the list is hidden and
// focus would drop to <body> with nothing announced. Mobile (<760px) → the back
// button; desktop → the pane heading (tabindex=-1: focusable, not in tab order).
// The pane head renders synchronously, so this runs before the body loads.
function focusPane(){
  const back=$('paneBack');
  if(window.matchMedia('(max-width:759px)').matches&&back){back.focus();return;}
  const h=document.querySelector('#rpane .pname');
  if(h){h.setAttribute('tabindex','-1');h.focus();}
}
// closing back returns focus to the listbox — the roving ACTIVE row stays intact
function closePane(){SEL='';const c=$('console');if(c)c.classList.remove('pane-open');renderList();renderPane();const r=$('rows');if(r)r.focus();}

// ── the reading pane ──────────────────────────────────────────────────────────
function renderPane(){
  const host=$('rpane');if(!host)return;
  const it=ITEMS.find(x=>x.id===SEL);
  if(!it){
    // ONE chokepoint: no selection → never strand `pane-open` (on mobile the list
    // is display:none and there's no back button). Covers every SEL-clearing flow
    // — support resolve/close, lead archive, refresh() pruning a vanished SEL.
    const c=$('console');if(c)c.classList.remove('pane-open');
    const anyInView=visibleRows().some(r=>!r.sys);
    // the GLOBAL all-clear only when the inbox is empty overall; an empty
    // filtered view gets its own copy (there may be work in other views).
    host.innerHTML=anyInView
      ?`<div class="center" style="margin:auto"><div class="allart" aria-hidden="true">🗂</div><h2>Pick a conversation</h2><p class="muted">Choose a row on the left — it opens right here.</p></div>`
      :ITEMS.length
        ?`<div class="center" style="margin:auto"><div class="allart" aria-hidden="true">🗂</div><h2>Nothing in this view</h2><p class="muted">Nothing in this view — check Everything.</p></div>`
        :`<div class="center" style="margin:auto"><div class="allclear"><div class="allart" aria-hidden="true">🌤</div>✓ Nothing needs you right now — the platform is watching the rest.<p style="margin-top:12px"><a class="link" href="${esc(scoped('/today.html'))}">See how the business is doing →</a></p></div></div>`;
    return;
  }
  if(it.kind==='message')return void paneMessage(host,it);
  if(it.kind==='support')return void paneSupport(host,it);
  if(it.kind==='approval')return void paneApproval(host,it);
  if(it.kind==='lead')return void paneLead(host,it);
}
const paneHead=(it,subHtml)=>`<div class="phead">

</div>`;

// ── A client-message row → compact record header + the client's activity
//    timeline + a Message-only composer (log/task/note stay on the record page).
//    Data: GET /crm/activity — with slice 1's deploy-order fallback idiom
//    (route not there yet → compose the same shape from /crm/messages). ──
let PANE_SEQ=0;   // a stale async pane render must never paint over a newer one
// refresh() rebuilds the pane and would destroy an in-progress reply — snapshot
// the composer drafts + focus before the rebuild and restore after the async
// pane render lands (slice-1's snapComposer pattern, crm.html). The draft is
// keyed to the SELECTED item so it can never leak into another conversation;
// successful sends clear their field BEFORE re-rendering, so nothing resurrects.
const COMPOSER_FIELDS=['msgBody','supBody'];
let DRAFT=null;   // {sel, vals, focus} — set by refresh(), consumed once by the pane loaders
// ── C3 (SS6): insertSavedReplies(textareaId) — the shared saved-reply insert.
// ONE lazy cached fetch of /service/saved-replies per page-load; a picker only
// renders when replies exist (no dead chrome for studios without any). Bodies
// live in a JS map keyed by id (projects.html's picker idiom — nothing goes
// into an attribute); insert APPENDS after what's typed and refocuses the
// textarea. Kept in sync by hand with crm.html's copy. ──
// SCOPE DOCTRINE (SS6, flagged decision): this page's api() carries the
// drill-in ?client= scope, so a drilled-in operator's picker AND the ⋯
// Saved-replies manager both resolve to the CUSTOMER site's reply set —
// "replies live where the conversation lives". crm.html's picker holds the
// opposite doctrine (apiAg: always the OPERATOR's own replies, even on a
// customer-scoped record). Both are defensible; which one wins is Eric's
// call (punchlist). Do not "align" either side without that decision. ──
let SR_FETCH=null;
function insertSavedReplies(taId){
  const ta=$(taId);if(!ta)return;
  if(!SR_FETCH)SR_FETCH=api('/service/saved-replies').then(r=>(r.ok&&r.body.data&&r.body.data.replies)||[]).catch(()=>[]);
  SR_FETCH.then((replies)=>{
    const cur=$(taId);
    if(!replies.length||cur!==ta)return;   // nothing saved / the pane re-rendered under us
    if(ta.previousElementSibling&&ta.previousElementSibling.classList.contains('sr-pick'))return;
    const map={};replies.forEach(x=>{map[x.id]=x.body;});
    const sel=document.createElement('select');
    sel.className='sr-pick';sel.setAttribute('aria-label','Insert a saved reply');
    sel.style.cssText='display:block;margin-bottom:6px;max-width:100%';
    sel.innerHTML='<option value="">Insert a saved reply…</option>'+replies.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');
    sel.onchange=()=>{const b=map[sel.value];if(b){const v=ta.value;ta.value=v?(v.replace(/\s*$/,'')+'\n\n'+b):b;ta.focus();}sel.value='';};
    ta.parentNode.insertBefore(sel,ta);
  });
}
function snapComposer(){const s={sel:SEL,vals:{},focus:''};for(const id of COMPOSER_FIELDS){const el=$(id);if(el&&el.value)s.vals[id]=el.value;}const ae=document.activeElement;if(ae&&COMPOSER_FIELDS.includes(ae.id))s.focus=ae.id;return s;}
function restoreComposer(it){const s=DRAFT;if(!s||s.sel!==it.id)return;DRAFT=null;for(const id in s.vals){const el=$(id);if(el)el.value=s.vals[id];}if(s.focus){const el=$(s.focus);if(el)el.focus();}}
async function paneMessage(host,it){
  const seq=++PANE_SEQ;

    `<div class="pbody" id="pbody" aria-live="polite"><div class="spin" role="status" aria-label="Loading conversation"></div></div><div class="pcomposer" id="pcomposer"></div>`;
  wireBack();
  // send BOTH keys when we have them: the server derives reply_to from the
  // project (adopting a bridged one on client_id-only calls), so the composer
  // opens either way — but the row's own project is the most direct signal.
  const qs=[];

    else{ // deploy-order fallback: the function may not carry /crm/activity yet
      const mr=await api('/crm/messages?'+q);
      if(seq!==PANE_SEQ)return;
      if(mr.ok){const md=mr.body.data||{};items=(md.items||[]).map(convItem).filter(Boolean).sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:0);reply=md.reply_to||md.reply_support_to||null;}

// thin adapter mirroring the server's crm/activity.ts mappers — kept in sync
// with crm.html by hand (its convItem; only the channels this pane renders)
function convItem(m){
  if(!m||!m.created_at)return null;
  const at=m.created_at,id='conv:'+m.kind+':'+(m.id||''),mine=m.from==='studio',body=m.body||null;
  if(m.kind==='message')return{id,kind:'message',type:'message',title:mine?'You sent a message':'The client sent a message',body,at,meta:null};
  if(m.kind==='support')return{id,kind:'support',type:'message',title:(mine?'You':'The client')+' opened a support request'+(m.subject?' — '+m.subject:''),body,at,meta:'Support'+(m.status?' · '+String(m.status).replace(/_/g,' '):'')};
  if(m.kind==='support_reply')return{id,kind:'support_reply',type:'message',title:mine?'You replied':'The client replied',body,at,meta:'Support'};
  if(m.kind==='enquiry')return{id,kind:'enquiry',type:'message',title:'The client reached out from your website',body,at,meta:'Website enquiry'};
  if(m.kind==='booking')return{id,kind:'booking',type:'call',title:m.subject||'The client booked a call',body,at,meta:'Booking'};
  if(m.kind==='broadcast')return{id,kind:'broadcast',type:'email',title:'You sent a broadcast'+(m.subject?' — '+m.subject:''),body,at,meta:'Broadcast'};
  if(m.kind==='activity'){
    const map={call:['call','You logged a call','Logged call'],email:['email','You logged an email','Logged email'],meeting:['call','You logged a meeting','Meeting'],note:['note','You added a note','Note'],proposal_sent:['system','Proposal sent','Deal'],contract_sent:['system','Agreement sent','Deal'],invoice_sent:['system','Invoice sent','Deal']};
    const t=map[m.activity_kind]||['note','You logged an activity','Activity'];
    return{id,kind:'activity',type:t[0],title:t[1],body,at,meta:t[2]};
  }
  return null;
}
// the timeline renderer — kept in sync with crm.html by hand (its
// renderMergedTimeline: month groups + typed icons on a connector line +
// expandable rows; no filter chips / notes actions here — record-page only)
const TYPE_ICON={message:'💬',email:'✉',call:'📞',task:'✓',note:'✐',system:'⚙'};
const EXPANDED=new Set();
function renderTL(host,items){
  if(!items.length){host.innerHTML='<p class="muted" style="font-size:13.5px">Nothing here yet — messages and activity will appear as they happen.</p>';return;}
  let html='';let curMonth='';
  for(const it of items){
    const mk=String(it.at).slice(0,7);
    if(mk!==curMonth){curMonth=mk;const dt=new Date(mk+'-15T12:00:00Z');html+=`<div class="tl-month">${isNaN(dt)?esc(mk):dt.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>`;}
    const type=TYPE_ICON[it.type]?it.type:'system';
    const open=EXPANDED.has(it.id);
    const meta=it.meta?`<span class="ti-meta">${esc(it.meta)}</span>`:'';
    const head=it.body
      ?`<button class="ti-head" data-x="${esc(it.id)}" aria-expanded="${open?'true':'false'}"><span class="ti-car" aria-hidden="true">${open?'▾':'▸'}</span><span class="ti-title">${esc(it.title)}</span>${meta}</button>`
      :`<div class="ti-head"><span class="ti-title">${esc(it.title)}</span>${meta}</div>`;
    const bodyHtml=(it.body&&open)?`<div class="ti-body">${esc(it.body)}</div>`:'';
    html+=`<div class="ti t-${type}"><span class="ti-icon" aria-hidden="true">${TYPE_ICON[type]}</span><div class="ti-main">${head}${bodyHtml}</div><span class="ti-when">${esc(when(it.at))}</span></div>`;
  }
  host.innerHTML=html;
  host.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.getAttribute('data-x');
    if(EXPANDED.has(id))EXPANDED.delete(id);else EXPANDED.add(id);
    renderTL(host,items);
  }));
}

  const decideInbox=async(path,decision,btn)=>{btn.disabled=true;try{const r=await api(path,'POST',{decision});if(r.ok){toast(decision==='approve'?'Approved.':'Set aside — nothing changed.');ITEMS=ITEMS.filter(x=>x.id!==it.id);TOTAL=ITEMS.length+SYSROWS.length;SEL='';renderList();renderPane();refresh();return;}}catch(_){ }toast('That didn’t go through — try again.');btn.disabled=false;};

// Prefill the reply so responding is one tap — kept in sync with leads.html by hand
function leadReplyHref(l){
  const kind=l.form_kind==='quote'?'quote request':l.form_kind==='booking'?'booking request':'message';

// P2-C (Seam 3): promote a captured enquiry into a pipeline deal — no re-typing.
// Kept in sync with leads.html createDeal by hand; navigates to the new Record.
async function createDeal(it,btn){
  const l=it.lead||{};btn.disabled=true;
  const title=(l.name||l.email||'New enquiry')+((l.form_kind&&l.form_kind!=='contact')?(' — '+l.form_kind):'');
  try{
    let contactId=null;
    if(l.email){const c=await api('/sales/contacts','POST',{name:l.name||'',email:l.email,phone:l.phone||''});if(c.ok)contactId=c.body&&c.body.data&&c.body.data.id;}
    const d=await api('/sales/deals','POST',{title,contact_id:contactId,source:'website_form',source_submission_id:it.lead_id});

    const dealId=d.body&&d.body.data&&d.body.data.id;
    // reflect converted state locally + suppress navigation on already_converted
    // (idempotent: the server returns the existing deal on a repeat) — mirrors
    // leads.html createDeal, this function's declared sync source.

    if(dealId&&!(d.body&&d.body.already_converted))setTimeout(()=>{location.href=scoped('/crm.html?deal='+dealId+'&tab=deal');},800);

// ── data load / refresh ───────────────────────────────────────────────────────
async function loadData(){
  const [feed,leads,notifs]=await Promise.all([api('/portal/feed'),api('/forms/inbox'),api('/notifications?limit=25').catch(()=>({ok:false,body:{}}))]);
  if(!feed.ok&&!leads.ok)return false;
  // exactly one of feed/leads failing still renders the surviving half — but
  // WITH a notice (renderList), never as a quietly complete inbox
  FEED_FAILED=!feed.ok;LEADS_FAILED=!leads.ok;
  FEED=(feed.ok&&feed.body.data)||{};
  LEADS=(leads.ok&&leads.body.data&&leads.body.data.submissions)||[];
  NOTIFS=(notifs.ok&&Array.isArray(notifs.body.data))?notifs.body.data:[];
  ITEMS=buildItems(FEED,LEADS,NOTIFS);
  SYSROWS=buildSystem(FEED,NOTIFS);
  // the meta line's honesty: TOTAL counts what the Everything view actually
  // RENDERS (conversation items + system rows) — never raw feed rows, which
  // group and fold differently (one row per client; moments stay counted).
  TOTAL=ITEMS.length+SYSROWS.length;
  return true;
}
async function refresh(){
  let ok=false;
  try{ok=await loadData();}catch(_){ok=false;}   // a network-level reject must still fire the toast
  if(!ok){toast('Couldn’t refresh just now.');return;}
  DRAFT=snapComposer();   // an in-progress reply survives the pane rebuild (restored by the pane loaders)
  if(SEL&&!ITEMS.some(x=>x.id===SEL))SEL='';
  renderList();renderPane();
}

// Shared up/down/remove handling. readFn snapshots the typed values into state
// BEFORE any structural change, so nothing you've typed is lost on reorder.
function listClick(e,readFn,arrGet,drawFn){
  const row=e.target.closest('[data-row]');if(!row)return;
  const rows=[...$('sheet-list').querySelectorAll('[data-row]')];const i=rows.indexOf(row);
  if(e.target.closest('[data-del]')){readFn();const a=arrGet();a.splice(i,1);drawFn();}

  else if(e.target.closest('[data-mv=down]')){readFn();const a=arrGet();if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];drawFn();}}

  SR=(r.ok&&r.body.data&&r.body.data.replies)||[];
  drawSaved();
  $('sheet-list').onclick=(e)=>listClick(e,readSaved,()=>SR,drawSaved);
  $('sheet-add').onclick=()=>{readSaved();SR.push({id:'',title:'',body:''});drawSaved();focusNewRow();};
  $('sheet-save').onclick=saveSaved;
}
function srRow(r,i){return `<div class="erow" data-row data-id="${esc(r.id||'')}">${mvCells(i,SR.length)}`+
  `<div class="ef"><label class="fl"><span>Title</span><input type="text" data-f="title" maxlength="80" value="${esc(r.title)}" placeholder="e.g. Our opening hours"></label>`+
  `<label class="fl"><span>Message</span><textarea data-f="body" maxlength="4000" rows="3" placeholder="Write the reply you send most often…">${esc(r.body)}</textarea></label></div>`+
  `<button type="button" class="del" data-del aria-label="Remove this reply">Remove</button></div>`;}
function drawSaved(){const b=$('sheet-list');b.innerHTML=SR.length?SR.map((r,i)=>srRow(r,i)).join(''):'<p class="muted empty">No saved replies yet. Add your first one below.</p>';}
function readSaved(){SR=[...$('sheet-list').querySelectorAll('[data-row]')].map(row=>({id:row.getAttribute('data-id')||'',title:row.querySelector('[data-f=title]').value,body:row.querySelector('[data-f=body]').value}));}
async function saveSaved(){
  readSaved();
  const cleaned=SR.filter(r=>r.title.trim()||r.body.trim());
  for(const r of cleaned){if(!r.title.trim()){toast('Each saved reply needs a short title.','err');return;}if(!r.body.trim()){toast('“'+(r.title.trim()||'A reply')+'” needs some text.','err');return;}}
  const btn=$('sheet-save');btn.disabled=true;btn.textContent='Saving…';
  const r=await api('/service/saved-replies','PUT',{replies:cleaned});
  btn.disabled=false;btn.textContent='Save changes';
  if(r.ok){SR_FETCH=null;toast('Saved replies updated.');closeSheet();}   // drop the picker cache — the next insert refetches the edited list
  else if(r.status===422)toast('Please check your replies and try again.','err');
  else if(r.status===503)toast('Saved replies aren’t switched on for this site yet.','err');
  else toast('Couldn’t save just now — try again in a moment.','err');
}

// ── Customer FAQ ────────────────────────────────────────────────────────────
let FQ={intro:'',items:[]};
async function openFaq(){
  mountSheet(sheetShell('Customer FAQ','Answer the questions your clients ask most. They’ll see these in their portal — you decide what goes here. Nothing publishes until you press Save.','Add a question'));
  $('sheet-extra').innerHTML='<label class="fl"><span>Intro (optional)</span><input type="text" id="faq-intro" maxlength="500" placeholder="A friendly line above your questions…"></label>';
  $('sheet-list').innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';
  const r=await api('/service/faq');
  const d=(r.ok&&r.body.data)||{items:[]};
  FQ={intro:d.intro||'',items:(d.items||[]).map(x=>({q:x.q||'',a:x.a||''}))};
  $('faq-intro').value=FQ.intro;
  drawFaq();
  $('sheet-list').onclick=(e)=>listClick(e,readFaq,()=>FQ.items,drawFaq);
  $('sheet-add').onclick=()=>{readFaq();FQ.items.push({q:'',a:''});drawFaq();focusNewRow();};
  $('sheet-save').onclick=saveFaq;
}
function faqRow(it,i){return `<div class="erow" data-row>${mvCells(i,FQ.items.length)}`+
  `<div class="ef"><label class="fl"><span>Question</span><input type="text" data-f="q" maxlength="200" value="${esc(it.q)}" placeholder="e.g. How do I request a change?"></label>`+
  `<label class="fl"><span>Answer</span><textarea data-f="a" maxlength="4000" rows="3" placeholder="Write a clear, friendly answer…">${esc(it.a)}</textarea></label></div>`+
  `<button type="button" class="del" data-del aria-label="Remove this question">Remove</button></div>`;}
function drawFaq(){const b=$('sheet-list');b.innerHTML=FQ.items.length?FQ.items.map((it,i)=>faqRow(it,i)).join(''):'<p class="muted empty">No questions yet. Add your first one below.</p>';}
function readFaq(){const intro=$('faq-intro');FQ.intro=intro?intro.value:FQ.intro;FQ.items=[...$('sheet-list').querySelectorAll('[data-row]')].map(row=>({q:row.querySelector('[data-f=q]').value,a:row.querySelector('[data-f=a]').value}));}
async function saveFaq(){
  readFaq();
  const partial=FQ.items.some(x=>(x.q.trim()&&!x.a.trim())||(!x.q.trim()&&x.a.trim()));
  if(partial){toast('Each question needs both a question and an answer.','err');return;}
  const items=FQ.items.filter(x=>x.q.trim()&&x.a.trim());
  const btn=$('sheet-save');btn.disabled=true;btn.textContent='Saving…';
  const r=await api('/service/faq','PUT',{intro:FQ.intro.trim(),items});
  btn.disabled=false;btn.textContent='Save changes';
  if(r.ok){toast('Your FAQ is saved.');closeSheet();}
  else if(r.status===422)toast('Please check your questions and try again.','err');
  else if(r.status===503)toast('The FAQ isn’t switched on for this site yet.','err');
  else toast('Couldn’t save just now — try again in a moment.','err');
}

// ── boot ──────────────────────────────────────────────────────────────────────
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to see your inbox.</h2><p style="margin-top:18px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load your inbox just now.</h2><p class="muted">A brief hiccup — refresh in a moment.</p></div>`;}
async function load(){
  const ok=await loadData();
  if(!ok){trouble();return;}
  renderConsole();renderList();renderPane();
  api('/notifications/read','POST',{}).catch(()=>{});   // opening the Inbox marks activity seen (clears the bell)
}
(async function(){try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";if(!TOKEN){signedOut();return;}await load();}catch(_){trouble();}})();
</script>
