<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finishing your connection…</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f6f4ef;--card:#fffdf9;--ink:#221f1a;--soft:#6b6459;--line:#e7e1d6;--accent:#7a5c3e;--good:#3f6b52;--serif:"Iowan Old Style",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#1a1815;--card:#221f1b;--ink:#efe9df;--soft:#a49b8c;--line:#33302a;--accent:#c8a678;--good:#8bbf9f}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .card{max-width:440px;margin:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:38px 32px;text-align:center;box-shadow:0 10px 30px rgba(40,32,20,.06)}
  h1{font-family:var(--serif);font-weight:500;font-size:24px;margin:14px 0 8px}
  p{color:var(--soft);font-size:15px;margin:0 auto;max-width:34ch;line-height:1.55}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
  .ok{width:30px;height:30px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;margin:0 auto;font-size:17px}
  a.btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;padding:11px 20px;border-radius:999px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spin" role="status" aria-label="Finishing"></div>
  <h1 style="margin-top:18px">Finishing your connection…</h1>
  <p>One moment — we’re confirming with the service. Nothing on your website changes.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// The return leg of a customer connecting a service. It only confirms the
// connection with the platform; it never sees a password and changes nothing on
// the customer's site. Plain language, no OAuth/API words on screen.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true } });
const $ = (id) => document.getElementById(id);

function show(icon, title, msg, showBtn){
  $('card').innerHTML = (icon === 'ok' ? '<div class="ok">✓</div>' : '<div class="spin" role="status"></div>')
    + `<h1 style="margin-top:18px">${title}</h1><p>${msg}</p>`
    + (showBtn ? '<a class="btn" href="/connections.html">Back to your connections</a>' : '');
}

(async function(){
  const p = new URLSearchParams(location.search);
  const code = p.get('code') || '';
  const state = p.get('state') || '';
  // the customer chose which service to connect a moment ago; we remembered it
  const key = localStorage.getItem('dds-pending-connection') || p.get('provider') || '';
  const label = localStorage.getItem('dds-pending-label') || 'your service';

  if(!code || !key){
    show('', 'That connection didn’t finish.', 'No harm done — nothing changed. Please start connecting again from your presence.', true);
    return;
  }
  try{
    const { data } = await sb.auth.getSession();
    const token = (data && data.session && data.session.access_token) || '';
    if(!token){ show('', 'Please sign in and try again.', 'Your connection couldn’t be confirmed because your session ended. Nothing changed.', true); return; }
    const r = await fetch(SUPABASE_URL + '/functions/v1/presence/connections/' + encodeURIComponent(key) + '/callback', {
      method:'POST', headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':token },
      body: JSON.stringify({ code, state }),
    });
    localStorage.removeItem('dds-pending-connection'); localStorage.removeItem('dds-pending-label');
    if(r.ok){
      show('ok', 'Connected.', 'We’re now reading from ' + label + ' — read-only, always with your approval, and yours to disconnect any time.', true);
    } else {
      show('', 'That connection didn’t complete.', 'Nothing changed. Please try connecting again from your presence.', true);
    }
  }catch(_){
    show('', 'That connection didn’t complete.', 'Nothing changed on your site. Please try again in a moment.', true);
  }
})();
</script>
</body>
</html>
