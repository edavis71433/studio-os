<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send an update — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Write one update and send it to your contacts or website enquiries — you preview and press send.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically) — same aliasing pattern
     as files.html / customers.html / inbox.html. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#6f677d);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-deep:var(--dds-p-deep,#2a1b4a);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--dds-w-focus,760px);margin:0 auto;padding:34px 20px 90px}
  .rolebadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:5px 12px}
  header h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,5vw,32px);margin:14px 0 .1em;letter-spacing:-.01em}
  header .sub{color:var(--soft);font-size:15px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-top:16px}
  .card h2{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 4px}
  .card .hint{color:var(--soft);font-size:13px;margin:0 0 12px}
  label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:12px 0 5px}
  input[type=text],textarea,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  textarea{min-height:150px;resize:vertical;line-height:1.5}
  input[type=datetime-local]{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .segs{display:flex;flex-wrap:wrap;gap:8px}
  .seg{font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;padding:7px 13px;cursor:pointer;text-align:left}
  .seg.on{background:var(--p-soft);color:var(--p);border-color:var(--p-soft)}
  .seg .n{opacity:.75;font-weight:500}
  .tokens{font-size:12.5px;color:var(--faint);margin-top:6px}
  .tokens code{background:var(--p-soft);color:var(--p);border-radius:5px;padding:1px 6px;font-size:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  button.primary{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--p);background:var(--p);color:#fff;padding:10px 20px;cursor:pointer}
  button.ghost{font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer}
  button.ghost:hover{border-color:var(--p);color:var(--p)}
  button:disabled{opacity:.5;cursor:default}
  .count{font-size:14px;color:var(--ink);font-weight:600}
  .count .sub{color:var(--soft);font-weight:400;font-size:13px}
  .preview{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px;background:#f4f2ef}
  .preview iframe{width:100%;height:420px;border:0;background:#f4f2ef}
  .preview .subj{padding:10px 14px;font-size:13.5px;color:var(--soft);border-bottom:1px solid var(--line);background:var(--card)}
  .preview .subj b{color:var(--ink)}
  /* history — leads-style .lhead-lite header on the card */
  .hh{display:flex;align-items:center;gap:10px}
  .hh h2{flex:1;min-width:0}
  .lbtn{flex:none;font-family:inherit;font-size:16px;line-height:1;border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;width:34px;height:34px;cursor:pointer}
  .lbtn:hover{border-color:var(--p);color:var(--p)}
  .lmeta{font-size:12.5px;color:var(--faint);margin:2px 0 12px}
  .notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:2px 0 4px}
  .bc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
  .bchead{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:8px}
  .bc .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .bc .subj{font-weight:600;font-size:15px}
  .bcdetail{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .bcdetail .kv{font-size:13.5px;color:var(--soft)}
  .bcdetail .kv b{color:var(--ink)}
  .bcdetail .preview iframe{height:320px}
  .failnote{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin-top:8px}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}
  .bc .st{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;border-radius:999px;padding:2px 9px}
  .st.draft{color:var(--warn);background:var(--warn-soft)}
  .st.scheduled{color:var(--p);background:var(--p-soft)}
  .st.sent{color:var(--good);background:var(--good-soft)}
  .st.sending{color:var(--p);background:var(--p-soft)}
  .st.canceled{color:var(--faint);background:var(--line)}
  .bc .meta{font-size:13px;color:var(--soft);margin-top:4px}
  .bc .acts{display:flex;gap:8px;margin-top:12px}
  .muted{color:var(--soft);font-size:14.5px}
  .center{text-align:center;padding:50px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px}
  a.link{color:var(--p);text-decoration:none;font-weight:600}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">

<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="",SEGMENTS=[],BROADCASTS=[],SEL='contacts',DRAFT=null,BUSY=false;
let REQ_SEQ=0;      // request-generation guard: a slow response that resolves after a newer request started is DISCARDED
let DET_SEQ=0;      // same guard for the per-row drill-in read
let LOADED_AT=Date.now();
let SEG_OK=true,LIST_OK=true;   // per-read health — one read failing degrades ITS section, never the whole page
let OPEN=null;      // the drilled-in broadcast id (accordion)
const DETAILS={};   // per-id detail cache (GET /broadcasts/:id)
const updatedLabel=()=>{const m=Math.floor((Date.now()-LOADED_AT)/60000);return m<1?'Updated just now':'Updated '+m+' min ago';};
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;});
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':(new URLSearchParams(location.search).get('client')||'')});
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
function toast(m){if(window.ddsToast)return void ddsToast(m);const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
// Small styled confirm — replaces native confirm(), matching the app's surfaces
// (same pattern as files.html / connections.html / visual-studio.html). Resolves true/false.
function askConfirm(title, body, okLabel){
  return new Promise((resolve)=>{
    const dlg=document.createElement('dialog');
    dlg.style.cssText='border:none;border-radius:14px;padding:0;max-width:400px;width:92%;box-shadow:0 20px 60px rgba(30,19,56,.28);background:var(--card,#fff);color:var(--ink,#1b1525)';
    const box=document.createElement('div'); box.style.cssText='padding:20px';
    const h=document.createElement('div'); h.textContent=title; h.style.cssText='font-weight:600;margin-bottom:6px'; box.appendChild(h);
    if(body){ const p=document.createElement('div'); p.textContent=body; p.style.cssText='font-size:13px;color:var(--soft,#6b6478);margin-bottom:10px'; box.appendChild(p); }
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:14px';
    const mk=(label,primary)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=label;
      b.style.cssText=primary
        ?'font:inherit;font-size:13px;font-weight:600;border:1px solid var(--p,#5b3fa0);background:var(--p,#5b3fa0);color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer'
        :'font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line,#ddd);background:transparent;color:var(--ink,#1b1525);border-radius:999px;padding:8px 15px;cursor:pointer';
      return b; };
    const cancel=mk('Cancel',false); const ok=mk(okLabel||'OK',true);
    row.appendChild(cancel); row.appendChild(ok); box.appendChild(row); dlg.appendChild(box); document.body.appendChild(dlg);
    let done=false; const finish=(v)=>{ if(done)return; done=true; try{dlg.close();}catch(e){} dlg.remove(); resolve(v); };
    cancel.addEventListener('click',()=>finish(false));
    ok.addEventListener('click',()=>finish(true));
    dlg.addEventListener('cancel',(e)=>{ e.preventDefault(); finish(false); });
    dlg.showModal(); setTimeout(()=>ok.focus(),20);
  });
}
// Small styled text prompt — matches askConfirm; resolves the trimmed string, or null on cancel/empty.
function askPrompt(title, body, okLabel, placeholder){
  return new Promise((resolve)=>{
    const dlg=document.createElement('dialog');
    dlg.style.cssText='border:none;border-radius:14px;padding:0;max-width:400px;width:92%;box-shadow:0 20px 60px rgba(30,19,56,.28);background:var(--card,#fff);color:var(--ink,#1b1525)';
    const box=document.createElement('div'); box.style.cssText='padding:20px';
    const h=document.createElement('div'); h.textContent=title; h.style.cssText='font-weight:600;margin-bottom:6px'; box.appendChild(h);
    if(body){ const p=document.createElement('div'); p.textContent=body; p.style.cssText='font-size:13px;color:var(--soft,#6b6478);margin-bottom:10px'; box.appendChild(p); }
    const inp=document.createElement('input'); inp.type='text'; inp.placeholder=placeholder||''; inp.maxLength=200;
    inp.style.cssText='width:100%;padding:9px 11px;border:1px solid var(--line,#ddd);border-radius:9px;background:var(--bg,#faf8f5);color:inherit;font:inherit;font-size:14px'; box.appendChild(inp);
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:14px';
    const mk=(label,primary)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=label;
      b.style.cssText=primary?'font:inherit;font-size:13px;font-weight:600;border:1px solid var(--p,#5b3fa0);background:var(--p,#5b3fa0);color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer':'font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line,#ddd);background:transparent;color:var(--ink,#1b1525);border-radius:999px;padding:8px 15px;cursor:pointer';
      return b; };
    const cancel=mk('Cancel',false); const ok=mk(okLabel||'OK',true);
    row.appendChild(cancel); row.appendChild(ok); box.appendChild(row); dlg.appendChild(box); document.body.appendChild(dlg);
    let done=false; const finish=(v)=>{ if(done)return; done=true; try{dlg.close();}catch(e){} dlg.remove(); resolve(v); };
    const submit=()=>{ const v=inp.value.trim(); finish(v||null); };
    cancel.addEventListener('click',()=>finish(null));
    ok.addEventListener('click',submit);
    inp.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    dlg.addEventListener('cancel',(e)=>{ e.preventDefault(); finish(null); });
    dlg.showModal(); setTimeout(()=>inp.focus(),20);
  });
}
function when(iso){if(!iso)return'';const d=Math.floor((Date.now()-Date.parse(iso))/86400000);if(d<0)return'soon';if(d<=0)return'today';if(d===1)return'yesterday';if(d<7)return d+' days ago';const w=Math.floor(d/7);return w+(w===1?' week':' weeks')+' ago';}
function segCount(k){const s=SEGMENTS.find(x=>x.key===k);return s?s.count:0;}

function render(){
  let h=`<div class="rolebadge">● Send an update</div>
    <header><h1 id="pagehead" tabindex="-1">Send an update</h1><p class="sub">Write one message and send it to your people. You preview it and press send — nothing ever goes out on its own.</p></header>
    <div class="card">
      <h2>Who it goes to</h2>
      <p class="hint">Pick a list. Anyone who has unsubscribed is left out automatically.</p>
      <div class="segs" id="segs">${segsHtml()}</div>
    </div>
    <div class="card">
      <h2>Your message</h2>
      <p class="hint">A subject line and your note. You can use simple formatting.</p>
      <label for="subj">Subject</label>
      <input type="text" id="subj" maxlength="200" placeholder="A quick update from us" value="${esc(DRAFT&&DRAFT.subject||'')}">
      <label for="bodytx">Message</label>
      <textarea id="bodytx" placeholder="Hi {{first_name}},&#10;&#10;Write your update here…">${esc(DRAFT&&DRAFT.body||'')}</textarea>
      <p class="tokens">Personalize with <code>{{first_name}}</code> and <code>{{business_name}}</code> — they fill in for each person.</p>
      <div class="row">
        <button class="ghost" id="assist" type="button" title="Ask for a first draft you can edit">✨ Help me write it</button>
        <button class="ghost" id="preview" type="button">Preview →</button>
      </div>
    </div>
    <div id="stage"></div>
    <div class="card">
      <div class="hh"><h2>Recent broadcasts</h2><button class="lbtn" id="bcRefresh" type="button" aria-label="Refresh broadcasts" title="Refresh">↻</button></div>
      ${histMeta()}
      ${histBody()}
    </div>`;
  $('main').innerHTML=h;wire();
}
// audience picker — or its honest failure notice when the segments read failed
function segsHtml(){
  if(!SEG_OK)return `<div class="notice" id="segNotice"><span>Your lists couldn’t load just now, so a send can’t be counted honestly yet.</span> <button class="ghost" id="segRetry" type="button">Try again</button></div>`;
  return SEGMENTS.map(s=>`<button class="seg ${s.key===SEL?'on':''}" data-seg="${esc(s.key)}" aria-pressed="${s.key===SEL?'true':'false'}"><span>${esc(s.label)}</span> <span class="n">· ${s.count}</span></button>`).join('')||'<span class="muted">No lists yet.</span>';
}
function histMeta(){
  if(!LIST_OK)return '';
  const lastSent=BROADCASTS.reduce((m,b)=>(b.sent_at&&(!m||b.sent_at>m))?b.sent_at:m,null);
  return `<div class="lmeta" id="bcMeta">${BROADCASTS.length} broadcast${BROADCASTS.length===1?'':'s'}${lastSent?' · last sent '+esc(when(lastSent)):''} · ${esc(updatedLabel())}</div>`;
}
function histBody(){
  if(!LIST_OK)return `<div class="notice" id="bcNotice"><span>Your broadcast history couldn’t load just now.</span> <button class="ghost" id="bcRetry" type="button">Try again</button></div>`;
  return BROADCASTS.length?BROADCASTS.map(bcCard).join(''):'<p class="muted">Nothing sent yet — your first update will show up here.</p>';
}
function bcCard(b){
  const cnt=b.status==='sent'?`${b.sent_count||0} sent${b.skipped_count?' · '+b.skipped_count+' skipped':''}${b.failed_count?' · '+b.failed_count+' failed':''}`
    :b.status==='scheduled'?`Scheduled for ${b.scheduled_at?new Date(b.scheduled_at).toLocaleString():'soon'}`
    :b.status==='draft'?'Draft — not sent':b.status;
  const open=OPEN===b.id;
  const acts=[];
  if(b.status==='draft')acts.push(`<button class="ghost" data-edit="${esc(b.id)}">Edit draft</button>`);
  if(b.status==='scheduled'){acts.push(`<button class="ghost" data-cancel="${esc(b.id)}">Cancel</button>`);acts.push(`<button class="ghost" data-resched="${esc(b.id)}">Reschedule</button>`);}
  return `<div class="bc" data-bc="${esc(b.id)}">
    <button class="bchead" type="button" data-open="${esc(b.id)}" aria-expanded="${open?'true':'false'}">
      <span class="top"><span class="subj">${esc(b.subject||'(no subject)')}</span><span class="st ${esc(b.status)}">${esc(b.status)}</span></span>
      <span class="meta">${esc(cnt)} · ${esc(when(b.sent_at||b.created_at))}</span>
    </button>
    ${acts.length?`<div class="acts">${acts.join('')}</div>`:''}
    <div class="bcdetail" id="d-${esc(b.id)}" ${open?'':'hidden'}></div>
  </div>`;
}
function wire(){
  document.querySelectorAll('[data-seg]').forEach(b=>b.addEventListener('click',()=>{SEL=b.getAttribute('data-seg');syncDraftFromForm();render();}));
  const a=$('assist');if(a)a.addEventListener('click',assist);
  const p=$('preview');if(p)p.addEventListener('click',doPreview);
  document.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',()=>cancelBc(b.getAttribute('data-cancel'))));
  document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editDraft(b.getAttribute('data-edit'))));
  document.querySelectorAll('[data-resched]').forEach(b=>b.addEventListener('click',()=>reschedule(b.getAttribute('data-resched'))));
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>toggleRow(b.getAttribute('data-open'),b)));
  const rf=$('bcRefresh');if(rf)rf.addEventListener('click',()=>load(true).then(()=>{const nr=$('bcRefresh');if(nr)nr.focus();}));
  // notice retries are SOFT — retrying ONE section must not let a transient
  // failure of the OTHER section tear down its last-good render (the ↻ contract)
  const sr=$('segRetry');if(sr)sr.addEventListener('click',()=>load(true));
  const br=$('bcRetry');if(br)br.addEventListener('click',()=>load(true));
  const s=$('subj'),t=$('bodytx');if(s)s.addEventListener('input',()=>{if(DRAFT)DRAFT.subject=s.value;});if(t)t.addEventListener('input',()=>{if(DRAFT)DRAFT.body=t.value;});
  // repaint the drilled-open row; if a list refresh just dropped the DETAILS
  // cache, RE-READ it — the open panel gets fresh counts, never a blank
  if(OPEN){const box=$('d-'+OPEN);if(box){if(DETAILS[OPEN])paintDetail(box,OPEN);else loadDetail(OPEN);}}
}
// ── history drill-in (client.html Messages idiom): status · audience · counts ·
//    the delivered body in a sandboxed srcdoc iframe · honest failed line ──────
async function toggleRow(id,btn){
  const box=$('d-'+id);if(!box)return;
  const wasOpen=OPEN===id;
  document.querySelectorAll('.bcdetail').forEach(el=>{el.hidden=true;});
  document.querySelectorAll('.bchead').forEach(el=>el.setAttribute('aria-expanded','false'));
  OPEN=null;
  if(wasOpen)return;
  OPEN=id;btn.setAttribute('aria-expanded','true');box.hidden=false;
  if(DETAILS[id])return void paintDetail(box,id);
  await loadDetail(id);
}
// Fetch (or RE-fetch) the drill-in for the currently OPEN row and paint it.
// Also called from wire() when a list refresh dropped the DETAILS cache while a
// row was open — it re-reads fresh counts instead of leaving a blank panel.
async function loadDetail(id){
  const box=$('d-'+id);if(!box)return;
  box.innerHTML='<p class="muted">Opening…</p>';
  const gen=++DET_SEQ;
  let r;try{r=await api('/broadcasts/'+id);}catch(_){r={ok:false,status:0,body:{}};}
  if(gen!==DET_SEQ||OPEN!==id)return;   // a newer drill-in started, or the row was closed — never paint stale
  if(!r.ok||!r.body.data){
    box.innerHTML='<p class="muted">Couldn’t open this one just now. <button class="ghost" data-dretry type="button">Try again</button></p>';
    const rt=box.querySelector('[data-dretry]');if(rt)rt.addEventListener('click',()=>loadDetail(id));
    return;
  }
  DETAILS[id]=r.body.data;paintDetail(box,id);
}
function paintDetail(box,id){const d=DETAILS[id];box.innerHTML=detailHtml(d);const f=box.querySelector('iframe');if(f)f.srcdoc=(d&&d.preview_html)||'';}
function detailHtml(d){
  const b=(d&&d.broadcast)||{};
  let counts='';
  if(b.status==='sent')counts=`${b.sent_count||0} sent${b.skipped_count?' · '+b.skipped_count+' skipped':''}${b.failed_count?' · '+b.failed_count+' failed':''}${b.sent_at?' · '+when(b.sent_at):''}`;
  else if(b.status==='scheduled')counts=`Scheduled for ${b.scheduled_at?new Date(b.scheduled_at).toLocaleString():'soon'} · ${d.recipient_count||0} on the list today`;
  else counts=`${d.recipient_count||0} ${d.recipient_count===1?'person':'people'} would get this today${d.suppressed_count?' · '+d.suppressed_count+' unsubscribed and left out':''}`;
  // The API doesn't expose per-address failures — the honest line is the count.
  const failed=(b.status==='sent'&&b.failed_count)?`<p class="failnote">${b.failed_count} address${b.failed_count===1?'':'es'} couldn’t be reached — everyone else got it.</p>`:'';
  return `<div class="kv"><b>${esc(d.audience_label||'')}</b> · ${esc(counts)}</div>${failed}
    <div class="preview"><div class="subj">Subject: <b>${esc(d.preview_subject||b.subject||'')}</b></div><iframe title="${b.status==='sent'?'Email as delivered':'Email preview'}" sandbox=""></iframe></div>`;
}
// ── "Drafts live again" (the L fix): a saved draft reopens INTO THE COMPOSER
//    with DRAFT.id set, so the next preview PATCHes it instead of POSTing a twin.
async function editDraft(id){
  if(BUSY)return;BUSY=true;
  let r;try{r=await api('/broadcasts/'+id);}catch(_){r={ok:false,status:0,body:{}};}
  BUSY=false;
  if(!r.ok||!r.body.data||!r.body.data.broadcast){toast('Couldn’t open that draft just now.');return;}
  const b=r.body.data.broadcast;
  DETAILS[id]=r.body.data;
  DRAFT={id:b.id,subject:b.subject||'',body:b.body||'',audience:b.audience};
  if(b.audience)SEL=b.audience;
  OPEN=null;render();
  const s=$('subj');if(s)s.focus();
  toast('Draft opened — edit anything, then preview.');
}
async function reschedule(id){
  if(BUSY)return;BUSY=true;
  let r;try{r=await api('/broadcasts/'+id);}catch(_){r={ok:false,status:0,body:{}};}
  BUSY=false;
  if(!r.ok||!r.body.data){toast('Couldn’t open that one just now.');return;}
  stageFor(id,r.body.data,{scheduleFirst:true,laterLabel:'Reschedule'});
}
function syncDraftFromForm(){const s=$('subj'),t=$('bodytx');if(s&&t){DRAFT=DRAFT||{};DRAFT.subject=s.value;DRAFT.body=t.value;}}

async function assist(){
  syncDraftFromForm();   // capture what's typed FIRST, like every other render path — the proposal merges in, it never replaces
  const goal=await askPrompt('What’s this update about?','A sentence is enough — you’ll get a draft you can edit.','Draft it','e.g. the summer menu is live');
  if(!goal)return;
  toast('Writing a draft…');
  const r=await api('/broadcasts/draft-assist','POST',{goal});
  if(!r.ok){toast(r.body&&r.body.message||'Couldn’t draft that.');return;}
  // overwrite ONLY what the server proposed — draft-assist may return subject-only
  // or body-only (routes/broadcasts.ts cleans each independently), and a
  // subject-only proposal must not blank a typed body, nor vice versa
  DRAFT=DRAFT||{};if(r.body.data.subject)DRAFT.subject=r.body.data.subject;if(r.body.data.body)DRAFT.body=r.body.data.body;
  render();toast('Here’s a starting point — edit anything.');
}

// Save the current compose form as a draft on the server, return its id.
async function ensureDraft(){
  syncDraftFromForm();
  const subject=($('subj')&&$('subj').value||'').trim();
  const body=($('bodytx')&&$('bodytx').value||'').trim();
  if(!subject){toast('Add a subject line first.');return null;}
  if(!body){toast('Write your message first.');return null;}
  if(DRAFT&&DRAFT.id){
    const u=await api('/broadcasts/'+DRAFT.id,'PATCH',{subject,body,audience:SEL});
    if(!u.ok){toast((u.body&&u.body.message)||'That didn’t save.');return null;}
    delete DETAILS[DRAFT.id];   // the cached drill-in is stale now
    return DRAFT.id;
  }
  const r=await api('/broadcasts','POST',{subject,body,audience:SEL});
  if(!r.ok||!r.body.data||!r.body.data.id){toast('Couldn’t save the draft.');return null;}
  DRAFT=r.body.data;return DRAFT.id;
}

async function doPreview(){
  if(BUSY)return;BUSY=true;
  const id=await ensureDraft();BUSY=false;if(!id)return;
  const r=await api('/broadcasts/'+id);
  if(!r.ok){toast('Couldn’t build the preview.');return;}
  stageFor(id,r.body.data,{});
}
// The ONE preview-and-approve stage — used by the composer's Preview and by
// Reschedule on a scheduled row (schedule mode preselected, time prefilled).
function stageFor(id,d,opts){
  opts=opts||{};
  const cnt=d.recipient_count||0;
  const skip=d.suppressed_count?` <span class="sub">· ${d.suppressed_count} unsubscribed and left out</span>`:'';
  const later=!!opts.scheduleFirst;
  const laterLabel=opts.laterLabel||'Schedule';
  let pre='';
  const sat=d.broadcast&&d.broadcast.scheduled_at;
  if(later&&sat){const dt=new Date(sat);const pad=(n)=>String(n).padStart(2,'0');pre=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;}
  $('stage').innerHTML=`<div class="card">
    <h2>Preview & send</h2>
    <p class="hint">This is exactly what lands in their inbox.</p>
    <div class="count">${cnt} ${cnt===1?'person':'people'} will get this${skip}</div>
    <div class="preview"><div class="subj">Subject: <b>${esc(d.preview_subject||'')}</b></div><iframe id="pvframe" title="Email preview" sandbox=""></iframe></div>
    <label for="when">When</label>
    <div class="row" style="margin-top:4px">
      <label style="display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--ink);margin:0"><input type="radio" name="whenmode" value="now" ${later?'':'checked'}> Send now</label>
      <label style="display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--ink);margin:0"><input type="radio" name="whenmode" value="later" ${later?'checked':''}> Schedule</label>
      <input type="datetime-local" id="when" value="${esc(pre)}" style="display:${later?'inline-block':'none'}">
    </div>
    <div class="row">
      <button class="primary" id="send" ${cnt?'':'disabled'}>${later?laterLabel:(cnt?'Send now':'No one to send to')}</button>
      <button class="ghost" id="reedit">${later?'Never mind':'Keep editing'}</button>
    </div>
  </div>`;
  // sandboxed preview via srcdoc (isolated, no scripts run)
  const f=$('pvframe');if(f)f.srcdoc=d.preview_html||'';
  $('stage').scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('[name=whenmode]').forEach(r=>r.addEventListener('change',()=>{const l=document.querySelector('[name=whenmode]:checked').value==='later';$('when').style.display=l?'inline-block':'none';$('send').textContent=l?laterLabel:'Send now';}));
  $('send').addEventListener('click',()=>doSend(id));
  $('reedit').addEventListener('click',()=>{$('stage').innerHTML='';const s=$('subj');if(s)s.focus();});
}

async function doSend(id){
  if(BUSY)return;
  const later=document.querySelector('[name=whenmode]:checked').value==='later';
  let scheduled_at=null;
  if(later){const v=$('when').value;if(!v){toast('Pick a date and time.');return;}scheduled_at=new Date(v).toISOString();if(Date.parse(scheduled_at)<=Date.now()){toast('Pick a time in the future — or choose Send now.');return;}}
  if(!later&&!(await askConfirm('Send this to your list now?','It goes straight out to everyone on the list — an email can’t be unsent.','Send now')))return;
  const sendBtn=$('send'),sendLabel=sendBtn.textContent;
  BUSY=true;sendBtn.disabled=true;sendBtn.textContent=later?'Scheduling…':'Sending…';
  const r=await api('/broadcasts/'+id+'/send','POST',scheduled_at?{scheduled_at}:{});
  BUSY=false;
  if(!r.ok){toast(r.body&&r.body.message||'That didn’t send.');sendBtn.disabled=false;sendBtn.textContent=sendLabel;return;}
  const d=r.body.data||{};
  if(d.status==='scheduled')toast('Scheduled. It’ll go out then — you can cancel any time before.');
  else if(d.status==='queued')toast('Sending now — it goes out over the next few minutes.');
  else toast(`Sent to ${d.sent_count||0} ${(d.sent_count===1)?'person':'people'}.`+(d.failed_count?` (${d.failed_count} couldn’t be reached.)`:''));
  if(DRAFT&&DRAFT.id===id){
    // This send CONSUMED the composer's draft — so empty the FORM too, before
    // load() runs: load() calls syncDraftFromForm(), which re-captures whatever
    // the fields still hold, and a still-populated form would resurrect an
    // id-less twin of a broadcast that was just SENT (the next Preview would
    // POST a duplicate draft). The composer must end genuinely empty.
    DRAFT=null;SEL='contacts';
    const s=$('subj');if(s)s.value='';
    const t=$('bodytx');if(t)t.value='';
  }
  delete DETAILS[id];if(OPEN===id)OPEN=null;   // mirror cancelBc — a drilled-open row must not re-render as a visible empty panel
  $('stage').innerHTML='';
  await load();
}

async function cancelBc(id){
  if(!(await askConfirm('Cancel this scheduled broadcast?','It won’t go out. It stays in your history and nothing is deleted.','Cancel it')))return;
  const r=await api('/broadcasts/'+id+'/cancel','POST',{});
  if(!r.ok){toast(r.body&&r.body.message||'Couldn’t cancel.');return;}
  delete DETAILS[id];if(OPEN===id)OPEN=null;
  toast('Canceled.');await load();
}

function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to send an update.</h2><p style="margin-top:18px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
// Try again retries load() IN PLACE — never location.reload() (the leads.html contract).
function trouble(m){$('main').innerHTML=`<div class="center"><h2>${esc(m||'We couldn’t load this just now.')}</h2><p class="muted" style="margin-bottom:16px">It’s probably a brief hiccup.</p><button id="retry" class="primary">Try again</button></div>`;const rt=$('retry');if(rt)rt.addEventListener('click',()=>load());}

// ── Boot reads run in PARALLEL (D6) with per-read failure honesty ────────────
// One read failing degrades ITS section with a visible notice (never a quietly
// empty render that masquerades as having nothing); only BOTH failing gets the
// full trouble screen. soft=true (the ↻ button): any failure keeps the current
// render and toasts — the error surfaces are for the initial load only.
async function load(soft){
  const gen=++REQ_SEQ;
  const [seg,list]=await Promise.all([
    api('/broadcasts/segments').catch(()=>({ok:false,status:0,body:{}})),
    api('/broadcasts').catch(()=>({ok:false,status:0,body:{}})),
  ]);
  if(gen!==REQ_SEQ)return;   // a newer request started — this response is stale, never paint it
  if(seg.status===403||list.status===403){$('main').innerHTML=`<div class="center"><h2>Broadcasts live in your studio workspace.</h2></div>`;return;}
  if(!seg.ok&&!list.ok){if(soft)return void toast('Couldn’t refresh just now.');trouble();return;}
  if(soft&&(!seg.ok||!list.ok))toast('Couldn’t refresh just now.');
  if(seg.ok){SEGMENTS=(seg.body.data&&seg.body.data.segments)||[];SEG_OK=true;}
  else if(!soft)SEG_OK=false;   // soft keeps the last good lists on screen
  if(list.ok){
    BROADCASTS=(list.body.data&&list.body.data.broadcasts)||[];LIST_OK=true;LOADED_AT=Date.now();
    // a fresh list drops the per-row cache — drilled-in counts must not freeze
    // for the session while the list refreshes (an OPEN row re-reads in wire())
    for(const k of Object.keys(DETAILS))delete DETAILS[k];
  }
  else if(!soft)LIST_OK=false;
  syncDraftFromForm();   // a re-render must never eat what's typed in the composer
  render();
}
(async function(){try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";if(!TOKEN){signedOut();return;}await load();}catch(_){trouble();}})();
</script>
</body>
