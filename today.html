<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today — Studio OS</title>
<meta name="description" content="What needs you today — at most a few calm things, in plain words.">
<style>
  :root{
    --bg:#faf8f5; --card:#fff; --ink:#1b1525; --soft:#6b6478; --faint:#938ba3; --line:#eee9e0;
    --accent:#5b3fa0; --accent-soft:#efeafa; --good:#3f7a5a; --good-soft:#e7f1ea;
    --warn:#8a6d3b; --warn-soft:#f3ead9; --shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.05);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;
      --accent:#b79ceb;--accent-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;
      --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28);}
  }
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;--accent:#5b3fa0;--accent-soft:#efeafa;--good:#3f7a5a;--good-soft:#e7f1ea;--warn:#8a6d3b;--warn-soft:#f3ead9;}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--accent:#b79ceb;--accent-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:48px 22px 96px}
  header .eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}
  header h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.12;margin:.35em 0 .1em;text-wrap:balance}
  header .sub{color:var(--soft);font-size:15.5px;margin:0}
  .stack{display:flex;flex-direction:column;gap:16px;margin-top:34px}
  .moment{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .moment::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.5}
  .moment.good::before{background:var(--good)} .moment.attn::before{background:var(--warn)}
  .moment h2{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 6px;line-height:1.2;text-wrap:balance}
  .moment p{margin:0;color:var(--soft);font-size:15px}
  .row{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 15px;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover{background:var(--accent-soft);border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.05)}
  button.ghost{border-color:transparent;color:var(--soft);padding-left:6px;padding-right:6px}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .answer{margin-top:14px;padding:14px 16px;background:var(--accent-soft);border-radius:12px;font-size:14.5px;white-space:pre-wrap;color:var(--ink)}
  .tag{display:inline-block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:8px}
  .calm{background:var(--good-soft);border-color:transparent}
  .calm h2{color:var(--good)}
  a.moment.todo{display:block;text-decoration:none;color:inherit}
  a.moment.todo:hover{border-color:var(--accent)}
  .golink{color:var(--accent);font-weight:600;font-size:14px}
  .features{margin-top:40px;padding-top:26px;border-top:1px solid var(--line)}
  .features .lead{font-size:13px;color:var(--soft);margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
  .ask{margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
  .ask h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 4px}
  .ask p{margin:0 0 14px;color:var(--soft);font-size:14px}
  .askbox{display:flex;gap:10px}
  .askbox input{flex:1;font-family:inherit;font-size:15px;padding:12px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .askbox input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .muted{color:var(--soft);font-size:14px}
  .center{text-align:center;padding:56px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  a.link{color:var(--accent);text-decoration:none;font-weight:600}
  a.link:hover{text-decoration:underline}
  .appnav{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 26px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .appnav a{font-size:13.5px;color:var(--soft);text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:500;white-space:nowrap}
  .appnav a:hover{background:var(--accent-soft);color:var(--accent)}
  .appnav a[aria-current="page"]{background:var(--accent);color:#fff}
  .appnav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Your business</div>
    <h1 id="greeting">Today</h1>
    <p class="sub" id="sub">A calm look at what — if anything — needs you.</p>
  </header>
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
</div>
<!-- PT-5: one-time contextual tip, taught where it's relevant, then gone forever -->
<div class="dds-hint" data-hint="today-bell" hidden>The 🔔 at the top shows everything that needs you — from any page in Studio&nbsp;OS.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// ── consumes the EXISTING platform only: /moments, /concierge/ask, /marketplace/features.
//    No engine, no new system. Calm, plain language; nothing technical.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN = SUPABASE_URL + "/functions/v1/presence";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN = "";
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;}); // keep token fresh (auto-refresh)

async function apiGet(path){ const r = await fetch(FN + path, { headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN,'x-dds-scope-site':(new URLSearchParams(location.search).get('client')||'') } }); return r.ok ? r.json() : Promise.reject(r.status); }
async function apiPost(path, body){ const r = await fetch(FN + path, { method:'POST', headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN,'x-dds-scope-site':(new URLSearchParams(location.search).get('client')||'') }, body: JSON.stringify(body||{}) }); return r.ok ? r.json() : Promise.reject(r.status); }

function greet(){ const h = new Date().getHours(); return h < 12 ? 'Good morning.' : h < 18 ? 'Good afternoon.' : 'Good evening.'; }

// tone → calm styling class (never a score, never a colour alarm)
function toneClass(t){ if(t==='good_news'||t==='celebration'||t==='celebratory'||t==='reassuring') return 'good'; if(t==='needs_attention'||t==='attentive') return 'attn'; return ''; }

function render(moments, features, feed, ctx){
  $('greeting').textContent = greet();
  const items = (moments||[]).filter(Boolean);
  // PP-5: the empty-state speaks in the language of what this edition actually is.
  const edFeats = (ctx && ctx.edition_features) || null;
  const hasWebsite = !edFeats || edFeats.indexOf('website') >= 0;
  // ── needs you now: the SAME items the top-bar bell counts (notices + pending
  //    approvals) so the home page and the bell tell one story — each taps
  //    straight through to the page that resolves it. ──────────────────────────
  const notices = (feed && feed.notices) || [];
  const approvals = (feed && feed.pending_approvals) || [];
  const needs = notices.length + approvals.length;
  let html = '';
  for(const n of notices){
    html += `<a class="moment attn todo" href="${esc(n.href||'/today.html')}">
      <span class="tag">Needs you</span>
      <h2>${esc(n.headline||'Something needs a look')}</h2>
      ${n.body?`<p>${esc(n.body)}</p>`:''}
      <div class="row"><span class="golink">Take care of it →</span></div></a>`;
  }
  for(const p of approvals){
    const _c=new URLSearchParams(location.search).get('client');
    const _base = p.href ? p.href : p.kind==='connected' ? '/connections.html' : '/presence.html#foundations';
    const href = (_c && _base.charAt(0)==='/') ? (()=>{const h=_base.split('#');return h[0]+(h[0].indexOf('?')>=0?'&':'?')+'client='+encodeURIComponent(_c)+(h[1]?'#'+h[1]:'');})() : _base;
    html += `<a class="moment attn todo" href="${href}">
      <span class="tag">Waiting for your approval</span>
      <h2>${esc(p.title||'A change is ready')}</h2>
      ${p.summary?`<p>${esc(p.summary)}</p>`:''}
      <div class="row"><span class="golink">Review &amp; approve →</span></div></a>`;
  }
  if(!items.length && !needs){
    $('sub').textContent = "Nothing needs your attention today.";
    const clearBody = hasWebsite
      ? 'Your website matches what you’ve told us, and there’s nothing waiting on you today. If something ever deserves a look, it’ll appear here first — calmly, and only then.'
      : 'Everything across your business is quiet, and there’s nothing waiting on you today. If something ever deserves a look, it’ll appear here first — calmly, and only then.';
    const clearLinks = hasWebsite
      ? `<a class="link" href="/presence.html">Open your website</a> <span style="color:var(--soft)">·</span> <a class="link" href="/content-tree.html">See your website map</a> <span style="color:var(--soft)">·</span> <a class="link" href="/leads.html">See your messages</a>`
      : `<a class="link" href="/crm.html">Open Customers</a> <span style="color:var(--soft)">·</span> <a class="link" href="/connections.html">Connections</a>`;
    html += `<div class="moment calm"><span class="tag">All clear</span>
      <h2>${hasWebsite ? 'Everything customers can see is current.' : 'Everything’s quiet across your business.'}</h2>
      <p>${clearBody}</p>
      <div class="row">${clearLinks}</div></div>`;
  } else {
    const parts = [];
    if(needs) parts.push(needs === 1 ? 'one thing needs you' : `${needs} things need you`);
    if(items.length) parts.push(items.length === 1 ? 'one more worth a look' : `${items.length} more worth a look`);
    const s = parts.join(' · '); $('sub').textContent = s.charAt(0).toUpperCase() + s.slice(1) + '.';
    for(const m of items){
      const cls = toneClass(m.moment_type || m.tone);
      const celebrate = cls === 'good';
      html += `<article class="moment ${cls}">
        ${celebrate ? '<span class="tag">Good news</span>' : ''}
        <h2>${esc(m.headline)}</h2>
        <p>${esc(m.summary)}</p>
        <div class="row">
          ${celebrate ? '' : `<button class="primary" data-explain="${esc(m.id)}">Walk me through it</button>`}
          ${m.dismissable ? `<button class="ghost" data-dismiss="${esc(m.id)}">Not now</button>` : ''}
        </div>
        <div class="answer" id="ans-${esc(m.id)}" hidden></div>
      </article>`;
    }
  }
  // "what comes with your business" — the Industry Pack, made invisible
  const feats = (features && features.features) || [];
  if(feats.length){
    html += `<div class="features"><p class="lead">${esc((features && features.note) || 'These come with your kind of business — nothing to set up.')}</p>
      <div class="chips">${feats.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></div>`;
  }
  // the Concierge — a knowledgeable partner, not a chatbot
  html += `<div class="ask"><h3>Have a question about your website?</h3>
    <p>Ask in your own words. It only speaks to what’s actually true of your business.</p>
    <div class="askbox"><input id="q" type="text" placeholder="e.g. what should I do first?" aria-label="Ask a question"><button class="primary" id="askBtn">Ask</button></div>
    <div class="answer" id="askAns" hidden></div></div>`;
  // (Navigation to Connections and Visual Studio now lives in the persistent top nav.)
  $('main').innerHTML = html;
  wire();
}

function wire(){
  document.querySelectorAll('[data-explain]').forEach(b => b.addEventListener('click', () => explain(b.getAttribute('data-explain'), b)));
  document.querySelectorAll('[data-dismiss]').forEach(b => b.addEventListener('click', () => dismiss(b.getAttribute('data-dismiss'), b)));
  const askBtn = $('askBtn'), q = $('q');
  if(askBtn){ askBtn.addEventListener('click', ask); q.addEventListener('keydown', e => { if(e.key==='Enter') ask(); }); }
}

async function explain(id, btn){
  const box = $('ans-'+id); if(!box) return;
  btn.disabled = true; btn.textContent = 'One moment…';
  try{ const r = await apiPost('/concierge/ask', { question: 'What does this mean, and what should I do about it?', topic_id: id });
    box.textContent = (r && r.data && r.data.text) || 'Open it when you have a minute — nothing changes until you decide.';
  }catch(_){ box.textContent = 'I couldn’t load the details just now — nothing’s wrong, try again in a moment.'; }
  box.hidden = false; btn.disabled = false; btn.textContent = 'Walk me through it';
}
async function dismiss(id, btn){
  const card = btn.closest('.moment'); btn.disabled = true;
  try{
    await apiPost('/moments/'+id+'/dismiss', {});
    if(card){
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      if(reduce){ card.remove(); }
      else { card.style.transition='opacity .3s ease, transform .3s ease'; card.style.opacity='0'; card.style.transform='translateY(-6px)'; setTimeout(()=>card.remove(), 300); }
    }
  }
  catch(_){ btn.disabled = false; }
}
async function ask(){
  const q = $('q'), box = $('askAns'), btn = $('askBtn');
  const question = (q.value||'').trim(); if(!question) return;
  btn.disabled = true; btn.textContent = '…'; box.hidden = false; box.textContent = 'Thinking about your presence…';
  try{ const r = await apiPost('/concierge/ask', { question }); box.textContent = (r && r.data && r.data.text) || 'I don’t have anything measured on that yet — I’d rather say so than guess.'; }
  catch(_){ box.textContent = 'I couldn’t answer just now — nothing’s wrong, please try again in a moment.'; }
  btn.disabled = false; btn.textContent = 'Ask';
}

function signedOut(){
  $('sub').textContent = '';
  $('main').innerHTML = `<div class="center"><h2>Welcome back.</h2>
    <p class="muted">Sign in to see what — if anything — needs you today.</p>
    <p style="margin-top:22px"><a class="link" href="/portal.html">Sign in →</a></p></div>`;
}
function trouble(){
  $('main').innerHTML = `<div class="center"><h2>We couldn’t load your day just now.</h2>
    <p class="muted">Nothing’s wrong on your site — this is only this page.</p>
    <p style="margin-top:18px"><button onclick="location.reload()" style="font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 18px;cursor:pointer">Try again</button></p>
    <p style="margin-top:14px"><a class="link" href="/presence.html">Open your workspace →</a></p></div>`;
}

(async function init(){
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    const [moments, features, ctx, feed] = await Promise.all([
      apiGet('/moments').catch(()=>({data:[]})),
      apiGet('/marketplace/features').catch(()=>({data:{features:[]}})),
      apiGet('/portal/context').catch(()=>null),
      apiGet('/portal/feed').catch(()=>null),
    ]);
    const list = Array.isArray(moments?.data) ? moments.data : (moments?.data?.moments || moments?.data || []);
    render(list, features?.data || {}, feed && feed.data, ctx && ctx.data);
    orientationCard(ctx && ctx.data);
    planCard(ctx && ctx.data);
    healthLine();
    journeyStrip();
  }catch(_){ trouble(); }
})();

// ── PP-6: the one-time "welcome to your new plan" orientation. When the edition
// grows (an upgrade added feature areas), name exactly what became available —
// orient, don't market. Fully client-side off the feature list; the first sight
// of any edition orients silently (no false "upgrade" for a brand-new account).
const FEATURE_LABEL = {
  website:'your website workspace', developer:'Developer Mode', forms:'website lead capture',
  business_moments:'your daily updates', connected:'Connections', ai:'AI drafting & the Concierge',
  relationship:'Customers', reports:'Analytics', client_portal:'client sharing',
  managed_service:'managed service', agency:'the agency portfolio', enterprise:'enterprise controls',
};
function orientationCard(c){
  if(!c || !c.edition_features || !c.edition_name) return;
  const KEY='dds-oriented'; let prev=null;
  try{ prev=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(_){}
  const now={ key:c.edition_key, feats:c.edition_features };
  if(!prev || prev.key===now.key){ try{ localStorage.setItem(KEY, JSON.stringify(now)); }catch(_){}
    if(!prev) return;  // first sight → orient silently, never a false upgrade
    return;
  }
  const gained=(now.feats||[]).filter(f=>!(prev.feats||[]).includes(f));
  try{ localStorage.setItem(KEY, JSON.stringify(now)); }catch(_){}
  if(!gained.length) return;  // lateral move / downgrade → nothing to welcome
  const list=gained.map(f=>FEATURE_LABEL[f]||String(f).replace(/_/g,' ')).filter(Boolean);
  const host=document.getElementById('main')||document.body;
  const card=document.createElement('div');
  card.style.cssText='max-width:860px;margin:0 auto 20px;padding:20px 22px;border:1px solid var(--accent);border-radius:16px;background:var(--accent-soft)';
  card.innerHTML=`<div style="font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px">Welcome to ${esc(c.edition_name)}</div>
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:8px">You now have ${list.length===1?'':'a few more things'}${list.length===1?'':':'}</div>
    <p style="margin:0 0 14px;color:var(--soft);font-size:14.5px">${esc(list.join(' · '))}. It’s all here whenever you want it — nothing you need to set up.</p>
    <button class="primary" id="orientDone">Got it</button>`;
  host.insertBefore(card, host.firstChild);
  const b=document.getElementById('orientDone');
  if(b) b.addEventListener('click',()=>{ card.style.transition='opacity .25s'; card.style.opacity='0'; setTimeout(()=>card.remove(),250); });
}

// ── Phase P: "what you own" + the honest upsell — quiet, at the bottom, never a
// dead end. Shown only when the platform says there IS a next rung (owners only;
// the server computes gains from featureDelta so this can never overpromise).
// ── PT-2C: the ONE health experience — the Business Health Coach (PT-6).
//    Replaces the old search-only line; composes every signal into one read. ──
async function healthLine(){
  let r = null;
  try { r = (await apiGet('/coach/health')).data; } catch(_) { return; }
  if (!r) return;
  const attn = r.status === 'attention' || r.status === 'quiet';
  const host = document.getElementById('main') || document.body;
  const line = document.createElement('div');
  line.style.cssText = 'max-width:860px;margin:10px auto 0;padding:12px 20px;border-radius:12px;font-size:14px;border:1px solid var(--line);background:' + (attn ? 'var(--warn-soft)' : 'var(--good-soft)') + ';color:var(--ink)';
  const sugg = (r.suggestions || [])[0];
  if (!sugg) {
    line.textContent = '✓ ' + (r.headline || 'Everything looks healthy.');
  } else {
    line.innerHTML = '<strong>' + esc(r.headline) + '</strong> ' + esc(sugg.text) + ' <a href="' + esc(sugg.href) + '" style="color:var(--accent);font-weight:600">Take a look →</a>' + (r.suggestions.length > 1 ? ' <span style="color:var(--muted)">(+' + (r.suggestions.length - 1) + ' more)</span>' : '');
  }
  host.insertBefore(line, host.firstChild ? host.firstChild.nextSibling : null);
}

// ── PT-2C: the Customer Journey (PT-7) — celebrate milestones, never a score ──
async function journeyStrip(){
  let j = null;
  try { j = (await apiGet('/coach/journey')).data; } catch(_) { return; }
  if (!j || !Array.isArray(j.milestones)) return;
  const host = document.getElementById('main') || document.body;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'max-width:860px;margin:28px auto 0;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:var(--card)';
  let html = '<div style="font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:14px">Your journey</div>';
  if (j.latestCelebration && j.latestCelebration.note) html += '<div style="font-family:var(--serif);font-size:19px;margin-bottom:16px;color:var(--ink)">' + esc(j.latestCelebration.note) + '</div>';
  html += '<div style="display:flex;flex-direction:column;gap:9px">';
  for (const m of j.milestones){
    const mark = m.achieved ? '✓' : '○';
    const col = m.achieved ? 'var(--good)' : 'var(--faint)';
    const note = String(m.note || '').replace('🎉','').trim();
    html += '<div style="display:flex;gap:11px;align-items:baseline;font-size:14px"><span style="color:' + col + ';font-weight:700;flex:0 0 auto">' + mark + '</span><span style="' + (m.achieved ? '' : 'color:var(--soft)') + '"><strong>' + esc(m.label) + '</strong>' + (note ? ' — ' + esc(note) : '') + '</span></div>';
  }
  html += '</div>';
  wrap.innerHTML = html;
  host.appendChild(wrap);
}

function planCard(c){
  if(!c || !c.edition_name) return;
  const host = document.getElementById('main') || document.body;
  const card = document.createElement('div');
  card.style.cssText = 'max-width:860px;margin:26px auto 40px;padding:16px 20px;border:1px solid var(--accent-soft);border-radius:14px;background:var(--card);font-size:14px;color:var(--soft)';
  const own = document.createElement('div');
  own.innerHTML = '<strong>Your plan: ' + esc(c.edition_name) + '.</strong> Everything you see here is included.';
  card.appendChild(own);
  if(c.upsell && c.upsell.name){
    const up = document.createElement('div');
    up.style.marginTop = '8px';
    const gains = (c.upsell.gains||[]).map(g => esc(String(g).replace(/_/g,' '))).join(', ');
    up.innerHTML = esc(c.upsell.name) + (c.upsell.monthly ? ' (from $' + c.upsell.monthly + '/mo)' : '') +
      (gains ? ' adds: ' + gains + '.' : '.') +
      ' <a href="mailto:eric@davisdigitalstudio.com?subject=' + encodeURIComponent('Upgrading to ' + c.upsell.name) + '" style="color:var(--accent)">Ask about upgrading →</a>';
    card.appendChild(up);
  }
  host.appendChild(card);
}
</script>
</body>
</html>
