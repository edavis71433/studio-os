<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today — Studio OS</title>
<meta name="description" content="What needs you today — at most a few calm things, in plain words.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* C5 — page skin = the shell's --dds-* tokens. shell.css is the canonical
     palette and carries the full four-block theme contract (light base ·
     prefers-color-scheme dark · data-theme="light" · data-theme="dark"), so
     this page follows every mode automatically — same aliasing pattern as
     analytics.html / pipeline.html / crm.html. Fallbacks only cover a missing
     shell.css. */
  :root{
    --bg:var(--dds-bg,#faf8f5); --card:var(--dds-card,#fff); --ink:var(--dds-ink,#1b1525); --soft:var(--dds-soft,#6b6478); --faint:var(--dds-faint,#6f677d); --line:var(--dds-line,#eee9e0);
    --accent:var(--dds-accent,#5b3fa0); --accent-soft:var(--dds-accent-soft,#efeafa); --good:var(--dds-good,#33664b); --good-soft:var(--dds-good-soft,#e7f1ea);
    --warn:var(--dds-warn,#775d31); --warn-soft:var(--dds-warn-soft,#f3ead9); --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.05));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--dds-w-focus,760px);margin:0 auto;padding:48px 22px 96px}
  header .eyebrow{font-size:12.5px;color:var(--soft);font-weight:500}
  header h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.12;margin:.35em 0 .1em;text-wrap:balance}
  header .sub{color:var(--soft);font-size:15.5px;margin:0}
  .stack{display:flex;flex-direction:column;gap:16px;margin-top:34px}
  .moment{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:22px 22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  /* visual refresh: no accent stripe — the row's icon tile carries the tone */
  .moment::before{display:none}
  .moment h2{font-family:var(--sans);font-weight:600;font-size:20px;margin:0 0 6px;line-height:1.2;text-wrap:balance}
  .moment p{margin:0;color:var(--soft);font-size:15px}
  .row{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;border-radius:var(--dds-r,8px);border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 15px;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover{background:var(--accent-soft);border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.05)}
  button.ghost{border-color:transparent;color:var(--soft);padding-left:6px;padding-right:6px}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .answer{margin-top:14px;padding:14px 16px;background:var(--accent-soft);border-radius:var(--dds-r-lg,10px);font-size:14.5px;white-space:pre-wrap;color:var(--ink)}
  /* a11y: live regions stay in the accessibility tree from first render (never
     display:none) so the FIRST answer is announced; empty = zero-height/invisible */
  .answer:empty{padding:0;margin:0;background:transparent}
  /* benchmark 7: what the answer drew on — chips, then an honest line when it's judgment */
  .answer .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;white-space:normal}
  .answer .srcs .lbl{font-size:12px;color:var(--soft);align-self:center}
  .answer .src{font-size:12px;color:var(--soft);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;line-height:18px}
  .answer .lowc{margin-top:8px;font-size:12.5px;color:var(--soft);white-space:normal}
  .tag{display:inline-block;font-size:12px;color:var(--soft);font-weight:500;margin-bottom:8px;text-transform:capitalize}
  .calm{background:var(--good-soft);border-color:transparent}
  .calm h2{color:var(--good)}
  a.moment.todo{display:block;text-decoration:none;color:inherit}
  a.moment.todo:hover{border-color:var(--accent)}
  .golink{color:var(--accent);font-weight:600;font-size:14px}
  .features{margin-top:40px;padding-top:26px;border-top:1px solid var(--line)}
  .features .lead{font-size:13px;color:var(--soft);margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
  /* "More about your business" — secondary context, collapsed by default so Today
     opens on what needs the owner. Native <details> keeps it keyboard-accessible. */
  details.more{margin-top:40px;border-top:1px solid var(--line);padding-top:6px}
  details.more>summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--soft);padding:12px 2px;display:flex;align-items:center;gap:9px}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--faint);font-size:16px}
  details.more[open]>summary::before{transform:rotate(90deg)}
  details.more>summary:hover{color:var(--accent)}
  details.more>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){details.more>summary::before{transition:none}}
  .ask{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
  .ask h3{font-family:var(--sans);font-weight:600;font-size:19px;margin:0 0 4px}
  .ask p{margin:0 0 14px;color:var(--soft);font-size:14px}
  .askbox{display:flex;gap:10px}
  .askbox input{flex:1;font-family:inherit;font-size:15px;padding:12px 15px;border-radius:var(--dds-r-lg,10px);border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .askbox input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .muted{color:var(--soft);font-size:14px}
  .center{text-align:center;padding:56px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  a.link{color:var(--accent);text-decoration:none;font-weight:500}
  a.link:hover{text-decoration:underline}
  .appnav{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 26px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .appnav a{font-size:13.5px;color:var(--soft);text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:500;white-space:nowrap}
  .appnav a:hover{background:var(--accent-soft);color:var(--accent)}
  .appnav a[aria-current="page"]{background:var(--accent);color:#fff}
  .appnav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  /* ── slice 10: the Lightning Home layout (Salesforce Home anatomy, dds skin) ──
     Two regions ≥980px: the main assistant column (Needs-you feed · moments ·
     Today's schedule · the Concierge) and a rail (This month · Recent records ·
     Waiting on clients). Below 980px everything stacks, main first. */
  @media (min-width:980px){.wrap{max-width:var(--dds-w-app,1280px)}}
  .cols{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:30px;align-items:start}
  @media (min-width:980px){.cols{grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:26px}}
  /* every rail card degraded away → no aside, main owns the full row */
  .cols.norail{grid-template-columns:minmax(0,1fr)}
  .colmain{min-width:0;display:flex;flex-direction:column;gap:18px}
  .colrail{min-width:0;display:flex;flex-direction:column;gap:16px}
  .seclab{font-size:12px;color:var(--faint);font-weight:500;margin:0 0 9px}
  section.home-sec{margin:0}
  /* the Needs-you feed: one card, one row per item. Each row KEEPS the
     .moment.todo identity (attention math + responsive pins), restyled from a
     standalone card into an action-feed row: icon · headline+meta · one CTA.
     A notice row is a CONTAINER, not a link: the <a> covers headline+meta and
     the "Done" <button> is its SIBLING — a button may never nest inside an
     anchor (invalid HTML, and assistive tech can't reach the inner control). */
  .feedcard{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);overflow:hidden}
  .feedcard .moment.todo{display:flex;align-items:center;gap:14px;background:transparent;border:0;border-radius:0;box-shadow:none;padding:14px 18px;border-top:1px solid var(--line);overflow:visible}
  .feedcard .moment.todo:first-child{border-top:0}
  .feedcard .moment.todo::before{display:none}
  .feedcard .moment.todo:hover{background:var(--accent-soft)}
  .feedcard .moment.todo:focus-visible,.feedcard .frow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .feedcard .frow{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0;color:inherit;text-decoration:none}
  .si{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.18em;flex:0 0 auto}
  .fico{flex:0 0 auto;width:36px;height:36px;border-radius:var(--dds-r,8px);background:var(--warn-soft);display:grid;place-items:center;font-size:16px}
  .fico.ap{background:var(--accent-soft)}
  .fmain{flex:1 1 auto;min-width:0}
  .fhead{display:block;font-weight:600;font-size:14.5px;color:var(--ink);line-height:1.35;margin:0}
  .fmeta{display:block;font-size:12.5px;color:var(--soft);margin-top:1px}
  .fcta{flex:0 0 auto;font-size:12.5px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:var(--dds-r,8px);padding:6px 13px;white-space:nowrap}
  /* Oct 2026 experience review: the FIRST thing that needs you wears the page's one filled button */
  .feedcard > .moment:first-child .fcta{background:var(--accent);color:#fff}
  /* the manual "Done" — quiet by design: the row usually clears itself, this is
     only for the residue. Never shown on money or legal obligations. */
  .fdone{flex:0 0 auto;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--soft);background:transparent;border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:6px 13px;white-space:nowrap;cursor:pointer}
  .fdone:hover{color:var(--ink);border-color:var(--soft)}
  .fdone:disabled{opacity:.5;cursor:default}
  @media (max-width:600px){.feedcard .moment.todo{flex-wrap:wrap}.feedcard .frow{flex-wrap:wrap}.fcta{margin-left:50px}}
  .moment.calm.slim{padding:16px 18px}
  .moment.calm.slim h2{font-size:17px;margin-bottom:2px}
  .moment.calm.slim p{font-size:13.5px}
  /* rail + schedule cards */
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);padding:16px 18px}
  .rcard .rh{font-size:12px;color:var(--faint);font-weight:500;margin:0 0 12px}
  .mtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .mtile .n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2}
  .mtile .l{font-size:11.5px;color:var(--faint);line-height:1.35;margin-top:1px}
  .trend{margin:12px 0 0;font-size:12.5px;color:var(--soft)}
  .rfoot{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:13px}
  .rrows a{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:500}
  .rrows a:first-child{border-top:0}
  .rrows a:hover{color:var(--accent)}
  .rrows a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  .rrows .rn{flex:0 0 auto;font-size:12px;color:var(--soft);font-weight:400;white-space:nowrap}
  /* non-link rail rows (recent wins carry no drill-in id — no fake link) */
  .rrows .rr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);font-size:13.5px;font-weight:500}
  .rrows .rr:first-child{border-top:0}
  .schedrow{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .schedrow:first-child{border-top:0;padding-top:2px}
  .schedrow .st{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);font-size:13px;min-width:64px}
  .schedrow .sm{flex:1 1 auto;min-width:0;color:var(--ink)}
  .schedrow .sm .who{color:var(--soft)}
  .schip{flex:0 0 auto;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;background:var(--warn-soft);color:var(--warn);text-transform:capitalize}
  .schedempty{margin:0;color:var(--soft);font-size:13.5px}
  /* ── the studio home (2026-10 mockup): money band · stat strip · This week ·
     Coming up · Customers. Same language as the refresh — hairline borders,
     8px corners, one icon tile per fact, sentence case, no shadows. ── */
  .alert{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-top:22px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);background:var(--warn-soft);border-radius:var(--dds-r-lg,10px);flex-wrap:wrap}
  .alert .ico{width:28px;height:28px;border-radius:7px;background:var(--card);color:var(--warn);display:grid;place-items:center;flex:0 0 auto}
  .alert .ico svg,.hl .ico svg{stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .alert .ico svg{width:15px;height:15px}
  .alert .t{flex:1 1 300px;font-size:13.5px;color:var(--ink)} .alert .t b{font-weight:600}
  .aacts{display:flex;gap:6px;flex-wrap:wrap}
  /* Oct 2026 benchmark (item 2): the four money buckets under the band's line —
     Paid green · Processing blue · Upcoming neutral · Overdue red, the same
     families crm.html's .schip and client.html's .fst use. */
  .mbuckets{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:5px;font-size:12.5px;color:var(--soft)}
  .mbuckets .mb b{font-weight:600;color:var(--ink)} .mbuckets .mb i{font-style:normal;color:var(--faint)}
  .mbuckets .mb.good b{color:var(--good)} .mbuckets .mb.bad b{color:var(--dds-bad,#c43c3c)} .mbuckets .mb.info b{color:var(--dds-info,#2a6fb5)}
  .abtn{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:var(--dds-r,8px);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap}
  .abtn:hover{border-color:var(--dds-line-strong,#d2d2db)}
  .abtn.ghost{border-color:transparent;background:transparent;color:var(--soft)} .abtn.ghost:hover{color:var(--ink);background:var(--card)}
  .abtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* the stat strip — crm.html's .hl-panel anatomy (icon tile · label · value · sub);
     a 1px line-coloured gap draws the hairlines however the tiles wrap */
  .hl-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;margin-top:18px;border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);background:var(--line);overflow:hidden}
  .hl{display:flex;align-items:center;gap:12px;padding:13px 16px;min-width:0;background:var(--card);color:inherit;text-decoration:none}
  .hl:hover{background:var(--bg)}
  .hl:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .hl .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:var(--accent-soft);color:var(--accent)}
  .hl .ico.good{background:var(--good-soft);color:var(--good)} .hl .ico.warn{background:var(--warn-soft);color:var(--warn)} .hl .ico.info{background:var(--dds-info-soft,#e8f1fb);color:var(--dds-info,#2a6fb5)}
  .hl .ico svg{width:17px;height:17px}
  .hl-main{min-width:0;flex:1}
  .hl-k{font-size:12px;color:var(--faint);font-weight:500}
  .hl-v{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.2;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hl-s{font-size:12px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* phones: a 2-column grid of compact tiles, so the first screen is not three
     numbers and Needs you sits above the fold (experience review #5) */
  @media (max-width:600px){
    .hl-panel{grid-template-columns:1fr 1fr;gap:0;background:var(--card)}   /* hairlines by border, so an odd tile count leaves no blank cell */
    .hl{gap:9px;padding:10px 12px;border-left:1px solid var(--line)}
    .hl:nth-child(odd){border-left:none}
    .hl:nth-child(n+3){border-top:1px solid var(--line)}
    .hl .ico{width:28px;height:28px;border-radius:7px}
    .hl .ico svg{width:14px;height:14px}
    .hl-k,.hl-s{font-size:11.5px}
    .hl-v{font-size:16px}
  }
  /* section label + a quiet right-hand link */
  .sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .seclink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:500;white-space:nowrap}
  .seclink:hover{text-decoration:underline}
  /* This week — to-do rows: a box, the step, the deal + when, one Done */
  .rcard.list{padding:0;overflow:hidden}
  .trow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
  .trow:first-child{border-top:0}
  .trow:hover{background:var(--accent-soft)}
  .trow .frow{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0;color:inherit;text-decoration:none}
  .trow .frow:focus-visible,.mrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tdot{width:16px;height:16px;border:1.5px solid var(--dds-line-strong,#c9c9d2);border-radius:4px;flex:0 0 auto;background:var(--card)}
  .trow.late .fmeta{color:var(--warn)}
  .quiet{margin:0;padding:9px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--soft);background:var(--bg)}
  /* Coming up — dated rows: month + day block, the thing, one CTA */
  .mrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
  .mrow:first-child{border-top:0}
  .mrow:hover{background:var(--accent-soft)}
  .md{width:42px;text-align:center;font-size:11px;color:var(--faint);line-height:1.15;flex:0 0 auto}
  .md b{display:block;font-size:15px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  @media (max-width:600px){.trow,.mrow{flex-wrap:wrap}.trow .fdone,.mrow .fcta{margin-left:28px}}
  /* Customers — avatar · name · status, in the rail */
  .crows a{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13.5px}
  .crows a:first-child{border-top:0}
  .crows a:hover .cn{color:var(--accent)}
  .crows a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  .cav{width:26px;height:26px;border-radius:50%;background:var(--good-soft);color:var(--good);font-size:10.5px;font-weight:600;display:grid;place-items:center;flex:0 0 auto}
  .cmain{min-width:0;display:flex;flex-direction:column}
  .cn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cs{font-size:12px;color:var(--faint)}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Your business</div>
    <h1 id="greeting">Today</h1>
    <p class="sub" id="sub">A calm look at what — if anything — needs you.</p>
  </header>
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
</div>
<!-- PT-5: one-time contextual tip, taught where it's relevant, then gone forever -->
<div class="dds-hint" data-hint="today-bell" hidden>The 🔔 at the top shows everything that needs you — from any page in Studio&nbsp;OS.</div>

<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
// ── consumes the EXISTING platform only: /moments, /concierge/ask, /marketplace/features,
//    /portal/context|feed, /analytics/dashboard, /bookings/appointments, /projects,
//    /sales/summary|receivables|deals, /studio/customers.

// Today's bookings from GET /bookings/appointments — each row is judged against
// "today" in ITS OWN site timezone (slot_start_local is stamped in the studio's
// zone; an agency operator drilled into a client may sit on a different calendar
// date entirely). Missing/invalid timezone falls back to the browser-local date.
// Active statuses only.
function siteYmd(tz,nowMs){if(tz){try{return new Intl.DateTimeFormat('en-CA',{timeZone:String(tz)}).format(new Date(nowMs==null?Date.now():nowMs));}catch(_){/* unknown zone → browser-local */}}return localYmd(nowMs);}
function todaySlots(list,nowMs){return(Array.isArray(list)?list:[]).filter(a=>a&&String(a.slot_start_local||'').slice(0,10)===siteYmd(a.timezone,nowMs)&&(a.status==='pending'||a.status==='confirmed')).sort((a,b)=>String(a.slot_start_local).localeCompare(String(b.slot_start_local))).slice(0,6);}
function slotTime(s){const m=/T(\d\d):(\d\d)/.exec(String(s||''));if(!m)return'';let h=+m[1];const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+m[2]+' '+ap;}
function localYmd(nowMs){const d=new Date(nowMs==null?Date.now():nowMs);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

// ── the studio home (2026-10 mockup) pure helpers — mirrored 1:1 in
//    tests/presence/today_home_test.mjs ─────────────────────────────────────
// Whole days from one calendar date to another (YYYY-MM-DD both); null on junk.
function daysBetween(fromYmd,toYmd){const a=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(fromYmd||'')),b=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(toYmd||''));if(!a||!b)return null;return Math.round((Date.UTC(+b[1],+b[2]-1,+b[3])-Date.UTC(+a[1],+a[2]-1,+a[3]))/864e5);}
function ymdParts(ymd){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd||''));return m?{mon:new Date(Date.UTC(+m[1],+m[2]-1,+m[3],12)).toLocaleDateString('en-US',{month:'short',timeZone:'UTC'}),day:String(+m[3]),wd:new Date(Date.UTC(+m[1],+m[2]-1,+m[3],12)).toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'})}:null;}
// When a dated to-do is due, in words: Overdue · Today · Tomorrow · a weekday
// inside the coming week · a short date beyond it. No date → says so.
function dueLabel(ymd,nowMs){const d=daysBetween(localYmd(nowMs),ymd);const p=ymdParts(ymd);if(d==null||!p)return'No date set';if(d<0)return'Overdue · '+p.mon+' '+p.day;if(d===0)return'Today';if(d===1)return'Tomorrow';if(d<7)return p.wd;return p.mon+' '+p.day;}
// The stat strip — one tile per HONEST read. `s` is GET /sales/summary's data
// (null when that read failed or 403'd → its three tiles drop); `enquiries` is
// the feed's per-lead array (absent on a failed feed or an older build → no
// tile). A successful read's zero is real and shows ("Pipeline is clear").
function statTiles(s,enquiries){
  const t=[];const plur=(n,w)=>n+' '+w+(n===1?'':'s');
  if(s&&typeof s==='object'){
    const ar=s.ar;
    if(ar&&typeof ar.outstanding_cents==='number'){const n=Number(ar.count)||0,od=Number(ar.overdue_count)||0,pc=Number(ar.processing_cents)||0;const proc=pc?money(pc)+' processing':'';t.push({id:'stat-owed',k:'Outstanding',v:money(ar.outstanding_cents),s:n?plur(n,'invoice')+(od?' · '+od+' overdue':'')+(proc?' · '+proc:''):(proc||'All paid up'),ico:'owed',tone:ar.outstanding_cents>0?'warn':(pc?'info':''),href:'/pipeline.html'});}
    if(s.won_month&&typeof s.won_month.value_cents==='number'){const n=Number(s.won_month.count)||0;t.push({id:'stat-won',k:'Won this month',v:money(s.won_month.value_cents),s:n?plur(n,'deal'):'Nothing closed yet',ico:'won',tone:'good',href:'/pipeline.html'});}
    if(s.open&&typeof s.open.count==='number'){const n=s.open.count;t.push({id:'stat-open',k:'Open deals',v:String(n),s:n?money(s.open.value_cents)+' in play':'Pipeline is clear',ico:'open',tone:'',href:'/pipeline.html'});}
  }
  if(Array.isArray(enquiries)){const n=enquiries.length;t.push({id:'stat-enq',k:'New enquiries',v:String(n),s:n?'Waiting for a reply':'Nothing new',ico:'mail',tone:'info',href:'/inbox.html#enquiries'});}
  return t;
}
// "This week" — the one next step on each OPEN deal (the same four-stage
// allowlist Key deals uses), kept when it is undated, overdue, or due inside the
// next seven days. Dated rows first (soonest first), undated last; capped at six.
const OPEN_STAGES=['lead','qualified','proposal','contract'];
function weekTodos(list,nowMs){
  const out=(Array.isArray(list)?list:[]).filter(d=>d&&d.id&&OPEN_STAGES.indexOf(d.stage)>=0&&String(d.next_step||'').trim())
    .map(d=>({id:String(d.id),title:String(d.next_step).trim(),deal:d.title||'',at:d.next_step_at||null,days:daysBetween(localYmd(nowMs),d.next_step_at)}))
    .filter(r=>r.days==null||r.days<7);
  out.sort((a,b)=>(a.days==null?1:0)-(b.days==null?1:0)||(a.days||0)-(b.days||0)||String(a.deal).localeCompare(String(b.deal)));
  return out.slice(0,6);
}
// "Coming up" — the calendar: bookings after today (the next 30 days, active
// statuses, each judged in ITS site's timezone like the schedule) and deal next
// steps dated beyond this week. Soonest first, capped at six.
function comingUp(deals,appts,nowMs){
  const out=[];
  for(const a of (Array.isArray(appts)?appts:[])){
    if(!a||!(a.status==='pending'||a.status==='confirmed'))continue;
    const ymd=String(a.slot_start_local||'').slice(0,10);const days=daysBetween(siteYmd(a.timezone,nowMs),ymd);
    if(days==null||days<1||days>30)continue;
    out.push({kind:'booking',ymd,days,title:(a.type_name||'Appointment')+(a.customer_name?' · '+a.customer_name:''),sub:slotTime(a.slot_start_local)+(a.status==='pending'?' · to confirm':''),href:'/presence.html#bookings'});
  }
  for(const d of (Array.isArray(deals)?deals:[])){
    if(!d||!d.id||OPEN_STAGES.indexOf(d.stage)<0||!String(d.next_step||'').trim())continue;
    const days=daysBetween(localYmd(nowMs),d.next_step_at);
    if(days==null||days<7)continue;
    out.push({kind:'next_step',ymd:String(d.next_step_at).slice(0,10),days,title:String(d.next_step).trim(),sub:(d.title?d.title+' · ':'')+'next step on the deal',href:'/crm.html?deal='+encodeURIComponent(d.id)});
  }
  out.sort((a,b)=>a.days-b.days||a.title.localeCompare(b.title));
  return out.slice(0,6);
}

// ── the money band — GET /sales/receivables (open invoices with their deal).
// One line when something is due; NOTHING on an empty list or a failed read
// (failure ≠ empty: a 5xx must never paint "nothing is due"). Resend opens the
// deal's billing tab, where the invoice's own Resend lives. ──
// ── Oct 2026 benchmark (item 2): money in four states — ONE formula. A VERBATIM
// mirror of supabase/functions/presence/lib/money_state.ts (the Deno pin runs
// one case table against the module and every page's copy). Today runs it
// against the studio's LOCAL day, exactly as crm.html does, so the band and
// the record never disagree about the same invoice. ──
function moneyState(i,todayYmd,pending){
  if(!i)return'';
  const s=String(i.status||'open');
  if(s==='paid')return'paid';
  if(s==='void'||s==='canceled')return'';
  if(i.processing_since||(pending&&pending.indexOf(String(i.id))>=0))return'processing';
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(i.due_date||''));
  return(m&&todayYmd&&m[0]<String(todayYmd))?'overdue':'upcoming';
}
const MONEY_WORD={paid:'Paid',processing:'Processing',upcoming:'Upcoming',overdue:'Overdue'};
const MONEY_TONE={paid:'good',processing:'info',upcoming:'',overdue:'bad'};
function moneyBuckets(list,todayYmd,pending){
  const b={paid:{count:0,cents:0},processing:{count:0,cents:0},upcoming:{count:0,cents:0},overdue:{count:0,cents:0}};
  for(const i of(Array.isArray(list)?list:[])){const st=moneyState(i,todayYmd,pending);if(!st)continue;const c=typeof i.amount_cents==='number'?i.amount_cents:Math.round((Number(i.amount)||0)*100);b[st].count++;b[st].cents+=c;}
  return b;
}
function alertBandHtml(rcv){

  // what still WAITS on a client (upcoming + overdue) vs what is on its way
  const due=items.filter(i=>st(i)==='upcoming'||st(i)==='overdue');
  const proc=items.filter(i=>st(i)==='processing');
  // the Paid bucket rides along only when the read carried it (an older function
  // build ships no `paid` — the bucket is omitted, never a fake $0)
  const paidRows=(rcv&&Array.isArray(rcv.paid))?rcv.paid.filter(i=>i&&i.id):null;
  const b=moneyBuckets(items.concat(paidRows||[]),today);

    text=`<b>${esc(money(i.amount_cents))} is ${over?'overdue':'due now'}</b> — ${i.deal?esc(i.deal)+'’s invoice':'An invoice'}${i.title?` “${esc(i.title)}”`:''}${over&&p?` was due ${esc(p.mon+' '+p.day)} and`:''} hasn’t been paid yet.`;

    acts=`<a class="abtn" href="${esc(scopeHref('/pipeline.html'))}">Who owes you</a>`;

  return `<div class="alert" id="money-due"><span class="ico" aria-hidden="true">${svg('owed')}</span><div class="t">${text}<div class="mbuckets" aria-label="Money by state">${buckets}</div></div><div class="aacts">${acts}</div></div>`;

}

// "Today's schedule" — real bookings or an honest line. 'dormant' means the
// route answered 404/403 (bookings aren't in play on this site — no card at

function scheduleHtml(list){

// "Waiting on clients" — approvals the studio has sent that clients haven't
// decided. Same source the Projects roster uses: GET /projects + each active
// project's /report (summary.pending_approvals), capped like ensureSnaps.
// Hidden entirely when there are none, or when this edition has no projects.
// D6 mitigation: ONE shared in-page cache for per-project report reads. Every
// consumer on this page funnels through projectReport(), so the same project's
// report is fetched at most once per page view (the fan-out can't multiply).
// Collapses onto the D6 batch endpoint when that backend lands — no backend
// change here. A failed read resolves null (that row simply drops).
const REPORTS=new Map();
function projectReport(id){
  if(!REPORTS.has(id))REPORTS.set(id,apiGet('/projects/'+id+'/report').then(r=>r&&r.data).catch(()=>null));
  return REPORTS.get(id);
}
async function waitingCard(){
  let projects=null;
  try{projects=(await apiGet('/projects')).data;}catch(_){return;}
  if(!Array.isArray(projects))return;
  const act=projects.filter(p=>p&&p.id&&p.status!=='complete'&&p.status!=='archived').slice(0,6);
  if(!act.length)return;
  const rows=[];
  await Promise.all(act.map(async(p)=>{
    const r=await projectReport(p.id);
    const n=Number((r&&r.summary&&r.summary.pending_approvals)||0);
    if(n>0)rows.push({id:p.id,name:p.name||'A project',n});
  }));
  if(!rows.length)return;
  rows.sort((a,b)=>b.n-a.n);
  const host=document.getElementById('rail-waiting');if(!host)return;
  host.innerHTML=`<div class="rcard"><h2 class="rh">Waiting on clients</h2><div class="rrows">${rows.map(w=>`<a href="${esc(scopeHref('/projects.html?project='+encodeURIComponent(w.id)))}">${esc(w.name)}<span class="rn">${w.n===1?'1 approval':w.n+' approvals'}</span></a>`).join('')}</div></div>`;
  host.hidden=false;
  // the rail may have rendered empty (norail) — this late card revives it
  const aside=document.getElementById('col-rail');if(aside)aside.hidden=false;
  const cols=document.getElementById('home-cols');if(cols)cols.classList.remove('norail');
}

// ── Needs-you row affordances ────────────────────────────────────────────────
// A real notice row carries a database uuid; the four SYNTHETIC rows the feed
// computes live (new-enquiries, client-feedback, missing-required, bridge-updates)
// carry a slug instead. Only a real row can be dismissed — a Done on a synthetic
// one would 200 with no effect and be back on the next refresh.
const NOTICE_ID_RE = /^[0-9a-f-]{36}$/;
// Kinds that are pure good news: they report, they don't ask. They get an
// acknowledging affordance, never an imperative CTA.
const NOTICE_FYI_KINDS = ['invoice_paid'];

// ── one icon set (Oct 2026 experience review): the shell's 2px-stroke SVGs, never an emoji as a control's icon ──
const SI={mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',message:'<path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.5-4.5A8 8 0 1 1 21 12z"/>',heart:'<path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 18h.01"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',thumbsup:'<path d="M7 11v10H3V11z"/><path d="M7 11l4-8a2.5 2.5 0 0 1 2.5 2.5V9h5a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.3 20H7"/>',inbox:'<path d="M3 13l2-8h14l2 8v6H3z"/><path d="M3 13h5l1.5 3h5L16 13h5"/>'};
const si=(k)=>`<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${SI[k]||SI.dot}</svg>`;
function render(moments, features, feed, ctx, dash, appts, deals, summary, rcv, customers, example){
  $('greeting').textContent = greet();
  // Phase 4 (onboarding cleanup): one card per thing — the same nudge raised
  // three times (three "Walk me through it" cards about one publish step)
  // collapses to the first; later duplicates are dropped by headline.
  const seenHead = new Set();
  const items = (moments||[]).filter(Boolean).filter((m) => { const k = String(m.headline||'').trim().toLowerCase(); if (!k) return true; if (seenHead.has(k)) return false; seenHead.add(k); return true; });
  // PP-5: the empty-state speaks in the language of what this edition actually is.
  const edFeats = (ctx && ctx.edition_features) || null;
  const hasWebsite = !edFeats || edFeats.indexOf('website') >= 0;
  // ── needs you now: the SAME items the top-bar bell counts (notices + pending
  //    approvals) so the home page and the bell tell one story — each taps
  //    straight through to the page that resolves it. ──────────────────────────
  const notices = ((feed && feed.notices) || []).filter((n) => !repliedLocally(n));
  const approvals = (feed && feed.pending_approvals) || [];
  const shown = notices.length + approvals.length;   // needs-you rows we render inline
  // FIX 3: Today and the bell must never disagree on the number. The bell badge is
  // ctx.attention_count, which also counts support requests + unread client messages
  // that have no feed card. Source the subtitle count from it so they always match;
  // when nothing is renderable inline but the bell still rings, a single calm line
  // routes to the Inbox (the full list) rather than a misleading "all clear".
  const bellCount = (ctx && typeof ctx.attention_count === 'number') ? ctx.attention_count : shown;
  const needs = Math.max(shown, bellCount);
  // header sub: the date, then what — if anything — needs you (Lightning Home greeting)
  const subBits = [dateLine()];
  if(needs) subBits.push(needs === 1 ? 'one thing needs you' : `${needs} things need you`);
  if(items.length) subBits.push(items.length === 1 ? 'one more worth a look' : `${items.length} more worth a look`);
  if(!needs && !items.length) subBits.push('nothing needs you today');
  $('sub').textContent = subBits.join(' · ') + '.';

  // ── the Needs-you action feed: one card, one row per item (icon · headline +
  //    meta · one CTA). Rows keep the .moment.todo identity — the attention
  //    math (cards === bell badge) is pinned on that class. ──
  const NICON = { lead_followup:si('mail'), message:si('message'), support:si('message'), invoice_paid:si('heart'), invoice_void_paid:si('alert') };   // 0119: money on a WITHDRAWN invoice is not the green tick
  let feedRows = '';
  for(const n of notices){
    // Most rows now tear themselves down when the work is done. What's left gets
    // ONE "Done" — but only when it is a REAL server row we can dismiss, and only
    // when the feed says this obligation may be cleared by hand at all.
    //   • the UUID guard: four synthetic rows (new-enquiries, client-feedback,
    //     missing-required, bridge-updates) are computed live and have no row to
    //     dismiss — a Done there would 200 and reappear on the next refresh.
    //   • dismissible: money and legal obligations (an unpaid invoice, a failed
    //     payment, a lapsed account, a pending deletion, a site that's down, a
    //     failed publish) are refused here AND at the route. They clear when the
    //     thing is genuinely resolved, never by a click.
    const canDone = NOTICE_ID_RE.test(String(n.id||'')) && n.dismissible !== false;
    // Good news with nothing to do doesn't get an imperative — "Got it", not
    // "Take care of it →".
    const fyi = NOTICE_FYI_KINDS.indexOf(n.kind) >= 0;
    const label = fyi ? 'Got it' : 'Done';
    feedRows += `<div class="moment attn todo">
      <a class="frow" href="${esc(scopeHref(n.href||'/today.html'))}">
      <span class="fico" aria-hidden="true">${NICON[n.kind]||si('bell')}</span>
      <div class="fmain"><h3 class="fhead">${esc(n.headline||'Something needs a look')}</h3>${n.body?`<span class="fmeta">${esc(n.body)}</span>`:''}</div>
      ${canDone && fyi ? '' : `<span class="fcta">${fyi?'Got it':'Take care of it →'}</span>`}</a>${
      canDone ? `<button type="button" class="fdone" data-dismiss-notice="${esc(n.id)}" aria-label="${esc(label+' — '+(n.headline||'this item'))}">${label}</button>` : ''}</div>`;
  }
  for(const p of approvals){
    const _base = p.href ? p.href : p.kind==='connected' ? '/connections.html' : '/presence.html#foundations';
    feedRows += `<a class="moment attn todo" href="${esc(scopeHref(_base))}">
      <span class="fico ap" aria-hidden="true">${si('thumbsup')}</span>
      <div class="fmain"><h3 class="fhead">${esc(p.title||'A change is ready')}</h3><span class="fmeta">Waiting for your approval${p.summary?` · ${esc(p.summary)}`:''}</span></div>
      <span class="fcta">Review &amp; approve →</span></a>`;
  }
  // FIX 3: the bell counts things with no inline row here (client messages, support
  // requests). If there's nothing to render but the bell still rings, don't fall
  // through to "all clear" — point to the Inbox where those items actually live.
  if(shown === 0 && bellCount > 0){
    feedRows += `<a class="moment attn todo" href="${esc(scopeHref('/inbox.html'))}">
      <span class="fico" aria-hidden="true">${si('inbox')}</span>
      <div class="fmain"><h3 class="fhead">${bellCount === 1 ? 'One thing needs you' : `${bellCount} things need you`}</h3><span class="fmeta">Messages, approvals and updates that are waiting on you — all in one place.</span></div>
      <span class="fcta">Open your Inbox →</span></a>`;
  }

  let main = '';
  main += exampleCardHtml(example);   // benchmark 12: the trial's example rows, with the one way to remove them
  if(feedRows) main += `<section class="home-sec" id="needs-you"><h2 class="seclab">Needs you</h2><div class="feedcard">${feedRows}</div></section>`;

  if(!items.length && !needs){
    const clearBody = hasWebsite
      ? 'Everything we watch on your website looks good, and there’s nothing waiting on you today. If something ever deserves a look, it’ll appear here first — calmly, and only then.'
      : 'Everything across your business is quiet, and there’s nothing waiting on you today. If something ever deserves a look, it’ll appear here first — calmly, and only then.';
    const _lnk = (href, label) => `<a class="link" href="${scopeHref(href)}">${label}</a>`;
    const _sep = ' <span style="color:var(--soft)">·</span> ';
    const clearLinks = (hasWebsite
      ? [['/inbox.html','What needs you'],['/presence.html#health','Website health'],['/presence.html','Open your website'],['/presence.html#pages','Your pages'],['/presence.html#history','History'],['/presence.html#schedule','What’s next'],['/analytics.html#insights','Insights'],['/inbox.html#enquiries','Website enquiries']]
      : [['/customers.html','Open Customers'],['/connections.html','Connections']]
    ).map(([h,l]) => _lnk(h,l)).join(_sep);
    main += `<div class="moment calm"><span class="tag">All clear</span>
      <h2>${hasWebsite ? 'Everything we watch looks good.' : 'Everything’s quiet across your business.'}</h2>
      <p>${clearBody}</p>
      <div class="row">${clearLinks}</div></div>`;
  } else if(!items.length){
    // needs exist but nothing more is worth a look — one calm green line, not silence
    main += `<div class="moment calm slim"><h2>Everything else looks good.</h2><p>Beyond the list above, nothing is waiting on you — anything new lands here first.</p></div>`;
  } else {
    let momentsHtml = '';
    for(const m of items){
      const cls = toneClass(m.moment_type || m.tone);
      const celebrate = cls === 'good';
      momentsHtml += `<article class="moment ${cls}">
        ${celebrate ? '<span class="tag">Good news</span>' : ''}
        <h2>${esc(m.headline)}</h2>
        <p>${esc(m.summary)}</p>
        <div class="row">
          ${celebrate ? '' : `<button class="primary" data-explain="${esc(m.id)}">Walk me through it</button>`}
          ${m.dismissable ? `<button class="ghost" data-dismiss="${esc(m.id)}">Not now</button>` : ''}
        </div>
        <div class="answer" id="ans-${esc(m.id)}" aria-live="polite"></div>
      </article>`;
    }
    main += `<section class="home-sec stack" id="worth-a-look" style="margin-top:0;gap:14px">${needs?'<h2 class="seclab" style="margin-bottom:-5px">Worth a look</h2>':''}${momentsHtml}</section>`;
  }

  // Today's schedule — real bookings, a confirmed-clear day, or an honest "couldn't check"
  main += scheduleHtml(appts);
  // This week (the next step on each open deal) · Coming up (bookings after
  // today + next steps dated beyond the week). Both hide when there's nothing.
  main += weekHtml(weekTodos(deals));
  main += comingHtml(comingUp(deals, Array.isArray(appts) ? appts : null));

  // the Concierge — a knowledgeable partner, not a chatbot. Stays in the main
  // column (right under the day) — asking a question is a primary action.
  main += `<div class="ask"><h3>Have a question about your website?</h3>
    <p>Ask in your own words. It only speaks to what’s actually true of your business.</p>
    <div class="askbox"><input id="q" type="text" placeholder="e.g. what should I do first?" aria-label="Ask a question"><button class="ghost" id="askBtn" style="border-color:var(--line);color:var(--ink);padding-left:16px;padding-right:16px">Ask</button></div>
    <div class="answer" id="askAns" aria-live="polite"></div></div>`;

  // ── the rail: This month · Recent records · Waiting on clients. When every
  // rail card degrades away, the aside is dropped (hidden + a single-column
  // grid) so main spans the full width instead of leaving a dead ~30% gutter;
  // a late Waiting-on-clients card revives it (see waitingCard). ──
  const railCards = customersCardHtml(customers) + monthCardHtml(dash) + keyDealsCardHtml(deals) + winsCardHtml(dash) + recentsCardHtml();
  const railEmpty = !railCards;
  const rail = railCards + '<div id="rail-waiting" hidden></div>';
  // Above the columns, full width: the money band (only when something is due)
  // and the stat strip (only the tiles whose read came back honest).
  const top = alertBandHtml(rcv) + statStripHtml(statTiles(summary, feed && feed.enquiries));
  $('main').innerHTML = top + `<div class="cols${railEmpty?' norail':''}" id="home-cols"><div class="colmain" id="col-main">${main}</div><aside class="colrail" id="col-rail" aria-label="At a glance"${railEmpty?' hidden':''}>${rail}</aside></div>`;
  // "what comes with your business" — the Industry Pack, made invisible. Secondary
  // context, so it opens inside the collapsible "More about your business" below.
  const feats = (features && features.features) || [];
  if(feats.length){
    const box = document.createElement('div'); box.className = 'features';
    box.style.cssText = 'margin-top:0;padding-top:0;border-top:none';
    box.innerHTML = `<p class="lead">${esc((features && features.note) || 'These come with your kind of business — nothing to set up.')}</p><div class="chips">${feats.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div>`;
    moreHost().appendChild(box);
  }
  wire();
  // the retired "What's coming next" page (upcoming.html) lands here as #coming-up
  if(location.hash==='#coming-up'){const c=document.getElementById('coming-up');if(c)c.scrollIntoView({block:'start'});}
}

// ── The collapsible "More about your business" — the secondary context (what
// comes with the plan, the health line, the journey strip, the plan card) lives
// here so Today opens focused on what actually needs the owner. Nothing is
// deleted — just de-emphasized. Created lazily, only when something fills it, so
// an otherwise-quiet Today never shows an empty disclosure. ──
function moreHost(){
  let body = document.getElementById('more-body');
  if(body) return body;
  const main = document.getElementById('main') || document.body;
  const d = document.createElement('details'); d.className = 'more'; d.id = 'more-details';
  const sum = document.createElement('summary'); sum.textContent = 'More about your business';
  body = document.createElement('div'); body.id = 'more-body';
  d.appendChild(sum); d.appendChild(body);
  main.appendChild(d);   // always the last block on the page, below the focused area
  return body;
}

// ── Example data on a new trial (benchmark 12) ───────────────────────────────
// A brand-new studio was seeded one example customer, deal and enquiry (named
// "Example: …") so the first session isn't empty rooms. This card says so and
// carries the ONE way to remove them — exactly those rows, through
// POST /commerce/example-data/remove. Two steps, never one click. Hidden when
// the read failed or nothing example-shaped is left.
function exampleCardHtml(ex){
  if(!ex || !ex.present) return '';
  return `<div class="moment" id="example-data"><span class="tag">Example data</span>
    <h2>You’re looking at example data.</h2>
    <p>We added an example customer (Marlow’s Kitchen), a deal in your pipeline and a website enquiry so you can see how the pieces connect. Explore them in Customers, Pipeline and the Inbox — then remove them whenever you like. Nothing else is touched.</p>
    <div class="row" id="example-acts"><button class="ghost" type="button" id="removeExample" data-remove-example>Remove example data</button></div></div>`;
}
function wireExample(){
  const b = $('removeExample'); if(!b) return;
  b.addEventListener('click', () => {
    const acts = $('example-acts'); if(!acts) return;
    acts.innerHTML = `<span style="font-size:13.5px;color:var(--soft)">Remove the example customer, deal and enquiry?</span> <button class="ghost" type="button" id="removeExampleYes">Remove</button><button class="ghost" type="button" id="removeExampleNo">Keep</button>`;
    $('removeExampleYes').focus();
    $('removeExampleNo').addEventListener('click', () => { acts.innerHTML = `<button class="ghost" type="button" id="removeExample" data-remove-example>Remove example data</button>`; wireExample(); $('removeExample').focus(); });
    $('removeExampleYes').addEventListener('click', async (e) => {
      const yes = e.currentTarget; yes.disabled = true; yes.textContent = 'Removing…';
      try{
        await apiPost('/commerce/example-data/remove', {});
        const card = $('example-data'); if(card) card.remove();
        if(window.ddsToast) ddsToast('Example data removed.');
        try{ if(window.ddsBellRefresh) window.ddsBellRefresh(); }catch(_){}
      }catch(_){ yes.disabled = false; yes.textContent = 'Remove'; if(window.ddsToast) ddsToast('Couldn’t remove that just now — nothing changed. Try again in a moment.', 'err'); }
    });
  });
}
function wire(){
  wireExample();
  document.querySelectorAll('[data-explain]').forEach(b => b.addEventListener('click', () => explain(b.getAttribute('data-explain'), b)));
  document.querySelectorAll('[data-dismiss]').forEach(b => b.addEventListener('click', () => dismiss(b.getAttribute('data-dismiss'), b)));
  document.querySelectorAll('[data-dismiss-notice]').forEach(b => b.addEventListener('click', () => dismissNotice(b.getAttribute('data-dismiss-notice'), b)));
  document.querySelectorAll('[data-todo-done]').forEach(b => b.addEventListener('click', () => todoDone(b.getAttribute('data-todo-done'), b)));
  const askBtn = $('askBtn'), q = $('q');
  if(askBtn){ askBtn.addEventListener('click', ask); q.addEventListener('keydown', e => { if(e.key==='Enter') ask(); }); }
}

async function explain(id, btn){
  const box = $('ans-'+id); if(!box) return;
  btn.disabled = true; btn.textContent = 'One moment…';
  try{ const r = await apiPost('/concierge/ask', { question: 'What does this mean, and what should I do about it?', topic_id: id });
    paintAnswer(box, r && r.data, 'Open it when you have a minute — nothing changes until you decide.');
  }catch(_){ box.textContent = 'I couldn’t load the details just now — nothing’s wrong, try again in a moment.'; }
  btn.disabled = false; btn.textContent = 'Walk me through it';
}
async function dismiss(id, btn){
  const card = btn.closest('.moment'); btn.disabled = true;
  try{
    await apiPost('/moments/'+id+'/dismiss', {});
    if(card){
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      if(reduce){ card.remove(); }
      else { card.style.transition='opacity .3s ease, transform .3s ease'; card.style.opacity='0'; card.style.transform='translateY(-6px)'; setTimeout(()=>card.remove(), 300); }
    }
  }
  catch(_){ btn.disabled = false; }
}
// A lead_followup nudge the owner answered in the Inbox a moment ago clears here
// at once (inbox.html leaves a 24-hour marker) — the server retires the notice on
// its next pass (experience review #45).
function repliedLocally(n){
  if(!n||n.kind!=='lead_followup')return false;
  const m=String(n.period||'').match(/^lead:(.+)$/)||String(n.href||'').match(/sel=lead:([^&#\s]+)/);
  if(!m)return false;
  try{const at=(JSON.parse(localStorage.getItem('dds-replied-leads')||'{}')||{})[decodeURIComponent(m[1])];return !!at&&(Date.now()-Number(at))<86400000;}catch(_){return false;}
}
// ── "Done" on a needs-you row ────────────────────────────────────────────────
// The residue: rows whose obligation the owner has genuinely handled somewhere
// this app can't observe. Reuses the EXISTING ownership-scoped dismiss route (no
// new endpoint) — the server re-checks that this particular row may be cleared
// by hand, so a protected one is refused even if the button were ever drawn.
// The row leaves optimistically only AFTER the write succeeds; on failure the
// button comes back rather than lying about what happened.
async function dismissNotice(id, btn){
  const row = btn.closest('.moment'); btn.disabled = true;
  try{
    await apiPost('/commerce/notices/dismiss', { id });
    if(row){
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      if(reduce){ row.remove(); }
      else { row.style.transition='opacity .25s ease'; row.style.opacity='0'; setTimeout(()=>row.remove(), 250); }
    }
  }
  catch(_){ btn.disabled = false; }
}
// ── "Done" on a This-week row ────────────────────────────────────────────────
// Clears the deal's next step through the EXISTING per-deal PATCH (the same
// field crm.html's inline editor saves) — no new endpoint. The row leaves only
// AFTER the write succeeds; on failure the button comes back. An emptied list
// takes its section with it (no empty card).
async function apiSend(path, method, body){ const r = await fetch(FN + path, { method, headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN,'x-dds-scope-site':(new URLSearchParams(location.search).get('client')||'') }, body: JSON.stringify(body||{}) }); return r.ok ? r.json() : Promise.reject(r.status); }
async function todoDone(id, btn){
  const row = btn.closest('.trow'); btn.disabled = true;
  try{
    await apiSend('/sales/deals/'+encodeURIComponent(id), 'PATCH', { next_step: '', next_step_at: '' });
    const sec = row && row.closest('#this-week');
    if(row) row.remove();
    if(sec && !sec.querySelector('.trow')) sec.remove();
    if(window.ddsToast) ddsToast('Done.');
  }
  catch(_){ btn.disabled = false; if(window.ddsToast) ddsToast('Couldn’t save that just now — try again in a moment.', 'err'); }
}
// ── AI shows its sources (benchmark 7): the answer, then chips naming what it
// drew on (the route's source_labels — the moment and the measured evidence,
// never invented here) and, when the route flags it, one honest line that part
// of the answer is judgment. The route returns `answer`; `text` is the older
// key, kept so neither deploy order blanks the box. ──
function paintAnswer(box, d, fallback){
  d = d || {};
  const text = d.answer || d.text || fallback;
  box.textContent = text;
  const labels = Array.isArray(d.source_labels) ? d.source_labels.filter(Boolean).slice(0, 4) : [];
  if(labels.length){
    const s = document.createElement('div'); s.className = 'srcs';
    s.innerHTML = '<span class="lbl">Drew on:</span>' + labels.map(l => `<span class="src">${esc(l)}</span>`).join('');
    box.appendChild(s);
  }
  if(d.low_confidence){ const n = document.createElement('div'); n.className = 'lowc'; n.textContent = 'Part of this is judgment rather than measurement — treat it as a nudge.'; box.appendChild(n); }
}
async function ask(){
  const q = $('q'), box = $('askAns'), btn = $('askBtn');
  const question = (q.value||'').trim(); if(!question) return;
  btn.disabled = true; btn.textContent = '…'; box.textContent = 'Thinking about your presence…';
  try{ const r = await apiPost('/concierge/ask', { question }); paintAnswer(box, r && r.data, 'I don’t have anything measured on that yet — I’d rather say so than guess.'); }
  catch(_){ box.textContent = 'I couldn’t answer just now — nothing’s wrong, please try again in a moment.'; }
  btn.disabled = false; btn.textContent = 'Ask';
}

function signedOut(){
  $('sub').textContent = '';
  $('main').innerHTML = `<div class="center"><h2>Welcome back.</h2>
    <p class="muted">Sign in to see what — if anything — needs you today.</p>
    <p style="margin-top:22px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;
}
function trouble(){
  $('main').innerHTML = `<div class="center"><h2>We couldn’t load your day just now.</h2>
    <p class="muted">Nothing’s wrong on your site — this is only this page.</p>
    <p style="margin-top:18px"><button onclick="location.reload()" class="primary" style="font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 18px;cursor:pointer">Try again</button></p>
    <p style="margin-top:14px"><a class="link" href="/presence.html">Open your workspace →</a></p></div>`;
}

(async function init(){
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    let feedFailed = false;
    const [moments, features, ctx, feed, bridged, dash, appts, deals, summary, rcv, customers, example] = await Promise.all([
      apiGet('/moments').catch(()=>({data:[]})),
      apiGet('/marketplace/features').catch(()=>({data:{features:[]}})),
      (window.ddsContext?window.ddsContext().then((d)=>({data:d})):Promise.reject()).catch(()=>apiGet('/portal/context').catch(()=>null)),   // PERF: reuse the shell's /portal/context (window.ddsContext) — fall back to our own read
      apiGet('/portal/feed').catch(()=>{feedFailed=true;return null;}),
      (new URLSearchParams(location.search).get('client')?Promise.resolve(null):apiGet('/client/projects').catch(()=>null)),   // bridge: work a studio is doing FOR you (never for a drilled-in operator)
      apiGet('/analytics/dashboard').catch(()=>null),        // "This month" — hidden if the route 404s (deploy-order tolerance)
      apiGet('/bookings/appointments').catch((e)=>e===404||e===403?'dormant':null),   // "Today's schedule" — 404/403 = bookings dormant (no card); else an honest couldn't-check line
      apiGet('/sales/deals?limit=100').catch(()=>null),      // "Key deals" (C6) — hidden entirely on empty/403/failure, never an empty card. ?limit=100 (the route's MAX_PAGE): the default page is only the 25 most-recently-UPDATED deals, which could hide a big open deal from the top-5 window
      apiGet('/sales/summary').catch(()=>null),              // the stat strip — its three money tiles drop on a failed/403 read, never fake zeros
      apiGet('/sales/receivables').catch(()=>null),          // the money band — hidden on a failed read (a 5xx must never paint "nothing is due")
      (new URLSearchParams(location.search).get('client')?Promise.resolve(null):apiGet('/studio/customers').catch(()=>null)),   // the Customers card — the studio's own roster, never for a drilled-in operator (D7: the scope header would blank it)
      (new URLSearchParams(location.search).get('client')?Promise.resolve(null):apiGet('/commerce/example-data').catch(()=>null)),   // benchmark 12: are the trial's example rows still here? (never for a drilled-in operator; hidden on a failed/404 read)
    ]);
    const list = Array.isArray(moments?.data) ? moments.data : (moments?.data?.moments || moments?.data || []);
    const apptList = appts==='dormant' ? 'dormant' : ((appts && appts.data && Array.isArray(appts.data.appointments)) ? appts.data.appointments : null);
    render(list, features?.data || {}, feed && feed.data, ctx && ctx.data, dash && dash.data, apptList, deals && deals.data, summary && summary.data, rcv && rcv.data, customers && customers.data, example && example.data);
    // A failed feed must NOT masquerade as "all clear" — say we couldn't check.
    if(feedFailed){ const h=document.getElementById('main'); if(h){ const n=document.createElement('div'); n.style.cssText='margin:0 0 14px;padding:11px 16px;border-radius:12px;background:var(--warn-soft,#f3ead9);color:var(--warn,#775d31);font-size:13.5px'; n.textContent='We couldn’t load what needs you just now — refresh to try again.'; h.insertBefore(n,h.firstChild);} }
    studioProjectCard(bridged && bridged.data);
    orientationCard(ctx && ctx.data);
    planCard(ctx && ctx.data);
    healthLine();
    journeyStrip();
    waitingCard();
  }catch(_){ trouble(); }
})();

// ── Bridge discovery: a converted customer has a studio building FOR them, but
// nothing used to point at that delivery view — they could sign in and never
// find their own project. One calm card, only when a linked project exists. ──
function studioProjectCard(d){
  try{
    // Operators drilled into a client (?client=) see the client's OWN Today —
    // the delivery view belongs to the customer; showing it scoped is confusing.
    if(new URLSearchParams(location.search).get('client')) return;
    const projects = (d && (d.projects || d)) || [];
    if(!Array.isArray(projects) || !projects.length) return;
    const host = document.getElementById('col-main') || document.getElementById('main') || document.body;
    const card = document.createElement('a');
    card.href = '/client.html';
    card.style.cssText = 'display:block;padding:16px 20px;border:1px solid var(--accent-soft,#e5ddf5);border-radius:14px;background:var(--card,#fff);font-size:14px;color:inherit;text-decoration:none';
    const live = projects.find(p=>p.status==='active')||projects[0];
    const name = live && (live.title || live.name) || 'Your project';
    card.innerHTML = '<strong>' + esc(name) + '</strong> — your studio is on it. <span style="color:var(--accent,#5b3fa0);font-weight:600">See progress, files, and anything waiting on you →</span>';
    host.insertBefore(card, host.firstChild ? host.firstChild.nextSibling : null);
  }catch(_){/* never break Today over a nicety */}
}

// ── PP-6: the one-time "welcome to your new plan" orientation. When the edition
// grows (an upgrade added feature areas), name exactly what became available —
// orient, don't market. Fully client-side off the feature list; the first sight
// of any edition orients silently (no false "upgrade" for a brand-new account).
const FEATURE_LABEL = {
  website:'your website workspace', developer:'Developer Mode', forms:'website lead capture',
  business_moments:'your daily updates', connected:'Connections', ai:'AI drafting & the Concierge',
  relationship:'Customers', reports:'Analytics', client_portal:'client sharing',
  managed_service:'managed service', agency:'the agency portfolio', enterprise:'enterprise controls',
};
function orientationCard(c){
  if(!c || !c.edition_features || !c.edition_name) return;
  const KEY='dds-oriented'; let prev=null;
  try{ prev=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(_){}
  const now={ key:c.edition_key, feats:c.edition_features };
  if(!prev || prev.key===now.key){ try{ localStorage.setItem(KEY, JSON.stringify(now)); }catch(_){}
    if(!prev) return;  // first sight → orient silently, never a false upgrade
    return;
  }
  const gained=(now.feats||[]).filter(f=>!(prev.feats||[]).includes(f));
  try{ localStorage.setItem(KEY, JSON.stringify(now)); }catch(_){}
  if(!gained.length) return;  // lateral move / downgrade → nothing to welcome
  const list=gained.map(f=>FEATURE_LABEL[f]||String(f).replace(/_/g,' ')).filter(Boolean);
  const host=document.getElementById('main')||document.body;
  const card=document.createElement('div');
  card.style.cssText='max-width:860px;margin:0 auto 20px;padding:20px 22px;border:1px solid var(--accent);border-radius:16px;background:var(--accent-soft)';
  card.innerHTML=`<div style="font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px">Welcome to ${esc(c.edition_name)}</div>
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:8px">You now have ${list.length===1?'':'a few more things'}${list.length===1?'':':'}</div>
    <p style="margin:0 0 14px;color:var(--soft);font-size:14.5px">${esc(list.join(' · '))}. It’s all here whenever you want it — nothing you need to set up.</p>
    <button class="primary" id="orientDone">Got it</button>`;
  host.insertBefore(card, host.firstChild);
  const b=document.getElementById('orientDone');
  if(b) b.addEventListener('click',()=>{ card.style.transition='opacity .25s'; card.style.opacity='0'; setTimeout(()=>card.remove(),250); });
}

// ── Phase P: "what you own" + the honest upsell — quiet, at the bottom, never a
// dead end. Shown only when the platform says there IS a next rung (owners only;
// the server computes gains from featureDelta so this can never overpromise).
// ── PT-2C: the ONE health experience — the Business Health Coach (PT-6).
//    Replaces the old search-only line; composes every signal into one read. ──
async function healthLine(){
  let r = null;
  try { r = (await apiGet('/coach/health')).data; } catch(_) { return; }
  if (!r) return;
  const attn = r.status === 'attention' || r.status === 'quiet';
  const host = moreHost();   // secondary context — lives in the collapsible, not atop the needs-you stack
  const line = document.createElement('div');
  line.style.cssText = 'max-width:860px;margin:0 auto 12px;padding:12px 20px;border-radius:12px;font-size:14px;border:1px solid var(--line);background:' + (attn ? 'var(--warn-soft)' : 'var(--good-soft)') + ';color:var(--ink)';
  const sugg = (r.suggestions || [])[0];
  if (!sugg) {
    line.textContent = '✓ ' + (r.headline || 'Everything looks healthy.');
  } else {
    line.innerHTML = '<strong>' + esc(r.headline) + '</strong> ' + esc(sugg.text) + ' <a href="' + esc(scopeHref(sugg.href)) + '" style="color:var(--accent);font-weight:600">Take a look →</a>' + (r.suggestions.length > 1 ? ' <span style="color:var(--muted)">(+' + (r.suggestions.length - 1) + ' more)</span>' : '');
  }
  host.appendChild(line);
}

// ── PT-2C: the Customer Journey (PT-7) — celebrate milestones, never a score ──
async function journeyStrip(){
  let j = null;
  try { j = (await apiGet('/coach/journey')).data; } catch(_) { return; }
  if (!j || !Array.isArray(j.milestones)) return;
  const host = moreHost();
  const wrap = document.createElement('div');
  wrap.style.cssText = 'max-width:860px;margin:16px auto 0;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:var(--card)';
  let html = '<div style="font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:14px">Your journey</div>';
  if (j.latestCelebration && j.latestCelebration.note) html += '<div style="font-family:var(--serif);font-size:19px;margin-bottom:16px;color:var(--ink)">' + esc(j.latestCelebration.note) + '</div>';
  html += '<div style="display:flex;flex-direction:column;gap:9px">';
  for (const m of j.milestones){
    const mark = m.achieved ? '✓' : '○';
    const col = m.achieved ? 'var(--good)' : 'var(--faint)';
    const note = String(m.note || '').replace('🎉','').trim();
    html += '<div style="display:flex;gap:11px;align-items:baseline;font-size:14px"><span style="color:' + col + ';font-weight:700;flex:0 0 auto">' + mark + '</span><span style="' + (m.achieved ? '' : 'color:var(--soft)') + '"><strong>' + esc(m.label) + '</strong>' + (note ? ' — ' + esc(note) : '') + '</span></div>';
  }
  html += '</div>';
  wrap.innerHTML = html;
  host.appendChild(wrap);
}

function planCard(c){
  if(!c || !c.edition_name) return;
  const host = moreHost();
  const card = document.createElement('div');
  card.style.cssText = 'max-width:860px;margin:16px auto 0;padding:16px 20px;border:1px solid var(--accent-soft);border-radius:14px;background:var(--card);font-size:14px;color:var(--soft)';
  const own = document.createElement('div');
  own.innerHTML = '<strong>Your plan: ' + esc(c.edition_name) + '.</strong> Everything you see here is included.';
  card.appendChild(own);
  if(c.upsell && c.upsell.name){
    const up = document.createElement('div');
    up.style.marginTop = '8px';
    const NICE={website:'the website tools',business_moments:'Business Moments',connected:'connected services',ai:'AI help',relationship:'Customers & Pipeline',reports:'Analytics',client_portal:'client sharing',developer:'Developer Mode',forms:'website forms',managed_service:'our managed service',agency:'agency tools',enterprise:'enterprise controls'};
    const nice=(g)=>NICE[String(g)]||String(g).replace(/_/g,' ');
    const gains = (c.upsell.gains||[]).map(g => esc(nice(g))).join(', ');
    const losses = (c.upsell.gives_up||[]).map(g => esc(nice(g))).join(', ');
    up.innerHTML = esc(c.upsell.name) + (c.upsell.monthly ? ' (from $' + c.upsell.monthly + '/mo)' : '') +
      (gains ? ' adds: ' + gains + '.' : '.') +
      (losses ? ' <span style="color:var(--warn,#775d31)">Heads up: it switches off ' + losses + ' — ask us about a plan that keeps both.</span>' : '') +
      ' <a href="mailto:support@davisdigitalstudio.com?subject=' + encodeURIComponent('Upgrading to ' + c.upsell.name) + '" style="color:var(--accent)">Ask about upgrading →</a>';
    card.appendChild(up);
  }
  host.appendChild(card);
}
</script>
