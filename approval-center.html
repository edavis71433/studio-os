<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What needs your approval — Studio OS</title>
<meta name="description" content="One calm place to review and approve work before it goes live.">
<link rel="stylesheet" href="/cms.css">
<style>
  header .sub{color:var(--soft);font-size:15.5px;margin:0;max-width:54ch}

  .group{margin-top:32px}
  .group.recently_approved{margin-top:36px;padding-top:26px;border-top:1px solid var(--line)}
  .glabel{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:0 0 13px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 19px;box-shadow:var(--shadow);margin-bottom:12px}
  .top{display:flex;gap:14px;align-items:flex-start}
  .ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px}
  .group.recently_approved .ic{background:var(--good-soft)}
  .hd{flex:1;min-width:0}
  .ct{font-size:15.5px;font-weight:600;margin:0;line-height:1.35;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--accent);background:var(--accent-soft)}
  .group.recently_approved .badge{color:var(--good);background:var(--good-soft)}
  .cwhy{margin:4px 0 0;font-size:14px;color:var(--soft);line-height:1.45}
  .outcomes{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .oc{display:flex;gap:9px;font-size:13.5px;line-height:1.4}
  .oc .lab{flex:none;font-weight:700;color:var(--faint);min-width:92px;font-size:12px;letter-spacing:.02em;text-transform:uppercase;padding-top:1px}
  .oc .val{color:var(--ink)}
  .cact{margin-top:14px}
  a.act{display:inline-block;font-size:14px;font-weight:600;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:8px 17px;text-decoration:none;transition:filter .15s}
  a.act:hover{filter:brightness(1.06)} a.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .group.scheduled a.act{background:transparent;color:var(--accent)}
  .group.scheduled a.act:hover{background:var(--accent-soft);filter:none}

  .center{text-align:center;padding:56px 20px}
  .center .mark{font-size:40px;display:block;margin-bottom:12px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px;color:var(--good)}
  .center .sub{color:var(--soft);font-size:15px;max-width:42ch;margin:0 auto}
  .foot{margin-top:32px;color:var(--faint);font-size:12.5px;text-align:center}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/today.html">← Back to Today</a>
    <h1>What needs your approval</h1>
    <p class="sub" id="sub">One calm place to review and approve work before it goes live. Each item explains what it is, what happens if you approve, and what happens if you wait.</p>
  </header>
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// CMS-UX-6 — the Approval Center, rendered.
// Consumes ONLY the existing read-only projection: GET /approval-center.
// Each card's action links to the existing surface where approval happens.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN = SUPABASE_URL + "/functions/v1/presence";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLIENT = new URLSearchParams(location.search).get('client') || '';
let TOKEN = "";
sb.auth.onAuthStateChange(function(_e,s){ if(s&&s.access_token) TOKEN=s.access_token; });

const H = () => ({ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN, 'x-dds-scope-site':CLIENT });
async function apiGet(p){ const r = await fetch(FN+p, { headers:H() }); if(r.status===401) return Promise.reject(401); return r.ok ? r.json() : Promise.reject(r.status); }
function href(link){ if(!link) return null; if(!CLIENT) return link; const [b,h]=String(link).split('#'); return b + (b.includes('?')?'&':'?') + 'client=' + encodeURIComponent(CLIENT) + (h?'#'+h:''); }

function cardHtml(c){
  const link = href(c.action_href);
  const act = (c.action_label && link) ? `<div class="cact"><a class="act" href="${esc(link)}">${esc(c.action_label)}</a></div>` : '';
  const badge = c.status_label ? `<span class="badge">${esc(c.status_label)}</span>` : (c.when ? `<span class="badge">${esc(c.when)}</span>` : '');
  const rows = [];
  if(c.if_approved) rows.push(`<div class="oc"><span class="lab">If you approve</span><span class="val">${esc(c.if_approved)}</span></div>`);
  if(c.if_wait) rows.push(`<div class="oc"><span class="lab">If you wait</span><span class="val">${esc(c.if_wait)}</span></div>`);
  const outcomes = rows.length ? `<div class="outcomes">${rows.join('')}</div>` : '';
  return `<article class="card">
    <div class="top">
      <span class="ic" aria-hidden="true">${esc(c.icon||'•')}</span>
      <div class="hd">
        <p class="ct">${esc(c.title)} ${badge}</p>
        ${c.why ? `<p class="cwhy">${esc(c.why)}</p>` : ''}
      </div>
    </div>
    ${outcomes}${act}
  </article>`;
}
function groupHtml(g){
  return `<section class="group ${esc(g.key)}">
    <p class="glabel">${esc(g.label)}</p>
    ${(g.cards||[]).map(cardHtml).join('')}
  </section>`;
}

function render(a){
  const groups = (a && a.groups) || [];
  const hasPending = a && a.status === 'pending';
  if(!groups.length){
    $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">✅</span>
      <h2>Nothing to approve.</h2>
      <p class="sub">You’re all caught up — there’s nothing waiting on your approval right now. When your studio prepares something, it’ll appear here.</p></div>`;
    return;
  }
  if(!hasPending){
    $('sub').textContent = a.headline || 'Nothing needs your approval right now.';
  } else {
    $('sub').textContent = a.headline + ' Each item explains what happens if you approve, and if you wait.';
  }
  $('main').innerHTML = groups.map(groupHtml).join('')
    + `<p class="foot">Nothing here goes live until you approve it. Each “Review” opens the page where you can take a closer look and give the go-ahead.</p>`;
}

function signedOut(){ $('sub').textContent=''; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2 style="color:var(--ink)">Sign in to see what needs approval.</h2><p class="sub">Your approvals live with your account — sign in to review them.</p><p style="margin-top:22px"><a class="link" href="/portal.html">Sign in →</a></p></div>`; }
function trouble(){ $('main').innerHTML = `<div class="center"><h2 style="color:var(--ink)">We couldn’t load your approvals just now.</h2><p class="sub">Nothing’s wrong with your website — this is only this page. Please refresh in a moment.</p></div>`; }

(async function init(){
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    const res = await apiGet('/approval-center');
    render(res && res.data);
  }catch(e){ if(e === 401){ signedOut(); return; } trouble(); }
})();
</script>
</body>
</html>
