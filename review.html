<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Leave a review</title>
<style>
  /* Minimal standalone shell: the fetched review page replaces this page entirely.
     This styles only the loading and error states. */
  :root{--bg:#faf8f5;--ink:#1b1525;--soft:#6b6478}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--ink:#efeaf7;--soft:#a79ebc}}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .center{max-width:520px;margin:80px auto;padding:0 20px;text-align:center}
  h1{font-weight:500;font-size:clamp(22px,5vw,28px);margin-bottom:6px}
  .muted{color:var(--soft);font-size:15px}
  /* builder list item 200: Try again, for a moment's trouble only */
  .again{margin-top:22px;font:inherit;font-size:15px;font-weight:600;border:0;border-radius:999px;padding:11px 22px;min-height:44px;background:#5b3fa0;color:#fff;cursor:pointer}
</style>
</head>
<body>
<main class="center" id="state"><p class="muted">Opening the review page…</p></main>
<script>
// The review page viewer. A review request email links here with ?site=<site id>. The
// page itself is drawn by the presence function (GET /reviews/<site>), but Supabase's
// default *.supabase.co address serves an HTML answer as plain text, so the email's old
// link showed the page's code. This page, on our own address, asks the function and
// writes what comes back into the document (our own server-rendered HTML). Its form
// already sends the review to the function directly.
//
// Builder list item 200 (review file 06, finding 62): a customer with a link that will never
// work was told to try again in a moment. A link to a page that's gone (404) now says so and
// to ask the business for a fresh one; no answer, a busy moment or a failure on our side says
// the link is still good, with Try again.
(function(){
  var q=new URLSearchParams(location.search);
  var FN=(q.get('env')==='staging'?'https://wjlpursnwbmlcdwbeowv.supabase.co':'https://qksstlqzbhesadrrofgn.supabase.co')+'/functions/v1/presence';
  var site=q.get('site')||'';
  var state=document.getElementById('state');
  function fail(head,line,again){
    state.innerHTML='<h1></h1><p class="muted"></p>'; state.setAttribute('role','alert');
    state.querySelector('h1').textContent=head; state.querySelector('p').textContent=line;
    if(again){ var b=document.createElement('button'); b.type='button'; b.className='again'; b.textContent='Try again'; b.addEventListener('click',open); state.appendChild(b); }
  }
  function open(){
    state.removeAttribute('role'); state.innerHTML='<p class="muted">Opening the review page…</p>';
    fetch(FN+'/reviews/'+site+'?embed=1').then(function(r){
      if(r.status===404){ fail('This review link doesn’t work','It may be cut short, or it’s for a page that’s gone. Ask the business for a fresh link.'); return; }
      if(r.status===429){ fail('Too many tries in a row','Wait a minute, then try again. The link is still good.',true); return; }
      if(!r.ok){ fail('This review page isn’t available right now','Please try again in a moment. The link is still good.',true); return; }
      return r.text().then(function(html){ document.open(); document.write(html); document.close(); });
    }).catch(function(){ fail('This review page couldn’t open','Check your connection, then try again. The link is still good.',true); });
  }
  if(!/^[0-9a-f-]{36}$/i.test(site)){ fail('This review link isn’t complete','Open the link from the email again, or ask the business for a fresh one.'); return; }
  open();
})();
</script>
</body>
</html>
