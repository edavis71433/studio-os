<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Developer Mode — Presence</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Customize the presentation of your site — theme, CSS and HTML — safely, published through your normal approval flow.">
<style>
  :root{
    --bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;
    --p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#3f7a5a;--good-soft:#e7f1ea;--warn:#8a6d3b;--warn-soft:#f3ead9;--bad:#a3423a;
    --code-bg:#f6f3ef;--code-ink:#2a2338;
    --shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Code","Fira Code",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--bad:#e39a92;--code-bg:#181322;--code-ink:#d7cef0;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa;--code-bg:#f6f3ef;--code-ink:#2a2338}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--code-bg:#181322;--code-ink:#d7cef0}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1160px;margin:0 auto;padding:26px 20px 90px}
  .rolebadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:5px 12px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  header h1{font-family:var(--serif);font-weight:500;font-size:clamp(22px,4vw,28px);margin:12px 0 .1em;letter-spacing:-.01em}
  header .sub{color:var(--soft);font-size:14px;margin:0}
  .tmpl{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .grid{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:22px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  /* file explorer */
  .files{padding:10px}
  .files .grp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 10px 6px}
  .file{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:none;background:transparent;color:var(--ink);font-family:var(--mono);font-size:12.5px;cursor:pointer}
  .file:hover{background:var(--p-soft);color:var(--ink)}
  .file.active{background:var(--p-soft);color:var(--p);font-weight:600}
  .file .ic{width:15px;flex:0 0 auto;opacity:.7}
  .file .lock{margin-left:auto;font-size:10px;color:var(--faint)}
  /* editor column */
  .edwrap{padding:0}
  .edhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .edhead .path{font-family:var(--mono);font-size:12.5px;color:var(--soft)}
  .edbody{padding:18px}
  label.fld{display:block;font-size:12px;font-weight:600;color:var(--soft);margin:14px 0 6px}
  label.fld:first-child{margin-top:0}
  .hint{font-size:12.5px;color:var(--faint);margin:2px 0 0}
  textarea,input[type=text]{width:100%;font-family:var(--mono);font-size:13px;color:var(--code-ink);background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 13px;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--p)}
  textarea{min-height:200px;line-height:1.5;tab-size:2}
  .tokens{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tok label{display:block;font-size:11px;font-weight:600;color:var(--soft);margin-bottom:5px;font-family:var(--mono)}
  .tok .cin{display:flex;align-items:center;gap:8px}
  .tok input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;flex:0 0 auto}
  .tok input[type=text]{padding:8px 10px;font-size:12px}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 17px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--p);color:var(--p)} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--p);color:#fff;border-color:var(--p)} button.primary:hover{background:var(--p-deep);color:#fff}
  .save-note{font-size:12.5px;color:var(--soft)}
  .save-note.warn{color:var(--warn)}
  /* preview */
  .preview{margin-top:18px}
  .preview h2,.readonly h2,.approval h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 10px}
  iframe.pv{width:100%;height:320px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .readonly{padding:18px}
  .readonly .box{font-family:var(--mono);font-size:12.5px;color:var(--soft);background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:16px}
  .readonly .box b{color:var(--ink)}
  .approval{margin-top:18px;padding:16px 18px;background:var(--good-soft);border-radius:12px;font-size:13.5px;color:var(--ink)}
  .approval b{font-weight:600}
  a.link{color:var(--p);text-decoration:none;font-weight:600} a.link:hover{text-decoration:underline}
  .center{text-align:center;padding:64px 20px;max-width:520px;margin:0 auto}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--ink);margin:0 0 10px}
  .muted{color:var(--soft);font-size:14px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>Presence · Developer Mode — customize safely. Every change publishes through your normal approval flow, is versioned, and can be rolled back.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// Developer Mode (Phase B). A capability of Studio OS — reachable only by an
// operator or a member with the developer capability (the server enforces it;
// this page just presents it). It authors the SAFE presentation layer: theme
// tokens + custom CSS + a sanitized HTML block. It NEVER executes developer code
// — the preview runs in a sandboxed iframe with NO script permission, and the
// server sanitizes on save. Render-LOGIC (templates) is read-only here.
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="";
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN});
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}

// ── state ──
let STATE={files:[],template:{},cust:{theme_tokens:{},custom_css:'',custom_html:'',allowed_tokens:[]},active:'theme/tokens.json'};
const TOKEN_META={accent:{label:'Accent',type:'color'},accent_soft:{label:'Accent soft',type:'color'},ink:{label:'Text',type:'color'},bg:{label:'Background',type:'color'},radius:{label:'Corner radius',type:'text',ph:'8px'},font_scale:{label:'Type scale',type:'text',ph:'1.0'}};

function iconFor(kind){return kind==='theme'?'◆':kind==='css'?'{}':kind==='html'?'<>':kind==='template'?'⌘':'▤';}

function fileList(){
  const groups=[['Editable','theme|css|html|asset'],['Read-only (SDK / build-time)','template']];
  let h='<div class="files">';
  for(const [title,kinds] of groups){
    const set=kinds.split('|');
    const items=STATE.files.filter(f=>set.includes(f.kind));
    if(!items.length)continue;
    h+=`<div class="grp">${esc(title)}</div>`;
    for(const f of items){
      const on=f.path===STATE.active?' active':'';
      h+=`<button class="file${on}" data-path="${esc(f.path)}"><span class="ic">${iconFor(f.kind)}</span>${esc(f.path)}${f.editable?'':'<span class="lock">read-only</span>'}</button>`;
    }
  }
  h+='</div>';return h;
}

function editorFor(path){
  const f=STATE.files.find(x=>x.path===path)||{};
  if(f.kind==='theme')return themeEditor();
  if(f.kind==='css')return cssEditor();
  if(f.kind==='html')return htmlEditor();
  if(f.kind==='asset')return assetView();
  return readonlyView(path);
}
function themeEditor(){
  const t=STATE.cust.theme_tokens||{};
  let toks='';
  for(const key of (STATE.cust.allowed_tokens||Object.keys(TOKEN_META))){
    const m=TOKEN_META[key]||{label:key,type:'text'};const val=t[key]||'';
    if(m.type==='color'){
      const cv=/^#[0-9a-fA-F]{6}$/.test(val)?val:'#5b3fa0';
      toks+=`<div class="tok"><label>${esc(m.label)}</label><div class="cin"><input type="color" data-tokcolor="${esc(key)}" value="${cv}"><input type="text" data-tok="${esc(key)}" value="${esc(val)}" placeholder="#5b3fa0"></div></div>`;
    }else{
      toks+=`<div class="tok"><label>${esc(m.label)}</label><input type="text" data-tok="${esc(key)}" value="${esc(val)}" placeholder="${esc(m.ph||'')}"></div>`;
    }
  }
  return `<label class="fld" style="margin-bottom:12px">Theme tokens</label>
    <p class="hint" style="margin-bottom:14px">Only these values can be set, and only in valid forms — a safety guarantee, not a limitation. Everything else lives in the template.</p>
    <div class="tokens">${toks}</div>${previewBlock()}${approvalBlock()}`;
}
function cssEditor(){
  return `<label class="fld">Custom CSS</label>
    <p class="hint" style="margin-bottom:8px">Layered on top of the template. <code>@import</code>, <code>expression()</code> and code-bearing URLs are removed on save.</p>
    <textarea id="css" spellcheck="false" placeholder=".hero h1 { letter-spacing: -0.02em; }">${esc(STATE.cust.custom_css||'')}</textarea>${previewBlock()}${approvalBlock()}`;
}
function htmlEditor(){
  return `<label class="fld">Custom HTML block</label>
    <p class="hint" style="margin-bottom:8px">Inert markup for a designated slot. Scripts, event handlers, iframes and code-bearing URLs are stripped on save — this can never run code.</p>
    <textarea id="html" spellcheck="false" placeholder="<p class=&quot;note&quot;>Family-owned since 1998.</p>">${esc(STATE.cust.custom_html||'')}</textarea>${previewBlock()}${approvalBlock()}`;
}
function assetView(){
  return `<div class="readonly"><h2>Assets</h2><div class="box">Media (logos, photos) is managed in your library. <a class="link" href="/presence.html#media">Open media →</a><br><br>Developer Mode styles what the template does with those assets; it doesn't replace the media library.</div></div>`;
}
function readonlyView(path){
  return `<div class="readonly"><h2>Read-only — render code</h2>
    <div class="box"><b>${esc(path)}</b><br><br>Template render logic is authored with the <b>Presence SDK</b> at build time and version-pinned to your site (currently <b>${esc(STATE.template.slug||'')}@${esc(STATE.template.version||'')}</b>). It is deployed with the platform — never edited or executed at runtime — which is what keeps every site deterministic and secure.<br><br>To change render logic, publish a new template version through the SDK. See the <a class="link" href="/docs/presence/DEVELOPER-MODE-GUIDE.md">Developer Guide</a>.</div></div>`;
}
function previewBlock(){return `<div class="preview"><h2>Live preview <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)">— sandboxed, no scripts run</span></h2><iframe class="pv" id="pv" title="Preview" sandbox=""></iframe></div>`;}
function approvalBlock(){return `<div class="approval"><b>Publishing:</b> Save keeps your work. It goes live only when you <b>Publish</b> from your workspace — through the same approval flow as any change, versioned and reversible. Nothing here bypasses approval.</div>`;}

// gather current edits from the DOM (so preview + save use live values)
function collect(){
  const t={...(STATE.cust.theme_tokens||{})};
  document.querySelectorAll('[data-tok]').forEach(i=>{const k=i.getAttribute('data-tok');const v=i.value.trim();if(v)t[k]=v;else delete t[k];});
  STATE.cust.theme_tokens=t;
  const css=$('css');if(css)STATE.cust.custom_css=css.value;
  const html=$('html');if(html)STATE.cust.custom_html=html.value;
}
function buildPreviewDoc(){
  const t=STATE.cust.theme_tokens||{};
  const vars=Object.entries(t).map(([k,v])=>`--${k}:${String(v).replace(/[<>]/g,'')}`).join(';');
  const scale=t.font_scale?`font-size:calc(16px*${(parseFloat(t.font_scale)||1)})`:'';
  const base=`:root{${vars}} *{box-sizing:border-box} body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg,#fff);color:var(--ink,#1b1525);${scale}}
    .hero{padding:34px 26px;border-bottom:1px solid rgba(0,0,0,.06)} .hero .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent,#5b3fa0);font-weight:700}
    .hero h1{font-family:Georgia,serif;font-weight:500;margin:.3em 0;font-size:30px} .hero p{color:#6b6478;margin:0}
    .cta{display:inline-block;margin-top:16px;background:var(--accent,#5b3fa0);color:#fff;padding:10px 18px;border-radius:var(--radius,999px);text-decoration:none;font-weight:600;font-size:14px}
    .body{padding:22px 26px}`;
  const html=`<!doctype html><html><head><meta charset="utf-8"><style>${base}\n/* custom */\n${STATE.cust.custom_css||''}</style></head>
    <body><div class="hero"><div class="k">Bacchus Kitchen</div><h1>Wood-fired, family-owned.</h1><p>A sample of your site with this theme applied.</p><a class="cta" href="#">Book a table</a></div>
    <div class="body">${STATE.cust.custom_html||'<p style="color:#938ba3">Your custom HTML block appears here.</p>'}</div></body></html>`;
  return html;
}
function refreshPreview(){const f=$('pv');if(f)f.srcdoc=buildPreviewDoc();}

function paint(){
  const editable=STATE.files.find(x=>x.path===STATE.active)?.editable;
  const showSave=['theme/tokens.json','styles/custom.css','blocks/custom.html'].includes(STATE.active);
  $('main').innerHTML=`
    <header>
      <div><div class="rolebadge">● Developer Mode</div>
        <h1>Developer Mode</h1>
        <p class="sub">Customize how your site looks — safely, and always through approval. This is the <b>same site</b> as your no-code workspace: <a class="link" href="/today.html">switch back anytime →</a></p></div>
      <div class="tmpl">${esc(STATE.template.slug||'')}@${esc(STATE.template.version||'')}</div>
    </header>
    <div class="grid">
      <div class="panel">${fileList()}</div>
      <div class="panel edwrap">
        <div class="edhead"><span class="path">${esc(STATE.active)}</span>${showSave?'<button class="primary" id="save">Save</button>':''}</div>
        <div class="edbody">${editorFor(STATE.active)}
          ${showSave?'<div class="bar"><button class="primary" id="save2">Save changes</button><span class="save-note" id="savenote">Saved changes stay as a draft until you publish.</span></div>':''}
        </div>
      </div>
    </div>`;
  wire();refreshPreview();
}
function wire(){
  document.querySelectorAll('[data-path]').forEach(b=>b.addEventListener('click',()=>{collect();STATE.active=b.getAttribute('data-path');paint();}));
  document.querySelectorAll('#save,#save2').forEach(b=>b.addEventListener('click',save));
  // color pickers ↔ text mirror
  document.querySelectorAll('[data-tokcolor]').forEach(c=>c.addEventListener('input',()=>{const k=c.getAttribute('data-tokcolor');const t=document.querySelector(`[data-tok="${k}"]`);if(t)t.value=c.value;collect();refreshPreview();}));
  document.querySelectorAll('[data-tok]').forEach(i=>i.addEventListener('input',()=>{const k=i.getAttribute('data-tok');const c=document.querySelector(`[data-tokcolor="${k}"]`);if(c&&/^#[0-9a-fA-F]{6}$/.test(i.value))c.value=i.value;collect();refreshPreview();}));
  ['css','html'].forEach(id=>{const el=$(id);if(el)el.addEventListener('input',()=>{collect();refreshPreview();});});
}
async function save(){
  collect();
  const btns=document.querySelectorAll('#save,#save2');btns.forEach(b=>{b.disabled=true;});
  const note=$('savenote');
  const r=await api('/dev/customization','PUT',{theme_tokens:STATE.cust.theme_tokens,custom_css:STATE.cust.custom_css,custom_html:STATE.cust.custom_html});
  btns.forEach(b=>{b.disabled=false;});
  if(!r.ok){toast('That didn’t save — please try again.');return;}
  const d=r.body.data||{};
  if(d.saved){STATE.cust.theme_tokens=d.saved.theme_tokens;STATE.cust.custom_css=d.saved.custom_css;STATE.cust.custom_html=d.saved.custom_html;}
  const adj=[];
  if(d.rejected_tokens&&d.rejected_tokens.length)adj.push(`${d.rejected_tokens.length} theme value${d.rejected_tokens.length>1?'s':''} weren’t allowed`);
  if(d.sanitized&&d.sanitized.html)adj.push('unsafe HTML was removed');
  if(d.sanitized&&d.sanitized.css)adj.push('unsafe CSS was removed');
  if(note){note.textContent=adj.length?('Saved — '+adj.join('; ')+'. Publish from your workspace to take it live.'):'Saved. Publish from your workspace to take it live.';note.className='save-note'+(adj.length?' warn':'');}
  toast(adj.length?'Saved — some values were adjusted for safety.':'Saved.');
  paint();
}

function notEnabled(){
  $('main').innerHTML=`<div class="center"><div class="rolebadge">● Restricted</div>
    <h2 style="margin-top:14px">Developer Mode isn’t enabled for your account.</h2>
    <p class="muted">It’s available to developers. Ask your studio to grant developer access, then reload.</p>
    <p style="margin-top:22px"><a class="link" href="/today.html">Back to your workspace →</a></p></div>`;
}
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to open Developer Mode.</h2><p style="margin-top:20px"><a class="link" href="/portal.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load Developer Mode just now.</h2><p class="muted">Please refresh in a moment.</p></div>`;}

async function load(){
  const f=await api('/dev/files');
  if(f.status===403){notEnabled();return;}
  if(!f.ok){trouble();return;}
  STATE.files=f.body.data.files||[];STATE.template=f.body.data.template||{};
  const c=await api('/dev/customization');
  if(c.ok)STATE.cust={...STATE.cust,...(c.body.data||{})};
  STATE.active=(STATE.files.find(x=>x.editable)||{}).path||'theme/tokens.json';
  paint();
}
(async function(){
  try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){signedOut();return;}await load();
  }catch(_){trouble();}
})();
</script>
</body>
</html>
