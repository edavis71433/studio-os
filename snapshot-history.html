<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your website versions — Studio OS</title>
<meta name="description" content="Every saved version of your website — revisit or restore an earlier edition anytime.">
<link rel="stylesheet" href="/fonts/brand.css">
<link rel="stylesheet" href="/cms.css">
<style>
  /* SS10 — page skin re-aliased onto the shell's --dds-* tokens. shell.css is the
     canonical palette and carries the full four-block theme contract (light base ·
     prefers-color-scheme dark · data-theme="light" · data-theme="dark"), so this
     page follows every mode automatically. The selector list mirrors cms.css's
     own explicit data-theme blocks so this alias wins in all four states;
     fallbacks only cover a missing shell.css. */
  :root,:root[data-theme="light"],:root[data-theme="dark"]{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#6f677d);--line:var(--dds-line,#eee9e0);
    --accent:var(--dds-accent,#5b3fa0);--accent-soft:var(--dds-accent-soft,#efeafa);--good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);
    --warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#a2453f);--bad-soft:var(--dds-bad-soft,#f6e6e4);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.05));
  }
  header .sub{color:var(--soft);font-size:15.5px;margin:0;max-width:54ch}

  /* ── SS8 shared cms-family chrome: .lhead-lite (icon · count meta · "As of
        {time}" · ↻ soft refresh) — matched by hand with website-health.html /
        attention.html / content-tree.html (the SS9–SS12 primitive). ── */
  .lhead{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;margin:22px 0 0}
  .lhead[hidden]{display:none}   /* the display rule must never defeat the hidden attribute */
  .obj-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .lmeta{flex:1;min-width:0;font-size:13px;color:var(--soft);margin:0;font-variant-numeric:tabular-nums}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:8px;padding:5px 8px;cursor:pointer}
  .lbtn:hover{color:var(--accent);background:var(--accent-soft)}
  .lbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .retry{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 18px;cursor:pointer;margin-top:16px}
  .retry:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  /* dark mode: the filled retry needs dark ink (#fff on the lifted accent fails contrast) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .retry{color:#171320}}
  :root[data-theme="dark"] .retry{color:#171320}
  /* >300ms loading stencil — ghost cards, never a flash on fast reads */
  .stencil{margin-top:26px}
  .stencil .gh{background:var(--card);border:1px solid var(--line);border-radius:15px;height:88px;margin-bottom:12px;position:relative;overflow:hidden}
  .stencil .gh::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--line),transparent);animation:shim 1.2s infinite}
  @keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  @media (prefers-reduced-motion:reduce){.stencil .gh::after{animation:none}}

  .group{margin-top:32px}
  .glabel{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:0 0 13px}

  .ver{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 19px;box-shadow:var(--shadow);margin-bottom:12px}
  .ver.current{border-color:var(--accent)}
  .top{display:flex;gap:14px;align-items:flex-start}
  .ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px}
  .hd{flex:1;min-width:0}
  .vname{font-family:var(--serif);font-weight:500;font-size:18px;margin:0;line-height:1.3;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--accent);background:var(--accent-soft)}
  .vdate{margin:3px 0 0;font-size:13px;color:var(--faint)}
  .vwhy{margin:8px 0 0;font-size:14px;color:var(--soft);line-height:1.45}
  .vchanged{margin:6px 0 0;font-size:14px;color:var(--ink)}
  .vchanged .lab{font-weight:700;color:var(--faint);font-size:12px;letter-spacing:.02em;text-transform:uppercase;margin-right:6px}
  .row{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}
  a.act{display:inline-block;font-size:13.5px;font-weight:600;text-decoration:none;border-radius:999px;padding:7px 15px;transition:background .15s,border-color .15s;border:1px solid var(--line);color:var(--accent)}
  a.act:hover{background:var(--accent-soft);border-color:var(--accent)} a.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a.act.primary{background:var(--accent);color:#fff;border-color:var(--accent)} a.act.primary:hover{filter:brightness(1.06);background:var(--accent)}

  /* ── G9: visual publish diff (compare two versions) ── */
  .cmp{margin-top:36px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 19px;box-shadow:var(--shadow)}
  .cmp .glabel{margin-top:0}
  .cmp-pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .cmp-pick label{font-size:13px;color:var(--soft);display:flex;gap:7px;align-items:center}
  .cmp-pick select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;max-width:46vw}
  .cmp-pick .arrow{color:var(--faint)}
  .strip{margin:0 0 14px}
  .strip .note{font-size:13.5px;color:var(--soft);margin:0 0 8px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 11px;border:1px solid transparent;white-space:nowrap}
  /* SS10 (4/5) — diff chips retokened onto the four-block --*-soft / --* pairs so
     dark theme holds (the old literals — #e7f5ec etc. — were light-only and broke
     the dark contract). added→good · removed→bad · changed→warn · moved→accent. */
  .chip.added{background:var(--good-soft);color:var(--good)}
  .chip.removed{background:var(--bad-soft);color:var(--bad)}
  .chip.changed{background:var(--warn-soft);color:var(--warn)}
  .chip.moved{background:var(--accent-soft);color:var(--accent)}
  .strip details{margin-top:10px}
  .strip summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
  .cmpretry{font:inherit;font-size:13.5px;font-weight:600;color:var(--accent);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline}
  .cmpretry:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .strip ul{margin:8px 0 0;padding-left:20px}
  .strip li{font-size:13.5px;color:var(--soft);margin:3px 0;line-height:1.45}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:760px){.panes{grid-template-columns:1fr}}
  .pane-t{margin:0 0 7px;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
  .pane iframe{width:100%;height:420px;border:1px solid var(--line);border-radius:12px;background:#fff;display:block}

  .center{text-align:center;padding:56px 20px}
  .center .mark{font-size:40px;display:block;margin-bottom:12px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px}
  .center .sub{color:var(--soft);font-size:15px;max-width:44ch;margin:0 auto}
  .foot{margin-top:32px;color:var(--faint);font-size:12.5px;text-align:center}
</style>

<body>
<div class="wrap">
  <header>
    <a class="back" href="/today.html">← Back to Today</a>
    <h1>Your website versions</h1>
    <p class="sub" id="sub">Every saved version of your website, newest first — like flipping through past editions. You can revisit or restore an earlier one anytime.</p>
  </header>
  <div class="lhead" id="lhead" hidden>
    <span class="obj-ic" aria-hidden="true">📚</span>
    <p class="lmeta" id="lmeta"></p>
    <button class="lbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">↻</button>
  </div>
  <div id="main"></div>

  <!-- G9 — visual publish diff: pick two versions, see what changed section by
       section, and look at both side by side (the SAME /preview render engine). -->
  <section class="cmp" id="compare" hidden aria-label="Compare two versions">
    <p class="glabel">Compare two versions</p>
    <div class="cmp-pick">
      <label>From <select id="cmpA" aria-label="Older version"></select></label>
      <span class="arrow" aria-hidden="true">→</span>
      <label>To <select id="cmpB" aria-label="Newer version"></select></label>
    </div>
    <div class="strip" id="cmpStrip" aria-live="polite"></div>
    <div class="panes">
      <!-- SS10 SECURITY: sandbox="" (no allow-* tokens) — these panes render
           CLIENT-authored HTML; without the sandbox they would run same-origin
           in the OPERATOR's auth context (client script could reach the operator
           session). Empty token set = no scripts, no same-origin, no forms.
           Content is assigned via the srcdoc *property* in runCompare(), never an
           escaped attribute. (SS4 broadcasts drill-in is the shipped precedent.) -->
      <div class="pane"><p class="pane-t" id="paneAT">From</p><iframe id="frameA" title="Older version preview" sandbox=""></iframe></div>
      <div class="pane"><p class="pane-t" id="paneBT">To</p><iframe id="frameB" title="Newer version preview" sandbox=""></iframe></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
// CMS-UX-8 — Snapshot History, rendered.
// Consumes ONLY the existing read-only projection: GET /snapshot-history.
// Preview and Restore link to the existing editor version-history surface.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN = SUPABASE_URL + "/functions/v1/presence";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLIENT = new URLSearchParams(location.search).get('client') || '';
let TOKEN = "";
sb.auth.onAuthStateChange(function(_e,s){ if(s&&s.access_token) TOKEN=s.access_token; });

const H = () => ({ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN, 'x-dds-scope-site':CLIENT });
// SS8 family api(): never throws — {ok:false,status:0} on a network hiccup, so
// every failure routes through ONE honest state switch (401/403/404/other).
async function api(p){ try{ const r = await fetch(FN+p, { headers:H() }); return { ok:r.ok, status:r.status, body:await r.json().catch(()=>({})) }; }catch(_){ return { ok:false, status:0, body:{} }; } }
// same contract for the HTML preview panes (text, not json)
async function apiHtml(p){ try{ const r = await fetch(FN+p, { headers:H() }); return { ok:r.ok, status:r.status, text: r.ok ? await r.text() : '' }; }catch(_){ return { ok:false, status:0, text:'' }; } }
let LOADED_AT = Date.now();
const asOfLabel = () => 'As of ' + new Date(LOADED_AT).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
function toast(m){ if(window.ddsToast) return void ddsToast(m); const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function href(link){ if(!link) return null; if(!CLIENT) return link; const [b,h]=String(link).split('#'); return b + (b.includes('?')?'&':'?') + 'client=' + encodeURIComponent(CLIENT) + (h?'#'+h:''); }

function verHtml(c){
  const badge = c.is_current ? `<span class="badge">Live now</span>` : '';
  const acts = [];
  if(c.can_preview && c.preview_href){ acts.push(`<a class="act${c.is_current?' primary':''}" href="${esc(href(c.preview_href))}">${c.is_current ? 'View your website' : 'Preview this version'}</a>`); }
  if(c.can_restore && c.restore_href){ acts.push(`<a class="act primary" href="${esc(href(c.restore_href))}">Restore this version</a>`); }
  const changed = c.what_changed ? `<p class="vchanged"><span class="lab">What changed</span>${esc(c.what_changed)}</p>` : '';
  return `<article class="ver${c.is_current?' current':''}">
    <div class="top">
      <span class="ic" aria-hidden="true">${esc(c.icon||'•')}</span>
      <div class="hd">
        <p class="vname">${esc(c.name)} ${badge}</p>
        <p class="vdate">Published ${esc(c.published_on)} · ${esc(c.when)}</p>
        <p class="vwhy">${esc(c.why)}</p>
        ${changed}
        ${acts.length ? `<div class="row">${acts.join('')}</div>` : ''}
      </div>
    </div>
  </article>`;
}
function groupHtml(g){
  return `<section class="group">
    <p class="glabel">${esc(g.label)}</p>
    ${(g.versions||[]).map(verHtml).join('')}
  </section>`;
}

function render(h){
  const groups = (h && h.groups) || [];
  if(!groups.length){
    $('lhead').hidden = true;   // nothing to count yet — no freshness chrome over an empty list
    $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">📚</span>
      <h2>No saved versions yet.</h2>
      <p class="sub">Each time you publish your website, that edition is saved here — so you can always look back or restore one. Publish once and your first version appears.</p>
      <p style="margin-top:22px"><a class="link" href="${esc(href('/presence.html')||'/presence.html')}">Open your website →</a></p></div>`;
    return;
  }
  // SS8 family chrome: version count + "As of {time}" freshness
  const total = h.total || groups.reduce((n,g)=>n+((g.versions||[]).length),0);
  $('lmeta').textContent = `${total} saved version${total===1?'':'s'} · ${asOfLabel()}`;
  $('lhead').hidden = false;
  if(h.headline) $('sub').textContent = h.headline + ' You can revisit or restore an earlier one anytime — nothing is ever lost.';
  $('main').innerHTML = groups.map(groupHtml).join('')
    + `<p class="foot">Every published edition is saved automatically. Restoring brings an earlier version back as your live website — you can always switch again.</p>`;
}

// ── G9 — visual publish diff ─────────────────────────────────────────────────
// Two pickers (default: latest previous version → current live), a section-level
// diff strip, and side-by-side previews rendered by the EXISTING /preview engine
// (fetched with auth headers, drawn via srcdoc — same pattern as the editor).
// The diff itself is pure + unit-tested: tests/presence/publish_diff_test.mjs
// mirrors diffPublishBlocks/blockKeys/blockName 1:1. Keep both copies in sync.

// Plain-word names for common section (block) types — a small local map in the
// spirit of the editor's SECTION_ALIAS; unknown types fall back to the raw type.
const BLOCK_NAMES = {
  hero:'Hero', gallery:'Photo gallery', cta:'Banner', team:'Team', partners:'Partners',
  features:'Highlights', stats:'Counters', reviews:'Star rating', reviews_wall:'Reviews',
  certifications:'Badges', pricing:'Pricing', process:'Steps', service_areas:'Service area',
  before_after:'Before / after', video:'Video', booking:'Booking', appointment:'Scheduling link',
  newsletter:'Email sign-up', map:'Map', events:'Events', social:'Social links',
  richtext:'Text', image:'Photo', image_text:'Image & words', accordion:'Expandable',
  tabs:'Tabs', carousel:'Slideshow', progress:'Meters', buttons:'Buttons', divider:'Divider',
  columns:'Columns', cards:'Cards', download:'Download', toc:'Jump links', title:'Heading',
  link_list:'Links', table:'Table', spotlight:'Spotlight', form:'Form', faq:'FAQ',
  testimonials:'Testimonials',
};
function blockName(type){ const t=String(type||'section'); return BLOCK_NAMES[t] || (t.replace(/[_-]+/g,' ').replace(/^./,c=>c.toUpperCase())); }

// Stable matching keys: a block's own id when present (first occurrence wins),
// else type + occurrence-index of that type within the list.
function blockKeys(list){
  const seen=Object.create(null), counts=Object.create(null);
  return (list||[]).map((b)=>{
    const rawId = b && b.id != null && String(b.id) !== '' ? String(b.id) : '';
    if(rawId && !seen['id:'+rawId]){ seen['id:'+rawId]=1; return 'id:'+rawId; }
    const t = (b && b.type) || 'section';
    const n = counts[t] = (counts[t]||0)+1;
    return 'ix:'+t+'#'+(n-1);
  });
}
const deepEqJson = (a,b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);

// diffPublishBlocks(aBlocks, bBlocks) — the section-level diff between two
// versions' block lists, going FROM a TO b. Pure. Returns entries
// { key, type, status:'added'|'removed'|'changed'|'moved', moved?, from_index?, to_index? }:
//   added/changed/moved in b's order, then removed in a's order.
//   changed = deep-inequality of the block JSON (a changed block that also moved
//   keeps status 'changed' and carries moved:true). moved = a block present in
//   both whose rank among the matched blocks differs between the two lists.
function diffPublishBlocks(aBlocks, bBlocks){
  const A = Array.isArray(aBlocks)?aBlocks:[], B = Array.isArray(bBlocks)?bBlocks:[];
  const ka = blockKeys(A), kb = blockKeys(B);
  const posA = new Map(ka.map((k,i)=>[k,i])), posB = new Map(kb.map((k,i)=>[k,i]));
  const rankA = new Map(); { let r=0; for(const k of ka){ if(posB.has(k)) rankA.set(k, r++); } }
  const rankB = new Map(); { let r=0; for(const k of kb){ if(posA.has(k)) rankB.set(k, r++); } }
  const out = [];
  B.forEach((b,j)=>{
    const k = kb[j], t = (b && b.type) || 'section';
    if(!posA.has(k)){ out.push({ key:k, type:t, status:'added', to_index:j }); return; }
    const i = posA.get(k);
    const changed = !deepEqJson(A[i], b);
    const moved = rankA.get(k) !== rankB.get(k);
    if(changed) out.push({ key:k, type:t, status:'changed', moved, from_index:i, to_index:j });
    else if(moved) out.push({ key:k, type:t, status:'moved', from_index:i, to_index:j });
  });
  A.forEach((a,i)=>{ if(!posB.has(ka[i])) out.push({ key:ka[i], type:(a&&a.type)||'section', status:'removed', from_index:i }); });
  return out;
}

// Plain names for the compare endpoint's sentence sections (its current payload).
const SECTION_NAMES = { business:'Business details', offerings:'Offerings', faqs:'FAQ', testimonials:'Testimonials', updates:'Updates', media:'Photos', site:'Site' };

// Chips for the strip. Preferred source: the two versions' block lists (if the
// compare payload ever carries data.from.blocks / data.to.blocks) → full
// added/removed/changed/moved coloring via diffPublishBlocks. Today's payload
// carries change SENTENCES only, so we fall back to one amber "changed" chip per
// affected section (grouped, counted) — honest, never invented. Pure.
function computeCompareChips(data){
  data = data || {};
  const fb = data.from && Array.isArray(data.from.blocks) ? data.from.blocks : null;
  const tb = data.to && Array.isArray(data.to.blocks) ? data.to.blocks : null;
  if(fb && tb){
    return { structured:true, chips: diffPublishBlocks(fb, tb).map((d)=>({ kind:d.status, label: blockName(d.type) + (d.status==='changed' && d.moved ? ' (also moved)' : '') })) };
  }
  const bySec = {}; const order = [];
  for(const ch of (data.changes||[])){ const s=(ch && ch.section)||'site'; if(!(s in bySec)){ bySec[s]=0; order.push(s); } bySec[s]++; }
  return { structured:false, chips: order.map((s)=>({ kind:'changed', label:(SECTION_NAMES[s]||s)+(bySec[s]>1?' · '+bySec[s]:'') })) };
}

const previewPath = (ref) => '/preview?page=%2F&' + (ref==='live'||ref==='draft' ? 'version='+ref : 'publish_id='+encodeURIComponent(ref));
const calmFrame = (msg) => `<div style="font-family:Georgia,serif;font-style:italic;color:#8a8172;padding:48px 24px;text-align:center;font-size:15px;line-height:1.6">${esc(msg)}</div>`;

let CMP_SEQ = 0;
async function runCompare(){
  const a = $('cmpA').value, b = $('cmpB').value;
  const seq = ++CMP_SEQ;
  $('paneAT').textContent = 'From — ' + (($('cmpA').selectedOptions[0]||{}).textContent||'');
  $('paneBT').textContent = 'To — ' + (($('cmpB').selectedOptions[0]||{}).textContent||'');
  $('frameA').srcdoc = calmFrame('Drawing this version…');
  $('frameB').srcdoc = calmFrame('Drawing this version…');
  if(a === b){
    $('cmpStrip').innerHTML = '<p class="note">That’s the same version on both sides — pick two different ones to compare.</p>';
  } else {
    $('cmpStrip').innerHTML = '<div class="spin" role="status" aria-label="Comparing"></div>';
    api('/publishes/compare?a='+encodeURIComponent(a)+'&b='+encodeURIComponent(b)).then((res)=>{
      if(seq!==CMP_SEQ) return;
      if(!res.ok){ $('cmpStrip').innerHTML = `<p class="note">${esc(compareFailCopy(res.status))}</p>`; return; }
      const d = (res.body && res.body.data) || {};
      if(d.identical){ $('cmpStrip').innerHTML = '<p class="note">These two versions are identical — nothing changed between them.</p>'; return; }
      const cc = computeCompareChips(d);
      const chips = cc.chips.map((c)=>`<span class="chip ${esc(c.kind)}">${esc(c.label)}</span>`).join('');
      const sentences = (d.changes||[]).map((ch)=>`<li>${esc(ch.sentence)}</li>`).join('');
      const n = d.count || (d.changes||[]).length;
      $('cmpStrip').innerHTML = `<p class="note">${n} change${n===1?'':'s'} between these versions${cc.structured?'':' — by section'}:</p>`
        + `<div class="chips">${chips}</div>`
        + (sentences ? `<details><summary>What changed, in plain words</summary><ul>${sentences}</ul></details>` : '');
    });
  }
  // the panes: client HTML into sandbox="" iframes via the srcdoc PROPERTY
  apiHtml(previewPath(a)).then((res)=>{ if(seq===CMP_SEQ) $('frameA').srcdoc = res.ok ? res.text : calmFrame(paneFailCopy(res.status)); });
  apiHtml(previewPath(b)).then((res)=>{ if(seq===CMP_SEQ) $('frameB').srcdoc = res.ok ? res.text : calmFrame(paneFailCopy(res.status)); });
}
// SS10 (3/5) transient vs permanent copy split — a too-old version (410/404)
// is permanent for that pair; anything else is a hiccup worth retrying.
function compareFailCopy(status){
  return (status===410 || status===404)
    ? 'One of these versions is too old to compare — pick a more recent pair.'
    : 'We couldn’t compare those two versions just now — please try again in a moment.';
}
function paneFailCopy(status){
  return (status===410 || status===404)
    ? 'This version can’t be shown anymore.'
    : 'We couldn’t draw this version just now — please try again in a moment.';
}

// Version pickers come from the EXISTING GET /publishes rows (the friendly
// /snapshot-history projection deliberately carries no version ids).
async function initCompare(){
  const sec = $('compare');
  const res = await api('/publishes');
  if(!res.ok){
    // SS10 (3/5): the compare tool must NEVER fail silently. The history list
    // above is complete and unaffected — say so, and offer a retry in place.
    sec.hidden = false;
    sec.querySelector('.cmp-pick').hidden = true;
    sec.querySelector('.panes').hidden = true;
    $('cmpStrip').innerHTML = `<p class="note">The compare tool couldn’t load just now — the versions above are complete and unaffected. <button class="cmpretry" id="cmpRetry" type="button">Try again</button></p>`;
    const rt=$('cmpRetry'); if(rt) rt.addEventListener('click', initCompare);
    return;
  }
  const rows = (res.body && res.body.data) || [];
  const live = Array.isArray(rows) ? rows.filter((p)=>p.status==='live') : [];
  if(!live.length){ sec.hidden = true; return; }   // nothing published → nothing to compare
  const when = (p)=>{ const d=new Date(p.completed_at||p.at); return isNaN(d)?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
  const opts = [{ value:'draft', text:'Your working draft' }, { value:'live', text:'Current live site' }];
  live.slice(1).forEach((p)=>{ if(p.restorable) opts.push({ value:p.id, text:(p.label||p.summary||'Version')+' — '+when(p) }); });
  const fill = (sel)=>{ sel.innerHTML = opts.map((o)=>`<option value="${esc(o.value)}">${esc(o.text)}</option>`).join(''); };
  fill($('cmpA')); fill($('cmpB'));
  $('cmpA').value = opts.length>2 ? opts[2].value : 'draft';   // latest previous version, else the draft
  $('cmpB').value = 'live';
  // onchange assignment (not addEventListener) so a soft-refresh re-init never stacks listeners
  $('cmpA').onchange = runCompare;
  $('cmpB').onchange = runCompare;
  sec.querySelector('.cmp-pick').hidden = false;
  sec.querySelector('.panes').hidden = false;
  sec.hidden = false;
  runCompare();
}

function signedOut(){ $('lhead').hidden = true; $('sub').textContent=''; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2>Sign in to see your website versions.</h2><p class="sub">Your saved versions live with your account — sign in to look back through them.</p><p style="margin-top:22px"><a class="link" href="/studio.html">Sign in →</a></p></div>`; }
// SS8 honest failure states, each distinct. A 403 is NOT a hiccup: this account
// simply can't see this website's versions — "refresh in a moment" would be a
// permanent lie. A 404 means the site is gone. trouble() alone is transient.
function notAllowed(){ $('lhead').hidden = true; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2>These versions aren’t in your workspace.</h2><p class="sub">You’re signed in, but this account can’t see this website’s saved versions. If you look after more than one business, switch to the right account and try again.</p><p style="margin-top:22px"><a class="link" href="/today.html">Back to Today →</a></p></div>`; }
function notFound(){ $('lhead').hidden = true; $('main').innerHTML = `<div class="center"><h2>We couldn’t find this website.</h2><p class="sub">It may have been removed, or this link may be out of date.</p><p style="margin-top:22px"><a class="link" href="/today.html">Back to Today →</a></p></div>`; }
function trouble(){ $('lhead').hidden = true; $('main').innerHTML = `<div class="center"><h2>We couldn’t load your versions just now.</h2><p class="sub">Nothing’s wrong with your website — this is only this page.</p><button class="retry" id="retry" type="button">Try again</button></div>`; const rt=$('retry'); if(rt) rt.addEventListener('click', ()=>load()); }

// SS8 family load(soft): REQ_SEQ so a superseded response never paints; soft
// (the ↻ button) keeps the last good render on failure and toasts. Hard loads
// show the ghost stencil only after 300ms — fast reads never flash.
let REQ_SEQ = 0, STENCIL_TIMER = 0;
function stencil(){ $('main').innerHTML = `<div class="stencil" role="status" aria-label="Loading your versions"><div class="gh"></div><div class="gh"></div><div class="gh"></div></div>`; }
async function load(soft){
  const seq = ++REQ_SEQ;
  clearTimeout(STENCIL_TIMER);
  if(!soft){ $('main').innerHTML = ''; STENCIL_TIMER = setTimeout(() => { if(seq === REQ_SEQ) stencil(); }, 300); }
  const r = await api('/snapshot-history');
  if(seq !== REQ_SEQ) return;
  clearTimeout(STENCIL_TIMER);
  if(!r.ok){
    if(soft){ toast('Couldn’t refresh just now.'); return; }
    if(r.status === 401){ signedOut(); return; }
    if(r.status === 403){ notAllowed(); return; }
    if(r.status === 404){ notFound(); return; }
    trouble(); return;
  }
  LOADED_AT = Date.now();
  render(r.body && r.body.data);
  initCompare();   // G9 — never blocks or breaks the history list above
}

(async function init(){
  $('refreshBtn').addEventListener('click', () => load(true));   // wrapped — the click event must never become the soft flag
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    await load();
  }catch(_){ trouble(); }
})();
</script>
