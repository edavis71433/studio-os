<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your website versions — Studio OS</title>
<meta name="description" content="Every saved version of your website — revisit or restore an earlier edition anytime.">
<link rel="stylesheet" href="/cms.css">
<style>
  header .sub{color:var(--soft);font-size:15.5px;margin:0;max-width:54ch}

  .group{margin-top:32px}
  .glabel{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:0 0 13px}

  .ver{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 19px;box-shadow:var(--shadow);margin-bottom:12px}
  .ver.current{border-color:var(--accent)}
  .top{display:flex;gap:14px;align-items:flex-start}
  .ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px}
  .hd{flex:1;min-width:0}
  .vname{font-family:var(--serif);font-weight:500;font-size:18px;margin:0;line-height:1.3;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--accent);background:var(--accent-soft)}
  .vdate{margin:3px 0 0;font-size:13px;color:var(--faint)}
  .vwhy{margin:8px 0 0;font-size:14px;color:var(--soft);line-height:1.45}
  .vchanged{margin:6px 0 0;font-size:14px;color:var(--ink)}
  .vchanged .lab{font-weight:700;color:var(--faint);font-size:12px;letter-spacing:.02em;text-transform:uppercase;margin-right:6px}
  .row{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}
  a.act{display:inline-block;font-size:13.5px;font-weight:600;text-decoration:none;border-radius:999px;padding:7px 15px;transition:background .15s,border-color .15s;border:1px solid var(--line);color:var(--accent)}
  a.act:hover{background:var(--accent-soft);border-color:var(--accent)} a.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a.act.primary{background:var(--accent);color:#fff;border-color:var(--accent)} a.act.primary:hover{filter:brightness(1.06);background:var(--accent)}

  .center{text-align:center;padding:56px 20px}
  .center .mark{font-size:40px;display:block;margin-bottom:12px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px}
  .center .sub{color:var(--soft);font-size:15px;max-width:44ch;margin:0 auto}
  .foot{margin-top:32px;color:var(--faint);font-size:12.5px;text-align:center}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/today.html">← Back to Today</a>
    <h1>Your website versions</h1>
    <p class="sub" id="sub">Every saved version of your website, newest first — like flipping through past editions. You can revisit or restore an earlier one anytime.</p>
  </header>
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// CMS-UX-8 — Snapshot History, rendered.
// Consumes ONLY the existing read-only projection: GET /snapshot-history.
// Preview and Restore link to the existing editor version-history surface.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN = SUPABASE_URL + "/functions/v1/presence";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLIENT = new URLSearchParams(location.search).get('client') || '';
let TOKEN = "";
sb.auth.onAuthStateChange(function(_e,s){ if(s&&s.access_token) TOKEN=s.access_token; });

const H = () => ({ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN, 'x-dds-scope-site':CLIENT });
async function apiGet(p){ const r = await fetch(FN+p, { headers:H() }); if(r.status===401) return Promise.reject(401); return r.ok ? r.json() : Promise.reject(r.status); }
function href(link){ if(!link) return null; if(!CLIENT) return link; const [b,h]=String(link).split('#'); return b + (b.includes('?')?'&':'?') + 'client=' + encodeURIComponent(CLIENT) + (h?'#'+h:''); }

function verHtml(c){
  const badge = c.is_current ? `<span class="badge">Live now</span>` : '';
  const acts = [];
  if(c.can_preview && c.preview_href){ acts.push(`<a class="act${c.is_current?' primary':''}" href="${esc(href(c.preview_href))}">${c.is_current ? 'View your website' : 'Preview this version'}</a>`); }
  if(c.can_restore && c.restore_href){ acts.push(`<a class="act primary" href="${esc(href(c.restore_href))}">Restore this version</a>`); }
  const changed = c.what_changed ? `<p class="vchanged"><span class="lab">What changed</span>${esc(c.what_changed)}</p>` : '';
  return `<article class="ver${c.is_current?' current':''}">
    <div class="top">
      <span class="ic" aria-hidden="true">${esc(c.icon||'•')}</span>
      <div class="hd">
        <p class="vname">${esc(c.name)} ${badge}</p>
        <p class="vdate">Published ${esc(c.published_on)} · ${esc(c.when)}</p>
        <p class="vwhy">${esc(c.why)}</p>
        ${changed}
        ${acts.length ? `<div class="row">${acts.join('')}</div>` : ''}
      </div>
    </div>
  </article>`;
}
function groupHtml(g){
  return `<section class="group">
    <p class="glabel">${esc(g.label)}</p>
    ${(g.versions||[]).map(verHtml).join('')}
  </section>`;
}

function render(h){
  const groups = (h && h.groups) || [];
  if(!groups.length){
    $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">📚</span>
      <h2>No saved versions yet.</h2>
      <p class="sub">Each time you publish your website, that edition is saved here — so you can always look back or restore one. Publish once and your first version appears.</p>
      <p style="margin-top:22px"><a class="link" href="${esc(href('/presence.html')||'/presence.html')}">Open your website →</a></p></div>`;
    return;
  }
  if(h.headline) $('sub').textContent = h.headline + ' You can revisit or restore an earlier one anytime — nothing is ever lost.';
  $('main').innerHTML = groups.map(groupHtml).join('')
    + `<p class="foot">Every published edition is saved automatically. Restoring brings an earlier version back as your live website — you can always switch again.</p>`;
}

function signedOut(){ $('sub').textContent=''; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2>Sign in to see your website versions.</h2><p class="sub">Your saved versions live with your account — sign in to look back through them.</p><p style="margin-top:22px"><a class="link" href="/portal.html">Sign in →</a></p></div>`; }
function trouble(){ $('main').innerHTML = `<div class="center"><h2>We couldn’t load your versions just now.</h2><p class="sub">Nothing’s wrong with your website — this is only this page. Please refresh in a moment.</p></div>`; }

(async function init(){
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    const res = await apiGet('/snapshot-history');
    render(res && res.data);
  }catch(e){ if(e === 401){ signedOut(); return; } trouble(); }
})();
</script>
</body>
</html>
