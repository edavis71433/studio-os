<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Join the list</title>
<style>
  :root{--bg:#faf8f5;--ink:#1b1525;--soft:#6b6478;--line:#e4dfec;--card:#fff;--plum:#5b3fa0;--on-plum:#fff;--warn:#a3423a}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--ink:#efeaf7;--soft:#a79ebc;--line:#2e2740;--card:#1f1a2b;--plum:#b79ceb;--on-plum:#171320;--warn:#f0a39b}}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .center{max-width:520px;margin:12vh auto;padding:0 20px;text-align:center}
  h1{font-weight:500;font-size:clamp(20px,5vw,26px);margin-bottom:8px}
  .muted{color:var(--soft);font-size:15px}
  .who{margin:18px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow-wrap:anywhere}
  button{margin-top:18px;min-height:44px;padding:10px 22px;border:0;border-radius:999px;background:var(--plum);color:var(--on-plum);font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--warn);font-size:14px;margin-top:10px;min-height:1.4em}
</style>
</head>
<body>
<main class="center" id="state"><p class="muted">One moment…</p></main>
<script>
// Builder list item 203: "Join our list" on a client's website no longer adds whoever's
// address was typed. It emails that address a "Yes, add me" link, which lands here with
// ?t=<signed link>. This page says who and what first, since mail scanners open links on
// their own; only the button adds them. The function at *.supabase.co can't show a page,
// so this page on the app asks it: GET to read the link, POST to say yes.
(function(){
  var q=new URLSearchParams(location.search);
  var FN=(q.get('env')==='staging'?'https://wjlpursnwbmlcdwbeowv.supabase.co':'https://qksstlqzbhesadrrofgn.supabase.co')+'/functions/v1/presence';
  var t=q.get('t')||'';
  var state=document.getElementById('state');
  function line(tag,cls,text){ var n=document.createElement(tag); if(cls) n.className=cls; n.textContent=text; state.appendChild(n); return n; }
  function bad(msg){ state.innerHTML=''; line('h1','','That link didn’t work'); line('p','muted',msg||'The link looks incomplete. Join again on the website.'); }
  function offline(){ state.innerHTML=''; line('h1','','This page couldn’t load'); line('p','muted','Check your connection, then reload the page.'); }
  function call(method,body){
    var url=FN+'/join'+(method==='GET'?'?t='+encodeURIComponent(t):'');
    return fetch(url,body?{method:method,headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify(body)}:{method:method,headers:{Accept:'application/json'}})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {r:r,j:j}; }); });
  }
  function joined(d){
    state.innerHTML='';
    line('h1','','You’re on the list. Thank you!');
    line('p','muted',(d.business?d.business+' will send updates to ':'Updates will go to ')+d.email+'. Every email has an unsubscribe link.');
    document.title='You’re on the list';
  }
  function ask(d){
    state.innerHTML='';
    line('h1','',d.business?'Join '+d.business+'’s list?':'Join the list?');
    line('p','muted','Updates by email. You can unsubscribe at any time.');
    line('p','who',d.email);
    var b=document.createElement('button'); b.type='button'; b.textContent='Yes, add me'; state.appendChild(b);
    var err=line('p','err',''); err.setAttribute('role','alert');
    b.addEventListener('click',function(){
      b.disabled=true; err.textContent='';
      call('POST',{t:t}).then(function(o){
        if(!o.r.ok){ b.disabled=false; err.textContent=(o.j&&o.j.message)||'That didn’t go through. Try again in a moment.'; return; }
        joined(d);
        state.setAttribute('role','status');
      }).catch(function(){ b.disabled=false; err.textContent='That didn’t go through. Check your connection and try again.'; });
    });
  }
  if(!t){ bad(''); return; }
  call('GET').then(function(o){
    if(!o.r.ok){ bad(o.j&&o.j.message); return; }
    var d=(o.j&&o.j.data)||{};
    if(d.joined) joined(d); else ask(d);
  }).catch(offline);
})();
</script>
</body>
</html>
