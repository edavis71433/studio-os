<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Document</title>
<link rel="stylesheet" href="/fonts/brand.css">
<!-- The fetched document replaces this page entirely, bringing its own print CSS and toolbar.
     Builder item 349: the loading and "link not working" states wear the one public frame
     (the studio's band, a card, its contact line) instead of a blank page. -->
<link rel="stylesheet" href="/public-frame.css">
<script src="/public-frame.js" defer></script>
</head>
<body>
<header class="pf-band" data-pf-band><div class="pf-in"><div class="pf-studio" id="pf-studio" data-pf-studio aria-live="polite"></div></div></header>
<main class="pf-wrap" id="main-content"><div class="pf-card pf-center" id="state" data-pf-card><p>Preparing your document…</p></div></main>
<footer class="pf-foot" data-pf-foot></footer>
<script>
// The Document of Record viewer. Emailed/portal doc links land here with
// ?t=<signed token>. The document itself is SERVER-RENDERED by the presence
// function (GET /sales/doc/<token>) — but Supabase's default *.supabase.co
// domain rewrites GET text/html responses to text/plain, so that URL can't be
// opened directly in a browser. This page (on our origin) fetches the same
// route and writes the returned HTML into the document, preserving its inline
// print CSS and toolbar exactly. The endpoint is token-gated and public — no
// auth headers needed (the gateway runs with --no-verify-jwt).
(async function(){
  var FN="https://qksstlqzbhesadrrofgn.supabase.co/functions/v1/presence";
  var qs=new URLSearchParams(location.search);
  var t=qs.get('t')||'';
  var viewOnly=qs.get('view')==='1';   // builder item 345: opened from a studio's preview of the portal: read it, press nothing
  // Sales items 79 and 92: the server's own "not working" page names who sent the document
  // and why (expired, or no longer there); it is shown when the server sent one. This line is
  // only for no answer at all, so it names nobody.
  function fail(){
    document.getElementById('state').innerHTML='<h1>This document link isn’t working</h1><p>It may have expired. Ask whoever sent it for a fresh copy. Nothing is lost.</p>';
  }
  if(!t){fail();return;}
  try{
    var r=await fetch(FN+'/sales/doc/'+encodeURIComponent(t));
    var html=await r.text();
    if(!r.ok){
      if(/<h1[^>]*>This document link isn’t working<\/h1>/.test(html)){document.open();document.write(html);document.close();}
      else fail();
      return;
    }
    // Our own first-party server-rendered document (all user data is escaped
    // server-side); document.write swaps it in wholesale so its print behavior
    // is byte-identical to the direct render.
    document.open();document.write(html);document.close();
    if(viewOnly)readOnly();
  }catch(_){fail();}
  // item 345: the paper as the client sees it, with accept, sign and pay taken away, and a strip saying so
  function readOnly(){
    try{
      document.querySelectorAll('form, button, input, textarea, select').forEach(function(n){ if(n.tagName==='FORM'){n.remove();return;} n.disabled=true; n.setAttribute('aria-disabled','true'); });
      document.querySelectorAll('a[href]').forEach(function(a){ var h=a.getAttribute('href')||''; if(/stripe\.com|\/pay\b|\/sign\b|\/approve|\/accept|\/decide/i.test(h)){ a.removeAttribute('href'); a.setAttribute('aria-disabled','true'); a.style.opacity='.5'; a.style.pointerEvents='none'; } });
      var bar=document.createElement('div');bar.setAttribute('role','note');bar.style.cssText='position:sticky;top:0;z-index:50;background:#241d38;color:#efeaf7;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:10px 16px;text-align:center';
      bar.textContent='You’re seeing this as the client sees it. Nothing here is saved, signed or paid.';
      document.body.insertBefore(bar,document.body.firstChild);
    }catch(_){}
  }
})();
</script>
</body>
</html>
