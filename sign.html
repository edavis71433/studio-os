<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Review &amp; sign</title>
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Sales items 88 and 106: the client's proposal and agreement page, as drawn in Figma
     (file HSP7ScFSz2mg1xGzHRrEZi, page 257:4330): a header band in the studio's colour,
     the three steps, the proposal beside its answer, the agreement as a document with
     its contents and both signatures, and what is paid when. */
  :root{--bg:#f7f5f1;--card:#fff;--ink:#1b1525;--soft:#6b6478;--line:#ebe6dd;--p:#5b3fa0;--pt:#5b3fa0;--brand:#5b3fa0;--btn-ink:#fff;--good:#2f6b4a;--good-soft:#e6f1ea;--good-ink:#fff;--lilac:#f0eafb;--lilac-ink:#5b3fa0;--pale-ink:#7d64b8;--err:#a3423a;
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  /* dark mode: the accent lifts to #b79ceb, so filled controls need dark ink (#fff on #b79ceb fails contrast) */
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--line:#2d2640;--p:#b79ceb;--pt:#c9b6f2;--btn-ink:#171320;--good:#8bbf9f;--good-soft:#1f2a24;--good-ink:#171320;--lilac:#29213b;--lilac-ink:#cdb8f5;--pale-ink:#b9a5e6;--err:#e08b83}}
  /* the soft tints follow the studio's own colour where the browser can mix one */
  @supports (color:color-mix(in srgb,red 50%,white)){
    :root{--lilac:color-mix(in srgb,var(--p) 11%,#fff);--lilac-ink:var(--pt);--pale-ink:color-mix(in srgb,var(--pt) 74%,#fff)}
    @media (prefers-color-scheme:dark){:root{--lilac:color-mix(in srgb,var(--p) 16%,#1f1a2b);--lilac-ink:var(--pt);--pale-ink:color-mix(in srgb,var(--pt) 82%,#1f1a2b)}}
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .in{max-width:1200px;margin:0 auto;padding:0 40px}
  .wrap{max-width:640px;margin:0 auto;padding:44px 20px 90px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
  .muted{color:var(--soft);font-size:14.5px;margin-top:12px}
  .fine{color:var(--soft);font-size:13.5px;line-height:1.5;margin-top:14px}
  .sub{color:var(--soft);font-size:15.5px;margin:0 0 18px}
  .center{text-align:center;padding:56px 20px}
  .center h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,5vw,34px);margin:6px 0 8px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:80px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  label{display:block;font-size:13.5px;font-weight:600;color:var(--soft);margin:14px 0 6px}
  input,textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;outline:none}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus{border-color:var(--p);background:var(--card);box-shadow:0 0 0 3px rgba(91,63,160,.16)}
  input:focus-visible,textarea:focus-visible{outline:none}
  button,.paybtn{font-family:inherit;font-size:16px;font-weight:600;line-height:1.2;border-radius:999px;border:1.5px solid var(--p);background:var(--p);color:var(--btn-ink);padding:14px 26px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
  button.ghost{background:transparent;color:var(--pt)}
  button.link{background:none;border:none;padding:6px 8px;color:var(--ink);font-weight:500;font-size:15px;text-decoration:underline;text-underline-offset:3px}
  button.danger{background:transparent;color:var(--err);border-color:var(--line)}
  button:disabled{opacity:.5;cursor:default}
  :focus-visible{outline:3px solid var(--p);outline-offset:2px}
  .row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
  .ok{background:var(--good-soft);color:var(--good);border-radius:12px;padding:14px 16px;font-weight:600;margin-top:14px}
  .err{color:var(--err);font-size:14.5px;margin-top:12px}
  /* the header band: who it's from, what it is, what it costs */
  .hero{background:var(--brand);background:linear-gradient(100deg,color-mix(in srgb,var(--brand) 30%,#130a22) 0%,color-mix(in srgb,var(--brand) 62%,#130a22) 48%,var(--brand) 100%);color:#fff}
  .hero .in{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who who" "eye tot" "h1 tot" "meta tot";column-gap:32px;padding-top:38px;padding-bottom:46px;align-items:end}
  .hero .who{grid-area:who;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-bottom:28px}
  .hero .mk{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
  .hero .eyebrow{grid-area:eye;color:rgba(255,255,255,.82)}
  .hero h1{grid-area:h1;font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,54px);line-height:1.08;letter-spacing:-.01em;margin:8px 0 12px;overflow-wrap:anywhere}
  .hero h1 .dot{opacity:.8;margin:0 .15em}
  .hero .meta{grid-area:meta;color:rgba(255,255,255,.82);font-size:14.5px}
  .hero .meta span+span::before{content:'·';margin:0 .6em}
  .hero .tot{grid-area:tot;text-align:right}
  .hero .tot .lbl{font-size:14px;color:rgba(255,255,255,.82)}
  .hero .tot .amt{font-family:var(--serif);font-weight:600;font-size:clamp(40px,5vw,60px);line-height:1.05;margin:2px 0 8px}
  .pill{display:inline-block;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:500}
  /* the three steps */
  .stepbar{background:var(--card);border-bottom:1px solid var(--line)}
  .stepbar .in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex-wrap:wrap}
  .steps{display:flex;align-items:center;list-style:none;padding:0;margin:0;gap:12px}
  .steps li{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--soft)}
  .steps li:not(:last-child)::after{content:'';display:block;width:88px;height:2px;border-radius:2px;background:var(--line);margin-left:6px}
  .steps .n{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);background:var(--card);flex:none}
  .steps li.now{color:var(--pt)}
  .steps li.now .n{background:var(--p);border-color:var(--p);color:var(--btn-ink)}
  .steps li.done{color:var(--good)}
  .steps li.done .n{background:var(--good);border-color:var(--good);color:var(--good-ink)}
  .stepbar .note{color:var(--soft);font-size:14.5px}
  /* the page under them */
  .page{padding:36px 0 72px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:0 1px 2px rgba(27,21,37,.04),0 12px 32px rgba(27,21,37,.06)}
  .card.locked{border-style:dashed;box-shadow:none;background:transparent}
  .notice h2{font-family:var(--serif);font-weight:500;font-size:24px;margin-bottom:4px}
  .stack>*+*{margin-top:20px}
  .sec{margin:34px 0 12px}
  .sec:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) 356px;gap:28px;align-items:start}
  table{width:100%;border-collapse:collapse}
  .items td{padding:15px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:15.5px}
  .items td+td{text-align:right;white-space:nowrap;padding-left:18px;font-weight:500}
  .items .lbl{font-weight:600}
  .items .q{color:var(--soft);font-weight:500}
  .items tr.sub td{padding:6px 0;border-bottom:none;color:var(--soft);font-size:14.5px;font-weight:400}
  .items tr.sub.first td{padding-top:14px}
  .items tr.total td{border-bottom:none;padding-top:14px;font-weight:700;font-size:17px}
  .items tr.total td+td{font-family:var(--serif);font-size:23px;font-weight:600}
  .parts{list-style:none;padding:0;margin:0}
  .parts li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:16px;position:relative;padding-bottom:24px}
  .parts li:last-child{padding-bottom:0}
  .parts li:not(:last-child)::before{content:'';position:absolute;left:14px;top:34px;bottom:4px;width:2px;background:var(--line)}
  .parts .pn{width:30px;height:30px;border-radius:50%;background:var(--lilac);color:var(--lilac-ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .parts li.first .pn{background:var(--p);color:var(--btn-ink)}
  .parts .pt{font-weight:600;font-size:15.5px;padding-top:3px}
  .parts .ps{color:var(--soft);font-size:14px;margin-top:2px}
  .parts .pa{font-weight:600;font-size:15.5px;white-space:nowrap;padding-top:3px}
  .terms{white-space:pre-wrap;font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
  .side{position:sticky;top:24px;padding:28px}
  .side .lbl{font-size:14px;color:var(--soft)}
  .side .big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1.1;margin:4px 0 10px}
  .side .why{color:var(--soft);font-size:15px;margin-bottom:20px}
  .acts{display:flex;flex-direction:column;gap:12px}
  .acts button{width:100%}
  .side .link{display:block;margin:10px auto 0}
  .side .fine{border-top:1px solid var(--line);padding-top:14px}
  .sm{display:none}
  /* the agreement: its contents beside it, the document, then both signatures */
  .agree{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
  .agree.solo{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;padding:4px 4px 12px 0}
  .rail ol,.toc ol{list-style:none;padding:0;margin:10px 0 0}
  .grp{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:16px 0 4px}
  .rail a,.toc a{display:flex;gap:10px;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
  .rail a .rn,.toc a .rn{color:var(--pt);font-weight:600;min-width:16px}
  .rail a:hover,.rail a.on,.toc a:hover{background:var(--lilac);color:var(--lilac-ink)}
  .rail .rail-sig{margin-top:14px;border:1.5px solid var(--p);color:var(--pt);font-weight:600}
  .toc{display:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 4px}
  .toc summary{cursor:pointer;font-weight:600;font-size:14.5px}
  .doc-t{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3.4vw,34px);line-height:1.15;margin:10px 0 22px}
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
  .party{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .party .pn{font-weight:600;margin-top:4px}
  .party .ps{color:var(--soft);font-size:14px}
  .agreement{font-size:15.5px;line-height:1.65}
  .ag-h{display:flex;align-items:baseline;gap:14px;font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.25;margin:34px 0 10px;scroll-margin-top:20px}
  .ag-h.plain{font-size:19px}
  .ag-n{color:var(--pt);font-size:30px;min-width:24px}
  .ag-p{white-space:pre-wrap;margin:0 0 12px 38px;overflow-wrap:anywhere}
  .ag-item{display:flex;gap:10px;margin:0 0 8px 38px}
  .ag-mark{color:var(--pt);font-weight:600;flex:none}
  .sigs{border-top:1px solid var(--line);margin-top:36px;padding-top:30px;scroll-margin-top:20px}
  .sec-t{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:18px}
  .sigrow{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .sig{border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px}
  .sig.studio{background:var(--lilac);border-color:transparent}
  .sig label{color:var(--ink)}
  .sig .ink{font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;line-height:1.25;min-height:52px;padding:8px 2px 4px;border-bottom:1.5px solid var(--line);margin-top:16px;overflow-wrap:anywhere}
  .sig.studio .ink{color:var(--pale-ink);border-color:var(--pale-ink)}
  .sig .hint{color:var(--soft);font-size:13px;margin-top:6px}
  .sig .who2{color:var(--soft);font-size:14px;margin-top:8px}
  .sig .auto{color:var(--lilac-ink);font-size:14px;margin-top:12px;line-height:1.5}
  /* signed: the news, both signatures, what's next */
  .banner{display:flex;align-items:center;gap:16px;background:var(--good-soft);border-radius:16px;padding:18px 22px;margin-bottom:22px}
  .banner .bc{width:34px;height:34px;border-radius:50%;background:var(--good);color:var(--good-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .banner .bt{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--good)}
  .banner .bs{color:var(--good);font-size:14.5px}
  .banner .btn-w{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-family:inherit;font-size:15px;font-weight:600;line-height:1.2;padding:10px 18px;text-decoration:none;cursor:pointer}
  .grid-signed{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
  .sigcard{padding:28px}
  .fp{font-family:var(--mono);font-size:12.5px;color:var(--soft);margin-top:18px;overflow-wrap:anywhere}
  .next{padding:28px}
  .next .eyebrow{color:var(--pt)}
  .next h3{font-family:var(--serif);font-weight:500;font-size:26px;margin:6px 0 2px}
  .next .big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1.1;margin:4px 0 16px}
  .next .paybtn{width:100%}
  details.done{padding:0;margin-top:20px}
  details.done summary{cursor:pointer;list-style:none;padding:18px 24px;font-weight:600;color:var(--good);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
  details.done summary::-webkit-details-marker{display:none}
  details.done summary .tog{color:var(--soft);font-weight:500;font-size:13.5px;margin-left:auto}
  details.done summary .tog::after{content:'Show details'}
  details.done[open] summary .tog::after{content:'Hide details'}
  details.done summary:focus-visible{outline:2px solid var(--p);outline-offset:-2px;border-radius:20px}
  details.done .inner{padding:0 24px 24px}
  .cert{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
  .cert .ct{font-weight:600;margin-bottom:8px}
  .cert .kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .cert .kv span:first-child{color:var(--soft);white-space:nowrap}
  .mono{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;text-align:right}
  .foot{text-align:center;color:var(--soft);font-size:14px;padding:0 16px 40px}
  /* the two answers that open over the page: a question, a decline */
  dialog.sheet{border:none;padding:0;margin:auto;border-radius:22px;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 24px 64px rgba(19,10,34,.35)}
  dialog.sheet::backdrop{background:rgba(19,10,34,.55)}
  .sheet-in{padding:28px}
  .sheet-in h2{font-family:var(--serif);font-weight:500;font-size:28px;margin-bottom:8px}
  .sheet-in .sub{margin-bottom:16px}
  .sheet-in textarea{min-height:110px}
  .grab{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .chip{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:500;font-size:15px;padding:9px 16px}
  .chip[aria-pressed="true"]{background:var(--lilac);border-color:var(--p);color:var(--lilac-ink)}
  .stackb{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .stackb button{width:100%}
  @media (max-width:1100px){.agree{grid-template-columns:minmax(0,1fr)}.rail{display:none}.toc{display:block}}
  @media (max-width:900px){
    .grid2,.grid-signed{grid-template-columns:minmax(0,1fr)}
    .side{position:static}
    .side .lbl,.side .big{display:none}
    .acts.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;flex-direction:row-reverse;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(27,21,37,.08)}
    .acts.bar button{width:auto;padding:13px 22px}
    .acts.bar #accept{flex:1}
    .acts.bar .lg{display:none}.acts.bar .sm{display:inline}
    body.has-bar .page{padding-bottom:110px}
    .banner{flex-wrap:wrap}.banner .btn-w{margin-left:0}
  }
  @media (max-width:760px){.sigrow,.parties{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:640px){
    .in{padding:0 16px}
    .hero .in{grid-template-columns:minmax(0,1fr);grid-template-areas:"who" "eye" "h1" "tot" "meta";padding-top:20px;padding-bottom:24px}
    .hero .who{margin-bottom:20px}
    .hero h1{font-size:34px;margin:6px 0 10px}
    .hero .tot{text-align:left;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
    .hero .tot .lbl{display:none}
    .hero .tot .amt{font-size:34px;margin:0}
    .pill .lg{display:none}
    .stepbar .in{min-height:52px}
    .steps{gap:8px}.steps li{font-size:13.5px;gap:7px}.steps li:not(:last-child)::after{width:18px;margin-left:2px}.steps .n{width:22px;height:22px;font-size:11px}
    .stepbar .note{display:none}
    .page{padding:16px 0 48px}
    .card,.side,.sigcard,.next{padding:20px;border-radius:16px}
    .items td{padding:12px 0;font-size:15px}
    .parts li{gap:12px;padding-bottom:16px}
    .parts .pt .sep,.parts .ps{display:none}
    .parts .pt .w{display:block;font-weight:400;color:var(--soft);font-size:14px}
    .ag-h{font-size:20px;gap:10px;margin-top:26px}.ag-n{font-size:24px;min-width:18px}
    .ag-p,.ag-item{margin-left:0}
    #signRow{flex-direction:column}#signRow button{width:100%}
    .banner{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}.banner .bt{font-size:19px}.banner .btn-w{grid-column:1/-1;justify-self:start}
    dialog.sheet{margin:auto 0 0;max-width:none;width:100%;border-radius:22px 22px 0 0}
    .sheet-in{padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px))}
    .grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
  }
  /* print: the signed agreement and its certificate, cleanly, with no buttons */
  @media print{
    body{background:#fff}
    .no-print,.stepbar,.row,button,.paybtn,.spin,.rail,.toc,.acts,dialog{display:none!important}
    .hero{background:#fff!important;color:#000}
    .hero .eyebrow,.hero .meta,.hero .tot .lbl{color:#444}
    .card{box-shadow:none;border:1px solid #bbb}
    .grid2,.grid-signed,.agree{display:block}
    .cert{break-inside:avoid}
  }
</style>
</head>
<body>
<div id="main"><div class="spin" role="status" aria-label="Loading"></div></div><div id="sr-status" role="status" aria-live="polite" class="sr"></div>
<script>
// The public review & sign page. The email's "Review & sign" link lands here with
// ?t=<signed token>. Reads the proposal/contract via the token-gated public view,
// then accepts or signs — nothing final until the client acts.
//
// Two shapes of link land here:
//   • a deal-bound `flow` token (every send since Oct 2026): ONE page that walks
//     choose → sign → pay — the proposal, then the agreement unlocks, then the
//     deposit. Done steps collapse below; the open step is the page; the rest
//     wait in the strip (the server locks them too — see handleSalesPublicView).
//   • a per-document `proposal`/`contract` token (links sent before): the single
//     document, so an old email keeps working.
const FN="https://qksstlqzbhesadrrofgn.supabase.co/functions/v1/presence";

const isCapsLine=(s)=>{const L=s.replace(/[^A-Za-z]/g,'');return L.length>=3&&s.length<=90&&L===L.toUpperCase()&&!/[.:;,]$/.test(s.trim());};
function agreementBlocks(body){
  const lines=String(body==null?'':body).replace(/\r\n?/g,'\n').split('\n');
  const out=[];let para=[];let hn=0;
  const flush=()=>{if(para.length){out.push({t:'para',text:para.join('\n')});para=[];}};
  const heading=(n,text)=>{hn++;out.push({t:'heading',n,text,id:'s'+hn});};
  for(const raw of lines){
    const line=raw.replace(/\s+$/,'');
    const s=line.trim();
    if(!s){flush();continue;}
    if(!out.length&&!para.length&&isCapsLine(s)&&!/^\d{1,2}\.\s/.test(s)){out.push({t:'title',text:s});continue;}
    let m=/^(\d{1,2})\.\s+(.+)$/.exec(s);
    if(m){
      const rest=m[2].trim();
      if(isCapsLine(rest)){flush();heading(m[1],rest);continue;}
      const named=/^([A-Z][A-Za-z ,&'’()\/-]{1,60}?)\.\s+(\S.*)$/.exec(rest);
      if(named){flush();heading(m[1],named[1]);para.push(named[2]);continue;}
      if(rest.length<=70&&!/[.;:]$/.test(rest)){flush();heading(m[1],rest);continue;}
    }
    if(isCapsLine(s)&&!/^\(?[a-z0-9]{1,3}\)/i.test(s)){flush();heading(null,s);continue;}
    m=/^\(([a-z0-9]{1,3})\)\s+(.+)$/i.exec(s)||/^([a-z])\)\s+(.+)$/.exec(s);

  return `<section id="step-sign" class="agree${rail?'':' solo'}">${rail}<article class="card doc"><p class="eyebrow">${esc(t?t.text:'Agreement')}</p><h2 class="doc-t">${esc(c.title||'Your agreement')}</h2>${partiesHtml(o.signer,o.client)}${toc}<div class="body agreement">${blocksHtml(blocks)}</div>${signFormHtml(o.signer,o.client)}<div class="row" id="signRow"><button id="sign" type="button">Sign the agreement</button><button class="ghost" id="askSign" type="button">Ask a question</button></div><p class="fine">Typing your name here counts as your signature. Your signed copy comes to you by email, with the PDF attached.${payHint}</p></article></section>`;
}
// what's next once it's signed: the part or deposit to pay, or that nothing is due yet
function payHtml(dep,rows,c,paid){
  const p1=rows&&rows[0]&&rows[0].when==='sign'&&dep&&rows[0].amount_cents===dep.amount_cents;
  const later=p1?rows.slice(1).map(r=>`${money(r.amount_cents)} ${laterWhen(r,c.signed_at)}`):[];
  const then=later.length?`Then ${andList(later)}. Each comes with its own invoice.`:'';

  if(paid)return `<div class="card next" id="step-pay"><p class="eyebrow">${esc(head)}</p><div class="ok">✓ ${p1?'Part 1 paid':'Deposit paid'} — thank you. Your studio has been told and will kick things off.</div>${then?`<p class="fine">${esc(then)}</p>`:''}</div>`;

  if(dep)return `<div class="card next" id="step-pay"><p class="eyebrow">Next step</p><h3>${esc(head)}</h3><p class="muted">Your ${money(dep.amount_cents)} deposit is being set up — your studio will send the payment link. Nothing to do now.</p></div>`;
  return `<div class="card next" id="step-pay"><p class="eyebrow">Next step</p><h3>All set for now</h3><p class="muted">Nothing to pay right now — your studio has been told you signed and will send an invoice when it’s time.</p></div>`;
}
// Signed: the news with the copy to keep, both signatures, and what's next
function signedHtml(c,o){
  const when=c.signed_at||new Date().toISOString();
  const both=!!c.countersigned_name;
  const fresh=o.after&&o.after.kind==='signed';
  const em=c.signer_email||'';
  const sub=fresh?(o.after.copy_emailed?`Your signed copy is on its way to ${em||'your email'}, with the PDF attached.`:'Your signed agreement stays on this page. Keep a copy with the button here.'):'Your signed agreement stays on this page whenever you need it.';
  const keep=c.pdf_url?`<a class="btn-w" id="pdf" href="${esc(c.pdf_url)}">Download the PDF</a>`:`<button class="btn-w" type="button" data-print>Print / save a copy</button>`;
  const banner=`<div class="banner"><span class="bc" aria-hidden="true">✓</span><div><h2 class="bt">${both?'Signed by both of you':'Signed'} on ${esc(dayOf(when))}</h2><p class="bs">${esc(sub)}</p></div>${keep}</div>`;
  const them=forWhom(o.client);
  const you=`<div class="sig"><p class="eyebrow">${them?'For '+esc(them):'Your signature'}</p><p class="ink">${esc(c.signer_name||'')}</p><p class="who2">${esc(c.signer_name||'')} · ${esc(momentOf(when))}</p>${em?`<p class="who2">${esc(em)}</p>`:''}</div>`;
  const studio=both?`<div class="sig"><p class="eyebrow">For ${esc(STUDIO||'the studio')}</p><p class="ink">${esc(c.countersigned_name)}</p><p class="who2">${esc(c.countersigned_name)}${c.countersigned_title?', '+esc(c.countersigned_title):''} · ${esc(momentOf(c.countersigned_at||when))}</p><p class="who2">Countersigned when ${esc(c.signer_name||'you')} signed.</p></div>`:'';
  const hash=String(c.content_hash||'');

// ── The one-page flow: choose → sign → pay ──────────────────────────────────
function renderFlow(d,after){
  const p=d.proposal,c=d.contract,dep=d.deposit;
  const pending=!p&&!!d.proposal_pending;             // between versions: the studio is updating the proposal
  const chosen=p?p.status==='accepted':!pending;     // no proposal ever in play → the agreement is the first step
  const signed=!!(c&&c.status==='signed');
  const paid=!!(dep&&dep.status==='paid');
  const T=p?proposalTotals(p.line_items):null;
  const rows=scheduleOf(p);
  const client=d.client||null;
  // the strip: every step the deal has, with its state
  const steps=[];
  if(p||pending)steps.push({key:'choose',label:'Choose',state:(p&&p.status==='accepted')?'done':'now'});
  steps.push({key:'sign',label:'Sign',state:signed?'done':chosen?'now':'locked'});
  steps.push({key:'pay',label:'Pay',state:paid?'done':signed?'now':'locked'});
  // only the FIRST open step is "now" — the ones after it wait their turn
  let seenNow=false;steps.forEach(s=>{if(s.state==='now'){if(seenNow)s.state='locked';seenNow=true;}});
  const title=(d.deal&&d.deal.title)||'Your proposal and agreement';
  const agreementTitle=`Agreement <span class="dot" aria-hidden="true">·</span> ${esc(title)}`;
  let hero,note='',body;
  if(!chosen){
    // ── 1 · Choose ──
    hero=heroHtml({eyebrow:forWhom(client)?`Proposal for ${forWhom(client)}`:'Proposal',title,meta:p?proposalMeta(p):[],total:p?T.total:null,pill:pillHtml(rows)});
    if(p&&p.status==='sent'&&!p.expired)note='Take your time. Nothing is final until you accept.';
    body=p?chooseHtml(p,{flow:true,dep}):`<div class="stack"><div class="card locked notice" id="step-choose"><h2>Your proposal</h2><p class="muted">Your studio is updating the proposal — you’ll get an email when the new version is ready. Nothing to do now.</p></div><div class="card locked notice" id="step-sign"><h2>Then the agreement</h2><p class="muted">Unlocks once you accept the updated proposal.</p></div></div>`;
  }else if(!c){
    // accepted, and the agreement is on its way
    hero=heroHtml({eyebrow:'Agreement',title,meta:[betweenLine(client)]});
    body=`<div class="card notice" id="step-sign"><h2>The agreement is on its way</h2><p class="muted">${p?'You’ve accepted — your studio has been told and is preparing the agreement. You’ll get an email when it’s ready to sign; nothing to do now.':'Your studio is preparing the agreement. You’ll get an email when it’s ready to sign.'}</p></div>${p?acceptedHtml(p,T,rows):''}`;
  }else if(!signed){
    // ── 2 · Sign ──
    hero=heroHtml({titleHtml:agreementTitle,meta:[betweenLine(client)]});
    note='One typed name signs it. Nothing is final until you do.';
    body=agreementStep(c,{signer:d.studio_signer,client,dep,rows,flow:true})+(p?acceptedHtml(p,T,rows):'');
  }else{
    // ── 3 · Pay, and after ──
    hero=heroHtml({titleHtml:agreementTitle,meta:[betweenLine(client),c.signed_at?'Signed '+dayOf(c.signed_at):'']});
    body=signedHtml(c,{client,dep,rows,after,paid})+signedDocHtml(c)+(p?acceptedHtml(p,T,rows):'');
  }
  paint(hero+stripHtml(steps,note)+pageHtml(body)+footHtml());
  // ── actions ──
  const a=$('accept');if(a)a.onclick=async()=>{a.disabled=true;const r=await api('/sales/proposals/'+p.id+'/decide','POST',{token:TOKEN,decision:'accepted'});
    if(r.ok){announce('Accepted — thank you. Next: sign the agreement.');await load({kind:'accepted'});}
    else softFail(r.body&&r.body.message,$('chooseRow'));};
  // Declining is final for this version, so it opens its own sheet: what would make it a yes, then Decline
  const dd=$('decline');if(dd)dd.onclick=()=>openDecline(p,dd,async()=>{announce('Declined. Your studio has been told.');await load({kind:'declined'});});
  const ab=$('askBtn');if(ab)ab.onclick=()=>openAsk('proposal',ab);
  wireSign(c,async(r)=>{announce('Signed — welcome aboard.');await load({kind:'signed',copy_emailed:!!(r.body&&r.body.data&&r.body.data.copy_emailed)});});
  watchRail();
  // after a step, land on the next one
  if(after){
    if(after.kind==='accepted'){const next=$('step-sign');if(next){next.scrollIntoView({block:'start',behavior:'smooth'});const f=$('nm');if(f)f.focus({preventScroll:true});}}
    else window.scrollTo({top:0,behavior:'smooth'});
  }
}
// the typed name signs: their name and email, and the version they read (content_hash)
function wireSign(c,onSigned){
  const s=$('sign');if(!s)return;
  const nm=$('nm'),ink=$('ink');
  if(nm&&ink)nm.addEventListener('input',()=>{ink.textContent=nm.value;});
  const ak=$('askSign');if(ak)ak.onclick=()=>openAsk('contract',ak);
  s.onclick=async()=>{const name=nm.value.trim(),em=$('em').value.trim();
    if(!name){softFail('Type your full name in the box above — that’s your signature.',$('signRow'));nm.focus();return;}
    // sales item 88: the signed copy goes to them, so their email is needed (the server asks the same)
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){softFail('Type your email too, so your signed copy can reach you.',$('signRow'));$('em').focus();return;}
    s.disabled=true;
    const r=await api('/sales/contracts/'+c.id+'/sign','POST',{token:TOKEN,signer_name:name,signer_email:em,presented_hash:c.content_hash});
    if(r.ok)await onSigned(r,name,em);
    else softFail(r.body&&r.body.message,$('signRow'));};
}
// the contents beside the agreement follow the reading
function watchRail(){
  if(window.__railIO){window.__railIO.disconnect();window.__railIO=null;}
  const links=[...document.querySelectorAll('.rail a[data-for]')];
  if(!links.length||!('IntersectionObserver' in window))return;
  const byId=new Map(links.map(x=>[x.dataset.for,x]));
  const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(!e.isIntersecting)return;links.forEach(x=>x.classList.remove('on'));const x=byId.get(e.target.id);if(x)x.classList.add('on');});},{rootMargin:'0px 0px -70% 0px'});
  byId.forEach((_,id)=>{const h=document.getElementById(id);if(h)io.observe(h);});
  window.__railIO=io;
}

// ── the two answers that open over the page (sales item 88) ──
function sheet(id,html,opener){
  const old=$(id);if(old)old.remove();
  const d=document.createElement('dialog');d.id=id;d.className='sheet';d.setAttribute('aria-labelledby',id+'-t');
  d.innerHTML=`<div class="sheet-in">${html}</div>`;
  document.body.appendChild(d);
  d.addEventListener('close',()=>{d.remove();if(opener&&opener.isConnected)opener.focus();});
  d.addEventListener('click',(e)=>{if(e.target===d)d.close();});   // a tap outside the sheet closes it
  if(typeof d.showModal==='function')d.showModal();else d.setAttribute('open','');
  return d;
}
function sheetErr(d,msg){let n=d.querySelector('.err');if(!n){n=document.createElement('p');n.className='err';n.setAttribute('role','alert');const row=d.querySelector('.row,.stackb');row.parentNode.insertBefore(n,row);}n.textContent=msg;}
// A question goes straight to the studio's Inbox; they answer by email (POST /sales/ask)
function openAsk(kind,opener,draft){
  const who=STUDIO||'your studio';
  const doc=kind==='contract'?'agreement':'proposal';
  const needEm=!!(ASK&&ASK.needs_email);
  const d=sheet('askSheet',`<div class="grab" aria-hidden="true"></div><h2 id="askSheet-t">Ask ${esc(who)}</h2><p class="sub">Your question goes straight to them. They answer by email, and the ${doc} stays open while you wait.</p><label class="sr" for="askBody">Your question</label><textarea id="askBody" maxlength="2000" rows="4" autofocus>${esc(draft||'')}</textarea>${needEm?`<label for="askEm">Your email, for the answer</label><input id="askEm" type="email" autocomplete="email" placeholder="you@business.com">`:(ASK&&ASK.email?`<p class="fine">Answer to ${esc(ASK.email)}</p>`:'')}<div class="row" id="askRow"><button class="ghost" id="askCancel" type="button">Cancel</button><button id="askSend" type="button">Send question</button></div>`,opener);
  const key=Math.random().toString(36).slice(2,10)+Date.now().toString(36);   // a double tap lands once
  $('askCancel').onclick=()=>d.close();
  const send=$('askSend');send.onclick=async()=>{
    const text=$('askBody').value.trim();
    if(!text){sheetErr(d,'Write your question first.');$('askBody').focus();return;}
    const emBox=$('askEm');const em=emBox?emBox.value.trim():'';
    if(emBox&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){sheetErr(d,'Add your email so the answer can reach you.');emBox.focus();return;}
    send.disabled=true;
    const payload={token:TOKEN,body:text,key,kind};if(em)payload.email=em;
    const r=await api('/sales/ask','POST',payload);
    if(r.ok){
      const to=em||(ASK&&ASK.email)||'';
      d.querySelector('.sheet-in').innerHTML=`<div class="grab" aria-hidden="true"></div><h2 id="askSheet-t">Sent</h2><p class="sub">${esc(who)} will answer by email${to?' at '+esc(to):''}. The ${doc} stays open while you wait.</p><div class="row"><button id="askDone" type="button">Close</button></div>`;
      $('askDone').onclick=()=>d.close();$('askDone').focus();announce('Your question was sent.');
      return;
    }
    send.disabled=false;
    // the deal has no address after all: ask for one, keeping what they wrote
    if(r.body&&r.body.error==='email_needed'&&!emBox){ASK={email:'',needs_email:true};d.close();openAsk(kind,opener,text);return;}
    sheetErr(d,(r.body&&r.body.message)||'That didn’t send. Try again in a moment.');
  };
}
// Before a decline: what would make it a yes (a reason and a note, both optional)
function openDecline(p,opener,done){
  const who=STUDIO||'your studio';
  const d=sheet('declineSheet',`<div class="grab" aria-hidden="true"></div><h2 id="declineSheet-t">Before you decline</h2><p class="sub">What would make this a yes? Optional, and it only goes to ${esc(who)}.</p><div class="chips" role="group" aria-label="What would make this a yes">${REASONS.map(([k,l])=>`<button type="button" class="chip" aria-pressed="false" data-reason="${k}">${esc(l)}</button>`).join('')}</div><label class="sr" for="decNote">A note for ${esc(who)}</label><textarea id="decNote" maxlength="500" rows="3" placeholder="Anything else they should know"></textarea><div class="stackb" id="declineRow"><button type="button" id="keepOpen">Keep it open</button><button type="button" class="danger" id="declineGo">Decline the proposal</button></div><p class="fine">Declining is final for this version. ${esc(who)} sees your note and can send an updated one.</p>`,opener);
  let reason='';
  d.querySelectorAll('.chip').forEach(ch=>{ch.onclick=()=>{const on=ch.getAttribute('aria-pressed')!=='true';d.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));ch.setAttribute('aria-pressed',on?'true':'false');reason=on?ch.dataset.reason:'';};});
  $('keepOpen').onclick=()=>d.close();
  const go=$('declineGo');go.onclick=async()=>{
    go.disabled=true;

    const r=await api('/sales/proposals/'+p.id+'/decide','POST',body);
    if(r.ok){d.close();await done();return;}
    go.disabled=false;sheetErr(d,(r.body&&r.body.message)||'That didn’t go through — give it another try in a moment.');
  };
}

// ── An old per-document link: the agreement on its own ──
function renderContract(c){
  const o={signer:c.studio_signer||null,client:c.client||null};

    const data=(r.body&&r.body.data)||{};
