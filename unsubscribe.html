<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Unsubscribe</title>
<style>
  :root{--bg:#faf8f5;--ink:#1b1525;--soft:#6b6478;--plum:#5b3fa0;--warn:#a3423a}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--ink:#efeaf7;--soft:#a79ebc;--plum:#b79ceb;--warn:#f0a39b}}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .center{max-width:480px;margin:14vh auto;padding:0 20px;text-align:center}
  h1{font-weight:500;font-size:clamp(20px,5vw,26px);margin-bottom:8px}
  .muted{color:var(--soft);font-size:15px}
  button{margin-top:18px;min-height:44px;padding:10px 20px;border:0;border-radius:999px;background:var(--plum);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  button.ghost{background:transparent;color:var(--plum);box-shadow:inset 0 0 0 1.5px var(--plum)}
  .muted+.muted{margin-top:6px}
  .small{color:var(--soft);font-size:13px;margin-top:10px}
  .err{color:var(--warn);font-size:14px;margin-top:10px;min-height:1.4em}
  a{color:inherit}
</style>
</head>
<body>
<main class="center" id="state"><p class="muted">One moment…</p></main>
<script>
// The unsubscribe page. An email's footer link lands here with ?e=<address>&t=<token>.
// The function at *.supabase.co can't show a page (Supabase serves HTML from that address
// as plain text, so its old page showed code and its button couldn't be pressed), so
// this page asks it directly: first whether the link is good and where things stand,
// then, on the button, to stop the emails. Sales item 74: someone who changed their
// mind can start emails again from the same page (drawn in Figma, page "Emails and
// unsubscribe — sales items 74, 75, 78"). A bounce or a spam complaint can't be undone
// here. Mail clients' own one-click unsubscribe still goes to the function.
(function(){
  var q=new URLSearchParams(location.search);
  var FN=(q.get('env')==='staging'?'https://wjlpursnwbmlcdwbeowv.supabase.co':'https://qksstlqzbhesadrrofgn.supabase.co')+'/functions/v1/presence';
  var e=q.get('e')||'', t=q.get('t')||'';
  var url=FN+'/unsubscribe?e='+encodeURIComponent(e)+'&t='+encodeURIComponent(t);
  // what still arrives after an unsubscribe: the mail the server sends as critical (routes/email_infra.ts STILL_ARRIVES)
  var STILL='Receipts, documents, sign-in links, bookings, payment reminders and alerts about your own business still arrive.';
  var state=document.getElementById('state');
  function line(tag,cls,text){ var n=document.createElement(tag); if(cls) n.className=cls; n.textContent=text; state.appendChild(n); return n; }
  // a line with the address in bold: before + <strong>address</strong> + after
  function withEmail(before,after){ var p=line('p','muted',before); var s=document.createElement('strong'); s.textContent=e; p.appendChild(s); p.appendChild(document.createTextNode(after)); return p; }
  function bad(msg){
    state.innerHTML='';
    line('h1','','That link didn’t work');
    var p=line('p','muted',(msg||'The unsubscribe link looks incomplete or expired.')+' ');
    if(!/support@/.test(msg||'')){ var a=document.createElement('a'); a.href='mailto:support@davisdigitalstudio.com'; a.textContent='Email support@davisdigitalstudio.com'; p.appendChild(a); p.appendChild(document.createTextNode(' and we’ll take care of it.')); }
  }
  function offline(){ state.innerHTML=''; line('h1','','This page couldn’t load'); line('p','muted','Check your connection, then reload the page.'); }
  function call(method,extra){ return fetch(url+(extra||''),{method:method,headers:{Accept:'application/json'}}).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {r:r,j:j}; }); }); }
  function sinceWords(iso){ var d=iso?new Date(iso):null; return d&&!isNaN(d)?' since '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):''; }
  // one button, its error line under it, and what pressing it does
  function action(label,ghost,run){
    var b=document.createElement('button'); b.type='button'; b.textContent=label; if(ghost) b.className='ghost'; state.appendChild(b);
    var err=line('p','err',''); err.setAttribute('role','alert');
    b.addEventListener('click',function(){
      b.disabled=true; err.textContent='';
      run().then(function(o){
        if(o.r.ok) return;
        b.disabled=false; err.textContent=(o.j&&o.j.message)||'That didn’t go through. Try again in a moment.';
      }).catch(function(){ b.disabled=false; err.textContent='That didn’t go through. Check your connection and try again.'; });
    });
    return b;
  }
  function unsubscribe(){ return call('POST').then(function(o){ if(o.r.ok) done(); return o; }); }
  function startAgain(){ return call('POST','&resume=1').then(function(o){ if(o.r.ok) backOn(); return o; }); }
  function ask(){
    state.innerHTML='';
    line('h1','','Stop these emails?');
    withEmail('Emails to ',' stop.');
    line('p','muted',STILL);
    action('Yes, unsubscribe',false,unsubscribe);
  }
  function done(){
    state.innerHTML='';
    line('h1','','You’re unsubscribed');
    withEmail('',' won’t get these emails anymore.');
    line('p','muted',STILL);
    action('Start emails again',true,startAgain);
    line('p','small','Changed your mind? This turns them back on.');
  }
  function already(since){
    state.innerHTML='';
    line('h1','','You’re already unsubscribed');
    withEmail('',' has been unsubscribed'+sinceWords(since)+'.');
    line('p','muted',STILL);
    action('Start emails again',true,startAgain);
  }
  function backOn(){
    state.innerHTML='';
    line('h1','','Emails are back on');
    withEmail('',' will get these emails again.');
    action('Unsubscribe',true,unsubscribe);
  }
  function stopped(reason){
    state.innerHTML='';
    line('h1','','Emails to this address are stopped');
    withEmail('Emails to ',reason==='complaint'?' stopped because one was marked as spam.':' stopped because they couldn’t be delivered.');
    var p=line('p','muted',''); var a=document.createElement('a'); a.href='mailto:support@davisdigitalstudio.com'; a.textContent='Email support@davisdigitalstudio.com'; p.appendChild(a); p.appendChild(document.createTextNode(' to turn them back on.'));
  }
  if(!e||!t){ bad(''); return; }
  call('GET').then(function(o){
    if(!o.r.ok){ bad(o.j&&o.j.message); return; }
    var d=(o.j&&o.j.data)||{};
    if(d.stopped) stopped(d.stopped);
    else if(d.unsubscribed) already(d.since);
    else ask();
  }).catch(offline);
})();
</script>
</body>
</html>
