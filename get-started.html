<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let’s build your website — Presence</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Two quick questions and Studio OS drafts your website — for you to review, never published without your OK.">
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--shadow:0 1px 2px rgba(27,21,37,.04),0 12px 34px rgba(27,21,37,.08);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--shadow:0 1px 2px rgba(0,0,0,.2),0 12px 34px rgba(0,0,0,.4)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:600px;margin:0 auto;padding:44px 20px 100px}
  .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--p);font-weight:700}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,5vw,34px);margin:12px 0 .2em;letter-spacing:-.01em;text-wrap:balance}
  .sub{color:var(--soft);font-size:16px;margin:0 0 4px;max-width:52ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);margin-top:22px}
  label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:16px 0 8px}
  label:first-child{margin-top:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--p)} .chip.on{background:var(--p-soft);color:var(--p);border-color:var(--p-soft)}
  .svc{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  input[type=text],textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  input:focus,textarea:focus{outline:none;border-color:var(--p)}
  textarea{resize:vertical;min-height:64px}
  .svc button{flex:0 0 auto;border:none;background:none;color:var(--faint);font-size:20px;cursor:pointer;line-height:1}
  .addsvc{font-family:inherit;font-size:13.5px;font-weight:600;color:var(--p);background:none;border:none;cursor:pointer;padding:4px 0}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
  button.primary{font-family:inherit;font-size:15px;font-weight:600;border-radius:999px;border:1px solid var(--p);background:var(--p);color:#fff;padding:12px 22px;cursor:pointer;transition:.15s}
  button.primary:hover{background:var(--p-deep)} button.primary:disabled{opacity:.55;cursor:default}
  a.plain,button.plain{color:var(--soft);text-decoration:none;font-weight:600;font-size:14px;background:none;border:none;cursor:pointer;font-family:inherit}
  a.plain:hover,button.plain:hover{color:var(--p)}
  .hint{font-size:12.5px;color:var(--faint);margin-top:12px}
  .steps{display:flex;flex-direction:column;gap:2px;margin:18px 0}
  .step{display:flex;align-items:center;gap:11px;padding:9px 4px;font-size:14.5px}
  .step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:var(--faint)}
  .step.done .dot{background:var(--good);border-color:var(--good);color:#fff}
  .step.now .dot{border-color:var(--p);color:var(--p)}
  .step .t{font-weight:600} .step .w{color:var(--soft);font-size:13px}
  .lesson{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
  .lesson b{color:var(--ink)} .lesson .ic{color:var(--p);flex:0 0 auto}
  .center{text-align:center;padding:30px 10px}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:24px auto}
  .big{font-family:var(--serif);font-size:24px;margin:0 0 8px}
  footer{margin-top:36px;color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap"><div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>Presence · Studio OS drafts; you approve. Nothing goes live without your OK.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="";
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;}); // keep token fresh (auto-refresh)
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN});
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}

// ── the intake industries + smart default services (mirror of lib/onboarding.ts) ──
const INDUSTRIES=[
  {key:'restaurant',label:'Restaurant',services:['Dinner','Lunch','Catering']},
  {key:'coffee_shop',label:'Café / Coffee Shop',services:['Coffee & espresso','Pastries','Breakfast']},
  {key:'home_services',label:'Home Services',services:['Repairs','Installation','Emergency service']},
  {key:'salon',label:'Salon & Beauty',services:['Haircut & styling','Color','Treatments']},
  {key:'retail',label:'Shop / Retail',services:['In-store shopping','Featured products','Gift cards']},
  {key:'professional',label:'Professional Services',services:['Consultation','Ongoing support','Project work']},
  {key:'fitness',label:'Fitness & Wellness',services:['Classes','Personal training','Memberships']},
  {key:'other',label:'Something else',services:['What you offer','Consultation']},
];
const LESSONS=[
  ['✓','Approvals','Studio OS proposes; you approve. Nothing publishes without you.'],
  ['◆','Ownership','It’s yours — export anytime, connect or disconnect freely, leave without penalty.'],
  ['↺','Undo anything','Every publish is kept. If a change looks wrong, restore an earlier version in one step.'],
];
let INTAKE={industry:'restaurant',services:['Dinner','Lunch','Catering'],description:''};
let BIZ='your business';

function buildStarterRequest(intake){
  const services=(intake.services||[]).map(s=>String(s||'').trim()).filter(Boolean).slice(0,12).map(name=>({name}));
  const goals=String(intake.description||'').trim().slice(0,300);
  const label=(INDUSTRIES.find(i=>i.key===intake.industry)||{}).label||'';
  return {kind:'starter_site',starter:{services,goals},instructions:`${label?'A '+label+' business. ':''}${String(intake.description||'').trim()}`.slice(0,600).trim()};
}

function renderIntake(){
  $('main').innerHTML=`
    <div class="eyebrow">Welcome${BIZ&&BIZ!=='your business'?', '+esc(BIZ):''}</div>
    <h1>Let’s build your website.</h1>
    <p class="sub">Two quick questions and Studio OS will draft a real starting point — for you to review. Nothing goes live until you say so.</p>
    <div class="card">
      <label>What kind of business is this?</label>
      <div class="chips" id="inds">${INDUSTRIES.map(i=>`<button class="chip ${i.key===INTAKE.industry?'on':''}" data-ind="${i.key}">${esc(i.label)}</button>`).join('')}</div>
      <label>A few things you offer <span style="font-weight:400;color:var(--faint)">— edit or add your own</span></label>
      <div id="svcs">${INTAKE.services.map((s,i)=>svcRow(s,i)).join('')}</div>
      <button class="addsvc" id="addsvc">+ Add another</button>
      <label for="desc">In a sentence, what should visitors know?</label>
      <textarea id="desc" placeholder="e.g. Family-owned since 1998, known for fast, friendly service.">${esc(INTAKE.description)}</textarea>
      <div class="bar">
        <button class="primary" id="build">Build my website →</button>
        <button class="plain" id="manual">I’ll set it up myself</button>
      </div>
      <p class="hint">We’ll draft your homepage, pages, and the words that help customers find you on Google — then you review and publish when it’s right.</p>
    </div>`;
  wireIntake();
}
function svcRow(v,i){return `<div class="svc"><input type="text" data-svc="${i}" value="${esc(v)}" placeholder="A service or offering"><button data-rm="${i}" aria-label="Remove">×</button></div>`;}
function readIntake(){
  INTAKE.services=[...document.querySelectorAll('[data-svc]')].map(x=>x.value);
  const d=$('desc'); if(d)INTAKE.description=d.value;
}
function wireIntake(){
  document.querySelectorAll('[data-ind]').forEach(b=>b.addEventListener('click',()=>{readIntake();INTAKE.industry=b.getAttribute('data-ind');const found=INDUSTRIES.find(i=>i.key===INTAKE.industry);if(found&&INTAKE.services.filter(s=>s.trim()).length===0)INTAKE.services=[...found.services];renderIntake();}));
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{readIntake();INTAKE.services.splice(+b.getAttribute('data-rm'),1);if(!INTAKE.services.length)INTAKE.services=[''];renderIntake();}));
  $('addsvc').addEventListener('click',()=>{readIntake();INTAKE.services.push('');renderIntake();setTimeout(()=>{const el=document.querySelector('[data-svc="'+(INTAKE.services.length-1)+'"]');if(el)el.focus();},0);});
  $('build').addEventListener('click',build);
  $('manual').addEventListener('click',async()=>{readIntake();await saveIndustry();manualFallback('manual');});
}

// Phase T3: persist the industry — the site's template reads vocabFor(industry)
// from the snapshot (correct schema + vocabulary). 'other' maps to the safe generic.
async function saveIndustry(){
  const key=INTAKE.industry==='other'?'generic':INTAKE.industry;
  try{await api('/settings','PUT',{industry_key:key});}catch(_){/* non-blocking */}
}
async function build(){
  readIntake();
  // await: the draft's template reads industry_key for the right vocabulary/schema,
  // so the PUT must land before /writer/generate runs (else wrong-vocab drafts).
  await saveIndustry();
  if(!INTAKE.services.some(s=>s.trim())&&INTAKE.description.trim().length<8){renderIntake();$('desc').focus();return;}
  $('main').innerHTML=`<div class="center"><div class="spin" role="status"></div><p class="big">Drafting your website…</p><p class="sub" style="margin:0 auto">Turning what you told us into real pages and homepage copy, written so customers can find you on Google. This takes a few seconds.</p></div>`;
  const req=buildStarterRequest(INTAKE);
  const gen=await api('/writer/generate','POST',req);
  if(!gen.ok){ return manualFallback(gen.status===503?'switched_off':'failed'); }
  // apply the single starter option to the DRAFT (still not published) so the member reviews a real draft
  let applied=false;
  try{
    const list=await api('/writer/drafts');
    const draft=((list.body&&list.body.data)||[]).find(d=>d.kind==='starter_site'&&(d.status==='proposed'||d.status==='ready'));
    if(draft){ const acc=await api('/writer/drafts/'+draft.id+'/accept','POST',{option:0}); applied=acc.ok; }
  }catch(_){/* the proposal still exists to review even if auto-apply hiccups */}
  drafted(applied);
}
function drafted(applied){
  const steps=[['drafted','Website drafted',true,true],['previewed','Preview it',false,false],['approved','Approve it',false,false],['published','Publish',false,false]];
  $('main').innerHTML=`
    <div class="eyebrow" style="color:var(--good)">✓ Drafted</div>
    <h1>Your website is ready to review.</h1>
    <p class="sub">We drafted your pages and homepage copy from what you told us — including the behind-the-scenes bits that help Google find you. ${applied?'It’s in your workspace as a draft':'It’s waiting as a proposal'} — nothing is live yet.</p>
    <div class="card">
      <div class="steps">${steps.map(s=>`<div class="step ${s[2]?'done':''} ${s[3]?'':(s===steps[1]?'now':'')}"><span class="dot">${s[2]?'✓':''}</span><span><span class="t">${esc(s[1])}</span></span></div>`).join('')}</div>
      <div class="bar"><button class="primary" id="review">Review &amp; preview your website →</button></div>
      <p class="hint">You’ll see it exactly as visitors will. Change anything, then publish with one calm step — and every version is kept, so you can always go back.</p>
    </div>
    <div class="card" style="padding-top:6px">${LESSONS.map(l=>`<div class="lesson"><span class="ic">${l[0]}</span><span><b>${esc(l[1])}.</b> ${esc(l[2])}</span></div>`).join('')}</div>`;
  $('review').addEventListener('click',()=>location.href='/presence.html?view=preview');
}
function manualFallback(reason){
  $('main').innerHTML=`
    <div class="eyebrow">Let’s set it up together</div>
    <h1>We’ll build it with you.</h1>
    <p class="sub">${reason==='manual'?'No problem — you’re in the driver’s seat. Your workspace has everything you need to build your site, one calm step at a time.':reason==='switched_off'?'Automatic drafting isn’t switched on yet — no problem. Your workspace has everything you need to build your site, one calm step at a time.':'The draft didn’t come through just now — nothing was lost. Let’s set it up in your workspace, one step at a time.'}</p>
    <div class="card">
      <div class="steps">
        <div class="step now"><span class="dot">1</span><span><span class="t">Add your business details</span><br><span class="w">Your name, what you do, how to reach you.</span></span></div>
        <div class="step"><span class="dot">2</span><span><span class="t">Preview your site</span><br><span class="w">See it exactly as visitors will.</span></span></div>
        <div class="step"><span class="dot">3</span><span><span class="t">Publish when it’s right</span><br><span class="w">One calm step — and every version is kept.</span></span></div>
      </div>
      <div class="bar"><button class="primary" id="go">Open my workspace →</button></div>
    </div>
    <div class="card" style="padding-top:6px">${LESSONS.map(l=>`<div class="lesson"><span class="ic">${l[0]}</span><span><b>${esc(l[1])}.</b> ${esc(l[2])}</span></div>`).join('')}</div>`;
  $('go').addEventListener('click',()=>location.href='/presence.html');
}
function signedOut(){$('main').innerHTML=`<div class="center"><p class="big">Sign in to get started.</p><p style="margin-top:16px"><a class="plain" href="/studio.html">Sign in →</a></p></div>`;}

(async function(){
  try{
    const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){signedOut();return;}
    // greet by name + skip drafting for editions without a website (route them to Today)
    try{
      const ctx=await api('/portal/context');
      const c=(ctx.body&&ctx.body.data)||{};
      if(c.edition_flags&&c.edition_flags.hasWebsite===false){location.href=c.landing||'/today.html';return;}
    }catch(_){/* proceed with defaults */}
    try{const idn=await api('/identity');const bn=idn.body&&idn.body.data&&idn.body.data.business_name;if(bn)BIZ=bn;}catch(_){}
    // Phase CP-1.3: never ask twice — if the studio already set this workspace up
    // (a starter kit, pre-filled services, a chosen industry), start from THAT.
    try{
      const [set,off]=await Promise.all([api('/settings'),api('/offerings')]);
      const ik=set.body&&set.body.data&&set.body.data.industry_key;
      if(ik&&ik!=='generic'&&INDUSTRIES.some(i=>i.key===ik))INTAKE.industry=ik;
      const names=((off.body&&off.body.data)||[]).map(o=>o.name).filter(Boolean).slice(0,8);
      if(names.length){INTAKE.services=names;INTAKE.prepared=true;}
    }catch(_){/* fresh workspace — defaults stand */}
    renderIntake();
    if(INTAKE.prepared){const h=$('inds');if(h&&h.parentElement){const note=document.createElement('p');note.className='hint';note.textContent='Your studio started you off — these are already set up. Tweak anything, then continue.';h.parentElement.insertBefore(note,h);}}
  }catch(_){renderIntake();}
})();
</script>
</body>
</html>
