<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website health — Studio OS</title>
<meta name="description" content="A calm, plain-English health check for your website — what's working, what's worth a look, and why.">
<link rel="stylesheet" href="/fonts/brand.css">
<link rel="stylesheet" href="/cms.css">
<style>
  /* SS8 — page skin re-aliased onto the shell's --dds-* tokens. shell.css is the
     canonical palette and carries the full four-block theme contract (light base ·
     prefers-color-scheme dark · data-theme="light" · data-theme="dark"), so this
     page follows every mode automatically. The selector list mirrors cms.css's
     own explicit data-theme blocks so this alias wins in all four states;
     fallbacks only cover a missing shell.css. (--bad-soft has no --dds token —
     cms.css's four themed literals keep covering it.) */
  :root,:root[data-theme="light"],:root[data-theme="dark"]{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#6f677d);--line:var(--dds-line,#eee9e0);
    --accent:var(--dds-accent,#5b3fa0);--accent-soft:var(--dds-accent-soft,#efeafa);--good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);
    --warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#a2453f);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.05));
  }
  header .sub{color:var(--soft);font-size:15.5px;margin:0;max-width:54ch}

  /* ── SS8 shared cms-family chrome: .lhead-lite (icon · count meta · "As of
        {time}" · ↻ soft refresh) — kept in sync by hand with attention.html /
        content-tree.html (the SS9–SS12 primitive). ── */
  .lhead{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;margin:22px 0 0}
  .lhead[hidden]{display:none}   /* the display rule must never defeat the hidden attribute */
  .obj-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .lmeta{flex:1;min-width:0;font-size:13px;color:var(--soft);margin:0}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:8px;padding:5px 8px;cursor:pointer}
  .lbtn:hover{color:var(--accent);background:var(--accent-soft)}
  .lbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .retry{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 18px;cursor:pointer;margin-top:16px}
  .retry:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  /* dark mode: the filled retry needs dark ink (#fff on the lifted accent fails contrast) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .retry{color:#171320}}
  :root[data-theme="dark"] .retry{color:#171320}
  /* >300ms loading stencil — ghost cards, never a flash on fast checks */
  .stencil{margin-top:26px}
  .stencil .gh{background:var(--card);border:1px solid var(--line);border-radius:15px;height:76px;margin-bottom:12px;position:relative;overflow:hidden}
  .stencil .gh::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--line),transparent);animation:shim 1.2s infinite}
  @keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  @media (prefers-reduced-motion:reduce){.stencil .gh::after{animation:none}}

  /* the overall verdict — a reassuring hero, calm not clinical */
  .verdict{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:22px 22px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:center}
  .vmark{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
  .verdict.healthy .vmark{background:var(--good-soft)} .verdict.attention .vmark{background:var(--warn-soft)} .verdict.new .vmark{background:var(--accent-soft)}
  .vtext h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0;line-height:1.2}
  .vtext p{margin:3px 0 0;color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}

  .cat{margin-top:30px}
  .clabel{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:0 0 12px}
  .chk{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow);margin-bottom:10px}
  .ci{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
  .ci.ok{background:var(--good-soft);color:var(--good)} .ci.attention{background:var(--warn-soft);color:var(--warn)}
  .ci.coming{background:var(--accent-soft);color:var(--accent)} .ci.off{background:var(--line);color:var(--soft)}
  .cb{flex:1;min-width:0}
  .ct{font-size:15px;font-weight:600;margin:0;line-height:1.35;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .cw{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .cw.ok{color:var(--good);background:var(--good-soft)} .cw.attention{color:var(--warn);background:var(--warn-soft)}
  .cw.coming{color:var(--accent);background:var(--accent-soft)} .cw.off{color:var(--soft);background:var(--line)}
  .cwhy{margin:5px 0 0;font-size:14px;color:var(--soft);line-height:1.45}
  .cact{margin-top:11px}
  a.act{display:inline-block;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;transition:background .15s,border-color .15s}
  a.act:hover{background:var(--accent-soft);border-color:var(--accent)} a.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* "What this means" — plain-English suggestions from real visit data */
  .means{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
  .means h2{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 4px;display:flex;gap:9px;align-items:center}
  .means .lede{color:var(--soft);font-size:13.5px;margin:0 0 14px}
  .means ul{list-style:none;margin:0;padding:0}
  .means li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
  .means li:first-of-type{border-top:none}
  .means li .dot{flex:none;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .means li.good .dot{background:var(--good-soft);color:var(--good)} .means li.neutral .dot{background:var(--accent-soft);color:var(--accent)}
  .means .empty{color:var(--soft);font-size:14px;line-height:1.5;margin:0}

  .center{text-align:center;padding:56px 20px}
  .center .mark{font-size:40px;display:block;margin-bottom:12px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px}
  .center .sub{color:var(--soft);font-size:15px;max-width:42ch;margin:0 auto}
  .foot{margin-top:32px;color:var(--faint);font-size:12.5px;text-align:center}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/today.html">← Back to Today</a>
    <h1>Website health</h1>
    <p class="sub" id="sub">A calm, plain-English check-up of your website — what’s working, what’s worth a look, and why it matters. Nothing here changes your site.</p>
  </header>
  <div class="lhead" id="lhead" hidden>
    <span class="obj-ic" aria-hidden="true">🩺</span>
    <p class="lmeta" id="lmeta"></p>
    <button class="lbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">↻</button>
  </div>
  <div id="main"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
// CMS-UX-4 — the Website Health page, rendered.
// Consumes ONLY the existing read-only projection: GET /website-health.
// Colour is never the only signal — each check shows an icon glyph AND a word.
const SUPABASE_URL = "https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN = SUPABASE_URL + "/functions/v1/presence";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'dds-portal-auth', persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLIENT = new URLSearchParams(location.search).get('client') || '';
let TOKEN = "";
sb.auth.onAuthStateChange(function(_e,s){ if(s&&s.access_token) TOKEN=s.access_token; });

const H = () => ({ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY, 'x-dds-user-jwt':TOKEN, 'x-dds-scope-site':CLIENT });
// SS8 family api(): never throws — {ok:false,status:0} on a network hiccup, so
// every failure routes through ONE honest state switch (401/403/404/other).
async function api(p){ try{ const r = await fetch(FN+p, { headers:H() }); return { ok:r.ok, status:r.status, body:await r.json().catch(()=>({})) }; }catch(_){ return { ok:false, status:0, body:{} }; } }
let LOADED_AT = Date.now();
const asOfLabel = () => 'As of ' + new Date(LOADED_AT).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
function toast(m){ if(window.ddsToast) return void ddsToast(m); const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function href(link){ if(!link) return null; if(!CLIENT) return link; const [b,h]=String(link).split('#'); return b + (b.includes('?')?'&':'?') + 'client=' + encodeURIComponent(CLIENT) + (h?'#'+h:''); }

// state → glyph (icon is a second, non-colour signal alongside the word)
const GLYPH = { ok:'✓', attention:'!', coming:'⏳', off:'–' };
const VERDICT = {
  healthy: { mark:'🌿', h:'Your website is healthy.' },
  attention:{ mark:'🔎', h:'A few things could use a look.' },
  new:     { mark:'🌱', h:'Your website is almost ready.' },
};

function checkHtml(c){
  const link = href(c.action_href);
  const act = (c.action_label && link) ? `<div class="cact"><a class="act" href="${esc(link)}">${esc(c.action_label)}</a></div>` : '';
  return `<div class="chk">
    <span class="ci ${esc(c.state)}" aria-hidden="true">${GLYPH[c.state]||'•'}</span>
    <div class="cb">
      <p class="ct">${esc(c.title)} <span class="cw ${esc(c.state)}">${esc(c.status_label)}</span></p>
      ${c.why ? `<p class="cwhy">${esc(c.why)}</p>` : ''}
      ${act}
    </div>
  </div>`;
}
function catHtml(cat){
  return `<section class="cat">
    <p class="clabel">${esc(cat.label)}</p>
    ${(cat.checks||[]).map(checkHtml).join('')}
  </section>`;
}

// "What this means" — plain-English suggestions from the visits we already
// collect. Read-only, no controls. Honest empty state when there isn't enough.
function meansHtml(cp){
  if(!cp) return '';
  const glyph = { good:'✓', neutral:'→' };
  const body = (cp.enough && (cp.suggestions||[]).length)
    ? `<ul>${cp.suggestions.map(s=>`<li class="${esc(s.tone)}"><span class="dot" aria-hidden="true">${glyph[s.tone]||'→'}</span><span>${esc(s.text)}</span></li>`).join('')}</ul>`
    : `<p class="empty">${esc(cp.note||'We’ll show suggestions here once your site has had a few more visits.')}</p>`;
  return `<section class="means">
    <h2>What this means</h2>
    <p class="lede">A few plain-English notes from how visitors are using your site.</p>
    ${body}
  </section>`;
}

function render(h){
  if(!h || !h.categories || !h.categories.length){
    $('lhead').hidden = true;   // nothing to count yet — no freshness chrome over an empty report
    $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🌱</span>
      <h2>Your website is being set up.</h2>
      <p class="sub">As soon as there’s something to check, your health report will appear here — calmly, in plain words.</p></div>`;
    return;
  }
  // SS8 family chrome: check counts + "As of {time}" freshness
  const okN = h.ok_count || 0, attnN = h.attention_count || 0;
  $('lmeta').textContent = `${okN} working${attnN ? ` · ${attnN} worth a look` : ''} · ${asOfLabel()}`;
  $('lhead').hidden = false;
  const v = VERDICT[h.overall] || VERDICT.healthy;
  $('sub').textContent = 'A calm check-up of your website — what’s working, what’s worth a look, and why. Nothing here changes your site.';
  let html = `<div class="verdict ${esc(h.overall)}">
    <span class="vmark" aria-hidden="true">${v.mark}</span>
    <div class="vtext"><h2>${esc(h.headline || v.h)}</h2><p>${esc(h.summary||'')}</p></div>
  </div>`;
  html += meansHtml(h.content_performance);
  html += h.categories.map(catHtml).join('');
  html += `<p class="foot">This is a read-only check-up — it never changes your website. Anything worth doing links to where you can do it.</p>`;
  $('main').innerHTML = html;
}

function signedOut(){ $('lhead').hidden = true; $('sub').textContent=''; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2>Sign in to check your website’s health.</h2><p class="sub">Your website lives with your account — sign in to see how it’s doing.</p><p style="margin-top:22px"><a class="link" href="/studio.html">Sign in →</a></p></div>`; }
// SS8 honest failure states. A 403 is NOT a hiccup: this account simply can't
// see this website — saying "nothing's wrong, refresh in a moment" was a
// permanent lie (red-first: the 403 spec pins this copy apart from trouble()).
function notAllowed(){ $('lhead').hidden = true; $('main').innerHTML = `<div class="center"><span class="mark" aria-hidden="true">🔒</span><h2>This website isn’t in your workspace.</h2><p class="sub">You’re signed in, but this account can’t see this website’s health report. If you look after more than one business, switch to the right account and try again.</p><p style="margin-top:22px"><a class="link" href="/today.html">Back to Today →</a></p></div>`; }
function notFound(){ $('lhead').hidden = true; $('main').innerHTML = `<div class="center"><h2>We couldn’t find this website.</h2><p class="sub">It may have been removed, or this link may be out of date.</p><p style="margin-top:22px"><a class="link" href="/today.html">Back to Today →</a></p></div>`; }
function trouble(){ $('lhead').hidden = true; $('main').innerHTML = `<div class="center"><h2>We couldn’t run the check just now.</h2><p class="sub">Nothing’s wrong with your website — this is only this page.</p><button class="retry" id="retry">Try again</button></div>`; const rt=$('retry'); if(rt)rt.addEventListener('click',()=>load()); }

// SS8 family load(soft): REQ_SEQ so a superseded response never paints; soft
// (the ↻ button) keeps the last good render on failure and toasts. Hard loads
// show the ghost stencil only after 300ms — fast checks never flash.
let REQ_SEQ = 0, STENCIL_TIMER = 0;
function stencil(){ $('main').innerHTML = `<div class="stencil" role="status" aria-label="Checking your website"><div class="gh"></div><div class="gh"></div><div class="gh"></div></div>`; }
async function load(soft){
  const seq = ++REQ_SEQ;
  clearTimeout(STENCIL_TIMER);
  if(!soft){ $('main').innerHTML = ''; STENCIL_TIMER = setTimeout(() => { if(seq === REQ_SEQ) stencil(); }, 300); }
  const r = await api('/website-health');
  if(seq !== REQ_SEQ) return;
  clearTimeout(STENCIL_TIMER);
  if(!r.ok){
    if(soft){ toast('Couldn’t refresh just now.'); return; }
    if(r.status === 401){ signedOut(); return; }
    if(r.status === 403){ notAllowed(); return; }
    if(r.status === 404){ notFound(); return; }
    trouble(); return;
  }
  LOADED_AT = Date.now();
  render(r.body && r.body.data);
}

(async function init(){
  $('refreshBtn').addEventListener('click', () => load(true));   // wrapped — the click event must never become the soft flag
  try{
    const { data } = await sb.auth.getSession();
    TOKEN = (data && data.session && data.session.access_token) || "";
    if(!TOKEN){ signedOut(); return; }
    await load();
  }catch(_){ trouble(); }
})();
</script>
</body>
</html>
