const HELPS=[['registrar_care','Make sure it renews by itself'],['connect_domain','The records this site needs'],['email_setup','Gmail on this domain'],['transfer_out','Move the domain']];   // email_setup: item 174, Gmail's records in one pick
const helpBody=(goal)=>goal==='email_setup'?{goal,provider:'google_workspace'}:{goal};
const scopeFor=(d)=>d.own?{}:{'x-dds-scope-site':d.site_id};   // the studio acts inside the client's site
function helpHtml(d){
  const list=HELPS.filter(([g])=>g!=='connect_domain'||d.hosted);   // a site on its own host gets its records from that host
  return `<section class="dp-sec" aria-labelledby="dpHelpH"><h3 id="dpHelpH">Help with this domain</h3><div class="dp-acts" style="margin-top:0">${list.map(([g,l])=>`<button type="button" class="rowact" data-help="${g}" aria-pressed="false">${esc(l)}</button>`).join('')}</div><div id="dpHelpOut"></div></section>`;
}
let HELP_SEQ=0;
async function helpPreview(goal,btn){
  const d=PANEL;if(!d)return;const out=$('dpHelpOut');const gen=++HELP_SEQ;
  document.querySelectorAll('#dpBody [data-help]').forEach(b=>b.setAttribute('aria-pressed',b===btn?'true':'false'));
  out.innerHTML='<p class="muted" style="margin-top:10px" role="status">Getting the steps…</p>';
  let r;try{r=await apiSend('POST','/foundations/prepare',{...helpBody(goal),preview:true},scopeFor(d));}catch(_){r={ok:false,body:{}};}
  if(gen!==HELP_SEQ||!PANEL||PANEL.site_id!==d.site_id)return;
  if(!r.ok||!r.body||!r.body.data){out.innerHTML=`<p class="muted" style="margin-top:10px" role="status">${esc((r.body&&r.body.message)||'Those steps didn’t load just now.')}</p>`;return;}
  const p=r.body.data;
  const recRows=(s)=>(s.records||[]).length?`<table class="dp-rec" aria-label="Records to add"><tbody>${s.records.map(x=>`<tr><td>${esc(x.name)}</td><td class="t">${esc(x.type)}</td><td>${esc(x.value)}</td></tr>`).join('')}</tbody></table>`:'';
  out.innerHTML=`<div class="dp-plan"><p class="dp-ptitle">${esc(p.title)}</p><p class="muted" style="font-size:13px;margin:0">${esc(p.summary)}</p>
    <ol class="dp-steps">${(p.steps||[]).map(s=>`<li>${s.automated?'<span class="muted">Handled automatically: </span>':''}${esc(s.what)}${recRows(s)}</li>`).join('')}</ol>
    <div class="dp-acts"><button type="button" class="btn" id="dpSend">${d.own?'Put it on your Domain & email page':'Put it on the client’s page'}</button><span class="muted" id="dpSent" role="status"></span></div></div>`;
  $('dpSend').addEventListener('click',()=>helpSend(goal));
}
async function helpSend(goal){
  const d=PANEL;if(!d)return;const b=$('dpSend');if(!b)return;b.disabled=true;
  let r;try{r=await apiSend('POST','/foundations/prepare',helpBody(goal),scopeFor(d));}catch(_){r={ok:false,body:{}};}
  if(!PANEL||PANEL.site_id!==d.site_id)return;
  const sv=$('dpSent');
  if(!r.ok){b.disabled=false;if(sv)sv.textContent=(r.body&&r.body.message)||'That didn’t go through just now.';return;}
  if(sv)sv.textContent=d.own?'Done. It’s on your Domain & email page.':'Done. It’s on their Domain & email page, waiting for their OK.';
}
// ── item 222 (Nov 12 review, file 04, finding 2): Ask for access. A card on the panel says
//    where the ask stands; the sheet shows the email the client gets (the server writes it:
//    POST …/access with preview), then sends it. It arrived, Undo and Not needed tick it. ──
const accFound=(d)=>(d.where&&d.where.records_at&&d.where.records_at.company)||'';
function accessHtml(d){
  // a server without item 222 (before its update goes live) sends no access at all: no card, so no button that can't work yet
  if(d.own||!('access' in d))return'';
  const a=d.access,who=d.name||'the client';
  const co=a&&a.company&&a.company!=='Another company'?a.company:accFound(d);
  if(a&&a.status==='arrived'){
    const rec=d.where&&d.where.records_at,signIn=rec&&rec.sign_in&&rec.company===co?rec.sign_in:'';
    return `<section class="dp-acc yes" aria-labelledby="dpAccH"><div class="ah"><span class="ak">${CHECK_SVG}</span><div><div class="kick">Your studio’s access</div><h3 class="at" id="dpAccH">Access arrived</h3></div></div>
      <p>Ticked off ${esc(dayShort(a.arrived_at))}${a.arrived_by?' by '+esc(a.arrived_by):''}. Change the records${co?' at '+esc(co):''} with your studio’s own sign-in; ${esc(who)}’s password never left them.</p>
      <div class="dp-acts">${signIn?`<a class="btn" href="${esc(signIn)}" target="_blank" rel="noopener">Sign in to ${esc(co)} ↗</a>`:''}<button type="button" class="linkbtn" data-acc="undo">Undo</button></div></section>`;
  }
  if(a&&a.status==='asked'){
    return `<section class="dp-acc wait" aria-labelledby="dpAccH"><div class="ah"><span class="ak">${KEY_SVG}</span><div><div class="kick">Your studio’s access</div><h3 class="at" id="dpAccH">Waiting for access</h3></div><span class="since">Asked ${esc(dayShort(a.asked_at))}</span></div>
      <ol class="dp-track"><li class="done"><span class="dot">${CHECK_SVG}</span>Asked ${esc(who)}${co?`, with ${esc(co)}’s steps`:''}<span class="when">${esc(dayShort(a.last_asked_at||a.asked_at))}</span></li>
        <li class="now"><span class="dot"></span>They add ${esc(a.invite)}${co?' at '+esc(co):''}</li>
        <li class="next"><span class="dot"></span>The invitation arrives and you accept it</li></ol>
      <p class="muted">Sent to ${esc(a.to)}${a.asks>1?`, ${a.asks} times`:''}. Nothing back after a week? Ask again sends the same steps once more.</p>
      <div class="dp-acts"><button type="button" class="btn" data-acc="arrived">${CHECK_SVG}It arrived</button><button type="button" class="rowact" data-acc="ask">Ask again</button><button type="button" class="linkbtn" data-acc="clear">Not needed</button></div></section>`;
  }
  return `<section class="dp-acc" aria-labelledby="dpAccH"><div class="ah"><span class="ak">${KEY_SVG}</span><div><div class="kick">Your studio’s access</div><h3 class="at" id="dpAccH">Get into its records without their password</h3></div></div>
    <p>${co?`Its records are kept at ${esc(co)}. `:''}Ask ${esc(who)} to give your studio the DNS records only. They keep their password, their account and the right to renew or move the domain.</p>
    <div class="dp-acts"><button type="button" class="btn" data-acc="ask">${KEY_SVG}Ask for access</button><button type="button" class="linkbtn" data-acc="have">We already have it</button></div></section>`;
}
function syncAccessRow(siteId,a){
  const i=DOMAINS.findIndex(x=>x.site_id===siteId);if(i<0)return;
  DOMAINS[i]={...DOMAINS[i],access:a?{status:a.status,since:a.status==='arrived'?a.arrived_at:a.asked_at}:null};render();
}
async function accessAct(kind,btn){
  const d=PANEL;if(!d)return;
  if(kind==='ask')return openAccess(btn);
  const [method,body]=kind==='clear'?['DELETE',null]:['PUT',{arrived:kind==='arrived'||kind==='have'}];
  btn.disabled=true;
  let r;try{r=await apiSend(method,'/agency/domains/'+encodeURIComponent(d.site_id)+'/access',body);}catch(_){r={ok:false,body:{}};}
  if(!PANEL||PANEL.site_id!==d.site_id)return;
  if(!r.ok||!r.body||!r.body.data){btn.disabled=false;$('dpMsg').textContent=(r.body&&r.body.message)||'That didn’t save just now.';return;}
  PANEL={...PANEL,access:r.body.data.access};paintPanel();
  $('dpMsg').textContent=kind==='clear'?'The ask is cleared.':kind==='undo'?(PANEL.access?'Back to waiting.':'Untick done.'):'Ticked off: access arrived.';
  syncAccessRow(d.site_id,PANEL.access);
  const f=document.querySelector('#dpBody [data-acc]');if(f)f.focus();
}
let ACC=null,ACC_SEQ=0,ACC_T=0,ACC_OPENER=null;
function accDialog(){
  let dlg=$('accDlg');if(dlg)return dlg;
  dlg=document.createElement('dialog');dlg.id='accDlg';dlg.className='accdlg';dlg.setAttribute('aria-labelledby','accTitle');document.body.appendChild(dlg);
  dlg.addEventListener('close',()=>{ACC=null;clearTimeout(ACC_T);if(ACC_OPENER&&document.contains(ACC_OPENER))ACC_OPENER.focus();ACC_OPENER=null;});
  dlg.addEventListener('click',(e)=>{if(e.target===dlg)dlg.close();});
  return dlg;
}
function openAccess(opener){
  const d=PANEL;if(!d)return;ACC_OPENER=opener||null;
  const companies=d.access_companies||['Another company'];
  const found=accFound(d),prior=d.access&&d.access.company;
  const pick=prior&&companies.includes(prior)?prior:found&&companies.includes(found)?found:'Another company';
  ACC={site_id:d.site_id,view:null,pvOpen:!(window.matchMedia&&window.matchMedia('(max-width:767px)').matches)};
  const dlg=accDialog(),who=d.name||'the client';
  dlg.innerHTML=`<form class="acc-b" id="accForm">
    <div class="acc-h"><span class="ak">${KEY_SVG}</span><div><h2 id="accTitle">Ask ${esc(who)} for access</h2><div class="sub">${esc(d.domain)} · they get an email with their own company’s steps</div></div><button type="button" class="acc-x" id="accX" aria-label="Close">×</button></div>
    <div class="acc-f"><div><label for="accCo">Their records are kept at</label><select id="accCo">${companies.map(c=>`<option${c===pick?' selected':''}>${esc(c)}</option>`).join('')}</select><div class="acc-hint">${found&&pick===found?'Found from the domain’s records today':'Pick the company that keeps the records, if you know it'}</div></div>
      <div><label for="accInv" id="accInvL">Invite this email</label><input id="accInv" autocomplete="off" value="${esc((d.access&&d.access.invite)||d.access_invite||'')}"><div class="acc-hint" id="accInvHint"></div></div></div>
    <div class="acc-own"><label for="accNote">A line of your own (optional)</label><textarea id="accNote" rows="2" maxlength="300"></textarea></div>
    <div id="accOut"><p class="muted" role="status">Getting the message ready…</p></div>
    <div class="acc-foot"><button type="button" class="linkbtn" id="accCopy" disabled>Copy the message</button><span class="grow"></span><button type="button" class="rowact" id="accCancel">Cancel</button><button type="submit" class="btn" id="accSend" disabled>Send</button></div>
    <p class="acc-msg" id="accMsg" role="status"></p></form>`;
  $('accX').addEventListener('click',()=>dlg.close());
  $('accCancel').addEventListener('click',()=>dlg.close());
  $('accCo').addEventListener('change',()=>accPreview());
  const later=()=>{clearTimeout(ACC_T);ACC_T=setTimeout(accPreview,400);};
  $('accInv').addEventListener('input',later);$('accNote').addEventListener('input',later);
  $('accCopy').addEventListener('click',accCopy);
  $('accForm').addEventListener('submit',accSend);
  dlg.showModal();$('accCo').focus();
  accPreview();
}
function accMailHtml(v){
  const body=String(v.text||'').split('\n\n').map((b)=>{
    const lines=b.split('\n');
    if(lines.every((l)=>/^\d+\. /.test(l)))return `<ol>${lines.map((l)=>`<li>${esc(l.replace(/^\d+\. /,''))}</li>`).join('')}</ol>`;
    const m=b.match(/^Sign in to (.+): https:\/\/\S+$/);
    if(m)return `<span class="signin">Sign in to ${esc(m[1])}</span>`;
    if(/^You keep your password/.test(b))return `<p class="keep">${esc(b)}</p>`;
    return `<p>${esc(b).replace(/\n/g,'<br>')}</p>`;
  }).join('');
  const to=v.to?esc((v.to_name?v.to_name+' ':'')+'<'+v.to+'>'):'<span class="muted">No email on their record</span>';
  return `<details class="acc-pv"${ACC&&ACC.pvOpen?' open':''}><summary>What ${esc((PANEL&&PANEL.name)||'the client')} gets</summary>
    <dl class="acc-meta"><dt>To</dt><dd>${to}</dd><dt>Subject</dt><dd>${esc(v.subject)}</dd></dl>
    <div class="acc-mail"><div class="band">${esc(v.studio||'')}</div><div class="mb">${body}</div></div></details>`;
}
async function accPreview(){
  if(!ACC)return;const gen=++ACC_SEQ,siteId=ACC.site_id;
  const body={company:$('accCo').value,invite:$('accInv').value.trim(),note:$('accNote').value,preview:true};
  let r;try{r=await apiSend('POST','/agency/domains/'+encodeURIComponent(siteId)+'/access',body);}catch(_){r={ok:false,body:{}};}
  if(!ACC||gen!==ACC_SEQ||ACC.site_id!==siteId)return;
  const out=$('accOut'),send=$('accSend'),copy=$('accCopy'),hint=$('accInvHint');
  if(r.status===422&&r.body&&r.body.error==='cannot_share'){
    ACC.view=null;send.disabled=true;copy.disabled=true;hint.textContent='';hint.classList.remove('bad');
    out.innerHTML=`<div class="acc-cant"><b>${esc(body.company)} can’t share access from the client’s side.</b><p>${esc(r.body.message)}</p><div class="dp-acts"><button type="button" class="rowact" id="accRecords">Send the records instead</button></div></div>`;
    $('accRecords').addEventListener('click',()=>{$('accDlg').close();const b=document.querySelector('#dpBody [data-help="connect_domain"]');if(b){b.click();b.scrollIntoView({block:'nearest'});}});
    return;
  }
  if(!r.ok||!r.body||!r.body.data){ACC.view=null;send.disabled=true;copy.disabled=true;out.innerHTML=`<p class="muted" role="status">${esc((r.body&&r.body.message)||'The message didn’t load just now. Close and try again.')}</p>`;return;}
  const v=r.body.data;ACC.view=v;
  $('accInvL').textContent=v.asks==='username'?`Your studio’s ${v.company} username`:'Invite this email';
  hint.textContent=v.invite_ok===false?v.invite_message:v.studio_note;hint.classList.toggle('bad',v.invite_ok===false&&!!body.invite);
  out.innerHTML=accMailHtml(v);
  const det=out.querySelector('details');if(det)det.addEventListener('toggle',()=>{if(ACC)ACC.pvOpen=det.open;});
  copy.disabled=false;
  send.disabled=!v.to||v.invite_ok===false;
  send.textContent=v.to?'Send to '+v.to:'Send';
  $('accMsg').textContent=v.to?'':'This client has no email on their record yet. Copy the message and send it yourself, or add their email first.';
}
async function accCopy(){
  const v=ACC&&ACC.view;if(!v)return;
  try{await navigator.clipboard.writeText('Subject: '+v.subject+'\n\n'+v.text);$('accMsg').textContent='Copied. Paste it into an email or a text to the client.';}
  catch(_){$('accMsg').textContent='Copying isn’t allowed here. Select the message and copy it instead.';}
}
async function accSend(e){
  if(e)e.preventDefault();
  if(!ACC||!ACC.view||!ACC.view.to)return;
  const b=$('accSend'),to=ACC.view.to,siteId=ACC.site_id;b.disabled=true;b.textContent='Sending…';
  let r;try{r=await apiSend('POST','/agency/domains/'+encodeURIComponent(siteId)+'/access',{company:$('accCo').value,invite:$('accInv').value.trim(),note:$('accNote').value});}catch(_){r={ok:false,body:{}};}
  if(!ACC||ACC.site_id!==siteId)return;
  if(!r.ok||!r.body||!r.body.data){b.disabled=false;b.textContent='Send to '+to;$('accMsg').textContent=(r.body&&r.body.message)||'That email didn’t go out just now. Try again.';return;}
  ACC_OPENER=null;$('accDlg').close();
  if(PANEL&&PANEL.site_id===siteId){PANEL={...PANEL,access:r.body.data.access};paintPanel();$('dpMsg').textContent='Sent to '+to+'. It waits here until you tick it off.';const f=document.querySelector('#dpBody [data-acc="arrived"]');if(f)f.focus();}
  syncAccessRow(siteId,r.body.data.access);
}
async function checkNow(){
  const d=PANEL;if(!d)return;const b=$('dpCheck');b.disabled=true;b.textContent='Checking…';
  let r;try{r=await apiSend('POST','/agency/domains/'+encodeURIComponent(d.site_id)+'/check');}catch(_){r={ok:false,body:{}};}
  if(!PANEL||PANEL.site_id!==d.site_id)return;
  if(!r.ok){b.disabled=false;b.textContent='Check now';$('dpMsg').textContent=(r.body&&r.body.message)||'That check didn’t go through just now.';return;}   // in the panel: a toast sits under the modal's backdrop
  PANEL=r.body.data;paintPanel();$('dpMsg').textContent='Checked just now.';
  const i=DOMAINS.findIndex(x=>x.site_id===PANEL.site_id);if(i>=0){DOMAINS[i]={...DOMAINS[i],...PANEL};render();}
  const nb=$('dpCheck');if(nb)nb.focus();
}
async function saveNotes(e){
  e.preventDefault();const d=PANEL;if(!d)return;
  const body={account:$('dpAcct').value,renews:$('dpRenew').value,renews_confirmed_at:$('dpConf').value||null,note:$('dpNote').value};
  const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;
  let r;try{r=await apiSend('PUT','/agency/domains/'+encodeURIComponent(d.site_id)+'/notes',body);}catch(_){r={ok:false,body:{}};}
  btn.disabled=false;
  if(!r.ok){const sv=$('dpSaved');if(sv)sv.textContent=(r.body&&r.body.message)||'Your notes didn’t save.';return;}
  PANEL={...PANEL,notes:r.body.data};const sv=$('dpSaved');if(sv)sv.textContent='Saved.';
  const li=DOMAINS.findIndex(x=>x.site_id===PANEL.site_id);if(li>=0){DOMAINS[li]={...DOMAINS[li],renews:r.body.data.renews,renews_confirmed_at:r.body.data.renews_confirmed_at};render();}   // item 174: the row's switch shows the same
}
function notAgency(){$('main').innerHTML=`<div class="center"><h2>This isn’t an agency account.</h2><p class="muted">Domains lists the domains a studio looks after for its clients.</p><p style="margin-top:20px"><a class="link" href="/presence.html#domain">Your domain →</a></p></div>`;}
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to your studio.</h2><p style="margin-top:20px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}
function trouble(){
  $('main').innerHTML=`<div class="center"><h2>We couldn’t load your domains just now.</h2><p class="muted" style="margin-bottom:16px">A brief hiccup — it usually passes.</p><button id="retry" class="btn">Try again</button></div>`;
  const rt=$('retry');if(rt)rt.addEventListener('click',()=>boot());
}
async function load(soft){
  const gen=++REQ_SEQ;
  let r;try{r=await api('/agency/domains');}catch(_){r={ok:false,status:0,body:{}};}
  if(gen!==REQ_SEQ)return;
  if(!r.ok){
    if(soft&&LOADED_AT){toast('Couldn’t refresh just now.',true);return;}
    if(r.status===401){signedOut();return;}
    if(r.status===403){notAgency();return;}
    trouble();return;
  }
  const d=(r.body&&r.body.data)||{};
  DOMAINS=Array.isArray(d.domains)?d.domains:[];BUILTIN=Array.isArray(d.builtin)?d.builtin:[];PARTIAL=!!r.body.partial;
  LOADED_AT=Date.now();render();
}
async function boot(){
  try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){signedOut();return;}
    await load();
  }catch(_){trouble();}
}
boot();
</script>
