<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipeline — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your sales pipeline — from first enquiry through onboarding.">
<!-- P2-C: Studio App sales pipeline on the ONE shared shell + shared state helpers. -->
<link rel="stylesheet" href="/fonts/brand.css">
<link rel="stylesheet" href="/shell.css">
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('dds-embed');</script>
<style>
html.dds-embed .dds-nav,html.dds-embed .dds-search,html.dds-embed #dds-mbar,html.dds-embed .dds-drawer,html.dds-embed #dds-offline{display:none!important}
html.dds-embed{--dds-shell-h:0px}
html.dds-embed body{padding-top:0!important;background:transparent}
html.dds-embed #listWrap{display:none!important}
html.dds-embed .backbar{display:none!important}
html.dds-embed #detailWrap{padding-top:0}

  /* ══ Bold redesign — Pipeline (Nov 2026): the board first. Chips with counts
     over the board, each column's chance beside its count, the person on each
     card, and "+ Add a deal" at the foot of a column. ══ */
  .bchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 var(--dds-s3,12px)}
  .bchip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .bchip .n{font-size:11.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
  .bchip:hover{border-color:color-mix(in srgb,var(--p) 45%,var(--line));color:var(--ink)}
  .bchip[aria-pressed="true"]{background:var(--p-soft);border-color:transparent;color:var(--p);font-weight:600}
  /* sales item 90: a value, close date or next step changes right in the table (the pencil) */
  .ced-cell{white-space:nowrap}
  .cedit{font:inherit;border:0;background:none;color:var(--faint);padding:4px;margin-left:4px;border-radius:6px;cursor:pointer;vertical-align:middle;opacity:.55;min-width:28px;min-height:28px;display:inline-flex;align-items:center;justify-content:center}
  tr:hover .cedit,.cedit:focus-visible{opacity:1}
  .cedit:hover{color:var(--p);background:var(--p-soft)}
  .cedit .si{width:15px;height:15px}
  @media (pointer:coarse){.cedit{opacity:1;min-width:44px;min-height:44px}}
  .ced{display:flex;flex-wrap:wrap;gap:6px;align-items:center;white-space:normal}
  .ced input{font:inherit;font-size:13.5px;min-height:34px;box-sizing:border-box;border:1px solid var(--p);border-radius:8px;padding:4px 8px;background:var(--card);color:var(--ink);max-width:190px}
  .ced button{font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:4px 12px;min-height:32px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .ced .ced-save{background:var(--p);border-color:var(--p);color:#fff}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ced .ced-save{color:#171320}}
  :root[data-theme="dark"] .ced .ced-save{color:#171320}
  @media (max-width:767px){.ced input,.ced button{min-height:44px}}
  .bchip[aria-pressed="true"] .n{color:var(--p)}
  .col-h{flex-wrap:wrap;row-gap:2px}
  .col-sub{flex:1 0 100%;display:flex;align-items:baseline;gap:8px;min-height:0}
  .col-sub:empty{display:none}
  .col-ch{font-size:11.5px;font-weight:600;color:var(--p);font-variant-numeric:tabular-nums}
  .col-ch:not([hidden])::after{content:" chance";font-weight:500;color:var(--faint)}
  .bc-who{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--soft);min-width:0}
  .bc-who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bc-av{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;background:var(--dds-grad-brand,var(--p))}
  .bc-v{color:var(--ink);font-weight:600}
  .bc-src{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:1px 8px}
  .col-add{margin-top:6px}
  .col-addbtn{width:100%;font:inherit;font-size:12.5px;font-weight:600;color:var(--soft);background:transparent;border:1px dashed var(--dds-line-strong,var(--line));border-radius:var(--dds-r,8px);padding:8px;cursor:pointer;text-align:left}
  .col-addbtn:hover{color:var(--p);border-color:var(--p)}
  .qadd{background:var(--card);border:1px solid var(--p);border-radius:var(--dds-r,8px);padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 14%,transparent)}
  .qadd input{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
  .qa-row{display:flex;gap:6px;align-items:center}
  .qa-v{display:flex;align-items:center;gap:4px;flex:1;min-width:0;color:var(--soft);font-size:13px}
  .qa-go{font:inherit;font-size:12.5px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:var(--dds-grad-btn,var(--p));color:var(--dds-on-p,#fff);cursor:pointer}
  .qa-go:disabled{opacity:.6}
  .qa-hint{font-size:11px;margin:0}
  .qa-err{font-size:12px;color:var(--bad);margin:0}
  @media (pointer:coarse){.bchip,.col-addbtn,.qa-go{min-height:44px}.qadd input{min-height:44px;font-size:16px}}

  /* ══ Bold redesign — Pipeline, the deal beside the board ══ */
  .bcard.dp-on{border-color:var(--p);box-shadow:0 0 0 2px color-mix(in srgb,var(--p) 30%,transparent)}
  dialog.dprev{position:fixed;z-index:2147483002;inset:var(--dds-side-gap,12px) var(--dds-side-gap,12px) var(--dds-side-gap,12px) auto;margin:0;padding:0;width:min(400px,calc(100vw - 24px));height:auto;max-width:none;max-height:none;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--dds-r-xl,20px);box-shadow:0 24px 60px -12px rgba(23,21,34,.30),0 2px 6px rgba(23,21,34,.06);overflow:hidden;animation:dp-in .18s ease-out}
  dialog.dprev[open]{display:flex}
  dialog.dprev::backdrop{background:rgba(19,17,32,.36)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) dialog.dprev::backdrop{background:rgba(4,3,10,.6)}}
  :root[data-theme="dark"] dialog.dprev::backdrop{background:rgba(4,3,10,.6)}
  @keyframes dp-in{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
  @keyframes dp-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @media (max-width:760px){dialog.dprev{inset:auto 0 0 0;width:auto;max-height:88dvh;border-radius:20px 20px 0 0;border-bottom:0;animation-name:dp-up}}
  .dp-head{display:flex;align-items:center;gap:12px;padding:18px 18px 10px}
  .dp-av{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--dds-grad-brand,var(--p))}
  .dp-t{flex:1;min-width:0}
  .dp-t h2{font-family:var(--dds-sans,inherit);font-size:17px;font-weight:650;line-height:1.25;overflow-wrap:anywhere;margin:0}
  .dp-t h2:focus{outline:none}
  .dp-t p{font-size:12.5px;color:var(--soft);margin:2px 0 0}
  .dp-x{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--soft);font-size:22px;line-height:1;cursor:pointer}
  .dp-x:hover{background:var(--dds-up,#f7f6fb);color:var(--ink)}
  .dp-body{flex:1;overflow:auto;padding:0 18px 12px}
  .dp-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 14px}
  .dp-tiles>div{background:var(--dds-up,#f7f6fb);border-radius:var(--dds-r,12px);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .dp-tiles span{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .dp-tiles b{font-size:15px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dp-stage{font-size:13px;color:var(--soft);margin:0 0 6px}
  .dp-stage b{color:var(--ink)}
  .dp-path{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 12px}
  .dp-path span{height:5px;border-radius:999px;background:var(--line)}
  .dp-path span.on{background:var(--dds-grad-btn,var(--p))}
  .dp-next{width:100%;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:999px;padding:11px 16px;background:var(--dds-grad-btn,var(--p));color:var(--dds-on-p,#fff);cursor:pointer;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--p) 70%,transparent);display:flex;flex-direction:column;align-items:center;gap:1px}
  .dp-next small{font-size:11.5px;font-weight:500;opacity:.85}
  .dp-next:disabled{opacity:.6}
  .dp-step{display:flex;gap:8px;align-items:baseline;font-size:13px;margin:12px 0 0;padding:8px 12px;border-radius:var(--dds-r,12px);background:var(--dds-up,#f7f6fb)}
  .dp-step span{color:var(--soft);font-size:12px}
  .dp-step.late{color:var(--bad)}
  .dp-l{font-family:var(--dds-sans,inherit);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
  .dp-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .dp-acts button.on{background:var(--p-soft);border-color:transparent;color:var(--p)}
  /* sales item 80 (Figma 264:1604): the deal card's Email box, under the quick actions */
  .dp-mail{margin:12px 0 2px;padding:14px;border:1px solid var(--dds-line-strong,var(--line));border-radius:16px;background:var(--card)}
  .dpm-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px -6px 8px 0}.dpm-h h3{margin:0;font-size:14.5px;font-weight:650;color:var(--ink)}
  .dpm-h .dp-x{width:32px;height:32px;font-size:19px}
  .dp-acts button{font:inherit;font-size:12.5px;font-weight:600;padding:10px 6px;border-radius:var(--dds-r,12px);background:var(--card);color:var(--ink);border:1px solid var(--dds-line-strong,var(--line));cursor:pointer}
  .dp-acts button:hover{border-color:var(--p);color:var(--p)}
  /* item 89: tap to call from the preview (a phone opens its dialler; back here, shell.js offers to log it) */
  .dp-call{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;margin-top:10px;font-size:14px;font-weight:600;text-decoration:none;color:var(--p);background:var(--card);border:1px solid var(--dds-line-strong,var(--line));border-radius:999px;padding:10px 16px}
  .dp-call svg{width:16px;height:16px;flex:0 0 auto}
  .dp-call:hover{border-color:var(--p)}
  .dp-latest{list-style:none;padding:0;margin:0}
  .dp-latest li{display:flex;gap:12px;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
  .dp-latest li:last-child{border-bottom:0}
  .dp-latest time{color:var(--faint);white-space:nowrap;font-size:12px}
  .dp-none{font-size:13px;color:var(--soft);margin:4px 0}
  .dp-wait{display:grid;gap:8px;padding:6px 0}
  .dp-skel{height:11px;border-radius:6px;background:var(--dds-up,#f7f6fb)}
  .dp-foot{padding:12px 18px 16px;border-top:1px solid var(--line)}
  .dp-open{width:100%;font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;border:1px solid var(--dds-line-strong,var(--line));background:var(--card);color:var(--ink);cursor:pointer}
  .dp-open:hover{border-color:var(--p);color:var(--p)}
  /* a phone: one stage at a time, picked from tabs over the board */
  .stabs{display:none}
  @media (max-width:760px){
    .stabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:2px}
    .stabs::-webkit-scrollbar{display:none}
    .stab{flex:0 0 auto;font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:6px 12px;min-height:44px;cursor:pointer;white-space:nowrap}
    .stab .n{font-size:11.5px;font-weight:600;color:var(--faint)}
    .stab[aria-pressed="true"]{background:var(--p-soft);border-color:transparent;color:var(--p);font-weight:600}
    .board.with-out{display:block}
    .board.with-out .col[data-col]{display:none}
    .board.with-out .col[data-col].on{display:block}
    .board.with-out .col-lost{display:none}
    .board-scroll{overflow:visible;margin:0;padding:0}
    /* the tabs carry each stage's count, so the stage strip under the numbers steps aside, and the chips keep one line */
    #listWrap:has(#board:not([hidden])) .sum-stages{display:none}
    .bchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .bchips::-webkit-scrollbar{display:none}
  }
  @media (pointer:coarse){.dp-x,.dpm-h .dp-x{width:44px;height:44px}.dp-acts button,.dp-open,.dp-next,.dp-call{min-height:44px}}
  @media (max-width:360px){.dp-acts{grid-template-columns:repeat(2,1fr)}}
  @media (prefers-reduced-motion:reduce){dialog.dprev{animation:none}}

  /* ══ Bold redesign — the one-screen proposal: services as chips, the lines,
     and what the client sees beside them ══ */
  .pb{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px;align-items:start;margin-top:8px}
  @media (max-width:900px){.pb{grid-template-columns:1fr}}
  .pb-l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:4px 0 6px}
  .pb-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
  .pb-chip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
  .pb-chip::before{content:"+ ";color:var(--p);font-weight:700}
  .pb-chip[aria-pressed="true"]{background:var(--p-soft);border-color:transparent;color:var(--p);font-weight:600}
  .pb-chip[aria-pressed="true"]::before{content:"✓ "}
  .pb-view{position:sticky;top:16px;background:var(--dds-up,#f7f6fb);border-radius:var(--dds-r-lg,16px);padding:12px 14px}
  .pb-card{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r,12px);padding:14px 16px;box-shadow:var(--shadow)}
  .pb-biz{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft)}
  .pb-mark{width:18px;height:18px;border-radius:5px;background:var(--dds-grad-brand,var(--p))}
  .pb-title{font-weight:650;font-size:15px;margin:8px 0 10px}
  .pb-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0}
  .pb-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .pb-total{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:700}
  .pb-total b{font-size:16px}
  .pb-cta{margin-top:12px;text-align:center;border-radius:999px;padding:10px;font-weight:600;font-size:13.5px;background:var(--dds-grad-btn,var(--p));color:var(--dds-on-p,#fff)}
  .pb-foot{font-size:12px;margin:8px 2px 0}
  @media (pointer:coarse){.pb-chip{min-height:44px}}
</style>
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically) — same aliasing pattern
     as crm.html / inbox.html. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) —
     the Path's current chevron sits on the same var(--p) fill (same fix in crm.html) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost),:root:not([data-theme="light"]) .path button.pstep.current{color:#171320}}
  :root[data-theme="dark"] .btn:not(.ghost),:root[data-theme="dark"] .path button.pstep.current{color:#171320}
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:var(--dds-w-app,1280px);margin:0 auto;padding:var(--dds-s7,32px) var(--dds-s5,20px) 80px}
  h1{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:var(--dds-s1,4px)}
  .sub{color:var(--soft);font-size:14px;margin-bottom:var(--dds-s5,20px)}
  /* ── roster header (.lhead) — the same list-view anatomy as customers.html /
        leads.html / contacts.html: object icon · ONE h1 · ↻ · count/money meta ── */
  .lhead{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);padding:var(--dds-s3,12px) var(--dds-s4,16px) 10px;margin-bottom:var(--dds-s3,12px)}
  .lrow1{display:flex;align-items:center;gap:10px}
  .si{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.18em;flex:0 0 auto}
  .obj-ic{width:34px;height:34px;border-radius:var(--dds-r,8px);background:var(--p);color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .lhead h1{font-size:20px;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:var(--dds-r,8px);padding:var(--dds-s1,4px) 10px;min-height:34px;cursor:pointer}
  .lbtn:hover{color:var(--p);background:var(--p-soft)}
  .lmeta{margin-top:6px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .search{width:100%;font-family:inherit;font-size:16px;padding:10px var(--dds-s4,16px);border:1px solid var(--line);border-radius:var(--dds-r,8px);background:var(--card);color:var(--ink);margin-bottom:var(--dds-s3,12px)}
  .search:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  /* the calm "your numbers" strip — plain numbers, tabular, no chart */
  .summary{margin-bottom:var(--dds-s5,20px)}
  .summary:empty{display:none}
  /* visual refresh: the summary is four icon stat tiles in one bordered strip */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);background:var(--card);overflow:hidden}
  .stats .st{display:flex;align-items:center;gap:var(--dds-s3,12px);padding:var(--dds-s3,12px) var(--dds-s4,16px);border-left:1px solid var(--line);min-width:0}
  .stats .st:first-child{border-left:none}
  .stats .exp-sub{display:none}   /* item 69: shown under Open on a phone only (its own tile elsewhere) */
  .stats .ico{width:36px;height:36px;border-radius:var(--dds-r,8px);display:grid;place-items:center;flex:0 0 auto;background:var(--p-soft);color:var(--p)}
  .stats .ico.good{background:var(--good-soft);color:var(--good)} .stats .ico.warn{background:var(--warn-soft);color:var(--warn)} .stats .ico.info{background:var(--dds-info-soft,#e8f1fb);color:var(--dds-info,#2a6fb5)}
  .stats .ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .stats .st-main{min-width:0;flex:1}
  .stats .k{font-size:12px;color:var(--faint)}
  .stats .v{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stats .s{font-size:12px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Oct 2026: the Outstanding tile's sub carries the "see who →" opener, and with both an
     overdue and a processing amount it outgrows a phone/tablet tile — so that one sub wraps
     instead of ellipsising (which clipped the link). The other three tiles keep the one line. */
  .stats .s.multiline{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
  .sum-stages{display:flex;gap:var(--dds-s2,8px);flex-wrap:wrap;margin-top:var(--dds-s2,8px)}
  .sum-stages .sc{display:flex;flex-direction:column;gap:1px;padding:6px var(--dds-s3,12px);border:1px solid var(--line);border-radius:var(--dds-r,8px);background:var(--card);min-width:88px}
  .sum-stages .sc-l{font-size:12px;color:var(--faint)}
  .sum-stages .sc-n{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar{display:flex;gap:var(--dds-s2,8px);align-items:center;flex-wrap:wrap;margin-bottom:var(--dds-s4,16px)}
  .chip{font-size:13px;padding:var(--dds-s1,4px) var(--dds-s3,12px);border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer;font-family:inherit}
  .chip.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  .qfu{flex-wrap:wrap;gap:6px}.qfu .chip{font-size:12.5px}   /* sales item 85: Follow up on [day] */
  @media (max-width:767px){.qfu .chip,.qfu input[type=date]{min-height:44px}}
  /* visual refresh: the display toggle is a segmented control, not chips */
  .viewtog{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:var(--dds-r,8px);overflow:hidden;background:var(--bg)}
  .viewtog .chip{border:none;border-radius:0;background:transparent;padding:var(--dds-s1,4px) var(--dds-s3,12px);font-size:12.5px;font-weight:500}
  .viewtog .chip.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
  .btn{font:inherit;font-size:13.5px;font-weight:500;border:none;border-radius:var(--dds-r,8px);padding:var(--dds-s2,8px) var(--dds-s4,16px);background:var(--p);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s4,16px) var(--dds-s4,16px);margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;gap:var(--dds-s3,12px);align-items:center}
  .card:hover{border-color:var(--p)}
  .card .t{font-weight:600}
  .card .m{color:var(--soft);font-size:13px;margin-top:2px}
  .stage{font-size:12px;font-weight:500;padding:var(--dds-s1,4px) var(--dds-s2,8px);border-radius:999px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .stage.won{background:var(--good-soft);color:var(--good)}
  .stage.lost{background:transparent;border:1px solid var(--line);color:var(--soft)}
  /* Oct 2026 (benchmark item 2): the money-state chip — Paid · Processing · Upcoming ·
     Overdue — on the drawer's invoice rows and the "Who owes you" list, in MONEY_TONE's
     one colour each (good · info · '' · bad); crm.html's .schip recipe on this page's .stage. */
  .stage.good{background:var(--good-soft);color:var(--good)}
  .stage.info{background:var(--dds-info-soft,#e8f1fb);color:var(--dds-info,#2a6fb5)}
  .stage.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
  .stage.void{background:var(--bg);color:var(--faint)}
  .val{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px}
  dialog{border:none;border-radius:var(--dds-r-lg,10px);padding:0;max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(27,21,37,.4)}
  .dhead{padding:var(--dds-s5,20px) var(--dds-s5,20px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:start}
  .dbody{padding:var(--dds-s5,20px) var(--dds-s5,20px);max-height:64vh;overflow:auto}
  .sec{margin-top:var(--dds-s4,16px)}.sec h3{font-size:12px;color:var(--faint);margin-bottom:var(--dds-s2,8px)}
  .row2{display:flex;gap:var(--dds-s2,8px);flex-wrap:wrap;align-items:center;margin-top:var(--dds-s2,8px)}
  /* the "More ▾" beside the one send button (same shape as crm.html's action bar menu) */
  .more{position:relative;display:inline-block}
  .more-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:5;min-width:220px;background:var(--card,var(--bg));border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--dds-shadow-pop,0 8px 28px rgba(21,20,26,.12));padding:var(--dds-s1,4px);display:flex;flex-direction:column;gap:2px}
  .more-menu[hidden]{display:none}
  .more-menu .btn{border:none;background:transparent;color:var(--ink);text-align:left;border-radius:var(--dds-r-sm,6px);width:100%}
  .more-menu .btn:hover{background:var(--bg)}
  form.mini{display:flex;flex-direction:column;gap:var(--dds-s2,8px);margin-top:10px;padding:var(--dds-s3,12px);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);background:var(--bg)}
  input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:var(--dds-s2,8px) var(--dds-s3,12px);width:100%}
  textarea{min-height:90px;resize:vertical}
  label{font-size:12.5px;color:var(--soft);display:block;margin:2px 0 var(--dds-s1,4px)}
  .mut{color:var(--soft);font-size:13px}
  /* activity quick-log + merged timeline */
  .qlog{border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s3,12px);background:var(--bg);margin-bottom:var(--dds-s3,12px)}
  #list .card .m.conv,#table .conv{color:var(--p);font-weight:500}
  .qlog .kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--dds-s2,8px)}
  .qlog .kb{font:inherit;font-size:13px;padding:6px var(--dds-s3,12px);border-radius:var(--dds-r,8px);border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
  .qlog .kb.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:500}
  .qlog textarea{min-height:44px}
  .qlog .qrow{display:flex;gap:var(--dds-s2,8px);align-items:center;margin-top:var(--dds-s2,8px);flex-wrap:wrap}
  .qlog .qrow input[type=date]{width:auto;flex:0 0 auto}
  .tl{list-style:none;padding:0;margin:6px 0 0}
  .tl-i{display:flex;gap:10px;padding:var(--dds-s2,8px) 0;border-bottom:1px solid var(--line)}
  .tl-i:last-child{border-bottom:none}
  .tl-ic{flex:0 0 auto;width:22px;text-align:center;line-height:1.5;color:var(--faint)}
  .tl-bd{flex:1;min-width:0}
  .tl-tx{font-size:13.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .tl-mt{font-size:12px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
  a{color:var(--p)}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}
  /* ── Path (Lightning chevrons, dds skin) — kept in sync with crm.html by hand
        (its .pathcard/.pstep/.path-guide/.path-confirm/.terminal-chip block):
        same shapes, same done/current/todo + won/lost terminal states, same
        interactivity rules (only the current step + the one legal back-target). ── */
  .pathrow{display:flex;gap:var(--dds-s3,12px);align-items:center;flex-wrap:wrap}
  .path{display:flex;flex:1 1 340px;min-width:0}
  .path button.pstep{flex:1;min-width:0;border:none;font-family:inherit;font-size:12.5px;font-weight:500;padding:var(--dds-s2,8px) var(--dds-s4,16px);cursor:default;
    background:var(--card);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0;
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
  .path button.pstep:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);border-radius:var(--dds-r,8px) 0 0 var(--dds-r,8px)}
  .path button.pstep:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,11px 50%);border-radius:0 var(--dds-r,8px) var(--dds-r,8px) 0}
  .path button.pstep.done{background:var(--good-soft);color:var(--good)}
  .path button.pstep.canback{cursor:pointer}
  .path button.pstep.canback:hover{filter:brightness(.96)}
  .path button.pstep.current{background:var(--p);color:#fff;cursor:pointer}
  .path button.pstep.current:hover{filter:brightness(1.06)}
  .path button.pstep.lost-terminal{background:var(--warn-soft);color:var(--warn)}
  .path-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .path-guide{margin-top:10px;font-size:13.5px;color:var(--soft)}
  .path-guide b{color:var(--ink);font-weight:600}
  .path-confirm{margin-top:10px;display:flex;gap:var(--dds-s2,8px);align-items:center;font-size:13.5px;flex-wrap:wrap}
  .terminal-chip{font-size:12px;font-weight:700;border-radius:999px;padding:var(--dds-s1,4px) var(--dds-s3,12px)}
  .terminal-chip.won{background:var(--good-soft);color:var(--good)}
  .terminal-chip.lost{background:var(--warn-soft);color:var(--warn)}
  /* View toggle (List · Board · Table) */
  .viewtog{display:inline-flex;gap:var(--dds-s1,4px)}
  /* ── Table view: sortable columns; the table scrolls in its OWN container ── */
  #table .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px)}
  #table table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  #table thead th{text-align:left;font-size:12px;color:var(--faint);font-weight:500;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
  #table thead th .thb{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:none;padding:var(--dds-s3,12px) var(--dds-s4,16px);width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:var(--dds-s1,4px)}
  #table thead th .thb:hover{color:var(--p)}
  #table thead th .arrow{font-size:10px;color:var(--p)}
  #table tbody tr{cursor:pointer}
  #table tbody tr:hover{background:var(--p-soft)}
  #table tbody tr:focus-visible{outline:2px solid var(--p);outline-offset:-2px}
  #table tbody td{padding:var(--dds-s3,12px) var(--dds-s4,16px);border-bottom:1px solid var(--line);vertical-align:middle}
  #table tbody tr:last-child td{border-bottom:none}
  #table td .dn{font-weight:600}
  #table td.num{font-variant-numeric:tabular-nums}
  #table td .over{color:var(--bad);font-weight:600}
  #table td .due-today{color:var(--warn);font-weight:600}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  /* Kanban board — columns = open stages, cards = deals, tap/drag to move */
  .board-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1 * var(--dds-s5,20px));padding:2px var(--dds-s5,20px) 6px}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:var(--dds-s3,12px);align-items:start}
  .col{background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:10px;min-width:220px}
  /* visual refresh: a soft tint per stage (same order as the open STAGES) so the
     board reads at a glance; the dark palette keeps the plain surface */
  .col:nth-child(1){background:#f5f2fc} .col:nth-child(2){background:#fdf6ec} .col:nth-child(3){background:#eef4fb} .col:nth-child(4){background:#fbeff5}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .col{background:var(--bg)}}
  :root[data-theme="dark"] .col{background:var(--bg)}
  .col-tip{color:var(--soft)}
  .col-h{display:flex;justify-content:space-between;align-items:center;gap:var(--dds-s2,8px);margin-bottom:2px}
  .col-t{font-weight:600;font-size:13.5px;flex:1}
  .col-n{font-size:12px;color:var(--faint);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px var(--dds-s2,8px);font-variant-numeric:tabular-nums}
  .col-val{font-size:11.5px;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
  .col-tip{font-size:11.5px;margin-bottom:var(--dds-s2,8px);line-height:1.4}
  .col-body{display:flex;flex-direction:column;gap:var(--dds-s2,8px);min-height:40px;border-radius:var(--dds-r,8px);padding:2px;transition:background var(--dds-t-fast,120ms) var(--dds-ease,ease-out)}
  .col-body.drop-ok{outline:1px dashed var(--p);outline-offset:-2px}
  .col-body.drop-over{background:var(--p-soft)}
  .bempty{font-size:12px;text-align:center;padding:10px var(--dds-s1,4px);opacity:.7}
  /* sales review item 31: the Views menu and the Columns picker beside the toolbar's buttons */
  .pvwrap,.colsdd{position:relative}
  /* final pass, batch C: on a phone the toolbar wrapped to three rows. Manage services, Import CSV
     and Columns fold under More, so it's one row of actions above List · Board · Table. */
  .morewrap{display:none;position:relative}
  @media (max-width:600px){#mngServicesTop,#importDeals,#colsWrap,#chartsBtn,#printBtn{display:none!important}.morewrap{display:inline-block}}
  .pvmenu{position:absolute;z-index:40;top:calc(100% + 4px);left:0;min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow,0 12px 32px rgba(0,0,0,.14));padding:6px}
  .pvmenu button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;border:none;background:none;color:var(--ink);padding:8px 10px;border-radius:var(--dds-r,8px);cursor:pointer}
  .pvmenu button:hover,.pvmenu button:focus-visible{background:var(--p-soft)}
  .pvmenu button[aria-checked="true"]{color:var(--p);font-weight:700}
  .pvmenu .pvsep{border-top:1px solid var(--line);margin:4px 0}
  .pvmenu .pvnone{font-size:13px;color:var(--soft);padding:8px 10px}
  /* Sales review item 30: the board ends with a collapsed Won column and a
     Not-a-fit drop zone, narrower than the four open stages */
  .board.with-out{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(170px,1fr)) repeat(2,minmax(120px,.55fr))}
  .board.with-out .col{min-width:0}
  .col.col-won{background:var(--good-soft,#e6f2ea)}
  .won-v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 8px}
  .col-out .linkbtn{font:inherit;font-size:12.5px;font-weight:500;color:var(--p);background:none;border:none;padding:0;cursor:pointer;text-align:left}
  .lost-drop{min-height:72px;border:1px dashed var(--line-strong,var(--line));justify-content:center}
  /* Sales review item 36: the first-deal walkthrough on an empty pipeline */
  .firstdeal{max-width:640px;margin:8px auto;padding:var(--dds-s5,20px) var(--dds-s5,20px) var(--dds-s4,16px);background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px)}
  .firstdeal h3{margin:0 0 4px;font-size:17px}
  .firstdeal>p{margin:0 0 12px;color:var(--soft);font-size:14px}
  .firstdeal ol{margin:0;padding:0;list-style:none;counter-reset:fd}
  .firstdeal li{counter-increment:fd;position:relative;padding:10px 0 10px 40px;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
  .firstdeal li:first-child{border-top:0}
  .firstdeal li::before{content:counter(fd);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:999px;background:var(--p-soft);color:var(--p);font-weight:700;font-size:13px;display:grid;place-items:center}
  .firstdeal li b{display:block}
  .firstdeal li span{color:var(--soft)}
  .firstdeal .fd-act{margin-top:8px}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:10px;cursor:pointer;position:relative}
  .bcard:hover{border-color:var(--p)}
  .bcard.dragging{opacity:.5}
  .bc-t{font-weight:600;font-size:13.5px;line-height:1.35}
  .bc-v{font-variant-numeric:tabular-nums;color:var(--soft);font-size:12.5px;margin-top:var(--dds-s1,4px)}
  .bc-m{color:var(--faint);font-size:12px;margin-top:var(--dds-s1,4px)}
  .bcard.is-stale{border-left:2px solid var(--warn,#775d31)}
  .whats-next{border:1px solid var(--line);border-left:3px solid var(--p);border-radius:var(--dds-r,8px);padding:10px var(--dds-s3,12px);margin:0 0 10px;background:var(--p-soft,rgba(91,63,160,.06))}
  .btn.sm{padding:var(--dds-s1,4px) 10px;font-size:12.5px}
  .bc-stale{display:inline-block;font-size:12px;font-weight:500;color:var(--warn,#775d31);background:rgba(154,107,18,.12);border-radius:999px;padding:1px var(--dds-s2,8px);margin-top:6px}
  .bc-due{color:var(--warn);font-weight:600;font-size:12px;margin-top:var(--dds-s1,4px)}
  .bc-due.late{color:var(--bad)}
  .bc-actions{margin-top:var(--dds-s2,8px);position:relative}
  /* popup contract: the Move trigger + every menu option meet the 44px touch floor */
  .bc-move{font:inherit;font-size:12px;font-weight:600;color:var(--p);background:transparent;border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:var(--dds-s1,4px) var(--dds-s3,12px);min-height:44px;cursor:pointer}
  .bc-move:hover{border-color:var(--p)}
  .bc-menu{position:absolute;left:0;top:calc(100% + 4px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r,8px);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:var(--dds-s1,4px);display:flex;flex-direction:column;min-width:170px}
  .bc-menu button{font:inherit;font-size:13px;text-align:left;background:transparent;border:none;color:var(--ink);padding:var(--dds-s2,8px) 10px;min-height:44px;display:flex;align-items:center;border-radius:var(--dds-r,8px);cursor:pointer}
  .bc-menu button:hover{background:var(--p-soft)}
  .board-foot{margin-top:var(--dds-s3,12px);font-size:12.5px}

  /* ─────────────────────────────────────────────────────────────────────────
     FULL-SCREEN DEAL DETAIL — the deal opens as a roomy in-page page (same tab),
     not a cramped modal. It sits in normal document flow inside its own .wrap, so
     the page scrolls naturally. Everything below is SCOPED to #detailWrap /
     #detailInner so the pipeline list, board, and the other dialogs are untouched.
     ───────────────────────────────────────────────────────────────────────── */
  #detailWrap{max-width:var(--dds-w-app,1280px)}
  #detailInner{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);overflow:hidden}
  .backbar{padding:var(--dds-s4,16px) var(--dds-s5,20px) 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .backbar .btn{padding:var(--dds-s2,8px) var(--dds-s4,16px)}
  /* compact record header — the record page's header idiom (crm.html .rec-head):
     object icon · serif name · one clean sub-row of chips + facts */
  #detailInner .dhead{padding:var(--dds-s4,16px) var(--dds-s6,24px) var(--dds-s5,20px);justify-content:flex-start;align-items:flex-start;gap:var(--dds-s4,16px)}
  #detailInner .dh-ic{width:44px;height:44px;border-radius:var(--dds-r-lg,10px);background:var(--p);color:#fff;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
  #detailInner #dtitle{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;outline-offset:3px}
  #detailInner .dh-sub{display:flex;flex-wrap:wrap;gap:6px var(--dds-s4,16px);align-items:center;font-size:14px;color:var(--soft);margin-top:var(--dds-s1,4px)}
  #detailInner .dh-sub a{color:var(--p);text-decoration:none}
  #detailInner .dh-sub a:hover{text-decoration:underline}
  #detailInner .dh-sub .fact strong{color:var(--ink);font-weight:600}
  /* it's a full page now — no inner scroll box; each section breathes as a card */
  #detailInner .dbody{padding:var(--dds-s2,8px) var(--dds-s6,24px) var(--dds-s7,32px);max-height:none;overflow:visible}
  #detailInner .sec{margin:0 0 var(--dds-s4,16px);background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s5,20px) var(--dds-s5,20px)}
  #detailInner .sec:last-child{margin-bottom:0}
  /* related-list card headers — same idiom as crm.html's Deal-tab cards (.card-h .t) */
  #detailInner .sec h3{font-family:var(--sans);font-weight:700;font-size:14.5px;text-transform:none;letter-spacing:normal;color:var(--ink);margin-bottom:var(--dds-s3,12px)}

// ── Table view: the deals as a sortable list-view table (Deal · Contact ·
// Stage · Value · Next step (due) · Last contacted). Rows open the SAME drawer;
// nothing edits inline. Contact names aren't in the deals LIST response (only
// contact_id), so the Contact column joins them client-side from the EXISTING
// GET /sales/contacts read — fetched once, cached, degrading to “—”. ──
let CONTACT_NAME=null,CONTACT_TEXT=null,CONTACT_LOADING=null,CONTACT_FAILED=false,CONTACT_PHONE={};
function ensureContactNames(){

  // right back to 100 — the old limit=500 claimed a capacity the server refuses).
  // item 66: this first read covers most studios in one go; any loaded deal whose
  // contact is older than the newest 100 is then looked up by id (fillMissingNames),
  // 100 ids a read, so every deal on the page says whose it is.
  // include_deleted=1: this join only ever LABELS deals that already exist. A
  // contact removed from the roster must not turn their own historical deals

  // still real, and it still belongs to whoever it belonged to. Same site
  // scope; the roster read is unchanged and still hides them.
  CONTACT_LOADING=api('/sales/contacts?limit=100&include_deleted=1')
    .then(r=>{CONTACT_NAME={};CONTACT_TEXT={};CONTACT_FAILED=false;NAMES_ASKED=new Set();for(const c of (r.data||[]))nameOf(c);})
    .then(()=>fillMissingNames())

const telOf=(p)=>{const d=String(p||'').trim().replace(/[^\d+]/g,'').replace(/(?!^)\+/g,'');return d.replace(/\D/g,'').length>=3?'tel:'+d:'';};

// "1.200,50" (Excel set to European numbers) or "1 200,50". The LAST separator followed by
// one or two digits is the decimal point; any other separators group thousands. Keeping only
// digits and dots turned "1.200,50" into 1.2005 — 120 cents. Never negative.
// item 97 (B20): a trailing k is thousands — "5k" is $5,000 and "1.5k" $1,500. The letters were
// thrown away before the number was read, so "5k" was saved as $5 without a word.
function amountCents(raw){

  const v=(parseInt(whole||'0',10)*100+(m?parseInt(m[1].length===1?m[1]+'0':m[1],10):0))*(k?1000:1);
  return Number.isFinite(v)&&v>0?v:0;

let STALE_Q=null;

const BOARD_MOVING=new Set();   // deals with a stage change on its way (wireBoard's move)

  // the open preview of the same deal repaints, or it kept the old stage and its old "Move to";
  // the board reloads in place, so a half-typed "+ Add a deal" in another column survives (B19)
  const move=async(id,to)=>{if(BOARD_MOVING.has(id))return;BOARD_MOVING.add(id);
    try{await api('/sales/deals/'+id+'/stage','POST',{to});PENDING_BACK='';toast('Moved to '+stageLabel(to));await load(true);

    c.onkeydown=(e)=>{if((e.key==='Enter'||e.key===' ')&&!isCtrl(e)){e.preventDefault();openDealPreview(c.dataset.id,c);}};
    c.ondragstart=(e)=>{DRAG={id:c.dataset.id,from:c.dataset.stage};c.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.id);}catch(_){}}
      host.querySelectorAll('.col-body').forEach(b=>{if(boardCanMove(c.dataset.stage,b.dataset.drop))b.classList.add('drop-ok');});};
    c.ondragend=()=>{c.classList.remove('dragging');host.querySelectorAll('.col-body').forEach(b=>b.classList.remove('drop-ok','drop-over'));DRAG=null;};
  });

  // (outside clicks dismiss via the ONE document-level closer above).
  host.querySelectorAll('.bc-move').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const card=btn.closest('.bcard'); const already=card.querySelector('.bc-menu');
      host.querySelectorAll('.bc-menu').forEach(m=>m.remove());
      host.querySelectorAll('.bc-move').forEach(b=>b.setAttribute('aria-expanded','false'));
      if(already) return;   // second tap closes it
      btn.setAttribute('aria-expanded','true');
      const menu=document.createElement('div'); menu.className='bc-menu'; menu.setAttribute('role','menu');
      menu.innerHTML=boardMoveTargets(card.dataset.stage).map(t=>`<button type="button" role="menuitem" data-to="${t}">${t==='lost'?'Mark as not a fit':'Move to '+esc(stageLabel(t))}</button>`).join('');
      card.querySelector('.bc-actions').appendChild(menu);
      menu.querySelectorAll('button').forEach(mb=>mb.onclick=(ev)=>{ev.stopPropagation();move(card.dataset.id,mb.dataset.to);});
      // focus the invoker BEFORE removing: removing the focused node makes the
      // browser's focus fixup land on <body>, clobbering a focus() issued after.
      const close=()=>{btn.focus();menu.remove();btn.setAttribute('aria-expanded','false');};
      // Tab-out closes too (no zombie open menu with aria-expanded=true) —
      // WITHOUT stealing focus back: the user chose to leave, let them land
      // where Tab took them. relatedTarget inside the menu = arrow/tab within.
      // A NULL relatedTarget is NOT "focus left the document": iOS Safari blurs
      // on tap without focusing anything, and contains(null) is false — the menu
      // would be REMOVED between pointerdown and click, so the tap lands on the
      // card underneath instead of the move it aimed at.
      menu.addEventListener('focusout',(ev)=>{const to=ev.relatedTarget;if(!to)return;if(!menu.isConnected||menu.contains(to))return;menu.remove();btn.setAttribute('aria-expanded','false');});
      menu.addEventListener('keydown',(ev)=>{

      });

    btn.onkeydown=(e)=>{

  // gently refused (and the column never lights up as droppable in the first place).
  host.querySelectorAll('.col-body').forEach(body=>{
    body.ondragover=(e)=>{if(DRAG&&boardCanMove(DRAG.from,body.dataset.drop)){e.preventDefault();body.classList.add('drop-over');}};

  });
}

    // Resume · Stop. Every action re-reads the deal so the rows say the server's truth.
    const recToday=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
    const firstOfNext=()=>{const t=new Date();const n=new Date(t.getFullYear(),t.getMonth()+1,1);return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-01';};
    const recFields=(s)=>{const k=s?s.id:'new';return `<div class="mini" style="margin-top:8px">
        <label class="mut" for="rec-title-${k}">What it’s for</label><input id="rec-title-${k}" data-rf="title" type="text" maxlength="120" placeholder="Website care" value="${esc(s?s.title:'')}">
        <div class="row2" style="margin-top:6px;align-items:flex-end;flex-wrap:wrap">
          <div><label class="mut" for="rec-amt-${k}">Amount (USD)</label><input id="rec-amt-${k}" data-rf="amt" type="number" step="0.01" min="0.5" placeholder="500" style="max-width:140px" value="${s?esc(String((s.amount_cents||0)/100)):''}"></div>
          ${s?'':`<div><label class="mut" for="rec-every-${k}">How often</label><select id="rec-every-${k}" data-rf="every"><option value="month">Every month</option><option value="quarter">Every 3 months</option><option value="year">Every year</option></select></div>`}
          <div><label class="mut" for="rec-on-${k}">${s?'Next invoice goes out on':'First invoice goes out on'}</label><input id="rec-on-${k}" data-rf="on" type="date" min="${recToday()}" value="${esc(s?(s.next_on||''):firstOfNext())}"></div>
          <div><label class="mut" for="rec-times-${k}">How many times</label><input id="rec-times-${k}" data-rf="times" type="number" min="1" max="120" step="1" placeholder="Until you stop it" style="max-width:150px" value="${s&&s.times?esc(String(s.times)):''}"></div>
        </div>
        <div class="mut" style="font-size:12px;margin-top:6px">${s?'Changes apply from the next invoice on.':'If the first date is today, it goes out right away. You’ll see a note under Updates three days before each one.'}</div>
        <div class="row2" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost" type="button" data-rec-cancel>Cancel</button><button class="btn" type="button" data-rec-go>${s?'Save changes':'Start'}</button></div></div>`;};
    const recValues=(host)=>{const f=(n)=>host.querySelector('[data-rf="'+n+'"]');return {title:(f('title').value||'').trim(),amount:parseFloat(f('amt').value||'0'),every:(f('every')||{}).value,on:f('on').value||'',times:(f('times').value||'').trim()};};
    const setupRec=$('setupRecurring'); if(setupRec) setupRec.onclick=()=>{const host=$('recForm');host.innerHTML=recFields(null);host.querySelector('[data-rec-cancel]').onclick=()=>host.innerHTML='';setTimeout(()=>{const t=host.querySelector('[data-rf="title"]');if(t)t.focus();},20);
      const go=host.querySelector('[data-rec-go]');go.onclick=async()=>{const v=recValues(host);if(!v.title){toast('Say what it’s for — for example, Website care.',true);return;}if(!v.amount||v.amount<0.5){toast('Enter an amount of at least $0.50.',true);return;}if(!v.on){toast('Pick the date the first one goes out.',true);return;}
        go.disabled=true;try{const r=await api('/sales/deals/'+id+'/recurring','POST',{title:v.title,amount_cents:Math.round(v.amount*100),every:v.every||'month',first_on:v.on,times:v.times?Number(v.times):null});const x=r.data||{};const out=x.sent&&x.sent.result;
          toast(out==='sent'?('Recurring invoice started — the first one just went out'+(x.sent.emailed&&c&&c.name?' to '+c.name:'')):out==='paused'?'Recurring invoice started, but it paused itself — the deal says why.':out?'Recurring invoice started — the first one goes out in a few minutes.':('Recurring invoice started — the first one goes out '+niceDay(v.on)+'.'));openDeal(id);}catch(e){toast(nice(e),true);go.disabled=false;}};};
    $('detailInner').querySelectorAll('[data-rec-change]').forEach(b=>b.onclick=()=>{const s=RECS.find(x=>x.id===b.dataset.recChange);const host=$('recForm-'+b.dataset.recChange);if(!s||!host)return;host.innerHTML=recFields(s);host.querySelector('[data-rec-cancel]').onclick=()=>host.innerHTML='';
      const go=host.querySelector('[data-rec-go]');go.onclick=async()=>{const v=recValues(host);const body={};if(v.title&&v.title!==s.title)body.title=v.title;if(v.amount&&Math.round(v.amount*100)!==s.amount_cents)body.amount_cents=Math.round(v.amount*100);if(v.on&&v.on!==s.next_on)body.next_on=v.on;const t=v.times?Number(v.times):null;if(t!==(s.times||null))body.times=t;
        if(!Object.keys(body).length){toast('Nothing changed.');host.innerHTML='';return;}go.disabled=true;try{await api('/sales/recurring/'+s.id,'PATCH',body);toast('Recurring invoice changed — it applies from the next one.');openDeal(id);}catch(e){toast(nice(e),true);go.disabled=false;}};});
    const recAct=(attr,act,ask,done)=>$('detailInner').querySelectorAll('['+attr+']').forEach(b=>b.onclick=async()=>{const sid=b.getAttribute(attr);const s=RECS.find(x=>x.id===sid)||{};const q=ask&&ask(s);if(q&&!confirm(q))return;b.disabled=true;try{const r=await api('/sales/recurring/'+sid+'/'+act,'POST',{});toast(done(s,r.data||{}));openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    recAct('data-rec-skip','skip',(s)=>s.next_on?`Skip the ${niceDay(s.next_on)} invoice? Nothing goes out that day — the one after goes out as usual.`:'',(s,x)=>x.next_on?'Skipped — the next one goes out '+niceDay(x.next_on):'Skipped');
    recAct('data-rec-pause','pause',null,()=>'Paused — nothing goes out until you resume it.');
    recAct('data-rec-resume','resume',(s)=>'Resume this recurring invoice? The next one goes out '+(s.next_on&&s.next_on>=recToday()?niceDay(s.next_on):'today')+'.',(s,x)=>'Resumed — the next one goes out '+(x.next_on?niceDay(x.next_on):'on its usual day'));
    recAct('data-rec-stop','stop',()=>'Stop this recurring invoice? No more invoices go out. The ones already sent stay as they are.',()=>'Stopped — no more invoices will go out.');
    const cancelRet=$('cancelRetainer'); if(cancelRet) cancelRet.onclick=async()=>{if(!confirm('Cancel this retainer? Future charges stop. Past payments are unaffected.'))return;cancelRet.disabled=true;try{await api('/sales/deals/'+id+'/retainer/cancel','POST',{});toast('Retainer canceled — future billing stopped');openDeal(id);}catch(e){toast(nice(e),true);cancelRet.disabled=false;}};
    // Renewal/expiry date on a SIGNED agreement → the owner gets one calm reminder
    // ~30 and ~7 days before it ends (never an auto-renew).
    $('detailInner').querySelectorAll('[data-set-term]').forEach(b=>b.onclick=async()=>{const cid=b.dataset.setTerm;const inp=$('con-term-'+cid);const val=(inp&&inp.value)||'';b.disabled=true;try{await api('/sales/contracts/'+cid+'/term','POST',{term_end:val||null});toast(val?'Renewal reminder set':'Renewal date cleared');openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    // Per-invoice actions (Copy link · Send/Resend · Void) — the ONE shared
    // wiring (wireInvoiceActions, up by openReceivables) that the "Who owes you"
    // list uses too; a success re-opens the deal so the row re-renders from
    // fresh server state. [data-copy-pay] also covers the retainer links above.
    wireInvoiceActions($('detailInner'),()=>openDeal(id));
    const sendDep=$('sendDeposit'); if(sendDep) sendDep.onclick=()=>miniForm($('invForm'),[{name:'amount',label:'Deposit amount (USD)',type:'number',step:'0.01',placeholder:'500'}],async(v)=>{if(!v.amount){toast('Enter a deposit amount.',true);return;}await sendMoney({purpose:'deposit',amount_cents:Math.round(parseFloat(v.amount)*100),title:'Deposit'});},{saveLabel:'Request deposit'});
    // Payment schedule builder: deposit + balance, or N installments. Previews the
    // staged invoices (labels · due dates · amounts · running total = deal total),
    // then mints them via /sales/deals/:id/schedule. The client math mirrors the
    // pure server builder (remainder-on-last); the server re-validates on create.
    const setupPlanBtn=$('setupPlan'); if(setupPlanBtn) setupPlanBtn.onclick=()=>{
      const host=$('invForm');
      const acceptedProp=(data.proposals||[]).find(p=>p.status==='accepted');
      const totalCents=(acceptedProp&&propTotals(acceptedProp.line_items).total)||d.expected_value_cents||0;
      if(!totalCents){host.innerHTML='<div class="mut" style="margin-top:8px">Set the deal value (in Details) or accept a proposal first — a plan needs a total to split.</div>';return;}
      const addDays=(iso,days)=>{const p=iso.split('-').map(Number);const t=Date.UTC(p[0],p[1]-1,p[2])+days*86400000;const x=new Date(t);const z=n=>String(n).padStart(2,'0');return x.getUTCFullYear()+'-'+z(x.getUTCMonth()+1)+'-'+z(x.getUTCDate());};
      const computeStages=(spec)=>{
        if(spec.mode==='installments'){const n=spec.count;const per=Math.floor(totalCents/n);const out=[];for(let i=0;i<n;i++){const last=i===n-1;out.push({label:'Payment '+(i+1)+' of '+n,amount_cents:last?totalCents-per*(n-1):per,due_date:spec.first_due?addDays(spec.first_due,(spec.every||0)*i):null,purpose:'service'});}return out;}
        const dep=spec.deposit_type==='percent'?Math.round(totalCents*spec.deposit_value/100):Math.round(spec.deposit_value*100);
        return [{label:'Deposit',amount_cents:dep,due_date:spec.deposit_due||null,purpose:'deposit'},{label:'Balance',amount_cents:totalCents-dep,due_date:spec.balance_due||null,purpose:'service'}];
      };
      host.innerHTML='<div style="margin-top:8px">'
        +'<div class="row2"><label><input type="radio" name="plkind" value="db" checked> Deposit + balance</label><label><input type="radio" name="plkind" value="inst"> Installments</label></div>'
        +'<div id="pl-db" style="margin-top:8px"><label class="mut">Deposit</label><div class="row2"><input type="number" id="pl-depval" step="0.01" min="0" value="50" style="max-width:120px"><select id="pl-depunit"><option value="percent">% of total</option><option value="amount">$ amount</option></select></div><label class="mut" style="display:block;margin-top:8px">Balance due (optional)</label><input type="date" id="pl-baldue"></div>'
        +'<div id="pl-inst" style="margin-top:8px;display:none"><label class="mut">Number of payments</label><br><input type="number" id="pl-count" min="2" max="12" value="3" style="max-width:90px"><label class="mut" style="display:block;margin-top:8px">First payment due</label><input type="date" id="pl-firstdue"><label class="mut" style="display:block;margin-top:8px">Then every (days)</label><br><input type="number" id="pl-every" min="0" value="30" style="max-width:90px"></div>'
        +'<div class="mut" style="margin-top:8px">Total to schedule: <strong>'+money(totalCents)+'</strong></div>'
        +'<div id="pl-preview" style="margin-top:8px"></div>'
        +'<div class="row2" style="margin-top:8px"><button type="button" class="btn" id="pl-create">Create the plan</button></div></div>';
      const gatherSpec=()=>{const kind=host.querySelector('input[name=plkind]:checked').value;if(kind==='inst')return {mode:'installments',count:Math.max(2,Math.min(12,parseInt($('pl-count').value||'0',10)||0)),first_due:$('pl-firstdue').value||null,every:parseInt($('pl-every').value||'0',10)||0};return {mode:'db',deposit_type:$('pl-depunit').value,deposit_value:parseFloat($('pl-depval').value||'0')||0,deposit_due:null,balance_due:$('pl-baldue').value||null};};
      const doPreview=()=>{let stages;try{stages=computeStages(gatherSpec());}catch(_){stages=[];}const sum=stages.reduce((a,b)=>a+(b.amount_cents||0),0);const okSum=sum===totalCents;const rowsH=stages.map(s=>'<div class="row2"><span class="mut">'+esc(s.label)+(s.due_date?' · due '+esc(s.due_date):' · due now')+'</span><span>'+money(s.amount_cents)+'</span></div>').join('');$('pl-preview').innerHTML=rowsH+'<div class="row2" style="border-top:1px solid var(--line,#ddd);margin-top:4px;padding-top:4px"><span class="mut">Running total</span><span style="font-weight:700;color:'+(okSum?'inherit':'var(--bad,#a3423a)')+'">'+money(sum)+' / '+money(totalCents)+'</span></div>';return stages;};
      const toggle=()=>{const inst=host.querySelector('input[name=plkind]:checked').value==='inst';$('pl-db').style.display=inst?'none':'';$('pl-inst').style.display=inst?'':'none';doPreview();};
      host.querySelectorAll('input[name=plkind]').forEach(r=>r.onchange=toggle);
      ['pl-depval','pl-depunit','pl-baldue','pl-count','pl-firstdue','pl-every'].forEach(idn=>{const el=$(idn);if(el)el.oninput=doPreview;});
      doPreview();
      $('pl-create').onclick=async()=>{const stages=doPreview();if(!stages.length){toast('Add plan details first.',true);return;}$('pl-create').disabled=true;try{const r=await api('/sales/deals/'+id+'/schedule','POST',{total_cents:totalCents,stages});toast('Payment plan created'+((r.data&&r.data.emailed)?' — the deposit was emailed to the client':((r.data&&r.data.linked)?' — deposit link ready to send':'')));openDeal(id);}catch(e){toast(nice(e),true);$('pl-create').disabled=false;}};
    };
    // the record's "Payment schedule" link lands on #schedule (studio audit change 12): open the builder straight away, once
    if(WANT_SCHEDULE){WANT_SCHEDULE=false;if(setupPlanBtn)setupPlanBtn.click();}   // the replaceState above already dropped the hash
    if(WANT_CONVERT){WANT_CONVERT=false;const cb=$('convert')||$('convWrap');if(cb&&cb.scrollIntoView)cb.scrollIntoView({block:'center'});const btn=$('convert');if(btn)btn.focus({preventScroll:true});}
    // "+ Create → Send a proposal": once, a new proposal opens; a draft that's already here is the one to send (never a second draft)
    if(WANT_PROPOSAL){WANT_PROPOSAL=false;if(draftProp){const sb=SEND_BOTH?$('sendBothBtn'):$('detailInner').querySelector('[data-send-proposal="'+draftProp.id+'"]');if(sb){if(sb.scrollIntoView)sb.scrollIntoView({block:'center'});sb.focus({preventScroll:true});}toast('This deal already has a draft proposal — here it is, ready to send.');}else{const ap=$('addProp');if(ap)ap.click();}}
    const conv=$('convert'); if(conv) conv.onclick=()=>{
      // two-step confirm (no confirm() dialog). Service language, not SaaS: the
      // labels say WHAT KIND OF WORK this is; the values stay the same edition
      // keys the convert route expects (CONVERT_PLANS in routes/sales.ts). Paying
      // for software is SELF-SERVE at signup — never picked here.
      const wrap=$('convWrap'); wrap.innerHTML=`
        <label for="convPlan">What kind of work is this?</label>
        <select id="convPlan"><option value="presence" selected>I’m building them a new site — hosted with me</option><option value="business_os_only">They keep their site on their own platform — I do the rest</option><option value="presence_monitor">Just monitoring a site they already have</option></select>
        <div class="mut" style="margin-top:6px">Adding them creates their <strong>client portal</strong> and emails them a link to set their password and sign in — that’s where they work with you: files, approvals, messages, invoices. You bill them for your work the usual way — they never pay for software here. You can change this later.</div>
        <div class="row2" style="margin-top:10px"><button class="btn ghost" id="convNo">Cancel</button><button class="btn" id="convYes">Yes, add them as my customer</button></div>`;
      $('convNo').onclick=()=>openDeal(id);
      $('convYes').onclick=async()=>{$('convYes').disabled=true;try{const plan=($('convPlan')&&$('convPlan').value)||'presence';const r=await api('/sales/deals/'+id+'/convert','POST',{plan});const x=r.data||{};toast('Converted — workspace + project ready'+(x.idempotent?' (already done)':(x.invited?', customer invited':'. Our welcome email didn’t go out: use Resend welcome email, or share their sign-in page')),!x.idempotent&&!x.invited);
        // "Won stays put": when this panel is embedded in the unified Client Record,
        // tell the record to reveal + switch to Delivery — the relationship never
        // jumps to a separate destination at closed-won.
        if(EMBED){try{window.parent.postMessage({type:'dds-deal-converted',project_id:x.project_id||'',site_id:x.site_id||'',client_id:x.client_id||''},location.origin);}catch(_){}}
        openDeal(id);load();}catch(e){toast(nice(e),true);$('convYes').disabled=false;}};
    };
    const resend=$('resendInvite'); if(resend) resend.onclick=async()=>{resend.disabled=true;const was=resend.textContent;resend.textContent='Sending…';try{const r=await api('/sales/deals/'+id+'/resend-invite','POST',{});toast('Welcome email sent'+((r.data&&r.data.email)?' to '+r.data.email:'')+' ✓');openDeal(id);}catch(e){toast(nice(e),true);resend.disabled=false;resend.textContent=was;}};
    // a11y: an in-view action re-rendered the page and dropped focus — land it back
    // on the deal title (a stable, focusable anchor) so keyboard users aren't lost.
    if(wasOpen){const t=$('dtitle');if(t)t.focus();}
  }catch(e){ if(dgen!==DET_SEQ)return; $('detailInner').innerHTML='<div class="backbar"><button class="btn ghost" id="closeD">← Back to pipeline</button></div><div class="dbody mut">'+esc(nice(e))+'</div>'; const b=$('closeD'); if(b)b.onclick=closeDealDetail; }
}

// Boot honesty: a failed boot renders real trouble WITH a Try again that
// re-runs the whole boot in place (session + load — a bare load() couldn't
// paint without the token the failed boot never got). Markup is hand-rolled
// dds-error classes: shell.js (defer) may not have registered ddsError yet.
async function boot(){
  try{
    const {data}=await sb.auth.getSession();
    TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){ $('list').innerHTML='<p class="mut">Please <a href="/studio.html">sign in</a> to see your pipeline.</p>'; return; }
    // D1 (pipeline half): boot reads ?stage= — a linkable stage landing, most
    // importantly ?stage=won, the view the board deliberately hides. It lands
    // in List (won/lost are outcomes, not board columns); the persisted display
    // choice in storage is respected next visit, never overwritten here.
    const urlStage=new URLSearchParams(location.search).get('stage');
    // Only won/lost force List — they're outcomes the board structurally can't
    // show. An OPEN-stage landing keeps the persisted Board/Table choice (the
    // filter still applies the moment List/Table renders).
    if(urlStage&&STAGES.includes(urlStage)){FILTER=urlStage;if(urlStage==='won'||urlStage==='lost')VIEW='list';}
    renderFilters();
    // item 31/32: saved views, columns and the import are studio-level tools (deals live on the studio's site)
    if(scope()){['importDeals','pvBtn','chartsBtn','printBtn'].forEach(id=>{const n=$(id);if(n)n.hidden=true;});wireMore();}
    else{wireViews();wireMore();loadSavedViews();
      // sales review item 38: the studio's own names for its open stages (Settings → Name your deal stages)
      api('/sales/stages').then(r=>{const l=r&&r.data&&r.data.labels;if(l&&STAGES.some(k=>l[k]&&l[k]!==STAGE_LABEL[k])){Object.assign(STAGE_LABEL,l);renderFilters();if(DEALS_LOADED)renderCurrent();if(CURRENT_DEAL&&!$('detailWrap').hidden)openDeal(CURRENT_DEAL);}}).catch(()=>{});}
    if(VIEW!=='list')setView(VIEW); else await load();   // restore the display (syncs the toggle; the board unless List was chosen), else plain load
    const deep=new URLSearchParams(location.search).get('deal'); if(deep) openDeal(deep);
    // ⌘K "billing" lands here as #outstanding (lib/navigation.ts): open "Who owes you"
    else if(location.hash==='#outstanding'){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}openReceivables();}
    // Settings → Invoices & agreements lands here with ?services=1: open the catalog straight away
    if(new URLSearchParams(location.search).get('services')==='1'){const sb=$('mngServicesTop');if(sb)sb.click();}
  }catch(_){
    $('list').innerHTML='<div class="dds-error"><span class="ico">!</span><span>We couldn’t load your pipeline just now.</span><button type="button" class="retry" id="bootRetry">Try again</button></div>';
    const b=$('bootRetry'); if(b)b.onclick=()=>boot();
  }
}
boot();
</script>
