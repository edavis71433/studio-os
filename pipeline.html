<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipeline — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your sales pipeline — from first enquiry through onboarding.">
<!-- P2-C: Studio App sales pipeline on the ONE shared shell + shared state helpers. -->
<link rel="stylesheet" href="/fonts/brand.css">
<link rel="stylesheet" href="/shell.css">
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('dds-embed');</script>
<style>
html.dds-embed .dds-nav,html.dds-embed .dds-search,html.dds-embed #dds-mbar,html.dds-embed .dds-drawer,html.dds-embed #dds-offline{display:none!important}
html.dds-embed{--dds-shell-h:0px}
html.dds-embed body{padding-top:0!important;background:transparent}
html.dds-embed #listWrap{display:none!important}
html.dds-embed .backbar{display:none!important}
html.dds-embed #detailWrap{padding-top:0}
</style>
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically) — same aliasing pattern
     as crm.html / inbox.html. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) —
     the Path's current chevron sits on the same var(--p) fill (same fix in crm.html) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost),:root:not([data-theme="light"]) .path button.pstep.current{color:#171320}}
  :root[data-theme="dark"] .btn:not(.ghost),:root[data-theme="dark"] .path button.pstep.current{color:#171320}
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:var(--dds-w-app,1280px);margin:0 auto;padding:var(--dds-s7,32px) var(--dds-s5,20px) 80px}
  h1{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:var(--dds-s1,4px)}
  .sub{color:var(--soft);font-size:14px;margin-bottom:var(--dds-s5,20px)}
  /* ── roster header (.lhead) — the same list-view anatomy as customers.html /
        leads.html / contacts.html: object icon · ONE h1 · ↻ · count/money meta ── */
  .lhead{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--shadow);padding:var(--dds-s3,12px) var(--dds-s4,16px) 10px;margin-bottom:var(--dds-s3,12px)}
  .lrow1{display:flex;align-items:center;gap:10px}
  .si{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.18em;flex:0 0 auto}
  .obj-ic{width:34px;height:34px;border-radius:var(--dds-r,8px);background:var(--p);color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .lhead h1{font-size:20px;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:var(--dds-r,8px);padding:var(--dds-s1,4px) 10px;min-height:34px;cursor:pointer}
  .lbtn:hover{color:var(--p);background:var(--p-soft)}
  .lmeta{margin-top:6px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .search{width:100%;font-family:inherit;font-size:16px;padding:10px var(--dds-s4,16px);border:1px solid var(--line);border-radius:var(--dds-r,8px);background:var(--card);color:var(--ink);margin-bottom:var(--dds-s3,12px)}
  .search:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  /* the calm "your numbers" strip — plain numbers, tabular, no chart */
  .summary{margin-bottom:var(--dds-s5,20px)}
  .summary:empty{display:none}
  .sum-line{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s3,12px) var(--dds-s4,16px);font-size:13.5px;color:var(--soft);font-variant-numeric:tabular-nums;line-height:1.75}
  .sum-line strong{color:var(--ink);font-weight:600}
  .sum-line .dot{color:var(--line);margin:0 var(--dds-s1,4px)}
  .sum-line .mut{color:var(--faint);font-size:12.5px}
  /* visual refresh: the summary is four icon stat tiles in one bordered strip */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);background:var(--card);overflow:hidden}
  .stats .st{display:flex;align-items:center;gap:var(--dds-s3,12px);padding:var(--dds-s3,12px) var(--dds-s4,16px);border-left:1px solid var(--line);min-width:0}
  .stats .st:first-child{border-left:none}
  .stats .ico{width:36px;height:36px;border-radius:var(--dds-r,8px);display:grid;place-items:center;flex:0 0 auto;background:var(--p-soft);color:var(--p)}
  .stats .ico.good{background:var(--good-soft);color:var(--good)} .stats .ico.warn{background:var(--warn-soft);color:var(--warn)} .stats .ico.info{background:var(--dds-info-soft,#e8f1fb);color:var(--dds-info,#2a6fb5)}
  .stats .ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .stats .st-main{min-width:0;flex:1}
  .stats .k{font-size:12px;color:var(--faint)}
  .stats .v{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stats .s{font-size:12px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Oct 2026: the Outstanding tile's sub carries the "see who →" opener, and with both an
     overdue and a processing amount it outgrows a phone/tablet tile — so that one sub wraps
     instead of ellipsising (which clipped the link). The other three tiles keep the one line. */
  .stats .s.multiline{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
  .sum-stages{display:flex;gap:var(--dds-s2,8px);flex-wrap:wrap;margin-top:var(--dds-s2,8px)}
  .sum-stages .sc{display:flex;flex-direction:column;gap:1px;padding:6px var(--dds-s3,12px);border:1px solid var(--line);border-radius:var(--dds-r,8px);background:var(--card);min-width:88px}
  .sum-stages .sc-l{font-size:12px;color:var(--faint)}
  .sum-stages .sc-n{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar{display:flex;gap:var(--dds-s2,8px);align-items:center;flex-wrap:wrap;margin-bottom:var(--dds-s4,16px)}
  .chip{font-size:13px;padding:var(--dds-s1,4px) var(--dds-s3,12px);border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer;font-family:inherit}
  .chip.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  /* visual refresh: the display toggle is a segmented control, not chips */
  .viewtog{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:var(--dds-r,8px);overflow:hidden;background:var(--bg)}
  .viewtog .chip{border:none;border-radius:0;background:transparent;padding:var(--dds-s1,4px) var(--dds-s3,12px);font-size:12.5px;font-weight:500}
  .viewtog .chip.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
  .btn{font:inherit;font-size:13.5px;font-weight:500;border:none;border-radius:var(--dds-r,8px);padding:var(--dds-s2,8px) var(--dds-s4,16px);background:var(--p);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--warn)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s4,16px) var(--dds-s4,16px);margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;gap:var(--dds-s3,12px);align-items:center}
  .card:hover{border-color:var(--p)}
  .card .t{font-weight:600}
  .card .m{color:var(--soft);font-size:13px;margin-top:2px}
  .stage{font-size:12px;font-weight:500;padding:var(--dds-s1,4px) var(--dds-s2,8px);border-radius:999px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .stage.won{background:var(--good-soft);color:var(--good)}
  .stage.lost{background:transparent;border:1px solid var(--line);color:var(--soft)}
  /* Oct 2026 (benchmark item 2): the money-state chip — Paid · Processing · Upcoming ·
     Overdue — on the drawer's invoice rows and the "Who owes you" list, in MONEY_TONE's
     one colour each (good · info · '' · bad); crm.html's .schip recipe on this page's .stage. */
  .stage.good{background:var(--good-soft);color:var(--good)}
  .stage.info{background:var(--dds-info-soft,#e8f1fb);color:var(--dds-info,#2a6fb5)}
  .stage.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
  .stage.void{background:var(--bg);color:var(--faint)}
  .val{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px}
  dialog{border:none;border-radius:var(--dds-r-lg,10px);padding:0;max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(27,21,37,.4)}
  .dhead{padding:var(--dds-s5,20px) var(--dds-s5,20px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:start}
  .dbody{padding:var(--dds-s5,20px) var(--dds-s5,20px);max-height:64vh;overflow:auto}
  .sec{margin-top:var(--dds-s4,16px)}.sec h3{font-size:12px;color:var(--faint);margin-bottom:var(--dds-s2,8px)}
  .row2{display:flex;gap:var(--dds-s2,8px);flex-wrap:wrap;align-items:center;margin-top:var(--dds-s2,8px)}
  /* the "More ▾" beside the one send button (same shape as crm.html's action bar menu) */
  .more{position:relative;display:inline-block}
  .more-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:5;min-width:220px;background:var(--card,var(--bg));border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);box-shadow:var(--dds-shadow-pop,0 8px 28px rgba(21,20,26,.12));padding:var(--dds-s1,4px);display:flex;flex-direction:column;gap:2px}
  .more-menu[hidden]{display:none}
  .more-menu .btn{border:none;background:transparent;color:var(--ink);text-align:left;border-radius:var(--dds-r-sm,6px);width:100%}
  .more-menu .btn:hover{background:var(--bg)}
  form.mini{display:flex;flex-direction:column;gap:var(--dds-s2,8px);margin-top:10px;padding:var(--dds-s3,12px);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);background:var(--bg)}
  form.mini .grid{display:flex;gap:var(--dds-s2,8px);flex-wrap:wrap}
  input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:var(--dds-s2,8px) var(--dds-s3,12px);width:100%}
  textarea{min-height:90px;resize:vertical}
  label{font-size:12.5px;color:var(--soft);display:block;margin:2px 0 var(--dds-s1,4px)}
  .mut{color:var(--soft);font-size:13px}
  .hrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--soft);padding:var(--dds-s1,4px) 0;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:none}
  .hrow .hd{white-space:nowrap;color:var(--faint);font-variant-numeric:tabular-nums}
  /* activity quick-log + merged timeline */
  .qlog{border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s3,12px);background:var(--bg);margin-bottom:var(--dds-s3,12px)}
  .qlog .kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--dds-s2,8px)}
  .qlog .kb{font:inherit;font-size:13px;padding:6px var(--dds-s3,12px);border-radius:var(--dds-r,8px);border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
  .qlog .kb.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:500}
  .qlog textarea{min-height:44px}
  .qlog .qrow{display:flex;gap:var(--dds-s2,8px);align-items:center;margin-top:var(--dds-s2,8px);flex-wrap:wrap}
  .qlog .qrow input[type=date]{width:auto;flex:0 0 auto}
  .tl{list-style:none;padding:0;margin:6px 0 0}
  .tl-i{display:flex;gap:10px;padding:var(--dds-s2,8px) 0;border-bottom:1px solid var(--line)}
  .tl-i:last-child{border-bottom:none}
  .tl-ic{flex:0 0 auto;width:22px;text-align:center;line-height:1.5;color:var(--faint)}
  .tl-bd{flex:1;min-width:0}
  .tl-tx{font-size:13.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .tl-mt{font-size:12px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
  a{color:var(--p)}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}
  /* ── Path (Lightning chevrons, dds skin) — kept in sync with crm.html by hand
        (its .pathcard/.pstep/.path-guide/.path-confirm/.terminal-chip block):
        same shapes, same done/current/todo + won/lost terminal states, same
        interactivity rules (only the current step + the one legal back-target). ── */
  .pathrow{display:flex;gap:var(--dds-s3,12px);align-items:center;flex-wrap:wrap}
  .path{display:flex;flex:1 1 340px;min-width:0}
  .path button.pstep{flex:1;min-width:0;border:none;font-family:inherit;font-size:12.5px;font-weight:500;padding:var(--dds-s2,8px) var(--dds-s4,16px);cursor:default;
    background:var(--card);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0;
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
  .path button.pstep:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);border-radius:var(--dds-r,8px) 0 0 var(--dds-r,8px)}
  .path button.pstep:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,11px 50%);border-radius:0 var(--dds-r,8px) var(--dds-r,8px) 0}
  .path button.pstep.done{background:var(--good-soft);color:var(--good)}
  .path button.pstep.canback{cursor:pointer}
  .path button.pstep.canback:hover{filter:brightness(.96)}
  .path button.pstep.current{background:var(--p);color:#fff;cursor:pointer}
  .path button.pstep.current:hover{filter:brightness(1.06)}
  .path button.pstep.lost-terminal{background:var(--warn-soft);color:var(--warn)}
  .path-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .path-guide{margin-top:10px;font-size:13.5px;color:var(--soft)}
  .path-guide b{color:var(--ink);font-weight:600}
  .path-confirm{margin-top:10px;display:flex;gap:var(--dds-s2,8px);align-items:center;font-size:13.5px;flex-wrap:wrap}
  .terminal-chip{font-size:12px;font-weight:700;border-radius:999px;padding:var(--dds-s1,4px) var(--dds-s3,12px)}
  .terminal-chip.won{background:var(--good-soft);color:var(--good)}
  .terminal-chip.lost{background:var(--warn-soft);color:var(--warn)}
  /* View toggle (List · Board · Table) */
  .viewtog{display:inline-flex;gap:var(--dds-s1,4px)}
  /* ── Table view: sortable columns; the table scrolls in its OWN container ── */
  #table .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px)}
  #table table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  #table thead th{text-align:left;font-size:12px;color:var(--faint);font-weight:500;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
  #table thead th .thb{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:none;padding:var(--dds-s3,12px) var(--dds-s4,16px);width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:var(--dds-s1,4px)}
  #table thead th .thb:hover{color:var(--p)}
  #table thead th .arrow{font-size:10px;color:var(--p)}
  #table tbody tr{cursor:pointer}
  #table tbody tr:hover{background:var(--p-soft)}
  #table tbody tr:focus-visible{outline:2px solid var(--p);outline-offset:-2px}
  #table tbody td{padding:var(--dds-s3,12px) var(--dds-s4,16px);border-bottom:1px solid var(--line);vertical-align:middle}
  #table tbody tr:last-child td{border-bottom:none}
  #table td .dn{font-weight:600}
  #table td.num{font-variant-numeric:tabular-nums}
  #table td .over{color:var(--bad);font-weight:600}
  .tmeta{font-size:12px;color:var(--faint);margin:0 0 var(--dds-s2,8px)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  /* Kanban board — columns = open stages, cards = deals, tap/drag to move */
  .board-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1 * var(--dds-s5,20px));padding:2px var(--dds-s5,20px) 6px}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:var(--dds-s3,12px);align-items:start}
  .col{background:var(--bg);border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);padding:10px;min-width:220px}
  /* visual refresh: a soft tint per stage (same order as the open STAGES) so the
     board reads at a glance; the dark palette keeps the plain surface */
  .col:nth-child(1){background:#f5f2fc} .col:nth-child(2){background:#fdf6ec} .col:nth-child(3){background:#eef4fb} .col:nth-child(4){background:#fbeff5}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .col{background:var(--bg)}}
  :root[data-theme="dark"] .col{background:var(--bg)}
  .col-tip{color:var(--soft)}
  .col-h{display:flex;justify-content:space-between;align-items:center;gap:var(--dds-s2,8px);margin-bottom:2px}
  .col-t{font-weight:600;font-size:13.5px;flex:1}
  .col-n{font-size:12px;color:var(--faint);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px var(--dds-s2,8px);font-variant-numeric:tabular-nums}
  .col-val{font-size:11.5px;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
  .col-tip{font-size:11.5px;margin-bottom:var(--dds-s2,8px);line-height:1.4}
  .col-body{display:flex;flex-direction:column;gap:var(--dds-s2,8px);min-height:40px;border-radius:var(--dds-r,8px);padding:2px;transition:background var(--dds-t-fast,120ms) var(--dds-ease,ease-out)}
  .col-body.drop-ok{outline:1px dashed var(--p);outline-offset:-2px}
  .col-body.drop-over{background:var(--p-soft)}
  .bempty{font-size:12px;text-align:center;padding:10px var(--dds-s1,4px);opacity:.7}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:var(--dds-r,8px);padding:10px;cursor:pointer;position:relative}
  .bcard:hover{border-color:var(--p)}
  .bcard.dragging{opacity:.5}
  .bc-t{font-weight:600;font-size:13.5px;line-height:1.35}
  .bc-v{font-variant-numeric:tabular-nums;color:var(--soft);font-size:12.5px;margin-top:var(--dds-s1,4px)}
  .bc-m{color:var(--faint);font-size:12px;margin-top:var(--dds-s1,4px)}
  .bcard.is-stale{border-left:2px solid var(--warn,#775d31)}
  .whats-next{border:1px solid var(--line);border-left:3px solid var(--p);border-radius:var(--dds-r,8px);padding:10px var(--dds-s3,12px);margin:0 0 10px;background:var(--p-soft,rgba(91,63,160,.06))}
  .btn.sm{padding:var(--dds-s1,4px) 10px;font-size:12.5px}

// An ALL-CAPS bracketed marker — [PLATFORM], [LIST THE FIVE CORE PAGES] — is a
// blank the operator still has to complete. Deliberately NOT the placeholder
// filler's own honest degradations ([project fee], [50% deposit]) nor the
// signature block's [Client Name / Title]: those are lower/mixed case, they are
// correct as they stand, and nagging about them would train him to click past
// the warning that matters. A bracket that never closes on its line is not a
// blank either.
const DDS_BLANK_RE=/\[[A-Z]{2}[^\]\n]*\]/g;

// The send-time editorial guard. NOT a block, and deliberately not a server
// refusal: sending a half-filled draft to himself to read on a phone is a real
// thing he does, and the server's job is contract integrity, not proofreading.
// It just refuses to let [LIST THE FIVE CORE PAGES] reach a client unnoticed —
// so it counts what's left and names the first few, in the page's own confirm
// idiom. Returns true when it's fine to send.
function confirmBlanks(text){
  const b=unfilledBlanks(text);
  if(!b.length)return true;
  const shown=b.slice(0,3).map(x=>x.length>46?x.slice(0,44)+'…]':x).join(', ');
  return confirm('This agreement still has '+b.length+' fill-in '+(b.length===1?'blank':'blanks')+' — '+shown+(b.length>3?', and '+(b.length-3)+' more':'')+'.\n\nThe client will see them exactly as written. Send it anyway?');

// which confirmBlanks deliberately ignores (they're ALL-CAPS-only). But SENDING
// one of those means the signed page promises a deposit nobody computed — and
// the server skips the automatic deposit request (no value → nothing honest to

// fix, let him decide. Returns true when it's fine to send.

function confirmMoneyBlanks(text){
  if(!MONEY_BLANK_RE.test(String(text==null?'':text)))return true;

// ── Table view: the deals as a sortable list-view table (Deal · Contact ·
// Stage · Value · Next step (due) · Last contacted). Rows open the SAME drawer;
// nothing edits inline. Contact names aren't in the deals LIST response (only
// contact_id), so the Contact column joins them client-side from the EXISTING
// GET /sales/contacts read — fetched once, cached, degrading to “—”. ──
let CONTACT_NAME=null,CONTACT_TEXT=null,CONTACT_LOADING=null,CONTACT_FAILED=false;
function ensureContactNames(){
  if(CONTACT_NAME&&!CONTACT_FAILED)return Promise.resolve();
  if(CONTACT_LOADING)return CONTACT_LOADING;
  // limit=100 = the server's MAX_PAGE (clampLimit silently caps anything higher
  // right back to 100 — the old limit=500 claimed a capacity the server refuses).
  // HONEST RESIDUAL: a studio with >100 contacts gets only the 100 most recently
  // updated — older contacts' deals read "—" in the Table and match by title only
  // in search. Lifting that needs paged fetches or a server-side join, not a
  // bigger number here.
  // include_deleted=1: this join only ever LABELS deals that already exist. A
  // contact removed from the roster must not turn their own historical deals
  // into "—" (and unfindable by the person's name in search) — the deal is
  // still real, and it still belongs to whoever it belonged to. Same site
  // scope; the roster read is unchanged and still hides them.
  CONTACT_LOADING=api('/sales/contacts?limit=100&include_deleted=1')
    .then(r=>{CONTACT_NAME={};CONTACT_TEXT={};CONTACT_FAILED=false;for(const c of (r.data||[])){CONTACT_NAME[c.id]=c.name||c.email||'';CONTACT_TEXT[c.id]=[c.name,c.email,c.company].filter(Boolean).join(' ').toLowerCase();}})
    .catch(()=>{CONTACT_NAME={};CONTACT_TEXT={};CONTACT_FAILED=true;})   // plan-gated or offline → cells read “—” for THIS render; a failure is never cached — the next render retries
    .finally(()=>{CONTACT_LOADING=null;});
  return CONTACT_LOADING;
}
// ── the .lhead search: ONE client-side filter across every display. Matches the
// deal title plus the contact's name/email/company (the same cached
// /sales/contacts join the Table's Contact column uses — kicked lazily the
// first time a query needs it, degrading to title-only until it lands). The
// input is STATIC markup: only the list re-renders, so focus + caret survive
// every keystroke by construction (the contacts.html list-only-re-render idiom).
function visibleDeals(){
  const q=Q.trim().toLowerCase();
  if(!q)return DEALS;
  if(!CONTACT_TEXT&&!CONTACT_LOADING)ensureContactNames().then(()=>{if(Q.trim())renderCurrent();});
  return DEALS.filter(d=>{
    const ct=(CONTACT_TEXT&&d.contact_id&&CONTACT_TEXT[d.contact_id])||'';
    return (String(d.title||'').toLowerCase()+' '+ct).includes(q);
  });
}
// ── the .lmeta line: visible count · value (money0 — the same cents formatter

// HONEST-MATH contract (SS5 item 1): "total" is claimed ONLY when the fetched
// set is provably complete (below FETCH_LIMIT). A full page means the server
// may hold more rows, so the wording scopes itself to "the latest 100" instead.
// Why not drive this line from /sales/summary? Its rollup carries no per-stage
// totals for won/lost (so it can't serve the ?stage=won landing, the worst
// offender) and can't follow the client-side search filter — the page-sum with
// honest scoping is the option whose semantics actually fit this line.
// ONE definition of "what the board shows" — renderBoard AND renderMeta read
// it, so the Board meta can never count deals the board doesn't render
// (SS5 item 2: won/lost/converted are outcomes the board deliberately hides;
// the board-foot line explains where they live).
function boardVisible(){return visibleDeals().filter(d=>BOARD_STAGES.includes(d.stage)&&!d.converted_client_id);}
function renderMeta(){
  const el=$('lmeta'); if(!el)return;
  const board=VIEW==='board';

  // the sweep's wording). List/Table keep the full-fetched-set semantics.
  const list=board?boardVisible():visibleDeals();
  const sum=list.reduce((a,d)=>a+(d.expected_value_cents||0),0);
  const n=list.length,atCap=DEALS.length>=FETCH_LIMIT;
  let m;

    m=(atCap?n+' open of the latest '+FETCH_LIMIT+' deals':n+' open deal'+(n===1?'':'s'))+' · '+money0(sum)+' open · '+updatedLabel();
  }else{
    const count=atCap
      ?(n===DEALS.length?'Latest '+FETCH_LIMIT+' deals':n+' of the latest '+FETCH_LIMIT+' deals')
      :n+' deal'+(n===1?'':'s');

  }

}
// Roster-empty honesty: a stage-filtered empty says WHICH stage is empty (the

function renderRosterEmpty(host){
  // Scoped into a client, this reads presence_deals?site_id=<client's site> —
  // but deals only ever live on the STUDIO's site (sales.ts says so, 0074 keys
  // them that way). So it can only ever be empty, and "New deal" would file the

// ONE re-render for whatever display is active — the search, refresh, and sort

function renderCurrent(){

function renderList(){

const TCOLS=[
  ['title','Deal',(d)=>String(d.title||'').toLowerCase()],
  ['contact','Contact',(d)=>String((CONTACT_NAME&&CONTACT_NAME[d.contact_id])||'').toLowerCase()],
  ['stage','Stage',(d)=>STAGES.indexOf(d.stage)],
  ['value','Value',(d)=>Number(d.expected_value_cents||0)],
  ['next','Next step (due)',(d)=>d.next_step_at||'9999-99-99'],   // no due date sorts last
  ['last','Last contacted',(d)=>String(d.last_contacted_at||'')],
];
let TSORT={key:'next',dir:1};
function renderTable(){
  const host=$('table');
  // No join yet, or the last read failed → (re)fetch. Re-render on success, and
  // once when the FIRST look settles (so “…” becomes “—”); a failed retry stays
  // put — never a fetch→render→fetch loop.
  if(!CONTACT_NAME||CONTACT_FAILED){

  }

  const list=[...visibleDeals()].sort((a,b)=>{const av=col[2](a),bv=col[2](b);return av<bv?-TSORT.dir:av>bv?TSORT.dir:0;});
  const ths=TCOLS.map(([k,label])=>{
    const on=TSORT.key===k;

  }).join('');
  const trs=list.map(d=>{
    const cn=CONTACT_NAME?((d.contact_id&&CONTACT_NAME[d.contact_id])||'—'):'…';
    const overdue=d.next_step&&d.next_step_at&&d.next_step_at<=today;
    const ns=d.next_step
      ?(overdue?`<span class="over">Due: ${esc(d.next_step)} · ${esc(d.next_step_at)}</span>`
               :`${esc(d.next_step)}${d.next_step_at?` <span class="mut">· ${esc(d.next_step_at)}</span>`:''}`)
      :'—';
    return `<tr data-id="${d.id}" tabindex="0" aria-label="Open ${esc(d.title||'Untitled deal')}">
      <td><span class="dn">${esc(d.title||'Untitled deal')}</span></td>
      <td>${esc(cn)}</td>
      <td>${stageBadge(d.stage,d.agreement_signed)}</td>
      <td class="num">${money(d.expected_value_cents)||'—'}</td>
      <td>${ns}</td>
      <td>${d.last_contacted_at?esc(ago(d.last_contacted_at)):'—'}</td>

  }).join('');
  // the count/sort meta lives in the .lhead's .lmeta now — ONE meta line per page
  host.innerHTML=`<div class="tscroll"><table aria-label="Deals"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
  host.querySelectorAll('[data-tsort]').forEach(b=>b.onclick=()=>{
    const k=b.getAttribute('data-tsort');
    if(TSORT.key===k)TSORT.dir=-TSORT.dir; else TSORT={key:k,dir:k==='last'?-1:1};   // last-contacted reads newest-first on first click
    renderTable();renderMeta();
    const nb=host.querySelector('[data-tsort="'+k+'"]'); if(nb)nb.focus();
    // announce just the sort (the table itself is NOT a live region)
    const sc=TCOLS.find(x=>x[0]===k)||TCOLS[0];
    const note=$('tsortNote'); if(note)note.textContent='Sorted by '+sc[1]+', '+(TSORT.dir>0?'ascending':'descending');
  });

    tr.onclick=()=>openDeal(tr.getAttribute('data-id'));

// ── Stale after N days per stage — VERBATIM mirror of lib/sales_lifecycle.ts
//    staleDaysFor / dealQuietDays / dealStaleAfter (no bundler; pinned by
//    tests/presence/money_signature_test.mjs). STALE_DAYS is the site's
//    presence_settings.stage_stale_days (migration 0134), read once, best-effort.
const DEFAULT_STALE_DAYS=14;
const OPEN_STAGES_LIST=['lead','qualified','proposal','contract'];
function staleDaysFor(stage,setting){const s=(setting&&typeof setting==='object')?setting[String(stage)]:undefined;const n=Math.trunc(Number(s));return(Number.isFinite(n)&&n>=1&&n<=365)?n:DEFAULT_STALE_DAYS;}
function dealQuietDays(d,nowMs){const ts=[d.last_contacted_at,d.updated_at,d.created_at].map(x=>Date.parse(String(x||''))).filter(t=>Number.isFinite(t));if(!ts.length)return null;return Math.floor((nowMs-Math.max.apply(null,ts))/86400000);}
function dealStaleAfter(d,nowMs,setting){if(d.converted_client_id)return false;if(OPEN_STAGES_LIST.indexOf(String(d.stage||''))<0)return false;const q=dealQuietDays(d,nowMs);return q!==null&&q>=staleDaysFor(d.stage,setting);}
let STALE_DAYS={};
let STALE_Q=null;
const loadStaleDays=()=>(STALE_Q=STALE_Q||api('/settings').then(r=>{const v=r&&r.data&&r.data.stage_stale_days;STALE_DAYS=(v&&typeof v==='object')?v:{};return STALE_DAYS;}).catch(()=>{STALE_Q=null;return STALE_DAYS;}));
// ── Kanban board: columns = open stages, cards = deals (name · value · last
// contacted). A card opens the same drawer the list uses; moving a card calls
// the SAME /sales/deals/:id/stage endpoint and only offers canTransition-allowed
// targets (tap-to-move menu = the primary, accessible path; drag is additive).
function boardCard(d,today){
  const val=money(d.expected_value_cents);
  const lc=d.last_contacted_at?`Last contacted ${esc(ago(d.last_contacted_at))}`:'';
  const due=(d.next_step&&d.next_step_at&&d.next_step_at<=today)?`<div class="bc-due">Due: ${esc(d.next_step)}</div>`:'';
  // Stalled: no movement — no logged contact, no edit — for the stage's N days
  // (Settings → "stale after", default 14; benchmark 2026-10 item 13). Mirrors
  // lib/sales_lifecycle.ts dealStaleAfter.
  const stale=dealStaleAfter(d,Date.now(),STALE_DAYS);
  const staleN=staleDaysFor(d.stage,STALE_DAYS);
  const staleBadge=stale?`<span class="bc-stale" title="No movement in ${staleN}+ days — worth a nudge">${svgi('hourglass')} Stalled</span>`:'';
  const canMove=boardMoveTargets(d.stage).length>0;
  const moveBtn=canMove?`<button class="bc-move" data-move="${d.id}" aria-haspopup="menu" aria-expanded="false" title="Move this deal to another stage">Move →</button>`:'';
  return `<article class="bcard${stale?' is-stale':''}" draggable="true" tabindex="0" role="button" aria-label="${esc(d.title||'Untitled deal')} — ${esc(stageLabel(d.stage))}${stale?' — stalled':''}" data-id="${d.id}" data-stage="${d.stage}"><div class="bc-t">${esc(d.title||'Untitled deal')}</div>${val?`<div class="bc-v">${val}</div>`:''}${due||(lc?`<div class="bc-m">${lc}</div>`:'')}${staleBadge}<div class="bc-actions">${moveBtn}</div></article>`;
}
function renderBoard(){
  const host=$('board');
  const today=new Date().toISOString().slice(0,10);
  // Open deals only — won/lost are outcomes (mirrors the summary), shown in List.
  // boardVisible() = visibleDeals() (the .lhead search narrows the board too)
  // minus outcomes — the SAME set renderMeta counts, by construction.
  const open=boardVisible();
  const cols=BOARD_STAGES.map(stg=>{
    const ds=open.filter(d=>d.stage===stg);
    const sum=ds.reduce((a,d)=>a+(d.expected_value_cents||0),0);   // per-column total value (pipeline health at a glance)
    const cards=ds.map(d=>boardCard(d,today)).join('')||'<div class="bempty mut">Nothing here yet</div>';
    return `<section class="col" aria-label="${esc(stageLabel(stg))} column"><header class="col-h"><span class="col-t">${esc(stageLabel(stg))}</span><span class="col-n">${ds.length}</span>${sum?`<span class="col-val">${money(sum)}</span>`:''}</header><div class="col-tip mut">${esc(guidanceFor(stg).action)}</div><div class="col-body" data-drop="${stg}">${cards}</div></section>`;
  }).join('');
  const terminal=DEALS.length-open.length;
  host.innerHTML=`<div class="board-scroll"><div class="board">${cols}</div></div>`
    +(open.length?'':'<div class="mut" style="margin-top:12px">No open deals yet. Add one to start the pipeline.</div>')
    +(terminal>0?`<div class="mut board-foot">${terminal} won or closed deal${terminal===1?'':'s'} — see them in List view.</div>`:'');
  wireBoard();
}
function wireBoard(){
  const host=$('board');
  const move=async(id,to)=>{try{await api('/sales/deals/'+id+'/stage','POST',{to});PENDING_BACK='';toast('Moved to '+stageLabel(to));load();if(!$('detailWrap').hidden&&CURRENT_DEAL===id)openDeal(id);}catch(e){toast(nice(e),true);}};   // any pending back-confirm is against the OLD stage — drop it (mirrors crm.html moveStage)
  host.querySelectorAll('.bcard').forEach(c=>{
    const isCtrl=(e)=>e&&e.target&&e.target.closest&&e.target.closest('.bc-move,.bc-menu');
    c.onclick=(e)=>{if(!isCtrl(e))openDeal(c.dataset.id);};
    c.onkeydown=(e)=>{if((e.key==='Enter'||e.key===' ')&&!isCtrl(e)){e.preventDefault();openDeal(c.dataset.id);}};
    c.ondragstart=(e)=>{DRAG={id:c.dataset.id,from:c.dataset.stage};c.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.id);}catch(_){}}
      host.querySelectorAll('.col-body').forEach(b=>{if(boardCanMove(c.dataset.stage,b.dataset.drop))b.classList.add('drop-ok');});};
    c.ondragend=()=>{c.classList.remove('dragging');host.querySelectorAll('.col-body').forEach(b=>b.classList.remove('drop-ok','drop-over'));DRAG=null;};
  });

  // the keyboard alternative to drag. Full popup contract: opening focuses the
  // first option, arrows walk the list, Escape closes back to the invoker
  // (outside clicks dismiss via the ONE document-level closer above).
  host.querySelectorAll('.bc-move').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const card=btn.closest('.bcard'); const already=card.querySelector('.bc-menu');
      host.querySelectorAll('.bc-menu').forEach(m=>m.remove());
      host.querySelectorAll('.bc-move').forEach(b=>b.setAttribute('aria-expanded','false'));
      if(already) return;   // second tap closes it
      btn.setAttribute('aria-expanded','true');
      const menu=document.createElement('div'); menu.className='bc-menu'; menu.setAttribute('role','menu');
      menu.innerHTML=boardMoveTargets(card.dataset.stage).map(t=>`<button type="button" role="menuitem" data-to="${t}">${t==='lost'?'Mark as not a fit':'Move to '+esc(stageLabel(t))}</button>`).join('');
      card.querySelector('.bc-actions').appendChild(menu);
      menu.querySelectorAll('button').forEach(mb=>mb.onclick=(ev)=>{ev.stopPropagation();move(card.dataset.id,mb.dataset.to);});
      // focus the invoker BEFORE removing: removing the focused node makes the
      // browser's focus fixup land on <body>, clobbering a focus() issued after.
      const close=()=>{btn.focus();menu.remove();btn.setAttribute('aria-expanded','false');};
      // Tab-out closes too (no zombie open menu with aria-expanded=true) —
      // WITHOUT stealing focus back: the user chose to leave, let them land
      // where Tab took them. relatedTarget inside the menu = arrow/tab within.
      // A NULL relatedTarget is NOT "focus left the document": iOS Safari blurs
      // on tap without focusing anything, and contains(null) is false — the menu
      // would be REMOVED between pointerdown and click, so the tap lands on the
      // card underneath instead of the move it aimed at.
      menu.addEventListener('focusout',(ev)=>{const to=ev.relatedTarget;if(!to)return;if(!menu.isConnected||menu.contains(to))return;menu.remove();btn.setAttribute('aria-expanded','false');});
      menu.addEventListener('keydown',(ev)=>{
        const items=[...menu.querySelectorAll('button')]; const i=items.indexOf(document.activeElement);
        if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();close();}
        else if(ev.key==='ArrowDown'){ev.preventDefault();items[Math.min(i+1,items.length-1)].focus();}
        else if(ev.key==='ArrowUp'){ev.preventDefault();items[Math.max(i-1,0)].focus();}
      });
      const f=menu.querySelector('button'); if(f)f.focus();
      // the 44px options make the menu tall enough to clip at the board
      // scroller's bottom edge — nudge it fully into view
      if(menu.scrollIntoView)menu.scrollIntoView({block:'nearest',inline:'nearest'});
    };
    // Escape on the trigger itself (menu open, focus not yet inside) also closes.
    btn.onkeydown=(e)=>{
      if(e.key!=='Escape')return;
      const m=btn.closest('.bcard').querySelector('.bc-menu'); if(!m)return;
      e.preventDefault();e.stopPropagation();m.remove();btn.setAttribute('aria-expanded','false');
    };
  });

  // gently refused (and the column never lights up as droppable in the first place).

    body.ondragover=(e)=>{if(DRAG&&boardCanMove(DRAG.from,body.dataset.drop)){e.preventDefault();body.classList.add('drop-over');}};
    body.ondragleave=()=>body.classList.remove('drop-over');
    body.ondrop=(e)=>{e.preventDefault();body.classList.remove('drop-over');if(!DRAG)return;const to=body.dataset.drop,from=DRAG.from,id=DRAG.id;if(from===to)return;if(!boardCanMove(from,to)){toast('That deal can’t skip straight to '+stageLabel(to)+'.',true);return;}move(id,to);};
  });
}

// ── new deal: an accessible in-dialog form (no prompt) ──
function openNewDeal(){ $('f-title').value=''; $('f-email').value=''; $('f-name').value=''; $('f-phone').value=''; $('formDlg').showModal(); setTimeout(()=>$('f-title').focus(),20); }
// Scoped into a client, POST /sales/deals writes site_id = the CLIENT's site —
// but deals only ever live on the studio's own site, so the deal would vanish
// from the pipeline the moment you left the client. Hide the action.
if(scope())$('newDeal').hidden=true; else $('newDeal').onclick=openNewDeal;
// the toolbar's copy of "Manage services" (openManageServices is defined below —
// this handler only runs on click, long after the whole script has evaluated)
{const mst=$('mngServicesTop'); if(mst) mst.onclick=()=>openManageServices();}
// POST /sales/contacts dedupes on (site, email): an address that already belongs
// to someone returns THAT contact (200, deduped:true) and we link it, quietly
// dropping the name and phone that were just typed. Linking the person who owns
// the address is usually right — silently swapping who this deal is with is not.
// So every create path says, in one line, whose contact it linked and what of
// the typed details it did not keep. (The EDIT path refuses outright instead —
// sales.ts answers 409 email_taken there, because renaming an existing contact
// onto someone else's address is never the intent.)
const dedupeNote=(row,typedName,typedEmail)=>{

// ── an inline mini-form helper (replaces prompt) ──
// opts.alt = {label, run} adds a PRIMARY button beside a now-secondary Save —
// used so an agreement/proposal can be "Save & send" in one click while "Save
// draft" stays available. Both paths clear the draft on success.
function miniForm(host, fields, onSubmit, opts){
  opts=opts||{};
  host.innerHTML='';
  const f=document.createElement('form'); f.className='mini';
  const inputs={};
  fields.forEach(fl=>{
    // fl.draft (a stable, e.g. per-deal, suffix) opts the field into shell.js
    // draft preservation — long-form work survives an accidental Esc/refresh.
    const fid='mf-'+fl.name+(fl.draft?'-'+fl.draft:'');
    const lab=document.createElement('label'); lab.textContent=fl.label; lab.htmlFor=fid; f.appendChild(lab);
    const el=document.createElement(fl.type==='textarea'?'textarea':'input'); el.id=fid;
    if(fl.type&&fl.type!=='textarea') el.type=fl.type; if(fl.placeholder)el.placeholder=fl.placeholder; if(fl.step)el.step=fl.step;
    if(fl.draft)el.setAttribute('data-dds-draft','1');

  const save=document.createElement('button'); save.type='submit'; save.className=opts.alt?'btn ghost':'btn'; save.textContent=opts.saveLabel||'Save';

  const values=()=>Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value.trim()]));
  const clearDrafts=()=>{if(window.ddsDraftClear)f.querySelectorAll('[data-dds-draft]').forEach(el=>window.ddsDraftClear(el));};
  const setBusy=(x)=>{save.disabled=x;if(altBtn)altBtn.disabled=x;};
  const runWith=async(fn)=>{setBusy(true);try{await fn(values());clearDrafts();}catch(err){toast(nice(err),true);setBusy(false);}};
  f.onsubmit=(e)=>{e.preventDefault();runWith(onSubmit);};
  if(altBtn)altBtn.onclick=()=>runWith(opts.alt.run);

  // the paint steals the caret from a field the operator already tapped.
  const first=f.querySelector('input,textarea'); if(first)first.focus();
}

    // the record's "Payment schedule" link lands on #schedule (studio audit change 12): open the builder straight away, once
    if(WANT_SCHEDULE){WANT_SCHEDULE=false;if(setupPlanBtn)setupPlanBtn.click();}   // the replaceState above already dropped the hash
    const conv=$('convert'); if(conv) conv.onclick=()=>{
      // two-step confirm (no confirm() dialog). Service language, not SaaS: the
      // labels say WHAT KIND OF WORK this is; the values stay the same edition
      // keys the convert route expects (CONVERT_PLANS in routes/sales.ts). Paying
      // for software is SELF-SERVE at signup — never picked here.
      const wrap=$('convWrap'); wrap.innerHTML=`
        <label for="convPlan">What kind of work is this?</label>
        <select id="convPlan"><option value="presence" selected>I’m building them a new site — hosted with me</option><option value="business_os_only">They keep their site on their own platform — I do the rest</option><option value="presence_monitor">Just monitoring a site they already have</option></select>
        <div class="mut" style="margin-top:6px">Adding them creates their <strong>client portal</strong> and emails them a link to set their password and sign in — that’s where they work with you: files, approvals, messages, invoices. You bill them for your work the usual way — they never pay for software here. You can change this later.</div>
        <div class="row2" style="margin-top:10px"><button class="btn ghost" id="convNo">Cancel</button><button class="btn" id="convYes">Yes, add them as my customer</button></div>`;
      $('convNo').onclick=()=>openDeal(id);
      $('convYes').onclick=async()=>{$('convYes').disabled=true;try{const plan=($('convPlan')&&$('convPlan').value)||'presence';const r=await api('/sales/deals/'+id+'/convert','POST',{plan});const x=r.data||{};toast('Converted — workspace + project ready'+(x.idempotent?' (already done)':(x.invited?', customer invited':'')));
        // "Won stays put": when this panel is embedded in the unified Client Record,
        // tell the record to reveal + switch to Delivery — the relationship never
        // jumps to a separate destination at closed-won.
        if(EMBED){try{window.parent.postMessage({type:'dds-deal-converted',project_id:x.project_id||'',site_id:x.site_id||'',client_id:x.client_id||''},location.origin);}catch(_){}}
        openDeal(id);load();}catch(e){toast(nice(e),true);$('convYes').disabled=false;}};
    };
    const resend=$('resendInvite'); if(resend) resend.onclick=async()=>{resend.disabled=true;const was=resend.textContent;resend.textContent='Sending…';try{const r=await api('/sales/deals/'+id+'/resend-invite','POST',{});toast('Welcome email sent'+((r.data&&r.data.email)?' to '+r.data.email:'')+' ✓');openDeal(id);}catch(e){toast(nice(e),true);resend.disabled=false;resend.textContent=was;}};
    // a11y: an in-view action re-rendered the page and dropped focus — land it back
    // on the deal title (a stable, focusable anchor) so keyboard users aren't lost.
    if(wasOpen){const t=$('dtitle');if(t)t.focus();}
  }catch(e){ if(dgen!==DET_SEQ)return; $('detailInner').innerHTML='<div class="backbar"><button class="btn ghost" id="closeD">← Back to pipeline</button></div><div class="dbody mut">'+esc(nice(e))+'</div>'; const b=$('closeD'); if(b)b.onclick=closeDealDetail; }
}

// Boot honesty: a failed boot renders real trouble WITH a Try again that
// re-runs the whole boot in place (session + load — a bare load() couldn't
// paint without the token the failed boot never got). Markup is hand-rolled
// dds-error classes: shell.js (defer) may not have registered ddsError yet.
async function boot(){
  try{
    const {data}=await sb.auth.getSession();
    TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){ $('list').innerHTML='<p class="mut">Please <a href="/studio.html">sign in</a> to see your pipeline.</p>'; return; }
    // D1 (pipeline half): boot reads ?stage= — a linkable stage landing, most
    // importantly ?stage=won, the view the board deliberately hides. It lands
    // in List (won/lost are outcomes, not board columns); the persisted display
    // choice in storage is respected next visit, never overwritten here.
    const urlStage=new URLSearchParams(location.search).get('stage');
    // Only won/lost force List — they're outcomes the board structurally can't
    // show. An OPEN-stage landing keeps the persisted Board/Table choice (the
    // filter still applies the moment List/Table renders).
    if(urlStage&&STAGES.includes(urlStage)){FILTER=urlStage;if(urlStage==='won'||urlStage==='lost')VIEW='list';}
    renderFilters();
    if(VIEW!=='list')setView(VIEW); else await load();   // restore the persisted display (syncs the toggle), else plain load
    const deep=new URLSearchParams(location.search).get('deal'); if(deep) openDeal(deep);
    // ⌘K "billing" lands here as #outstanding (lib/navigation.ts): open "Who owes you"
    else if(location.hash==='#outstanding'){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}openReceivables();}
    // Settings → Invoices & agreements lands here with ?services=1: open the catalog straight away
    if(new URLSearchParams(location.search).get('services')==='1'){const sb=$('mngServicesTop');if(sb)sb.click();}
  }catch(_){
    $('list').innerHTML='<div class="dds-error"><span class="ico">!</span><span>We couldn’t load your pipeline just now.</span><button type="button" class="retry" id="bootRetry">Try again</button></div>';
    const b=$('bootRetry'); if(b)b.onclick=()=>boot();
  }
}
boot();
</script>
