<head>

<!-- P2-C: Studio App sales pipeline on the ONE shared shell + shared state helpers. -->
<link rel="stylesheet" href="/shell.css">
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--line:#eee9e0;--p:#5b3fa0}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--line:#2a2338;--p:#b79ceb}
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#171320}}
  :root[data-theme="dark"] .btn:not(.ghost){color:#171320}
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 80px}
  h1{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:4px}
  .sub{color:var(--soft);font-size:14px;margin-bottom:20px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
  .chip.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  .btn{font:inherit;font-size:13.5px;font-weight:600;border:none;border-radius:9px;padding:8px 14px;background:var(--p);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--warn)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .card:hover{border-color:var(--p)}
  .card .t{font-weight:600}
  .card .m{color:var(--soft);font-size:13px;margin-top:2px}
  .stage{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .stage.won{background:var(--good-soft);color:var(--good)}
  .stage.lost{background:transparent;border:1px solid var(--line);color:var(--soft)}
  .val{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px}
  dialog{border:none;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(27,21,37,.4)}
  .dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:start}
  .dbody{padding:18px 20px;max-height:64vh;overflow:auto}
  .sec{margin-top:16px}.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:8px}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  form.mini{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  form.mini .grid{display:flex;gap:8px;flex-wrap:wrap}
  input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  textarea{min-height:90px;resize:vertical}
  label{font-size:12.5px;color:var(--soft);display:block;margin:2px 0 3px}
  .mut{color:var(--soft);font-size:13px}
  .hrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--soft);padding:5px 0;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:none}
  .hrow .hd{white-space:nowrap;color:var(--faint);font-variant-numeric:tabular-nums}
  a{color:var(--p)}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}
</style>

<div class="wrap">
  <h1>Pipeline</h1>
  <div class="sub">From first enquiry through onboarding — one deal at a time.</div>
  <div class="bar" id="filters" role="tablist" aria-label="Filter by stage"></div>
  <div class="bar"><button class="btn" id="newDeal">+ New deal</button><span class="spacer"></span></div>
  <div id="list" aria-live="polite"></div>
</div>

<dialog id="formDlg" aria-label="New deal">
  <form id="dealForm" class="dbody" style="max-height:none">
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:12px">New deal</div>

    <input id="f-title" required maxlength="200" placeholder="e.g. Acme website" autocomplete="off">

    <input id="f-name" maxlength="120" placeholder="Jane Doe" autocomplete="off">

    <input id="f-phone" maxlength="40" placeholder="(555) 123-4567" autocomplete="off">
    <div class="row2" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn ghost" id="f-cancel">Cancel</button><button type="submit" class="btn">Create deal</button></div>
  </form>
</dialog>

<dialog id="detail" aria-label="Deal detail"><div id="detailInner"></div></dialog>

<dialog id="svcDlg" aria-label="Manage your services">
  <div class="dbody" style="max-height:70vh">
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:4px">Your services and prices</div>
    <div class="mut" style="margin-bottom:12px">Used to fill proposals fast. Change these any time.</div>
    <div id="svcRows"></div>
    <div class="row2" style="margin-top:10px"><button type="button" class="btn ghost" id="svcAdd">＋ Add a service</button></div>
    <div class="row2" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn ghost" id="svcCancel">Cancel</button><button type="button" class="btn" id="svcSave">Save</button></div>
  </div>
</dialog>

const EVT_LABEL={created:'Deal created',stage_change:'Moved stage',note:'Note added',proposal_sent:'Proposal sent',proposal_decided:'Proposal decision',contract_sent:'Agreement sent',contract_signed:'Agreement signed',invoice_sent:'Invoice sent',invoice_paid:'Invoice paid',converted:'Converted to project'};
function evtLabel(e){
  const d=(e&&e.detail)||{};

const evtDate=(iso)=>{const t=new Date(iso);if(isNaN(t))return'';const o={month:'short',day:'numeric'};if(t.getFullYear()!==new Date().getFullYear())o.year='numeric';return t.toLocaleDateString('en-US',o);};
let TOKEN="",FILTER="",DEALS=[];
// Signing links returned by /send (emailed OR not), kept for this session so a

// Server errors that read like a sentence still show; raw technical junk doesn't.
const nice=(e)=>{const m=e&&e.message?String(e.message):'';return /^[A-Z]/.test(m)&&m.length<160&&!/[{}<>]|_|\bsql\b|\bpostgres/i.test(m)?m:'Something went wrong on our side — please try again.';};

async function api(path,method,body){
  const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});
  let b={}; try{b=await r.json();}catch(_){}
  if(!r.ok){const e=new Error((b&&b.message)||'That didn’t go through.');e.status=r.status;e.body=b;throw e;}
  return b;
}

// The studio's own name (for the starter agreement's sign-off) — fetched once,

let BIZQ=null;
const bizName=()=>(BIZQ=BIZQ||api('/identity').then(r=>(r.data&&r.data.business_name)||'').catch(()=>{BIZQ=null;return '';}));

// The DEFAULT starter agreement — a calm, plain-language first draft for an
// owner with no saved templates yet. Saved templates stay the power path; this
// only ever fills an EMPTY form, and every word is editable before sending.
function starterAgreement(d,c,accepted,biz){
  const STUDIO=biz||'Davis Digital Studio LLC';
  const client=(c&&(c.company||c.name))||d.title||'[Client name]';
  const work=accepted
    ? `${d.title||'The project'} — the work set out in the proposal you accepted${accepted.title&&accepted.title!=='Proposal'?' (“'+accepted.title+'”)':''}. The specific deliverables, pages, and features are those described in that accepted proposal, which forms part of this agreement.`
    : '[Describe the work — the specific website, pages, features, and services included. Anything not listed here is a separate project.]';
  const total=accepted?money(accepted.subtotal_cents):'[total price]';
  const invest=accepted
    ? `The total investment for this project is ${total}, matching the proposal you accepted.`
    : `The total investment for this project is ${total}.`;
  const today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  return `SERVICE AGREEMENT

This agreement is between ${STUDIO} (“the Studio,” “I,” or “me”) and ${client} (“you” or “the Client”), dated ${today}. It’s written in plain language on purpose — it says what we’ve both agreed in words we can each read and understand. Please read it, edit anything that needs adjusting, and sign at the bottom. Signing means you agree to these terms.

1. What I’ll do
${work}

2. Investment and payment
${invest}
Payment schedule: a deposit of [deposit amount, e.g. 50%] is due to reserve your spot and begin work. The remaining balance is invoiced [as milestones are reached / on completion — choose one]. Invoices are due within [7] days of being sent. Work may pause on any invoice more than [14] days past due, and a late fee of [1.5%] per month may apply to overdue balances. All payments are made through the secure payment links I send; I never store your card details.

3. Timeline
I’ll begin work once this agreement is signed and the deposit is received. I’ll aim to complete the project by [target date], assuming I receive what I need from you on time. Dates are good-faith estimates, not guarantees — if something needs to move, we’ll tell each other early and adjust together.

4. What I need from you
To keep things on track, I’ll need: your content (text, photos, logos, and any logins) when I ask for it; honest, consolidated feedback within [3–5] business days of each review; and one point of contact who can give final approvals on your behalf. If these run late, the timeline moves with them, and I’m not responsible for delays caused by waiting on you.

5. Revisions and changes
Reasonable revisions to the work described above are included as we go. A “change” — new pages, new features, added scope, or a change in direction after approval — is welcome, but it’s new work: I’ll quote it in writing and we’ll both agree before I start. This keeps your budget predictable and surprise-free.

6. Ownership and your content
When your final payment clears, the finished, delivered work is yours to use. Until then, all work remains my property. Your own content — your words, images, brand, and customer information — is always yours, and you can export and take it with you at any time. Any third-party materials (fonts, stock images, plugins, hosting) remain under their own licenses, and any recurring fees for them are your responsibility. I may show the finished work in my portfolio and mention that I built it, unless you ask me in writing not to.

7. Hosting, maintenance, and after launch
This agreement covers building and delivering the project above. Ongoing hosting, updates, monitoring, and support are provided under a separate plan or retainer — ask me and I’ll explain the options. Once the project is delivered and paid for, this agreement is complete unless we’ve agreed to continued care in writing.

8. If something goes wrong (the honest limits)
I put real care into this work, but I can’t promise specific business results (sales, rankings, traffic). I provide the work “as delivered.” To the fullest extent the law allows, my total responsibility to you for any claim is limited to the amount you’ve paid me for this project, and I’m not liable for indirect or consequential losses. You’re responsible for the legality and accuracy of the content and materials you provide me.

9. Ending the agreement
Either of us can end this agreement with written notice. If you end it, you pay for all work completed up to that point, any non-refundable deposits stand, and you keep everything you’ve paid for. I may end it if invoices go unpaid or if I’m unable to get what I need to continue.

10. The basics
I work as an independent contractor, not an employee. This agreement, plus any accepted proposal, is the whole agreement between us and replaces any earlier conversations. It’s governed by the laws of the State of California. If any part of it can’t be enforced, the rest still stands. Changes to this agreement need to be in writing and agreed by both of us.

By signing below, you agree to the terms above.


Signed for the Client — ${client}


Signed for the Studio — ${STUDIO}`;
}

function renderFilters(){
  const opts=[['','All'],...STAGES.map(s=>[s,stageLabel(s)])];
  $('filters').innerHTML=opts.map(([v,l])=>`<button role="tab" aria-selected="${v===FILTER?'true':'false'}" class="chip${v===FILTER?' on':''}" data-stage="${v}">${esc(l)}</button>`).join('');
  $('filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{FILTER=b.dataset.stage;renderFilters();load();});
}

async function load(){
  if(window.ddsSkeleton) window.ddsSkeleton($('list'),4);
  try{
    const res=await api('/sales/deals'+(FILTER?('?stage='+FILTER):''));
    DEALS=res.data||[];
    if(!DEALS.length){ if(window.ddsEmpty) window.ddsEmpty($('list'),{icon:'🧭',title:'No deals yet',body:'New enquiries and manual deals show up here. Add your first one to start the pipeline.',actionLabel:'New deal',onAction:openNewDeal}); else $('list').innerHTML='<p class="mut">No deals yet.</p>'; return; }
    // Deals with a DUE next step float to the top (overdue first) — the pipeline
    // answers "what do I do today", not just "what exists".
    const today=new Date().toISOString().slice(0,10);
    DEALS.sort((a,b)=>{const ad=a.next_step_at||'9999',bd=b.next_step_at||'9999';return ad<bd?-1:ad>bd?1:0;});
    $('list').innerHTML=DEALS.map(d=>{
      const ns=d.next_step?`<div class="m">${(d.next_step_at&&d.next_step_at<=today)?`<span style="color:var(--warn,#775d31);font-weight:600">Due: ${esc(d.next_step)}</span>`:`Next: ${esc(d.next_step)}${d.next_step_at?' · '+esc(d.next_step_at):''}`}</div>`:'';
      return `<div class="card" data-id="${d.id}" tabindex="0" role="button"><div><div class="t">${esc(d.title||'Untitled deal')}</div><div class="m">${esc(d.source||'')}${d.expected_close?' · closes '+esc(d.expected_close):''}</div>${ns}</div><div style="text-align:right">${stageBadge(d.stage)}<div class="val">${money(d.expected_value_cents)}</div></div></div>`;
    }).join('');
    $('list').querySelectorAll('.card').forEach(c=>{const open=()=>openDeal(c.dataset.id);c.onclick=open;c.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});
  }catch(e){ if(window.ddsError) window.ddsError($('list'),nice(e),load); else $('list').innerHTML='<p class="mut">'+esc(nice(e))+'</p>'; }
}

// ── new deal: an accessible in-dialog form (no prompt) ──
function openNewDeal(){ $('f-title').value=''; $('f-email').value=''; $('f-name').value=''; $('f-phone').value=''; $('formDlg').showModal(); setTimeout(()=>$('f-title').focus(),20); }
$('newDeal').onclick=openNewDeal;
$('f-cancel').onclick=()=>$('formDlg').close();
$('dealForm').onsubmit=async(e)=>{
  e.preventDefault();
  const title=$('f-title').value.trim(); if(!title){toast('A deal needs a title.',true);return;}
  const email=$('f-email').value.trim();
  const cname=$('f-name').value.trim(); const cphone=$('f-phone').value.trim();
  const btn=e.submitter; if(btn)btn.disabled=true;
  try{
    let contactId=null;
    // capture a real name/phone if given (no more "jane.doe" contacts from the email)
    if(email||cname){ const c=await api('/sales/contacts','POST',{email:email||undefined,name:cname||(email?email.split('@')[0]:'New contact'),phone:cphone||undefined}); contactId=c.data&&c.data.id; }
    const created=await api('/sales/deals','POST',{title,contact_id:contactId});
    $('formDlg').close(); toast('Deal added'); load();
    if(created&&created.data&&created.data.id) openDeal(created.data.id);   // straight into the deal — no hunting the list
  }catch(err){ toast(nice(err),true); } finally{ if(btn)btn.disabled=false; }
};

// ── an inline mini-form helper (replaces prompt) ──
// opts.alt = {label, run} adds a PRIMARY button beside a now-secondary Save —
// used so an agreement/proposal can be "Save & send" in one click while "Save
// draft" stays available. Both paths clear the draft on success.
function miniForm(host, fields, onSubmit, opts){
  opts=opts||{};
  host.innerHTML='';
  const f=document.createElement('form'); f.className='mini';
  const inputs={};
  fields.forEach(fl=>{
    // fl.draft (a stable, e.g. per-deal, suffix) opts the field into shell.js
    // draft preservation — long-form work survives an accidental Esc/refresh.
    const fid='mf-'+fl.name+(fl.draft?'-'+fl.draft:'');
    const lab=document.createElement('label'); lab.textContent=fl.label; lab.htmlFor=fid; f.appendChild(lab);
    const el=document.createElement(fl.type==='textarea'?'textarea':'input'); el.id=fid;
    if(fl.type&&fl.type!=='textarea') el.type=fl.type; if(fl.placeholder)el.placeholder=fl.placeholder; if(fl.step)el.step=fl.step;
    if(fl.draft)el.setAttribute('data-dds-draft','1');
    f.appendChild(el); inputs[fl.name]=el;
  });
  const row=document.createElement('div'); row.className='row2'; row.style.justifyContent='flex-end';
  const cancel=document.createElement('button'); cancel.type='button'; cancel.className='btn ghost'; cancel.textContent='Cancel';
  const save=document.createElement('button'); save.type='submit'; save.className=opts.alt?'btn ghost':'btn'; save.textContent=opts.saveLabel||'Save';
  const altBtn=opts.alt?document.createElement('button'):null;
  if(altBtn){altBtn.type='button';altBtn.className='btn';altBtn.textContent=opts.alt.label;}
  row.appendChild(cancel); row.appendChild(save); if(altBtn)row.appendChild(altBtn); f.appendChild(row); host.appendChild(f);
  cancel.onclick=()=>host.innerHTML='';
  if(window.ddsDraftRestore)f.querySelectorAll('[data-dds-draft]').forEach(el=>window.ddsDraftRestore(el));
  const values=()=>Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value.trim()]));
  const clearDrafts=()=>{if(window.ddsDraftClear)f.querySelectorAll('[data-dds-draft]').forEach(el=>window.ddsDraftClear(el));};
  const setBusy=(x)=>{save.disabled=x;if(altBtn)altBtn.disabled=x;};
  const runWith=async(fn)=>{setBusy(true);try{await fn(values());clearDrafts();}catch(err){toast(nice(err),true);setBusy(false);}};
  f.onsubmit=(e)=>{e.preventDefault();runWith(onSubmit);};
  if(altBtn)altBtn.onclick=()=>runWith(opts.alt.run);
  setTimeout(()=>{const first=f.querySelector('input,textarea'); if(first)first.focus();},20);
}

// ── Manage services: the studio's own catalog of sellable services + prices.
// A calm editor (rows of name + price, add/remove, Save) writing the whole list
// to /sales/services. Reused by the proposal dropdown to auto-fill line items. ──
const svcRowHtml=(s)=>{s=s||{name:'',price:''};return `<div class="row2 svc-row" style="margin-top:6px"><input type="text" class="svc-name" maxlength="120" placeholder="Service name, e.g. Website design" value="${esc(s.name)}" style="flex:1;min-width:150px" aria-label="Service name"><input type="number" step="0.01" min="0" class="svc-price" placeholder="Price (USD)" value="${esc(s.price)}" style="max-width:140px" aria-label="Price in dollars"><button type="button" class="btn ghost svc-del" title="Remove this service" aria-label="Remove this service" style="padding:8px 11px">✕</button></div>`;};
async function openManageServices(){
  const host=$('svcRows'); host.innerHTML='<div class="mut">Loading…</div>'; $('svcDlg').showModal();
  let list=[];
  try{const r=await api('/sales/services');list=(r.data||[]).map(s=>({name:s.name,price:(s.price_cents/100)}));}catch(e){toast(nice(e),true);}
  if(!list.length)list=[{name:'',price:''}]; // an empty starter row to type into
  host.innerHTML=list.map(svcRowHtml).join('');

$('svcRows').addEventListener('click',(e)=>{const del=e.target.closest('.svc-del');if(!del)return;del.closest('.svc-row').remove();if(!$('svcRows').querySelector('.svc-row'))$('svcRows').insertAdjacentHTML('beforeend',svcRowHtml());});
$('svcAdd').onclick=()=>{$('svcRows').insertAdjacentHTML('beforeend',svcRowHtml());const names=$('svcRows').querySelectorAll('.svc-name');names[names.length-1].focus();};
$('svcCancel').onclick=()=>$('svcDlg').close();
$('svcSave').onclick=async()=>{
  const services=[...$('svcRows').querySelectorAll('.svc-row')].map(r=>({name:r.querySelector('.svc-name').value.trim(),price_cents:Math.round(parseFloat(r.querySelector('.svc-price').value||'0')*100)})).filter(s=>s.name);
  $('svcSave').disabled=true;

  catch(e){toast(nice(e),true);}finally{$('svcSave').disabled=false;}
};

async function openDeal(id){
  CURRENT_DEAL=id;
  history.replaceState(null,'','?deal='+id+(scope()?'&client='+scope():''));
  const dlg=$('detail'); $('detailInner').innerHTML='<div class="dbody"><div class="dds-skeleton" style="height:16px;width:60%"></div></div>'; dlg.showModal();
  bizName(); // warm the studio-name cache so the agreement starter fills instantly
  try{
    const [{data},tplRes,svcRes]=await Promise.all([api('/sales/deals/'+id),api('/sales/templates').catch(()=>({data:[]})),api('/sales/services').catch(()=>({data:[]}))]);
    SERVICES=(svcRes&&svcRes.data)||[];
    const d=data.deal, c=data.contact;
    const TPLS=(tplRes&&tplRes.data)||[]; const propTpls=TPLS.filter(t=>t.kind==='proposal'); const conTpls=TPLS.filter(t=>t.kind==='contract');
    // only VALID next stages (mirrors lib/sales_lifecycle.ts); 'won' is convert-only
    const NEXT={lead:['qualified','lost'],qualified:['proposal','lead','lost'],proposal:['contract','qualified','lost'],contract:['won','proposal','lost'],won:[],lost:['lead']};
    const nextStages=(NEXT[d.stage]||[]).filter(s=>s!=='won');
    // Hierarchy, not a row of identical chips: the ONE forward step is primary,
    // going back is quiet, and "Not a fit" is separated so it can't be fat-fingered.
    const ORDER=['lead','qualified','proposal','contract','won'];
    const fwd=nextStages.find(s=>s!=='lost'&&ORDER.indexOf(s)>ORDER.indexOf(d.stage));
    const back=nextStages.filter(s=>s!=='lost'&&s!==fwd);
    const stepBtns=[
      fwd?`<button class="btn" data-stage="${fwd}">Move to ${esc(stageLabel(fwd))} →</button>`:'',
      ...back.map(s=>`<button class="btn ghost" data-stage="${s}">Back to ${esc(stageLabel(s))}</button>`),
      nextStages.includes('lost')?`<button class="btn ghost" id="markLost" style="margin-left:auto;border-color:transparent;color:var(--soft)">Mark as lost (not a fit)</button>`:'',
    ].join('');
    // A saved-but-unsent doc must NEVER read as finished: a plain status chip +
    // a PRIMARY Send. A sent-but-not-emailed doc keeps a persistent "copy link"
    // (LINKS) so it's never silently stuck. `forWhom` personalises the CTA.
    const forWhom=(c&&c.name)?(' to '+esc(c.name)):'';
    const linkNote=(kind,docId,label)=>LINKS[docId]?`<div class="mut" style="flex-basis:100%;margin-top:4px">Prepared — <a href="${esc(LINKS[docId])}" target="_blank" rel="noopener">open the ${label}</a>, or use “Copy ${label}”. It wasn’t emailed, so share it yourself.</div>`:'';
    const props=(data.proposals||[]).map(p=>{
      const chip=p.status==='accepted'?`<span class="stage won">Accepted ✓</span>`:p.status==='declined'?`<span class="stage lost">Declined</span>`:p.status==='sent'?`<span class="stage">Sent — awaiting decision</span>`:`<span class="stage lost">Draft — not sent yet</span>`;
      const act=p.status==='draft'?`<button class="btn" data-send-proposal="${p.id}">Send${forWhom} →</button> `:p.status==='sent'?`<button class="btn ghost" data-link-proposal="${p.id}">Copy link</button> `:'';
      return `<div class="row2"><span class="mut">${esc(p.title||'Proposal')} — ${money(p.subtotal_cents)} ${chip}</span><span>${act}<button class="btn ghost" data-doc-prop="${p.id}" title="Open a branded, printable copy (save as PDF)">View / print</button><button class="btn ghost" data-tpl-prop="${p.id}" title="Save these line items to reuse on future deals">Save as template</button></span>${p.status==='sent'?linkNote('proposal',p.id,'link'):''}</div>`;
    }).join('')||'<div class="mut">No proposals yet.</div>';
    const propTplBtns=propTpls.map(t=>`<button class="btn ghost" data-use-ptpl="${t.id}" title="Draft a proposal from this saved template">Use “${esc(t.name)}”</button><button class="btn ghost" data-del-tpl="${t.id}" title="Remove this saved template" aria-label="Remove saved template ${esc(t.name)}" style="padding-left:8px;padding-right:8px">✕</button>`).join('');
    const cons=(data.contracts||[]).map(k=>{
      const signed=k.status==='signed';
      const chip=signed?`<span class="stage won">Signed ✓</span>`:k.status==='sent'?`<span class="stage">Sent — awaiting signature</span>`:`<span class="stage lost">Draft — not sent yet</span>`;
      const meta=signed&&k.signer_name?` — signed by ${esc(k.signer_name)}${k.signed_at?(' on '+esc(new Date(k.signed_at).toLocaleDateString())):''}`:'';
      const act=k.status==='draft'?`<button class="btn" data-send-contract="${k.id}">Send${forWhom} for signature →</button> `:k.status==='sent'?`<button class="btn ghost" data-link-contract="${k.id}">Copy signing link</button> `:'';
      const docBtn=`<button class="btn ghost" data-doc-con="${k.id}" title="Open a branded, printable copy (save as PDF)">${signed?'View / print signed copy':'View / print'}</button>`;
      return `<div class="row2"><span class="mut">${esc(k.title||'Agreement')} ${chip}${meta}</span><span>${act}${docBtn}<button class="btn ghost" data-tpl-con="${k.id}" title="Save this agreement text to reuse on future deals">Save as template</button></span>${k.status==='sent'?linkNote('contract',k.id,'signing link'):''}</div>`;
    }).join('')||'<div class="mut">No agreement yet.</div>';
    const conTplBtns=conTpls.map(t=>`<button class="btn ghost" data-use-ctpl="${t.id}" title="Draft an agreement from this saved template">Use “${esc(t.name)}”</button><button class="btn ghost" data-del-tpl="${t.id}" title="Remove this saved template" aria-label="Remove saved template ${esc(t.name)}" style="padding-left:8px;padding-right:8px">✕</button>`).join('');
    const canConvert=(d.stage==='contract'||d.stage==='won')&&!d.converted_client_id;
    const draftContract=(data.contracts||[]).find(k=>k.status==='draft'); // saved but not sent
    // Convert = adding YOUR customer (service voice, frozen billing boundary):
    // the studio bills them for the work — they never subscribe to software.
    // Self-serve platform signups pick a plan at signup.html; never here.
    const whoName=esc(((c&&c.name)||d.title||'this client'));
    const convExplain=(c&&c.email
      ? `This adds ${whoName} as your customer — it creates their client workspace and emails ${esc(c.email)} a link to set their password and sign in. Nothing else needed.`
      : `This adds ${whoName} as your customer — it creates their client workspace. There’s no client email on this deal, so no sign-in invitation goes out; you can share access with them later.`)
      +' It’s part of your service: you bill them for your work the usual way — they never subscribe to anything or pay for software.';
    $('detailInner').innerHTML=`
      <div class="dhead"><div><div style="font-family:var(--serif);font-size:20px">${esc(d.title||'Deal')}</div>
        <div class="mut">${c?esc((c.name||'')+(c.email?(' · '+c.email):'')):'No contact'} · ${stageBadge(d.stage)}${(()=>{const open=(data.invoices||[]).find(v=>v.status==='open');const paid=(data.invoices||[]).find(v=>v.status==='paid');return open?` · <span style="color:var(--warn,#775d31);font-weight:600">${money(open.amount_cents)} ${open.purpose==='deposit'?'deposit':'invoice'} awaiting payment</span>`:paid?` · <span style="color:var(--good,#33664b);font-weight:600">${money(paid.amount_cents)} paid ✓</span>`:'';})()}</div></div>
        <button class="btn ghost" id="closeD" aria-label="Close">✕</button></div>
      <div class="dbody">
        <div class="sec"><h3>Move stage</h3><div class="steps">${d.converted_client_id?'<span class="mut">Won ✓ — converted to a customer</span>':d.stage==='lost'?`<span class="mut">Marked as lost.${d.lost_reason?' '+esc(d.lost_reason):''}</span> <button class="btn ghost" data-stage="lead">Reopen this deal</button>`:stepBtns||'<span class="mut">—</span>'}</div><div id="lostForm"></div></div>
        <div class="sec"><h3>Details</h3>
          <label class="mut" for="ed-value">Deal value (USD)</label><br>
          <input id="ed-value" type="number" step="0.01" min="0" value="${d.expected_value_cents?(d.expected_value_cents/100):''}" placeholder="2500" style="width:160px;padding:8px;border:1px solid var(--line,#ddd);border-radius:8px;font:inherit">
          <label class="mut" for="ed-close" style="display:block;margin-top:8px">Expected close</label>
          <input id="ed-close" type="date" value="${esc(d.expected_close||'')}" style="padding:8px;border:1px solid var(--line,#ddd);border-radius:8px;font:inherit">
          <label class="mut" for="ed-next" style="display:block;margin-top:8px">Next step</label>
          <div class="row2"><input type="text" id="ed-next" placeholder="e.g. Call Friday about the proposal" value="${esc(d.next_step||'')}" style="flex:1"><input type="date" id="ed-nextat" value="${esc(d.next_step_at||'')}" style="max-width:160px" aria-label="Next step date"></div>
          <label class="mut" for="ed-notes-${d.id}" style="display:block;margin-top:8px">Notes</label>
          <textarea id="ed-notes-${d.id}" data-dds-draft="1" rows="3" placeholder="Anything worth remembering about this deal…" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line,#ddd);border-radius:8px;font:inherit">${esc(d.notes||'')}</textarea>
          <div class="row2" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost" id="ed-save">Save details</button></div>
        </div>
        <div class="sec"><h3>Proposals</h3>${props}<div class="row2"><button class="btn ghost" id="addProp">+ Proposal</button>${propTplBtns}<span style="flex:1"></span><button class="btn ghost" id="mngServices" title="Your services and prices — used to fill proposals fast">Manage services</button></div><div id="propForm"></div></div>
        <div class="sec"><h3>Agreement</h3>${cons}<div class="row2"><button class="btn ghost" id="addCon">+ Agreement</button>${conTplBtns}</div><div id="conForm"></div></div>
        <div class="sec"><h3>Invoice &amp; deposit</h3>
          ${(data.invoices||[]).map(v=>`<div class="row2"><span class="mut">${esc(v.title||(v.purpose==='deposit'?'Deposit':'Invoice'))} — ${money(v.amount_cents)}${v.due_date?` · due ${esc(v.due_date)}`:(v.status==='open'?' · due now':'')}</span><span>${v.status==='paid'?`<span style="color:var(--good,#33664b);font-weight:700">✓ Paid${v.paid_at?' '+new Date(v.paid_at).toLocaleDateString():''}</span>`:v.status==='void'?`<span class="mut">Voided</span>`:`<span style="color:var(--warn,#775d31);font-weight:600">${v.stripe_url?'Awaiting payment':'Not sent yet'}</span> <button class="btn ghost" data-send-inv="${v.id}">${v.stripe_url?'Resend':'Send'}</button>${v.stripe_url?` <button class="btn ghost" data-copy-pay="${esc(v.stripe_url)}">Copy link</button>`:''}`}<button class="btn ghost" data-doc-inv="${v.id}" title="Open a branded, printable copy (save as PDF)">View / print</button></span></div>`).join('')}
          ${(()=>{const inv=(data.invoices||[]).filter(v=>v.status!=='void');if(inv.length<2)return '';const sum=inv.reduce((a,b)=>a+(b.amount_cents||0),0);const paid=inv.filter(v=>v.status==='paid').reduce((a,b)=>a+(b.amount_cents||0),0);return `<div class="mut" style="margin-top:4px">Payment plan: ${inv.length} stages · ${money(sum)} total${paid?' · '+money(paid)+' paid':''}</div>`;})()}
          <div class="mut" style="margin-top:6px">Send the client a secure payment link, or set up a plan — a deposit now with the balance on completion, or milestone installments.</div>
          <div class="row2" style="margin-top:8px"><button class="btn ghost" id="sendInvoice">Send an invoice</button><button class="btn ghost" id="sendDeposit">Request a deposit</button><button class="btn ghost" id="setupPlan">Set up a payment schedule</button></div><div id="invForm"></div></div>
        <div class="sec"><h3>Convert to customer</h3>
          ${d.converted_client_id?`<div class="mut">${c&&c.email?`Workspace created — a sign-in invitation went to ${esc(c.email)}.`:'Workspace created — there was no client email on this deal, so no sign-in invitation was sent.'}</div><div class="row2" style="margin-top:8px">${d.created_project_id?`<a class="btn" href="/projects.html?project=${esc(d.created_project_id)}${scope()?'&client='+scope():''}">Open their project →</a>`:''}<a class="btn ghost" href="/sharing.html">Manage their access →</a></div>`:
            canConvert?`<div id="convWrap"><button class="btn" id="convert">Convert — set up their workspace</button><div class="mut" style="margin-top:8px">${convExplain}</div></div>`:
            draftContract?`<div class="mut">Your agreement is drafted but hasn’t been sent yet — ${whoName} can’t sign until it goes out. Send it for signature first; once it’s signed you can add them as your customer.</div><div class="row2" style="margin-top:8px"><button class="btn" data-send-contract="${draftContract.id}">Send the agreement for signature →</button></div>`:
            `<div id="convWrap"><button class="btn" disabled>Sign the agreement first</button></div>`}
        </div>
        ${(data.events||[]).length?`<div class="sec"><h3>History</h3>${(data.events||[]).map(e=>`<div class="hrow"><span>${esc(evtLabel(e))}</span><span class="hd">${esc(evtDate(e.created_at))}</span></div>`).join('')}</div>`:''}
        ${(d.converted_client_id||d.stage==='converted')?'':`<div class="sec" style="border-top:1px solid var(--line);padding-top:14px;margin-top:8px"><button class="btn ghost" id="delDeal" style="border-color:transparent;color:var(--bad,#a3423a);font-size:13px">Delete this deal</button></div>`}
      </div>`;
    $('closeD').onclick=()=>dlg.close();
    // ONE cleanup for every way the dialog closes (✕, Esc, form-close) — else a
    // refresh after Esc unexpectedly reopens the deal from the stale ?deal= URL.
    if(!dlg.dataset.wiredClose){dlg.dataset.wiredClose='1';dlg.addEventListener('close',()=>history.replaceState(null,'',location.pathname+(scope()?'?client='+scope():'')));}
    $('detailInner').querySelectorAll('[data-stage]').forEach(b=>b.onclick=async()=>{try{await api('/sales/deals/'+id+'/stage','POST',{to:b.dataset.stage});toast('Moved to '+stageLabel(b.dataset.stage));openDeal(id);load();}catch(e){toast(nice(e),true);}});
    // Lost is gentle but deliberate: an optional one-line reason (stored on the
    // deal via the stage route's `reason` → lost_reason) so "why" survives.
    const markLost=$('markLost'); if(markLost) markLost.onclick=()=>miniForm($('lostForm'),[{name:'reason',label:'Reason (optional) — a note for your own records',placeholder:'e.g. Went with someone cheaper'}],async(v)=>{try{await api('/sales/deals/'+id+'/stage','POST',{to:'lost',reason:v.reason||undefined});toast('Marked as lost');openDeal(id);load();}catch(e){toast(nice(e),true);}});
    const delDeal=$('delDeal'); if(delDeal) delDeal.onclick=async()=>{if(!confirm('Delete this deal? It leaves your pipeline; the history stays in your records. This can’t be undone here.'))return;delDeal.disabled=true;try{await api('/sales/deals/'+id,'DELETE');toast('Deal deleted');dlg.close();load();}catch(e){toast(nice(e),true);delDeal.disabled=false;}};
    const edNotes=$('ed-notes-'+id); if(edNotes&&window.ddsDraftRestore)window.ddsDraftRestore(edNotes); // an unsaved note survives an accidental Esc
    const eds=$('ed-save'); if(eds) eds.onclick=async()=>{eds.disabled=true;try{const v=$('ed-value').value.trim();await api('/sales/deals/'+id,'PATCH',{expected_value_cents:v?Math.round(parseFloat(v)*100):null,expected_close:$('ed-close').value||null,notes:edNotes.value.trim(),next_step:$('ed-next')?$('ed-next').value.trim():undefined,next_step_at:$('ed-nextat')?($('ed-nextat').value||null):undefined});if(window.ddsDraftClear)window.ddsDraftClear(edNotes);toast('Saved');openDeal(id);load();}catch(e){toast(nice(e),true);eds.disabled=false;}};
    // ONE send path per doc-kind (reused by the list buttons, "Save & send", and
    // the convert gate's "send first"). It records the link in LINKS, copies it,
    // and — critically — tells the operator honestly whether it was EMAILED or
    // only prepared (so a not-emailed doc is never mistaken for delivered).
    const copyToClip=(url)=>{if(!url)return;if(navigator.clipboard)navigator.clipboard.writeText(url).catch(()=>{});};
    const sendProposalById=async(pid)=>{const r=await api('/sales/proposals/'+pid+'/send','POST',{});if(r.url&&!r.emailed)LINKS[pid]=r.url;toast(r.emailed?('Proposal sent'+(c&&c.name?' — emailed to '+c.name:' — emailed to the client')):'Proposal prepared — it wasn’t emailed, so copy the link and send it yourself.');copyToClip(r.url);openDeal(id);};
    const sendContractById=async(cid)=>{const r=await api('/sales/contracts/'+cid+'/send','POST',{});if(r.url&&!r.emailed)LINKS[cid]=r.url;
      // The sign→pay moment only works if a deposit is WAITING when they sign.
      const hasOpenDeposit=(data.invoices||[]).some(v=>v.purpose==='deposit'&&v.status==='open');
      toast(r.emailed?('Agreement sent'+(c&&c.name?' — emailed to '+c.name:' — emailed to the client')+(hasOpenDeposit?'':'. Tip: request the deposit now — they can pay right after signing.')):'Agreement prepared — it wasn’t emailed, so copy the signing link and send it yourself.');
      copyToClip(r.url);openDeal(id);};
    // Copy an already-sent doc's link (send is idempotent → re-fetches the link).
    const copyDocLink=async(kind,docId)=>{try{let url=LINKS[docId];if(!url){const r=await api('/sales/'+(kind==='contract'?'contracts':'proposals')+'/'+docId+'/send','POST',{});url=r.url;if(url)LINKS[docId]=url;}if(!url){toast('No signing link is available — check your email settings.',true);return;}copyToClip(url);toast(kind==='contract'?'Signing link copied':'Link copied');}catch(e){toast(nice(e),true);}};
    // Open the branded, print-ready Document of Record (proposal / agreement /
    // invoice). Opens a new tab pointed at the server-rendered page (Save-as-PDF
    // via the page's Print button). `table` is the plural /sales/* segment.
    const openDoc=async(table,docId,el)=>{if(el)el.disabled=true;try{const r=await api('/sales/'+table+'/'+docId+'/document');if(r&&r.url)window.open(r.url,'_blank','noopener');else toast('Couldn’t open the document just now.',true);}catch(e){toast(nice(e),true);}finally{if(el)el.disabled=false;}};
    $('detailInner').querySelectorAll('[data-send-proposal]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await sendProposalById(b.dataset.sendProposal);}catch(e){toast(nice(e),true);b.disabled=false;}});
    $('detailInner').querySelectorAll('[data-send-contract]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await sendContractById(b.dataset.sendContract);}catch(e){toast(nice(e),true);b.disabled=false;}});
    $('detailInner').querySelectorAll('[data-link-proposal]').forEach(b=>b.onclick=()=>copyDocLink('proposal',b.dataset.linkProposal));
    $('detailInner').querySelectorAll('[data-link-contract]').forEach(b=>b.onclick=()=>copyDocLink('contract',b.dataset.linkContract));
    $('detailInner').querySelectorAll('[data-doc-prop]').forEach(b=>b.onclick=()=>openDoc('proposals',b.dataset.docProp,b));
    $('detailInner').querySelectorAll('[data-doc-con]').forEach(b=>b.onclick=()=>openDoc('contracts',b.dataset.docCon,b));
    $('detailInner').querySelectorAll('[data-doc-inv]').forEach(b=>b.onclick=()=>openDoc('invoices',b.dataset.docInv,b));
    const mng=$('mngServices'); if(mng) mng.onclick=openManageServices;
    // Multi-line proposal form — real projects have design + build + care, not one line.
    const addProp=$('addProp'); if(addProp) addProp.onclick=()=>{
      const host=$('propForm');
      // Each line starts as a DROPDOWN of the studio's services (auto-fills the
      // price) plus a "Custom…" option that reveals the free name+price fields —
      // today's behaviour. With no catalog yet, we fall back to the free fields
      // and gently point to "Manage services".
      const hasCat=SERVICES.length>0;
      const optsHtml=SERVICES.map((s,i)=>`<option value="${i}">${esc(s.name)} — ${esc(money(s.price_cents)||'$0')}</option>`).join('');
      let ln=0; // per-deal, per-line draft keys — typed line items survive an accidental Esc
      const rowHtml=()=>{ln++;
        const pick=hasCat?`<select class="pl-pick" aria-label="Choose a service"><option value="">Pick a service…</option>${optsHtml}<option value="__custom__">Custom…</option></select>`:'';
        const hide=hasCat?' style="display:none"':'';
        return `<div class="prop-line" style="margin-top:6px">${pick}<div class="pl-custom row2"${hide}><input type="text" class="pl-label" data-dds-draft="prop-${id}-label-${ln}" placeholder="Line item, e.g. Website design" aria-label="Line item"><input type="number" step="0.01" class="pl-price" data-dds-draft="prop-${id}-price-${ln}" placeholder="Price (USD)" aria-label="Price in dollars" style="max-width:140px"></div></div>`;};
      const hint=hasCat?'':`<div class="mut" style="margin-top:8px"><a href="#" id="plManageHint">Add your services</a> to pick them from a list here.</div>`;
      host.innerHTML=`<div style="margin-top:8px">${hint}${rowHtml()}<div class="row2" style="margin-top:8px"><button type="button" class="btn ghost" id="plMore">＋ another line</button><span style="flex:1"></span><button type="button" class="btn ghost" id="plSave">Save draft</button><button type="button" class="btn" id="plSaveSend">Save & send →</button></div></div>`;
      const hintLink=$('plManageHint'); if(hintLink) hintLink.onclick=(e)=>{e.preventDefault();openManageServices();};
      // A service pick fills that line's name+price (still editable); "Custom…"
      // reveals the empty free fields; the placeholder option hides them again.
      const wirePick=(sel)=>{ if(!sel) return; const row=sel.closest('.prop-line'); const box=row.querySelector('.pl-custom'); const lab=row.querySelector('.pl-label'); const pr=row.querySelector('.pl-price');
        sel.onchange=()=>{ const v=sel.value;
          if(v===''){ box.style.display='none'; lab.value=''; pr.value=''; }
          else if(v==='__custom__'){ box.style.display=''; lab.value=''; pr.value=''; lab.focus(); }
          else { const s=SERVICES[+v]; if(s){ lab.value=s.name; pr.value=(s.price_cents/100); box.style.display=''; } }
        };
      };
      const wireRow=(row)=>wirePick(row&&row.querySelector('.pl-pick'));
      const restoreDrafts=()=>{if(window.ddsDraftRestore)host.querySelectorAll('[data-dds-draft]').forEach(el=>window.ddsDraftRestore(el));};
      // A restored draft (or a seeded first line) means real text lives in a hidden
      // field — reveal it and mark its dropdown "Custom…" so it isn't lost.
      const revealFilled=()=>host.querySelectorAll('.prop-line').forEach(row=>{const lab=row.querySelector('.pl-label');const box=row.querySelector('.pl-custom');const sel=row.querySelector('.pl-pick');if(lab&&lab.value&&box){box.style.display='';if(sel)sel.value='__custom__';}});
      host.querySelectorAll('.prop-line').forEach(wireRow);
      restoreDrafts();
      // Same idea as the agreement starter: a first proposal shouldn't open
      // blank. Only when the restored draft left the first line EMPTY — seed it
      // from the deal itself (title + expected value if set); fully editable,
      // and the price field's own placeholder stands in for [price].
      const l1=host.querySelector('.pl-label'), p1=host.querySelector('.pl-price');
      if(l1&&!l1.value&&d.title){ l1.value=d.title; if(p1&&!p1.value&&d.expected_value_cents)p1.value=(d.expected_value_cents/100); }
      revealFilled();
      $('plMore').onclick=()=>{$('plSave').closest('div').insertAdjacentHTML('beforebegin',rowHtml());const rowsEls=host.querySelectorAll('.prop-line');wireRow(rowsEls[rowsEls.length-1]);restoreDrafts();};
      const clearPropDrafts=()=>{if(window.ddsDraftClear)host.querySelectorAll('[data-dds-draft]').forEach(el=>window.ddsDraftClear(el));};
      const collectItems=()=>[...host.querySelectorAll('.prop-line')].map(r=>({label:r.querySelector('.pl-label').value.trim(),qty:1,unit_cents:Math.round(parseFloat(r.querySelector('.pl-price').value||'0')*100)})).filter(i=>i.label);
      // Save draft ONLY writes the record; Save & send writes then immediately
      // emails the review link — so the common path is one click and a proposal
      // is never left silently unsent.
      const savePropProposal=async()=>{const items=collectItems();if(!items.length){toast('Add at least one line item.',true);return null;}const r=await api('/sales/deals/'+id+'/proposals','POST',{line_items:items});clearPropDrafts();return r.data&&r.data.id;};
      const busyProp=(x)=>{$('plSave').disabled=x;$('plSaveSend').disabled=x;};
      $('plSave').onclick=async()=>{busyProp(true);try{const pid=await savePropProposal();if(!pid){busyProp(false);return;}toast('Proposal saved as a draft — send it when you’re ready.');openDeal(id);}catch(e){toast(nice(e),true);busyProp(false);}};
      $('plSaveSend').onclick=async()=>{busyProp(true);try{const pid=await savePropProposal();if(!pid){busyProp(false);return;}await sendProposalById(pid);}catch(e){toast(nice(e),true);busyProp(false);}};
      host.querySelector('.pl-label').focus();
    };
    const addCon=$('addCon'); if(addCon) addCon.onclick=()=>{
      // Write the draft record; return its id so "Save & send" can email it next.
      const saveCon=async(v)=>{if(!v.body)throw new Error('Add the agreement text.');const r=await api('/sales/deals/'+id+'/contracts','POST',{title:v.title,body:v.body});return r.data&&r.data.id;};
      miniForm($('conForm'),[{name:'title',label:'Title',placeholder:'Service agreement'},{name:'body',label:'Agreement text',type:'textarea',placeholder:'The terms of our engagement…',draft:'con-'+id}],
        async(v)=>{await saveCon(v);toast('Agreement saved as a draft — send it when you’re ready.');openDeal(id);},
        {saveLabel:'Save draft',alt:{label:'Save & send for signature →',run:async(v)=>{const cid=await saveCon(v);await sendContractById(cid);}}});
      // A first agreement shouldn't open as a blank page. Precedence: a restored
      // draft wins (ddsDraftRestore already ran inside miniForm); the template
      // “Use …” buttons never open this form at all (they draft server-side); the
      // starter below fills ONLY a still-empty body — and stays fully editable.
      const f=$('conForm'); const titleEl=f.querySelector('input'); const bodyEl=f.querySelector('textarea');
      if(bodyEl&&!bodyEl.value){
        const who=((c&&c.name)||d.title||'').trim();
        if(titleEl&&!titleEl.value)titleEl.value=who?('Service agreement — '+who):'Service agreement';
        const accepted=(data.proposals||[]).find(p=>p.status==='accepted');
        bodyEl.style.minHeight='260px'; // the starter is a full page — let it breathe
        bizName().then(biz=>{ if(!bodyEl.value) bodyEl.value=starterAgreement(d,c,accepted,biz); });
      }
    };
    // saved templates: one-tap draft-from-template + save-as-template
    $('detailInner').querySelectorAll('[data-use-ptpl]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/sales/deals/'+id+'/proposals','POST',{template_id:b.dataset.usePtpl});toast('Proposal drafted from your template');openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    $('detailInner').querySelectorAll('[data-use-ctpl]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/sales/deals/'+id+'/contracts','POST',{template_id:b.dataset.useCtpl});toast('Agreement drafted from your template');openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    $('detailInner').querySelectorAll('[data-tpl-prop]').forEach(b=>b.onclick=()=>miniForm($('propForm'),[{name:'name',label:'Template name',placeholder:'e.g. Standard website package'}],async(v)=>{if(!v.name){toast('Give the template a name.',true);return;}await api('/sales/templates','POST',{kind:'proposal',name:v.name,from_proposal_id:b.dataset.tplProp});toast('Saved — it’ll appear on every deal.');openDeal(id);}));
    $('detailInner').querySelectorAll('[data-tpl-con]').forEach(b=>b.onclick=()=>miniForm($('conForm'),[{name:'name',label:'Template name',placeholder:'e.g. Standard service agreement'}],async(v)=>{if(!v.name){toast('Give the template a name.',true);return;}await api('/sales/templates','POST',{kind:'contract',name:v.name,from_contract_id:b.dataset.tplCon});toast('Saved — it’ll appear on every deal.');openDeal(id);}));
    // a saved template can be retired right where it's offered (deals already drafted from it are untouched)
    $('detailInner').querySelectorAll('[data-del-tpl]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this saved template? Proposals and agreements already drafted from it are untouched.'))return;b.disabled=true;try{await api('/sales/templates/'+b.dataset.delTpl,'DELETE');toast('Template removed');openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    // ONE sender for both kinds; understands the server's honesty guard: if an
    // OPEN invoice exists at a different amount, offer "resend that one" or
    // "send another" (force) — never a silent surprise.
    async function sendMoney(body){
      try{
        const r=await api('/sales/deals/'+id+'/invoice','POST',body);
        const label=body.purpose==='deposit'?'Deposit request':'Invoice';
        toast((r.reused?label+' re-sent ('+money(r.amount_cents)+')':label+' sent')+(r.emailed?' — emailed to the client':(r.url?' — link copied':'')));
        if(r.url&&navigator.clipboard)navigator.clipboard.writeText(r.url).catch(()=>{});
        openDeal(id);
      }catch(e){
        if(e.status===409&&e.body&&e.body.error==='amount_mismatch'){
          const open=e.body.open_invoice||{};
          $('invForm').innerHTML=`<div class="mut" style="margin:8px 0" role="alert">${esc(e.body.message||'An open one already exists.')} <span class="mut">If you send another, both links stay payable until one is paid.</span></div>
            <div class="row2"><button class="btn ghost" id="resendOpen">Resend the ${money(open.amount_cents)||'previous'} link</button>
            <button class="btn ghost" id="forceNew">Send another for the new amount</button></div>`;
          $('resendOpen').focus();
          // Resend passes the OPEN amount explicitly (an ad-hoc deposit may have no
          // accepted proposal to default from); both buttons guard the double-click.
          const arm=(id,fn)=>{const b=$(id);b.onclick=()=>{$('resendOpen').disabled=true;$('forceNew').disabled=true;fn();};};
          arm('resendOpen',()=>sendMoney({purpose:body.purpose,amount_cents:Number(open.amount_cents)||undefined,title:open.title||undefined}));
          arm('forceNew',()=>sendMoney({...body,force:true}));
          return;
        }
        toast(nice(e),true);
      }
    }
    const sendInv=$('sendInvoice'); if(sendInv) sendInv.onclick=()=>miniForm($('invForm'),[{name:'amount',label:'Amount (USD) — leave blank to use the accepted proposal',type:'number',step:'0.01',placeholder:'2500'}],async(v)=>{const body={purpose:'service'};if(v.amount)body.amount_cents=Math.round(parseFloat(v.amount)*100);await sendMoney(body);});
    $('detailInner').querySelectorAll('[data-copy-pay]').forEach(b=>b.onclick=()=>{
      const url=b.dataset.copyPay;
      const fallback=()=>{const i=document.createElement('input');i.value=url;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast('Payment link copied');}catch(_){toast('Couldn’t copy on this device — use the Copy link button in the invoice list, or the email has the same link.',true);}i.remove();};
      if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Payment link copied')).catch(fallback);else fallback();
    });
    const sendDep=$('sendDeposit'); if(sendDep) sendDep.onclick=()=>miniForm($('invForm'),[{name:'amount',label:'Deposit amount (USD)',type:'number',step:'0.01',placeholder:'500'}],async(v)=>{if(!v.amount){toast('Enter a deposit amount.',true);return;}await sendMoney({purpose:'deposit',amount_cents:Math.round(parseFloat(v.amount)*100),title:'Deposit'});});
    // Per-stage send/resend — bill ONE invoice (e.g. the balance now the milestone
    // is reached). Reuses /sales/invoices/:id/send (the single-invoice primitives).
    $('detailInner').querySelectorAll('[data-send-inv]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await api('/sales/invoices/'+b.dataset.sendInv+'/send','POST',{});toast((r.resent?'Re-sent':'Sent')+(r.emailed?' — emailed to the client':(r.url?' — link copied':'')));if(r.url&&navigator.clipboard)navigator.clipboard.writeText(r.url).catch(()=>{});openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    // Payment schedule builder: deposit + balance, or N installments. Previews the
    // staged invoices (labels · due dates · amounts · running total = deal total),
    // then mints them via /sales/deals/:id/schedule. The client math mirrors the
    // pure server builder (remainder-on-last); the server re-validates on create.
    const setupPlanBtn=$('setupPlan'); if(setupPlanBtn) setupPlanBtn.onclick=()=>{
      const host=$('invForm');
      const acceptedProp=(data.proposals||[]).find(p=>p.status==='accepted');
      const totalCents=(acceptedProp&&acceptedProp.subtotal_cents)||d.expected_value_cents||0;
      if(!totalCents){host.innerHTML='<div class="mut" style="margin-top:8px">Set the deal value (in Details) or accept a proposal first — a plan needs a total to split.</div>';return;}
      const addDays=(iso,days)=>{const p=iso.split('-').map(Number);const t=Date.UTC(p[0],p[1]-1,p[2])+days*86400000;const x=new Date(t);const z=n=>String(n).padStart(2,'0');return x.getUTCFullYear()+'-'+z(x.getUTCMonth()+1)+'-'+z(x.getUTCDate());};
      const computeStages=(spec)=>{
        if(spec.mode==='installments'){const n=spec.count;const per=Math.floor(totalCents/n);const out=[];for(let i=0;i<n;i++){const last=i===n-1;out.push({label:'Payment '+(i+1)+' of '+n,amount_cents:last?totalCents-per*(n-1):per,due_date:spec.first_due?addDays(spec.first_due,(spec.every||0)*i):null,purpose:'service'});}return out;}
        const dep=spec.deposit_type==='percent'?Math.round(totalCents*spec.deposit_value/100):Math.round(spec.deposit_value*100);
        return [{label:'Deposit',amount_cents:dep,due_date:spec.deposit_due||null,purpose:'deposit'},{label:'Balance',amount_cents:totalCents-dep,due_date:spec.balance_due||null,purpose:'service'}];
      };
      host.innerHTML='<div style="margin-top:8px">'
        +'<div class="row2"><label><input type="radio" name="plkind" value="db" checked> Deposit + balance</label><label><input type="radio" name="plkind" value="inst"> Installments</label></div>'
        +'<div id="pl-db" style="margin-top:8px"><label class="mut">Deposit</label><div class="row2"><input type="number" id="pl-depval" step="0.01" min="0" value="50" style="max-width:120px"><select id="pl-depunit"><option value="percent">% of total</option><option value="amount">$ amount</option></select></div><label class="mut" style="display:block;margin-top:8px">Balance due (optional)</label><input type="date" id="pl-baldue"></div>'
        +'<div id="pl-inst" style="margin-top:8px;display:none"><label class="mut">Number of payments</label><br><input type="number" id="pl-count" min="2" max="12" value="3" style="max-width:90px"><label class="mut" style="display:block;margin-top:8px">First payment due</label><input type="date" id="pl-firstdue"><label class="mut" style="display:block;margin-top:8px">Then every (days)</label><br><input type="number" id="pl-every" min="0" value="30" style="max-width:90px"></div>'
        +'<div class="mut" style="margin-top:8px">Total to schedule: <strong>'+money(totalCents)+'</strong></div>'
        +'<div id="pl-preview" style="margin-top:8px"></div>'
        +'<div class="row2" style="margin-top:8px"><button type="button" class="btn" id="pl-create">Create the plan</button></div></div>';
      const gatherSpec=()=>{const kind=host.querySelector('input[name=plkind]:checked').value;if(kind==='inst')return {mode:'installments',count:Math.max(2,Math.min(12,parseInt($('pl-count').value||'0',10)||0)),first_due:$('pl-firstdue').value||null,every:parseInt($('pl-every').value||'0',10)||0};return {mode:'db',deposit_type:$('pl-depunit').value,deposit_value:parseFloat($('pl-depval').value||'0')||0,deposit_due:null,balance_due:$('pl-baldue').value||null};};
      const doPreview=()=>{let stages;try{stages=computeStages(gatherSpec());}catch(_){stages=[];}const sum=stages.reduce((a,b)=>a+(b.amount_cents||0),0);const okSum=sum===totalCents;const rowsH=stages.map(s=>'<div class="row2"><span class="mut">'+esc(s.label)+(s.due_date?' · due '+esc(s.due_date):' · due now')+'</span><span>'+money(s.amount_cents)+'</span></div>').join('');$('pl-preview').innerHTML=rowsH+'<div class="row2" style="border-top:1px solid var(--line,#ddd);margin-top:4px;padding-top:4px"><span class="mut">Running total</span><span style="font-weight:700;color:'+(okSum?'inherit':'var(--bad,#a3423a)')+'">'+money(sum)+' / '+money(totalCents)+'</span></div>';return stages;};
      const toggle=()=>{const inst=host.querySelector('input[name=plkind]:checked').value==='inst';$('pl-db').style.display=inst?'none':'';$('pl-inst').style.display=inst?'':'none';doPreview();};
      host.querySelectorAll('input[name=plkind]').forEach(r=>r.onchange=toggle);
      ['pl-depval','pl-depunit','pl-baldue','pl-count','pl-firstdue','pl-every'].forEach(idn=>{const el=$(idn);if(el)el.oninput=doPreview;});
      doPreview();
      $('pl-create').onclick=async()=>{const stages=doPreview();if(!stages.length){toast('Add plan details first.',true);return;}$('pl-create').disabled=true;try{const r=await api('/sales/deals/'+id+'/schedule','POST',{total_cents:totalCents,stages});toast('Payment plan created'+((r.data&&r.data.emailed)?' — the deposit was emailed to the client':((r.data&&r.data.linked)?' — deposit link ready to send':'')));openDeal(id);}catch(e){toast(nice(e),true);$('pl-create').disabled=false;}};
    };
    const conv=$('convert'); if(conv) conv.onclick=()=>{
      // two-step confirm (no confirm() dialog). Service language, not SaaS: the
      // labels say WHAT KIND OF WORK this is; the values stay the same edition
      // keys the convert route expects (CONVERT_PLANS in routes/sales.ts). Paying
      // for software is SELF-SERVE at signup — never picked here.
      const wrap=$('convWrap'); const signupLink=location.origin+'/pricing.html'; wrap.innerHTML=`
        <label for="convPlan">What kind of work is this?</label>
        <select id="convPlan"><option value="presence" selected>Their site will live on my platform (Studio OS)</option><option value="business_os_only">Building or redoing their site on another platform — they host it elsewhere</option><option value="business_os_only">Just their client workspace / business tools — no site work</option><option value="presence_monitor">Just monitoring a site they already have</option></select>
        <div class="mut" style="margin-top:6px">Adding them creates their client workspace and emails them a link to set their password and sign in. You bill them for your work the usual way — they never pay for software here. You can change this later.</div>
        <div id="convSignup" class="mut" style="margin-top:10px;padding:10px;border:1px solid var(--line,#ddd);border-radius:8px">If they’ll host with you, they choose and pay for their plan themselves — send them this to sign up:<div class="row2" style="margin-top:6px"><input id="convSignupLink" readonly value="${esc(signupLink)}" style="flex:1;padding:8px;border:1px solid var(--line,#ddd);border-radius:8px;font:inherit" aria-label="Sign-up link"><button type="button" class="btn ghost" id="convSignupCopy">Copy</button></div></div>
        <div class="row2" style="margin-top:10px"><button class="btn ghost" id="convNo">Cancel</button><button class="btn" id="convYes">Yes, add them as my customer</button></div>`;
      const syncSignup=()=>{const s=$('convSignup');if(s)s.style.display=($('convPlan').value==='presence')?'':'none';};
      $('convPlan').onchange=syncSignup; syncSignup();
      $('convSignupCopy').onclick=()=>{const el=$('convSignupLink');if(el&&el.value){copyToClip(el.value);toast('Sign-up link copied');}};
      $('convNo').onclick=()=>openDeal(id);
      $('convYes').onclick=async()=>{$('convYes').disabled=true;try{const plan=($('convPlan')&&$('convPlan').value)||'presence';const r=await api('/sales/deals/'+id+'/convert','POST',{plan});const x=r.data||{};toast('Converted — workspace + project ready'+(x.idempotent?' (already done)':(x.invited?', customer invited':'')));openDeal(id);load();}catch(e){toast(nice(e),true);$('convYes').disabled=false;}};
    };
  }catch(e){ $('detailInner').innerHTML='<div class="dbody mut">'+esc(nice(e))+'</div>'; }
}

(async function(){
  try{
    const {data}=await sb.auth.getSession();
    TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){ $('list').innerHTML='<p class="mut">Please <a href="/studio.html">sign in</a> to see your pipeline.</p>'; return; }
    renderFilters(); await load();
    const deep=new URLSearchParams(location.search).get('deal'); if(deep) openDeal(deep);
  }catch(_){ $('list').innerHTML='<p class="mut">We couldn’t load your pipeline just now.</p>'; }
})();
</script>
</body>
</html>
