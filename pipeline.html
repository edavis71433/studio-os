<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your sales pipeline — from first enquiry through onboarding.">
<!-- P2-C: Studio App sales pipeline on the ONE shared shell + shared state helpers. -->

<style>

<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--line:#eee9e0;--p:#5b3fa0}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--line:#2a2338;--p:#b79ceb}
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#171320}}
  :root[data-theme="dark"] .btn:not(.ghost){color:#171320}
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 80px}
  h1{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:4px}
  .sub{color:var(--soft);font-size:14px;margin-bottom:20px}
  /* the calm "your numbers" strip — plain numbers, tabular, no chart */
  .summary{margin-bottom:18px}
  .summary:empty{display:none}
  .sum-line{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--soft);font-variant-numeric:tabular-nums;line-height:1.75}
  .sum-line strong{color:var(--ink);font-weight:600}
  .sum-line .dot{color:var(--line);margin:0 5px}
  .sum-line .mut{color:var(--faint);font-size:12.5px}
  .sum-stages{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .sum-stages .sc{display:flex;flex-direction:column;gap:1px;padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);min-width:88px}
  .sum-stages .sc-l{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em}
  .sum-stages .sc-n{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
  .chip.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  .btn{font:inherit;font-size:13.5px;font-weight:600;border:none;border-radius:9px;padding:8px 14px;background:var(--p);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--warn)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .card:hover{border-color:var(--p)}
  .card .t{font-weight:600}
  .card .m{color:var(--soft);font-size:13px;margin-top:2px}
  .stage{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .stage.won{background:var(--good-soft);color:var(--good)}
  .stage.lost{background:transparent;border:1px solid var(--line);color:var(--soft)}
  .val{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px}
  dialog{border:none;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(27,21,37,.4)}
  .dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:start}
  .dbody{padding:18px 20px;max-height:64vh;overflow:auto}
  .sec{margin-top:16px}.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:8px}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  form.mini{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  form.mini .grid{display:flex;gap:8px;flex-wrap:wrap}
  input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  textarea{min-height:90px;resize:vertical}
  label{font-size:12.5px;color:var(--soft);display:block;margin:2px 0 3px}
  .mut{color:var(--soft);font-size:13px}
  .hrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--soft);padding:5px 0;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:none}
  .hrow .hd{white-space:nowrap;color:var(--faint);font-variant-numeric:tabular-nums}
  /* activity quick-log + merged timeline */
  .qlog{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);margin-bottom:12px}
  .qlog .kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .qlog .kb{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
  .qlog .kb.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  .qlog textarea{min-height:44px}
  .qlog .qrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .qlog .qrow input[type=date]{width:auto;flex:0 0 auto}
  .tl{list-style:none;padding:0;margin:6px 0 0}
  .tl-i{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .tl-i:last-child{border-bottom:none}
  .tl-ic{flex:0 0 auto;width:22px;text-align:center;line-height:1.5;color:var(--faint)}
  .tl-bd{flex:1;min-width:0}
  .tl-tx{font-size:13.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .tl-mt{font-size:12px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
  a{color:var(--p)}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}
  /* Path guidance — the calm "where you are · what to do next" line in the drawer */
  .path{display:flex;gap:8px;align-items:flex-start;background:var(--p-soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13px;line-height:1.5}
  .path-i{flex:0 0 auto}
  .path-tip{color:var(--ink)}
  .path-do{color:var(--p);font-weight:600}
  /* View toggle (List ⇄ Board) */
  .viewtog{display:inline-flex;gap:4px}
  /* Kanban board — columns = open stages, cards = deals, tap/drag to move */
  .board-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:2px 20px 6px}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;align-items:start}
  .col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:220px}
  .col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
  .col-t{font-weight:600;font-size:13.5px;flex:1}
  .col-n{font-size:12px;color:var(--faint);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
  .col-val{font-size:11.5px;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
  .col-tip{font-size:11.5px;margin-bottom:8px;line-height:1.4}
  .col-body{display:flex;flex-direction:column;gap:8px;min-height:40px;border-radius:8px;padding:2px;transition:background .12s}
  .col-body.drop-ok{outline:1px dashed var(--p);outline-offset:-2px}
  .col-body.drop-over{background:var(--p-soft)}
  .bempty{font-size:12px;text-align:center;padding:10px 4px;opacity:.7}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;position:relative}
  .bcard:hover{border-color:var(--p)}
  .bcard.dragging{opacity:.5}
  .bc-t{font-weight:600;font-size:13.5px;line-height:1.35}
  .bc-v{font-variant-numeric:tabular-nums;color:var(--soft);font-size:12.5px;margin-top:3px}
  .bc-m{color:var(--faint);font-size:12px;margin-top:3px}
  .bcard.is-stale{border-left:2px solid var(--warn,#775d31)}
  .bc-stale{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--warn,#775d31);background:rgba(154,107,18,.12);border-radius:999px;padding:1px 7px;margin-top:6px}
  .bc-due{color:var(--warn);font-weight:600;font-size:12px;margin-top:3px}
  .bc-actions{margin-top:8px;position:relative}
  .bc-move{font:inherit;font-size:12px;font-weight:600;color:var(--p);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer}
  .bc-move:hover{border-color:var(--p)}
  .bc-menu{position:absolute;left:0;top:calc(100% + 4px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column;min-width:170px}
  .bc-menu button{font:inherit;font-size:13px;text-align:left;background:transparent;border:none;color:var(--ink);padding:8px 10px;border-radius:7px;cursor:pointer}
  .bc-menu button:hover{background:var(--p-soft)}
  .board-foot{margin-top:12px;font-size:12.5px}

  /* ─────────────────────────────────────────────────────────────────────────
     FULL-SCREEN DEAL DETAIL — the deal opens as a roomy in-page page (same tab),
     not a cramped modal. It sits in normal document flow inside its own .wrap, so
     the page scrolls naturally. Everything below is SCOPED to #detailWrap /
     #detailInner so the pipeline list, board, and the other dialogs are untouched.
     ───────────────────────────────────────────────────────────────────────── */
  #detailWrap{max-width:1000px}
  #detailInner{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .backbar{padding:16px 20px 0}
  .backbar .btn{padding:8px 14px}
  #detailInner .dhead{padding:16px 22px 20px}
  #detailInner #dtitle{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;outline-offset:3px}
  #detailInner .dhead .mut{font-size:14px;margin-top:6px}
  /* it's a full page now — no inner scroll box; each section breathes as a card */
  #detailInner .dbody{padding:8px 22px 28px;max-height:none;overflow:visible}
  #detailInner .sec{margin:0 0 16px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  #detailInner .sec:last-child{margin-bottom:0}
  #detailInner .sec h3{font-family:var(--serif);font-weight:500;font-size:18px;text-transform:none;letter-spacing:normal;color:var(--ink);margin-bottom:12px}
  /* the inline mini-forms + quick-log sit on the card surface for contrast */
  #detailInner form.mini{background:var(--card)}
  @media(max-width:560px){#detailInner .dhead,#detailInner .dbody{padding-left:16px;padding-right:16px}#detailInner #dtitle{font-size:24px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>

</head>
<body>
<div class="wrap" id="listWrap">
  <h1>Pipeline</h1>
  <div class="sub">From first enquiry through onboarding — one deal at a time.</div>
  <div class="summary" id="summary" aria-live="polite"></div>
  <div class="bar" id="filters" role="tablist" aria-label="Filter by stage"></div>
  <div class="bar"><button class="btn" id="newDeal">+ New deal</button><span class="spacer"></span><div class="viewtog" role="tablist" aria-label="View"><button class="chip on" id="viewList" role="tab" aria-selected="true">List</button><button class="chip" id="viewBoard" role="tab" aria-selected="false">Board</button></div></div>
  <div id="list" aria-live="polite"></div>
  <div id="board" aria-live="polite" hidden></div>
</div>

<!-- FIX: the deal detail opens as a FULL-SCREEN in-page view (same tab), not a
     cramped left-side modal overlay — matching the delivery view's full-screen
     page. The list and the detail are two panels of the ONE page; only one shows
     at a time (showDetail/hideDetail swap them). -->
<div class="wrap" id="detailWrap" hidden><div id="detailInner"></div></div>

<dialog id="formDlg" aria-label="New deal">
  <form id="dealForm" class="dbody" style="max-height:none">
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:12px">New deal</div>
    <label for="f-title">Deal title</label>
    <input id="f-title" required maxlength="200" placeholder="e.g. Acme website" autocomplete="off">
    <label for="f-email" style="margin-top:10px">Client email <span class="mut">(optional — enables their login on convert)</span></label>
    <input id="f-email" type="email" maxlength="160" placeholder="name@business.com" autocomplete="off">
    <label for="f-name" style="margin-top:10px">Client name <span class="mut">(optional)</span></label>
    <input id="f-name" maxlength="120" placeholder="Jane Doe" autocomplete="off">
    <label for="f-phone" style="margin-top:10px">Phone <span class="mut">(optional)</span></label>
    <input id="f-phone" maxlength="40" placeholder="(555) 123-4567" autocomplete="off">
    <div class="row2" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn ghost" id="f-cancel">Cancel</button><button type="submit" class="btn">Create deal</button></div>
  </form>
</dialog>

<dialog id="svcDlg" aria-label="Manage your services">
  <div class="dbody" style="max-height:70vh">
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:4px">Your services and prices</div>
    <div class="mut" style="margin-bottom:12px">Used to fill proposals fast. Change these any time.</div>
    <div id="svcRows"></div>
    <div class="row2" style="margin-top:10px"><button type="button" class="btn ghost" id="svcAdd">＋ Add a service</button></div>
    <div class="row2" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn ghost" id="svcCancel">Cancel</button><button type="button" class="btn" id="svcSave">Save</button></div>
  </div>
</dialog>

<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scope=()=>new URLSearchParams(location.search).get('client')||'';
// EMBED: this page is hosted inside the unified Client Record's Deal tab (?embed=1).
// The shell chrome + list are hidden by CSS; internal "open the project" links are
// forwarded to the parent record so they switch tabs instead of navigating the iframe.
const EMBED=new URLSearchParams(location.search).get('embed')==='1';
if(EMBED)document.addEventListener('click',(e)=>{const a=e.target&&e.target.closest&&e.target.closest('a[href]');if(!a)return;const href=a.getAttribute('href')||'';if(/^\/projects\.html/.test(href)){e.preventDefault();try{window.parent.postMessage({type:'dds-open-delivery'},location.origin);}catch(_){}}});
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':scope()});
const money=(c)=>c?('$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:0})):'';
const money0=(c)=>'$'+((c||0)/100).toLocaleString(undefined,{minimumFractionDigits:0});
// A proposal's optional discount/tax + revise trail ride ONE reserved element in
// its line_items (see lib/sales_lifecycle.ts). Split it out and mirror the pure
// computeProposalTotals so the drawer's total/breakdown match the document + the
// client's public view exactly (subtotal − discount + tax, never negative).
const PROP_META='__meta__';
const splitPropLI=(raw)=>{const a=Array.isArray(raw)?raw:[];const items=a.filter(el=>!(el&&typeof el==='object'&&PROP_META in el));const me=a.find(el=>el&&typeof el==='object'&&PROP_META in el);return{items,meta:(me&&me[PROP_META])||{}};};
const propTotals=(raw)=>{const {items,meta}=splitPropLI(raw);const sub=items.reduce((n,i)=>n+Math.max(0,Math.trunc(i.qty)||0)*Math.max(0,Math.trunc(i.unit_cents)||0),0);let disc=0;if(meta.discount){disc=meta.discount.mode==='percent'?Math.round(sub*Math.min(100,Math.max(0,meta.discount.value))/100):Math.trunc(meta.discount.value);}disc=Math.max(0,Math.min(disc,sub));const post=sub-disc;const tp=(meta.tax_pct!=null&&isFinite(+meta.tax_pct))?Math.min(100,Math.max(0,+meta.tax_pct)):0;const tax=Math.round(post*tp/100);return{items,meta,subtotal:sub,discount:disc,tax:tax,total:Math.max(0,post+tax)};};
const STAGES=['lead','qualified','proposal','contract','won','lost'];
// calm, human stage labels (the raw enum never reaches the owner's eyes)
const STAGE_LABEL={lead:'New lead',qualified:'Qualified',proposal:'Proposal sent',contract:'Agreement out',won:'Won',lost:'Not a fit'};
const stageLabel=(s)=>STAGE_LABEL[s]||s;
// The badge reads as an OUTCOME where one exists: a converted deal is "Won ✓"
// (calm green), a lost one is a muted "Lost" — active stages keep their labels.
const stageBadge=(s,signed)=>{
  // A signed agreement reads as its own positive state — never the stale "Agreement out".
  if(s==='contract'&&signed)return `<span class="stage won">Agreement signed ✓</span>`;
  return `<span class="stage${s==='won'?' won':s==='lost'?' lost':''}">${s==='won'?'Won ✓':s==='lost'?'Lost':esc(stageLabel(s))}</span>`;
};
// Per-stage "Path" guidance — the calm one-line tip + suggested next action, so
// a non-technical owner always knows what to do next. Mirrors the source of
// truth in lib/pipeline_guidance.ts (which the test imports).
const PIPELINE_GUIDANCE={
  lead:{tip:'A new enquiry — reach out while they’re still interested.',action:'Get in touch and learn what they need'},
  qualified:{tip:'They’re a fit. Show them what working together looks like.',action:'Send a proposal they can accept online'},
  proposal:{tip:'Your proposal is with them — a gentle nudge often seals it.',action:'Follow up, then send the agreement once they say yes'},
  contract:{tip:'Agreement’s out — once they sign, they can pay right away.',action:'Get it signed, then request the deposit'},
  won:{tip:'They’re your customer now. Time to do great work.',action:'Open their project and kick things off'},
  lost:{tip:'Not every deal fits — the door stays open for later.',action:'Keep the relationship warm; reopen if things change'},
};
const guidanceFor=(s)=>PIPELINE_GUIDANCE[s]||PIPELINE_GUIDANCE.lead;
// The Kanban board's open-stage columns (won/lost are OUTCOMES, not columns —
// exactly like the summary's OPEN_STAGES).
const BOARD_STAGES=['lead','qualified','proposal','contract'];
// The stages a deal may be MOVED to on the board — mirrors canTransition in
// lib/sales_lifecycle.ts (forward one · back one · →lost; never →won, which is
// convert-only). The server re-checks canTransition on every stage POST.
const BOARD_NEXT={lead:['qualified','lost'],qualified:['proposal','lead','lost'],proposal:['contract','qualified','lost'],contract:['proposal','lost'],won:[],lost:['lead']};
const boardMoveTargets=(from)=>(BOARD_NEXT[from]||[]).filter(s=>s!=='won');
const boardCanMove=(from,to)=>from!==to&&to!=='won'&&(BOARD_NEXT[from]||[]).includes(to);
// calm, human labels for the deal's history strip (the raw event kinds stay backstage)
const EVT_LABEL={created:'Deal created',stage_change:'Moved stage',note:'Note added',proposal_sent:'Proposal sent',proposal_decided:'Proposal decision',contract_sent:'Agreement sent',contract_signed:'Agreement signed',invoice_sent:'Invoice sent',invoice_paid:'Invoice paid',converted:'Converted to project'};
function evtLabel(e){

// ── Kanban board: columns = open stages, cards = deals (name · value · last
// contacted). A card opens the same drawer the list uses; moving a card calls
// the SAME /sales/deals/:id/stage endpoint and only offers canTransition-allowed
// targets (tap-to-move menu = the primary, accessible path; drag is additive).
function boardCard(d,today){
  const val=money(d.expected_value_cents);
  const lc=d.last_contacted_at?`Last contacted ${esc(ago(d.last_contacted_at))}`:'';
  const due=(d.next_step&&d.next_step_at&&d.next_step_at<=today)?`<div class="bc-due">Due: ${esc(d.next_step)}</div>`:'';
  // Stalled: no contact in 30+ days (a card the system nudges you about instead of
  // relying on memory). Never-contacted brand-new deals don't flag — avoids noise.
  const stale=d.last_contacted_at&&((Date.now()-Date.parse(d.last_contacted_at))/86400000>=30);
  const staleBadge=stale?`<span class="bc-stale" title="No contact in 30+ days — worth a nudge">⏳ Stalled</span>`:'';
  const canMove=boardMoveTargets(d.stage).length>0;
  const moveBtn=canMove?`<button class="bc-move" data-move="${d.id}" aria-haspopup="menu" aria-expanded="false" title="Move this deal to another stage">Move →</button>`:'';
  return `<article class="bcard${stale?' is-stale':''}" draggable="true" tabindex="0" role="button" aria-label="${esc(d.title||'Untitled deal')} — ${esc(stageLabel(d.stage))}${stale?' — stalled':''}" data-id="${d.id}" data-stage="${d.stage}"><div class="bc-t">${esc(d.title||'Untitled deal')}</div>${val?`<div class="bc-v">${val}</div>`:''}${due||(lc?`<div class="bc-m">${lc}</div>`:'')}${staleBadge}<div class="bc-actions">${moveBtn}</div></article>`;
}
function renderBoard(){
  const host=$('board');

  const open=DEALS.filter(d=>BOARD_STAGES.includes(d.stage)&&!d.converted_client_id);
  const cols=BOARD_STAGES.map(stg=>{
    const ds=open.filter(d=>d.stage===stg);
    const sum=ds.reduce((a,d)=>a+(d.expected_value_cents||0),0);   // per-column total value (pipeline health at a glance)
    const cards=ds.map(d=>boardCard(d,today)).join('')||'<div class="bempty mut">Nothing here yet</div>';
    return `<section class="col" aria-label="${esc(stageLabel(stg))} column"><header class="col-h"><span class="col-t">${esc(stageLabel(stg))}</span><span class="col-n">${ds.length}</span>${sum?`<span class="col-val">${money(sum)}</span>`:''}</header><div class="col-tip mut">${esc(guidanceFor(stg).action)}</div><div class="col-body" data-drop="${stg}">${cards}</div></section>`;
  }).join('');

function wireBoard(){
  const host=$('board');
  const move=async(id,to)=>{try{await api('/sales/deals/'+id+'/stage','POST',{to});toast('Moved to '+stageLabel(to));load();if(!$('detailWrap').hidden&&CURRENT_DEAL===id)openDeal(id);}catch(e){toast(nice(e),true);}};
  host.querySelectorAll('.bcard').forEach(c=>{
    const isCtrl=(e)=>e&&e.target&&e.target.closest&&e.target.closest('.bc-move,.bc-menu');
    c.onclick=(e)=>{if(!isCtrl(e))openDeal(c.dataset.id);};
    c.onkeydown=(e)=>{if((e.key==='Enter'||e.key===' ')&&!isCtrl(e)){e.preventDefault();openDeal(c.dataset.id);}};
    c.ondragstart=(e)=>{DRAG={id:c.dataset.id,from:c.dataset.stage};c.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.id);}catch(_){}}
      host.querySelectorAll('.col-body').forEach(b=>{if(boardCanMove(c.dataset.stage,b.dataset.drop))b.classList.add('drop-ok');});};
    c.ondragend=()=>{c.classList.remove('dragging');host.querySelectorAll('.col-body').forEach(b=>b.classList.remove('drop-ok','drop-over'));DRAG=null;};
  });
  // Tap-to-move menu — the accessible, mobile-friendly primary interaction.
  host.querySelectorAll('.bc-move').forEach(btn=>btn.onclick=(e)=>{
    e.stopPropagation();
    const card=btn.closest('.bcard'); const already=card.querySelector('.bc-menu');
    host.querySelectorAll('.bc-menu').forEach(m=>m.remove());
    host.querySelectorAll('.bc-move').forEach(b=>b.setAttribute('aria-expanded','false'));
    if(already) return;   // second tap closes it
    btn.setAttribute('aria-expanded','true');
    const menu=document.createElement('div'); menu.className='bc-menu'; menu.setAttribute('role','menu');
    menu.innerHTML=boardMoveTargets(card.dataset.stage).map(t=>`<button type="button" role="menuitem" data-to="${t}">${t==='lost'?'Mark as not a fit':'Move to '+esc(stageLabel(t))}</button>`).join('');
    card.querySelector('.bc-actions').appendChild(menu);
    menu.querySelectorAll('button').forEach(mb=>mb.onclick=(ev)=>{ev.stopPropagation();move(card.dataset.id,mb.dataset.to);});
  });
  // Drop targets — only accept a move canTransition allows; a disallowed drop is
  // gently refused (and the column never lights up as droppable in the first place).
  host.querySelectorAll('.col-body').forEach(body=>{
    body.ondragover=(e)=>{if(DRAG&&boardCanMove(DRAG.from,body.dataset.drop)){e.preventDefault();body.classList.add('drop-over');}};
    body.ondragleave=()=>body.classList.remove('drop-over');
    body.ondrop=(e)=>{e.preventDefault();body.classList.remove('drop-over');if(!DRAG)return;const to=body.dataset.drop,from=DRAG.from,id=DRAG.id;if(from===to)return;if(!boardCanMove(from,to)){toast('That deal can’t skip straight to '+stageLabel(to)+'.',true);return;}move(id,to);};
  });
}

    // Retainer: ONE calm toggle — amount + monthly/annual, then the client
    // authorizes via Stripe (nothing charges until they do). NOT a plan-builder.
    const setupRet=$('setupRetainer'); if(setupRet) setupRet.onclick=()=>{const host=$('retForm');host.innerHTML='<div class="mini" style="margin-top:8px"><label class="mut" for="ret-amt">Amount (USD)</label><div class="row2" style="margin-top:2px"><input id="ret-amt" type="number" step="0.01" min="1" placeholder="500" style="max-width:140px"><select id="ret-int" aria-label="Billing frequency"><option value="month">Every month</option><option value="year">Every year</option></select></div><div class="row2" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost" id="ret-cancel" type="button">Cancel</button><button class="btn" id="ret-go" type="button">Start retainer</button></div></div>';$('ret-cancel').onclick=()=>host.innerHTML='';setTimeout(()=>{const a=$('ret-amt');if(a)a.focus();},20);$('ret-go').onclick=async()=>{const a=parseFloat($('ret-amt').value||'0');if(!a||a<1){toast('Enter a retainer amount of at least $1.',true);return;}$('ret-go').disabled=true;try{const r=await api('/sales/deals/'+id+'/retainer','POST',{amount_cents:Math.round(a*100),interval:$('ret-int').value||'month'});const x=r.data||{};toast(x.emailed?'Retainer set up — the authorization link was emailed to the client':'Retainer set up — copy the authorization link to send it');if(x.url&&!x.emailed&&navigator.clipboard)navigator.clipboard.writeText(x.url).catch(()=>{});openDeal(id);}catch(e){toast(nice(e),true);$('ret-go').disabled=false;}};};
    const cancelRet=$('cancelRetainer'); if(cancelRet) cancelRet.onclick=async()=>{if(!confirm('Cancel this retainer? Future charges stop. Past payments are unaffected.'))return;cancelRet.disabled=true;try{await api('/sales/deals/'+id+'/retainer/cancel','POST',{});toast('Retainer canceled — future billing stopped');openDeal(id);}catch(e){toast(nice(e),true);cancelRet.disabled=false;}};
    // Renewal/expiry date on a SIGNED agreement → the owner gets one calm reminder
    // ~30 and ~7 days before it ends (never an auto-renew).
    $('detailInner').querySelectorAll('[data-set-term]').forEach(b=>b.onclick=async()=>{const cid=b.dataset.setTerm;const inp=$('con-term-'+cid);const val=(inp&&inp.value)||'';b.disabled=true;try{await api('/sales/contracts/'+cid+'/term','POST',{term_end:val||null});toast(val?'Renewal reminder set':'Renewal date cleared');openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    $('detailInner').querySelectorAll('[data-copy-pay]').forEach(b=>b.onclick=()=>{
      const url=b.dataset.copyPay;
      const fallback=()=>{const i=document.createElement('input');i.value=url;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast('Payment link copied');}catch(_){toast('Couldn’t copy on this device — use the Copy link button in the invoice list, or the email has the same link.',true);}i.remove();};
      if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Payment link copied')).catch(fallback);else fallback();
    });
    const sendDep=$('sendDeposit'); if(sendDep) sendDep.onclick=()=>miniForm($('invForm'),[{name:'amount',label:'Deposit amount (USD)',type:'number',step:'0.01',placeholder:'500'}],async(v)=>{if(!v.amount){toast('Enter a deposit amount.',true);return;}await sendMoney({purpose:'deposit',amount_cents:Math.round(parseFloat(v.amount)*100),title:'Deposit'});});
    // Per-stage send/resend — bill ONE invoice (e.g. the balance now the milestone
    // is reached). Reuses /sales/invoices/:id/send (the single-invoice primitives).
    $('detailInner').querySelectorAll('[data-send-inv]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await api('/sales/invoices/'+b.dataset.sendInv+'/send','POST',{});toast((r.resent?'Re-sent':'Sent')+(r.emailed?' — emailed to the client':(r.url?' — link copied':'')));if(r.url&&navigator.clipboard)navigator.clipboard.writeText(r.url).catch(()=>{});openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    // Payment schedule builder: deposit + balance, or N installments. Previews the
    // staged invoices (labels · due dates · amounts · running total = deal total),
    // then mints them via /sales/deals/:id/schedule. The client math mirrors the
    // pure server builder (remainder-on-last); the server re-validates on create.
    const setupPlanBtn=$('setupPlan'); if(setupPlanBtn) setupPlanBtn.onclick=()=>{
      const host=$('invForm');
      const acceptedProp=(data.proposals||[]).find(p=>p.status==='accepted');
      const totalCents=(acceptedProp&&propTotals(acceptedProp.line_items).total)||d.expected_value_cents||0;
      if(!totalCents){host.innerHTML='<div class="mut" style="margin-top:8px">Set the deal value (in Details) or accept a proposal first — a plan needs a total to split.</div>';return;}
      const addDays=(iso,days)=>{const p=iso.split('-').map(Number);const t=Date.UTC(p[0],p[1]-1,p[2])+days*86400000;const x=new Date(t);const z=n=>String(n).padStart(2,'0');return x.getUTCFullYear()+'-'+z(x.getUTCMonth()+1)+'-'+z(x.getUTCDate());};
      const computeStages=(spec)=>{
        if(spec.mode==='installments'){const n=spec.count;const per=Math.floor(totalCents/n);const out=[];for(let i=0;i<n;i++){const last=i===n-1;out.push({label:'Payment '+(i+1)+' of '+n,amount_cents:last?totalCents-per*(n-1):per,due_date:spec.first_due?addDays(spec.first_due,(spec.every||0)*i):null,purpose:'service'});}return out;}
        const dep=spec.deposit_type==='percent'?Math.round(totalCents*spec.deposit_value/100):Math.round(spec.deposit_value*100);
        return [{label:'Deposit',amount_cents:dep,due_date:spec.deposit_due||null,purpose:'deposit'},{label:'Balance',amount_cents:totalCents-dep,due_date:spec.balance_due||null,purpose:'service'}];
      };
      host.innerHTML='<div style="margin-top:8px">'
        +'<div class="row2"><label><input type="radio" name="plkind" value="db" checked> Deposit + balance</label><label><input type="radio" name="plkind" value="inst"> Installments</label></div>'
        +'<div id="pl-db" style="margin-top:8px"><label class="mut">Deposit</label><div class="row2"><input type="number" id="pl-depval" step="0.01" min="0" value="50" style="max-width:120px"><select id="pl-depunit"><option value="percent">% of total</option><option value="amount">$ amount</option></select></div><label class="mut" style="display:block;margin-top:8px">Balance due (optional)</label><input type="date" id="pl-baldue"></div>'
        +'<div id="pl-inst" style="margin-top:8px;display:none"><label class="mut">Number of payments</label><br><input type="number" id="pl-count" min="2" max="12" value="3" style="max-width:90px"><label class="mut" style="display:block;margin-top:8px">First payment due</label><input type="date" id="pl-firstdue"><label class="mut" style="display:block;margin-top:8px">Then every (days)</label><br><input type="number" id="pl-every" min="0" value="30" style="max-width:90px"></div>'
        +'<div class="mut" style="margin-top:8px">Total to schedule: <strong>'+money(totalCents)+'</strong></div>'
        +'<div id="pl-preview" style="margin-top:8px"></div>'
        +'<div class="row2" style="margin-top:8px"><button type="button" class="btn" id="pl-create">Create the plan</button></div></div>';
      const gatherSpec=()=>{const kind=host.querySelector('input[name=plkind]:checked').value;if(kind==='inst')return {mode:'installments',count:Math.max(2,Math.min(12,parseInt($('pl-count').value||'0',10)||0)),first_due:$('pl-firstdue').value||null,every:parseInt($('pl-every').value||'0',10)||0};return {mode:'db',deposit_type:$('pl-depunit').value,deposit_value:parseFloat($('pl-depval').value||'0')||0,deposit_due:null,balance_due:$('pl-baldue').value||null};};
      const doPreview=()=>{let stages;try{stages=computeStages(gatherSpec());}catch(_){stages=[];}const sum=stages.reduce((a,b)=>a+(b.amount_cents||0),0);const okSum=sum===totalCents;const rowsH=stages.map(s=>'<div class="row2"><span class="mut">'+esc(s.label)+(s.due_date?' · due '+esc(s.due_date):' · due now')+'</span><span>'+money(s.amount_cents)+'</span></div>').join('');$('pl-preview').innerHTML=rowsH+'<div class="row2" style="border-top:1px solid var(--line,#ddd);margin-top:4px;padding-top:4px"><span class="mut">Running total</span><span style="font-weight:700;color:'+(okSum?'inherit':'var(--bad,#a3423a)')+'">'+money(sum)+' / '+money(totalCents)+'</span></div>';return stages;};
      const toggle=()=>{const inst=host.querySelector('input[name=plkind]:checked').value==='inst';$('pl-db').style.display=inst?'none':'';$('pl-inst').style.display=inst?'':'none';doPreview();};
      host.querySelectorAll('input[name=plkind]').forEach(r=>r.onchange=toggle);
      ['pl-depval','pl-depunit','pl-baldue','pl-count','pl-firstdue','pl-every'].forEach(idn=>{const el=$(idn);if(el)el.oninput=doPreview;});
      doPreview();
      $('pl-create').onclick=async()=>{const stages=doPreview();if(!stages.length){toast('Add plan details first.',true);return;}$('pl-create').disabled=true;try{const r=await api('/sales/deals/'+id+'/schedule','POST',{total_cents:totalCents,stages});toast('Payment plan created'+((r.data&&r.data.emailed)?' — the deposit was emailed to the client':((r.data&&r.data.linked)?' — deposit link ready to send':'')));openDeal(id);}catch(e){toast(nice(e),true);$('pl-create').disabled=false;}};
    };
    const conv=$('convert'); if(conv) conv.onclick=()=>{
      // two-step confirm (no confirm() dialog). Service language, not SaaS: the
      // labels say WHAT KIND OF WORK this is; the values stay the same edition
      // keys the convert route expects (CONVERT_PLANS in routes/sales.ts). Paying
      // for software is SELF-SERVE at signup — never picked here.
      const wrap=$('convWrap'); wrap.innerHTML=`
        <label for="convPlan">What kind of work is this?</label>
        <select id="convPlan"><option value="presence" selected>I’m building them a new site — hosted with me</option><option value="business_os_only">They keep their site on their own platform — I do the rest</option><option value="presence_monitor">Just monitoring a site they already have</option></select>
        <div class="mut" style="margin-top:6px">Adding them creates their <strong>client portal</strong> and emails them a link to set their password and sign in — that’s where they work with you: files, approvals, messages, invoices. You bill them for your work the usual way — they never pay for software here. You can change this later.</div>
        <div class="row2" style="margin-top:10px"><button class="btn ghost" id="convNo">Cancel</button><button class="btn" id="convYes">Yes, add them as my customer</button></div>`;
      $('convNo').onclick=()=>openDeal(id);
      $('convYes').onclick=async()=>{$('convYes').disabled=true;try{const plan=($('convPlan')&&$('convPlan').value)||'presence';const r=await api('/sales/deals/'+id+'/convert','POST',{plan});const x=r.data||{};toast('Converted — workspace + project ready'+(x.idempotent?' (already done)':(x.invited?', customer invited':'')));
        // "Won stays put": when this panel is embedded in the unified Client Record,
        // tell the record to reveal + switch to Delivery — the relationship never
        // jumps to a separate destination at closed-won.
        if(EMBED){try{window.parent.postMessage({type:'dds-deal-converted',project_id:x.project_id||'',site_id:x.site_id||'',client_id:x.client_id||''},location.origin);}catch(_){}}
        openDeal(id);load();}catch(e){toast(nice(e),true);$('convYes').disabled=false;}};
    };
    const resend=$('resendInvite'); if(resend) resend.onclick=async()=>{resend.disabled=true;const was=resend.textContent;resend.textContent='Sending…';try{const r=await api('/sales/deals/'+id+'/resend-invite','POST',{});toast('Welcome email sent'+((r.data&&r.data.email)?' to '+r.data.email:'')+' ✓');openDeal(id);}catch(e){toast(nice(e),true);resend.disabled=false;resend.textContent=was;}};
    // a11y: an in-view action re-rendered the page and dropped focus — land it back
    // on the deal title (a stable, focusable anchor) so keyboard users aren't lost.
    if(wasOpen){const t=$('dtitle');if(t)t.focus();}
  }catch(e){ $('detailInner').innerHTML='<div class="backbar"><button class="btn ghost" id="closeD">← Back to pipeline</button></div><div class="dbody mut">'+esc(nice(e))+'</div>'; const b=$('closeD'); if(b)b.onclick=closeDealDetail; }
}

(async function(){
  try{
    const {data}=await sb.auth.getSession();
    TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){ $('list').innerHTML='<p class="mut">Please <a href="/studio.html">sign in</a> to see your pipeline.</p>'; return; }
    renderFilters(); await load();
    const deep=new URLSearchParams(location.search).get('deal'); if(deep) openDeal(deep);
  }catch(_){ $('list').innerHTML='<p class="mut">We couldn’t load your pipeline just now.</p>'; }
})();
</script>
</body>
