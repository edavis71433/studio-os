<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipeline — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your sales pipeline — from first enquiry through onboarding.">
<!-- P2-C: Studio App sales pipeline on the ONE shared shell + shared state helpers. -->
<link rel="stylesheet" href="/fonts/brand.css">
<link rel="stylesheet" href="/shell.css">
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('dds-embed');</script>
<style>
html.dds-embed .dds-nav,html.dds-embed .dds-search,html.dds-embed #dds-mbar,html.dds-embed .dds-drawer,html.dds-embed #dds-offline{display:none!important}
html.dds-embed{--dds-shell-h:0px}
html.dds-embed body{padding-top:0!important;background:transparent}
html.dds-embed #listWrap{display:none!important}
html.dds-embed .backbar{display:none!important}
html.dds-embed #detailWrap{padding-top:0}
</style>
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically) — same aliasing pattern
     as crm.html / inbox.html. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  /* dark mode: the light accent fill needs dark ink (#fff on #b79ceb fails contrast) —
     the Path's current chevron sits on the same var(--p) fill (same fix in crm.html) */
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost),:root:not([data-theme="light"]) .path button.pstep.current{color:#171320}}
  :root[data-theme="dark"] .btn:not(.ghost),:root[data-theme="dark"] .path button.pstep.current{color:#171320}
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 80px}
  h1{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:4px}
  .sub{color:var(--soft);font-size:14px;margin-bottom:20px}
  /* ── roster header (.lhead) — the same list-view anatomy as customers.html /
        leads.html / contacts.html: object icon · ONE h1 · ↻ · count/money meta ── */
  .lhead{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 10px;margin-bottom:12px}
  .lrow1{display:flex;align-items:center;gap:10px}
  .obj-ic{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .lhead h1{font-size:20px;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
  .lbtn{flex:0 0 auto;font:inherit;border:none;background:none;color:var(--soft);font-size:15px;border-radius:8px;padding:5px 10px;min-height:34px;cursor:pointer}
  .lbtn:hover{color:var(--p);background:var(--p-soft)}
  .lmeta{margin-top:6px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .search{width:100%;font-family:inherit;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);margin-bottom:12px}
  .search:focus{outline:2px solid var(--p);outline-offset:1px;border-color:var(--p)}
  /* the calm "your numbers" strip — plain numbers, tabular, no chart */
  .summary{margin-bottom:18px}
  .summary:empty{display:none}
  .sum-line{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--soft);font-variant-numeric:tabular-nums;line-height:1.75}
  .sum-line strong{color:var(--ink);font-weight:600}
  .sum-line .dot{color:var(--line);margin:0 5px}
  .sum-line .mut{color:var(--faint);font-size:12.5px}
  .sum-stages{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .sum-stages .sc{display:flex;flex-direction:column;gap:1px;padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);min-width:88px}
  .sum-stages .sc-l{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em}
  .sum-stages .sc-n{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
  .chip.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  .btn{font:inherit;font-size:13.5px;font-weight:600;border:none;border-radius:9px;padding:8px 14px;background:var(--p);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--warn)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .card:hover{border-color:var(--p)}
  .card .t{font-weight:600}
  .card .m{color:var(--soft);font-size:13px;margin-top:2px}
  .stage{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .stage.won{background:var(--good-soft);color:var(--good)}
  .stage.lost{background:transparent;border:1px solid var(--line);color:var(--soft)}
  .val{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px}
  dialog{border:none;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(27,21,37,.4)}
  .dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:start}
  .dbody{padding:18px 20px;max-height:64vh;overflow:auto}
  .sec{margin-top:16px}.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:8px}
  .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  form.mini{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  form.mini .grid{display:flex;gap:8px;flex-wrap:wrap}
  input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  textarea{min-height:90px;resize:vertical}
  label{font-size:12.5px;color:var(--soft);display:block;margin:2px 0 3px}
  .mut{color:var(--soft);font-size:13px}
  .hrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--soft);padding:5px 0;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:none}
  .hrow .hd{white-space:nowrap;color:var(--faint);font-variant-numeric:tabular-nums}
  /* activity quick-log + merged timeline */
  .qlog{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);margin-bottom:12px}
  .qlog .kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .qlog .kb{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
  .qlog .kb.on{background:var(--p-soft);border-color:var(--p);color:var(--p);font-weight:600}
  .qlog textarea{min-height:44px}
  .qlog .qrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .qlog .qrow input[type=date]{width:auto;flex:0 0 auto}
  .tl{list-style:none;padding:0;margin:6px 0 0}
  .tl-i{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .tl-i:last-child{border-bottom:none}
  .tl-ic{flex:0 0 auto;width:22px;text-align:center;line-height:1.5;color:var(--faint)}
  .tl-bd{flex:1;min-width:0}
  .tl-tx{font-size:13.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .tl-mt{font-size:12px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
  a{color:var(--p)}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}
  /* ── Path (Lightning chevrons, dds skin) — kept in sync with crm.html by hand
        (its .pathcard/.pstep/.path-guide/.path-confirm/.terminal-chip block):
        same shapes, same done/current/todo + won/lost terminal states, same
        interactivity rules (only the current step + the one legal back-target). ── */
  .pathrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .path{display:flex;flex:1 1 340px;min-width:0}
  .path button.pstep{flex:1;min-width:0;border:none;font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 16px;cursor:default;
    background:var(--card);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0;
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
  .path button.pstep:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);border-radius:8px 0 0 8px}
  .path button.pstep:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,11px 50%);border-radius:0 8px 8px 0}
  .path button.pstep.done{background:var(--good-soft);color:var(--good)}
  .path button.pstep.canback{cursor:pointer}
  .path button.pstep.canback:hover{filter:brightness(.96)}
  .path button.pstep.current{background:var(--p);color:#fff;cursor:pointer}
  .path button.pstep.current:hover{filter:brightness(1.06)}
  .path button.pstep.lost-terminal{background:var(--warn-soft);color:var(--warn)}
  .path-side{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .path-guide{margin-top:10px;font-size:13.5px;color:var(--soft)}
  .path-guide b{color:var(--ink);font-weight:600}
  .path-confirm{margin-top:10px;display:flex;gap:9px;align-items:center;font-size:13.5px;flex-wrap:wrap}
  .terminal-chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px}
  .terminal-chip.won{background:var(--good-soft);color:var(--good)}
  .terminal-chip.lost{background:var(--warn-soft);color:var(--warn)}
  /* View toggle (List · Board · Table) */
  .viewtog{display:inline-flex;gap:4px}
  /* ── Table view: sortable columns; the table scrolls in its OWN container ── */
  #table .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:14px}
  #table table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  #table thead th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
  #table thead th .thb{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:none;padding:11px 14px;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:5px}
  #table thead th .thb:hover{color:var(--p)}
  #table thead th .arrow{font-size:10px;color:var(--p)}
  #table tbody tr{cursor:pointer}
  #table tbody tr:hover{background:var(--p-soft)}
  #table tbody tr:focus-visible{outline:2px solid var(--p);outline-offset:-2px}
  #table tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  #table tbody tr:last-child td{border-bottom:none}
  #table td .dn{font-weight:600}
  #table td.num{font-variant-numeric:tabular-nums}
  #table td .over{color:var(--bad);font-weight:600}
  .tmeta{font-size:12px;color:var(--faint);margin:0 0 8px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  /* Kanban board — columns = open stages, cards = deals, tap/drag to move */
  .board-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:2px 20px 6px}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;align-items:start}
  .col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:220px}
  .col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
  .col-t{font-weight:600;font-size:13.5px;flex:1}
  .col-n{font-size:12px;color:var(--faint);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
  .col-val{font-size:11.5px;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
  .col-tip{font-size:11.5px;margin-bottom:8px;line-height:1.4}
  .col-body{display:flex;flex-direction:column;gap:8px;min-height:40px;border-radius:8px;padding:2px;transition:background .12s}
  .col-body.drop-ok{outline:1px dashed var(--p);outline-offset:-2px}
  .col-body.drop-over{background:var(--p-soft)}
  .bempty{font-size:12px;text-align:center;padding:10px 4px;opacity:.7}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;position:relative}
  .bcard:hover{border-color:var(--p)}
  .bcard.dragging{opacity:.5}
  .bc-t{font-weight:600;font-size:13.5px;line-height:1.35}
  .bc-v{font-variant-numeric:tabular-nums;color:var(--soft);font-size:12.5px;margin-top:3px}
  .bc-m{color:var(--faint);font-size:12px;margin-top:3px}
  .bcard.is-stale{border-left:2px solid var(--warn,#775d31)}
  .bc-stale{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--warn,#775d31);background:rgba(154,107,18,.12);border-radius:999px;padding:1px 7px;margin-top:6px}
  .bc-due{color:var(--warn);font-weight:600;font-size:12px;margin-top:3px}
  .bc-actions{margin-top:8px;position:relative}
  /* popup contract: the Move trigger + every menu option meet the 44px touch floor */
  .bc-move{font:inherit;font-size:12px;font-weight:600;color:var(--p);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 12px;min-height:44px;cursor:pointer}
  .bc-move:hover{border-color:var(--p)}
  .bc-menu{position:absolute;left:0;top:calc(100% + 4px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column;min-width:170px}
  .bc-menu button{font:inherit;font-size:13px;text-align:left;background:transparent;border:none;color:var(--ink);padding:8px 10px;min-height:44px;display:flex;align-items:center;border-radius:7px;cursor:pointer}
  .bc-menu button:hover{background:var(--p-soft)}
  .board-foot{margin-top:12px;font-size:12.5px}

  /* ─────────────────────────────────────────────────────────────────────────
     FULL-SCREEN DEAL DETAIL — the deal opens as a roomy in-page page (same tab),
     not a cramped modal. It sits in normal document flow inside its own .wrap, so
     the page scrolls naturally. Everything below is SCOPED to #detailWrap /
     #detailInner so the pipeline list, board, and the other dialogs are untouched.
     ───────────────────────────────────────────────────────────────────────── */
  #detailWrap{max-width:1000px}
  #detailInner{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .backbar{padding:16px 20px 0}
  .backbar .btn{padding:8px 14px}
  /* compact record header — the record page's header idiom (crm.html .rec-head):
     object icon · serif name · one clean sub-row of chips + facts */
  #detailInner .dhead{padding:16px 22px 18px;justify-content:flex-start;align-items:flex-start;gap:14px}
  #detailInner .dh-ic{width:44px;height:44px;border-radius:12px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
  #detailInner #dtitle{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;outline-offset:3px}
  #detailInner .dh-sub{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px;color:var(--soft);margin-top:5px}
  #detailInner .dh-sub a{color:var(--p);text-decoration:none}
  #detailInner .dh-sub a:hover{text-decoration:underline}
  #detailInner .dh-sub .fact strong{color:var(--ink);font-weight:600}
  /* it's a full page now — no inner scroll box; each section breathes as a card */
  #detailInner .dbody{padding:8px 22px 28px;max-height:none;overflow:visible}
  #detailInner .sec{margin:0 0 16px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  #detailInner .sec:last-child{margin-bottom:0}
  /* related-list card headers — same idiom as crm.html's Deal-tab cards (.card-h .t) */
  #detailInner .sec h3{font-family:var(--sans);font-weight:700;font-size:14.5px;text-transform:none;letter-spacing:normal;color:var(--ink);margin-bottom:12px}
  /* related-list rows: each document row separated like crm.html's .rrow */
  #detailInner .lrows .lr{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}
  #detailInner .lrows .lr:first-child{border-top:none;padding-top:0;margin-top:0}
  /* the inline mini-forms + quick-log sit on the card surface for contrast */
  #detailInner form.mini{background:var(--card)}
  @media(max-width:560px){#detailInner .dhead,#detailInner .dbody{padding-left:16px;padding-right:16px}#detailInner #dtitle{font-size:24px}}
</style>
<script src="/vendor/supabase-js-2.45.4.js"></script>
<script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap" id="listWrap">
  <div class="lhead">
    <div class="lrow1">
      <span class="obj-ic" aria-hidden="true">🤝</span>
      <h1>Pipeline</h1>
      <button class="lbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">↻</button>
    </div>
    <div class="lmeta" id="lmeta">From first enquiry through onboarding — one deal at a time.</div>
  </div>
  <input class="search" id="dealSearch" type="search" autocomplete="off" aria-label="Search deals" placeholder="Search deals — title, company, or contact…">
  <div class="summary" id="summary" aria-live="polite"></div>
  <!-- not tabs — chips that filter/switch in place, so: role=group + aria-pressed -->
  <div class="bar" id="filters" role="group" aria-label="Filter by stage"></div>
  <div class="bar"><button class="btn" id="newDeal">+ New deal</button><span class="spacer"></span><div class="viewtog" role="group" aria-label="Display as"><button class="chip on" id="viewList" aria-pressed="true">List</button><button class="chip" id="viewBoard" aria-pressed="false">Board</button><button class="chip" id="viewTable" aria-pressed="false">Table</button></div></div>
  <div id="list" aria-live="polite"></div>
  <div id="board" aria-live="polite" hidden></div>
  <!-- NOT aria-live: renderTable() swaps the whole innerHTML per sort click, and a
       live region would queue the entire table; the sr-only status below announces
       just the sort instead. -->
  <div id="table" hidden></div>
  <span id="tsortNote" class="sr-only" role="status" aria-live="polite"></span>
</div>

<!-- FIX: the deal detail opens as a FULL-SCREEN in-page view (same tab), not a
     cramped left-side modal overlay — matching the delivery view's full-screen
     page. The list and the detail are two panels of the ONE page; only one shows
     at a time (showDetail/hideDetail swap them). -->
<div class="wrap" id="detailWrap" hidden><div id="detailInner"></div></div>

<dialog id="formDlg" aria-label="New deal">
  <form id="dealForm" class="dbody" style="max-height:none">
    <div style="font-family:var(--serif);font-size:20px;margin-bottom:12px">New deal</div>
    <label for="f-title">Deal title</label>
    <input id="f-title" required maxlength="200" placeholder="e.g. Acme website" autocomplete="off">
    <label for="f-email" style="margin-top:10px">Client email <span class="mut">(optional — enables their login on convert)</span></label>
    <input id="f-email" type="email" maxlength="160" placeholder="name@business.com" autocomplete="off">
    <label for="f-name" style="margin-top:10px">Client name <span class="mut">(optional)</span></label>
    <input id="f-name" maxlength="120" placeholder="Jane Doe" autocomplete="off">
    <label for="f-phone" style="margin-top:10px">Phone <span class="mut">(optional)</span></label>
    <input id="f-phone" maxlength="40" placeholder="(555) 123-4567" autocomplete="off">
    <div class="row2" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn ghost" id="f-cancel">Cancel</button><button type="submit" class="btn">Create deal</button></div>
  </form>
</dialog>

<dialog id="svcDlg" aria-label="Manage your services">
  <div class="dbody" style="max-height:70vh">

// The DEFAULT starter agreement — a calm, plain-language first draft for an
// owner with no saved templates yet. Saved templates stay the power path; this
// only ever fills an EMPTY form, and every word is editable before sending.
function starterAgreement(d,c,accepted,biz){
  const STUDIO=biz||'Davis Digital Studio LLC';
  const client=(c&&(c.company||c.name))||d.title||'[Client name]';
  const work=accepted
    ? `${d.title||'The project'} — the work set out in the proposal you accepted${accepted.title&&accepted.title!=='Proposal'?' (“'+accepted.title+'”)':''}. The specific deliverables, pages, and features are those described in that accepted proposal, which forms part of this agreement.`
    : '[Describe the work — the specific website, pages, features, and services included. Anything not listed here is a separate project.]';
  const total=accepted?money0(propTotals(accepted.line_items).total):'[total price]';
  const invest=accepted
    ? `The total investment for this project is ${total}, matching the proposal you accepted.`
    : `The total investment for this project is ${total}.`;
  const today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  return `SERVICE AGREEMENT

This agreement is between ${STUDIO} (“the Studio,” “I,” or “me”) and ${client} (“you” or “the Client”), dated ${today}. It’s written in plain language on purpose — it says what we’ve both agreed in words we can each read and understand. Please read it, edit anything that needs adjusting, and sign at the bottom. Signing means you agree to these terms.

1. What I’ll do
${work}

2. Investment and payment
${invest}
Payment schedule: a deposit of [deposit amount, e.g. 50%] is due to reserve your spot and begin work. The remaining balance is invoiced [as milestones are reached / on completion — choose one]. Invoices are due within [7] days of being sent. Work may pause on any invoice more than [14] days past due, and a late fee of [1.5%] per month may apply to overdue balances. All payments are made through the secure payment links I send; I never store your card details.

3. Timeline
I’ll begin work once this agreement is signed and the deposit is received. I’ll aim to complete the project by [target date], assuming I receive what I need from you on time. Dates are good-faith estimates, not guarantees — if something needs to move, we’ll tell each other early and adjust together.

4. What I need from you
To keep things on track, I’ll need: your content (text, photos, logos, and any logins) when I ask for it; honest, consolidated feedback within [3–5] business days of each review; and one point of contact who can give final approvals on your behalf. If these run late, the timeline moves with them, and I’m not responsible for delays caused by waiting on you.

5. Revisions and changes
Reasonable revisions to the work described above are included as we go. A “change” — new pages, new features, added scope, or a change in direction after approval — is welcome, but it’s new work: I’ll quote it in writing and we’ll both agree before I start. This keeps your budget predictable and surprise-free.

6. Ownership and your content
When your final payment clears, the finished, delivered work is yours to use. Until then, all work remains my property. Your own content — your words, images, brand, and customer information — is always yours, and you can export and take it with you at any time. Any third-party materials (fonts, stock images, plugins, hosting) remain under their own licenses, and any recurring fees for them are your responsibility. I may show the finished work in my portfolio and mention that I built it, unless you ask me in writing not to.

7. Hosting, maintenance, and after launch
This agreement covers building and delivering the project above. Ongoing hosting, updates, monitoring, and support are provided under a separate plan or retainer — ask me and I’ll explain the options. Once the project is delivered and paid for, this agreement is complete unless we’ve agreed to continued care in writing.

8. If something goes wrong (the honest limits)
I put real care into this work, but I can’t promise specific business results (sales, rankings, traffic). I provide the work “as delivered.” To the fullest extent the law allows, my total responsibility to you for any claim is limited to the amount you’ve paid me for this project, and I’m not liable for indirect or consequential losses. You’re responsible for the legality and accuracy of the content and materials you provide me.

9. Ending the agreement
Either of us can end this agreement with written notice. If you end it, you pay for all work completed up to that point, any non-refundable deposits stand, and you keep everything you’ve paid for. I may end it if invoices go unpaid or if I’m unable to get what I need to continue.

10. The basics
I work as an independent contractor, not an employee. This agreement, plus any accepted proposal, is the whole agreement between us and replaces any earlier conversations. It’s governed by the laws of the State of California. If any part of it can’t be enforced, the rest still stands. Changes to this agreement need to be in writing and agreed by both of us.

By signing below, you agree to the terms above.


Signed for the Client — ${client}


Signed for the Studio — ${STUDIO}`;
}

// The calm "your numbers" strip: open pipeline · won this month · win rate, plus
// a tiny per-stage breakdown. Whole-pipeline (ignores the stage filter), computed
// server-side over ALL deals. Best-effort — it must never block or break the list,
// and it stays honest on empty (each figure reads calmly when zero).
async function renderSummary(gen){
  const host=$('summary'); if(!host) return;
  let s;
  try{ const r=await api('/sales/summary'); s=r&&r.data; }
  catch(_){ if(gen===undefined||gen===REQ_SEQ)host.innerHTML=''; return; }   // never let the summary sink the page
  if(gen!==undefined&&gen!==REQ_SEQ)return;           // a newer roster read started — this strip is stale
  if(!s||!s.total){ host.innerHTML=''; return; }        // empty pipeline → the list's own empty state says it
  const plur=(n,w)=>n+' '+w+(n===1?'':'s');
  const open=s.open||{count:0,value_cents:0}, wm=s.won_month||{count:0,value_cents:0}, wr=s.win_rate||{pct:null,won:0,lost:0};
  const openPart=open.count?`Open: <strong>${money(open.value_cents)||'$0'}</strong> across ${plur(open.count,'deal')}`:`Open: <strong>no open deals yet</strong>`;
  const wonPart=wm.count?`Won this month: <strong>${money(wm.value_cents)||'$0'}</strong> (${wm.count})`:`Won this month: <strong>none yet</strong>`;
  const winPart=(wr.pct===null||wr.pct===undefined)?`Win rate: <strong>—</strong> <span class="mut">(no closed deals yet)</span>`
    :`Win rate: <strong>${wr.pct}%</strong> <span class="mut">(${wr.won} of ${wr.won+wr.lost}, last 90 days)</span>`;
  const cells=(s.by_stage||[]).map(b=>`<span class="sc"><span class="sc-l">${esc(b.label)}</span><span class="sc-n">${b.count}${b.value_cents?' · '+money(b.value_cents):''}</span></span>`).join('');
  // AR strip — "who owes me money" across all deals, in one glance (open invoices).
  const ar=s.ar||{}; let arPart='';
  if((ar.count||0)>0){ arPart=`<div class="sum-line" style="margin-top:6px">💰 Outstanding: <strong>${money(ar.outstanding_cents)||'$0'}</strong> across ${plur(ar.count,'invoice')}`+((ar.overdue_count||0)>0?` <span class="dot">·</span> <strong style="color:var(--bad,#a3423a)">${money(ar.overdue_cents)} overdue</strong> (${ar.overdue_count})`:'')+` <a href="#" id="arOpen" style="color:var(--p);text-decoration:none;font-weight:600">see who →</a></div>`; }
  host.innerHTML=`<div class="sum-line">${openPart} <span class="dot">·</span> ${wonPart} <span class="dot">·</span> ${winPart}</div>`
    +(open.count?`<div class="sum-stages">${cells}</div>`:'')+arPart;
  const ao=$('arOpen'); if(ao)ao.onclick=(e)=>{e.preventDefault();openReceivables();};
}

async function loadDealTasks(id){
  const host=$('dealTasks'); if(!host)return;
  let items=[];try{const r=await api('/sales/deals/'+id+'/tasks');items=(r&&r.data)||[];}catch(_){}
  if(CURRENT_DEAL!==id||host!==$('dealTasks'))return;   // the drawer moved on while this read was in flight
  if(!items.length){host.innerHTML='<span class="mut">No to-dos yet.</span>';return;}
  const today=new Date().toISOString().slice(0,10);
  host.innerHTML=items.map(t=>{const done=t.status==='done';const overdue=!done&&t.due_date&&t.due_date<=today;return `<div class="row2" style="align-items:center;gap:8px"><input type="checkbox" data-tk="${t.id}"${done?' checked':''} aria-label="Mark done"><span style="flex:1;${done?'text-decoration:line-through;color:var(--soft,#888)':''}">${esc(t.title)}${t.due_date?` <span class="mut" style="${overdue?'color:var(--warn,#775d31);font-weight:600':''}">· ${overdue?'due ':''}${esc(t.due_date)}</span>`:''}</span><button class="btn ghost sm" data-tkdel="${t.id}" aria-label="Remove to-do">✕</button></div>`;}).join('');
  host.querySelectorAll('[data-tk]').forEach(c=>c.onchange=async()=>{try{await api('/sales/deal-tasks/'+c.getAttribute('data-tk'),'PATCH',{status:c.checked?'done':'open'});loadDealTasks(id);}catch(e){toast(nice(e),true);}});
  host.querySelectorAll('[data-tkdel]').forEach(b=>b.onclick=async()=>{try{await api('/sales/deal-tasks/'+b.getAttribute('data-tkdel'),'PATCH',{delete:true});loadDealTasks(id);}catch(e){toast(nice(e),true);}});
}

function setView(v){

  if(!EMBED){try{localStorage.setItem(VIEW_KEY,v);}catch(_){/* */}}
  [['list',$('viewList')],['board',$('viewBoard')],['table',$('viewTable')]].forEach(([k,el])=>{
    if(!el)return; el.classList.toggle('on',v===k); el.setAttribute('aria-pressed',String(v===k));
  });
  $('list').hidden=v!=='list'; $('board').hidden=v!=='board'; $('table').hidden=v!=='table';
  $('filters').style.display=v==='board'?'none':'';
  load();
}

// Close any open board move-menu on an outside click (menu/move clicks stop
// propagation, so they survive; everything else dismisses it).
document.addEventListener('click',(e)=>{if(e.target&&e.target.closest&&e.target.closest('.bc-move,.bc-menu'))return;document.querySelectorAll('.bc-menu').forEach(m=>m.remove());document.querySelectorAll('.bc-move[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));});

// soft=true (the ↻ button): a failure keeps the current render and toasts —
// the skeleton + error surfaces are for hard loads only (the leads.html
// contract). NOTE: load must always be WRAPPED when passed as a handler —
// a click event in the first slot would become its soft flag.
async function load(soft){
  const gen=++REQ_SEQ;   // request-generation guard: only the NEWEST read may paint
  renderSummary(gen);    // refresh the numbers whenever the pipeline reloads (add/move/convert)
  const board=VIEW==='board';
  const host=board?$('board'):VIEW==='table'?$('table'):$('list');
  if(!soft&&window.ddsSkeleton) window.ddsSkeleton(host,4);
  try{
    // Board shows every open stage, so it ignores the list's stage filter.
    const res=await api('/sales/deals'+((!board&&FILTER)?('?stage='+FILTER):''));
    if(gen!==REQ_SEQ)return;   // a newer request started — this response is stale, never paint it
    DEALS=res.data||[];
    LOADED_AT=Date.now();
    renderCurrent();
  }catch(e){
    if(gen!==REQ_SEQ)return;   // a stale failure is nobody's news
    if(soft){toast('Couldn’t refresh just now.',true);return;}   // keep the last good render
    if(window.ddsError) window.ddsError(host,nice(e),()=>load()); else host.innerHTML='<p class="mut">'+esc(nice(e))+'</p>';
  }
}
// ↻ soft refresh + the static search input (never re-rendered → caret-safe).
{
  const rf=$('refreshBtn'); if(rf)rf.addEventListener('click',()=>{load(true);});
  const si=$('dealSearch'); if(si)si.addEventListener('input',()=>{Q=si.value;renderCurrent();});
}

// ── Table view: the deals as a sortable list-view table (Deal · Contact ·
// Stage · Value · Next step (due) · Last contacted). Rows open the SAME drawer;
// nothing edits inline. Contact names aren't in the deals LIST response (only
// contact_id), so the Contact column joins them client-side from the EXISTING
// GET /sales/contacts read — fetched once, cached, degrading to “—”. ──
let CONTACT_NAME=null,CONTACT_TEXT=null,CONTACT_LOADING=null,CONTACT_FAILED=false;
function ensureContactNames(){
  if(CONTACT_NAME&&!CONTACT_FAILED)return Promise.resolve();
  if(CONTACT_LOADING)return CONTACT_LOADING;
  CONTACT_LOADING=api('/sales/contacts?limit=500')
    .then(r=>{CONTACT_NAME={};CONTACT_TEXT={};CONTACT_FAILED=false;for(const c of (r.data||[])){CONTACT_NAME[c.id]=c.name||c.email||'';CONTACT_TEXT[c.id]=[c.name,c.email,c.company].filter(Boolean).join(' ').toLowerCase();}})
    .catch(()=>{CONTACT_NAME={};CONTACT_TEXT={};CONTACT_FAILED=true;})   // plan-gated or offline → cells read “—” for THIS render; a failure is never cached — the next render retries
    .finally(()=>{CONTACT_LOADING=null;});
  return CONTACT_LOADING;
}
// ── the .lhead search: ONE client-side filter across every display. Matches the
// deal title plus the contact's name/email/company (the same cached
// /sales/contacts join the Table's Contact column uses — kicked lazily the
// first time a query needs it, degrading to title-only until it lands). The
// input is STATIC markup: only the list re-renders, so focus + caret survive
// every keystroke by construction (the contacts.html list-only-re-render idiom).
function visibleDeals(){
  const q=Q.trim().toLowerCase();
  if(!q)return DEALS;
  if(!CONTACT_TEXT&&!CONTACT_LOADING)ensureContactNames().then(()=>{if(Q.trim())renderCurrent();});
  return DEALS.filter(d=>{
    const ct=(CONTACT_TEXT&&d.contact_id&&CONTACT_TEXT[d.contact_id])||'';
    return (String(d.title||'').toLowerCase()+' '+ct).includes(q);
  });
}
// ── the .lmeta line: visible count · total value (money0 — the same cents
// formatter the summary strip uses) · freshness · table sort, in one breath.
function renderMeta(){
  const el=$('lmeta'); if(!el)return;
  const list=visibleDeals();
  const sum=list.reduce((a,d)=>a+(d.expected_value_cents||0),0);
  let m=list.length+' deal'+(list.length===1?'':'s')+' · '+money0(sum)+' total · '+updatedLabel();
  if(VIEW==='table'){const col=TCOLS.find(x=>x[0]===TSORT.key)||TCOLS[0];m+=' · Sorted by '+col[1]+' — '+(TSORT.dir>0?'ascending':'descending');}
  el.textContent=m;
}
// Roster-empty honesty: a stage-filtered empty says WHICH stage is empty (the
// won landing gets its own line); only a truly empty pipeline gets the starter.
function renderRosterEmpty(host){
  if(FILTER==='won'){host.innerHTML='<div class="dds-empty"><div class="ico">🏆</div><h3>No won deals yet</h3><p>Deals you win show up here with their values.</p></div>';return;}
  if(FILTER){host.innerHTML='<div class="dds-empty"><h3>Nothing in “'+esc(stageLabel(FILTER))+'” right now.</h3><p>Deals in this stage will show up here.</p></div>';return;}
  if(window.ddsEmpty) window.ddsEmpty(host,{icon:'🧭',title:'No deals yet',body:'New enquiries and manual deals show up here. Add your first one to start the pipeline.',actionLabel:'New deal',onAction:openNewDeal});
  else host.innerHTML='<p class="mut">No deals yet.</p>';
}
// ONE re-render for whatever display is active — the search, refresh, and sort
// paths all come through here so the meta line never drifts from the list.
function renderCurrent(){
  renderMeta();
  if(VIEW==='board'){renderBoard();return;}
  const host=VIEW==='table'?$('table'):$('list');
  if(!DEALS.length){renderRosterEmpty(host);return;}
  if(!visibleDeals().length){host.innerHTML='<div class="dds-empty"><h3>No deals match that.</h3><p>Try a different deal, company, or contact name.</p></div>';return;}
  if(VIEW==='table')renderTable();else renderList();
}
function renderList(){
  const host=$('list');
  // Deals with a DUE next step float to the top (overdue first) — the pipeline
  // answers "what do I do today", not just "what exists".
  const today=new Date().toISOString().slice(0,10);
  const list=[...visibleDeals()].sort((a,b)=>{const ad=a.next_step_at||'9999',bd=b.next_step_at||'9999';return ad<bd?-1:ad>bd?1:0;});
  host.innerHTML=list.map(d=>{
    const ns=d.next_step?`<div class="m">${(d.next_step_at&&d.next_step_at<=today)?`<span style="color:var(--warn,#775d31);font-weight:600">Due: ${esc(d.next_step)}</span>`:`Next: ${esc(d.next_step)}${d.next_step_at?' · '+esc(d.next_step_at):''}`}</div>`:'';
    const lc=d.last_contacted_at?`<div class="m">Last contacted ${esc(ago(d.last_contacted_at))}</div>`:'';
    return `<div class="card" data-id="${d.id}" tabindex="0" role="button"><div><div class="t">${esc(d.title||'Untitled deal')}</div><div class="m">${esc(d.source||'')}${d.expected_close?' · closes '+esc(d.expected_close):''}</div>${ns}${lc}</div><div style="text-align:right">${stageBadge(d.stage,d.agreement_signed)}<div class="val">${money(d.expected_value_cents)}</div></div></div>`;
  }).join('');
  host.querySelectorAll('.card').forEach(c=>{const open=()=>openDeal(c.dataset.id);c.onclick=open;c.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});
}
const TCOLS=[
  ['title','Deal',(d)=>String(d.title||'').toLowerCase()],
  ['contact','Contact',(d)=>String((CONTACT_NAME&&CONTACT_NAME[d.contact_id])||'').toLowerCase()],
  ['stage','Stage',(d)=>STAGES.indexOf(d.stage)],
  ['value','Value',(d)=>Number(d.expected_value_cents||0)],
  ['next','Next step (due)',(d)=>d.next_step_at||'9999-99-99'],   // no due date sorts last
  ['last','Last contacted',(d)=>String(d.last_contacted_at||'')],
];
let TSORT={key:'next',dir:1};
function renderTable(){
  const host=$('table');
  // No join yet, or the last read failed → (re)fetch. Re-render on success, and
  // once when the FIRST look settles (so “…” becomes “—”); a failed retry stays
  // put — never a fetch→render→fetch loop.
  if(!CONTACT_NAME||CONTACT_FAILED){
    const firstLook=!CONTACT_NAME;
    ensureContactNames().then(()=>{if((firstLook||!CONTACT_FAILED)&&VIEW==='table'&&!host.hidden)renderTable();});
  }
  const today=new Date().toISOString().slice(0,10);
  const col=TCOLS.find(x=>x[0]===TSORT.key)||TCOLS[0];
  const list=[...visibleDeals()].sort((a,b)=>{const av=col[2](a),bv=col[2](b);return av<bv?-TSORT.dir:av>bv?TSORT.dir:0;});
  const ths=TCOLS.map(([k,label])=>{
    const on=TSORT.key===k;
    return `<th scope="col"${on?` aria-sort="${TSORT.dir>0?'ascending':'descending'}"`:''}><button type="button" class="thb" data-tsort="${k}">${esc(label)}${on?`<span class="arrow" aria-hidden="true">${TSORT.dir>0?'▲':'▼'}</span>`:''}</button></th>`;
  }).join('');
  const trs=list.map(d=>{
    const cn=CONTACT_NAME?((d.contact_id&&CONTACT_NAME[d.contact_id])||'—'):'…';
    const overdue=d.next_step&&d.next_step_at&&d.next_step_at<=today;
    const ns=d.next_step
      ?(overdue?`<span class="over">Due: ${esc(d.next_step)} · ${esc(d.next_step_at)}</span>`
               :`${esc(d.next_step)}${d.next_step_at?` <span class="mut">· ${esc(d.next_step_at)}</span>`:''}`)
      :'—';
    return `<tr data-id="${d.id}" tabindex="0" aria-label="Open ${esc(d.title||'Untitled deal')}">
      <td><span class="dn">${esc(d.title||'Untitled deal')}</span></td>
      <td>${esc(cn)}</td>
      <td>${stageBadge(d.stage,d.agreement_signed)}</td>
      <td class="num">${money(d.expected_value_cents)||'—'}</td>
      <td>${ns}</td>
      <td>${d.last_contacted_at?esc(ago(d.last_contacted_at)):'—'}</td>
    </tr>`;
  }).join('');
  // the count/sort meta lives in the .lhead's .lmeta now — ONE meta line per page
  host.innerHTML=`<div class="tscroll"><table aria-label="Deals"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
  host.querySelectorAll('[data-tsort]').forEach(b=>b.onclick=()=>{
    const k=b.getAttribute('data-tsort');
    if(TSORT.key===k)TSORT.dir=-TSORT.dir; else TSORT={key:k,dir:k==='last'?-1:1};   // last-contacted reads newest-first on first click
    renderTable();renderMeta();
    const nb=host.querySelector('[data-tsort="'+k+'"]'); if(nb)nb.focus();
    // announce just the sort (the table itself is NOT a live region)
    const sc=TCOLS.find(x=>x[0]===k)||TCOLS[0];
    const note=$('tsortNote'); if(note)note.textContent='Sorted by '+sc[1]+', '+(TSORT.dir>0?'ascending':'descending');
  });
  host.querySelectorAll('tr[data-id]').forEach(tr=>{
    tr.onclick=()=>openDeal(tr.getAttribute('data-id'));
    tr.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDeal(tr.getAttribute('data-id'));}};
  });
}

// ── Kanban board: columns = open stages, cards = deals (name · value · last
// contacted). A card opens the same drawer the list uses; moving a card calls
// the SAME /sales/deals/:id/stage endpoint and only offers canTransition-allowed
// targets (tap-to-move menu = the primary, accessible path; drag is additive).
function boardCard(d,today){
  const val=money(d.expected_value_cents);
  const lc=d.last_contacted_at?`Last contacted ${esc(ago(d.last_contacted_at))}`:'';
  const due=(d.next_step&&d.next_step_at&&d.next_step_at<=today)?`<div class="bc-due">Due: ${esc(d.next_step)}</div>`:'';
  // Stalled: no contact in 30+ days (a card the system nudges you about instead of
  // relying on memory). Never-contacted brand-new deals don't flag — avoids noise.
  const stale=d.last_contacted_at&&((Date.now()-Date.parse(d.last_contacted_at))/86400000>=30);
  const staleBadge=stale?`<span class="bc-stale" title="No contact in 30+ days — worth a nudge">⏳ Stalled</span>`:'';
  const canMove=boardMoveTargets(d.stage).length>0;
  const moveBtn=canMove?`<button class="bc-move" data-move="${d.id}" aria-haspopup="menu" aria-expanded="false" title="Move this deal to another stage">Move →</button>`:'';
  return `<article class="bcard${stale?' is-stale':''}" draggable="true" tabindex="0" role="button" aria-label="${esc(d.title||'Untitled deal')} — ${esc(stageLabel(d.stage))}${stale?' — stalled':''}" data-id="${d.id}" data-stage="${d.stage}"><div class="bc-t">${esc(d.title||'Untitled deal')}</div>${val?`<div class="bc-v">${val}</div>`:''}${due||(lc?`<div class="bc-m">${lc}</div>`:'')}${staleBadge}<div class="bc-actions">${moveBtn}</div></article>`;
}
function renderBoard(){
  const host=$('board');
  const today=new Date().toISOString().slice(0,10);
  // Open deals only — won/lost are outcomes (mirrors the summary), shown in List.
  // visibleDeals() so the .lhead search narrows the board's cards too.
  const open=visibleDeals().filter(d=>BOARD_STAGES.includes(d.stage)&&!d.converted_client_id);
  const cols=BOARD_STAGES.map(stg=>{
    const ds=open.filter(d=>d.stage===stg);
    const sum=ds.reduce((a,d)=>a+(d.expected_value_cents||0),0);   // per-column total value (pipeline health at a glance)
    const cards=ds.map(d=>boardCard(d,today)).join('')||'<div class="bempty mut">Nothing here yet</div>';
    return `<section class="col" aria-label="${esc(stageLabel(stg))} column"><header class="col-h"><span class="col-t">${esc(stageLabel(stg))}</span><span class="col-n">${ds.length}</span>${sum?`<span class="col-val">${money(sum)}</span>`:''}</header><div class="col-tip mut">${esc(guidanceFor(stg).action)}</div><div class="col-body" data-drop="${stg}">${cards}</div></section>`;
  }).join('');
  const terminal=DEALS.length-open.length;
  host.innerHTML=`<div class="board-scroll"><div class="board">${cols}</div></div>`
    +(open.length?'':'<div class="mut" style="margin-top:12px">No open deals yet. Add one to start the pipeline.</div>')
    +(terminal>0?`<div class="mut board-foot">${terminal} won or closed deal${terminal===1?'':'s'} — see them in List view.</div>`:'');
  wireBoard();
}
function wireBoard(){
  const host=$('board');
  const move=async(id,to)=>{try{await api('/sales/deals/'+id+'/stage','POST',{to});PENDING_BACK='';toast('Moved to '+stageLabel(to));load();if(!$('detailWrap').hidden&&CURRENT_DEAL===id)openDeal(id);}catch(e){toast(nice(e),true);}};   // any pending back-confirm is against the OLD stage — drop it (mirrors crm.html moveStage)
  host.querySelectorAll('.bcard').forEach(c=>{
    const isCtrl=(e)=>e&&e.target&&e.target.closest&&e.target.closest('.bc-move,.bc-menu');
    c.onclick=(e)=>{if(!isCtrl(e))openDeal(c.dataset.id);};
    c.onkeydown=(e)=>{if((e.key==='Enter'||e.key===' ')&&!isCtrl(e)){e.preventDefault();openDeal(c.dataset.id);}};
    c.ondragstart=(e)=>{DRAG={id:c.dataset.id,from:c.dataset.stage};c.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.id);}catch(_){}}
      host.querySelectorAll('.col-body').forEach(b=>{if(boardCanMove(c.dataset.stage,b.dataset.drop))b.classList.add('drop-ok');});};
    c.ondragend=()=>{c.classList.remove('dragging');host.querySelectorAll('.col-body').forEach(b=>b.classList.remove('drop-ok','drop-over'));DRAG=null;};
  });
  // Tap-to-move menu — the accessible, mobile-friendly primary interaction and
  // the keyboard alternative to drag. Full popup contract: opening focuses the
  // first option, arrows walk the list, Escape closes back to the invoker
  // (outside clicks dismiss via the ONE document-level closer above).
  host.querySelectorAll('.bc-move').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const card=btn.closest('.bcard'); const already=card.querySelector('.bc-menu');
      host.querySelectorAll('.bc-menu').forEach(m=>m.remove());
      host.querySelectorAll('.bc-move').forEach(b=>b.setAttribute('aria-expanded','false'));
      if(already) return;   // second tap closes it
      btn.setAttribute('aria-expanded','true');
      const menu=document.createElement('div'); menu.className='bc-menu'; menu.setAttribute('role','menu');
      menu.innerHTML=boardMoveTargets(card.dataset.stage).map(t=>`<button type="button" role="menuitem" data-to="${t}">${t==='lost'?'Mark as not a fit':'Move to '+esc(stageLabel(t))}</button>`).join('');
      card.querySelector('.bc-actions').appendChild(menu);
      menu.querySelectorAll('button').forEach(mb=>mb.onclick=(ev)=>{ev.stopPropagation();move(card.dataset.id,mb.dataset.to);});
      const close=()=>{menu.remove();btn.setAttribute('aria-expanded','false');btn.focus();};
      menu.addEventListener('keydown',(ev)=>{
        const items=[...menu.querySelectorAll('button')]; const i=items.indexOf(document.activeElement);
        if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();close();}
        else if(ev.key==='ArrowDown'){ev.preventDefault();items[Math.min(i+1,items.length-1)].focus();}
        else if(ev.key==='ArrowUp'){ev.preventDefault();items[Math.max(i-1,0)].focus();}
      });
      const f=menu.querySelector('button'); if(f)f.focus();
      // the 44px options make the menu tall enough to clip at the board
      // scroller's bottom edge — nudge it fully into view
      if(menu.scrollIntoView)menu.scrollIntoView({block:'nearest',inline:'nearest'});
    };
    // Escape on the trigger itself (menu open, focus not yet inside) also closes.
    btn.onkeydown=(e)=>{
      if(e.key!=='Escape')return;
      const m=btn.closest('.bcard').querySelector('.bc-menu'); if(!m)return;
      e.preventDefault();e.stopPropagation();m.remove();btn.setAttribute('aria-expanded','false');
    };
  });
  // Drop targets — only accept a move canTransition allows; a disallowed drop is
  // gently refused (and the column never lights up as droppable in the first place).
  host.querySelectorAll('.col-body').forEach(body=>{
    body.ondragover=(e)=>{if(DRAG&&boardCanMove(DRAG.from,body.dataset.drop)){e.preventDefault();body.classList.add('drop-over');}};
    body.ondragleave=()=>body.classList.remove('drop-over');
    body.ondrop=(e)=>{e.preventDefault();body.classList.remove('drop-over');if(!DRAG)return;const to=body.dataset.drop,from=DRAG.from,id=DRAG.id;if(from===to)return;if(!boardCanMove(from,to)){toast('That deal can’t skip straight to '+stageLabel(to)+'.',true);return;}move(id,to);};
  });
}

// ── new deal: an accessible in-dialog form (no prompt) ──
function openNewDeal(){ $('f-title').value=''; $('f-email').value=''; $('f-name').value=''; $('f-phone').value=''; $('formDlg').showModal(); setTimeout(()=>$('f-title').focus(),20); }
$('newDeal').onclick=openNewDeal;
$('f-cancel').onclick=()=>$('formDlg').close();
$('dealForm').onsubmit=async(e)=>{
  e.preventDefault();
  const title=$('f-title').value.trim(); if(!title){toast('A deal needs a title.',true);return;}
  const email=$('f-email').value.trim();
  const cname=$('f-name').value.trim(); const cphone=$('f-phone').value.trim();
  const btn=e.submitter; if(btn)btn.disabled=true;
  try{
    let contactId=null;
    // capture a real name/phone if given (no more "jane.doe" contacts from the email)
    if(email||cname){ const c=await api('/sales/contacts','POST',{email:email||undefined,name:cname||(email?email.split('@')[0]:'New contact'),phone:cphone||undefined}); contactId=c.data&&c.data.id;
      CONTACT_NAME=null;CONTACT_FAILED=false; }   // the Table's contact-name join is stale now — refetch on the next render
    const created=await api('/sales/deals','POST',{title,contact_id:contactId});
    $('formDlg').close(); toast('Deal added'); load();
    if(created&&created.data&&created.data.id) openDeal(created.data.id);   // straight into the deal — no hunting the list
  }catch(err){ toast(nice(err),true); } finally{ if(btn)btn.disabled=false; }
};

// ── an inline mini-form helper (replaces prompt) ──
// opts.alt = {label, run} adds a PRIMARY button beside a now-secondary Save —
// used so an agreement/proposal can be "Save & send" in one click while "Save
// draft" stays available. Both paths clear the draft on success.
function miniForm(host, fields, onSubmit, opts){
  opts=opts||{};
  host.innerHTML='';
  const f=document.createElement('form'); f.className='mini';
  const inputs={};
  fields.forEach(fl=>{
    // fl.draft (a stable, e.g. per-deal, suffix) opts the field into shell.js
    // draft preservation — long-form work survives an accidental Esc/refresh.
    const fid='mf-'+fl.name+(fl.draft?'-'+fl.draft:'');
    const lab=document.createElement('label'); lab.textContent=fl.label; lab.htmlFor=fid; f.appendChild(lab);
    const el=document.createElement(fl.type==='textarea'?'textarea':'input'); el.id=fid;
    if(fl.type&&fl.type!=='textarea') el.type=fl.type; if(fl.placeholder)el.placeholder=fl.placeholder; if(fl.step)el.step=fl.step;
    if(fl.draft)el.setAttribute('data-dds-draft','1');
    f.appendChild(el); inputs[fl.name]=el;
  });
  const row=document.createElement('div'); row.className='row2'; row.style.justifyContent='flex-end';
  const cancel=document.createElement('button'); cancel.type='button'; cancel.className='btn ghost'; cancel.textContent='Cancel';
  const save=document.createElement('button'); save.type='submit'; save.className=opts.alt?'btn ghost':'btn'; save.textContent=opts.saveLabel||'Save';
  const altBtn=opts.alt?document.createElement('button'):null;
  if(altBtn){altBtn.type='button';altBtn.className='btn';altBtn.textContent=opts.alt.label;}
  row.appendChild(cancel); row.appendChild(save); if(altBtn)row.appendChild(altBtn); f.appendChild(row); host.appendChild(f);
  cancel.onclick=()=>host.innerHTML='';
  if(window.ddsDraftRestore)f.querySelectorAll('[data-dds-draft]').forEach(el=>window.ddsDraftRestore(el));
  const values=()=>Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value.trim()]));
  const clearDrafts=()=>{if(window.ddsDraftClear)f.querySelectorAll('[data-dds-draft]').forEach(el=>window.ddsDraftClear(el));};
  const setBusy=(x)=>{save.disabled=x;if(altBtn)altBtn.disabled=x;};
  const runWith=async(fn)=>{setBusy(true);try{await fn(values());clearDrafts();}catch(err){toast(nice(err),true);setBusy(false);}};
  f.onsubmit=(e)=>{e.preventDefault();runWith(onSubmit);};
  if(altBtn)altBtn.onclick=()=>runWith(opts.alt.run);
  setTimeout(()=>{const first=f.querySelector('input,textarea'); if(first)first.focus();},20);
}

// ── Manage services: the studio's own catalog of sellable services + prices.
// A calm editor (rows of name + price, add/remove, Save) writing the whole list
// to /sales/services. Reused by the proposal dropdown to auto-fill line items. ──

    $('detailInner').querySelectorAll('[data-use-ctpl]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/sales/deals/'+id+'/contracts','POST',{template_id:b.dataset.useCtpl});toast('Agreement drafted from your template');openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    $('detailInner').querySelectorAll('[data-tpl-prop]').forEach(b=>b.onclick=()=>miniForm($('propForm'),[{name:'name',label:'Template name',placeholder:'e.g. Standard website package'}],async(v)=>{if(!v.name){toast('Give the template a name.',true);return;}await api('/sales/templates','POST',{kind:'proposal',name:v.name,from_proposal_id:b.dataset.tplProp});toast('Saved — it’ll appear on every deal.');openDeal(id);}));
    $('detailInner').querySelectorAll('[data-tpl-con]').forEach(b=>b.onclick=()=>miniForm($('conForm'),[{name:'name',label:'Template name',placeholder:'e.g. Standard service agreement'}],async(v)=>{if(!v.name){toast('Give the template a name.',true);return;}await api('/sales/templates','POST',{kind:'contract',name:v.name,from_contract_id:b.dataset.tplCon});toast('Saved — it’ll appear on every deal.');openDeal(id);}));
    // a saved template can be retired right where it's offered (deals already drafted from it are untouched)
    $('detailInner').querySelectorAll('[data-del-tpl]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this saved template? Proposals and agreements already drafted from it are untouched.'))return;b.disabled=true;try{await api('/sales/templates/'+b.dataset.delTpl,'DELETE');toast('Template removed');openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    // ONE sender for both kinds; understands the server's honesty guard: if an
    // OPEN invoice exists at a different amount, offer "resend that one" or
    // "send another" (force) — never a silent surprise.
    async function sendMoney(body){
      try{
        const r=await api('/sales/deals/'+id+'/invoice','POST',body);
        const label=body.purpose==='deposit'?'Deposit request':'Invoice';
        toast((r.reused?label+' re-sent ('+money(r.amount_cents)+')':label+' sent')+(r.emailed?' — emailed to the client':(r.url?' — link copied':'')));
        if(r.url&&navigator.clipboard)navigator.clipboard.writeText(r.url).catch(()=>{});
        openDeal(id);
      }catch(e){
        if(e.status===409&&e.body&&e.body.error==='amount_mismatch'){
          const open=e.body.open_invoice||{};
          $('invForm').innerHTML=`<div class="mut" style="margin:8px 0" role="alert">${esc(e.body.message||'An open one already exists.')} <span class="mut">If you send another, both links stay payable until one is paid.</span></div>
            <div class="row2"><button class="btn ghost" id="resendOpen">Resend the ${money(open.amount_cents)||'previous'} link</button>
            <button class="btn ghost" id="forceNew">Send another for the new amount</button></div>`;
          $('resendOpen').focus();
          // Resend passes the OPEN amount explicitly (an ad-hoc deposit may have no
          // accepted proposal to default from); both buttons guard the double-click.
          const arm=(id,fn)=>{const b=$(id);b.onclick=()=>{$('resendOpen').disabled=true;$('forceNew').disabled=true;fn();};};
          arm('resendOpen',()=>sendMoney({purpose:body.purpose,amount_cents:Number(open.amount_cents)||undefined,title:open.title||undefined}));
          arm('forceNew',()=>sendMoney({...body,force:true}));
          return;
        }
        toast(nice(e),true);
      }
    }
    const sendInv=$('sendInvoice'); if(sendInv) sendInv.onclick=()=>miniForm($('invForm'),[{name:'amount',label:'Amount (USD) — leave blank to use the accepted proposal',type:'number',step:'0.01',placeholder:'2500'}],async(v)=>{const body={purpose:'service'};if(v.amount)body.amount_cents=Math.round(parseFloat(v.amount)*100);await sendMoney(body);});
    // Retainer: ONE calm toggle — amount + monthly/annual, then the client
    // authorizes via Stripe (nothing charges until they do). NOT a plan-builder.
    const setupRet=$('setupRetainer'); if(setupRet) setupRet.onclick=()=>{const host=$('retForm');host.innerHTML='<div class="mini" style="margin-top:8px"><label class="mut" for="ret-amt">Amount (USD)</label><div class="row2" style="margin-top:2px"><input id="ret-amt" type="number" step="0.01" min="1" placeholder="500" style="max-width:140px"><select id="ret-int" aria-label="Billing frequency"><option value="month">Every month</option><option value="year">Every year</option></select></div><div class="row2" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost" id="ret-cancel" type="button">Cancel</button><button class="btn" id="ret-go" type="button">Start retainer</button></div></div>';$('ret-cancel').onclick=()=>host.innerHTML='';setTimeout(()=>{const a=$('ret-amt');if(a)a.focus();},20);$('ret-go').onclick=async()=>{const a=parseFloat($('ret-amt').value||'0');if(!a||a<1){toast('Enter a retainer amount of at least $1.',true);return;}$('ret-go').disabled=true;try{const r=await api('/sales/deals/'+id+'/retainer','POST',{amount_cents:Math.round(a*100),interval:$('ret-int').value||'month'});const x=r.data||{};toast(x.emailed?'Retainer set up — the authorization link was emailed to the client':'Retainer set up — copy the authorization link to send it');if(x.url&&!x.emailed&&navigator.clipboard)navigator.clipboard.writeText(x.url).catch(()=>{});openDeal(id);}catch(e){toast(nice(e),true);$('ret-go').disabled=false;}};};
    const cancelRet=$('cancelRetainer'); if(cancelRet) cancelRet.onclick=async()=>{if(!confirm('Cancel this retainer? Future charges stop. Past payments are unaffected.'))return;cancelRet.disabled=true;try{await api('/sales/deals/'+id+'/retainer/cancel','POST',{});toast('Retainer canceled — future billing stopped');openDeal(id);}catch(e){toast(nice(e),true);cancelRet.disabled=false;}};
    // Renewal/expiry date on a SIGNED agreement → the owner gets one calm reminder
    // ~30 and ~7 days before it ends (never an auto-renew).
    $('detailInner').querySelectorAll('[data-set-term]').forEach(b=>b.onclick=async()=>{const cid=b.dataset.setTerm;const inp=$('con-term-'+cid);const val=(inp&&inp.value)||'';b.disabled=true;try{await api('/sales/contracts/'+cid+'/term','POST',{term_end:val||null});toast(val?'Renewal reminder set':'Renewal date cleared');openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    $('detailInner').querySelectorAll('[data-copy-pay]').forEach(b=>b.onclick=()=>{
      const url=b.dataset.copyPay;
      const fallback=()=>{const i=document.createElement('input');i.value=url;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast('Payment link copied');}catch(_){toast('Couldn’t copy on this device — use the Copy link button in the invoice list, or the email has the same link.',true);}i.remove();};
      if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Payment link copied')).catch(fallback);else fallback();
    });
    const sendDep=$('sendDeposit'); if(sendDep) sendDep.onclick=()=>miniForm($('invForm'),[{name:'amount',label:'Deposit amount (USD)',type:'number',step:'0.01',placeholder:'500'}],async(v)=>{if(!v.amount){toast('Enter a deposit amount.',true);return;}await sendMoney({purpose:'deposit',amount_cents:Math.round(parseFloat(v.amount)*100),title:'Deposit'});});
    // Per-stage send/resend — bill ONE invoice (e.g. the balance now the milestone
    // is reached). Reuses /sales/invoices/:id/send (the single-invoice primitives).
    $('detailInner').querySelectorAll('[data-send-inv]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await api('/sales/invoices/'+b.dataset.sendInv+'/send','POST',{});toast((r.resent?'Re-sent':'Sent')+(r.emailed?' — emailed to the client':(r.url?' — link copied':'')));if(r.url&&navigator.clipboard)navigator.clipboard.writeText(r.url).catch(()=>{});openDeal(id);}catch(e){toast(nice(e),true);b.disabled=false;}});
    // Payment schedule builder: deposit + balance, or N installments. Previews the
    // staged invoices (labels · due dates · amounts · running total = deal total),
    // then mints them via /sales/deals/:id/schedule. The client math mirrors the
    // pure server builder (remainder-on-last); the server re-validates on create.
    const setupPlanBtn=$('setupPlan'); if(setupPlanBtn) setupPlanBtn.onclick=()=>{
      const host=$('invForm');
      const acceptedProp=(data.proposals||[]).find(p=>p.status==='accepted');
      const totalCents=(acceptedProp&&propTotals(acceptedProp.line_items).total)||d.expected_value_cents||0;
      if(!totalCents){host.innerHTML='<div class="mut" style="margin-top:8px">Set the deal value (in Details) or accept a proposal first — a plan needs a total to split.</div>';return;}
      const addDays=(iso,days)=>{const p=iso.split('-').map(Number);const t=Date.UTC(p[0],p[1]-1,p[2])+days*86400000;const x=new Date(t);const z=n=>String(n).padStart(2,'0');return x.getUTCFullYear()+'-'+z(x.getUTCMonth()+1)+'-'+z(x.getUTCDate());};
      const computeStages=(spec)=>{
        if(spec.mode==='installments'){const n=spec.count;const per=Math.floor(totalCents/n);const out=[];for(let i=0;i<n;i++){const last=i===n-1;out.push({label:'Payment '+(i+1)+' of '+n,amount_cents:last?totalCents-per*(n-1):per,due_date:spec.first_due?addDays(spec.first_due,(spec.every||0)*i):null,purpose:'service'});}return out;}
        const dep=spec.deposit_type==='percent'?Math.round(totalCents*spec.deposit_value/100):Math.round(spec.deposit_value*100);
        return [{label:'Deposit',amount_cents:dep,due_date:spec.deposit_due||null,purpose:'deposit'},{label:'Balance',amount_cents:totalCents-dep,due_date:spec.balance_due||null,purpose:'service'}];
      };
      host.innerHTML='<div style="margin-top:8px">'
        +'<div class="row2"><label><input type="radio" name="plkind" value="db" checked> Deposit + balance</label><label><input type="radio" name="plkind" value="inst"> Installments</label></div>'
        +'<div id="pl-db" style="margin-top:8px"><label class="mut">Deposit</label><div class="row2"><input type="number" id="pl-depval" step="0.01" min="0" value="50" style="max-width:120px"><select id="pl-depunit"><option value="percent">% of total</option><option value="amount">$ amount</option></select></div><label class="mut" style="display:block;margin-top:8px">Balance due (optional)</label><input type="date" id="pl-baldue"></div>'
        +'<div id="pl-inst" style="margin-top:8px;display:none"><label class="mut">Number of payments</label><br><input type="number" id="pl-count" min="2" max="12" value="3" style="max-width:90px"><label class="mut" style="display:block;margin-top:8px">First payment due</label><input type="date" id="pl-firstdue"><label class="mut" style="display:block;margin-top:8px">Then every (days)</label><br><input type="number" id="pl-every" min="0" value="30" style="max-width:90px"></div>'
        +'<div class="mut" style="margin-top:8px">Total to schedule: <strong>'+money(totalCents)+'</strong></div>'
        +'<div id="pl-preview" style="margin-top:8px"></div>'
        +'<div class="row2" style="margin-top:8px"><button type="button" class="btn" id="pl-create">Create the plan</button></div></div>';
      const gatherSpec=()=>{const kind=host.querySelector('input[name=plkind]:checked').value;if(kind==='inst')return {mode:'installments',count:Math.max(2,Math.min(12,parseInt($('pl-count').value||'0',10)||0)),first_due:$('pl-firstdue').value||null,every:parseInt($('pl-every').value||'0',10)||0};return {mode:'db',deposit_type:$('pl-depunit').value,deposit_value:parseFloat($('pl-depval').value||'0')||0,deposit_due:null,balance_due:$('pl-baldue').value||null};};
      const doPreview=()=>{let stages;try{stages=computeStages(gatherSpec());}catch(_){stages=[];}const sum=stages.reduce((a,b)=>a+(b.amount_cents||0),0);const okSum=sum===totalCents;const rowsH=stages.map(s=>'<div class="row2"><span class="mut">'+esc(s.label)+(s.due_date?' · due '+esc(s.due_date):' · due now')+'</span><span>'+money(s.amount_cents)+'</span></div>').join('');$('pl-preview').innerHTML=rowsH+'<div class="row2" style="border-top:1px solid var(--line,#ddd);margin-top:4px;padding-top:4px"><span class="mut">Running total</span><span style="font-weight:700;color:'+(okSum?'inherit':'var(--bad,#a3423a)')+'">'+money(sum)+' / '+money(totalCents)+'</span></div>';return stages;};
      const toggle=()=>{const inst=host.querySelector('input[name=plkind]:checked').value==='inst';$('pl-db').style.display=inst?'none':'';$('pl-inst').style.display=inst?'':'none';doPreview();};
      host.querySelectorAll('input[name=plkind]').forEach(r=>r.onchange=toggle);
      ['pl-depval','pl-depunit','pl-baldue','pl-count','pl-firstdue','pl-every'].forEach(idn=>{const el=$(idn);if(el)el.oninput=doPreview;});
      doPreview();
      $('pl-create').onclick=async()=>{const stages=doPreview();if(!stages.length){toast('Add plan details first.',true);return;}$('pl-create').disabled=true;try{const r=await api('/sales/deals/'+id+'/schedule','POST',{total_cents:totalCents,stages});toast('Payment plan created'+((r.data&&r.data.emailed)?' — the deposit was emailed to the client':((r.data&&r.data.linked)?' — deposit link ready to send':'')));openDeal(id);}catch(e){toast(nice(e),true);$('pl-create').disabled=false;}};
    };
    const conv=$('convert'); if(conv) conv.onclick=()=>{
      // two-step confirm (no confirm() dialog). Service language, not SaaS: the
      // labels say WHAT KIND OF WORK this is; the values stay the same edition
      // keys the convert route expects (CONVERT_PLANS in routes/sales.ts). Paying
      // for software is SELF-SERVE at signup — never picked here.
      const wrap=$('convWrap'); wrap.innerHTML=`
        <label for="convPlan">What kind of work is this?</label>
        <select id="convPlan"><option value="presence" selected>I’m building them a new site — hosted with me</option><option value="business_os_only">They keep their site on their own platform — I do the rest</option><option value="presence_monitor">Just monitoring a site they already have</option></select>
        <div class="mut" style="margin-top:6px">Adding them creates their <strong>client portal</strong> and emails them a link to set their password and sign in — that’s where they work with you: files, approvals, messages, invoices. You bill them for your work the usual way — they never pay for software here. You can change this later.</div>
        <div class="row2" style="margin-top:10px"><button class="btn ghost" id="convNo">Cancel</button><button class="btn" id="convYes">Yes, add them as my customer</button></div>`;
      $('convNo').onclick=()=>openDeal(id);
      $('convYes').onclick=async()=>{$('convYes').disabled=true;try{const plan=($('convPlan')&&$('convPlan').value)||'presence';const r=await api('/sales/deals/'+id+'/convert','POST',{plan});const x=r.data||{};toast('Converted — workspace + project ready'+(x.idempotent?' (already done)':(x.invited?', customer invited':'')));
        // "Won stays put": when this panel is embedded in the unified Client Record,
        // tell the record to reveal + switch to Delivery — the relationship never
        // jumps to a separate destination at closed-won.
        if(EMBED){try{window.parent.postMessage({type:'dds-deal-converted',project_id:x.project_id||'',site_id:x.site_id||'',client_id:x.client_id||''},location.origin);}catch(_){}}
        openDeal(id);load();}catch(e){toast(nice(e),true);$('convYes').disabled=false;}};
    };
    const resend=$('resendInvite'); if(resend) resend.onclick=async()=>{resend.disabled=true;const was=resend.textContent;resend.textContent='Sending…';try{const r=await api('/sales/deals/'+id+'/resend-invite','POST',{});toast('Welcome email sent'+((r.data&&r.data.email)?' to '+r.data.email:'')+' ✓');openDeal(id);}catch(e){toast(nice(e),true);resend.disabled=false;resend.textContent=was;}};
    // a11y: an in-view action re-rendered the page and dropped focus — land it back
    // on the deal title (a stable, focusable anchor) so keyboard users aren't lost.
    if(wasOpen){const t=$('dtitle');if(t)t.focus();}
  }catch(e){ if(dgen!==DET_SEQ)return; $('detailInner').innerHTML='<div class="backbar"><button class="btn ghost" id="closeD">← Back to pipeline</button></div><div class="dbody mut">'+esc(nice(e))+'</div>'; const b=$('closeD'); if(b)b.onclick=closeDealDetail; }
}

// Boot honesty: a failed boot renders real trouble WITH a Try again that
// re-runs the whole boot in place (session + load — a bare load() couldn't
// paint without the token the failed boot never got). Markup is hand-rolled
// dds-error classes: shell.js (defer) may not have registered ddsError yet.
async function boot(){
  try{
    const {data}=await sb.auth.getSession();
    TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){ $('list').innerHTML='<p class="mut">Please <a href="/studio.html">sign in</a> to see your pipeline.</p>'; return; }
    // D1 (pipeline half): boot reads ?stage= — a linkable stage landing, most
    // importantly ?stage=won, the view the board deliberately hides. It lands
    // in List (won/lost are outcomes, not board columns); the persisted display
    // choice in storage is respected next visit, never overwritten here.
    const urlStage=new URLSearchParams(location.search).get('stage');
    if(urlStage&&STAGES.includes(urlStage)){FILTER=urlStage;VIEW='list';}
    renderFilters();
    if(VIEW!=='list')setView(VIEW); else await load();   // restore the persisted display (syncs the toggle), else plain load
    const deep=new URLSearchParams(location.search).get('deal'); if(deep) openDeal(deep);
  }catch(_){
    $('list').innerHTML='<div class="dds-error"><span class="ico">!</span><span>We couldn’t load your pipeline just now.</span><button type="button" class="retry" id="bootRetry">Try again</button></div>';
    const b=$('bootRetry'); if(b)b.onclick=()=>boot();
  }
}
boot();
</script>
</body>
