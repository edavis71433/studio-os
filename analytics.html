<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analytics — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your business dashboard — sales and website, at a glance.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;
     light/dark/data-theme all follow it automatically) — same aliasing pattern
     as pipeline.html / crm.html / inbox.html. */
  :root{
    --bg:var(--dds-bg,#faf8f5);--card:var(--dds-card,#fff);--ink:var(--dds-ink,#1b1525);--soft:var(--dds-soft,#6b6478);--faint:var(--dds-faint,#746b8a);--line:var(--dds-line,#eee9e0);
    --p:var(--dds-p,#5b3fa0);--p-soft:var(--dds-p-soft,#efeafa);
    --good:var(--dds-good,#33664b);--good-soft:var(--dds-good-soft,#e7f1ea);--warn:var(--dds-warn,#775d31);--warn-soft:var(--dds-warn-soft,#f3ead9);--bad:var(--dds-bad,#9a4242);
    --shadow:var(--dds-shadow,0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06));
    --serif:'Fraunces',"Iowan Old Style",Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* Chart ramp — ONE ordered categorical ramp, indexed by sort order (SLDS
       color discipline §12.5). Stage colors follow the approved mockup: the
       purple ladder for open stages, --good for won (= pipeline.html's
       .stage.won), --warn for the "other" slice. */
    --c1:#5b3fa0;--c2:#8b6fd0;--c3:#b49ae8;--c4:var(--good);--c5:var(--warn);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#a98ff0;--c2:#8b6fd0;--c3:#6a53a8}}
  :root[data-theme="dark"]{--c1:#a98ff0;--c2:#8b6fd0;--c3:#6a53a8}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
  /* ── dashboard header: object icon · serif title · "As of" + Refresh ── */
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .obj{width:34px;height:34px;border-radius:9px;background:var(--p-soft);display:grid;place-items:center;font-size:17px;flex:none}
  h1{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.01em;outline-offset:3px}
  .asof{color:var(--faint);font-size:12.5px;margin-left:auto;display:flex;align-items:center;gap:10px}
  .rbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:600 12.5px var(--sans);cursor:pointer}
  .rbtn:hover{border-color:var(--p);color:var(--p)}
  /* ── filter chip (Lightning: filters under the header, open unfiltered) ── */
  .filters{display:flex;gap:8px;margin:12px 0 18px;position:relative}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
  .chip b{color:var(--faint);font-weight:600;margin-right:4px}
  .chip .car{color:var(--faint);font-size:10px}
  .chip:hover{border-color:var(--p)}
  .chipmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column;min-width:170px}
  .chipmenu[hidden]{display:none}
  .chipmenu button{font:inherit;font-size:13px;text-align:left;background:transparent;border:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer}
  .chipmenu button:hover{background:var(--p-soft)}
  /* ── the 12-column grid + Lightning card chrome ── */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .band{grid-column:1/-1;font-family:var(--sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:10px 2px -4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .ch{padding:13px 16px 0}
  .ch .t{font-family:var(--sans);font-size:14px;font-weight:700}
  .ch .s{font-size:12px;color:var(--faint);margin-top:2px}
  .cb{padding:10px 16px 14px;flex:1;min-width:0}
  .cf{border-top:1px solid var(--line);padding:8px 16px}
  .cf a{color:var(--p);font-size:12.5px;text-decoration:none;font-weight:600}
  .cf a:hover{text-decoration:underline}
  .c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
  /* metric */
  .kn{font-size:30px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .kn.warn{color:var(--warn)}
  .kn.small{font-size:22px;padding-top:6px}
  .kd{font-size:12px;color:var(--faint);margin-top:3px}
  .kd b.up{color:var(--good);font-weight:700}
  .kd b.down{color:var(--warn);font-weight:700}
  /* funnel */
  .fr{display:flex;align-items:center;gap:10px;margin:7px 0}
  .fl{width:104px;font-size:12px;color:var(--soft);text-align:right;flex:none}
  .fb{height:22px;border-radius:5px;flex:none;max-width:calc(100% - 200px)}
  .fv{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* tables */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  th{text-align:left;color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 0;border-bottom:1px solid var(--line)}
  td{padding:7px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
  tr:last-child td{border-bottom:none}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* charts */
  svg{display:block}
  .chartnote{font-size:12px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}
  .leg{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
  .leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
  .donutwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  /* empty state (SLDS illustration pattern: aria-hidden art + required heading) */
  .empty{text-align:center;padding:14px 8px 10px}
  .empty svg{margin:0 auto 8px}
  .eh{font-weight:600;font-size:13.5px}
  .el{font-size:12.5px;color:var(--soft);margin-top:3px}
  /* stencil loading (only shown when the fetch runs >300ms) */
  .st{background:var(--line);border-radius:12px;opacity:.55}
  @media (prefers-reduced-motion:no-preference){.st{animation:stp 1.1s ease-in-out infinite alternate}}
  @keyframes stp{to{opacity:.3}}
  /* portfolio lens (agency, unscoped — SS7: the same .dhead dashboard anatomy) */
  .cfull{grid-column:1/-1}
  .subline{grid-column:1/-1;color:var(--soft);font-size:14.5px;margin:2px 2px 0}
  .tchip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
  .tchip.good{color:var(--good);background:var(--good-soft)}
  .tchip.attention{color:var(--warn);background:var(--warn-soft)}
  .tchip.neutral{color:var(--p);background:var(--p-soft)}
  .isent{font-size:14px;color:var(--ink);margin-top:4px;line-height:1.45}
  .card .go{color:var(--p);font-size:12.5px;text-decoration:none;font-weight:600}
  .card .go:hover{text-decoration:underline}
  .quiet{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:15px 18px;color:var(--soft);font-size:14.5px}
  .quiet b{color:var(--ink);font-weight:600}
  /* per-client rollup — customers.html's .tscroll anatomy (wide content scrolls
     inside its own container; the page never scrolls sideways) */
  .tscroll{grid-column:1/-1;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .tscroll table{min-width:560px}
  .tscroll th{padding:11px 14px}
  .tscroll td{padding:10px 14px}
  .tscroll tbody tr{cursor:pointer}
  .tscroll tbody tr:hover td{background:var(--p-soft)}
  .tscroll td a{color:var(--ink);text-decoration:none;font-weight:600}
  .tscroll td a:hover{color:var(--p)}
  .pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .pill.wait{color:var(--warn);background:var(--warn-soft)} .pill.ok{color:var(--good);background:var(--good-soft)}
  /* shared states */
  .center{text-align:center;padding:56px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px}
  .muted{color:var(--soft);font-size:14.5px}
  a.link{color:var(--p);text-decoration:none;font-weight:600}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;margin:50px auto}
  @media (prefers-reduced-motion:no-preference){.spin{animation:sp .8s linear infinite}}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
  .toast.show{opacity:1}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  /* print (restored from the pre-slice-8 page): the noprint chrome hides, cards
     never break mid-page, and the "Print this summary" button offers the path */
  .print{margin-top:26px;text-align:center}
  .print button{background:none;border:1px solid var(--line);border-radius:10px;color:var(--soft);font:inherit;font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer}
  .print button:hover{border-color:var(--p);color:var(--p)}
  @media print{.seg,.print,.filters,.noprint,#dds-shell{display:none!important}.wrap{max-width:100%}.card,.tscroll{box-shadow:none;break-inside:avoid}}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}
  footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  /* mobile: cards stack — pairs at tablet width, a single column on phones */
  @media (max-width:900px){.c3{grid-column:span 6}.c4,.c6{grid-column:span 12}}
  @media (max-width:560px){.c3{grid-column:span 12}.asof{margin-left:0;width:100%}}
</style>

<body>
<div class="wrap">
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>Studio OS · Analytics — your business at a glance. Numbers only where they’re real.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/vendor/supabase-js-2.45.4.js"></script>
<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scope=()=>new URLSearchParams(location.search).get('client')||'';
let TOKEN="", PERIOD='this_month', CTX=null, DASH=null;
async function api(path){const r=await fetch(FN+path,{headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':scope()}});return r.ok?{ok:true,body:await r.json().catch(()=>({}))}:{ok:false,status:r.status};}
function toast(m){if(window.ddsToast)return void ddsToast(m);const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

// ── formatting (all money is cents; everything tabular-nums) ──
const money=(c)=>'$'+((c||0)/100).toLocaleString(undefined,{maximumFractionDigits:0});
const num=(n)=>(Number(n)||0).toLocaleString();
const withScope=(href)=>scope()?href+(href.includes('?')?'&':'?')+'client='+encodeURIComponent(scope()):href;
// D1 — the withScopePeriod pair: card() layers withScope onto every footer href,
// so passing a withPeriod()'d target means the drill link carries the active
// window AND the scope. Only targets that understand windows get a period
// (business-insights — SS11 consumes these). Pipeline footers: the won-deals
// footers carry ?stage=won (SS5's landing) but stay period-less — the pipeline
// won view isn't windowed (no won-date filter on the deals API), and lying a
// period onto a target that ignores it breaks the discipline.
const withPeriod=(href)=>href+(href.includes('?')?'&':'?')+'period='+encodeURIComponent(PERIOD);
const PERIODS=[['this_month','This month'],['last_30','Last 30 days'],['quarter','This quarter'],['all','All time']];
const periodLabel=()=>{const p=PERIODS.find(x=>x[0]===PERIOD);return p?p[1]:'This month';};
// Truncation honesty (AN-4): a capped read is "the most recent N", so the card
// says so — a static, esc-safe suffix on the subtitle.
const based=(sub,flag)=>flag?(sub?sub+' · based on recent activity':'Based on recent activity'):sub;
// GSC period labeling: Search Console data can lag a month — when the reported
// period isn't the current calendar month, qualify the number (" · in June").
// Defensive: a malformed period string yields no qualifier, never a wrong one.
function gscQual(period){
  const m=/^(\d{4})-(\d{2})$/.exec(String(period||''));
  if(!m)return'';
  const d=new Date();
  const cur=d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2);
  if(m[0]===cur)return'';
  const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const n=names[Number(m[2])-1];
  return n?' · in '+n:'';
}
function asOf(iso){const d=iso?new Date(iso):new Date();const t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});const sameDay=d.toDateString()===new Date().toDateString();return (sameDay?'today, ':d.toLocaleDateString([],{month:'short',day:'numeric'})+', ')+t;}
function shortDate(iso){const d=new Date(iso);return Number.isNaN(d.getTime())?'':d.toLocaleDateString([],{month:'short',day:'numeric'});}

// ── building blocks ──
function card(cls,title,sub,body,foot){
  return `<section class="card ${cls}"><div class="ch"><h3 class="t">${esc(title)}</h3>${sub?`<p class="s">${esc(sub)}</p>`:''}</div><div class="cb">${body}</div>${foot?`<div class="cf"><a href="${esc(withScope(foot[0]))}">${esc(foot[1])} →</a></div>`:''}</section>`;
}
function kpi(value,kd,mod){return `<p class="kn${mod?' '+mod:''}">${value}</p><p class="kd">${kd}</p>`;}
// SLDS illustration empty state: aria-hidden art + REQUIRED heading + one line.
function emptyState(h,line){
  return `<div class="empty"><svg width="72" height="44" viewBox="0 0 72 44" aria-hidden="true" focusable="false">
    <rect x="6" y="10" width="60" height="28" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>
    <path d="M14 30 L26 22 L36 27 L48 17 L58 21" fill="none" stroke="var(--p-soft)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="21" r="3" fill="var(--p-soft)"/>
  </svg><p class="eh">${esc(h)}</p><p class="el">${esc(line)}</p></div>`;
}
// weekly line — inline SVG, aria-hidden; the visible numbers live in the caption
function lineChart(series,color,noun){
  const s=(series||[]).map(v=>Number(v)||0);
  if(s.length<2||!s.some(v=>v>0))return null;   // <2 points → the empty state (step math would NaN)
  const W=460,max=Math.max.apply(null,s);
  const step=W/(s.length-1);
  const y=(v)=>Math.round((100-(v/max)*86)*10)/10;
  const pts=s.map((v,i)=>`${Math.round(i*step)},${y(v)}`).join(' ');
  const lastX=Math.min(Math.round((s.length-1)*step),W-4),lastY=y(s[s.length-1]);   // inset the dot — never half-clipped at the edge
  const total=s.reduce((a,b)=>a+b,0);
  return `<svg viewBox="0 0 460 120" width="100%" height="130" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <line x1="0" y1="100" x2="460" y2="100" stroke="var(--line)"/>
    <line x1="0" y1="55" x2="460" y2="55" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="0" y1="10" x2="460" y2="10" stroke="var(--line)" stroke-dasharray="3 4"/>
    <polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts}"/>
    <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="${color}"/>
  </svg><p class="chartnote">${num(s[s.length-1])} ${esc(noun)} this week · ${num(total)} in the last 12 weeks</p>`;
}
// donut — total in the hole (Lightning donut canon); legend is real text
function donut(segs,holeTop,holeBottom,legend){
  const C=289.03,total=segs.reduce((a,s)=>a+s.v,0);
  let off=0;
  const arcs=total>0?segs.filter(s=>s.v>0).map(s=>{
    const len=(s.v/total)*C;
    const a=`<circle cx="60" cy="60" r="46" fill="none" stroke="${s.c}" stroke-width="17" stroke-dasharray="${len.toFixed(1)} ${C.toFixed(0)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)"/>`;
    off+=len;return a;
  }).join(''):`<circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="17"/>`;
  return `<div class="donutwrap"><svg viewBox="0 0 120 120" width="118" height="118" aria-hidden="true" focusable="false">${arcs}
    <text x="60" y="56" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${esc(holeTop)}</text>
    <text x="60" y="72" text-anchor="middle" font-size="9" fill="var(--faint)">${esc(holeBottom)}</text>
  </svg><ul class="leg" style="list-style:none;padding:0">${legend.map(l=>`<li><i style="background:${l.c}"></i>${esc(l.text)}</li>`).join('')}</ul></div>`;
}

// stage colors: ONE mapping, indexed by ladder order (the approved mockup ramp;
// won = --good, exactly pipeline.html's .stage.won green)
const STAGE_COLOR={lead:'var(--c3)',qualified:'var(--c2)',proposal:'var(--c1)',contract:'var(--c4)',won:'var(--good)'};
const STAGE_SHORT={lead:'Lead',qualified:'Qual.',proposal:'Prop.',contract:'Agr.',won:'Won'};

// ── the two bands ──
function salesBand(d){
  const s=(d&&d.sales)||{};
  let h=`<h2 class="band">Sales</h2>`;
  // KPI: open pipeline
  h+=card('c3','Open pipeline',based('',s.truncated_deals),
    s.pipeline?kpi(money(s.pipeline.open.value_cents),`${num(s.pipeline.open.count)} open deal${s.pipeline.open.count===1?'':'s'}`)
      :emptyState('Nothing to count yet','Your open deals will total up here.'),
    ['/pipeline.html','View pipeline']);
  // KPI: won this month (↑/↓ vs last month). D3: the number is summed
  // expected_value_cents, so the copy says so — never implied invoiced revenue.
  {
    let body;
    if(s.won){
      const tm=s.won.this_month||{count:0,value_cents:0},lm=s.won.last_month||{count:0,value_cents:0};
      const hint=(tm.value_cents||lm.value_cents)?(tm.value_cents>lm.value_cents?' · <b class="up">↑ vs last month</b>':tm.value_cents<lm.value_cents?' · <b class="down">↓ vs last month</b>':' · same as last month'):'';
      body=tm.count?kpi(money(tm.value_cents),`expected value of ${num(tm.count)} deal${tm.count===1?'':'s'} won${hint}`):kpi('$0',`none won yet${hint}`);
    }else body=emptyState('Nothing to count yet','Deals you win will show up here.');
    // SS5's ?stage=won landing (D1): the footer lands on the List view that
    // provably renders won deals — never the board that hides them. No period:
    // this card's window is fixed ("this month") and the pipeline's won view
    // isn't windowed (the deals API has no won-date filter); scope rides via
    // card()'s withScope as everywhere.
    h+=card('c3','Won this month',based('',s.truncated_deals),body,['/pipeline.html?stage=won','View won deals']);
  }
  // KPI: new enquiries (D2: the count is period-windowed — label the window,
  // matching the sibling cards' periodLabel() wording)
  h+=card('c3','New enquiries',based(periodLabel(),s.truncated_enquiries),
    s.enquiries?kpi(num(s.enquiries.count),s.enquiries.unanswered?`${num(s.enquiries.unanswered)} not yet answered`:'all answered')
      :emptyState('Nothing to count yet','Website enquiries will land here.'),
    ['/leads.html','View enquiries']);
  // KPI: open support
  h+=card('c3','Open support','',
    s.support?kpi(num(s.support.open),s.support.open?(s.support.oldest_age_days>=1?`oldest waiting ${num(s.support.oldest_age_days)} day${s.support.oldest_age_days===1?'':'s'}`:'oldest arrived today'):'nothing waiting',s.support.open?'warn':'')
      :emptyState('Nothing to count yet','Support requests will show here.'),

      }).join('');
    }else body=emptyState('No open deals','Deals you add to the pipeline will stack up here by stage.');
    h+=card('c6','Pipeline by stage',based('Open deal value, stage order',s.truncated_deals),body,['/pipeline.html','View pipeline']);
  }

  h+=card('c6','Enquiries over time',based('Weekly, last 12 weeks',s.truncated_enquiries),
    (s.enquiries&&lineChart(s.enquiries.weekly,'var(--c1)','enquiries'))||emptyState('No enquiries yet','When people reach out through your website, the trend shows here.'),
    ['/leads.html','View enquiries']);
  // bar: deal value by stage (+ won this month) — same stages guard as the
  // funnel (a null stages array must render the empty state, never throw
  // mid-render on a soft refresh)
  {
    let body=null;
    if(s.pipeline&&Array.isArray(s.pipeline.stages)&&s.won){
      const bars=s.pipeline.stages.map(x=>({label:STAGE_SHORT[x.stage]||x.stage,v:x.value_cents,c:STAGE_COLOR[x.stage]||'var(--c1)'}));
      bars.push({label:'Won',v:(s.won.this_month||{}).value_cents||0,c:STAGE_COLOR.won});
      if(bars.some(b=>b.v>0)){
        const max=Math.max.apply(null,bars.map(b=>Math.max(b.v,1)));
        const bw=34,gap=(300-bars.length*bw)/(bars.length+1);
        body=`<svg viewBox="0 0 300 130" width="100%" height="140" aria-hidden="true" focusable="false"><line x1="0" y1="112" x2="300" y2="112" stroke="var(--line)"/>`+
          bars.map((b,i)=>{
            const x=Math.round(gap+(bw+gap)*i),hgt=Math.max(b.v>0?4:0,Math.round((b.v/max)*70));
            return `<rect x="${x}" y="${112-hgt}" width="${bw}" height="${hgt}" rx="4" fill="${b.c}"/><text x="${x+bw/2}" y="126" font-size="9.5" fill="var(--faint)" text-anchor="middle">${esc(b.label)}</text>`;
          }).join('')+`</svg><p class="chartnote">Open ${money(s.pipeline.open.value_cents)} · Won this month ${money((s.won.this_month||{}).value_cents||0)}</p>`;
      }
    }
    // widens to c6 when the invoices card is hidden, so the row stays c6+c6
    h+=card(s.invoices?'c4':'c6','Deal value by stage',based('Open + won this month',s.truncated_deals),body||emptyState('No deal value yet','Give your deals a value and this chart fills in.'),['/pipeline.html','View pipeline']);
  }
  // donut: invoices — HIDDEN entirely when the read isn't available (null)
  if(s.invoices){
    const iv=s.invoices;
    const any=iv.paid_count||iv.sent_count||iv.overdue_count;
    // the outstanding total lives in the (aria-hidden) donut hole AND as real
    // text below the legend — never SVG-only
    const body=any?donut(
      [{v:iv.paid_cents,c:'var(--good)'},{v:iv.sent_cents,c:'var(--c2)'},{v:iv.overdue_cents,c:'var(--bad)'}],
      money(iv.outstanding_cents),'outstanding',
      [{c:'var(--good)',text:`Paid · ${money(iv.paid_cents)}`},{c:'var(--c2)',text:`Sent · ${money(iv.sent_cents)}`},{c:'var(--bad)',text:`Overdue · ${money(iv.overdue_cents)}`}]
    )+`<p class="chartnote">Outstanding · ${money(iv.outstanding_cents)}</p>`:emptyState('No invoices yet','Invoices you send from a deal will total up here.');
    h+=card('c4','Invoices',based(periodLabel(),s.truncated_invoices),body,['/pipeline.html','View invoices']);
  }
  // table: recent wins
  {
    const rows=(s.recent_wins||[]);
    const body=rows.length?`<table><caption>Recent wins — deal, value, closed date</caption><thead><tr><th scope="col">Deal</th><th class="r" scope="col">Value</th><th class="r" scope="col">Closed</th></tr></thead><tbody>${rows.map(w=>`<tr><td>${esc(w.title)}</td><td class="r">${money(w.value_cents)}</td><td class="r">${esc(shortDate(w.closed_at))}</td></tr>`).join('')}</tbody></table>`
      :emptyState('No wins yet','Deals you win in the next 90 days will be listed here.');
    // SS5's ?stage=won landing (D1) — same target as the Won-this-month footer;
    // fixed 90-day window on the card, so no period param (see the note above).
    h+=card(s.invoices?'c4':'c6','Recent wins',based('Last 90 days',s.truncated_deals),body,['/pipeline.html?stage=won','View won deals']);
  }
  return h;
}
function websiteBand(d){
  const w=(d&&d.website)||{},t=w.traffic,g=w.search;
  // three honest traffic states: measuring (numbers) · present-but-no-data-yet
  // (never fake zeros) · read failed (t null — a hiccup, not "not measured")
  const measuring=!!(t&&t.has_data);
  const tTrunc=!!(t&&t.truncated);
  // search: gOk = real numbers; g.unavailable = the read hiccuped (NOT the
  // connect CTA — the user may well be connected); g null = not connected.
  const gDown=!!(g&&g.unavailable);
  const gOk=!!(g&&!g.unavailable);
  // D1: every business-insights drill carries the active period (it understands
  // windows — SS11 consumes it); the connections CTA never does.
  const BI=withPeriod('/business-insights.html');
  let h=`<h2 class="band">Your website</h2>`;
  h+=card('c3','Visitors',based(periodLabel(),tTrunc),
    measuring?kpi(num(t.visitors),`${num(t.pageviews)} page view${t.pageviews===1?'':'s'}`)
      :t?emptyState('Not measured yet','Visitor counts appear once your site is collecting them.')
      :emptyState('Visitor counts hit a hiccup','Refresh in a moment.'),
    [BI,'View website insights']);
  h+=card('c3','Actions taken',based(periodLabel(),tTrunc),
    measuring?kpi(num(t.actions),'calls, emails & booking taps')
      :emptyState('Not measured yet','Calls, emails and booking taps will count up here.'),
    [BI,'View website insights']);
  h+=card('c3','Google clicks','',
    gDown?emptyState('Search data is catching its breath','Check back shortly.')
      :gOk?kpi(num(g.clicks),`${num(g.impressions)} times seen in search${gscQual(g.period)}`)
      :emptyState('Not measured yet','Connect Search Console to see your Google numbers.'),
    (gOk||gDown)?[BI,'View search insights']:['/connections.html','Connect Search Console']);
  {
    const top=measuring&&(t.top_sources||[])[0];
    h+=card('c3','Top source',based('',tTrunc),
      top?kpi(esc(top.source),`${num(top.share)}% of visits`,'small')
        :emptyState('Not measured yet','Where visitors come from shows up here.'),
      [BI,'View website insights']);
  }
  h+=card('c6','Visitors over time',based('Weekly, last 12 weeks',tTrunc),
    (measuring&&lineChart(t.weekly,'var(--c2)','visitors'))||emptyState('No visits yet','Once people start visiting, the trend shows here.'),
    [BI,'View website insights']);
  {
    let body=null;
    if(measuring&&(t.top_sources||[]).length){
      const ramp=['var(--c1)','var(--c2)','var(--c3)','var(--c5)','var(--faint)'];
      const segs=t.top_sources.map((s,i)=>({v:s.visits,c:ramp[i]||ramp[4]}));
      body=donut(segs,num(t.visitors),'visitors',t.top_sources.map((s,i)=>({c:ramp[i]||ramp[4],text:`${s.source} · ${num(s.share)}%`})));
    }
    h+=card('c6','Where visitors come from',based(periodLabel(),tTrunc),body||emptyState('No visits yet','Your visitor sources will appear here.'),[BI,'View website insights']);
  }
  {
    const rows=(measuring&&t.top_pages)||[];
    const body=rows.length?`<table><caption>Top pages — page and views</caption><thead><tr><th scope="col">Page</th><th class="r" scope="col">Views</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${p.path==='/'?'Home':esc(p.path)}</td><td class="r">${num(p.views)}</td></tr>`).join('')}</tbody></table>`
      :emptyState('No page views yet','Your most-visited pages will be listed here.');
    h+=card('c6','Top pages',based(periodLabel(),tTrunc),body,[BI,'View website insights']);
  }
  {
    const rows=(gOk&&g.top_terms)||[];
    const body=rows.length?`<table><caption>Google search performance — search term, clicks, times seen</caption><thead><tr><th scope="col">Search</th><th class="r" scope="col">Clicks</th><th class="r" scope="col">Seen</th></tr></thead><tbody>${rows.map(q=>`<tr><td>${esc(q.term)}</td><td class="r">${num(q.clicks)}</td><td class="r">${num(q.impressions)}</td></tr>`).join('')}</tbody></table>`
      :gDown?emptyState('Search data is catching its breath','Check back shortly.')
      :emptyState(gOk?'No search terms yet':'Not measured yet',gOk?'What people search to find you will be listed here.':'Connect Search Console to see what people search to find you.');
    h+=card('c6','Google search performance','What people searched to find you',body,(gOk||gDown)?[BI,'View search insights']:['/connections.html','Connect Search Console']);
  }
  return h;
}

function wireDash(){
  $('refreshBtn').addEventListener('click',()=>loadDash(true).then(()=>{const b=$('refreshBtn');if(b)b.focus();}));
  const pb=$('periodBtn'),pm=$('periodMenu');
  pm.innerHTML=PERIODS.map(p=>`<button type="button" role="option" data-period="${p[0]}" aria-selected="${PERIOD===p[0]?'true':'false'}">${p[1]}${PERIOD===p[0]?' <span aria-hidden="true">✓</span>':''}</button>`).join('');
  const closeMenu=()=>{pm.hidden=true;pb.setAttribute('aria-expanded','false');};
  const toggleMenu=()=>{const open=pm.hidden;pm.hidden=!open;pb.setAttribute('aria-expanded',open?'true':'false');if(open){const f=pm.querySelector('button');if(f)f.focus();}};
  pb.addEventListener('click',toggleMenu);
  // the minimal popup keyboard contract (slice 2): focus first option on open;
  // arrows move; Home/End jump; Escape closes + returns focus; Enter activates
  // natively. Escape works from the CHIP too, and tabbing/clicking beyond the
  // chip+menu closes it without stealing focus (focusout below).
  pb.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&!pm.hidden){e.preventDefault();closeMenu();}});
  pm.addEventListener('keydown',(e)=>{
    const opts=[...pm.querySelectorAll('button')];if(!opts.length)return;
    const i=opts.indexOf(document.activeElement);
    if(e.key==='Escape'){e.preventDefault();closeMenu();pb.focus();}
    else if(e.key==='ArrowDown'){e.preventDefault();opts[Math.min(i+1,opts.length-1)].focus();}
    else if(e.key==='ArrowUp'){e.preventDefault();opts[Math.max(i-1,0)].focus();}
    else if(e.key==='Home'){e.preventDefault();opts[0].focus();}
    else if(e.key==='End'){e.preventDefault();opts[opts.length-1].focus();}
  });
  const filters=pb.closest('.filters');
  if(filters)filters.addEventListener('focusout',(e)=>{
    if(pm.hidden)return;
    const to=e.relatedTarget;
    // a NULL relatedTarget is NOT "focus left the document": iOS Safari blurs
    // on tap without focusing anything, so closing here would hide the option
    // between pointerdown and click and the period would never switch.
    if(!to)return;                             // iOS tap / focus left the document — keep open
    if(!filters.contains(to))closeMenu();      // focus left chip+menu → close, no focus steal
  });
  // PERIOD is committed only on a successful render (loadDash) — a failed
  // switch leaves the chip, checkmarks and state exactly as they were.
  pm.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{
    closeMenu();
    loadDash(true,b.getAttribute('data-period')).then(()=>{const nb=$('periodBtn');if(nb)nb.focus();});
  }));
}
// one delegated outside-click closer (attached ONCE — renders rebuild the chip)

//    the same .dhead dashboard anatomy the scoped Business dashboard wears) ──
// Every number below is derived from the payload — clients/needs-attention/
// enquiries/live come from /analytics/portfolio's websites[] rollup; the
// per-client table reads /agency/portfolio (the one read that carries the
// edition/status and attention COUNT its columns render). SS7 seams: the
// enriched websites[] rows now carry site_id + visitors, so the table gains a
// Visitors column by a site_id join — the PAIRED model stays (each read keeps
// its own shipped failure degradation), the join only ENRICHES.
function insightCard(i){
  const tone=i.tone==='good'?'good':i.tone==='attention'?'attention':'neutral';
  const chip=tone==='good'?'Good news':tone==='attention'?'Needs a look':'Worth knowing';
  const head=`<div class="ch"><span class="tchip ${tone}">${chip}</span><h3 class="t" style="margin-top:7px">${esc(i.title||'Across your clients')}</h3></div>`;
  const body=`${(i.number!=null&&i.number!=='')?`<p class="kn">${esc(i.number)}</p>`:''}<p class="isent">${esc(i.sentence)}</p>${i.detail?`<p class="kd">${esc(i.detail)}</p>`:''}`;
  const foot=i.href?`<div class="cf"><a class="go" href="${esc(i.href)}">${esc(i.cta||'Take a look')} →</a></div>`:'';
  return `<section class="card c4">${head}<div class="cb">${body}</div>${foot}</section>`;
}
function portfolioRollup(roster,ws,vTrunc){
  // roster: /agency/portfolio rows (site_id · name · edition · status ·
  // attention · leads_waiting). null = that read FAILED — say so, never a
  // blank or an implied all-clear (failure ≠ empty).
  // SS7 item 3: visitors joined from the ENRICHED /analytics/portfolio
  // websites[] by site_id — feature-detected on the payload SHAPE, so an older
  // function build (rows without site_id/visitors) renders EXACTLY the shipped
  // table: no column, never an undefined-render. A null visitors value means
  // the visits read failed server-side → an honest —, never a fake 0.
  // vTrunc (data-honesty): the function's visitors_truncated marker — the bulk
  // visits read hit its cap, so NO per-client count is attributable as exact.
  // The whole column shows the honest unknown (—) + one notice, instead of
  // possibly-short numbers. An older function never sends the marker → numbers.
  const vs=Array.isArray(ws)&&ws.length&&ws.every(x=>x&&typeof x.site_id==='string'&&('visitors' in x))?new Map(ws.map(x=>[x.site_id,x.visitors])):null;
  let h=`<h2 class="band">Client by client</h2>`;
  if(roster===null){
    h+=`<div class="cfull card"><div class="cb" style="padding:14px 16px;color:var(--soft)">The client-by-client list wouldn’t load just now — refresh in a moment. The numbers above are unaffected.</div></div>`;

  }

    h+=`<div class="cfull card"><div class="cb">${emptyState('No clients yet','Businesses you add from your Studio tools will be listed here.')}</div></div>`;
    return h;
  }
  const rows=roster.map(c=>{
    const drill='/analytics.html?client='+encodeURIComponent(c.site_id||'');
    const att=Number(c.attention||0),lw=Number(c.leads_waiting||0);
    const v=vs?vs.get(c.site_id):undefined;
    const vcell=vs?`<td class="r">${(vTrunc||v==null)?'<span class="muted">—</span>':num(Number(v)||0)}</td>`:'';
    return `<tr data-drill="${esc(drill)}"><td><a href="${esc(drill)}">${esc(c.name||'(unnamed)')}</a></td><td>${esc(c.edition||'presence')}${c.status?' · '+esc(c.status):''}</td><td>${att?`<span class="pill wait">${num(att)} waiting</span>`:'<span class="pill ok">all clear</span>'}</td><td class="r">${num(lw)}</td>${vcell}</tr>`;
  }).join('');
  h+=`<div class="tscroll"><table><caption>Clients — plan, what’s waiting, enquiries${vs?', visitors':''}. Open a row for that client’s Business dashboard.</caption><thead><tr><th scope="col">Client</th><th scope="col">Plan</th><th scope="col">Waiting</th><th class="r" scope="col">Enquiries waiting</th>${vs?'<th class="r" scope="col">Visitors (7 days)</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`;
  // the one honest line for the — column: a partial count per client would be
  // wrong, so nothing pretends. Everything else in the table is exact.
  if(vs&&vTrunc)h+=`<p class="cfull" style="color:var(--soft);font-size:.85rem;margin:6px 2px 0">A busy week — visits crossed what the portfolio can count client by client, so visitor numbers are hidden rather than shown short. The other columns are exact.</p>`;
  return h;
}

// ── load (deploy-order tolerant BOTH ways: a 404 from an old function is a calm
//    "warming up", never a broken page) ──
// Request-generation guard: a slow response that resolves after a newer request
// started is DISCARDED — it can never overwrite the board mislabeled. PERIOD
// commits only on a successful render (commit-on-success): a failed or stale
// switch leaves the chip and state untouched, so the next Refresh can't
// silently swap periods.
let REQ_SEQ=0;
async function loadDash(soft,nextPeriod){
  const period=nextPeriod||PERIOD;
  const gen=++REQ_SEQ;
  let stencilTimer=null;
  if(!soft)stencilTimer=setTimeout(()=>{if(!DASH)renderStencil();},300);
  let r; try{r=await api('/analytics/dashboard?period='+encodeURIComponent(period));}catch(_){r={ok:false,status:0};}
  if(stencilTimer)clearTimeout(stencilTimer);
  if(gen!==REQ_SEQ)return;   // a newer request started — this response is stale
  if(!r.ok){
    if(r.status===401){signedOut();return;}   // session ended mid-visit — not a toast loop
    if(soft&&DASH){toast('Couldn’t refresh just now.');return;}
    if(r.status===403){$('main').innerHTML=`<div class="center"><h2>Analytics lives in your full workspace.</h2></div>`;return;}
    if(r.status===404){warming();return;}
    trouble();return;
  }
  const data=r.body.data||{};
  // belt-and-braces: if the server echoes a period, it must be the one we asked
  // for — otherwise this response can't honestly label the board
  if(data.period&&data.period!==period)return;
  PERIOD=period;   // commit only now — render below derives chip/checkmarks from it
  DASH=data;
  renderDash(DASH);
}
// ── the portfolio lens loader — same discipline as loadDash: REQ_SEQ stale
//    guard, >300ms stencil, and honest states (401 → signed out, 404 → warming,
//    soft-refresh failure keeps the last good board + a toast, anything else →
//    trouble; a failed read NEVER paints the all-quiet card). The /agency/
//    portfolio companion read only feeds the per-client rollup — its failure
//    degrades that one section honestly, never the whole page.
let PF=null,ROSTER=null;   // ROSTER: the last GOOD /agency/portfolio rows (soft-refresh keep-last-good)
async function loadPortfolio(soft){
  const gen=++REQ_SEQ;
  let stencilTimer=null;
  if(!soft)stencilTimer=setTimeout(()=>{if(!PF)renderStencil('Portfolio dashboard');},300);
  let r,a;
  try{
    [r,a]=await Promise.all([
      api('/analytics/portfolio').catch(()=>({ok:false,status:0})),
      api('/agency/portfolio').catch(()=>({ok:false,status:0})),
    ]);
  }catch(_){r={ok:false,status:0};a={ok:false,status:0};}
  if(stencilTimer)clearTimeout(stencilTimer);
  if(gen!==REQ_SEQ)return;   // a newer request started — this response is stale
  if(!r.ok){
    if(r.status===401){signedOut();return;}
    if(soft&&PF){toast('Couldn’t refresh just now.');return;}
    if(r.status===403){await loadDash();return;}   // context said agency, portfolio says no — fall back to the business dashboard
    if(r.status===404){warming();return;}
    trouble();return;
  }
  PF=r.body.data||{};
  // The roster read degrades ONLY its own section — and with loadDash's
  // keep-last-good discipline: on a SOFT ↻ refresh a failed roster keeps the
  // previous good rows + a toast, instead of replacing them with the
  // couldn't-load line. A first (hard) load has no last-good, so it keeps the
  // honest couldn't-load line.
  const roster=(a&&a.ok&&Array.isArray(a.body.data))?a.body.data:null;
  if(roster!==null)ROSTER=roster;
  else if(soft&&ROSTER)toast('Couldn’t refresh the client list just now.');
  else ROSTER=null;
  renderPortfolio(PF,ROSTER);
}
async function load(){
  // Agency, unscoped → the portfolio lens (SS7). Otherwise the business dashboard.
  if(CTX&&CTX.is_agency&&!scope()){await loadPortfolio();return;}
  await loadDash();
}
(async function(){try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";if(!TOKEN){signedOut();return;}const c=await (window.ddsContext?window.ddsContext().then((d)=>({ok:true,body:{data:d}})):Promise.reject()).catch(()=>api('/portal/context'));CTX=(c.ok&&c.body.data)||{};await load();}catch(_){trouble();}})();
</script>
