<style>
  /* Page skin = the shell's --dds-* tokens (shell.css is the canonical palette;

     wins · Invoices · Where visitors come from · Top pages · Visitors over time ·

  :root{

    --good:var(--dds-good,#15713d);--good-soft:var(--dds-good-soft,#e6f5ec);--warn:var(--dds-warn,#975208);--warn-soft:var(--dds-warn-soft,#fdf2e2);--bad:var(--dds-bad,#c43c3c);

       color discipline §12.5). Stage colors follow the approved mockup: the
       purple ladder for open stages, --good for won (= pipeline.html's
       .stage.won), --warn for the "other" slice. */
    --c1:#5b3fa0;--c2:#8b6fd0;--c3:#b49ae8;--c4:var(--good);--c5:var(--warn);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#a98ff0;--c2:#8b6fd0;--c3:#6a53a8}}

  /* ── cards ── */
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--dds-s4,16px);margin-top:var(--dds-s4,16px)}

  .cb{flex:1;min-width:0;margin-top:var(--dds-s3,12px)}
  .crow{display:flex;justify-content:space-between;align-items:center;margin-top:var(--dds-s3,12px);gap:var(--dds-s2,8px);flex-wrap:wrap}

  .srcs{display:grid;grid-template-columns:minmax(90px,130px) 1fr 48px;gap:10px var(--dds-s3,12px);align-items:center;font-size:13px}

  .kn{font-size:26px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:10px}

  .kd{font-size:12.5px;color:var(--faint);margin-top:var(--dds-s1,4px)}
  .card .links{display:flex;gap:6px var(--dds-s4,16px);flex-wrap:wrap;margin-top:10px}

  .quiet{background:var(--card);border:1px dashed var(--line);border-radius:var(--dds-r-lg,10px);padding:var(--dds-s4,16px) var(--dds-s5,20px);color:var(--soft);font-size:13.5px;margin-top:var(--dds-s3,12px)}
  .quiet b{color:var(--ink);font-weight:600}

  .tscroll td{padding:10px var(--dds-s4,16px);border-top:1px solid var(--line-2);vertical-align:middle}

  .tscroll td.r,.tscroll th.r{text-align:right;font-variant-numeric:tabular-nums}
  .tscroll tbody tr{cursor:pointer}
  .tscroll tbody tr:hover td{background:var(--bg)}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:1px var(--dds-s2,8px);white-space:nowrap;line-height:18px}
  .pill.wait{color:var(--warn);background:var(--warn-soft)} .pill.ok{color:var(--good);background:var(--good-soft)}

  .center{text-align:center;padding:56px var(--dds-s5,20px)}

  .center .muted{font-size:14px}

  .print{margin-top:var(--dds-s7,32px);text-align:center}
  /* Insights — the plain observations that used to be their own page (business-insights.html) */
  .ins-group{margin-top:10px}
  .ins-label{font-size:12px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin:var(--dds-s4,16px) 0 6px}
  .ins{border:1px solid var(--line);border-radius:var(--dds-r-lg,10px);background:var(--card);padding:var(--dds-s3,12px) var(--dds-s4,16px);margin-top:var(--dds-s2,8px)}
  .ins .lead{font-weight:600;margin:0}

  @media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

<script>
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scope=()=>new URLSearchParams(location.search).get('client')||'';
let TOKEN="", PERIOD='this_month', CTX=null, DASH=null;
async function api(path){const r=await fetch(FN+path,{headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':scope()}});return r.ok?{ok:true,body:await r.json().catch(()=>({}))}:{ok:false,status:r.status};}
function toast(m){if(window.ddsToast)return void ddsToast(m);const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

// ── formatting (all money is cents; everything tabular-nums) ──
const money=(c)=>'$'+((c||0)/100).toLocaleString(undefined,{maximumFractionDigits:0});
const num=(n)=>(Number(n)||0).toLocaleString();
// hash-aware, matching shell.js — a fragment target like /presence.html#publish
// must become /presence.html?client=X#publish, never /presence.html#publish?client=X
const withScope=(href)=>{
  if(!scope()||!href||href.charAt(0)==='#')return href;   // an in-page anchor (#insights) stays on this, already-scoped page
  const hi=href.indexOf('#'),hash=hi>=0?href.slice(hi):'',base=hi>=0?href.slice(0,hi):href;
  return base+(base.includes('?')?'&':'?')+'client='+encodeURIComponent(scope())+hash;
};
// D1 — the withScopePeriod pair: card() layers withScope onto every drill href,
// so passing a withPeriod()'d target means the drill link carries the active
// window AND the scope. Only targets that understand windows get a period
// (business-insights — SS11 consumes these). The won-deals drills carry
// ?stage=won (SS5's landing) but stay period-less — the pipeline won view
// isn't windowed (no won-date filter on the deals API).
const withPeriod=(href)=>href+(href.includes('?')?'&':'?')+'period='+encodeURIComponent(PERIOD);
// the FOUR windows the function accepts (lib/analytics_dashboard.ts DASH_PERIODS) — no others exist
const PERIODS=[['this_month','This month'],['last_30','Last 30 days'],['quarter','This quarter'],['all','All time']];
const periodLabel=()=>{const p=PERIODS.find(x=>x[0]===PERIOD);return p?p[1]:'This month';};

// weekly line — real SVG with the dates of the first, middle and last 7-day

function lineChart(series,color,noun,endIso){

  const x=(i)=>Math.round(L+i*step);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of weekly ${esc(noun)}, ${lab(startOf(0))} to ${lab(startOf(s.length-1))}: ${s.map(num).join(', ')}" focusable="false">

    <g font-family="Inter, sans-serif" font-size="11" fill="var(--faint)"><text x="${L}" y="${H-8}">${esc(lab(startOf(0)))}</text><text x="${x(mid)}" y="${H-8}" text-anchor="middle">${esc(lab(startOf(mid)))}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${esc(lab(startOf(s.length-1)))}</text></g>
  </svg><p class="chartnote">${num(s[s.length-1])} ${esc(noun)} this week · ${num(total)} in the last 12 weeks</p>`;
}
// stage bars — value on top, stage below (the approved board's chart); every

function barChart(bars,note){
  const W=520,H=170,L=20,R=20,T=24,B=24;
  const max=Math.max.apply(null,bars.map(b=>Math.max(b.v,1)));
  const slot=(W-L-R)/bars.length,bw=Math.min(64,Math.round(slot*0.62));
  const base=H-B;

    const x=Math.round(L+slot*i+(slot-bw)/2);

      +`<text x="${x+bw/2}" y="${h?base-h-6:base-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${esc(b.text)}</text>`
      +`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--faint)">${esc(b.label)}</text>`;
  }).join('');

function websiteBand(d){

  const measuring=!!(t&&t.has_data);
  const tTrunc=!!(t&&t.truncated);
  // search, in the order things actually happen:
  //   gDown  — the read hiccuped. NOT the connect CTA (they may well be connected).
  //   gNoDom — the studio does NOT host this website and no address is on file.

  //            it; the only blocker is the address.

  const gDown=!!(g&&g.unavailable);
  const gNoDom=!!(g&&g.no_domain);
  const gDraft=!!(g&&g.draft);
  const gWait=!!(g&&g.waiting);

  const ga=(w&&w.ga)||null;

  // the drills land on the Insights section of this page (business-insights.html retired, Oct 2026)

  const recordAlt=gDraft&&g&&g.record_href
    ?`<p class="el" style="margin-top:6px">Already live on another platform? <a href="${esc(withScope(g.record_href))}">Record that website’s address</a> — its search numbers can start now, whoever hosts it.</p>`:'';

    :gNoDom?['Where is their website?','You don’t host this one, so there’s nothing to publish — Google reports on a domain whoever hosts it. Record their website address and their existing search numbers start arriving.']

    :['Not measured yet',notConnectedLine];

  let h=`<h2 class="band">Your website</h2>`;

  if(external){

      ?`<strong>Visitor numbers:</strong> via their connected Google Analytics — Google’s own measurement of their pages, not the studio counter.`

    h+=`<p class="bandnote">${esc(host.domain?`${host.domain} isn’t hosted by the studio.`:'This website isn’t hosted by the studio.')} `

    ...(measuring?{value:num(t.visitors),sub:`${num(t.pageviews)} page view${t.pageviews===1?'':'s'}`}
      // the external-site state 4d2e866 promised: when a connected Google Analytics holds the numbers, show them — labeled with their source
      :external&&gaOk?{value:num(ga.visitors),sub:`${num(ga.pageviews)} page view${ga.pageviews===1?'':'s'} · via Google Analytics${gscQual(ga.period)}`}
      :external?{empty:offSiteTile('Visitors')}
      :t?{empty:['Not measured yet','Visitor counts appear once your site is collecting them.']}
      :{empty:['Visitor counts hit a hiccup','Refresh in a moment.']})});
  h+=tile({icon:'tap',tone:'info',title:'Actions taken',window:win(tTrunc),link:external?null:[BI,'View'],
    ...(measuring?{value:num(t.actions),sub:'calls, emails & booking taps'}
      :external?{empty:offSiteTile('Calls, emails and booking taps')}
      :{empty:['Not measured yet','Calls, emails and booking taps will count up here.']})});
  const shortCta=gOk||gDown?'View':gNoDom?'Add address':gDraft?'Publish':'Connect';
  h+=tile({icon:'search',tone:'good',title:'Google clicks',link:searchCta?[searchCta[0],shortCta]:null,
    ...(gOk?{value:num(g.clicks),sub:`${num(g.impressions)} times seen in search${gscQual(g.period)}`}:{empty:searchParts('Connect Search Console to see your Google numbers.')})});
  {
    const top=measuring&&(t.top_sources||[])[0];
    h+=tile({icon:'source',tone:'warn',title:'Top source',window:tTrunc?'based on recent activity':'',link:external?null:[BI,'View'],
      ...(top?{value:esc(top.source),mod:'word',sub:`${num(top.share)}% of visits`}
        :external?{empty:offSiteTile('Where visitors come from')}
        :{empty:['Not measured yet','Where visitors come from shows up here.']})});
  }
  h+=`</div><div class="grid2">`;
  h+=card('','Visitors over time',based('Weekly, last 12 weeks',tTrunc),
    (measuring&&lineChart(t.weekly,'var(--c2)','visitors',d&&d.generated_at))
      ||(external?offSite('Visits over time'):emptyState('No visits yet','Once people start visiting, the trend shows here.')),
    external?null:[BI,'View website insights']);
  {
    let body=null;
    if(measuring&&(t.top_sources||[]).length){
      body=`<div class="srcs">${t.top_sources.map(s=>`<span>${esc(s.source)}</span><div class="progress" aria-hidden="true"><i style="width:${Math.max(0,Math.min(100,Number(s.share)||0))}%"></i></div><span class="n">${num(s.visits)}</span>`).join('')}</div>`;
    }
    h+=card('','Where visitors come from',measuring?`${num(t.visitors)} visitors · ${periodLabel()}${tTrunc?' · based on recent activity':''}`:based(periodLabel(),tTrunc),body||(external?offSite('Where visitors come from'):emptyState('No visits yet','Your visitor sources will appear here.')),[BI,'View website insights']);
  }
  {
    const rows=(measuring&&t.top_pages)||[];
    const body=rows.length?`<div class="rows">${rows.map(p=>`<div class="prow"><div class="t"><b>${esc(pageName(p.path))}</b><span>${esc(p.path)}</span></div><span class="n">${num(p.views)}</span></div>`).join('')}</div>`
      :emptyState('No page views yet','Your most-visited pages will be listed here.');
    h+=card('','Top pages',based(periodLabel(),tTrunc),body,[BI,'View website insights']);
  }
  {
    // Google search: the connection's state as a chip, the top searches when they
    // exist, and ONE next step (connect · publish · record the address · view)
    const rows=(gOk&&g.top_terms)||[];
    const chip=gOk?'<span class="chip good"><i class="d"></i>Connected</span>':gWait?'<span class="chip p"><i class="d"></i>Connected</span>':gDown?'<span class="chip"><i class="d"></i>Checking</span>':'<span class="chip"><i class="d"></i>Not connected</span>';
    const body=rows.length?`<div class="rows">${rows.map(q=>`<div class="prow"><div class="t"><b>${esc(q.term)}</b></div><span class="n">${num(q.clicks)}<small>clicks</small></span><span class="n">${num(q.impressions)}<small>seen</small></span></div>`).join('')}</div>`
      :gOk?emptyState('No search terms yet','What people search to find you will be listed here.')
      :searchEmpty('Connect Search Console to see what people search to find you.');
    const cta=searchCta?`<div class="crow"><span class="fine">${gOk||gDown?'What people searched to find you':gNoDom||gDraft?'':'Takes about a minute. Read-only.'}</span><a class="btn sm" href="${esc(withScope(searchCta[0]))}">${esc(searchCta[1])}</a></div>`:'';
    h+=`<section class="card" id="searchCard"><div class="card-h"><h3>Google search</h3><span class="hr">${chip}</span></div><div class="cb">${body}</div>${cta}</section>`;
  }
  h+=`</div>`;
  return h;
}

// ── render ──
function headRow(title,subline,withPeriod){
  return `<header class="toprow">
      <div><h1 class="title" id="pagehead" tabindex="-1">${esc(title)}</h1>
        <div class="subline">${subline}</div></div>
      <div class="actions">${withPeriod?`<div class="seg" id="period" role="group" aria-label="Period">${PERIODS.map(p=>`<button type="button" data-period="${p[0]}" aria-pressed="${PERIOD===p[0]?'true':'false'}">${p[1]}</button>`).join('')}</div>`:''}<button type="button" class="btn" id="refreshBtn">Refresh</button></div>
    </header>`;
}
function renderDash(d){
  let h=headRow('Analytics',`<span>Your business at a glance. Numbers only where they’re real.</span><span class="dot">·</span><span>As of ${esc(asOf(d.generated_at))}</span>`,true);
  h+=salesBand(d);
  h+=websiteBand(d);
  h+=`<section id="insights" tabindex="-1" aria-labelledby="insightsH"><h2 class="band" id="insightsH">Insights</h2><div id="insightsBody"><p class="muted">Reading what we can see…</p></div></section>`;
  $('main').innerHTML=h;
  wireDash();
  loadInsights();
}
// ── Insights: the platform's own evidence-backed observations (GET /business-insights),
//    read once per visit. A failed read says so in this section only; the board stands.
let INSIGHTS=null;
const scopedHref=(link)=>{if(!link)return null;const c=scope();if(!c||link.charAt(0)!=='/')return link;const [b,h]=String(link).split('#');return b+(b.includes('?')?'&':'?')+'client='+encodeURIComponent(c)+(h?'#'+h:'');};
function insightsHtml(b){
  const groups=(b&&b.groups)||[];
  if(!groups.length)return `<p class="muted">Nothing to report just yet. Once the website is published and getting visits and enquiries, calm observations appear here — only things we can measure.</p>`;
  return groups.map(g=>`<div class="ins-group"><p class="ins-label">${esc(g.label||'')}</p>${(g.observations||[]).map(o=>{const l=scopedHref(o.action_href);return `<article class="ins">
      <p class="lead">${esc(o.observation)}</p>${o.detail?`<p class="detail">${esc(o.detail)}</p>`:''}
      <dl><dt>Why it matters</dt><dd>${esc(o.why||'')}</dd><dt>Anything to do?</dt><dd>${esc(o.should_i||'')}</dd></dl>
      ${o.action_label&&l?`<a class="link act" href="${esc(l)}">${esc(o.action_label)}</a>`:''}</article>`;}).join('')}</div>`).join('')
    +`<p class="ins-foot">These are observations, not advice — nothing here is estimated.</p>`;
}
async function loadInsights(){
  const host=$('insightsBody');if(!host)return;
  if(!INSIGHTS){let r;try{r=await api('/business-insights');}catch(_){r={ok:false};}
    if(!r.ok){const h2=$('insightsBody');if(h2)h2.innerHTML=`<p class="muted">We couldn’t read your insights just now — the numbers above are unaffected.</p>`;return;}
    INSIGHTS=(r.body&&r.body.data)||{};}
  const h=$('insightsBody');if(!h)return;h.innerHTML=insightsHtml(INSIGHTS);
  if(location.hash==='#insights'){const s=$('insights');if(s){s.scrollIntoView({block:'start'});}}
}
function wireDash(){
  $('refreshBtn').addEventListener('click',()=>loadDash(true).then(()=>{const b=$('refreshBtn');if(b)b.focus();}));
  // PERIOD is committed only on a successful render (loadDash) — a failed
  // switch leaves the control and state exactly as they were. The segmented
  // control is plain buttons: no popup, so nothing to close and no focus to guard.
  document.querySelectorAll('#period [data-period]').forEach(b=>b.addEventListener('click',()=>{
    const p=b.getAttribute('data-period'); if(p===PERIOD)return;
    loadDash(true,p).then(()=>{const nb=document.querySelector(`#period [data-period="${PERIOD}"]`);if(nb)nb.focus();});
  }));
}

// stencil loading — layout-shaped gray blocks, shown only when the fetch runs
// >300ms (SLDS: no stencil flash on fast loads)
function renderStencil(title){
  $('main').innerHTML=`<header class="toprow"><div><h1 class="title" id="pagehead" tabindex="-1">${esc(title||'Analytics')}</h1></div></header>
    <p class="sr-only" role="status">Loading your dashboard</p>
    <div aria-hidden="true"><div class="st" style="height:92px;margin-top:18px"></div>
    <div class="grid2">${['','','',''].map(()=>`<div class="st" style="height:220px"></div>`).join('')}</div>
    <div class="st" style="height:92px;margin-top:16px"></div>
    <div class="grid2">${['','','',''].map(()=>`<div class="st" style="height:220px"></div>`).join('')}</div></div>`;
}

// ── page states ──
function warming(){$('main').innerHTML=`<div class="center"><h2>This dashboard is warming up.</h2><p class="muted">It’ll be ready in a moment — try again shortly.</p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load your analytics just now.</h2><p class="muted" style="margin-bottom:16px">A brief hiccup — try again.</p><button id="retry" class="btn">Try again</button></div>`;const rt=$('retry');if(rt)rt.addEventListener('click',()=>{load().catch(()=>trouble());});}   // Try again reloads in place (experience review #42)
function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to see your analytics.</h2><p style="margin-top:18px"><a class="link" href="/studio.html">Sign in →</a></p></div>`;}

// ── the agency portfolio lens (unscoped agency operators — SS7: the same
//    dashboard anatomy the scoped Business dashboard wears) ──
// Every number below is derived from the payload — clients/needs-attention/
// enquiries/live come from /analytics/portfolio's websites[] rollup; the
// per-client table reads /agency/portfolio (the one read that carries the
// edition/status and attention COUNT its columns render).
function insightCard(i){
  const tone=i.tone==='good'?'good':i.tone==='attention'?'warn':'p';
  const chipText=tone==='good'?'Good news':tone==='warn'?'Needs a look':'Worth knowing';
  // `sites`: one link PER CLIENT. A card that asks you to do something must say
  // where. Feature-detected on shape, so an older function build still renders
  // exactly its single href.
  const many=Array.isArray(i.sites)&&i.sites.length?i.sites.filter(s=>s&&s.href):null;
  const links=many&&many.length>1
    ?`<div class="links">${many.map(s=>`<a href="${esc(s.href)}">${esc(s.cta||s.name||'Open')}</a>`).join('')}</div>`
    :many&&many.length===1
    ?`<div class="links"><a href="${esc(many[0].href)}">${esc(many[0].cta||i.cta||'Take a look')}</a></div>`
    :i.href?`<div class="links"><a href="${esc(i.href)}">${esc(i.cta||'Take a look')}</a></div>`:'';
  return `<section class="card insight"><div class="card-h"><h3>${esc(i.title||'Across your clients')}</h3><span class="chip tchip ${tone}"><i class="d"></i>${chipText}</span></div>
    ${(i.number!=null&&i.number!=='')?`<p class="kn">${esc(i.number)}</p>`:''}<p class="isent">${esc(i.sentence)}</p>${i.detail?`<p class="kd">${esc(i.detail)}</p>`:''}${links}</section>`;
}
function portfolioRollup(roster,ws,vTrunc){
  // roster: /agency/portfolio rows (site_id · name · edition · status ·
  // attention · leads_waiting). null = that read FAILED — say so, never a
  // blank or an implied all-clear (failure ≠ empty).
  // SS7 item 3: visitors joined from the ENRICHED /analytics/portfolio
  // websites[] by site_id — feature-detected on the payload SHAPE, so an older
  // function build (rows without site_id/visitors) renders EXACTLY the shipped
  // table: no column, never an undefined-render. A null visitors value means
  // the visits read failed server-side → an honest —, never a fake 0.
  // vTrunc (data-honesty): the function's visitors_truncated marker — the bulk
  // visits read hit its cap, so NO per-client count is attributable as exact.
  const vs=Array.isArray(ws)&&ws.length&&ws.every(x=>x&&typeof x.site_id==='string'&&('visitors' in x))?new Map(ws.map(x=>[x.site_id,x.visitors])):null;
  let h=`<h2 class="band">Client by client</h2>`;
  if(roster===null){
    h+=`<div class="quiet" style="margin-top:0">The client-by-client list wouldn’t load just now — refresh in a moment. The numbers above are unaffected.</div>`;
    return h;
  }
  if(!roster.length){
    h+=`<div class="card">${emptyState('No clients yet','Businesses you add from your Studio tools will be listed here.')}</div>`;
    return h;
  }
  const rows=roster.map(c=>{
    const drill='/analytics.html?client='+encodeURIComponent(c.site_id||'');
    const att=Number(c.attention||0),lw=Number(c.leads_waiting||0);
    const v=vs?vs.get(c.site_id):undefined;
    const vcell=vs?`<td class="r">${(vTrunc||v==null)?'<span class="muted">—</span>':num(Number(v)||0)}</td>`:'';
    return `<tr data-drill="${esc(drill)}"><td><a href="${esc(drill)}">${esc(c.name||'(unnamed)')}</a></td><td>${esc(c.edition||'presence')}${c.status?' · '+esc(c.status):''}</td><td>${att?`<span class="pill wait">${num(att)} waiting</span>`:'<span class="pill ok">all clear</span>'}</td><td class="r">${num(lw)}</td>${vcell}</tr>`;
  }).join('');
  h+=`<div class="tscroll"><table><caption>Clients — plan, what’s waiting, enquiries${vs?', visitors':''}. Open a row for that client’s Business dashboard.</caption><thead><tr><th scope="col">Client</th><th scope="col">Plan</th><th scope="col">Waiting</th><th class="r" scope="col">Enquiries waiting</th>${vs?'<th class="r" scope="col">Visitors (7 days)</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`;
  // the one honest line for the — column: a partial count per client would be
  // wrong, so nothing pretends. Everything else in the table is exact.
  if(vs&&vTrunc)h+=`<p class="rollnote">A busy week — visits crossed what the portfolio can count client by client, so visitor numbers are hidden rather than shown short. The other columns are exact.</p>`;
  return h;
}
function renderPortfolio(d,roster){
  const ws=Array.isArray(d.websites)?d.websites:null;
  let h=headRow('Analytics',`<span class="chip p"><i class="d"></i>All clients</span><span>${esc(d.headline||'Across your clients.')}</span><span class="dot">·</span><span>As of ${esc(asOf())}</span>`,false);
  // KPI band — only from numbers the payload really carries (an older function
  // build without websites[] simply shows fewer tiles, never a fake zero)
  if(ws||d.client_count!=null){
    h+=`<h2 class="band">Across your clients</h2><div class="stats" id="portfolioStats">`;
    const clients=d.client_count!=null?d.client_count:ws.length;
    h+=tile({icon:'people',title:'Clients',link:['/agency.html','Open Studio'],value:num(clients),sub:'in your portfolio'});
    if(ws){
      const att=ws.filter(w=>w&&w.needs_attention).length;
      h+=tile({icon:'warn',tone:'warn',title:'Needs attention',value:num(att),mod:att?'warn':'',sub:att?'worth a look today':'all clear'});
      const enq=ws.reduce((a,w)=>a+(Number(w&&w.leads_waiting)||0),0);
      h+=tile({icon:'mail',tone:'info',title:'Enquiries waiting',value:num(enq),mod:enq?'warn':'',sub:enq?'not yet answered':'nothing waiting'});
      const live=ws.filter(w=>w&&w.draft_live==='live').length;
      h+=tile({icon:'live',tone:'good',title:'Sites live',value:num(live),sub:ws.length-live?`${num(ws.length-live)} still in draft`:'every site is live'});
    }
    h+=`</div>`;
  }
  // insight cards — the standard card anatomy (tone chip · title · number ·
  // sentence · links). An empty list on a SUCCESSFUL read is the honest
  // all-quiet; a failed read never reaches here (loadPortfolio → trouble).
  h+=`<h2 class="band">What stands out</h2>`;
  const ins=d.insights||[];
  // The all-quiet line speaks about "every client" — with ZERO clients that's a
  // contradiction, so the empty portfolio gets its own calm first-step line.
  const clientCount=d.client_count!=null?(Number(d.client_count)||0):(ws?ws.length:0);
  // Phase 3 (one source for numbers): this lens only sees the CLIENTS. The bell's
  // own count is patched in below once the shell context lands, so this line
  // never says "nothing needs you" on a day Today says four things do.
  if(!ins.length)h+=clientCount>0
    ?`<div class="quiet" id="allQuiet" style="margin-top:0"><b>All quiet.</b> Every client is current — <span id="allQuietStudio">nothing needs you right now.</span></div>`
    :`<div class="quiet" style="margin-top:0"><b>Nothing to watch yet.</b> Add your first client from your Studio tools and their numbers will roll up here.</div>`;
  if(!ins.length&&clientCount>0&&window.ddsContext)window.ddsContext().then(ctx=>{
    const n=ctx&&Number(ctx.attention_count)||0; const el=document.getElementById('allQuietStudio'); if(!el||!n)return;
    el.innerHTML=`${n===1?'one thing needs you':n+' things need you'} in your own studio — <a href="/today.html">see Today</a>.`;
  }).catch(()=>{});
  if(ins.length)h+=`<div class="grid3" style="margin-top:0">${ins.map(insightCard).join('')}</div>`;
  h+=portfolioRollup(roster,ws,d.visitors_truncated===true);
  h+=`<div class="print noprint"><button type="button" class="btn" onclick="window.print()">Print this summary</button></div>`;
  $('main').innerHTML=h;
  const rb=$('refreshBtn');if(rb)rb.addEventListener('click',()=>loadPortfolio(true).then(()=>{const b=$('refreshBtn');if(b)b.focus();}));
  // row click drills into the client's scoped Business dashboard; the name link
  // inside carries the keyboard/AT path, so plain rows stay non-focusable
  document.querySelectorAll('.tscroll tr[data-drill]').forEach(tr=>tr.addEventListener('click',(e)=>{
    if(e.target.closest('a'))return;   // the real link handles itself
    location.href=tr.getAttribute('data-drill');
  }));
}

// ── load (deploy-order tolerant BOTH ways: a 404 from an old function is a calm
//    "warming up", never a broken page) ──
// Request-generation guard: a slow response that resolves after a newer request
// started is DISCARDED — it can never overwrite the board mislabeled. PERIOD
// commits only on a successful render (commit-on-success): a failed or stale
// switch leaves the control and state untouched, so the next Refresh can't
// silently swap periods.
let REQ_SEQ=0;
async function loadDash(soft,nextPeriod){
  const period=nextPeriod||PERIOD;
  const gen=++REQ_SEQ;
  let stencilTimer=null;
  if(!soft)stencilTimer=setTimeout(()=>{if(!DASH)renderStencil();},300);
  let r; try{r=await api('/analytics/dashboard?period='+encodeURIComponent(period));}catch(_){r={ok:false,status:0};}
  if(stencilTimer)clearTimeout(stencilTimer);
  if(gen!==REQ_SEQ)return;   // a newer request started — this response is stale
  if(!r.ok){
    if(r.status===401){signedOut();return;}   // session ended mid-visit — not a toast loop
    if(soft&&DASH){toast('Couldn’t refresh just now.');return;}
    if(r.status===403){$('main').innerHTML=`<div class="center"><h2>Analytics lives in your full workspace.</h2></div>`;return;}
    if(r.status===404){warming();return;}
    trouble();return;
  }
  const data=r.body.data||{};
  // belt-and-braces: if the server echoes a period, it must be the one we asked
  // for — otherwise this response can't honestly label the board
  if(data.period&&data.period!==period)return;
  PERIOD=period;   // commit only now — render below derives the pressed segment from it
  DASH=data;
  renderDash(DASH);
}
// ── the portfolio lens loader — same discipline as loadDash: REQ_SEQ stale
//    guard, >300ms stencil, and honest states (401 → signed out, 404 → warming,
//    soft-refresh failure keeps the last good board + a toast, anything else →
//    trouble; a failed read NEVER paints the all-quiet card). The /agency/
//    portfolio companion read only feeds the per-client rollup — its failure
//    degrades that one section honestly, never the whole page.
let PF=null,ROSTER=null;   // ROSTER: the last GOOD /agency/portfolio rows (soft-refresh keep-last-good)
async function loadPortfolio(soft){
  const gen=++REQ_SEQ;
  let stencilTimer=null;
  if(!soft)stencilTimer=setTimeout(()=>{if(!PF)renderStencil('Analytics');},300);
  let r,a;
  try{
    [r,a]=await Promise.all([
      api('/analytics/portfolio').catch(()=>({ok:false,status:0})),
      api('/agency/portfolio').catch(()=>({ok:false,status:0})),
    ]);
  }catch(_){r={ok:false,status:0};a={ok:false,status:0};}
  if(stencilTimer)clearTimeout(stencilTimer);
  if(gen!==REQ_SEQ)return;   // a newer request started — this response is stale
  if(!r.ok){
    if(r.status===401){signedOut();return;}
    if(soft&&PF){toast('Couldn’t refresh just now.');return;}
    if(r.status===403){await loadDash();return;}   // context said agency, portfolio says no — fall back to the business dashboard
    if(r.status===404){warming();return;}
    trouble();return;
  }
  PF=r.body.data||{};
  // The roster read degrades ONLY its own section — and with loadDash's
  // keep-last-good discipline: on a SOFT ↻ refresh a failed roster keeps the
  // previous good rows + a toast, instead of replacing them with the
  // couldn't-load line. A first (hard) load has no last-good, so it keeps the
  // honest couldn't-load line.
  const roster=(a&&a.ok&&Array.isArray(a.body.data))?a.body.data:null;
  if(roster!==null)ROSTER=roster;
  else if(soft&&ROSTER)toast('Couldn’t refresh the client list just now.');
  else ROSTER=null;
  renderPortfolio(PF,ROSTER);
}
async function load(){
  // Agency, unscoped → the portfolio lens (SS7). Otherwise the business dashboard.
  if(CTX&&CTX.is_agency&&!scope()){await loadPortfolio();return;}
  await loadDash();
}
(async function(){try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";if(!TOKEN){signedOut();return;}const c=await (window.ddsContext?window.ddsContext().then((d)=>({ok:true,body:{data:d}})):Promise.reject()).catch(()=>api('/portal/context'));CTX=(c.ok&&c.body.data)||{};await load();}catch(_){trouble();}})();
</script>
