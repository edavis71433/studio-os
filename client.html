<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your updates</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Review and approve what your studio has ready for you.">
<style>
  :root{
    --bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;
    --p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--warn-soft:#f3ead9;
    --shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding:40px 20px 90px}
  .rolebadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:5px 12px;font-family:var(--sans)}
  header h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,5vw,34px);margin:16px 0 .1em;letter-spacing:-.01em}
  header .sub{color:var(--soft);font-size:15px;margin:0}
  .status{margin-top:22px;padding:14px 18px;background:var(--good-soft);border-radius:13px;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:10px}
  .status .d{width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 auto}
  section{margin-top:34px}
  h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 5px;line-height:1.2}
  .card p{margin:0;color:var(--soft);font-size:14.5px}
  .card.approve{border-left:3px solid var(--p)}
  .row{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 17px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--p);color:var(--p)} button:disabled{opacity:.5;cursor:default}
  button.approve{background:var(--p);color:#fff;border-color:var(--p)} button.approve:hover{background:var(--p-deep);color:#fff}
  .tag{display:inline-block;font-size:11px;font-family:var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--p);background:var(--p-soft);border-radius:999px;padding:3px 9px;font-weight:600;margin-bottom:9px}
  .center{text-align:center;padding:52px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 8px}
  .muted{color:var(--soft);font-size:14px}
  a.link{color:var(--p);text-decoration:none;font-weight:600} a.link:hover{text-decoration:underline}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ── UX upgrades: focus, bell/panel, chip-bar, skeletons, welcome ── */
  a:focus-visible,button:focus-visible,[tabindex]:focus-visible,.card[role="button"]:focus-visible,.nitem:focus-visible,.chip:focus-visible{outline:3px solid var(--p);outline-offset:2px;border-radius:12px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .bell{position:relative;width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .bell .badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--p);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;border:2px solid var(--bg)}
  .bell .badge.on{display:flex}
  .notifpanel{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin:12px 0 4px;overflow:hidden}
  .notifpanel[hidden]{display:none}
  .ngroup{padding:11px 16px 3px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .nempty{padding:20px 16px;color:var(--soft);font-size:14px}
  .nitem{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:13px 16px;cursor:pointer;transition:background .12s}
  .nitem:first-of-type{border-top:0}
  .nitem:hover{background:var(--p-soft);color:var(--ink);border-color:var(--line)}
  .nitem .nt{font-weight:600;font-size:14.5px;color:var(--ink);display:block}
  .nitem.unread .nt::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p);margin-right:8px;vertical-align:middle}
  .nitem .nw{color:var(--soft);font-size:12.5px;margin-top:2px;display:block}
  .chipbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:11px 20px;margin:8px -20px 4px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chipbar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--p);color:var(--p)}
  section[id^="sec-"],#sec-overview{scroll-margin-top:64px}
  .welcome{border-left:3px solid var(--p);position:relative}
  .welcome .x{position:absolute;top:12px;right:14px;width:30px;height:30px;padding:0;border-radius:999px;font-size:16px;line-height:1;color:var(--soft);border-color:transparent}
  .welcome h3{padding-right:34px}
  .skel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
  .skel .l{height:13px;border-radius:7px;background:var(--line);margin:9px 0;background-image:linear-gradient(90deg,var(--line) 0%,var(--p-soft) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.3s ease-in-out infinite}
  .skel .l.w60{width:60%}.skel .l.w40{width:40%}.skel .l.w80{width:80%}
  @keyframes sh{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.spin,.skel .l{animation:none}html{scroll-behavior:auto}}
  html{scroll-behavior:smooth}
  /* ── persistent portal nav: bottom tab bar (mobile) → top rail (wider) ── */
  .tabnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(27,21,37,.07);padding-bottom:env(safe-area-inset-bottom)}
  .tabnav[hidden]{display:none}
  .tabnav-inner{max-width:660px;margin:0 auto;display:flex;justify-content:space-around}
  .tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:0;background:transparent;color:var(--soft);padding:8px 2px 9px;font-size:11px;font-weight:600;cursor:pointer;min-height:52px}
  .tab .ti{font-size:19px;line-height:1}
  .tab:hover{color:var(--p)}
  .tab[aria-current="page"]{color:var(--p)}
  .toast{z-index:40}
  @media (max-width:719px){.toast{bottom:74px}}
  @media (min-width:720px){
    .tabnav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding-bottom:0}
    .tabnav-inner{justify-content:center;gap:4px}
    .tab{flex:0 0 auto;flex-direction:row;gap:7px;font-size:13.5px;padding:13px 16px;min-height:0}
    .tab .ti{font-size:15px}
    .tab[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--p)}
    .chipbar{top:56px}
    section[id^="sec-"],#sec-overview{scroll-margin-top:118px}
  }
  /* ── group heading (Files by project) — normal case, not the uppercase eyebrow ── */
  .grouphd{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--ink);text-transform:none;letter-spacing:0;margin:0 0 12px}
  /* ── vertical project timeline (milestones) ── */
  .timeline{list-style:none;margin:0;padding:0}
  .tl-node{position:relative;padding:0 0 20px 30px}
  .tl-node::before{content:"";position:absolute;left:8px;top:16px;bottom:-4px;width:2px;background:var(--line)}
  .tl-node:last-child::before{display:none}
  .tl-dot{position:absolute;left:2px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
  .tl-node.done .tl-dot{background:var(--good);border-color:var(--good)}
  .tl-node.done::before{background:var(--good)}
  .tl-node.current .tl-dot{background:var(--p);border-color:var(--p);box-shadow:0 0 0 4px var(--p-soft)}
  .tl-body h3{font-family:var(--serif);font-weight:500;font-size:17px;margin:0;line-height:1.25}
  .tl-meta{color:var(--soft);font-size:13.5px;margin:2px 0 0}
  .tl-here{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--p);background:var(--p-soft);border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle}
  @media (prefers-reduced-motion:no-preference){.tl-node.current .tl-dot{animation:tlpulse 2.2s ease-in-out infinite}}
  @keyframes tlpulse{0%,100%{box-shadow:0 0 0 4px var(--p-soft)}50%{box-shadow:0 0 0 7px var(--p-soft)}}
  /* ── FAQ / Help ── */
  .faq{margin:0}
  .faq-intro{color:var(--soft);font-size:14.5px;margin:0 0 12px}
  details.faq-item{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  details.faq-item[hidden]{display:none}
  details.faq-item>summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:600;font-size:15.5px;color:var(--ink)}
  details.faq-item>summary::-webkit-details-marker{display:none}
  details.faq-item>summary::after{content:"+";float:right;color:var(--p);font-weight:700}
  details.faq-item[open]>summary::after{content:"–"}
  .faq-answer{padding:0 18px 15px;color:var(--soft);font-size:14.5px}
  .faq-answer a{color:var(--p)}
</style>
<script>
// Self-contained client portal: the operator shell (shell.css/shell.js) is
// intentionally NOT loaded here — this page owns its own nav (#tabnav), bell,
// help, sign-out and appearance. Apply a saved Light/Dark choice before paint;
// with no choice stored the portal follows the device (prefers-color-scheme).
(function(){try{var t=localStorage.getItem('dds-client-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(_){}})();
</script>
</head>
<body>
<nav id="tabnav" class="tabnav" aria-label="Portal sections" hidden></nav>
<div class="wrap">
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>by Davis Digital Studio — you see only what your studio shares with you.<br><a class="link" href="#" id="signout" style="font-size:12.5px">Sign out</a></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
// The simplified Client Portal (A7.2). Consumes ONLY /portal/context + /portal/feed
// + the approval decide routes — the reviewer boundary is enforced server-side, so
// this can never over-expose. Review-first: see shared updates, approve what's ready.
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-client-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="";
sb.auth.onAuthStateChange(function(_e,s){if(s&&s.access_token)TOKEN=s.access_token;}); // keep token fresh (auto-refresh)
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':(new URLSearchParams(location.search).get('client')||'')});
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
function toast(m){if(window.ddsToast)return void ddsToast(m);const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
// relative "when" — calm, human, no clock precision
function rel(iso){const t=Date.parse(iso);if(!isFinite(t))return'';const s=Math.floor((Date.now()-t)/1000);if(s<60)return'just now';const m=Math.floor(s/60);if(m<60)return m+(m===1?' min ago':' mins ago');const h=Math.floor(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');const d=Math.floor(h/24);if(d<7)return d+(d===1?' day ago':' days ago');return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
let USER=null; // the signed-in session user (for name/email in the welcome + settings cards)

// ── PURE UX helpers (mirrored 1:1 in tests/presence/portal_ux_test.mjs) ──
// Which in-project section chips have content worth an anchor. Messages + Support
// always exist (composer / open-a-request CTA); the rest are content-gated.
function chipsFor(d){
  d=d||{};const chips=[];
  if(d.hasOverview)chips.push({id:'sec-overview',label:'Overview'});
  if((d.approvals||[]).filter(a=>a&&a.status==='pending').length)chips.push({id:'sec-approvals',label:'Approvals'});
  if((d.deliverables||[]).length)chips.push({id:'sec-files',label:'Files'});
  if(d.hasMessages)chips.push({id:'sec-messages',label:'Messages'});
  if(d.hasSupport)chips.push({id:'sec-support',label:'Support'});
  return chips;
}
// Calm recency buckets for the What's-new panel.
function notifBucket(iso,nowMs){const t=Date.parse(iso);if(!isFinite(t))return'Earlier';const days=Math.floor((nowMs-t)/86400000);if(days<=0)return'Today';if(days<7)return'This week';return'Earlier';}
function groupNotifs(items,nowMs){const order=['Today','This week','Earlier'];const map={};for(const it of(items||[])){const b=notifBucket(it&&it.created_at,nowMs);(map[b]=map[b]||[]).push(it);}return order.filter(b=>map[b]&&map[b].length).map(b=>({bucket:b,items:map[b]}));}
// Map a notification's anchor (#approvals, #task-…, #support-…) to a chip section id.
function sectionForAnchor(a){a=String(a||'').replace(/^#/,'');if(a.indexOf('approval')===0)return'sec-approvals';if(a.indexOf('file')===0||a.indexOf('deliverable')===0)return'sec-files';if(a.indexOf('message')===0)return'sec-messages';if(a.indexOf('support')===0)return'sec-support';if(a.indexOf('survey')===0)return'sec-surveys';if(a.indexOf('milestone')===0)return'sec-milestones';if(a.indexOf('task')===0)return'sec-todos';return'sec-overview';}
// A friendly first name from the session user, or '' — never guessy.
function firstName(u){if(!u)return'';const m=(u.user_metadata||{});const n=(m.name||m.full_name||'').trim();if(n)return n.split(/\s+/)[0];const e=(u.email||'').split('@')[0];if(e&&/^[a-z]+([._-][a-z]+)?$/i.test(e)){const p=e.split(/[._-]/)[0];return p.charAt(0).toUpperCase()+p.slice(1);}return'';}

// Appearance (Light / Dark / System) — self-contained, the client's own choice
// ("it's their eyes"), stored under the client realm. No operator shell needed.
function clientTheme(){try{return localStorage.getItem('dds-client-theme')||'';}catch(_){return'';}}
function themeLabel(){const t=clientTheme();return 'Appearance: '+(t==='light'?'Light':t==='dark'?'Dark':'System');}
function cycleClientTheme(){let t=clientTheme();t=t===''?'light':t==='light'?'dark':'';try{t?localStorage.setItem('dds-client-theme',t):localStorage.removeItem('dds-client-theme');}catch(_){}if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');}
function scrollToSection(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:(matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'),block:'start'});}
function skeleton(){return'<div class="skel"><div class="l w40"></div><div class="l w80"></div></div><div class="skel"><div class="l w60"></div><div class="l"></div><div class="l w80"></div></div><div class="skel"><div class="l w40"></div><div class="l w60"></div></div>';}
// Route a notification's href to the right in-portal view (no full navigation).
function navFromHref(href){
  href=String(href||'');
  const sup=href.match(/support=([0-9a-f-]{8,})/i);if(sup){openSupportThread(sup[1],null);return;}
  const pm=href.match(/\/projects\/([0-9a-f-]{8,})(#[a-z0-9-]+)?/i);
  if(pm){openProject(pm[1],pm[2]?sectionForAnchor(pm[2]):null);return;}
}

// ── PERSISTENT PORTAL NAV + cross-tab client state ──
// One always-visible nav (bottom tab bar on phones, top rail on wider screens),
// reachable from every view because it lives OUTSIDE #main (innerHTML rewrites
// never touch it). Home aggregates ACROSS projects; the other tabs are top-level
// destinations over the SAME existing /client/* + /portal/* reads — no new backend.
const PORTAL={ready:false,persona:'',ctx:{},projects:[],feed:{},unread:0,notifs:[],billing:null,snaps:null};
let CURRENT_TAB='home';
const TABS=[['home','🏠','Home'],['messages','💬','Messages'],['files','📁','Files'],['invoices','🧾','Invoices'],['requests','✨','Requests'],['help','❓','Help']];
function showNav(){
  const nav=$('tabnav');if(!nav)return;
  nav.innerHTML=`<div class="tabnav-inner">`+TABS.map(t=>`<button class="tab" type="button" data-tab="${t[0]}"><span class="ti" aria-hidden="true">${t[1]}</span><span class="tl">${t[2]}</span></button>`).join('')+`</div>`;
  nav.hidden=false;
  nav.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.getAttribute('data-tab'))));
  setActiveTab(CURRENT_TAB);
}
function hideNav(){const nav=$('tabnav');if(nav){nav.hidden=true;nav.innerHTML='';}}
function setActiveTab(tab){const nav=$('tabnav');if(!nav)return;nav.querySelectorAll('.tab').forEach(b=>{if(b.getAttribute('data-tab')===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function showTab(tab){
  CURRENT_TAB=tab;setActiveTab(tab);try{window.scrollTo(0,0);}catch(_){}
  if(tab==='messages')return renderMessages();
  if(tab==='files')return renderFiles();
  if(tab==='invoices')return renderInvoices();
  if(tab==='requests')return renderRequests();
  if(tab==='help')return renderHelp();
  return renderHome();
}
function goHome(){showTab('home');}
// small shared building blocks for the tab views
function portalHeader(title,sub){return `<header><h1>${esc(title)}</h1>${sub?`<p class="sub">${esc(sub)}</p>`:''}</header>`;}
function emptyCard(msg){return `<div class="card"><p class="muted">${esc(msg)}</p></div>`;}
function spinnerHtml(){return '<div class="spin" role="status" aria-label="Loading"></div>';}
// billing (invoices) — cached per full load; degrades to empty for a reviewer
async function ensureBilling(){if(PORTAL.billing)return PORTAL.billing;try{const r=await api('/client/billing');PORTAL.billing=(r.ok&&r.body&&r.body.data)||{invoices:[]};}catch(_){PORTAL.billing={invoices:[]};}return PORTAL.billing;}
function unpaidInvoices(b){return ((b&&b.invoices)||[]).filter(i=>i&&i.status!=='paid'&&i.status!=='void'&&i.status!=='canceled');}
// per-project snapshots (the full client bundle, capped) — shared by Home + Files
async function ensureSnaps(){
  if(PORTAL.snaps)return PORTAL.snaps;
  const list=PORTAL.projects.slice(0,8);
  PORTAL.snaps=await Promise.all(list.map(async(p)=>{
    try{const r=await api('/client/projects/'+p.id);const d=(r&&r.body&&r.body.data)||{};const prog=d.progress||{};
      return {id:p.id,name:p.name,pct:prog.pct,total:prog.total,
        approvals:(d.approvals||[]).filter(a=>a&&a.status==='pending'),
        todos:(d.tasks||[]).filter(t=>t&&t.client_action_required&&t.status!=='done'),
        surveys:(d.surveys||[]),deliverables:(d.deliverables||[])};
    }catch(_){return {id:p.id,name:p.name,approvals:[],todos:[],surveys:[],deliverables:[]};}
  }));
  return PORTAL.snaps;
}
// shared deliverable download (Files tab + a project's Files section reuse it)
async function downloadDeliverable(id){const r=await api('/client/deliverables/'+id+'/download');if(r.ok&&r.body.data&&r.body.data.url)window.open(r.body.data.url,'_blank','noopener');else toast('That file isn’t available.');}
function wireDownloads(root){(root||document).querySelectorAll('[data-dl]').forEach(b=>b.addEventListener('click',()=>downloadDeliverable(b.getAttribute('data-dl'))));}
// vertical timeline over data.milestones (ordered by sort_order server-side):
// complete → done, the first still-open one → "you are here / Next up", rest upcoming.
function tlDate(x){const t=Date.parse(x);return isFinite(t)?new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';}
function timelineHtml(ms){
  let firstOpen=true,h='<ol class="timeline">';
  for(const m of (ms||[])){
    const done=m.status==='complete';let state,label;
    if(done){state='done';const w=tlDate(m.completed_at);label='✓ Done'+(w?` · ${w}`:'');}
    else if(firstOpen){state='current';firstOpen=false;label='Next up'+(m.due_date?` · due ${m.due_date}`:'');}
    else{state='upcoming';label='Upcoming'+(m.due_date?` · due ${m.due_date}`:'');}
    h+=`<li class="tl-node ${state}"><span class="tl-dot" aria-hidden="true"></span><div class="tl-body"><h3>${esc(m.title)}</h3><p class="tl-meta">${esc(label)}${state==='current'?'<span class="tl-here">You’re here</span>':''}</p></div></li>`;
  }
  return h+'</ol>';
}
async function decideFeed(path,decision,btn){btn.disabled=true;const r=await api(path,'POST',{decision});if(r.ok){toast(decision==='approve'?'Approved — thank you.':'Noted — your studio has been told. Nothing changed.');return load();}toast('That didn’t go through — please try again.');btn.disabled=false;}

// ── HOME — aggregates ACROSS all projects (needs-you · projects · updates) ──
function projectCardsHtml(projects){
  if(!projects.length)return emptyCard('When your studio starts a project, it’ll appear here with your tasks, files, and approvals.');
  let h='';
  for(const p of projects){h+=`<div class="card" role="button" tabindex="0" data-proj="${esc(p.id)}"><h3>${esc(p.name)}</h3><p>Status: ${esc((p.status||'').replace(/_/g,' '))}${p.target_date?` · target ${esc(p.target_date)}`:''}</p><p class="muted" id="glance-${esc(p.id)}" style="margin-top:4px"></p></div>`;}
  return h;
}
function renderHome(){
  const P=PORTAL,projects=P.projects,feed=P.feed||{};
  const badge=P.unread?`<span class="badge on" aria-hidden="true">${P.unread>9?'9+':P.unread}</span>`:'<span class="badge" aria-hidden="true"></span>';
  let html=`<div class="topbar"><div class="rolebadge">● ${projects.length?'Your workspace':'Client view'}</div>`+
    `<button id="bell" class="bell" aria-label="What’s new${P.unread?` — ${P.unread} new`:''}" aria-expanded="false" aria-haspopup="true">🔔${badge}</button></div>`+
    `<div id="np" class="notifpanel" role="region" aria-label="What’s new" hidden></div>`+
    `<header><h1>Home</h1><p class="sub">Everything your studio is doing with you, in one place.</p></header>`;
  html+=welcomeCardHtml();
  html+=`<section id="home-needs"><h2>Needs you</h2><div id="needs-body">${emptyCard('Checking what needs you…')}</div></section>`;
  html+=`<section><h2>Your projects</h2>${projectCardsHtml(projects)}</section>`;
  html+=`<section><h2>Recent updates</h2>`;
  const moments=(feed.moments||[]);
  if(!moments.length)html+=emptyCard('Nothing new to share right now — your studio will surface anything worth a look here.');
  else for(const m of moments)html+=`<div class="card"><h3>${esc(m.headline)}</h3><p>${esc(m.summary)}</p></div>`;

  buildNeedsYou();
}
// Fill glances + the aggregated "Needs you" list from feed + per-project snapshots
// + unpaid invoices. Everything here is a clear, single action.
async function buildNeedsYou(){
  const [snaps,billing]=await Promise.all([ensureSnaps(),ensureBilling()]);
  for(const s of snaps){const el=document.getElementById('glance-'+s.id);if(!el)continue;const bits=[];const waiting=s.approvals.length+s.todos.length;if(s.pct!=null&&s.total>0)bits.push(s.pct+'% along');if(waiting>0)bits.push(`<strong style="color:var(--warn)">${waiting} thing${waiting===1?'':'s'} need${waiting===1?'s':''} your OK</strong>`);el.innerHTML=bits.join(' · ');}
  const body=document.getElementById('needs-body');if(!body)return;
  const items=[];
  for(const p of (PORTAL.feed.pending_approvals||[])){items.push(`<div class="card approve"><span class="tag">${esc(p.kind==='connected'?'Connected':'Change')}</span><h3>${esc(p.title||'A change is ready')}</h3><p>${esc(p.summary||'')}</p><div class="row"><button class="approve" data-approve="${esc(p.decide_path)}">Approve</button><button data-decline="${esc(p.decide_path)}">Not yet</button></div></div>`);}
  for(const s of snaps){
    for(const a of s.approvals)items.push(`<div class="card approve"><span class="tag">Approval</span><h3>${esc(a.title||'A change is ready')}</h3><p>${esc(s.name)}${a.summary?` · ${esc(a.summary)}`:''}</p><div class="row"><button data-open-proj="${esc(s.id)}" data-open-sec="sec-approvals">Review →</button></div></div>`);
    if(s.todos.length)items.push(`<div class="card"><span class="tag">To-do</span><h3>${s.todos.length} thing${s.todos.length===1?'':'s'} for you</h3><p>${esc(s.name)}</p><div class="row"><button data-open-proj="${esc(s.id)}" data-open-sec="sec-todos">Open →</button></div></div>`);
    for(const sv of s.surveys)items.push(`<div class="card"><span class="tag">Survey</span><h3>${esc(sv.title||'A quick survey')}</h3><p>${esc(s.name)}</p><div class="row"><button data-open-survey="${esc(sv.id)}" data-survey-proj="${esc(s.id)}">Answer →</button></div></div>`);
  }
  for(const i of unpaidInvoices(billing)){items.push(`<div class="card"><span class="tag">Invoice</span><h3>${esc(i.name||'Invoice')}</h3><p>${i.amount?('$'+esc(String(i.amount))+' · '):''}${esc((i.status||'').replace('_',' '))}${i.due_date?` · due ${esc(i.due_date)}`:''}</p><div class="row">${i.pay_url?`<a class="link" href="${esc(i.pay_url)}" target="_blank" rel="noopener">Pay →</a>`:`<button data-tab-go="invoices">View →</button>`}</div></div>`);}
  if(!items.length){body.innerHTML=`<div class="card"><p><strong>You’re all caught up.</strong></p><p class="muted" style="margin-top:4px">Nothing needs you right now — we’ll flag anything here the moment it does.</p></div>`;return;}
  body.innerHTML=items.join('');
  body.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',()=>decideFeed(b.getAttribute('data-approve'),'approve',b)));
  body.querySelectorAll('[data-decline]').forEach(b=>b.addEventListener('click',()=>decideFeed(b.getAttribute('data-decline'),'abandon',b)));
  body.querySelectorAll('[data-open-proj]').forEach(b=>b.addEventListener('click',()=>openProject(b.getAttribute('data-open-proj'),b.getAttribute('data-open-sec'))));
  body.querySelectorAll('[data-open-survey]').forEach(b=>b.addEventListener('click',()=>openSurvey(b.getAttribute('data-open-survey'),b.getAttribute('data-survey-proj'))));
  body.querySelectorAll('[data-tab-go]').forEach(b=>b.addEventListener('click',()=>showTab(b.getAttribute('data-tab-go'))));
}

// ── FILES — every shared file, grouped by project ──
async function renderFiles(){
  $('main').innerHTML=spinnerHtml();
  const [snaps,docsRes]=await Promise.all([ensureSnaps(),api('/client/documents').catch(()=>null)]);
  const withFiles=snaps.filter(s=>s.deliverables&&s.deliverables.length);
  const docs=(docsRes&&docsRes.ok&&docsRes.body.data&&docsRes.body.data.documents)||[];
  let html=portalHeader('Files & documents','Everything your studio has shared — files, proposals, and agreements.');
  // Documents section: proposals & agreements the client can re-open any time (a top
  // portal gap — before this they were reachable only from the original email).
  if(docs.length){
    html+=`<section><h2 class="grouphd">Documents</h2>`;
    for(const d of docs){
      const kindLabel=d.kind==='contract'?'Agreement':'Proposal';
      const statusLabel=d.kind==='contract'?(d.signed_at?'Signed':'Awaiting signature'):(d.status==='accepted'?'Accepted':d.status==='declined'?'Declined':'Sent');
      const view=d.view_url?`<a class="btn" href="${esc(d.view_url)}" target="_blank" rel="noopener">View</a>`:'';
      html+=`<div class="card"><h3>${esc(d.title)}</h3><p>${kindLabel} · ${esc(statusLabel)}</p><div class="row">${view}</div></div>`;
    }
    html+=`</section>`;
  }
  if(!withFiles.length&&!docs.length){html+=emptyCard('No files yet. When your studio shares a document, design, or download, it’ll appear here.');$('main').innerHTML=html;return;}
  for(const s of withFiles){
    html+=`<section><h2 class="grouphd">${esc(s.name)}</h2>`;
    for(const f of s.deliverables)html+=`<div class="card"><h3>${esc(f.title)}</h3><p>${esc(f.note||'Shared with you')}</p><div class="row"><button data-dl="${esc(f.id)}">Download</button></div></div>`;
    html+=`</section>`;
  }
  $('main').innerHTML=html;
  wireDownloads(document);
}
// ── INVOICES — the studio's service invoices (separate from the SaaS subscription) ──
// appendBilling renders the invoice cards (service billing = the studio's project
// invoices, explicitly distinct from the Studio OS software subscription).
function appendBilling(inv){
  let h=`<p class="muted" style="margin:-14px 0 14px">Your website subscription is billed separately.</p>`;
  for(const i of (inv||[]))h+=`<div class="card"><h3>${esc(i.name||'Invoice')}</h3><p>${i.amount?('Amount: $'+esc(String(i.amount))+' · '):''}${esc((i.status||'').replace('_',' '))}${i.due_date?(' · due '+esc(i.due_date)):''}</p>${i.pay_url?`<p><a class="link" href="${esc(i.pay_url)}" target="_blank" rel="noopener">Pay this invoice →</a></p>`:(i.paid_at?'<p class="muted">Paid — thank you.</p>':'<p class="muted">Your studio will send payment details.</p>')}</div>`;
  return h;
}
async function renderInvoices(){
  $('main').innerHTML=spinnerHtml();
  const b=await ensureBilling();const inv=(b&&b.invoices)||[];

// ── REQUESTS (R2) — the studio's service catalog + your open requests ─────────
// Pick a service → a structured brief → a PENDING request the studio reviews.
// Nothing is ever charged or ordered automatically (the moat). A reviewer with
// no service-link just sees the calm empty state, never an error.
async function renderRequests(){
  $('main').innerHTML=spinnerHtml();
  const canMessage=PORTAL.persona==='client';
  let list=[],services=[];
  try{const[sr,svr]=await Promise.all([api('/client/support'),api('/client/services')]);
    list=(((sr&&sr.body&&sr.body.data)||[])).filter(x=>x&&x.id);
    services=(((svr&&svr.body&&svr.body.data)||[])).filter(x=>x&&x.id);
  }catch(_){}
  let html=portalHeader('Requests','Browse what your studio offers and ask for what you need. Nothing is charged automatically — every request is reviewed first.');
  // ── service catalog ──
  html+=`<section><h2>Request a service</h2>`;
  if(!services.length)html+=emptyCard('Your studio hasn’t listed services here yet — you can still message them for anything you need using the button below.');
  else{
    for(const svc of services){
      html+=`<div class="card"><h3>${esc(svc.name)}</h3>`+
        `${svc.category?`<p class="muted" style="margin:-2px 0 6px;font-size:12.5px">${esc(svc.category)}</p>`:''}`+
        `${svc.description?`<p>${esc(svc.description)}</p>`:''}`+
        `${svc.price?`<p class="muted" style="margin-top:6px">${esc(svc.price)}</p>`:''}`+
        `${canMessage?`<div class="row"><button class="approve" data-svc="${esc(svc.id)}">Request this</button></div>`:''}</div>`;
    }
  }
  html+=`</section>`;
  // ── generic "something else" ──
  if(canMessage)html+=`<section><div class="card"><h3>Something else?</h3><p class="muted">Not sure which service fits, or need something custom? Tell your studio what you have in mind — they’ll reply with next steps. Nothing is charged automatically.</p><div class="row"><button id="newReq">Message your studio</button></div></div></section>`;
  // ── your open requests ──
  html+=`<section><h2>Your requests</h2>`;
  if(!list.length)html+=emptyCard('You haven’t made any requests yet. When you ask your studio for something, you’ll be able to track it here.');
  else for(const rq of list){const resolved=rq.status==='resolved'||rq.status==='closed';html+=`<div class="card"><h3>${esc(rq.subject)}</h3><p><span class="tag">${esc((rq.status||'open').replace('_',' '))}</span>${rq.updated_at?` · updated ${esc(rel(rq.updated_at))}`:''}</p><div class="row"><button data-sup="${esc(rq.id)}">${resolved?'View':'View & reply'}</button></div></div>`;}
  html+=`</section>`;
  $('main').innerHTML=html;
  const nr=$('newReq');if(nr)nr.addEventListener('click',()=>openSupport(null));
  document.querySelectorAll('[data-svc]').forEach(b=>b.addEventListener('click',()=>{const id=b.getAttribute('data-svc');const svc=services.find(x=>x.id===id);if(svc)openServiceRequest(svc);}));
  document.querySelectorAll('[data-sup]').forEach(b=>b.addEventListener('click',()=>openSupportThread(b.getAttribute('data-sup'),null)));
}
// A short, standard brief for a picked service → POST as a PENDING support
// request (service ref + structured fields). Per-service custom fields are out
// of R2 scope. Crystal-clear that NOTHING is charged or ordered automatically.
async function openServiceRequest(svc){
  const box='style="width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)"';
  let html=`<p><a class="link" href="#" id="back">← Back to requests</a></p><header><h1>Request: ${esc(svc.name)}</h1><p class="sub">Tell your studio a little about what you need. They’ll review and reply with next steps — nothing is charged and nothing is ordered automatically.</p></header><section><div class="card">`+
    `<label for="sr-need" style="display:block;font-weight:600;margin-bottom:6px">What do you need?</label><textarea id="sr-need" rows="3" ${box} placeholder="A short description of what you’re looking for…"></textarea>`+
    `<label for="sr-time" style="display:block;font-weight:600;margin:12px 0 6px">Ideal timeline <span class="muted" style="font-weight:400">(optional)</span></label><input id="sr-time" type="text" ${box} placeholder="e.g. in the next month, no rush…">`+
    `<label for="sr-budget" style="display:block;font-weight:600;margin:12px 0 6px">Budget range <span class="muted" style="font-weight:400">(optional)</span></label><input id="sr-budget" type="text" ${box} placeholder="e.g. around \$500, not sure yet…">`+
    `<p class="muted" style="margin-top:12px;font-size:12.5px">This sends a request only. Your studio will review it and get back to you with next steps and pricing — nothing is charged now.</p>`+
    `<div class="row"><button class="approve" id="sr-send">Send request</button></div></div></section>`;
  $('main').innerHTML=html;
  $('back').addEventListener('click',(e)=>{e.preventDefault();renderRequests();});
  $('sr-send').addEventListener('click',async()=>{
    const btn=$('sr-send');const need=$('sr-need').value.trim();
    if(!need){toast('Tell your studio what you need first.');return;}
    btn.disabled=true;
    const r=await api('/client/support','POST',{subject:'Service request: '+svc.name,service:svc.id,brief:{need,timeline:$('sr-time').value.trim(),budget:$('sr-budget').value.trim()}});
    if(r.ok&&r.body&&r.body.data&&r.body.data.id){toast('Sent — your studio will review and get back to you with next steps. Nothing’s charged.');renderRequests();}
    else{toast('That didn’t send — please try again.');btn.disabled=false;}
  });
}

// First-run welcome — calm, one-time, dismissible (no modal, no tour).
const WELCOME_KEY='dds-portal-welcomed';
function welcomed(){try{return localStorage.getItem(WELCOME_KEY)==='1';}catch(_){return false;}}
function welcomeCardHtml(){
  if(welcomed())return'';
  const n=firstName(USER);
  return `<div class="card welcome" id="welcome" role="note"><button class="x" id="welcomeX" aria-label="Dismiss welcome">×</button>`+
    `<h3>Welcome${n?`, ${esc(n)}`:''}</h3>`+
    `<p>This is your workspace. Here you’ll approve work, download the files your studio shares, and message them any time — all in one place.</p></div>`;
}
function wireWelcome(){
  const x=$('welcomeX');if(!x)return;
  x.addEventListener('click',()=>{try{localStorage.setItem(WELCOME_KEY,'1');}catch(_){}const w=$('welcome');if(w)w.remove();});
}
// What's-new bell/panel over the ALREADY-BUILT /client/notifications (with
// read-state). Marks read via /client/notifications/read only when opened, so
// the badge reflects genuinely-unseen activity.
function notifPanelHtml(notifs){
  if(!notifs.length)return'<p class="nempty">You’re all caught up — nothing new right now.</p>';
  const groups=groupNotifs(notifs,Date.now());
  let h='';
  for(const g of groups){
    h+=`<div class="ngroup">${esc(g.bucket)}</div>`;
    for(const it of g.items){
      h+=`<button class="nitem${it.read?'':' unread'}" data-nav="${esc(it.href||'')}"><span class="nt">${esc(it.label||'Activity')}</span><span class="nw">${esc(rel(it.created_at))}</span></button>`;
    }
  }
  return h;
}
function wireBell(notifs,unread){
  const bell=$('bell'),panel=$('np');if(!bell||!panel)return;
  let built=false;
  const close=()=>{panel.hidden=true;bell.setAttribute('aria-expanded','false');};
  const open=()=>{
    if(!built){panel.innerHTML=notifPanelHtml(notifs);built=true;
      panel.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navFromHref(b.getAttribute('data-nav'))));
    }
    panel.hidden=false;bell.setAttribute('aria-expanded','true');
    if(unread){ // seen now — clear the badge and persist read-state
      const b=bell.querySelector('.badge');if(b){b.classList.remove('on');b.textContent='';}
      panel.querySelectorAll('.nitem.unread').forEach(el=>el.classList.remove('unread'));
      unread=0;bell.setAttribute('aria-label','What’s new');
      api('/client/notifications/read','POST',{}).catch(()=>{});
    }
  };
  bell.addEventListener('click',()=>{panel.hidden?open():close();});
  document.addEventListener('click',(e)=>{if(!panel.hidden&&!panel.contains(e.target)&&e.target!==bell&&!bell.contains(e.target))close();});
  document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&!panel.hidden){close();bell.focus();}});
}
async function openProject(id,focusSection){
  $('main').innerHTML=skeleton();
  const [d,rep,supRes]=await Promise.all([api('/client/projects/'+id),api('/client/projects/'+id+'/report').catch(()=>null),api('/client/support').catch(()=>null)]);
  if(!d.ok){toast('That project isn’t available.');return goHome();}
  const data=d.body.data||{}; const p=data.project||{}; const s=(rep&&rep.body&&rep.body.data&&rep.body.data.summary);
  const hasOverview=!!(s&&s.progress&&s.milestones);
  let html=`<p><a class="link" href="/client.html" id="projBack">← Back to home</a></p><header><h1>${esc(p.name)}</h1><p class="sub">Status: ${esc((p.status||'').replace('_',' '))}</p></header>`;
  // slim sticky chip bar — anchors within this one screen (no new pages); only
  // sections that actually have content get a chip.
  const chips=chipsFor({hasOverview,approvals:data.approvals,deliverables:data.deliverables,hasMessages:true,hasSupport:true});
  if(chips.length>1)html+=`<nav class="chipbar" aria-label="Jump to a section">${chips.map(c=>`<button class="chip" data-chip="${esc(c.id)}">${esc(c.label)}</button>`).join('')}</nav>`;
  if(hasOverview) html+=`<div class="status" id="sec-overview"><span class="d"></span>${s.progress.pct}% complete · ${s.milestones.complete}/${s.milestones.total} milestones · ${(s.open_client_actions||0)} action${s.open_client_actions===1?'':'s'} for you</div>`;
  // approvals that need the client
  const aps=(data.approvals||[]).filter(a=>a.status==='pending');
  if(aps.length){html+=`<section id="sec-approvals"><h2>Waiting for your OK</h2>`;for(const a of aps){html+=`<div class="card approve"><h3>${esc(a.title)}</h3><p>${esc(a.summary||'')}</p><div class="row"><button class="approve" data-adec="${esc(a.id)}" data-ah="${esc(a.content_hash)}">Approve</button><button data-areq="${esc(a.id)}">Request changes</button></div><div id="note-${esc(a.id)}" style="display:none;margin-top:12px"><textarea id="nt-${esc(a.id)}" rows="2" aria-label="What would you like changed?" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px" placeholder="What would you like changed? This goes straight to your studio."></textarea><div class="row"><button class="approve" data-asend="${esc(a.id)}" data-ah="${esc(a.content_hash)}">Send request</button><button data-acancel="${esc(a.id)}">Cancel</button></div></div></div>`;}html+=`</section>`;}
  // your tasks
  const acts=(data.tasks||[]).filter(t=>t.client_action_required);
  if(acts.length){html+=`<section id="sec-todos"><h2>Your to-dos</h2>`;for(const t of acts){html+=`<div class="card"><h3>${esc(t.title)}</h3><p>${t.derived&&t.derived.overdue?'Overdue · ':''}${esc(t.status.replace('_',' '))}</p></div>`;}html+=`</section>`;}
  // files
  if((data.deliverables||[]).length){html+=`<section id="sec-files"><h2>Files</h2>`;for(const f of data.deliverables){html+=`<div class="card"><h3>${esc(f.title)}</h3><p>${esc(f.note||'Shared with you')}</p><div class="row"><button data-dl="${esc(f.id)}">Download</button></div></div>`;}html+=`</section>`;}
  // surveys
  if((data.surveys||[]).length){html+=`<section id="sec-surveys"><h2>A quick survey</h2>`;for(const sv of data.surveys){html+=`<div class="card"><h3>${esc(sv.title)}</h3><div class="row"><a class="link" href="#" data-survey="${esc(sv.id)}">Open survey →</a></div></div>`;}html+=`</section>`;}
  // milestones — a real vertical timeline (done / you-are-here / upcoming)
  if((data.milestones||[]).length){html+=`<section id="sec-milestones"><h2>Project timeline</h2>${timelineHtml(data.milestones)}</section>`;}
  // messages
  html+=`<section id="sec-messages"><h2>Messages</h2><p class="muted" style="margin:-6px 0 12px;font-size:13px">Your studio usually replies within a day.</p><div id="thread"></div><div class="card"><textarea id="msg" rows="2" aria-label="Message your studio" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px" placeholder="Message your studio…"></textarea><div class="row"><button class="approve" id="send">Send</button></div></div></section>`;
  // support — the client can now SEE their requests + the studio's replies, not just fire one off
  const sup=((supRes&&supRes.body&&supRes.body.data)||[]).filter(r=>!r.project_id||r.project_id===id);
  html+=`<section id="sec-support"><h2>Support</h2>`;
  if(sup.length){for(const rq of sup){const resolved=rq.status==='resolved'||rq.status==='closed';html+=`<div class="card"><h3>${esc(rq.subject)}</h3><p><span class="tag">${esc((rq.status||'open').replace('_',' '))}</span>${rq.updated_at?` · updated ${esc(rel(rq.updated_at))}`:''}</p><div class="row"><button data-sup="${esc(rq.id)}">${resolved?'View':'View & reply'}</button></div></div>`;}}
  html+=`<div class="card"><p class="muted">${sup.length?'Need something else?':'Have a question for your studio?'} Open a support request.</p><div class="row"><button id="newSupport">Open a support request</button></div></div></section>`;
  $('main').innerHTML=html;
  document.querySelectorAll('[data-chip]').forEach(b=>b.addEventListener('click',()=>scrollToSection(b.getAttribute('data-chip'))));
  if(focusSection)requestAnimationFrame(()=>scrollToSection(focusSection));
  const adec=async(aid,ah,decision,note,btn)=>{if(btn)btn.disabled=true;const r=await api('/client/approvals/'+aid+'/decide','POST',{decision,presented_hash:ah,note:note||''});if(r.ok){toast(decision==='approved'?'Approved — thank you.':'Sent — your studio will take a look.');openProject(id);}else{toast('That didn’t go through.');if(btn)btn.disabled=false;}};
  document.querySelectorAll('[data-adec]').forEach(b=>b.addEventListener('click',()=>adec(b.getAttribute('data-adec'),b.getAttribute('data-ah'),'approved',null,b)));
  document.querySelectorAll('[data-areq]').forEach(b=>b.addEventListener('click',()=>{const n=$('note-'+b.getAttribute('data-areq'));if(n){n.style.display='block';const t=$('nt-'+b.getAttribute('data-areq'));if(t)t.focus();}}));
  document.querySelectorAll('[data-acancel]').forEach(b=>b.addEventListener('click',()=>{const n=$('note-'+b.getAttribute('data-acancel'));if(n)n.style.display='none';}));
  document.querySelectorAll('[data-asend]').forEach(b=>b.addEventListener('click',()=>{const t=$('nt-'+b.getAttribute('data-asend'));adec(b.getAttribute('data-asend'),b.getAttribute('data-ah'),'changes_requested',t?t.value.trim():'',b);}));
  document.querySelectorAll('[data-sup]').forEach(b=>b.addEventListener('click',()=>openSupportThread(b.getAttribute('data-sup'),id)));
  wireDownloads(document);
  document.querySelectorAll('[data-survey]').forEach(a=>a.addEventListener('click',(e)=>{e.preventDefault();openSurvey(a.getAttribute('data-survey'),id);}));
  const pb=$('projBack');if(pb)pb.addEventListener('click',(e)=>{e.preventDefault();goHome();});
  $('newSupport').addEventListener('click',()=>openSupport(id));
  loadThread(id);
  $('send').addEventListener('click',async()=>{const b=$('send');const v=$('msg').value.trim();if(!v)return;b.disabled=true;const r=await api('/client/projects/'+id+'/messages','POST',{body:v});if(r.ok){$('msg').value='';loadThread(id);}else toast('That didn’t send.');b.disabled=false;});
}
async function loadThread(id){const r=await api('/client/projects/'+id+'/messages');const items=((r.body&&r.body.data)||[]).slice().reverse();$('thread').innerHTML=items.length?items.map(m=>`<div class="card"><p><strong>${m.author_kind==='staff'||m.author_kind==='system'?'Your studio':'You'}</strong>${m.created_at?` <span class="muted" style="font-size:12.5px">· ${esc(rel(m.created_at))}</span>`:''}</p><p style="margin-top:4px">${esc(m.body)}</p></div>`).join(''):'<p class="muted">No messages yet.</p>';}
// C1: the client's own support thread — see the studio's replies and reply back
async function openSupportThread(rid,pid){
  $('main').innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';
  const r=await api('/client/support/'+rid);
  if(!r.ok){toast('That request isn’t available.');return pid?openProject(pid):goHome();}
  const d=(r.body&&r.body.data)||{};const rq=d.request||{};const msgs=d.messages||[];
  pid=pid||rq.project_id;
  const resolved=rq.status==='resolved'||rq.status==='closed';
  let html=`<p><a class="link" href="#" id="back">← Back</a></p><header><h1>${esc(rq.subject||'Support request')}</h1><p class="sub"><span class="tag">${esc((rq.status||'open').replace('_',' '))}</span></p></header><section><div id="sthread"></div>`;
  if(!resolved)html+=`<div class="card"><textarea id="smsg" rows="2" aria-label="Add to this request" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px" placeholder="Add to this request…"></textarea><div class="row"><button class="approve" id="ssend">Send</button></div></div>`;
  else html+=`<div class="card"><p class="muted">This request is resolved. Open a new one if you need anything else.</p></div>`;
  html+=`</section>`;
  $('main').innerHTML=html;
  $('back').addEventListener('click',(e)=>{e.preventDefault();pid?openProject(pid):goHome();});
  const thread=[];if(rq.body)thread.push({author_kind:rq.requester_kind||'client',body:rq.body,created_at:rq.created_at});thread.push(...msgs);
  $('sthread').innerHTML=thread.length?thread.map(m=>`<div class="card"><p><strong>${m.author_kind==='staff'||m.author_kind==='system'?'Your studio':'You'}</strong>${m.created_at?` <span class="muted" style="font-size:12.5px">· ${esc(rel(m.created_at))}</span>`:''}</p><p style="margin-top:4px">${esc(m.body)}</p></div>`).join(''):'<p class="muted">No replies yet — your studio usually replies within a day.</p>';
  if(!resolved){const sbtn=$('ssend');sbtn.addEventListener('click',async()=>{const v=$('smsg').value.trim();if(!v)return;sbtn.disabled=true;const rr=await api('/client/support/'+rid+'/messages','POST',{body:v});if(rr.ok){openSupportThread(rid,pid);}else{toast('That didn’t send.');sbtn.disabled=false;}});}
}
async function openSurvey(sid,pid){
  const r=await api('/client/surveys/'+sid);
  if(!r.ok){toast('That survey isn’t available.');return;}
  const sv=r.body.data.survey||{}; const done=r.body.data.my_response&&r.body.data.my_response.status==='submitted';
  let html=`<p><a class="link" href="#" id="back">← Back to project</a></p><header><h1>${esc(sv.title||'Survey')}</h1></header><section>`;
  if(done){html+=`<div class="card"><p class="muted">Thanks — you’ve already answered this survey.</p></div></section>`;$('main').innerHTML=html;$('back').addEventListener('click',(e)=>{e.preventDefault();openProject(pid);});return;}
  let qi=0;
  for(const q of (sv.questions||[])){
    // Each generated field gets a real id so its label's `for` associates it
    // (q.key is server data — an index-based id is guaranteed attribute-safe).
    const fid=`svq-${++qi}`;
    const box=`id="${fid}" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px"`;
    let field;
    if(q.type==='rating') field=`<select data-q="${esc(q.key)}" ${box}><option value="" disabled selected>Choose a rating (1–5)…</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select>`;
    else if(q.type==='choice') field=`<select data-q="${esc(q.key)}" ${box}><option value="" disabled selected>Choose…</option>${(q.choices||[]).map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
    else field=`<input data-q="${esc(q.key)}" type="text" ${box}>`;
    html+=`<div class="card"><label for="${fid}" style="display:block;font-weight:600;margin-bottom:6px">${esc(q.label)}</label>${field}</div>`;
  }
  html+=`<div class="row"><button class="approve" id="subSurvey">Send your answers</button></div></section>`;
  $('main').innerHTML=html;
  $('back').addEventListener('click',(e)=>{e.preventDefault();openProject(pid);});
  $('subSurvey').addEventListener('click',async()=>{const b=$('subSurvey');b.disabled=true;const answers={};document.querySelectorAll('[data-q]').forEach(el=>{answers[el.getAttribute('data-q')]=el.value;});const rr=await api('/client/surveys/'+sid+'/respond','POST',{answers});if(rr.ok){toast('Thank you!');openProject(pid);}else{toast('That didn’t send — please try again.');b.disabled=false;}});
}
async function openSupport(pid){
  let html=`<p><a class="link" href="#" id="back">${pid?'← Back to project':'← Back'}</a></p><header><h1>${pid?'Open a support request':'Message your studio'}</h1></header><section><div class="card"><label for="sup-subj" style="display:block;font-weight:600;margin-bottom:6px">Subject</label><input id="sup-subj" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px"><label for="sup-body" style="display:block;font-weight:600;margin:12px 0 6px">What do you need?</label><textarea id="sup-body" rows="3" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px"></textarea><div class="row"><button class="approve" id="sup-send">Send</button></div></div></section>`;
  $('main').innerHTML=html;
  // No project yet? Back and success return to the client home (load), not a
  // missing project — so a managed client with zero projects never hits a dead end.
  const backTo=()=>{pid?openProject(pid):load();};
  $('back').addEventListener('click',(e)=>{e.preventDefault();backTo();});
  $('sup-send').addEventListener('click',async()=>{const b=$('sup-send');const subject=$('sup-subj').value.trim();if(!subject){toast('Add a subject.');return;}b.disabled=true;const r=await api('/client/support','POST',{subject,body:$('sup-body').value.trim(),project_id:pid});if(r.ok){toast('Sent — your studio will get back to you.');backTo();}else{toast('That didn’t send.');b.disabled=false;}});
}

function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to see your updates.</h2><p style="margin-top:20px"><a class="link" href="/portal.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load your updates just now.</h2><p class="muted">Please refresh in a moment.</p></div>`;}
function ownerNote(){$('main').innerHTML=`<div class="center"><div class="rolebadge">● Full access</div><h2 style="margin-top:14px">This is the client view.</h2><p class="muted">You have the full workspace.</p><p style="margin-top:20px"><a class="link" href="/presence.html">Open your workspace →</a></p></div>`;}

async function load(){
  PORTAL.snaps=null;PORTAL.billing=null;         // fresh per-load caches (a re-load = fresh data)
  const params=new URLSearchParams(location.search);
  const dsup=params.get('support'); const deep=params.get('project');
  // honor a deep link once, then drop it from the URL so any later re-load
  // (e.g. after approving something) lands on Home instead of re-opening it.
  if(dsup||deep){try{history.replaceState(null,'','/client.html'+location.hash);}catch(_){}}
  const ctx=await api('/portal/context');
  if(!ctx.ok){hideNav();trouble();return;}
  const c=ctx.body.data||{};
  const proj=await api('/client/projects');
  const projects=(proj.ok&&proj.body.data)||[];
  // A plain OWNER (full workspace, NOT a managed client, no delivery) — the full
  // workspace lives elsewhere. No client tabs.
  if(!projects.length && !c.is_managed_client && c.sees_full_workspace){hideNav();ownerNote();return;}
  // Everyone else is a client-facing persona: a managed client (converted customer,
  // with or without a project yet) OR an invited reviewer (feed only). Both get the
  // persistent tab nav + the cross-project Home; tabs degrade to calm empty states.
  PORTAL.ctx=c;
  PORTAL.persona=(projects.length||c.is_managed_client)?'client':'reviewer';
  PORTAL.projects=projects;
  const feed=await api('/portal/feed'); PORTAL.feed=(feed.ok&&feed.body.data)||{};
  const n=await api('/client/notifications').catch(()=>null); const nb=(n&&n.body)||{};
  PORTAL.notifs=(nb.data&&Array.isArray(nb.data)?nb.data:(nb.data&&nb.data.data)||[])||[];
  PORTAL.unread=nb.unread_count!=null?nb.unread_count:((nb.data&&nb.data.unread_count)||0);
  PORTAL.ready=true;
  showNav();
  // deep links open the relevant drill-down; the nav stays visible around it
  if(dsup){await openSupportThread(dsup,null);api('/client/notifications/read','POST',{}).catch(()=>{});return;}
  if(deep){await openProject(deep);api('/client/notifications/read','POST',{}).catch(()=>{});return;}
  showTab(CURRENT_TAB||'home');
}
// Always-available client sign-out (the shell's profile menu is owner-shaped;
// a client needs an obvious, in-view way out). Lands back on the client door.
// Shared so both the footer link and the "You & notifications" card use it.
async function doSignOut(e){if(e&&e.preventDefault)e.preventDefault();try{await sb.auth.signOut();}catch(_){}location.href='/portal.html';}
(function(){var s=$('signout');if(s)s.addEventListener('click',doSignOut);})();
(async function(){
  try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";USER=(data&&data.session&&data.session.user)||null;
    if(!TOKEN){signedOut();return;}await load();
  }catch(_){trouble();}
})();
