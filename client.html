<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your updates</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Review and approve what your studio has ready for you.">
<link rel="stylesheet" href="/fonts/brand.css">
<style>
  :root{
    --bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;
    --p:#5b3fa0;--p-deep:#432e78;--p-soft:#efeafa;--on-p:#fff;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--warn-soft:#f3ead9;
    /* item 179 (direction A): the studio-coloured chrome — the phone hero and the
       ≥720px context bar wear the deep plum in BOTH themes (brand, not surface). */
    --chrome:#241d38;--on-chrome:#efeaf7;--on-chrome-soft:#b4a9cc;--chrome-accent:#cdb6f2;
    --shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);
    --shadow-lift:0 2px 4px rgba(27,21,37,.05),0 14px 34px rgba(27,21,37,.10);
    --serif:'Fraunces',"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* activity-timeline type accents (Salesforce anatomy, portal-local values —
       same precedent as crm.html's --act-*). Most hues reuse theme tokens that
       already flip (--p/--warn/--good/--faint); only these two are fixed per theme. */
    --act-file:#31708e;--act-note:#8a5a83;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-deep:#cdb6f2;--p-soft:#241d38;--on-p:#171320;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--act-file:#85b7cf;--act-note:#c9a3c2;--chrome:#120e1b;--on-chrome:#efeaf7;--on-chrome-soft:#b4a9cc;--chrome-accent:#cdb6f2;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 2px 4px rgba(0,0,0,.24),0 14px 34px rgba(0,0,0,.34)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#6f677d;--line:#eee9e0;--p:#5b3fa0;--p-deep:#432e78;--p-soft:#efeafa;--on-p:#fff;--good:#33664b;--good-soft:#e7f1ea;--warn:#775d31;--warn-soft:#f3ead9;--act-file:#31708e;--act-note:#8a5a83;--chrome:#241d38;--on-chrome:#efeaf7;--on-chrome-soft:#b4a9cc;--chrome-accent:#cdb6f2}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#948bad;--line:#2a2338;--p:#b79ceb;--p-deep:#cdb6f2;--p-soft:#241d38;--on-p:#171320;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--act-file:#85b7cf;--act-note:#c9a3c2;--chrome:#120e1b;--on-chrome:#efeaf7;--on-chrome-soft:#b4a9cc;--chrome-accent:#cdb6f2}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding:40px 20px 90px}
  .rolebadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:5px 12px;font-family:var(--sans)}
  header h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,38px);margin:16px 0 .15em;letter-spacing:-.02em;line-height:1.08}
  header .sub{color:var(--soft);font-size:15px;margin:0}
  section{margin-top:34px}
  h2{font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:650;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px;transition:border-color .15s,box-shadow .15s,transform .15s}
  .card[role="button"]:hover{border-color:var(--p);box-shadow:var(--shadow-lift);transform:translateY(-1px)}
  .card h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 5px;line-height:1.2;letter-spacing:-.01em}
  .card p{margin:0;color:var(--soft);font-size:14.5px}
  .card.approve{border-left:3px solid var(--p)}
  .card.approve .apdue{font-size:12.5px;color:var(--faint);margin-top:-4px}
  .card.approve .apdue.late{color:var(--dds-bad,#c43c3c);font-weight:600}
  .row{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 17px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--p);color:var(--p)} button:disabled{opacity:.5;cursor:default}
  button.approve{background:var(--p);color:var(--on-p);border-color:var(--p);box-shadow:0 2px 12px rgba(91,63,160,.22)} button.approve:hover{background:var(--p-deep);color:var(--on-p);border-color:var(--p-deep)}
  /* Oct 2026 audit change 4: the top "Needs you" row's Pay is a link wearing the filled style */
  a.approve{display:inline-flex;align-items:center;font-weight:600;font-size:12.5px;border-radius:999px;padding:6px 13px;background:var(--p);color:var(--on-p);border:1px solid var(--p);text-decoration:none;box-shadow:0 2px 12px rgba(91,63,160,.22)} a.approve:hover{background:var(--p-deep);border-color:var(--p-deep);color:var(--on-p)}
  .tag{display:inline-block;font-size:11px;font-family:var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--p);background:var(--p-soft);border-radius:999px;padding:3px 9px;font-weight:600;margin-bottom:9px}
  .center{text-align:center;padding:52px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 8px}
  .muted{color:var(--soft);font-size:14px}
  a.link{color:var(--p);text-decoration:none;font-weight:600} a.link:hover{text-decoration:underline}
  a.btn{display:inline-block;font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:8px 17px;color:var(--ink);text-decoration:none;transition:.15s} a.btn:hover{border-color:var(--p);color:var(--p)}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ── UX upgrades: focus, bell/panel, chip-bar, skeletons, welcome ── */
  a:focus-visible,button:focus-visible,[tabindex]:focus-visible,.card[role="button"]:focus-visible,.nitem:focus-visible,.chip:focus-visible{outline:3px solid var(--p);outline-offset:2px;border-radius:12px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .bell{position:relative;width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
  .bell .badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--p);color:var(--on-p);font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;border:2px solid var(--bg)}
  .bell .badge.on{display:flex}
  .notifpanel{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin:12px 0 4px;overflow:hidden}
  .notifpanel[hidden]{display:none}
  .nsince{padding:12px 16px 0;font-size:12.5px;font-weight:600;color:var(--soft)}   /* PS3: the badge's own label — "N updates since you last looked" */
  .ngroup{padding:11px 16px 3px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .nempty{padding:20px 16px;color:var(--soft);font-size:14px}
  .nitem{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:13px 16px;cursor:pointer;transition:background .12s}
  .nitem:first-of-type{border-top:0}
  .nitem:hover{background:var(--p-soft);color:var(--ink);border-color:var(--line)}
  .nitem .nt{font-weight:600;font-size:14.5px;color:var(--ink);display:block}
  .nitem.unread .nt::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p);margin-right:8px;vertical-align:middle}
  .nitem .nw{color:var(--soft);font-size:12.5px;margin-top:2px;display:block}
  .chipbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:11px 20px;margin:8px -20px 4px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chipbar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--p);color:var(--p)}
  section[id^="sec-"],#sec-overview{scroll-margin-top:64px}
  .welcome{border-left:3px solid var(--p);position:relative;background:linear-gradient(135deg,var(--p-soft),var(--card) 60%)}
  .welcome .x{position:absolute;top:12px;right:14px;width:30px;height:30px;padding:0;border-radius:999px;font-size:16px;line-height:1;color:var(--soft);border-color:transparent}
  .welcome h3{padding-right:34px}
  .skel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
  .skel .l{height:13px;border-radius:7px;background:var(--line);margin:9px 0;background-image:linear-gradient(90deg,var(--line) 0%,var(--p-soft) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.3s ease-in-out infinite}
  .skel .l.w60{width:60%}.skel .l.w40{width:40%}.skel .l.w80{width:80%}
  @keyframes sh{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.spin,.skel .l{animation:none}html{scroll-behavior:auto}}
  html{scroll-behavior:smooth}
  /* ── persistent portal nav: bottom tab bar (mobile) → Salesforce context bar (wider) ── */
  .tabnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(27,21,37,.07);padding-bottom:env(safe-area-inset-bottom)}
  .tabnav[hidden]{display:none}
  .tabnav-inner{max-width:660px;margin:0 auto;display:flex}
  .cb-tabs{flex:1 1 auto;min-width:0;display:flex;justify-content:space-around}
  .cb-brand{display:none}
  /* PS3 (D3a): the bell is persistent chrome on phones too — fixed top-right,
     OUTSIDE #main (the tab nav's own rule), so it survives every innerHTML
     rewrite and every tab keeps the ONE bell + badge. The account chip stays
     a ≥720px affordance (Help is a bottom tab on phones). */
  .cb-right{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:31;display:flex;align-items:center;gap:8px}
  .cb-acct{display:none}
  .navpanel{display:block;position:fixed;top:calc(62px + env(safe-area-inset-top));right:14px;left:14px;margin:0;z-index:35;box-shadow:var(--shadow-lift);max-height:65vh;overflow:auto}
  .navpanel[hidden]{display:none}
  /* the record page's sticky chipbar pins to y=0 on phones — reserve the fixed
     bell's zone so a tap at the right edge hits the chip, never the bell */
  .chipbar{padding-right:64px}
  .tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:0;background:transparent;color:var(--soft);padding:8px 2px 9px;font-size:11px;font-weight:600;cursor:pointer;min-height:52px}
  .tab .ti{font-size:19px;line-height:1}
  .tab:hover{color:var(--p)}
  .tab[aria-current="page"]{color:var(--p)}
  .tab[aria-current="page"] .ti{background:var(--p-soft);border-radius:999px;padding:3px 14px;margin:-3px 0}
  .toast{z-index:40}
  @media (max-width:719px){.toast{bottom:74px}}
  @media (min-width:720px){
    /* the context bar (salesforce-reference §11.5): primary region = the studio
       identity as the "app name", secondary = flat tabs with the active-tab
       underline, right = bell + account chip. Same DOM as the bottom bar. */
    .tabnav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding-bottom:0}
    .tabnav-inner{max-width:none;margin:0;align-items:stretch;position:relative;padding:0 18px;gap:10px}
    .cb-brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:8px 8px 8px 0}
    .cb-mark{width:26px;height:26px;border-radius:8px;background:var(--p);color:var(--on-p);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
    .cb-name{font-family:var(--serif);font-size:15.5px;font-weight:500;color:var(--ink);white-space:nowrap}
    .cb-logo{height:26px;width:auto;max-width:120px;border-radius:6px;flex:0 0 auto;display:block}   /* builder list item 59: the studio's logo */
    .cb-tabs{flex:0 1 auto;justify-content:flex-start;gap:2px;overflow-x:auto;scrollbar-width:none}
    .cb-tabs::-webkit-scrollbar{display:none}
    .tab{flex:0 0 auto;flex-direction:row;gap:7px;font-size:13.5px;padding:13px 14px;min-height:0;border-bottom:2.5px solid transparent}
    .tab .ti{font-size:15px}
    .tab[aria-current="page"]{background:transparent;border-bottom-color:var(--p)}
    .tab[aria-current="page"] .ti{background:transparent;padding:0;margin:0}
    .cb-right{position:static;display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}
    .cb-acct{display:inline-flex}
    .cb-bell{width:36px;height:36px;font-size:16px;box-shadow:none;border:1px solid var(--line)}
    .cb-acct{width:32px;height:32px;padding:0;border-radius:50%;background:var(--p-soft);color:var(--p);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line)}
    .cb-acct:hover{border-color:var(--p);color:var(--p)}
    .navpanel{display:block;position:absolute;top:calc(100% + 8px);left:auto;right:14px;width:min(400px,calc(100vw - 28px));margin:0;z-index:35;box-shadow:var(--shadow-lift);max-height:70vh;overflow:auto}
    .navpanel[hidden]{display:none}
    .chipbar{top:52px}
    section[id^="sec-"],#sec-overview{scroll-margin-top:118px}
  }
  /* ── slice 12: the Files tab — share card (dashed) + document/file list views.
     All class names are f-prefixed and unique to this tab (the slice-9 .sec
     lesson: no generic names that could bleed into other views). ── */
  .fshare{background:var(--card);border:1.5px dashed var(--p);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin:4px 0 8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .fshare-i{width:42px;height:42px;border-radius:12px;background:var(--p-soft);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
  .fshare-m{flex:1 1 220px;min-width:0}
  .fshare-t{font-weight:700;font-size:15px;margin:0;color:var(--ink)}
  .fshare-d{color:var(--faint);font-size:13px;margin:2px 0 0}
  .fshare-btn{margin-left:auto;white-space:nowrap;flex:0 0 auto}
  .fshare-file{display:none}
  .fsend{flex-basis:100%;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
  .fsend[hidden]{display:none}
  .fsend .fsel{font-weight:600;font-size:14px;margin:0 0 4px;color:var(--ink);overflow-wrap:anywhere}
  .fsend .fld{display:block;font-weight:600;font-size:13.5px;margin:10px 0 5px;color:var(--ink)}
  .fsend .fin{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--card);color:var(--ink)}
  @media (max-width:560px){.fshare-btn{margin-left:0;width:100%}}
  .flv{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .frow{display:flex;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:none}
  .si{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.18em;flex:0 0 auto}
  .fico{width:34px;height:34px;border-radius:9px;background:var(--p-soft);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .fmain{flex:1 1 auto;min-width:0}
  .fname{display:block;font-weight:600;font-size:14px;color:var(--ink);overflow-wrap:anywhere}
  .fmeta{display:block;color:var(--faint);font-size:12.5px;margin-top:1px}
  .fyou{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--good-soft);color:var(--good);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  /* audit change 8: the approval that binds this file — the ask (warn), the answer (good / changes) */
  .fok{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  .fok.ok{background:var(--good-soft);color:var(--good)}
  .fok.chg{background:var(--p-soft);color:var(--p)}
  .fok.od{background:transparent;color:var(--dds-bad,#c43c3c);border:1px solid currentColor}
  .frow.asks{flex-wrap:wrap}
  .frow.asks .facts{flex:0 0 100%;display:flex;gap:8px;flex-wrap:wrap;margin-left:46px}
  .frow.asks .fnote{flex:0 0 100%;margin-left:46px}
  @media (max-width:719px){.frow.asks .facts,.frow.asks .fnote{margin-left:0}}
  .fst{flex:0 0 auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--p-soft);color:var(--p);white-space:nowrap}
  .fst.sig{background:var(--good-soft);color:var(--good)}
  /* PS2 — Invoices rows: the invoice name is a REAL h3 (heading nav on the money
     surface) restyled to the .fname line; Overdue chip = warn family; the
     non-link row action (thank-you / will-send) is a quiet trailing note. */
  .frow h3.fname{margin:0;font-size:14px}
  /* Oct 2026 benchmark (item 2): one colour per money state — Paid green (.sig),
     Processing blue (.pr), Upcoming neutral, Overdue red (.od) — the same
     families crm.html's .schip and today.html's band use. */
  .fst.od{background:transparent;color:var(--dds-bad,#c43c3c);border:1px solid currentColor;padding:2px 8px}   /* outlined, like crm.html's .schip.bad — the filled red tint misses AA at this size */
  .fst.pr{background:var(--dds-info-soft,#e8f1fb);color:var(--dds-info,#2a6fb5)}
  .finote{flex:0 0 auto;color:var(--faint);font-size:12.5px}
  /* item 1: the moment after paying — a check mark and a quiet confirming note */
  .finote.fconf{color:var(--good);display:inline-flex;align-items:center;gap:6px}
  .finote.fconf .fchk{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;font-size:10px;font-weight:700;flex:0 0 auto}
  .finote.fconf.stale{color:var(--faint)} .finote.fconf.stale .fchk{background:var(--faint)}
  .invtotal{font-size:14px;color:var(--soft);margin:0 0 12px}
  .invtotal strong{color:var(--ink)}
  @media (max-width:719px){
    .frow.inv{flex-wrap:wrap}
    .frow.inv .fmain{min-width:58%}
    .frow.inv .finote,.frow.inv a.fbtn{margin-left:46px} /* stacked under the name, aligned past the 34px icon + 12px gap */
  }
  .fbtn,a.fbtn{flex:0 0 auto;display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:.15s}
  a.fbtn.pay{background:var(--p);border-color:var(--p);color:#fff} /* paying is the Invoices tab's one next action (Oct 2026 experience review) */
  .fbtn:hover,a.fbtn:hover{border-color:var(--p);color:var(--p)}
  .fload{margin:0 0 14px;font-size:14px}
  /* ── milestone Path (Lightning chevron geometry — read-only, informational) ── */
  .tl-here{display:inline-block;font-size:10.5px;font-weight:700;color:var(--p);background:var(--p-soft);border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle}
  .pathcard{padding:14px 16px}
  .path{display:flex;min-width:0}

function firstName(u){if(!u)return'';const cap=(p)=>p.charAt(0).toUpperCase()+p.slice(1);const m=(u.user_metadata||{});const n=String(m.name||m.full_name||'').trim().split(/\s+/)[0].replace(/[.,]+$/,'');if(n.length>1)return n===n.toLowerCase()?cap(n):n;const e=(u.email||'').split('@')[0];if(e&&/^[a-z]+([._-][a-z]+)?$/i.test(e)){const p=e.split(/[._-]/)[0];if(p.length>1)return cap(p);}return'';}

// ── slice 10: Home greeting pure helpers (mirrored 1:1 in

// Time-of-day greeting, with the client's first name when we truly know it.

function needsYouItems(feed,snaps,billing){

// GSC data can lag a month — when the reported period isn't the current
// calendar month, the Google tile says which month it is (" · in June").
// Defensive: malformed period → no qualifier, never a wrong one.
function wsGscQualifier(period,nowMs){
  const m=/^(\d{4})-(\d{2})$/.exec(String(period||''));
  if(!m)return'';
  const d=new Date(nowMs==null?Date.now():nowMs);
  const cur=d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2);
  if(m[0]===cur)return'';
  const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const n=names[Number(m[2])-1];
  return n?' · in '+n:'';
}

// Polyline points for the soft sparkline/line — pure geometry, no DOM. Oldest
// value left, newest right; a flat/short series (<2 points) draws nothing.
function wsSparkPoints(weekly,w,h,pad){
  const a=(weekly||[]).map(n=>Math.max(0,n|0));
  if(a.length<2)return'';
  pad=pad==null?6:pad;
  const max=Math.max(1,Math.max.apply(null,a));
  const dx=w/(a.length-1);
  const r=(x)=>Math.round(x*10)/10;
  return a.map((n,i)=>r(i*dx)+','+r(h-pad-(n/max)*(h-2*pad))).join(' ');
}

// billing (invoices) — a SUCCESSFUL read is cached per full load; a reviewer

// FAILED read returns {failed:true} and is NOT cached, so the next call
// retries instead of pinning "couldn't load" (or a fake empty) for the session.
async function ensureBilling(){
  if(PORTAL.billing){PORTAL.billingFailed=false;return PORTAL.billing;}
  if(PORTAL.persona!=='client')return{invoices:[]};
  try{
    const r=await api('/client/billing');

    PORTAL.billing=(r.body&&r.body.data)||{invoices:[]};
  }catch(_){PORTAL.billingFailed=true;return{invoices:[],failed:true};}
  PORTAL.billingFailed=false;   // B1's named flag — Home's queue + due tile consume it
  return PORTAL.billing;

// per-project snapshots (the full client bundle, capped) — shared by Home + Files
async function ensureSnaps(){
  const fetchSnap=async(p)=>{
    try{const r=await api('/client/projects/'+p.id);
      if(!r.ok)throw 0;   // an error response is a FAILED read, not an empty project
      const d=(r&&r.body&&r.body.data)||{};const prog=d.progress||{};
      return {id:p.id,name:p.name,pct:prog.pct,total:prog.total,
        milestones:(d.milestones||[]),
        approvals:(d.approvals||[]).filter(a=>a&&a.status==='pending'),
        todos:(d.tasks||[]).filter(t=>t&&t.client_action_required&&t.status!=='done'),
        surveys:(d.surveys||[]),deliverables:(d.deliverables||[])};
    // failed:true so the queue can tell "couldn't read" from "genuinely
    // empty" — its empty arrays keep every other consumer degrading as before
    }catch(_){return {id:p.id,name:p.name,failed:true,milestones:[],approvals:[],todos:[],surveys:[],deliverables:[]};}
  };
  // failed entries are never pinned for the session (A4's billing rule, per
  // project): each call REFETCHES just the failed ids and keeps the warm rest,
  // so "try again in a moment" on Files and Home is genuinely true on re-entry.
  if(PORTAL.snaps){
    PORTAL.snaps=await Promise.all(PORTAL.snaps.map(s=>(s&&s.failed)?fetchSnap(s):Promise.resolve(s)));

  }
  PORTAL.snaps=await Promise.all(PORTAL.projects.slice(0,8).map(fetchSnap));
  return PORTAL.snaps;
}

// Which Home queue rows deserve an unread dot — derived purely from the EXISTING
// notifications read-state (no new backend): an unread notification anchored at
// an approval / task / a project's surveys marks the matching row as new.
function unreadKeysFrom(notifs){
  const keys=new Set();
  for(const n of (notifs||[])){
    if(!n||n.read)continue;const href=String(n.href||'');
    const a=href.match(/#approval-([a-z0-9-]+)/i);if(a)keys.add('approval-'+a[1]);
    const t=href.match(/#task-([a-z0-9-]+)/i);if(t)keys.add('task-'+t[1]);
    const sv=href.match(/\/projects\/([a-z0-9-]+)#surveys/i);if(sv)keys.add('surveys-'+sv[1]);
    // 'client_action' = the studio flagged an EXISTING task as needing the client
    // (the primary to-do flow). Its href carries NO task anchor (notifHref's
    // default drops detail.task_id), so the honest granularity is PROJECT-level:
    // an unread client_action for project P lights P's to-do rows.
    if(n.kind==='client_action'){const p=href.match(/\/projects\/([a-z0-9-]+)/i);if(p)keys.add('todos-'+p[1]);}
    // slice 5 (Messages split view): per-conversation unread dots. A 'message'
    // notification lights its PROJECT's thread row (href '/projects/<id>#messages');
    // a 'support_message' one lights its REQUEST's row (hrefs carry the id as
    // '?support=<id>' — the derived support rows — or '#support-<id>' — project
    // events). Kind-gated so e.g. '#messages' anchors on other kinds add nothing.
    if(n.kind==='message'){const pm=href.match(/\/projects\/([a-z0-9-]+)#messages/i);if(pm)keys.add('msgs-'+pm[1]);}
    if(n.kind==='support_message'){const sm=href.match(/[?&]support=([a-z0-9-]+)/i)||href.match(/#support-([a-z0-9-]+)/i);if(sm)keys.add('support-'+sm[1]);}
  }
  return keys;
}

// Deploy-order tolerant: any non-OK read (a 404 from an older function build
// included) leaves the slot hidden — no error card, no fake zeros. Cached per
// full load (like billing); a reviewer never fetches (no website of their own).
// The in-flight promise is cached too, so Home→away→Home never refires a
// request that's already running (at most one fetch per load).
async function loadWebsiteCard(){
  if(PORTAL.persona!=='client')return;
  if(PORTAL.wstats===undefined){
    // a FAILED read (non-OK or a throw) resolves false and is NEVER cached:
    // wstats returns to undefined and the in-flight handle clears, so the next
    // Home visit genuinely retries instead of pinning the card hidden all
    // session (the A4 rule). Only a SUCCESSFUL read caches — its data, or null
    // (the route genuinely has nothing to show; the card hides by design).
    if(!PORTAL.wstatsFetch)PORTAL.wstatsFetch=api('/client/website-stats').then(r=>r.ok?((r.body&&r.body.data)||null):false).catch(()=>false);
    PORTAL.wstats=await PORTAL.wstatsFetch;
    PORTAL.wstatsFetch=null;   // settled — a later call may start a fresh read
    if(PORTAL.wstats===false){PORTAL.wstats=undefined;return;}
  }
  const host=document.getElementById('home-website');if(!host)return;   // the user moved on mid-fetch

  // carries aria-expanded/aria-controls and keeps focus across the toggle
  // (nothing re-renders), so focus never jumps or drops to <body>.

// item 179: the card's picture — the site's own home page, drawn by the server

// "overdue" still derived in the client's LOCAL calendar (PS2's rule) and

// Stripe's Payment Link sends the payer back to /client.html?paid=<invoice id>.

    panel.hidden=false;bell.setAttribute('aria-expanded','true');
    // PS3: the panel is no longer load-time-only — every open REFETCHES the
    // list (client persona only: a reviewer's /client/* 403 is contract and
    // their bell stays zero-fetch calm), so the failed branch's "try again in
    // a moment" genuinely comes true on the very next open.
    if(PORTAL.persona==='client'){
      const seq=++BELL_OPEN_SEQ;
      panel.innerHTML='<p class="nempty">Checking…</p>';
      let r=null;try{r=await api('/client/notifications');}catch(_){r=null;}
      if(seq!==BELL_OPEN_SEQ)return;   // a newer open owns the panel now
      if(r&&r.ok){
        const nb=r.body||{};
        PORTAL.notifs=(nb.data&&Array.isArray(nb.data)?nb.data:(nb.data&&nb.data.data)||[])||[];
        PORTAL.unread=nb.unread_count!=null?nb.unread_count:((nb.data&&nb.data.unread_count)||0);
        PORTAL.notifsFailed=false;
        syncBellBadges();              // the badge follows the fresh cursor even if the panel closed
      }else PORTAL.notifsFailed=true;  // failed ≠ empty — the panel says so below
      if(panel.hidden)return;          // closed while fetching — nothing was seen
    }
    // PS3 (D1a): the badge's number gets its label — the panel head says
    // "N updates since you last looked" (the server cursor, not the queue).
    const since=(!PORTAL.notifsFailed&&PORTAL.notifs.length)?`<div class="nsince">${esc(bellSinceLabel(PORTAL.unread))}</div>`:'';
    panel.innerHTML=since+notifPanelHtml(PORTAL.notifs,PORTAL.notifsFailed);
    panel.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{close();navFromHref(b.getAttribute('data-nav'));}));
    // a FAILED notifications read: the honest panel above, and NOTHING seen to
    // mark — persisting the last_seen_at cursor for a read we never got would
    // silently swallow whatever it held.
    if(PORTAL.notifsFailed)return;
    // PS3: nothing to persist for a reviewer either — the mark-seen POST is a
    // /client/* write, and the zero-fetch contract holds on the bell chrome too.
    if(PORTAL.persona!=='client')return;
    // Seen now — ALWAYS clear the derived unread styling AND persist the server
    // cursor (an idempotent last_seen_at upsert), regardless of the local count:
    // reading threads in the Messages split view drives PORTAL.unread to 0
    // locally, and gating this on the count left the server cursor unmoved —
    // every dot resurrected on reload.
    PORTAL.unread=0;
    PORTAL.notifs.forEach(n=>{if(n)n.read=true;});   // so rebuilt panels + unreadKeysFrom (Home dots) agree all session
    MC.unread=new Set();                             // …and the Messages list's per-conversation dots agree too
    document.querySelectorAll('.bell .badge').forEach(b=>{b.classList.remove('on');b.textContent='';});
    document.querySelectorAll('.bell').forEach(el=>el.setAttribute('aria-label','What’s new'));
    document.querySelectorAll('.nitem.unread').forEach(el=>el.classList.remove('unread'));
    document.querySelectorAll('.qrow.unread').forEach(el=>el.classList.remove('unread'));   // live Home queue dots
    document.querySelectorAll('.mrow.unread').forEach(el=>el.classList.remove('unread'));   // live conversation-list dots
    document.querySelectorAll('.sr-new').forEach(el=>el.remove());                          // …and their sr-only "New —" text
    api('/client/notifications/read','POST',{}).catch(()=>{});
  };
  bell.addEventListener('click',()=>{panel.hidden?open():close();});
  // Re-renders replace the bell/panel NODES, so the once-bound document listeners
  // must resolve them by id at event time — never close over this call's elements.
  if(!BELL_DOC_WIRED.has(panelId)){
    BELL_DOC_WIRED.add(panelId);
    const liveClose=()=>{const p=$(panelId),bl=$(bellId);if(p)p.hidden=true;if(bl)bl.setAttribute('aria-expanded','false');return bl;};
    document.addEventListener('click',(e)=>{const p=$(panelId),bl=$(bellId);if(p&&!p.hidden&&!p.contains(e.target)&&(!bl||(e.target!==bl&&!bl.contains(e.target))))liveClose();});
    document.addEventListener('keydown',(e)=>{const p=$(panelId);if(e.key==='Escape'&&p&&!p.hidden){const bl=liveClose();if(bl)bl.focus();}});
  }
}
// ── the project drill-in — the client's record page ─────────────────────────
// Anatomy (Salesforce record page, portal skin): header (name + status chip) →
// highlights tiles → milestone Path (read-only chevrons) → two-region body:
// LEFT the things a client acts on (approvals · decided · to-dos · files ·
// survey · support), RIGHT the project activity timeline + message composer.
// Below 1000px it stacks to one column with the timeline LAST — actions first.
// Nov 10 walk: the studio's three asks ("Send back your project questionnaire",
// "Send your content and photos", "Review the design draft") only said the studio
// ticks them, with nothing to press. Each now points at where it's done on the
// record page — the file box, the questionnaire, the draft waiting for an OK — or
// says plainly that the studio hasn't sent it yet. The tick stays the studio's.
function todoAskHtml(t,data,aps){
  const key=String((t&&t.source)||'').replace(/^checklist:/,'');
  const tick='<p class="muted tdnote">Your studio marks this one off once it arrives.</p>';
  const go=(to,label)=>`<div class="row"><button data-todo-go="${to}">${label}</button></div>`;
  // item 179 part two: each ask opens its own page, with the thing to do right there
  const open=(label)=>`<div class="row"><button data-todo-open="${esc(t.id)}">${label}</button></div>`;
  if(key==='content_received')return open('Send files')+tick;
  if(key==='questionnaire_returned'){
    const sv=questionnaireOf(data&&data.surveys);
    return sv?`<div class="row"><button data-survey="${esc(sv.id)}">Open the questionnaire</button></div>${tick}`
      :`<p class="muted tdnote">Your studio sends the questionnaire by email. Filled it in already? Send it here, and your studio marks this one off.</p>${open('Send it here')}`;
  }
  if(key==='client_review'){
    const wa=(aps||[]).find(a=>a&&a.subject_type==='website');
    if(wa)return `<div class="row"><button data-apr-open="${esc(wa.id)}">See the draft</button></div>`+tick;
    return (aps||[]).length?go('review','Review it')+tick:'<p class="muted tdnote">Your studio will share the draft here for your OK. Nothing to do until then.</p>';
  }
  return tick;
}
// ── item 179 part two: the thing itself, opened in place ─────────────────────
// Drawn in Figma first (page "Client portal — parts 2 to 4", part 2): a to-do or
// an approval opens as its own page. A phone stacks the ask, the thing and your
// answer; ≥1000px puts the thing on the left and the ask and answer on the right.
// Back returns to where it was opened from: Home, or the project it came from.
const AP_KIND={deliverable:'File',task:'Task',project:'Project',custom:'Request',website:'Draft'};
const AP_DONE={approved:['✓ Approved','ok'],rejected:['Declined',''],changes_requested:['✎ Changes requested','chg']};
function sheetBack(from){return from&&from.pid?{label:from.name||'Back to the project',go:()=>openProject(from.pid)}:{label:'Home',go:goHome};}
function sheetBackHtml(back){return `<p class="sheetback"><a class="link" href="#" id="sheetBack">‹ ${esc(back.label)}</a></p>`;}
function sheetHead(chips,title,sub){return `<header class="sheet"><div class="sheetmeta">${chips}</div><h1 tabindex="-1">${esc(title)}</h1>${sub?`<p class="sub">${esc(sub)}</p>`:''}</header>`;}
function wireSheet(back,focusSel){
  const b=$('sheetBack');if(b)b.addEventListener('click',(e)=>{e.preventDefault();back.go();});
  const f=(focusSel&&document.querySelector(focusSel))||$('main').querySelector('h1');if(f)f.focus({preventScroll:true});   // the drill-in says where you are
}
function sheetCantLoad(back){$('main').innerHTML=sheetBackHtml(back)+emptyCard('We couldn’t load this just now — please try again in a moment.','✋');wireSheet(back);}
// a to-do or approval page reads the project's bundle; anything but OK leaves calmly
async function sheetBundle(pid,view,back){
  const r=await api('/client/projects/'+pid);
  if(view!==VIEW_SEQ)return null;
  if(r.ok)return (r.body&&r.body.data)||{};
  if(r.offline)sheetCantLoad(back);else{toast('That isn’t here any more.');back.go();}
  return null;
}
// the website's address for the draft's strip, from the website card's read when it had one
function draftHost(){const s=wsSiteInfo(PORTAL.wstats);return s.host||'Your website';}
// which deliverables draw inline — fileIcon's own image rule
function apIsImage(title){return /\.(png|jpe?g|webp)$/i.test(String(title||''));}
// A drawn page sits in a srcdoc frame, whose links resolve against the PORTAL's
// address: a tap on the draft's own "#dds-draft-page=…" link would load the portal
// inside the frame. A base of about:srcdoc keeps those links inside the drawn page
// (its photos and fonts are full addresses, its styles inlined), and every other
// link opens a new window, which the frame's sandbox refuses: it does nothing.
function draftDoc(html){const b='<base href="about:srcdoc" target="_blank">';html=String(html).replace(/href="#dds-draft-page=/g,'target="_self" href="#dds-draft-page=');return /<head[^>]*>/i.test(html)?html.replace(/<head([^>]*)>/i,(m,a)=>'<head'+a+'>'+b):b+html;}
// the slug a "#dds-draft-page=%2Fmenu%2F" link names ('' = Home)
function draftSlugOf(h){return decodeURIComponent(String(h||'').slice(16)).replace(/^\/+|\/+$/g,'');}

// ── the website draft, drawn page by page (GET /client/approvals/:id/draft) ──
const DRAFT={aid:'',page:'',pages:[],sections:{},notes:[],notesRead:false,cache:new Map(),seq:0};
async function draftPage(aid,slug){
  const key=String(slug||'');
  if(DRAFT.aid===aid&&DRAFT.cache.has(key))return DRAFT.cache.get(key);
  const r=await api('/client/approvals/'+aid+'/draft?page='+encodeURIComponent(key));
  const d=r.ok&&r.body&&r.body.data;
  if(!d||typeof d.html!=='string')return null;
  if(DRAFT.aid===aid)DRAFT.cache.set(key,d);
  return d;
}
async function showDraftPage(view,a,slug){
  const box=$('dpic'),pages=$('dpages');if(!box||!pages)return;
  const seq=++DRAFT.seq;
  box.innerHTML='<span class="dwait">Drawing the draft…</span>';
  const d=await draftPage(a.id,slug);
  if(view!==VIEW_SEQ||seq!==DRAFT.seq)return;
  if(!d){box.innerHTML='<span class="dwait">The draft couldn’t be drawn just now. Please try again in a moment.</span>';return;}
  DRAFT.page=d.page||'';DRAFT.pages=Array.isArray(d.pages)?d.pages:[];DRAFT.sections[DRAFT.page]=Array.isArray(d.sections)?d.sections:[];
  if(!DRAFT.notesRead){DRAFT.notes=Array.isArray(d.notes)?d.notes:[];DRAFT.notesRead=true;}
  // scripts stay off (no allow-scripts): the draft can't run code, count a visit or send a form
  const f=document.createElement('iframe');
  f.setAttribute('sandbox','allow-same-origin');f.setAttribute('tabindex','-1');f.setAttribute('aria-hidden','true');f.setAttribute('referrerpolicy','no-referrer');
  f.title='Picture of the draft';f.srcdoc=draftDoc(d.html);
  box.innerHTML='';box.appendChild(f);
  box.style.setProperty('--dk',String((box.clientWidth||345)/1280));
  pages.innerHTML=(DRAFT.pages.length>1?DRAFT.pages.map(p=>`<button type="button" data-dpage="${esc(p.slug)}" aria-pressed="${p.slug===DRAFT.page?'true':'false'}">${esc(p.title)}</button>`).join(''):'')+
    `<button type="button" class="dfullbtn" id="dfullopen">Full screen ↗</button>`;
  pages.querySelectorAll('[data-dpage]').forEach(b=>b.addEventListener('click',()=>showDraftPage(view,a,b.getAttribute('data-dpage'))));
  $('dfullopen').addEventListener('click',(e)=>openDraftFull(a,e.currentTarget));
  paintNotePicker();paintDraftNotes();
}
// Full screen: the page at its own size in an overlay. Links between the draft's
// pages come back as #dds-draft-page=<path> (routes/client_drafts.ts DRAFT_NAV);
// a click on one turns the page here, and any other link goes nowhere.
function openDraftFull(a,from){
  const opener=from||document.activeElement;   // Safari doesn't focus a button on a tap: the button is handed in
  let ov=$('dfull');
  if(!ov){ov=document.createElement('div');ov.id='dfull';ov.className='dfull';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');document.body.appendChild(ov);}
  ov.setAttribute('aria-label',(a.title||'Your website draft')+', full screen');
  ov.hidden=false;document.documentElement.style.overflow='hidden';
  let watch=0;   // WebKit runs no outside click handler in a scripts-off frame: a page link shows up as the frame's own address instead
  const close=()=>{clearInterval(watch);ov.hidden=true;ov.innerHTML='';document.documentElement.style.overflow='';document.removeEventListener('keydown',onKey);if(opener&&opener.focus&&document.contains(opener))opener.focus();};
  const onKey=(e)=>{if(e.key==='Escape'){e.preventDefault();close();}};
  document.addEventListener('keydown',onKey);
  let seq=0;   // a slow page read must never draw over a page picked after it
  const go=(slug)=>{if(DRAFT.pages.some(x=>x.slug===slug))paint(slug);};
  const paint=async(slug)=>{
    const my=++seq;clearInterval(watch);
    ov.innerHTML=`<div class="dfullbar"><span class="dfname">${esc(a.title||'Your website draft')}</span>`+
      (DRAFT.pages.length>1?DRAFT.pages.map(p=>`<button type="button" data-fpage="${esc(p.slug)}" aria-pressed="${p.slug===slug?'true':'false'}">${esc(p.title)}</button>`).join(''):'')+
      `<button type="button" id="dfullclose">Close</button></div><iframe title="The draft, ${esc((DRAFT.pages.find(p=>p.slug===slug)||{}).title||'Home')}" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe>`;
    $('dfullclose').addEventListener('click',close);
    ov.querySelectorAll('[data-fpage]').forEach(b=>b.addEventListener('click',()=>paint(b.getAttribute('data-fpage'))));
    $('dfullclose').focus();
    const d=await draftPage(a.id,slug);
    const f=ov.querySelector('iframe');if(!f||ov.hidden||my!==seq)return;
    if(!d){f.srcdoc='<p style="font:15px system-ui;padding:24px;color:#6b6478">This page couldn’t be drawn just now.</p>';return;}
    // the frame first loads about:blank, then the drawn page: hook the drawn page's own document, once
    const hook=()=>{try{
      const doc=f.contentDocument;if(!doc||doc.URL!=='about:srcdoc'||doc.ddsHooked)return;doc.ddsHooked=true;
      doc.addEventListener('click',(e)=>{
        const l=e.target&&e.target.closest?e.target.closest('a'):null;if(!l)return;
        e.preventDefault();
        const h=l.getAttribute('href')||'';
        if(h.indexOf('#dds-draft-page=')===0)go(draftSlugOf(h));
      });
    }catch(_){}};
    f.addEventListener('load',hook);
    f.srcdoc=draftDoc(d.html);
    watch=setInterval(()=>{try{const h=(f.contentWindow&&f.contentWindow.location.hash)||'';if(h.indexOf('#dds-draft-page=')===0){clearInterval(watch);go(draftSlugOf(h));}}catch(_){}},200);
  };
  paint(DRAFT.page);
}
function paintNotePicker(){
  const sel=$('npart');if(!sel)return;
  const page=DRAFT.pages.find(p=>p.slug===DRAFT.page)||{title:'Home'};
  sel.innerHTML=`<option value="">The whole page (${esc(page.title)})</option>`+(DRAFT.sections[DRAFT.page]||[]).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
}
function paintDraftNotes(){
  const host=$('draftnotes'),list=$('notelist');if(!host||!list)return;
  const ns=DRAFT.notes||[];host.hidden=!ns.length;
  const h=host.querySelector('h2');if(h)h.textContent='Your notes on this draft · '+ns.length;
  list.innerHTML=ns.map(n=>`<li><span><span class="nwhere">${esc(n.page_title||'A page')} · ${esc(n.part||'The whole page')}${n.created_at?' · '+esc(rel(n.created_at)):''}</span><span class="nbody">“${esc(n.body)}”</span></span><span class="schip${n.status==='done'?' done':''}">${n.status==='done'?'Done':'Open'}</span></li>`).join('');
}

// ── one approval, seen and answered in place ──
async function openApproval(pid,aid,from){
  if(PORTAL.persona!=='client')return goHome();
  const view=++VIEW_SEQ;   // this drill-in owns #main now — a late tab render must not clobber it
  const back=sheetBack(from);
  setWide(true);try{window.scrollTo(0,0);}catch(_){}
  $('main').innerHTML=skeleton();
  const data=await sheetBundle(pid,view,back);if(!data)return;
  const proj=data.project||{};
  const a=(data.approvals||[]).find(x=>x&&x.id===aid);
  if(!a){toast('That request isn’t here any more.');return back.go();}
  const draft=a.subject_type==='website';
  const pending=a.status==='pending';
  const f=a.subject_type==='deliverable'?((data.deliverables||[]).find(d=>d&&d.id===a.subject_id)||null):null;
  if(draft&&DRAFT.aid!==aid)Object.assign(DRAFT,{aid,page:'',pages:[],sections:{},notes:[],notesRead:false,cache:new Map()});
  const ttl=a.title||(draft?'Your website draft':'A change is ready');
  const chips=`<span class="tag">${esc(AP_KIND[a.subject_type]||'Approval')}</span><span class="sm">${draft?'Not live yet · ':''}${esc(proj.name||'')}</span>`;
  let ask=sheetHead(chips,ttl,'');
  if(a.summary)ask+=`<div class="askcard"><span class="askav" aria-hidden="true">${esc((studioBrand().charAt(0)||'S').toUpperCase())}</span><span><span class="askwho">${esc(studioBrand())} asked</span><span class="askq">“${esc(a.summary)}”</span></span></div>`;
  let thing='';
  if(draft)thing=`<div class="card draftcard"><div class="dstrip"><i></i><i></i><i></i><span>${esc(draftHost())} · draft, not live yet</span></div><div class="dpic" id="dpic"><span class="dwait">Drawing the draft…</span></div><div class="dpages" id="dpages" role="group" aria-label="Pages in the draft"></div></div>`;
  else if(f)thing=`<div class="card draftcard">${apIsImage(f.title)?`<div id="apimg" class="dpic" style="aspect-ratio:auto;min-height:120px"><span class="dwait">Fetching the picture…</span></div>`:''}<div class="frow"><span class="fico" aria-hidden="true">${fileIcon(f.title)}</span><span class="fmain"><span class="fname">${esc(f.title)}</span><span class="fmeta">Shared by ${esc(studioBrand())}${f.created_at?' · '+esc(fdate(f.created_at)):''}</span></span><button class="fbtn" data-dl="${esc(f.id)}" aria-label="Open full size — ${esc(f.title)}">Open full size</button></div></div>`;
  let answer='';
  if(a.due_date&&pending)answer+=`<p class="apdue${approvalOverdue(a)?' late':''}" style="margin-top:14px">${approvalOverdue(a)?'Overdue — your answer was due '+esc(niceDay(a.due_date))+'. Nothing moves until you decide.':'Please answer by '+esc(niceDay(a.due_date))+'.'}</p>`;
  if(pending)answer+=`<div class="apacts"><button class="approve" id="apok">Looks good — approve</button><button id="apchg" aria-expanded="false" aria-controls="apchgbox">Ask for a change</button></div>`+
    `<div class="card notecard" id="apchgbox" hidden><label class="nhead" for="apchgt">What would you like changed?</label><textarea id="apchgt" class="fieldin" rows="3" placeholder="This goes straight to ${esc(studioBrand())}."></textarea><p class="muted" style="font-size:12.5px;margin-top:8px">Nothing changes until you approve. This just tells your studio what to adjust.</p><div class="row"><button class="approve" id="apchgsend">Send request</button></div></div>`;
  else{const d=AP_DONE[a.status]||[String(a.status||'').replace(/_/g,' '),''];answer+=`<div class="card" style="margin-top:16px"><ul class="hist"><li><span class="ht">Your answer</span><span class="hs ${d[1]}">${esc(d[0])}${a.decided_at?` · ${esc(rel(a.decided_at))}`:''}</span></li></ul></div>`;}
  if(draft&&(pending||a.status==='changes_requested'))answer+=`<div class="card notecard" id="notecard"><span class="nhead">Or leave a note on one part</span><label class="nlabel" for="npart">Which part?</label><select id="npart" class="fieldin"><option value="">The whole page</option></select><textarea id="nbody" class="fieldin" rows="3" aria-label="Your note" placeholder="Tell ${esc(studioBrand())} what you’d change…"></textarea><div class="row"><button id="nsend">Send note</button></div><p class="muted" style="font-size:12.5px;margin-top:8px">Nothing goes live until you approve. Your studio sees each note pinned to that part of the draft.</p></div>`;
  if(draft)answer+=`<section id="draftnotes" hidden style="margin-top:22px"><h2>Your notes on this draft</h2><div class="card"><ul class="notelist" id="notelist"></ul></div></section>`;
  const prior=(data.approvals||[]).filter(x=>x&&x.id!==aid&&x.status==='approved'&&x.decided_at).sort((x,y)=>String(y.decided_at).localeCompare(String(x.decided_at)))[0];
  if(prior)answer+=`<p class="histline"><span aria-hidden="true">✓</span>You approved ${esc(prior.title||'a change')} · ${esc(rel(prior.decided_at))}</p>`;
  $('main').innerHTML=sheetBackHtml(back)+`<div class="sheetcols${thing?'':' solo'}"><div class="s-ask">${ask}</div>${thing?`<div class="s-thing">${thing}</div>`:''}<div class="s-answer">${answer}</div></div>`;
  wireSheet(back);
  wireDownloads($('main'));
  if(draft){
    const box=$('dpic');
    const fit=()=>{if(box&&box.clientWidth)box.style.setProperty('--dk',String(box.clientWidth/1280));};
    if(box&&'ResizeObserver' in window)new ResizeObserver(fit).observe(box);
    showDraftPage(view,a,DRAFT.page||'');
    const ns=$('nsend');

      ns.disabled=true;
      const r=await api('/client/approvals/'+aid+'/notes','POST',{page:DRAFT.page,block_id:($('npart')&&$('npart').value)||'',body:v});
      if(view!==VIEW_SEQ)return;

      if(r.ok&&r.body&&r.body.data){ta.value='';DRAFT.notes=[r.body.data].concat(DRAFT.notes||[]);paintDraftNotes();toast('Your note went to '+studioBrand()+'.');}

  // a file's picture: the same signed download Open full size uses; any failure keeps the quiet line
  if(f&&apIsImage(f.title))(async()=>{
    const rr=await api('/client/deliverables/'+f.id+'/download');
    if(view!==VIEW_SEQ)return;
    const box=$('apimg');if(!box)return;
    const url=rr.ok&&rr.body&&rr.body.data&&String(rr.body.data.url||'');
    if(!url||!/^https:\/\//.test(url)){box.innerHTML='<span class="dwait">The picture couldn’t load here. Use Open full size.</span>';return;}
    const im=new Image();im.alt=f.title||'The file';im.className='apimg';
    im.addEventListener('load',()=>{if(view===VIEW_SEQ){box.style.minHeight='';box.innerHTML='';box.appendChild(im);}});
    im.addEventListener('error',()=>{if(view===VIEW_SEQ)box.innerHTML='<span class="dwait">The picture couldn’t load here. Use Open full size.</span>';});
    im.src=url;
  })();
  if(!pending)return;
  // the decide call is the record page's exact contract: presented_hash + the 409 re-read
  const decide=async(decision,note,btn)=>{
    btn.disabled=true;
    const r=await api('/client/approvals/'+aid+'/decide','POST',{decision,presented_hash:a.content_hash||'',note:note||''});
    if(view!==VIEW_SEQ)return;
    if(r.ok){PORTAL.snaps=null;return paintApprovalDone(back,decision,draft);}
    toast((r.body&&r.body.message)||'That didn’t go through — please try again.');
    if(r.status===409){PORTAL.snaps=null;return openApproval(pid,aid,from);}   // it changed under you — re-read, never decide blind

// Several files at once, each through the ONE upload backend (upload-url → PUT →
// record), named by its own file name. Each is checked before anything is sent; a
// record step that fails for a passing reason is tried once more, since the bytes
// are already up. Returns how many went and which didn't, in words.
async function sendFilesTo(pid,files,onStep){
  let sent=0;const failed=[];
  for(let i=0;i<files.length;i++){
    const file=files[i];if(onStep)onStep(i+1,files.length,file);
    const bad=sharePreflight(file);if(bad){failed.push({name:file.name,msg:bad});continue;}
    try{
      const up=await api('/client/projects/'+pid+'/upload-url','POST',{mime:file.type||'application/octet-stream',bytes:file.size,title:file.name});
      const d=up.ok&&up.body&&up.body.data;
      if(!d||!d.upload_url){failed.push({name:file.name,msg:shareServerMsg(up.body&&up.body.message,file)||'Uploads aren’t available right now.'});continue;}
      const put=await fetch(d.upload_url,{method:'PUT',headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},body:file});
      if(!put.ok){failed.push({name:file.name,msg:'The upload didn’t finish.'});continue;}
      let rec=await api('/client/projects/'+pid+'/uploads','POST',{media_id:d.media_id,title:file.name});
      if(!rec.ok&&rec.status!==422)rec=await api('/client/projects/'+pid+'/uploads','POST',{media_id:d.media_id,title:file.name});
      if(!rec.ok){failed.push({name:file.name,msg:shareServerMsg(rec.body&&rec.body.message,file)||'Couldn’t save that file.'});continue;}
      sent++;
    }catch(_){failed.push({name:file.name,msg:'The upload didn’t finish.'});}
  }
  return {sent,failed};
}

// ── the project activity timeline (crm.html's anatomy, the client's palette) ─
// Bundle events (already filtered client-visible server-side; detail.from ===
// 'client' marks the client's own actions) merge with the real message thread
// into ONE reverse-chronological timeline. kind='message' EVENTS are skipped —
// the actual messages (with bodies) render instead. Month headers appear once
// the items span more than one month.
const PTL_ICON={message:si('message'),task:si('check'),file:si('paperclip'),approve:si('thumbsup'),note:si('pencil'),system:si('cog')};
function projEventItem(e){
  if(!e||!e.created_at||e.kind==='message')return null;
  const dd=e.detail||{};const mine=dd.from==='client';const t=dd.title?' — '+String(dd.title):'';
  if(e.kind==='approval_decided'){
    const word=dd.decision==='approved'?'approved a change':dd.decision==='changes_requested'?'requested changes':dd.decision==='rejected'?'declined a change':'decided an approval';
    return{type:'approve',title:(mine?'You ':'Someone ')+word,body:null,at:e.created_at};
  }
  const M={
    project_created:['system','Your project began'],
    status_change:['system','Project status changed'],
    task_created:['task','A to-do was added'+t],
    task_status_change:['task','A to-do moved along'+t],
    task_done:['task',(mine?'You':'Your studio')+' marked a to-do done'+t],
    milestone_created:['system','A milestone was set'+t],
    milestone_completed:['approve','Milestone complete'+t],
    deliverable_added:['file','Your studio shared a file'+t],
    client_upload:['file','You sent a file'+t],
    approval_requested:['approve','Your OK was requested'+t],
    survey_requested:['task','A survey is ready for you'],
    survey_submitted:['task',(mine?'You':'Someone')+' answered a survey'],
    support_opened:['message',(mine?'You':'Your studio')+' opened a support request'],
    support_message:['message','New reply on a support request'],
    support_resolved:['message','A support request was resolved'],
    note:['note','A note was shared with you'],
  };
  const m=M[e.kind]||['system',String(e.kind||'activity').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase())];
  return{type:m[0],title:m[1],body:null,at:e.created_at};
}
// Message attribution (F1): author_kind CANNOT tell the sides apart — both the
// studio operator and the customer resolve to principal.kind 'client' (only
// platform staff are 'staff'). The bundle's kind='message' EVENTS carry the
// authoritative side ({message_id, from:'studio'|'client'} — written by
// project_comms.ts / client_delivery.ts), so attribute through that map; the
// old author_kind heuristic remains only for messages with no matching event.
function msgFromMap(events){
  const map={};
  for(const e of (events||[])){const dd=(e&&e.kind==='message'&&e.detail)||null;if(dd&&dd.message_id&&(dd.from==='studio'||dd.from==='client'))map[dd.message_id]=dd.from;}
  return map;
}
function projMsgItem(m,fromById){
  if(!m||!m.created_at)return null;
  const from=fromById?fromById[m.id]:undefined;
  const mine=from?from==='client':!(m.author_kind==='staff'||m.author_kind==='system');
  return{type:'message',title:mine?'You sent a message':'Your studio sent a message',body:m.body||'',at:m.created_at};
}
// the shared timeline HTML (the drill-in rail + the Messages pane render the
// same anatomy inside a .tlhost): month headers once the items span more than
// one month; .ti-first/.ti-last are STAMPED here — month headers are divs too,
// so the CSS connector trims can't rely on :first-of-type/:last-of-type.
function tlItemsHtml(items){
  const monthly=new Set(items.map(i=>String(i.at).slice(0,7))).size>1;
  let html='',cur='';
  items.forEach((it,i)=>{
    if(monthly){const mk=String(it.at).slice(0,7);if(mk!==cur){cur=mk;const dt=new Date(mk+'-15T12:00:00Z');html+=`<div class="tl-month">${isNaN(dt)?esc(mk):dt.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>`;}}
    const type=PTL_ICON[it.type]?it.type:'system';
    html+=`<div class="ti t-${type}${i===0?' ti-first':''}${i===items.length-1?' ti-last':''}"><span class="ti-icon" aria-hidden="true">${PTL_ICON[type]}</span><div class="ti-main"><div class="ti-head"><span class="ti-title">${esc(it.title)}</span></div>${it.body?`<div class="ti-body">${esc(it.body)}</div>`:''}</div><span class="ti-when">${esc(rel(it.at))}</span></div>`;
  });
  return html;
}
function renderProjTimeline(){
  const host=$('ptl');if(!host)return;
  const items=[];
  const fromById=msgFromMap(PROJ_EVENTS);
  for(const e of PROJ_EVENTS){const it=projEventItem(e);if(it)items.push(it);}
  for(const m of PROJ_MSGS){const it=projMsgItem(m,fromById);if(it)items.push(it);}
  items.sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:0);
  // PS6: a FAILED messages read says so — the surviving event items still render
  // under the line, and the empty copy ("say hello") is a claim only an
  // all-sources-ok read may make. The composer below stays either way.
  const failLine=PROJ_MSGS_FAILED?`<p class="muted fload">We couldn’t load your messages just now — please try again in a moment.</p>`:'';
  if(!items.length){host.innerHTML=failLine||emptyCard('No messages yet — say hello any time.','💬');return;}
  host.innerHTML=failLine+tlItemsHtml(items);
}

async function load(){
  setWide(false);
  PORTAL.snaps=null;PORTAL.billing=null;PORTAL.billingFailed=false;PORTAL.wstats=undefined;PORTAL.wstatsFetch=null;PORTAL.wsthumb=undefined;PORTAL.wsthumbFetch=null;   // fresh per-load caches (a re-load = fresh data)
  const first=!LOADED_ONCE;LOADED_ONCE=true;
  const params=new URLSearchParams(location.search);
  // G2: the destination kept through a sign-in; an address that names its own wins
  const kept=first?takeReturn():null;
  const fromUrl=!!(params.get('support')||params.get('project'));
  const dsup=fromUrl?params.get('support'):((kept&&kept.support)||''); const deep=fromUrl?params.get('project'):((kept&&kept.project)||'');
  // item 179: "Needs your OK" emails carry the approval too — it opens in place, the project stays the fallback
  const dapr=String((fromUrl?params.get('approval'):(kept&&kept.approval))||'');
  // a tab named in the address (#invoices: the cancelled-payment page's way back), first load only
  const hashTab=first&&TAB_IDS.indexOf(String(location.hash||'').slice(1))>=0?String(location.hash).slice(1):'';
  const wantTab=hashTab||(kept&&kept.tab)||'';
  // studio audit change 9: the studio's "connect your Google" email lands here with
  // ?connect=<signed token>; a sign-in on the way stashes it (see the boot below)
  const askTok=params.get('connect')||localStorage.getItem('dds-connect-ask')||'';
  try{localStorage.removeItem('dds-connect-ask');}catch(_){}
  // item 1: back from Stripe — ?paid=<invoice id> (ids are uuids; anything else is ignored)
  const paidId=/^[0-9a-zA-Z-]{1,64}$/.test(params.get('paid')||'')?params.get('paid'):'';
  if(paidId)paidStore(paidId);
  // honor a deep link once, then drop it from the URL so any later re-load
  // (e.g. after approving something) lands on Home instead of re-opening it.
  if(fromUrl||paidId||params.get('connect')){try{history.replaceState(null,'','/client.html'+(paidId?'#invoices':location.hash));}catch(_){}}
  // Item 86: the context, the projects and the feed go out together, then a client's
  // notifications and Google ask together. Each used to wait for the one before: five round
  // trips before Home could paint, on a phone connection too.
  const skipProj=rememberedReviewer();   // G12: a reviewer's projects read is refused every time
  const [ctx,proj0,feed]=await Promise.all([api('/portal/context'),skipProj?Promise.resolve(null):api('/client/projects').catch(()=>null),api('/portal/feed')]);
  if(!ctx.ok){hideNav();trouble();return;}
  const c=ctx.body.data||{};
  // …unless the answer says they are more than a reviewer now: then the read happens after all
  const proj=(skipProj&&(c.is_managed_client||c.site_role!=='client_reviewer'))?await api('/client/projects').catch(()=>null):proj0;
  const projects=(proj&&proj.ok&&proj.body.data)||[];
  // A plain OWNER (full workspace, NOT a managed client, no delivery) — the full
  // workspace lives elsewhere. No client tabs.
  if(!projects.length && !c.is_managed_client && c.sees_full_workspace){hideNav();ownerNote();return;}
  // Everyone else is a client-facing persona: a managed client (converted customer,
  // with or without a project yet) OR an invited reviewer (feed only). Both get the
  // persistent tab nav + the cross-project Home; tabs degrade to calm empty states.
  PORTAL.ctx=c;
  rememberStudio();
  try{const fb=$('footby');if(fb)fb.textContent='by '+((c.studio&&c.studio.name)?studioBrand():'your studio');}catch(_){}
  PORTAL.persona=(projects.length||c.is_managed_client)?'client':'reviewer';
  rememberPersona(c);   // G12
  PORTAL.projects=projects;
  // A FAILED /client/projects read must never masquerade as the zero-project
  // first-run: Home renders the couldn't-load line instead of the 🚀 card and
  // the needs-you queue treats it as a failed source. A reviewer's 403
  // here is the CONTRACT (no projects of their own), not a failure — calm.
  PORTAL.projectsFailed=PORTAL.persona==='client'&&!(proj&&proj.ok);
  PORTAL.feed=(feed.ok&&feed.body.data)||{};
  PORTAL.feedFailed=!feed.ok;   // a failed feed read must never masquerade as zero approvals
  // PS3: the boot notifications GET is persona-gated — a reviewer's /client/*
  // 403 is contract (reviewerAllowed); their bell boots calm with ZERO fetches.
  const [n,a]=PORTAL.persona==='client'?await Promise.all([
    api('/client/notifications').catch(()=>null),
    api('/connections/ask'+(askTok?'?token='+encodeURIComponent(askTok):'')).catch(()=>null),   // the studio's ask to connect Google, never a blocker
  ]):[null,null];
  const nb=(n&&n.body)||{};
  PORTAL.notifsFailed=PORTAL.persona==='client'&&!(n&&n.ok);   // …nor a failed notifications read as zero messages — but a reviewer's 403 here is the CONTRACT (reviewerAllowed), not a failure: their bell stays calm
  PORTAL.notifs=(nb.data&&Array.isArray(nb.data)?nb.data:(nb.data&&nb.data.data)||[])||[];
  PORTAL.unread=nb.unread_count!=null?nb.unread_count:((nb.data&&nb.data.unread_count)||0);
  // the studio's ask to connect Google — a client persona only; never a blocker
  PORTAL.ask=null;
  if(a&&a.ok&&a.body&&a.body.data&&Array.isArray(a.body.data.providers)&&a.body.data.providers.length)PORTAL.ask=a.body.data;
  else if(a&&!a.ok&&askTok&&a.body&&a.body.message)PORTAL.askProblem=String(a.body.message);
  PORTAL.ready=true;
  showNav();
  // deep links open the relevant drill-down; the nav stays visible around it.
  // ?support= now opens the Messages tab with that thread in the reading pane.
  if(dsup){await openMessagesTo(dsup);if(PORTAL.persona==='client')api('/client/notifications/read','POST',{}).catch(()=>{});return;}   // PS3: the mark-read POST is /client/* — client persona only
  if(deep&&/^[0-9a-f-]{36}$/i.test(dapr)){await openApproval(deep,dapr);if(PORTAL.persona==='client')api('/client/notifications/read','POST',{}).catch(()=>{});return;}
  if(deep){await openProject(deep);if(PORTAL.persona==='client')api('/client/notifications/read','POST',{}).catch(()=>{});return;}
  // item 1: the just-paid invoice — from the URL (the Stripe return: open the
  // Invoices tab and say thank you) or from the ten-minute memory (a sign-in or
  // reload on the way back: the row stays Processing, quietly)
  const remembered=paidId?null:paidStored();
  if(paidId){paidBegin(paidId,Date.now());showTab('invoices');toast('Thank you — we’re confirming your payment.');return;}
  if(remembered)paidBegin(remembered.id,+remembered.at||Date.now());
  if(wantTab){if(hashTab){try{history.replaceState(null,'','/client.html'+location.search);}catch(_){}}showTab(wantTab);return;}
  showTab(CURRENT_TAB||'home');
}
// Always-available client sign-out (the shell's profile menu is owner-shaped;
// a client needs an obvious, in-view way out). Lands back on the client door.
// Shared so both the footer link and the "You & notifications" card use it.
async function doSignOut(e){if(e&&e.preventDefault)e.preventDefault();try{await sb.auth.signOut();}catch(_){}location.href='/portal.html';}
(function(){var s=$('signout');if(s)s.addEventListener('click',doSignOut);})();
(async function(){
  try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";USER=(data&&data.session&&data.session.user)||null;
    if(!TOKEN){
      // item 1: back from Stripe with no portal sign-in (a deposit paid before the
      // workspace exists, or a signed-out browser) — the branded thank-you, not a
      // sign-in wall; the id is remembered so a sign-in within ten minutes still
      // shows the row as Processing.
      const pp=new URLSearchParams(location.search).get('paid')||'';
      if(/^[0-9a-zA-Z-]{1,64}$/.test(pp)){paidStore(pp);location.replace('/payment-success.html?paid='+encodeURIComponent(pp));return;}
      // studio audit change 9: keep the studio's "connect your Google" link through the sign-in
      const ct=new URLSearchParams(location.search).get('connect')||'';
      if(ct&&ct.length<2048){try{localStorage.setItem('dds-connect-ask',ct);}catch(_){}}
      keepReturn(new URLSearchParams(location.search));   // G2: the project or request an email button was opening
      signedOut();return;
    }
    await load();
  }catch(_){trouble();}
})();
</script>
