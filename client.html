<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your updates — Studio OS</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Review and approve what your studio has ready for you.">
<style>
  :root{
    --bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;
    --p:#5b3fa0;--p-deep:#2a1b4a;--p-soft:#efeafa;--good:#3f7a5a;--good-soft:#e7f1ea;--warn:#8a6d3b;--warn-soft:#f3ead9;
    --shadow:0 1px 2px rgba(27,21,37,.04),0 8px 24px rgba(27,21,37,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38;--good:#8bbf9f;--good-soft:#1f2a24;--warn:#d3ac6e;--warn-soft:#2a2316;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
  :root[data-theme="light"]{--bg:#faf8f5;--card:#fff;--ink:#1b1525;--soft:#6b6478;--faint:#938ba3;--line:#eee9e0;--p:#5b3fa0;--p-soft:#efeafa}
  :root[data-theme="dark"]{--bg:#171320;--card:#1f1a2b;--ink:#efeaf7;--soft:#a79ebc;--faint:#7a7192;--line:#2a2338;--p:#b79ceb;--p-soft:#241d38}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding:40px 20px 90px}
  .rolebadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--p);background:var(--p-soft);border-radius:999px;padding:5px 12px;font-family:var(--sans)}
  header h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,5vw,34px);margin:16px 0 .1em;letter-spacing:-.01em}
  header .sub{color:var(--soft);font-size:15px;margin:0}
  .status{margin-top:22px;padding:14px 18px;background:var(--good-soft);border-radius:13px;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:10px}
  .status .d{width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 auto}
  section{margin-top:34px}
  h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 5px;line-height:1.2}
  .card p{margin:0;color:var(--soft);font-size:14.5px}
  .card.approve{border-left:3px solid var(--p)}
  .row{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 17px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--p);color:var(--p)} button:disabled{opacity:.5;cursor:default}
  button.approve{background:var(--p);color:#fff;border-color:var(--p)} button.approve:hover{background:var(--p-deep);color:#fff}
  .tag{display:inline-block;font-size:11px;font-family:var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--p);background:var(--p-soft);border-radius:999px;padding:3px 9px;font-weight:600;margin-bottom:9px}
  .center{text-align:center;padding:52px 20px}
  .center h2{font-family:var(--serif);font-weight:500;font-size:22px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 8px}
  .muted{color:var(--soft);font-size:14px}
  a.link{color:var(--p);text-decoration:none;font-weight:600} a.link:hover{text-decoration:underline}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script>
</head>
<body>
<div class="wrap">
  <div id="main"><div class="spin" role="status" aria-label="Loading"></div></div>
  <footer>Studio OS · by Davis Digital Studio — you see only what your studio shares with you.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// The simplified Client Portal (A7.2). Consumes ONLY /portal/context + /portal/feed
// + the approval decide routes — the reviewer boundary is enforced server-side, so
// this can never over-expose. Review-first: see shared updates, approve what's ready.
const SUPABASE_URL="https://qksstlqzbhesadrrofgn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrc3N0bHF6Ymhlc2FkcnJvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzMwMDMsImV4cCI6MjA5NzU0OTAwM30.4V94Ua7z5cntPWtvtqN24TUnfY5A6K6-zCxY0iEcgYo";
const FN=SUPABASE_URL+"/functions/v1/presence";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'dds-portal-auth',persistSession:true,autoRefreshToken:true}});
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN="";
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'x-dds-user-jwt':TOKEN,'x-dds-scope-site':(new URLSearchParams(location.search).get('client')||'')});
async function api(path,method,body){const r=await fetch(FN+path,{method:method||'GET',headers:H(),body:body?JSON.stringify(body):undefined});return{ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))};}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

// ── the reviewer feed (pre-existing owner-shared updates) ──
function renderFeed(ctx,feed){
  const moments=(feed.moments||[]); const pending=(feed.pending_approvals||[]); const pub=feed.last_published;
  const need=pending.length;
  const subtext = need ? (need===1 ? 'One thing needs your OK — no rush.' : `${need} things need your OK — no rush.`) : 'You’re all caught up — nothing needs you right now.';
  let html=`<div class="rolebadge">● Client view</div><header><h1>Your updates</h1><p class="sub">${esc(subtext)}</p></header>`;
  if(pub){const when=new Date(pub.completed_at||pub.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});html+=`<div class="status"><span class="d"></span>Your website is live — last updated ${esc(when)}.</div>`;}
  if(pending.length){html+=`<section><h2>Waiting for your OK</h2>`;for(const p of pending){html+=`<div class="card approve"><span class="tag">${esc(p.kind==='connected'?'Connected':'Change')}</span><h3>${esc(p.title||'A change is ready')}</h3><p>${esc(p.summary||'')}</p><div class="row"><button class="approve" data-approve="${esc(p.decide_path)}">Approve</button><button data-decline="${esc(p.decide_path)}">Not yet</button></div></div>`;}html+=`</section>`;}
  html+=`<section><h2>Recent updates</h2>`;
  if(!moments.length){html+=`<div class="card"><p class="muted">Nothing new to share right now — your studio will surface anything worth a look here.</p></div>`;}
  else for(const m of moments){html+=`<div class="card"><h3>${esc(m.headline)}</h3><p>${esc(m.summary)}</p></div>`;}
  html+=`</section>`;
  $('main').innerHTML=html;
  document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',()=>decideFeed(b.getAttribute('data-approve'),'approve',b)));
  document.querySelectorAll('[data-decline]').forEach(b=>b.addEventListener('click',()=>decideFeed(b.getAttribute('data-decline'),'abandon',b)));
}
async function decideFeed(path,decision,btn){btn.disabled=true;const r=await api(path,'POST',{decision});if(r.ok){toast(decision==='approve'?'Approved — thank you.':'Set aside.');return load();}toast('That didn’t go through — please try again.');btn.disabled=false;}

// ── the CLIENT App service-delivery view (Agency–Client Bridge) ──
function renderProjects(projects,unread){
  let html=`<div class="rolebadge">● Your projects</div><header><h1>Your projects</h1><p class="sub">${projects.length?'What your studio is working on with you.':'Your studio hasn’t started a project with you yet.'}${unread?` · <strong>${unread}</strong> new update${unread===1?'':'s'}`:''}</p></header><section>`;
  if(!projects.length) html+=`<div class="card"><p class="muted">When your studio starts a project, it’ll appear here with your tasks, files, and approvals.</p></div>`;
  for(const p of projects){html+=`<div class="card" role="button" tabindex="0" data-proj="${esc(p.id)}"><h3>${esc(p.name)}</h3><p>Status: ${esc((p.status||'').replace('_',' '))}${p.target_date?` · target ${esc(p.target_date)}`:''}</p></div>`;}
  html+=`</section>`;
  $('main').innerHTML=html;
  document.querySelectorAll('[data-proj]').forEach(c=>{const open=()=>openProject(c.getAttribute('data-proj'));c.addEventListener('click',open);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});});
}
// Service billing — the studio's invoices for project work, SEPARATE from the
// Studio OS software subscription. Appended below the projects; hidden if none.
async function appendBilling(){
  try{
    const r=await api('/client/billing'); if(!r.ok) return;
    const d=(r.body&&r.body.data)||{}; const inv=(d.invoices||[]);
    if(!inv.length) return;
    const row=(i)=>`<div class="card"><h3>${esc(i.name||'Invoice')}<\/h3><p>${i.amount?('Amount: '+esc(String(i.amount))+' · '):''}${esc((i.status||'').replace('_',' '))}${i.due_date?(' · due '+esc(i.due_date)):''}</p>${i.pay_url?`<p><a class="link" href="${esc(i.pay_url)}" target="_blank" rel="noopener">Pay this invoice →<\/a><\/p>`:(i.paid_at?'<p class="muted">Paid — thank you.<\/p>':'')}<\/div>`;
    const sec=document.createElement('section');
    sec.innerHTML=`<h2>Billing<\/h2><p class="muted" style="margin:-4px 0 10px">Invoices from your studio for project work. Your Studio OS subscription is billed separately.<\/p>${inv.map(row).join('')}`;
    $('main').appendChild(sec);
  }catch(_){/* billing is additive; never block the projects view */}
}
async function openProject(id){
  $('main').innerHTML='<div class="spin" role="status" aria-label="Loading"></div>';
  const [d,rep]=await Promise.all([api('/client/projects/'+id),api('/client/projects/'+id+'/report').catch(()=>null)]);
  if(!d.ok){toast('That project isn’t available.');return load();}
  const data=d.body.data||{}; const p=data.project||{}; const s=(rep&&rep.body&&rep.body.data&&rep.body.data.summary);
  let html=`<p><a class="link" href="/client.html">← Your projects</a></p><header><h1>${esc(p.name)}</h1><p class="sub">Status: ${esc((p.status||'').replace('_',' '))}</p></header>`;
  if(s) html+=`<div class="status"><span class="d"></span>${s.progress.pct}% complete · ${s.milestones.complete}/${s.milestones.total} milestones · ${s.open_client_actions} action${s.open_client_actions===1?'':'s'} for you</div>`;
  // approvals that need the client
  const aps=(data.approvals||[]).filter(a=>a.status==='pending');
  if(aps.length){html+=`<section><h2>Waiting for your OK</h2>`;for(const a of aps){html+=`<div class="card approve"><h3>${esc(a.title)}</h3><p>${esc(a.summary||'')}</p><div class="row"><button class="approve" data-adec="${esc(a.id)}" data-ah="${esc(a.content_hash)}" data-d="approved">Approve</button><button data-adec="${esc(a.id)}" data-ah="${esc(a.content_hash)}" data-d="changes_requested">Request changes</button></div></div>`;}html+=`</section>`;}
  // your tasks
  const acts=(data.tasks||[]).filter(t=>t.client_action_required);
  if(acts.length){html+=`<section><h2>Your to-dos</h2>`;for(const t of acts){html+=`<div class="card"><h3>${esc(t.title)}</h3><p>${t.derived&&t.derived.overdue?'Overdue · ':''}${esc(t.status.replace('_',' '))}</p></div>`;}html+=`</section>`;}
  // files
  if((data.deliverables||[]).length){html+=`<section><h2>Files</h2>`;for(const f of data.deliverables){html+=`<div class="card"><h3>${esc(f.title)}</h3><p>${esc(f.note||'Shared with you')}</p><div class="row"><button data-dl="${esc(f.id)}">Download</button></div></div>`;}html+=`</section>`;}
  // surveys
  if((data.surveys||[]).length){html+=`<section><h2>A quick survey</h2>`;for(const sv of data.surveys){html+=`<div class="card"><h3>${esc(sv.title)}</h3><div class="row"><a class="link" href="#" data-survey="${esc(sv.id)}">Open survey →</a></div></div>`;}html+=`</section>`;}
  // milestones
  if((data.milestones||[]).length){html+=`<section><h2>Milestones</h2>`;for(const m of data.milestones){html+=`<div class="card"><h3>${esc(m.title)}</h3><p>${m.status==='complete'?'✓ Complete':'In progress'}${m.due_date?` · due ${esc(m.due_date)}`:''}</p></div>`;}html+=`</section>`;}
  // messages
  html+=`<section><h2>Messages</h2><div id="thread"></div><div class="card"><textarea id="msg" rows="2" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px" placeholder="Message your studio…"></textarea><div class="row"><button class="approve" id="send">Send</button></div></div></section>`;
  // support
  html+=`<section><h2>Need help?</h2><div class="card"><p class="muted">Have a question for your studio? Open a support request.</p><div class="row"><button id="newSupport">Open a support request</button></div></div></section>`;
  $('main').innerHTML=html;
  document.querySelectorAll('[data-adec]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;const r=await api('/client/approvals/'+b.getAttribute('data-adec')+'/decide','POST',{decision:b.getAttribute('data-d'),presented_hash:b.getAttribute('data-ah')});if(r.ok){toast('Thank you — recorded.');openProject(id);}else{toast('That didn’t go through.');b.disabled=false;}}));
  document.querySelectorAll('[data-dl]').forEach(b=>b.addEventListener('click',async()=>{const r=await api('/client/deliverables/'+b.getAttribute('data-dl')+'/download');if(r.ok&&r.body.data&&r.body.data.url)window.open(r.body.data.url,'_blank','noopener');else toast('That file isn’t available.');}));
  document.querySelectorAll('[data-survey]').forEach(a=>a.addEventListener('click',(e)=>{e.preventDefault();openSurvey(a.getAttribute('data-survey'),id);}));
  $('newSupport').addEventListener('click',()=>openSupport(id));
  loadThread(id);
  $('send').addEventListener('click',async()=>{const v=$('msg').value.trim();if(!v)return;const r=await api('/client/projects/'+id+'/messages','POST',{body:v});if(r.ok){$('msg').value='';loadThread(id);}else toast('That didn’t send.');});
}
async function loadThread(id){const r=await api('/client/projects/'+id+'/messages');const items=((r.body&&r.body.data)||[]).slice().reverse();$('thread').innerHTML=items.length?items.map(m=>`<div class="card"><p><strong>${m.author_kind==='staff'||m.author_kind==='system'?'Your studio':'You'}:</strong> ${esc(m.body)}</p></div>`).join(''):'<p class="muted">No messages yet.</p>';}
async function openSurvey(sid,pid){
  const r=await api('/client/surveys/'+sid);
  if(!r.ok){toast('That survey isn’t available.');return;}
  const sv=r.body.data.survey||{}; const done=r.body.data.my_response&&r.body.data.my_response.status==='submitted';
  let html=`<p><a class="link" href="#" id="back">← Back to project</a></p><header><h1>${esc(sv.title||'Survey')}</h1></header><section>`;
  if(done){html+=`<div class="card"><p class="muted">Thanks — you’ve already answered this survey.</p></div></section>`;$('main').innerHTML=html;$('back').addEventListener('click',(e)=>{e.preventDefault();openProject(pid);});return;}
  for(const q of (sv.questions||[])){const kind=q.type==='rating'?'number':'text';html+=`<div class="card"><label style="display:block;font-weight:600;margin-bottom:6px">${esc(q.label)}</label>${q.type==='choice'?`<select data-q="${esc(q.key)}" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px">${(q.choices||[]).map(c=>`<option>${esc(c)}</option>`).join('')}</select>`:`<input data-q="${esc(q.key)}" type="${kind}" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px">`}</div>`;}
  html+=`<div class="row"><button class="approve" id="subSurvey">Submit</button></div></section>`;
  $('main').innerHTML=html;
  $('back').addEventListener('click',(e)=>{e.preventDefault();openProject(pid);});
  $('subSurvey').addEventListener('click',async()=>{const answers={};document.querySelectorAll('[data-q]').forEach(el=>{answers[el.getAttribute('data-q')]=el.value;});const rr=await api('/client/surveys/'+sid+'/respond','POST',{answers});if(rr.ok){toast('Thank you!');openProject(pid);}else toast('That didn’t submit.');});
}
async function openSupport(pid){
  let html=`<p><a class="link" href="#" id="back">← Back to project</a></p><header><h1>Open a support request</h1></header><section><div class="card"><label style="display:block;font-weight:600;margin-bottom:6px">Subject</label><input id="sup-subj" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px"><label style="display:block;font-weight:600;margin:12px 0 6px">What do you need?</label><textarea id="sup-body" rows="3" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px"></textarea><div class="row"><button class="approve" id="sup-send">Send</button></div></div></section>`;
  $('main').innerHTML=html;
  $('back').addEventListener('click',(e)=>{e.preventDefault();openProject(pid);});
  $('sup-send').addEventListener('click',async()=>{const subject=$('sup-subj').value.trim();if(!subject){toast('Add a subject.');return;}const r=await api('/client/support','POST',{subject,body:$('sup-body').value.trim(),project_id:pid});if(r.ok){toast('Sent — your studio will get back to you.');openProject(pid);}else toast('That didn’t send.');});
}

function signedOut(){$('main').innerHTML=`<div class="center"><h2>Sign in to see your updates.</h2><p style="margin-top:20px"><a class="link" href="/portal.html">Sign in →</a></p></div>`;}
function trouble(){$('main').innerHTML=`<div class="center"><h2>We couldn’t load your updates just now.</h2><p class="muted">Please refresh in a moment.</p></div>`;}
function ownerNote(){$('main').innerHTML=`<div class="center"><div class="rolebadge">● Full access</div><h2 style="margin-top:14px">This is the client view.</h2><p class="muted">You have the full workspace.</p><p style="margin-top:20px"><a class="link" href="/presence.html">Open your workspace →</a></p></div>`;}

async function load(){
  const deep=new URLSearchParams(location.search).get('project'); if(deep){await openProject(deep);api('/client/notifications/read','POST',{});return;}
  const ctx=await api('/portal/context');
  if(!ctx.ok){trouble();return;}
  const c=ctx.body.data||{};
  // Agency–Client Bridge: does this customer have linked delivery? If so, that IS their home.
  const proj=await api('/client/projects');
  const projects=(proj.ok&&proj.body.data)||[];
  if(projects.length){const n=await api('/client/notifications').catch(()=>null);renderProjects(projects,(n&&n.body&&n.body.data&&n.body.unread_count)||(n&&n.body&&n.body.unread_count)||0);appendBilling();api('/client/notifications/read','POST',{});return;}
  if(c.sees_full_workspace){ownerNote();return;}     // owner with no linked delivery
  const feed=await api('/portal/feed');
  if(!feed.ok){trouble();return;}
  renderFeed(c,feed.body.data||{});
}
(async function(){
  try{const{data}=await sb.auth.getSession();TOKEN=(data&&data.session&&data.session.access_token)||"";
    if(!TOKEN){signedOut();return;}await load();
  }catch(_){trouble();}
})();
</script>
</body>
</html>
